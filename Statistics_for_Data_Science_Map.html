<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Statistics for Data Science Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;0,800;1,400&family=STIX+Two+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --paper:#EDF0EB; --paper2:#F6F8F5; --grid:rgba(30,45,38,.065);
  --ink:#1B2420; --ink2:#3C4842; --muted:#64716B; --card:#FFFFFF; --line:#CDD5CF; --wire:#8F9D96;
  --basic:#2B7A4B; --basic-bg:#E5F1E9;
  --inter:#2659A9; --inter-bg:#E4ECF8;
  --adv:#743FA1; --adv-bg:#EFE7F6;
  --dec:#9A6B00; --dec-bg:#FBF0D6; --dec-line:#E2B33E;
  --entry-bg:#1F2E28; --entry-ink:#F1F5F2; --entry-muted:#B6C4BD;
  --walk:#0E7471; --walk-bg:#E0F1F0;
  --focus:#2659A9; --hl:#E2B33E;
  --note-bg:#FFF4C2; --note-line:#B08300; --note-ink:#3A3000; --catch:#A8323E; --catch-bg:#FBEAEC;
  --shadow:0 1px 0 rgba(20,30,25,.06), 0 2px 8px rgba(20,30,25,.06);
  --v1:#2659A9; --v2:#C2611A; --v3:#0E7471; --v4:#743FA1; --vr:#B3343F;
  --math:"STIX Two Text","Cambria Math",Cambria,Georgia,serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121715; --paper2:#171D1A; --grid:rgba(220,235,228,.045);
    --ink:#E3E9E5; --ink2:#C3CDC8; --muted:#95A39C; --card:#1B2220; --line:#2F3A35; --wire:#5F6E67;
    --basic:#6FC391; --basic-bg:#17271E; --inter:#86AEF0; --inter-bg:#172235;
    --adv:#BD92E2; --adv-bg:#251B2F; --dec:#E6B850; --dec-bg:#2A2313; --dec-line:#8C6C1E;
    --entry-bg:#2C3D36; --entry-ink:#EEF4F0; --entry-muted:#A9BAB2;
    --walk:#5CC7C2; --walk-bg:#13292A; --focus:#86AEF0; --hl:#E6B850;
    --note-bg:#2E2810; --note-line:#E6B850; --note-ink:#F3E7BE; --catch:#F08C97; --catch-bg:#2E1A1D;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.25);
    --v1:#86AEF0; --v2:#F0A15E; --v3:#5CC7C2; --v4:#BD92E2; --vr:#F08C97;
  }
}
:root[data-theme="dark"]{
    --paper:#121715; --paper2:#171D1A; --grid:rgba(220,235,228,.045);
    --ink:#E3E9E5; --ink2:#C3CDC8; --muted:#95A39C; --card:#1B2220; --line:#2F3A35; --wire:#5F6E67;
    --basic:#6FC391; --basic-bg:#17271E; --inter:#86AEF0; --inter-bg:#172235;
    --adv:#BD92E2; --adv-bg:#251B2F; --dec:#E6B850; --dec-bg:#2A2313; --dec-line:#8C6C1E;
    --entry-bg:#2C3D36; --entry-ink:#EEF4F0; --entry-muted:#A9BAB2;
    --walk:#5CC7C2; --walk-bg:#13292A; --focus:#86AEF0; --hl:#E6B850;
    --note-bg:#2E2810; --note-line:#E6B850; --note-ink:#F3E7BE; --catch:#F08C97; --catch-bg:#2E1A1D;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.25);
    --v1:#86AEF0; --v2:#F0A15E; --v3:#5CC7C2; --v4:#BD92E2; --vr:#F08C97;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

/* ---------- top bar */
.bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 14px;
  background:var(--paper2);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand h1{margin:0;font-size:19px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.grp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
.grp button{border:0;background:none;padding:5px 9px;cursor:pointer;font-size:13px;white-space:nowrap}
.grp button+button{border-left:1px solid var(--line)}
.grp button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.grp .lbl{padding:5px 3px 5px 9px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover,.grp button:hover:not([aria-pressed="true"]){background:var(--paper)}
.zoomv{min-width:46px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);padding:0 4px}
select.btn{padding-right:6px;max-width:170px}
.search{position:relative}
.search input{width:210px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px}
.results{position:absolute;top:calc(100% + 4px);left:0;width:min(420px,92vw);max-height:60vh;overflow:auto;background:var(--card);
  border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:none;z-index:20}
.results.on{display:block}
.res{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:7px;cursor:pointer}
.res[aria-selected="true"],.res:hover{background:var(--paper)}
.res .dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--c)}
.res b{display:block;font-weight:700;font-size:13.5px}
.res small{display:block;color:var(--muted);font-size:12px}
.res-empty{padding:10px;color:var(--muted);font-size:13px}
body.outline .mapOnly{display:none}

/* ---------- canvas */
#vp{flex:1;min-height:0;overflow:auto;position:relative;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:local;overscroll-behavior:contain}
#vp.drag{cursor:grabbing;user-select:none}
#sizer{position:relative}
#content{position:absolute;left:0;top:0;transform-origin:0 0;padding:60px 70vw 50vh 40px;width:max-content}
#wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#wires path{fill:none;stroke:var(--wire);stroke-width:1.4}
#wires path.d{stroke-dasharray:5 4;opacity:.85}
#wires .ah{fill:var(--wire)}

.subtree{display:flex;align-items:center}
.kids{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-left:46px}
.subtree.closed>.kids{display:none}
.branch{display:flex;align-items:center}
.elabel{max-width:188px;margin-right:22px;padding:4px 9px 5px;font-size:12px;line-height:1.3;color:var(--ink2);
  background:var(--paper2);border:1px solid var(--line);border-radius:10px}
.elabel b{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:2px}
.elabel.dash{border-style:dashed}
.elabel{padding:0}
.ehead{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 9px 5px;cursor:pointer;border-radius:9px;line-height:1.3}
.ehead:hover{background:var(--card)}
.ehead b{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:2px}
.emark{display:inline-block;margin-left:5px;min-width:15px;height:15px;line-height:13px;text-align:center;border:1px solid var(--line);border-radius:50%;font-size:11px;font-weight:700;color:var(--muted);vertical-align:1px}
.elabel.eopen{width:310px;max-width:310px;background:var(--card);border-color:var(--ink2);box-shadow:var(--shadow);--c:var(--ink)}
.edet{padding:0 10px 10px;font-size:12.5px;line-height:1.48;color:var(--ink);border-top:1px solid var(--line)}
.edet h5{margin:8px 0 2px;font-size:11.5px;font-weight:800;color:var(--muted)}
.edet p{margin:0}
.edet .eft{margin-top:7px}
.edet .ewk{margin-top:3px}
.elabel.st{color:var(--muted);font-style:italic;border-color:transparent;background:transparent;padding:2px 0}

/* ---------- cards */
.card{position:relative;width:280px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:9px;box-shadow:var(--shadow);--c:var(--wire);--cbg:var(--paper2);transition:width .18s ease}
.card.dopen{width:430px}
.k-B{--c:var(--basic);--cbg:var(--basic-bg)} .k-I{--c:var(--inter);--cbg:var(--inter-bg)} .k-A{--c:var(--adv);--cbg:var(--adv-bg)}
.k-Q{--c:var(--dec);--cbg:var(--dec-bg);background:var(--dec-bg);border-color:var(--dec-line);border-left-color:var(--dec)}
.k-S,.k-root{--c:var(--entry-ink);background:var(--entry-bg);border-color:var(--entry-bg);color:var(--entry-ink)}
.k-root{width:300px}.k-root.dopen{width:430px}
.k-guide{--c:var(--muted)} .k-walk,.k-step{--c:var(--walk);--cbg:var(--walk-bg)} .k-note{--c:var(--dec);background:var(--dec-bg)}
.card.link{background:transparent;border:1.5px dashed var(--wire);border-left:4px solid var(--c);box-shadow:none}
.card.link.k-S{--c:var(--ink);color:var(--ink);border-color:var(--wire);border-left-color:var(--ink)}
.card.link.k-S .tagrow .sec,.card.link.k-S .ex,.card.link.k-S .blk h4{color:var(--muted)}
.card.link.k-S .details{border-top-color:var(--line)}
.card.link.k-S .acts button{background:var(--card);color:var(--ink);border-color:var(--line)}
.head{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px 6px;cursor:pointer;border-radius:8px}
.tagrow{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;line-height:1.2;color:var(--c);font-weight:700}
.tagrow .sec{color:var(--muted);font-weight:600}
.k-S .tagrow .sec,.k-root .tagrow .sec{color:var(--entry-muted)}
.secname{display:block;font-size:12.5px;font-weight:700;color:var(--entry-muted);margin-top:5px;line-height:1.3}
.title{display:block;font-size:14.5px;font-weight:700;line-height:1.28;margin-top:4px}
.k-root .title{font-size:19px;font-weight:800;letter-spacing:-.01em}
.ex{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.k-S .ex,.k-root .ex{color:var(--entry-muted)}
.acts{display:flex;flex-wrap:wrap;gap:5px;padding:2px 10px 9px}
.acts button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:3px 7px;font-size:11.5px;cursor:pointer}
.acts button:hover{border-color:var(--c)}
.k-S .acts button,.k-root .acts button{background:transparent;color:var(--entry-ink);border-color:rgba(255,255,255,.25)}
.k-Q .acts button{background:transparent}
.acts .open{font-weight:700}
.kc{position:absolute;right:-12px;top:50%;transform:translateY(-50%);min-width:23px;height:23px;padding:0 5px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);border:1.5px solid var(--wire);
  font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;pointer-events:none;z-index:1}
.k-S .kc,.k-root .kc{background:var(--entry-bg);color:var(--entry-ink);border-color:var(--entry-muted)}
.k-Q .kc{background:var(--dec-bg);border-color:var(--dec-line)}
.head:hover .title{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}

.details{border-top:1px solid var(--line);padding:8px 12px 12px;font-size:13px;line-height:1.5}
.k-S .details,.k-root .details{border-top-color:rgba(255,255,255,.18)}
.blk{margin-top:9px}
.blk:first-child{margin-top:2px}
.blk h4{margin:0 0 3px;font-size:11.5px;font-weight:800;color:var(--c);letter-spacing:.01em}
.k-S .blk h4,.k-root .blk h4{color:var(--entry-muted)}
.blk p{margin:0}
.scn{font-style:italic;color:var(--ink2)}
.k-S .scn{color:var(--entry-ink)}
.item{padding:6px 0 7px;border-top:1px dashed var(--line)}
.item:first-of-type{border-top:0;padding-top:2px}
.jump{color:var(--c);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.k-S .jump,.k-root .jump{color:var(--entry-ink)}
.eid{font-weight:800;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.stats div{background:rgba(255,255,255,.08);border-radius:7px;padding:6px 7px}
.stats b{display:block;font-size:18px;line-height:1.1;font-weight:800}
.stats span{font-size:11.5px;color:var(--entry-muted)}
.lg{display:flex;align-items:center;gap:8px;margin-top:5px}
.sw{flex:none;width:28px;height:16px;border-radius:4px;border:1px solid var(--line);border-left:4px solid var(--s);background:var(--b)}
.mrow{display:flex;gap:8px;align-items:baseline}
.mrow .pp{flex:none;font-weight:800;font-variant-numeric:tabular-nums;min-width:66px}
.gobtn{margin-top:8px;border:1px solid var(--c);background:var(--cbg);color:var(--ink);border-radius:7px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer}

.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--hl)}20%{box-shadow:0 0 0 6px var(--hl)}100%{box-shadow:0 0 0 0 transparent}}

/* dimming for study passes */
body[data-pass="B"] .card.k-I, body[data-pass="B"] .card.k-A, body[data-pass="BI"] .card.k-A,
body[data-pass="N"] .card.k-B:not(.nt), body[data-pass="N"] .card.k-I:not(.nt), body[data-pass="N"] .card.k-A:not(.nt){opacity:.3}
.elabel.flash{animation:flash 1.6s ease-out}
body[data-pass="B"] .card.k-I:hover, body[data-pass="B"] .card.k-A:hover, body[data-pass="BI"] .card.k-A:hover,
body[data-pass="N"] .card:not(.nt):hover{opacity:.75}

/* legend */
.legend{position:absolute;left:12px;bottom:12px;z-index:4;display:flex;flex-wrap:wrap;gap:6px 12px;max-width:calc(100% - 24px);
  background:var(--paper2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px;color:var(--ink2);box-shadow:var(--shadow)}
.legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--b);border:1px solid var(--line);border-left:3px solid var(--s)}
.legend .x{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 0 0 4px;font-size:13px}
.wrap{flex:1;min-height:0;position:relative;display:flex}


.sticky{margin-top:10px;padding:8px 10px 9px;background:var(--note-bg);border-left:3px solid var(--note-line);border-radius:4px 8px 8px 4px;color:var(--note-ink)}
.sticky h4{margin:0 0 2px;font-size:11.5px;font-weight:800;color:var(--note-line)!important}
.sticky p{margin:0;font-weight:600}
.catch{margin-top:8px;padding:6px 9px 7px;border-radius:6px;background:var(--catch-bg);border-left:3px solid var(--catch)}
.catch h5{margin:0 0 2px!important;color:var(--catch)!important}
.like{font-style:italic;color:var(--ink2)}
.k-S .like{color:var(--entry-ink)}
.ex.hint{font-style:italic}
.ehead{display:flex;align-items:baseline;gap:6px}
.enum{flex:none;font-size:10.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.etxt{flex:1;font-weight:600;color:var(--ink)}
.emark{flex:none}
.edet .efrom{margin-top:9px;font-size:11.5px;color:var(--muted)}
.edet .eft{font-weight:700}
.k-S .sticky,.k-root .sticky{color:var(--note-ink)}


.full{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;font-style:italic}
.k-S .full{color:var(--entry-muted)}
.fullv{font-weight:700}
.sibs{display:flex;flex-direction:column;gap:3px}
.sib{margin:0}

/* ---------- outline view (also used on phones) */
body.outline #sizer{width:auto!important;height:auto!important}
body.outline #content{position:static;transform:none!important;width:auto;padding:16px 14px 90px}
body.outline #wires{display:none}
body.outline .subtree{flex-direction:column;align-items:stretch}
body.outline .kids{padding-left:14px;margin-left:12px;border-left:2px solid var(--line);gap:10px;padding-top:10px}
body.outline .branch{flex-direction:column;align-items:stretch}
body.outline .elabel{max-width:none;margin:0 0 5px;align-self:flex-start}
body.outline .elabel.eopen{width:auto;max-width:720px;align-self:stretch}
body.outline .kc{top:9px;right:9px;transform:none}
body.outline .tagrow .sec{margin-right:30px}
body.outline .card,body.outline .card.dopen,body.outline .k-root{width:auto;max-width:720px}
@media (max-width:760px){
  .bar{padding:8px 10px;gap:7px}
  .brand h1{font-size:17px}
  .brand p{display:none}
  .search{flex:1 1 100%} .search input{width:100%}
  .ctrls{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:3px;scrollbar-width:none}
  .ctrls::-webkit-scrollbar{display:none}
  .ctrls>*{flex:none}
  .grp .lbl{display:none}
  .legend{display:none}
  body.outline .kids{padding-left:6px;margin-left:3px;border-left-width:1.5px;gap:8px;padding-top:8px}
  body.outline #content{padding:12px 8px 90px}
  .head{padding:8px 10px 5px} .acts{padding:2px 8px 8px} .details{padding:8px 10px 11px}
}
@media (prefers-reduced-motion:reduce){
  .card{transition:none}
  .flash{animation:none;outline:3px solid var(--hl);outline-offset:2px}
}

/* ---------- statistics additions */
.ntc{display:inline-block;margin-left:6px;padding:0 6px;border-radius:9px;background:var(--note-bg);color:var(--note-ink);
  border:1px solid var(--note-line);font-weight:700;font-size:10.5px;line-height:15px;vertical-align:1px}
.legend .ntc{margin:0}
.lg .ntc{margin-left:0}
.fm{font-family:var(--math);font-size:15px;line-height:1.5;background:var(--paper2);border:1px solid var(--line);border-radius:7px;
  padding:6px 9px;overflow-x:auto;white-space:pre-wrap;color:var(--ink)}
pre.py{margin:0;background:var(--paper2);border:1px solid var(--line);border-radius:7px;padding:6px 9px;overflow-x:auto;
  font:12px/1.45 var(--mono);white-space:pre;color:var(--ink)}
.iq{background:var(--walk-bg);border-left:3px solid var(--walk);border-radius:4px 8px 8px 4px;padding:6px 9px}
.iq p{margin:0}.iq .iqq{font-weight:700;margin-bottom:3px}
.sibs .sib{font-size:12.5px;color:var(--ink2)}
.vwrap{margin:2px 0 4px}
body.outline .subtree,body.outline .branch,body.outline .kids,body.outline .card,body.outline .details,body.outline .blk{min-width:0;max-width:100%}
.details{min-width:0}
/* plots */
.viz{max-width:560px}
.viz svg{display:block;width:100%;height:auto;overflow:visible;font-family:var(--font)}
.viz .ax{stroke:var(--wire);stroke-width:1;fill:none}
.viz .gr{stroke:var(--line);stroke-width:.7;stroke-dasharray:2 3}
.viz .tk{fill:var(--muted);font-size:10px}
.viz .lb{fill:var(--ink);font-size:10.5px;font-weight:700}
.viz .lt{fill:var(--ink2);font-size:10.5px}
.viz .lw{fill:var(--paper);font-size:10.5px;font-weight:700}
.viz .s1,.viz .s2,.viz .s3,.viz .s4,.viz .sd{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.viz .s1{stroke:var(--v1)}.viz .s2{stroke:var(--v2)}.viz .s3{stroke:var(--v3)}.viz .s4{stroke:var(--v4)}
.viz .sd{stroke:var(--muted);stroke-width:1.4;stroke-dasharray:4 3}

":"Index = P / 100 × (n + 1)","eg":"25th percentile of the 20 values above: 0.25 × 21 = 5.25 → between the 5th and 6th values → 5.","nt":1},"quartile":{"k":"B","t":"Quartiles","s":"Q1 = 25th percentile, Q2 = median, Q3 = 75th percentile.","p":"C2","x":"Software uses different interpolation rules, so hand and NumPy answers can differ slightly","v":["nrm",{"sh":[[-4,-0.674,"a"],[-0.674,0,"b"],[0,0.674,"c"],[0.674,4,"d"]],"vl":[[-0.674,"Q1"],[0,"Q2"],[0.674,"Q3"]],"cap":"Each band holds 25% of the area"}],"nt":1},"fivenum":{"k":"B","t":"Five-number summary","s":"Min, Q1, median, Q3, max: the numbers a box plot draws.","p":"C2","eg":"{1, 2, 2, 2, 3, 3, 4, 5, 5, 5, 6, 6, 6, 6, 7, 8, 8, 9, 27}: Q1 = 3, median = 5, Q3 = 7; 27 is an outlier, so min = 1, max = 9.","py":"df['col'].describe()","v":["box",{"d":[1,2,2,2,3,3,4,5,5,5,6,6,6,6,7,8,8,9,27],"q":[3,5,7]}],"nt":1},"iqr":{"k":"B","t":"Interquartile range (IQR)","s":"The distance between the third and first quartiles.","p":"C2","fm":"IQR = Q3 − Q1","eg":"Q1 = 3, Q3 = 7 → IQR = 4.","py":"q1, q3 = np.percentile(x, [25, 75]); iqr = q3 - q1","iq":["What is the IQR and why is it useful?","IQR = Q3 − Q1, the spread of the middle 50%. It isn't affected by extreme values, so it is good for describing spread and flagging outliers."],"nt":1},"fences":{"k":"B","t":"Outlier fences (1.5 × IQR rule)","s":"Lower fence = Q1 − 1.5 × IQR; upper fence = Q3 + 1.5 × IQR.","p":"C2","eg":"Q1 = 3, Q3 = 7, IQR = 4 → fences −3 and 13, so 27 is removed as an outlier.","py":"mask = (x < q1 - 1.5*iqr) | (x > q3 + 1.5*iqr)","v":["box",{"d":[1,2,2,2,3,3,4,5,5,5,6,6,6,6,7,8,8,9,27],"q":[3,5,7],"fence":1}],"nt":1},"shape":{"k":"I","t":"Shape of a distribution","s":"Described by skewness (asymmetry) and kurtosis (tail heaviness).","p":"C2"},"skew":{"k":"I","t":"Skewness","s":"Positive skew: long right tail. Negative skew: long left tail. Zero: symmetric.","p":"C2","fm":"g₁ = [Σ(xᵢ − x̄)³ / n] / s³","py":"scipy.stats.skew(x)    # df['col'].skew()","v":["sk ion counting pairs that agree in order.","p":"C9","py":"stats.kendalltau(x, y)"},"catassoc":{"k":"I","t":"Cramér's V (categorical association)","s":"Strength of association between two nominal variables.","p":"C9","fm":"V = √(χ² / (n · (min(r, c) − 1)))"},"pointbis":{"k":"A","t":"Point-biserial correlation","s":"Correlation between a dichotomous and a continuous variable.","p":"C9","py":"stats.pointbiserialr(binary, numeric)"},"causation":{"k":"B","t":"Correlation vs causation","s":"Correlation means two variables move together; causation means changing one changes the other.","p":"C9","eg":"Ice-cream sales and drowning incidents both rise with temperature; ice cream doesn't cause drowning.","v":["dag",{}],"iq":["What is the difference between correlation and causation?","Correlation is a mutual relationship; causation means one variable's change produces a change in the other. A lurking variable such as temperature can create correlation without causation."],"nt":1},"confounder":{"k":"I","t":"Confounding variable","s":"A variable related to both the cause and the outcome.","p":"C9","eg":"Temperature drives both ice-cream sales and swimming (and so drownings)."},"simpson":{"k":"I","t":"Simpson's paradox","s":"A relationship seen in every group reverses or disappears when the groups are combined.","p":"C9","eg":"A treatment looks worse overall but better in every hospital, because it's given more often to severe cases.","v":["simpson",{}],"iq":["Explain Simpson's paradox.","A trend in several groups reverses or disappears when the groups are combined, usually because of a confounding variable. Always check relevant subgroups."],"nt":1},"spurious":{"k":"I","t":"Spurious correlation","s":"A correlation with no meaningful connection.","p":"C9","eg":"Two series that both trend upward over 10 years will correlate highly.","v":["ts",{"m":"two"}]},"multicol":{"k":"I","t":"Multicollinearity","s":"Strong linear relationships among input features.","p":"C9","x":"Predictions ma
