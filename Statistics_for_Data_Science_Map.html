/* skewed shapes with mean / median / mode */
function shapeF(m){ if (m==="sym") return x=>npdf(x,3,1); const g=x=>PDF.gamma(x,2.2,1); return m==="right"?g:(x=>g(8-x)); }
function shapeStats(f,lo,hi){ const N=800, dx=(hi-lo)/N; let tot=0, mu=0, mode=lo, fm=0; const cum=[];
  for (let i=0;i<=N;i++){ const x=lo+i*dx, v=f(x); tot+=v*dx; mu+=x*v*dx; cum.push(tot); if (v>fm){ fm=v; mode=x; } }
  let med=lo; for (let i=0;i<=N;i++) if (cum[i]>=tot/2){ med=lo+i*dx; break; } return {mean:mu/tot, med, mode}; }
V.skew = function(p){
  const f=shapeF(p.m), lo=0, hi=8, st=shapeStats(f,lo,hi);
  const P=Plot({x:[lo,hi],y:[0,0.44],h:160,m:[40,12,14,12]}); P.area(f,lo,hi,"fb"); P.curve(f,lo,hi,"s1"); P.xax([],null);
  if (p.m==="sym"){ P.vl(st.mean,"vl","mean = median = mode"); return box(P.svg(),"Symmetric: all three measures coincide."); }
  const order=[["mode",st.mode],["median",st.med],["mean",st.mean]]; order.forEach(([l,v],i)=>P.vl(v,i===2?"vl":"vl2",l+" "+fmt(v,1),i));
  return box(P.svg(), p.m==="right"?"Right skew: mode < median < mean. The tail drags the mean furthest.":"Left skew: mean < median < mode.");
};

    const P=Plot({w:W,h:120,x:[0,8],y:[0,0.44],m:[20,W-(i+1)*pw+6,14,i*pw+6]}); P.area(f,0,8,"fb"); P.curve(f,0,8,"s1"); P.add(`<line class="ax" x1="${P.L}" x2="${P.R}" y1="${P.B}" y2="${P.B}"/>`);
    P.ln(st.mean,0,st.mean,0.4,"vl"); P.ln(st.med,0,st.med,0.4,"vl2"); s+=P.inner()+T((P.L+P.R)/2,12,l,"lb"); });

/* kurtosis */
V.kurt = function(){
  const xs=[]; for (let i=0;i<=400;i++) xs.push(-5+i*0.025);
  const mk=g=>{ const v=xs.map(g); let a=0,b=0; v.forEach((y,i)=>{ a+=y*0.025; b+=xs[i]*xs[i]*y*0.025; }); const s=Math.sqrt(b/a); return x=>g(x*s)*s/a; };
  const lep=mk(x=>Math.exp(-Math.abs(x))), mes=mk(x=>Math.exp(-x*x/2)), pla=mk(x=>Math.exp(-Math.pow(Math.abs(x),4)));
  const P=Plot({x:[-4.5,4.5],y:[0,0.75],h:170,m:[12,12,24,12]}); P.curve(pla,-4.5,4.5,"s3"); P.curve(mes,-4.5,4.5,"s1"); P.curve(lep,-4.5,4.5,"s2"); P.xax();
  P.legend([["s2","leptokurtic (heavy tails)"],["s1","mesokurtic (normal)"],["s3","platykurtic (light tails)"]],P.R-150);
  return box(P.svg(),"All three have variance 1; they differ in peak sharpness and how much mass sits in the tails.");
};

/* interaction plot */
V.ixn = function(p){
  const men=[8,6,3], wom=p.x?[4,6,8.5]:[9.5,7.5,4.5];
  const P=Plot({x:[-0.3,2.3],y:[0,11],h:160,m:[14,12,24,34]}); P.yax([0,5,10],"study hours");
  [[men,"s1","d1"],[wom,"s2","d2"]].forEach(([v,c,d])=>{ P.poly(v.map((y,i)=>[i,y]),c); v.forEach((y,i)=>P.dot(i,y,3.4,d)); });
  P.xax([0,1,2],null,i=>"Day "+(i+1)); P.legend([["s1","Men"],["s2","Women"]]);
  return box(P.svg(), p.x?"Lines cross: the effect of day depends on gender (interaction).":"Parallel lines: day and gender act independently (no interaction).");
};

/* interval plots */
V.intv = function(p){
  const n=p.iv.length, P=Plot({x:p.xr,y:[0,n+0.6],h:40+n*30,m:[14,12,24,100]});
  if (p.c!=null) P.vl(p.c,"vl2", p.c===0?"no difference":"x̄ = "+p.c);
  p.iv.forEach(([a,b,l],i)=>{ const y=n-i; P.ln(a,y,b,y,"iv"); P.ln(a,y-0.18,a,y+0.18,"iv"); P.ln(b,y-0.18,b,y+0.18,"iv"); P.dot((a+b)/2,y,3.4,"d2");
    P.add(T(P.sx(a)-6,P.sy(y)+3.5,fmt(a,2),"tk","end")+T(P.sx(b)+6,P.sy(y)+3.5,fmt(b,2),"tk","start")+T(P.L-8,P.sy(y)+4,l,"lt","end")); });
  P.xax(); return box(P.svg(), p.c===0?"An interval that excludes 0 means that pair differs significantly.":null);
};

/* residual plots */
V.resid = function(p){
  const R=rng(29), P=Plot({x:[0,10],y:[-6,6],h:150,m:[12,12,24,30]}); P.yax([-5,0,5]); P.hl(0,"vl2");
  for (let i=0;i<70;i++){ const f=R()*10; let r;
    if (p.m==="good") r=1.5*randn(R); else if (p.m==="curve") r=0.22*(f-5)*(f-5)-1.8+0.6*randn(R); else r=(0.15+0.42*f)*randn(R);
    P.dot(f,Math.max(-5.8,Math.min(5.8,r)),2.5,"d1"); }
  P.xax(null,"fitted value ŷ");
  return box(P.svg(),{good:"Random cloud around 0 with constant spread: assumptions look fine.",curve:"U-shape: the model is missing curvature.",hetero:"Funnel: spread grows with ŷ (heteroscedasticity)."}[p.m]);
};

/* k-fold diagrams */
V.kfold = function(p){
  const W=400, L=78, R=390; let s="", rows;
  if (p.k===1){ rows=1; s+=`<rect class="b1" x="${L}" y="14" width="${(R-L)*0.8-3}" height="22" rx="4"/><rect class="b2" x="${L+(R-L)*0.8}" y="14" width="${(R-L)*0.2}" height="22" rx="4"/>`+T(L+(R-L)*0.4,29,"train 80%","lw")+T(L+(R-L)*0.9,29,"test 20%","lw")+T(L-8,29,"split","tk","end");
    return box(svgw(W,46,s),"The test set is touched once, at the very end."); }
  const k=p.k, H=16+(k)*24, w=(R-L)/(p.ts?k+1:k);
  for (let i=0;i<k;i++){ const y=10+i*24;
    if (p.ts){ s+=`<rect class="b1" x="${L}" y="${y}" width="${w*(i+1)-3}" height="18" rx="3"/><rect class="b2" x="${L+w*(i+1)}" y="${y}" width="${w-3}" height="18" rx="3"/>`; }
    else for (let j=0;j<k;j++) s+=`<rect class="${j===i?"b2":"b1"}" x="${L+j*w}" y="${y}" width="${w-3}" height="18" rx="3"/>`;
    s+=T(L-8,y+13,(p.ts?"split ":"fold ")+(i+1),"tk","end"); }
  s+=`<rect class="b1" x="${L}" y="${H-2}" width="10" height="10"/>`+T(L+14,H+7,"train","lt","start")+`<rect class="b2" x="${L+60}" y="${H-2}" width="10" height="10"/>`+T(L+74,H+7,"validate","lt","start");
  return box(svgw(W,H+12,s), p.ts?"Expanding window: the model never sees the future.":"Every observation is used for validation exactly once; average the 5 scores.");
};

/* CLT simulator */
V.clt = function(){
  const b=ibox(); let src="right", n=2; const R=rng(99);
  const pop={uniform:gen("uniform",4000,5), right:gen("exp",4000,6), bimodal:gen("bimodal",4000,7)};
  const draw=()=>{ const P0=pop[src], mu=mean(P0), sg=sd(P0), means=[]; const RR=rng(1000+n);
    for (let i=0;i<1500;i++){ let s=0; for (let j=0;j<n;j++) s+=P0[Math.floor(RR()*P0.length)]; means.push(s/n); }
    const W=400; let s="";
    const lo=Math.min(...P0), hi=Math.max(...P0);
    const A=Plot({w:W,h:210,x:[lo,hi],y:[0,1],m:[18,W*0.66,140,8]}); { const k=24, w=(hi-lo)/k, c=new Array(k).fill(0); P0.forEach(v=>{ c[Math.min(k-1,Math.floor((v-lo)/w))]++; }); const mx=Math.max(...c); c.forEach((v,i)=>A.rect(lo+i*w,0,lo+(i+1)*w-w*0.08,v/mx,"bm")); }
    s+=A.inner()+T((A.L+A.R)/2,12,"population","lb");
    const k=30, mlo=Math.min(...means), mhi=Math.max(...means), w=(mhi-mlo)/k||1, c=new Array(k).fill(0); means.forEach(v=>{ c[Math.min(k-1,Math.floor((v-mlo)/w))]++; });
    const se=sg/Math.sqrt(n), xr=[Math.min(mlo,mu-4*se),Math.max(mhi,mu+4*se)], ym=Math.max(Math.max(...c),npdf(0,0,se)*1500*w)*1.1;
    const B=Plot({w:W,h:210,x:xr,y:[0,ym],m:[18,8,22,W*0.38]}); c.forEach((v,i)=>{ if (v) B.rect(mlo+i*w,0,mlo+(i+1)*w-w*0.06,v,"b1"); });
    B.curve(x=>npdf(x,mu,se)*1500*w,xr[0],xr[1],"s2"); B.xax(nice(xr[0],xr[1],4));
    s+=B.inner()+T((B.L+B.R)/2,12,"1,500 sample means, n = "+n,"lb");
    b.g.innerHTML=svgw(W,210,s);
    b.p.textContent=`SD of the means = ${fmt(sd(means),2)}; σ/√n predicts ${fmt(se,2)}. Orange: normal curve N(μ, σ²/n). Raise n and watch the histogram become a bell.`; };
  seg(b.c,[["uniform","Uniform"],["right","Skewed"],["bimodal","Bimodal"]],src,v=>{src=v;draw();});
  slider(b.c,"n",1,50,1,n,v=>{n=v;draw();}); draw(); return b.d;
};

/* law of large numbers */
V.lln = function(){
  const b=ibox(); let seed=3;
  const draw=()=>{ const R=rng(seed), N=600; let s=0; const pts=[]; for (let i=1;i<=N;i++){ s+=1+Math.floor(R()*6); pts.push([i,s/i]); }
    const P=Plot({x:[1,N],y:[1,6],h:160,m:[12,12,24,30]}); P.yax([1,2,3,3.5,4,5,6]); P.hl(3.5,"vl2","E[X] = 3.5"); P.poly(pts,"s1"); P.xax(null,"number of die rolls");
    b.g.innerHTML=P.svg(); b.p.textContent=`After ${N} rolls the running average is ${fmt(pts[N-1][1],2)}. Early averages swing widely; later ones settle near 3.5.`; };
  btn(b.c,"Roll again",()=>{ seed++; draw(); }); draw(); return b.d;
};

/* CI coverage */
V.cicov = function(){
  const b=ibox(); let seed=1;
  const draw=()=>{ const R=rng(seed), mu=50, sg=10, n=20, k=30, P=Plot({x:[38,62],y:[0,k+1],h:230,m:[14,12,24,12]}); let miss=0;
    P.vl(mu,"vl2","true μ = 50");
    for (let i=0;i<k;i++){ let s=0; for (let j=0;j<n;j++) s+=mu+sg*randn(R); const m=s/n, e=1.96*sg/Math.sqrt(n), out=(m-e>mu||m+e<mu); if (out) miss++;
      P.ln(m-e,i+1,m+e,i+1,out?"ivr":"iv"); P.dot(m,i+1,2.4,out?"dr":"d1"); }
    P.xax(); b.g.innerHTML=P.svg(); b.p.textContent=`${k-miss} of ${k} intervals contain μ (red ones miss). Over many repeats, 95% would.`; };
  btn(b.c,"Draw 30 new samples",()=>{ seed++; draw(); }); draw(); return b.d;
};

/* bias / variance targets */
V.target = function(){
  const W=400, cells=[["Low bias, low variance",0,0.25],["Low bias, high variance",0,0.85],["High bias, low variance",1.1,0.25],["High bias, high variance",1.1,0.85]]; let s="";
  cells.forEach(([l,bias,v],i)=>{ const cx=50+i*100, cy=62, R=rng(50+i); [40,27,14].forEach((r,j)=>s+=`<circle class="${j===2?"tg2":"tg"}" cx="${cx}" cy="${cy}" r="${r}"/>`);
    for (let k=0;k<9;k++){ const a=0.7+bias*0.4, x=cx+(bias*20*Math.cos(a))+v*13*randn(R), y=cy-(bias*20*Math.sin(a))+v*13*randn(R); s+=`<circle class="d2" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.8"/>`; }
    const parts=l.split(", "); s+=T(cx,118,parts[0],"lt")+T(cx,131,parts[1],"lt"); });
  return box(svgw(W,138,s),"Each dot is an estimate from a different sample; the bullseye is the true value.");
};

/* likelihood (MLE) */
V.mle = function(p){
  const b=ibox(); let k=p.k; const n=p.n;
  const draw=()=>{ const L=q=>Math.pow(q,k)*Math.pow(1-q,n-k), mx=L(k/n)||1, P=Plot({x:[0,1],y:[0,1.1],h:150,m:[24,12,24,12]});
    P.area(q=>L(q)/mx,0,1,"fb"); P.curve(q=>L(q)/mx,0,1,"s1"); P.vl(k/n,"vl","p̂ = "+fmt(k/n,2)); P.xax([0,0.25,0.5,0.75,1],"p");
    b.g.innerHTML=P.svg(); b.p.textContent=`L(p) = p^${k} (1 − p)^${n-k}, scaled to peak at 1. The maximum is at k/n = ${fmt(k/n,2)}.`; };
  slider(b.c,"heads in 10",0,10,1,k,v=>{k=v;draw();}); draw(); return b.d;
};

/* bootstrap */
V.boot = function(){
  const b=ibox(); let seed=2; const data=gen("right",25,77).map(v=>Math.round(v*10)/10);
  const draw=()=>{ const R=rng(seed), B=1000, st=[]; for (let i=0;i<B;i++){ const s=[]; for (let j=0;j<data.length;j++) s.push(data[Math.floor(R()*data.length)]); st.push(quant(s,0.5)); }
    const lo=quant(st,0.025), hi=quant(st,0.975), mn=Math.min(...st), mx=Math.max(...st), k=26, w=(mx-mn)/k||1, c=new Array(k).fill(0); st.forEach(v=>c[Math.min(k-1,Math.floor((v-mn)/w))]++);
    const P=Plot({x:[mn-w,mx+w],y:[0,Math.max(...c)*1.15],h:160,m:[26,12,24,34]}); P.yax(nice(0,Math.max(...c)*1.15,3));
    c.forEach((v,i)=>{ if (v){ const x=mn+i*w; P.rect(x,0,x+w*0.92,v,(x+w/2>=lo&&x+w/2<=hi)?"b1":"bm"); } });
    P.vl(lo,"vl","2.5%"); P.vl(hi,"vl","97.5%"); P.xax(null,"median of resample");
    b.g.innerHTML=P.svg(); b.p.textContent=`Sample of 25: median ${fmt(quant(data,0.5))}. 1,000 resamples give a 95% CI for the median of [${fmt(lo)}, ${fmt(hi)}].`; };
  btn(b.c,"Resample 1,000 times",()=>{ seed++; draw(); }); draw(); return b.d;
};

/* one- vs two-tailed */
V.tails3 = function(){
  const W=400, pw=W/3; let s="";
  [["Left-tailed",[[-5,-1.645]],"−1.645"],["Two-tailed",[[-5,-1.96],[1.96,5]],"±1.96"],["Right-tailed",[[1.645,5]],"+1.645"]].forEach(([l,sh,c],i)=>{
    const P=Plot({w:W,h:120,x:[-3.6,3.6],y:[0,0.44],m:[20,W-(i+1)*pw+6,26,i*pw+6]}); sh.forEach(([a,b])=>P.area(x=>npdf(x),a,b,"fr")); P.curve(x=>npdf(x),-3.6,3.6,"s1");
    P.add(`<line class="ax" x1="${P.L}" x2="${P.R}" y1="${P.B}" y2="${P.B}"/>`); s+=P.inner()+T((P.L+P.R)/2,12,l,"lb")+T((P.L+P.R)/2,P.B+16,"critical "+c,"tk"); });
  return box(svgw(W,120,s),"Same α = 0.05: split across both tails, or all in one.");
};

/* interactive p-value */
V.pval = function(){
  const b=ibox(); let z=-1.39, mode="two";
  const draw=()=>{ const P=Plot({x:[-4,4],y:[0,0.44],h:160,m:[26,12,24,12]}); const f=x=>npdf(x);
    let pv; if (mode==="two"){ const a=Math.abs(z); P.area(f,-5,-a,"fr"); P.area(f,a,5,"fr"); pv=2*(1-ncdf(a)); } else { P.area(f,z,5,"fr"); pv=1-ncdf(z); }
    P.curve(f,-4,4,"s1"); P.vl(z,"vl","z = "+fmt(z,2)); P.xax();
    b.g.innerHTML=P.svg(); const dec=pv<=0.05?"p ≤ 0.05: reject H₀.":"p > 0.05: fail to reject H₀.";
    b.p.textContent=`p = ${mode==="two"?"2 × P(Z > |z|)":"P(Z > z)"} = ${fmt(pv,4)}. ${dec}`; b.p.dataset.sig=String(pv<=0.05); };
  seg(b.c,[["two","Two-tailed"],["right","Right-tailed"]],mode,v=>{mode=v;draw();});
  slider(b.c,"z",-4,4,0.01,z,v=>{z=v;draw();},v=>fmt(v,2)); draw(); return b.d;
};

/* power */
V.power = function(){
  const b=ibox(); let d=2;
  const draw=()=>{ const c=1.96, P=Plot({x:[-4,7.5],y:[0,0.46],h:170,m:[26,12,24,12]}), f0=x=>npdf(x), f1=x=>npdf(x,d,1);
    P.area(f1,-5,c,"fd"); P.area(f1,c,9,"fb"); P.area(f0,c,9,"fr"); P.curve(f0,-4,7.5,"s1"); P.curve(f1,-4,7.5,"s2"); P.vl(c,"vl","critical 1.96"); P.xax();
    P.legend([["s1","under H₀"],["s2","under H₁"]],P.L+6);
    const pw=1-ncdf(c-d); b.g.innerHTML=P.svg(); b.p.textContent=`Red: α. Orange: β = ${fmt(1-pw,2)}. Blue: power = 1 − β = ${fmt(pw,2)}. Bigger effects (or more data) push H₁ right.`; };
  slider(b.c,"effect ÷ SE",0,5,0.1,d,v=>{d=v;draw();},v=>fmt(v,1)); draw(); return b.d;
};

/* paired before/after */
V.paired = function(){
  const R=rng(61), n=15, bef=[], aft=[]; for (let i=0;i<n;i++){ const x=50+8*randn(R); bef.push(x); aft.push(x+3+3*randn(R)); }
  const all=bef.concat(aft), P=Plot({x:[-0.4,1.4],y:rangeOf(all),h:180,m:[12,12,24,34]}); P.yax(nice(...rangeOf(all),4),"stamina");
  for (let i=0;i<n;i++){ P.ln(0,bef[i],1,aft[i],aft[i]>bef[i]?"pu":"pdn"); P.dot(0,bef[i],3,"dm"); P.dot(1,aft[i],3,"d1"); }
  P.xax([0,1],null,i=>i?"after":"before"); const df=aft.map((v,i)=>v-bef[i]);
  return box(P.svg(),`Mean change = ${fmt(mean(df),2)}, SD of changes = ${fmt(sd(df),2)}. The paired test analyses these 15 differences.`);
};

/* one-way ANOVA picture */
V.anova = function(){
  const g=[[9,8,7,8,8,9,8],[7,6,6,7,8,7,6],[4,3,2,3,4,3,2]], lab=["0 mg","50 mg","100 mg"], gm=mean([].concat(...g));
  const P=Plot({x:[-0.5,2.5],y:[0,10.5],h:180,m:[16,12,24,30]}); P.yax([0,2,4,6,8,10],"anxiety"); P.hl(gm,"vl2","grand mean "+fmt(gm,2));
  g.forEach((d,i)=>{ const m=mean(d), cnt={}; d.forEach(v=>{ const j=cnt[v]=(cnt[v]||0)+1; P.dot(i-0.18+(j-1)*0.09,v,3,"dm"); }); P.ln(i-0.3,m,i+0.3,m,"s2"); P.ln(i+0.34,gm,i+0.34,m,"btw"); });
  P.xax([0,1,2],null,i=>lab[i]);
  return box(P.svg(),"Orange: group means. Blue arrows: between-group distance from the grand mean. Dots' scatter around each group mean is within-group noise.");
};

/* causal diagram for a confounder */
V.dag = function(){
  const n=(x,y,t,w)=>`<rect class="nb" x="${x-w/2}" y="${y-13}" width="${w}" height="26" rx="7"/>`+T(x,y+4,t,"lt");
  let s=`<path class="arh" d="M170,41 L106,93"/><path class="arh" d="M230,41 L294,93"/><path class="dsh" d="M146,108 L264,108"/>`+ahd(106,93,170,41)+ahd(294,93,230,41);
  s+=n(200,28,"Temperature",110)+n(86,108,"Ice-cream sales",118)+n(314,108,"Drownings",96)+T(200,100,"correlated, not causal","tk");
  return box(svgw(400,130,s),"Temperature causes both; ice cream and drownings are only associated.");
};

/* Simpson's paradox */
V.simpson = function(){
  const R=rng(71), A=[], B=[]; for (let i=0;i<16;i++){ const x=1+R()*3; A.push([x,7.5+0.8*(x-2.5)+0.5*randn(R)]); const x2=5+R()*3; B.push([x2,3+0.8*(x2-6.5)+0.5*randn(R)]); }
  const all=A.concat(B), P=Plot({x:[0.5,8.5],y:[0,10.5],h:170,m:[12,12,24,30]}); P.yax([0,5,10]); P.xax();
  const fit=(pts,cls)=>{ const [b0,b1]=ols(pts.map(p=>p[0]),pts.map(p=>p[1])), lo=Math.min(...pts.map(p=>p[0])), hi=Math.max(...pts.map(p=>p[0])); P.ln(lo,b0+b1*lo,hi,b0+b1*hi,cls); return b1; };
  const ba=fit(A,"s1"), bb=fit(B,"s2"), bo=fit(all,"sd"); A.forEach(p=>P.dot(p[0],p[1],2.6,"d1")); B.forEach(p=>P.dot(p[0],p[1],2.6,"d2"));
  P.legend([["s1","group 1 trend"],["s2","group 2 trend"],["sd","combined trend"]],P.R-120);
  return box(P.svg(),`Inside each group the slope is positive (${fmt(ba,2)}, ${fmt(bb,2)}); pooled together it turns negative (${fmt(bo,2)}).`);
};

/* PCA */
V.pca = function(){
  const [x,y]=scData(0.85,120,8), mx=mean(x), my=mean(y), sxx=sd(x)**2, syy=sd(y)**2, sxy=corr(x,y)*sd(x)*sd(y);
  const tr=sxx+syy, det=sxx*syy-sxy*sxy, l1=tr/2+Math.sqrt(tr*tr/4-det), l2=tr/2-Math.sqrt(tr*tr/4-det), v1=[sxy,l1-sxx], n1=Math.hypot(...v1), u=[v1[0]/n1,v1[1]/n1];
  const P=Plot({x:[-3.4,3.4],y:[-3.2,3.2],h:180,m:[12,12,22,30]}); P.yax([-2,0,2]); P.xax([-2,0,2]); x.forEach((v,i)=>P.dot(v,y[i],2.2,"dm"));
  const a1=2*Math.sqrt(l1), a2=2*Math.sqrt(l2); P.ln(mx,my,mx+u[0]*a1,my+u[1]*a1,"pc1"); P.ln(mx,my,mx-u[1]*a2,my+u[0]*a2,"pc2");
  P.tx(mx+u[0]*a1,my+u[1]*a1,"PC1","lb","start",-4); P.tx(mx-u[1]*a2,my+u[0]*a2,"PC2","lb","end",-4);
  return box(P.svg(),`PC1 points along the widest spread and explains ${Math.round(l1/(l1+l2)*100)}% of the variance; PC2 is perpendicular.`);
};

/* bias-variance */
V.bv = function(){
  const P=Plot({x:[0,10],y:[0,1.15],h:170,m:[16,12,26,34]}), b2=c=>0.9*Math.exp(-0.42*c)+0.03, va=c=>0.02*Math.exp(0.33*c), tot=c=>b2(c)+va(c)+0.08;
  let best=0, bv=9; for (let c=0;c<=10;c+=0.01) if (tot(c)<bv){ bv=tot(c); best=c; }
  P.yax([0,0.5,1],"error"); P.curve(b2,0,10,"s1"); P.curve(va,0,10,"s2"); P.curve(tot,0,10,"s4"); P.vl(best,"vl2","sweet spot");
  P.tx(1.2,0.1,"underfit","tk").tx(9,0.1,"overfit","tk"); P.xax([],"model complexity →"); P.legend([["s1","bias²"],["s2","variance"],["s4","total test error"]],P.L+150,P.T+46);
  return box(P.svg(),"Adding complexity lowers bias but raises variance; test error is lowest in between.");
};

/* under / good / over fit */
V.fit = function(){
  const R=rng(81), x=[], y=[]; for (let i=0;i<12;i++){ const t=-2.6+i*0.47+0.12*randn(R); x.push(t); y.push(t*t/2+0.45*randn(R)); }
  const W=400, pw=W/3; let s="";
  const quad=()=>{ const A=[[0,0,0],[0,0,0],[0,0,0]], bb=[0,0,0]; x.forEach((t,i)=>{ const r=[1,t,t*t]; for (let a=0;a<3;a++){ bb[a]+=r[a]*y[i]; for (let c=0;c<3;c++) A[a][c]+=r[a]*r[c]; } });
    const M=A.map((r,i)=>[...r,bb[i]]); for (let i=0;i<3;i++){ for (let k=0;k<3;k++) if (k!==i){ const f=M[k][i]/M[i][i]; for (let c=i;c<4;c++) M[k][c]-=f*M[i][c]; } } return M.map((r,i)=>r[3]/r[i]); };
  [["Underfit (high bias)"],["Good fit"],["Overfit (high variance)"]].forEach(([l],i)=>{ const P=Plot({w:W,h:130,x:[-3,3],y:[-1,4.6],m:[20,W-(i+1)*pw+6,10,i*pw+6]});
    P.add(`<rect class="pf" x="${P.L}" y="${P.T}" width="${P.R-P.L}" height="${P.B-P.T}" rx="4"/>`);
    if (i===0){ const [b0,b1]=ols(x,y); P.ln(-3,b0-3*b1,3,b0+3*b1,"s2"); }
    if (i===1){ const q=quad(); P.curve(t=>q[0]+q[1]*t+q[2]*t*t,-3,3,"s2"); }
    if (i===2){ const pts=x.map((t,k)=>[t,y[k]]).sort((a,b)=>a[0]-b[0]); let d=`M${P.sx(pts[0][0])},${P.sy(pts[0][1])}`;
      for (let k=0;k<pts.length-1;k++){ const p0=pts[Math.max(0,k-1)], p1=pts[k], p2=pts[k+1], p3=pts[Math.min(pts.length-1,k+2)];
        const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6+(k%2?0.9:-0.9)], c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6+(k%2?0.9:-0.9)];

      P.add(`<path class="s2" d="${d}"/>`); }
    x.forEach((t,k)=>P.dot(t,y[k],2.4,"d1")); s+=P.inner()+T((P.L+P.R)/2,12,l,"lb"); });

/* threshold explorer */
V.thresh = function(){

    b.g.innerHTML=P.svg(); b.p.textContent=`TP ≈ ${Math.round(TP)}, FP ≈ ${Math.round(FP)} (red), FN ≈ ${Math.round(FN)} (orange). Precision ${fmt(prec,2)}, recall ${fmt(rec,2)}.`; };

/* ROC */

/* Bayesian update */
V.bayes = function(){
  const b=ibox(); let pri=[1,1], k=7, n=10;
  const draw=()=>{ const a=pri[0]+k, bb=pri[1]+n-k, P=Plot({x:[0,1],y:[0,1],h:170,m:[12,12,24,12]});
    let mx=0; const fs=[x=>PDF.beta(x,pri[0],pri[1]), x=>Math.pow(x,k)*Math.pow(1-x,n-k), x=>PDF.beta(x,a,bb)], mxs=fs.map(f=>{ let m=0; for (let i=1;i<200;i++) m=Math.max(m,f(i/200)); return m||1; });
    const top=Math.max(mxs[0],mxs[2]); const P2=Plot({x:[0,1],y:[0,top*1.12],h:170,m:[12,12,24,12]});
    P2.curve(x=>fs[1](x)/mxs[1]*top*0.6,0.002,0.998,"sd"); P2.curve(fs[0],0.002,0.998,"s3"); P2.area(fs[2],0,1,"fb"); P2.curve(fs[2],0.002,0.998,"s1"); P2.xax([0,0.25,0.5,0.75,1],"conversion rate θ");
    P2.legend([["s3","prior"],["sd","likelihood (scaled)"],["s1","posterior"]],P2.L+6);
    let cum=0, lo=0, hi=1; const N=2000; for (let i=1;i<N;i++){ const x=i/N, v=PDF.beta(x,a,bb)/N; const c0=cum; cum+=v; if (c0<0.025&&cum>=0.025) lo=x; if (c0<0.975&&cum>=0.975) hi=x; }
    b.g.innerHTML=P2.svg(); b.p.textContent=`Posterior Beta(${a}, ${bb}): mean ${fmt(a/(a+bb),2)}, 95% credible interval [${fmt(lo,2)}, ${fmt(hi,2)}].`; };
  seg(b.c,[["1,1","Flat prior"],["2,8","Sceptical"],["8,2","Optimistic"]],"1,1",v=>{pri=v.split(",").map(Number);draw();});
  const ns=slider(b.c,"trials n",1,100,1,n,v=>{n=v; if (k>n){ k=n; ks.value=k; ks.nextSibling.textContent=k; } ks.max=n; draw();});
  const ks=slider(b.c,"successes k",0,10,1,k,v=>{k=Math.min(v,n);draw();}); ks.max=n; draw(); return b.d;
};

/* peeking in an A/A test */
V.peek = function(){
  const b=ibox(); let seed=1;
  const run=sd0=>{ const R=rng(sd0), days=30, per=400, p=0.1; let xa=0, xb=0, na=0, nb=0; const ps=[];
    for (let d=1;d<=days;d++){ for (let i=0;i<per;i++){ if (R()<p) xa++; if (R()<p) xb++; } na+=per; nb+=per; const pp=(xa+xb)/(na+nb), se=Math.sqrt(pp*(1-pp)*(1/na+1/nb)), z=(xb/nb-xa/na)/se; ps.push(2*(1-ncdf(Math.abs(z)))); }
    return ps; };
  const draw=()=>{ let ps=run(seed), tries=0; while (b._first!==false && !(Math.min(...ps)<0.05 && ps[ps.length-1]>0.05) && tries<300){ seed++; tries++; ps=run(seed); } b._first=false;
    const P=Plot({x:[1,30],y:[0,1],h:160,m:[14,12,24,34]}); P.yax([0.05,0.5,1]); P.rect(1,0,30,0.05,"fr"); P.poly(ps.map((v,i)=>[i+1,v]),"s1");
    ps.forEach((v,i)=>{ if (v<0.05) P.dot(i+1,v,3.2,"dr"); }); P.xax([1,10,20,30],"day of experiment");
    const first=ps.findIndex(v=>v<0.05); b.g.innerHTML=P.svg();
    b.p.textContent= first>=0 ? `A/A test (no real difference). p dipped below 0.05 on day ${first+1}; stopping then would declare a false winner. Final p = ${fmt(ps[29],2)}.` : `This run never dipped below 0.05. Final p = ${fmt(ps[29],2)}. Try again: about 1 in 4 A/A runs dip below 0.05 at some point.`; };
  btn(b.c,"Simulate another A/A test",()=>{ seed++; draw(); }); draw(); return b.d;
};

/* scaling before / after */
V.scale = function(p){
  if (p.m==="log"){ const d=gen("right",400,15), l=d.map(v=>Math.log(v)), W=400; let s="";
    [[d,"original: right-skewed"],[l,"after ln(x): symmetric"]].forEach(([v,t],i)=>{ const lo=Math.min(...v), hi=Math.max(...v), k=20, w=(hi-lo)/k, c=new Array(k).fill(0); v.forEach(x=>c[Math.min(k-1,Math.floor((x-lo)/w))]++);

    return box(svgw(W,140,s)); }

  data.forEach((v,i)=>{ s+=`<path class="map" d="M${A.sx(v).toFixed(1)},${A.B} L${B.sx(sc[i]).toFixed(1)},${B.B}"/><circle class="d1" cx="${A.sx(v).toFixed(1)}" cy="${A.B}" r="4"/><circle class="d2" cx="${B.sx(sc[i]).toFixed(1)}" cy="${B.B}" r="4"/>`; });
  s+=T(12,10,"original","tk","start")+T(12,B.B-8,lab,"tk","start");
  return box(svgw(W,H,s),caption);
};
})();
(function(){
"use strict";
const {V, rng, randn, gen, mean, quant, ols, fmt, nice, Plot, svgw, T, box, ibox, btn, rangeOf} = VZ;
/* Monte Carlo estimate of pi */
V.mc = function(){
  const b=ibox(); let seed=1, n=400;
  const draw=()=>{ const R=rng(seed); let inside=0, s=""; const S=150, ox=125, oy=10;
    s+=`<rect class="pf" x="${ox}" y="${oy}" width="${S}" height="${S}"/><path class="s2" d="M${ox},${oy} A${S},${S} 0 0 1 ${ox+S},${oy+S}"/>`;
    for (let i=0;i<n;i++){ const x=R(), y=R(), inn=x*x+y*y<=1; if (inn) inside++; s+=`<circle class="${inn?"d1":"dm"}" cx="${(ox+x*S).toFixed(1)}" cy="${(oy+S-y*S).toFixed(1)}" r="1.8"/>`; }
    b.g.innerHTML=svgw(400,168,s); b.p.textContent=`${inside} of ${n} points fell inside the quarter circle → π ≈ 4 × ${inside}/${n} = ${fmt(4*inside/n,3)}.`; };
  VZ.seg(b.c,[["400","400 points"],["4000","4,000 points"]],"400",v=>{n=+v;draw();});
  btn(b.c,"Simulate again",()=>{ seed++; draw(); }); draw(); return b.d;
};
/* permutation test */
V.perm = function(){
  const b=ibox(); let seed=3; const A=gen("normal",14,90), B=gen("normal",14,91).map(v=>v+8), obs=mean(B)-mean(A), all=A.concat(B);
  const draw=()=>{ const R=rng(seed), K=2000, d=[]; for (let k=0;k<K;k++){ const p=all.slice(); for (let i=p.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [p[i],p[j]]=[p[j],p[i]]; } d.push(mean(p.slice(14))-mean(p.slice(0,14))); }
    const ext=d.filter(v=>Math.abs(v)>=Math.abs(obs)).length, lo=Math.min(...d,-obs)-1, hi=Math.max(...d,obs)+1, k=30, w=(hi-lo)/k, c=new Array(k).fill(0); d.forEach(v=>c[Math.min(k-1,Math.floor((v-lo)/w))]++);
    const P=Plot({x:[lo,hi],y:[0,Math.max(...c)*1.15],h:160,m:[26,12,24,34]}); P.yax(nice(0,Math.max(...c)*1.15,3));
    c.forEach((v,i)=>{ if (v){ const x=lo+i*w, mid=x+w/2; P.rect(x,0,x+w*0.92,v,Math.abs(mid)>=Math.abs(obs)?"br":"bm"); } });
    P.vl(obs,"vl","observed "+fmt(obs,1)); P.xax(null,"difference in means after shuffling labels");
    b.g.innerHTML=P.svg(); b.p.textContent=`${ext} of ${K} shuffles were at least as extreme as the real difference → p ≈ ${fmt(Math.max(ext,1)/K,3)}${ext===0?" (or less)":""}.`; };
  btn(b.c,"Shuffle 2,000 times",()=>{ seed++; draw(); }); draw(); return b.d;
};
/* influential point */
V.infl = function(){
  const R=rng(44), x=[], y=[]; for (let i=0;i<18;i++){ const t=1+R()*5; x.push(t); y.push(2+0.9*t+0.6*randn(R)); }
  const [a0,a1]=ols(x,y); const X=x.concat([11]), Y=y.concat([2.5]); const [b0,b1]=ols(X,Y);
  const P=Plot({x:[0,12],y:[0,14],h:170,m:[12,12,24,30]}); P.yax([0,5,10]); P.xax([0,2,4,6,8,10,12]);
  P.ln(0,a0,12,a0+a1*12,"sd"); P.ln(0,b0,12,b0+b1*12,"s2"); x.forEach((t,i)=>P.dot(t,y[i],2.8,"d1")); P.dot(11,2.5,4.2,"dr"); P.tx(11,2.5,"high leverage","lb","end",-8);
  P.legend([["sd","fit without it"],["s2","fit with it"]],P.L+8);
  return box(P.svg(),`One point with an extreme x drags the slope from ${fmt(a1,2)} to ${fmt(b1,2)}: high leverage plus a large residual means high influence.`);
};
})();

<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);

}

  const L = layout(rootKey); let edges = "", labels = "", nodes = "";
  const col = n => n.ghost ? ["var(--paper2)", "var(--wire)", "var(--ink2)", "var(--muted)"] :
    n.key === D.root || N[n.key].sec ? ["var(--entry-bg)", "var(--entry-bg)", "var(--entry-ink)", "var(--entry-muted)"] :
    ({ B: ["var(--basic-bg)", "var(--basic)"], I: ["var(--inter-bg)", "var(--inter)"], A: ["var(--adv-bg)", "var(--adv)"] }[N[n.key].k] || ["var(--card)", "var(--wire)"]).concat(["var(--ink)", "var(--muted)"]);
  if (L.tree.trunk && L.tree.trunk.length){ const tx = L.tree.cx; edges += `<path d="M${tx.toFixed(1)},${(L.tree.y + L.tree.h).toFixed(1)} V${Math.max(...L.tree.trunk).toFixed(1)}" fill="none" stroke="var(--wire)" stroke-width="1.6"/>`; }
  const walk = p => p.kids.forEach(c => {
    const px = p.cx, py = p.y + p.h, lt = c.y - 14 - c.labH, dash = c.ghost ? ' stroke-dasharray="5 4"' : "";
    if (p === L.tree && L.tree.trunk && L.tree.trunk.length){ const tx = L.tree.cx, r = Math.min(8, Math.abs(c.cx - tx) / 2);
      edges += `<path d="M${tx.toFixed(1)},${(c.busY - r).toFixed(1)} Q${tx.toFixed(1)},${c.busY.toFixed(1)} ${(tx + r).toFixed(1)},${c.busY.toFixed(1)} H${(c.cx - r).toFixed(1)} Q${c.cx.toFixed(1)},${c.busY.toFixed(1)} ${c.cx.toFixed(1)},${(c.busY + r).toFixed(1)} V${lt.toFixed(1)}" fill="none" stroke="var(--wire)" stroke-width="1.3"${dash}/>`; }
    else { const by = Math.max(py + 12, Math.min(c.bend, lt)), mid = (py + by) / 2;
    edges += `<path d="M${px.toFixed(1)},${py.toFixed(1)} C${px.toFixed(1)},${mid.toFixed(1)} ${c.cx.toFixed(1)},${mid.toFixed(1)} ${c.cx.toFixed(1)},${by.toFixed(1)} L${c.cx.toFixed(1)},${lt.toFixed(1)}" fill="none" stroke="var(--wire)" stroke-width="1.3"${dash}/>`; }
    edges += `<line x1="${c.cx.toFixed(1)}" y1="${(lt + c.labH).toFixed(1)}" x2="${c.cx.toFixed(1)}" y2="${(c.y - 3).toFixed(1)}" stroke="var(--wire)" stroke-width="1.3"${dash}/>`
      + `<polygon points="${c.cx - 4.5},${c.y - 9} ${c.cx + 4.5},${c.y - 9} ${c.cx},${c.y - 1}" fill="var(--wire)"/>`;
    const lx = c.cx - c.labW / 2;
    labels += `<g class="ovlab" data-e="${escX(c.inEdge.id)}"><rect x="${lx.toFixed(1)}" y="${lt.toFixed(1)}" width="${c.labW.toFixed(1)}" height="${c.labH.toFixed(1)}" rx="5" fill="var(--paper)" stroke="var(--line)"/>`;
    c.lab.forEach((ln, i) => { const yy = lt + 15 + i * 12.5;
      if (i === 0){ const sp = ln.indexOf(" "); labels += `<text x="${c.cx.toFixed(1)}" y="${yy.toFixed(1)}" font-size="${LFS}" text-anchor="middle" fill="var(--ink2)"><tspan font-weight="700" fill="var(--ink)">${escX(sp < 0 ? ln : ln.slice(0, sp))}</tspan>${sp < 0 ? "" : " " + escX(ln.slice(sp + 1))}</text>`; }
      else labels += `<text x="${c.cx.toFixed(1)}" y="${yy.toFixed(1)}" font-size="${LFS}" text-anchor="middle" fill="var(--ink2)">${escX(ln)}</text>`; });
    labels += `</g>`;
    walk(c);
  });
  walk(L.tree);
  L.all.forEach(n => { const [fill, stroke, ink, mut] = col(n), x = n.cx - n.w / 2;
    const nk = N[n.key]; nodes += `<g class="ovnode ok-${escX(nk.k)}${nk.nt ? " nt" : ""}" data-k="${escX(n.key)}"${n.ghost ? ' data-ghost="1"' : ""}><rect x="${x.toFixed(1)}" y="${n.y.toFixed(1)}" width="${n.w.toFixed(1)}" height="${n.h.toFixed(1)}" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="${n.ghost ? 1.4 : 1.8}"${n.ghost ? ' stroke-dasharray="5 4"' : ""}/>`;
    n.title.forEach((t, i) => nodes += `<text x="${n.cx.toFixed(1)}" y="${(n.y + 18 + i * 15).toFixed(1)}" font-size="${TFS}" font-weight="700" text-anchor="middle" fill="${ink}">${escX((n.ghost && i === 0 ? "Go to " : "") + t)}</text>`);
    n.sub.forEach((t, i) => nodes += `<text x="${n.cx.toFixed(1)}" y="${(n.y + 18 + n.title.length * 15 + i * 13 - 1).toFixed(1)}" font-size="${SFS}" text-anchor="middle" fill="${mut}">${escX(t)}</text>`);
    if (nk.nt && !n.ghost) nodes += `<circle class="ovnt" cx="${(x + n.w - 8).toFixed(1)}" cy="${(n.y + 8).toFixed(1)}" r="4.5"><title>In your notes</title></circle>`;
    nodes += `</g>`; });
  return { svg: `<svg class="ovsvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${L.W.toFixed(0)} ${L.H.toFixed(0)}" width="${L.W.toFixed(0)}" height="${L.H.toFixed(0)}" style="font-family:${escX(FF)}">${edges}${labels}${nodes}</svg>`, W: L.W, H: L.H };
}
function setOvScale(s){ ovScale = Math.max(0.15, Math.min(2, s)); const sv = ovbox.querySelector("svg"); if (sv){ sv.setAttribute("width", (ovDim[0] * ovScale).toFixed(0)); sv.setAttribute("height", (ovDim[1] * ovScale).toFixed(0)); } ovzv.textContent = Math.round(ovScale * 100) + "%"; }
function fitOv(){ const fit = Math.min((ovbox.clientWidth - 20) / ovDim[0], (ovbox.clientHeight - 20) / ovDim[1], 1); setOvScale(fit); ovbox.scrollLeft = 0; ovbox.scrollTop = 0; }
function renderOv(rootKey, focus){
  ovCur = rootKey; ovsel.value = rootKey; const r = svgFor(rootKey); ovbox.innerHTML = r.svg; ovDim = [r.W, r.H];
  const fit = Math.min((ovbox.clientWidth - 20) / r.W, 1); setOvScale(Math.max(fit, 0.55));
  ovbox.scrollTop = 0; ovbox.scrollLeft = Math.max(0, (r.W * ovScale - ovbox.clientWidth) / 2);
  if (focus){ const g = ovbox.querySelector(`.ovnode[data-k="${CSS.escape(focus)}"]:not([data-ghost])`); if (g){ const b = g.getBBox();
      ovbox.scrollLeft = Math.max(0, (b.x + b.width / 2) * ovScale - ovbox.clientWidth / 2); ovbox.scrollTop = Math.max(0, (b.y + b.height / 2) * ovScale - ovbox.clientHeight / 2);
      g.classList.add("ovflash"); setTimeout(() => g.classList.remove("ovflash"), 1800); } }
  try { localStorage.setItem("stats-ov-last", rootKey); } catch(e){}
}
function openOv(){ ov.hidden = false; document.body.classList.add("ovopen"); let last = null; try { last = localStorage.getItem("stats-ov-last"); } catch(e){}
  renderOv(last && N[last] ? last : D.root); $("#ovclose").focus(); }
function closeOv(){ ov.hidden = true; document.body.classList.remove("ovopen"); $("#ovbtn").focus(); }
ovsel.append(h("option", null, "All topics"));
ovsel.lastChild.value = D.root;
Object.keys(TITLES).forEach((p, i) => { const o = h("option", null, (i + 1) + ". " + TITLES[p]); o.value = p; ovsel.append(o); });
ovsel.onchange = () => renderOv(ovsel.value);
$("#ovbtn").onclick = openOv; $("#ovclose").onclick = closeOv;
$("#ovzin").onclick = () => setOvScale(ovScale * 1.2); $("#ovzout").onclick = () => setOvScale(ovScale / 1.2); $("#ovfit").onclick = fitOv;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !ov.hidden) closeOv(); });
ovbox.addEventListener("click", e => {
  const g = e.target.closest(".ovnode"); if (!g) return; const k = g.dataset.k;
  if (g.dataset.ghost){ const t = N[k]; renderOv(t.sec ? k : t.p, k); return; }
  if (ovCur === D.root && N[k].sec){ renderOv(k); return; }
  closeOv(); jump(k, true);
});
let od = null;
ovbox.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse" || e.button !== 0 || e.target.closest(".ovnode")) return; od = { x: e.clientX, y: e.clientY, l: ovbox.scrollLeft, t: ovbox.scrollTop }; ovbox.classList.add("drag"); ovbox.setPointerCapture(e.pointerId); });
ovbox.addEventListener("pointermove", e => { if (!od) return; ovbox.scrollLeft = od.l - (e.clientX - od.x); ovbox.scrollTop = od.t - (e.clientY - od.y); });
const endOd = () => { od = null; ovbox.classList.remove("drag"); }; ovbox.addEventListener("pointerup", endOd); ovbox.addEventListener("pointercancel", endOd);
ovbox.addEventListener("wheel", e => { if (!(e.ctrlKey || e.metaKey)) return; e.preventDefault(); setOvScale(ovScale * Math.exp(-e.deltaY * 0.002)); }, { passive: false });
/* Save as PDF: every topic's overview, one per page, through the browser's print dialog */
function buildPrint(){ let pr = document.getElementById("printroot"); if (pr) pr.remove(); pr = h("div"); pr.id = "printroot";
  let css = ""; const PX = 0.2646;   /* mm per CSS pixel: each page is sized to its graph at 100% */
  [D.root].concat(Object.keys(TITLES)).forEach((k, i) => { const r = svgFor(k), wmm = Math.max(297, r.W * PX + 16), hmm = Math.max(210, r.H * PX + 30);
    css += `@page ov${i}{size:${wmm.toFixed(0)}mm ${hmm.toFixed(0)}mm;margin:8mm}#printroot .pg${i}{page:ov${i}}`;
    const pg = h("section", "ppage pg" + i); pg.append(h("h2", null, k === D.root ? N[k].t + ": all topics" : i + ". " + TITLES[k]));
    const box = h("div", "pbox"); box.innerHTML = r.svg; pg.append(box); pr.append(pg); });
  const st = h("style"); st.textContent = "@media print{" + css + "}"; pr.prepend(st);
  document.body.append(pr); return pr; }
$("#ovpdf").onclick = () => { buildPrint(); window.print(); };
window.addEventListener("afterprint", () => { const pr = document.getElementById("printroot"); if (pr) pr.remove(); });
window.__buildOverviewPrint = buildPrint;
})();
})();
