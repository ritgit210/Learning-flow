s",{"m":"season"}]},"movavg":{"k":"B","t":"Moving average (smoothing)","s":"The mean of the last k observations at each time point.","p":"C15","py":"y.rolling(window=7).mean()","v":["ts",{"m":"ma"}]},"stationarity":{"k":"I","t":"Stationarity","s":"Statistical properties that don't change with time.","p":"C15","v":["ts",{"m":"stat"}]},"adf":{"k":"I","t":"ADF test","s":"The augmented Dickey–Fuller test.","p":"C15","py":"from statsmodels.tsa.stattools import adfuller\nadfuller(y)[1]   # p-value"},"differencing":{"k":"I","t":"Differencing","s":"Replacing values with changes between consecutive values.","p":"C15","py":"y.diff().dropna()"},"whitenoise":{"k":"I","t":"White noise & random walk","s":"The two reference series of time-series analysis.","p":"C15"},"autocorr":{"k":"I","t":"Autocorrelation (ACF)","s":"The correlation between yₜ and yₜ₋ₖ for each lag k.","p":"C15","py":"from statsmodels.graphics.tsaplots import plot_acf","v":["acf",{}]},"pacf":{"k":"A","t":"Partial autocorrelation (PACF)","s":"The direct relationship between yₜ and yₜ₋ₖ.","p":"C15"},"arima":{"k":"A","t":"ARIMA","s":"ARIMA(p, d, q) models.","p":"C15","py":"from statsmodels.tsa.arima.model import ARIMA\nARIMA(y, order=(1, 1, 1)).fit()"}},"edges":[{"s":"ROOT","t":"C1","sc":"Start here: what you are measuring and where it came from","w":"The type of data and the way it was sampled decide every summary, plot and test that follows.","tree":true,"id":"0.1"},{"s":"C1","t":"stats","sc":"What the field is about","w":"Frames the whole map: collect, organise, analyse, then conclude.","tree":true,"id":"1.1"},{"s":"stats","t":"data","sc":"What statistics works on","w":"Everything starts with recorded observations.","tree":true,"id":"1.2"},{"s":"stats","t":"descstat","sc":"You want to summarise data you already have","w":"Organises and summarises without claiming anything beyond the data in hand.","tree":true,"id":"1.3"},{"s":"stats","t":"infstat","sc":"You want conclusions about a bigger group","w":"Uses a sample to make claims about a population, with a known error rate.","tree":true,"id":"1.6"},{"s":"C1","t":"pop","sc":"Define who you want to learn about","w":"Every conclusion is about some population, so define it first.","tree":true,"id":"1.9"},{"s":"pop","t":"sample","sc":"Measuring everyone is impossible or too costly","w":"A well-chosen subset lets you estimate population values cheaply.","tree":true,"c":"Any sample differs from the population by chance (sampling error).","id":"1.10"},{"s":"pop","t":"paramstat","sc":"Naming a number correctly","w":"Keeps clear whether a value is the truth or an estimate of it.","tree":true,"id":"1.21"},{"s":"sample","t":"sampling","sc":"Choosing who gets into the sample","w":"How you pick the sample decides whether it represents the population.","tree":true,"id":"1.11"},{"s":"sampling","t":"srs","sc":"Population is fairly uniform and you can list it","w":"Every member has the same chance of selection, so the sample is unbiased on average.","tree":true,"c":"Can miss small subgroups purely by chance.","id":"1.12"},{"s":"sampling","t":"strat","sc":"Population has subgroups you must represent","w":"Sampling inside each non-overlapping stratum guarantees every group is covered.","tree":true,"c":"Needs the stratum of every member in advance.","id":"1.13"},{"s":"sampling","t":"systematic","sc":"You have an ordered list or a stream of people","w":"Taking every k-th item is simple and spreads the sample evenly.","tree":true,"c":"Biased if the list has a pattern that repeats every k items.","id":"1.14"},{"s":"sampling","t":"cluster","sc":"Population is spread out and listing everyone is costly","w":"Randomly choose whole clusters (schools, towns) and measure everyone inside them.","tree":true,"c":"Less precise when clusters differ a lot from each other.","id":"1.15"},{"s":"sampling","t":"convenience","sc":"Need quick, cheap data and can accept bias","w":"Only people who are easy to reach or interested take part, so it's fast.","tree":true,"c":"Rarely representative, so results may not generalise.","id":"1.16"},{"s":"sample","t":"bias","sc":"Results look off or don't generalise","w":"Naming the bias tells you which conclusions to distrust.","tree":true,"id":"1.17"},{"s":"bias","t":"survivor","sc":"You only see the cases that made it through","w":"Reminds you to ask about the failures that were filtered out.","tree":true,"id":"1.18"},{"s":"sample","t":"samperr","sc":"Even a perfect random sample isn't exact","w":"Chance variation between sample and population that shrinks as n grows.","tree":true,"id":"1.19"},{"s":"C1","t":"variable","sc":"Describing what you measured","w":"The type of each variable decides which summaries, plots and tests are valid.","tree":true,"id":"1.22"},{"s":"variable","t":"quant","sc":"Values are numbers you can add or subtract","w":"Arithmetic makes sense, so means, SDs and histograms apply.","tree":true,"id":"1.23"},{"s":"quant","t":"discrete","sc":"Values are countable whole numbers","w":"Counts call for PMFs and bar-style plots.","tree":true,"id":"1.24"},{"s":"quant","t":"continuous","sc":"Values can fall anywhere in a range","w":"Measurements call for PDFs and histograms.","tree":true,"id":"1.26"},{"s":"variable","t":"qual","sc":"Values are labels or groups","w":"Allows counts, proportions, the mode and chi-square tests.","tree":true,"id":"1.28"},{"s":"variable","t":"scales","sc":"Deciding which operations are valid on a variable","w":"The scale says whether order, differences or ratios mean anything.","tree":true,"id":"1.30"},{"s":"scales","t":"nominal","sc":"Categories with no order","w":"Only counting and the mode make sense.","tree":true,"id":"1.31"},{"s":"scales","t":"ordinal","sc":"Categories have a meaningful order","w":"Ranks and medians are valid, but the gaps between ranks aren't equal.","tree":true,"id":"1.33"},{"s":"scales","t":"interval","sc":"Differences matter but zero is arbitrary","w":"Means and differences are valid; ratios are not.","tree":true,"id":"1.35"},{"s":"scales","t":"ratio","sc":"There is a true zero","w":"All arithmetic, including ratios, is meaningful.","tree":true,"id":"1.36"},{"s":"C1","t":"obsexp","sc":"Deciding whether you can claim cause and effect","w":"Only randomised experiments control hidden confounders.","tree":true,"c":"Experiments can be costly, slow or unethical, so much data science is observational.","id":"1.37"},{"s":"ROOT","t":"C2","sc":"You have a dataset and need to summarise it","w":"Centre, spread, position and shape describe any variable in a handful of numbers.","tree":true,"id":"0.2"},{"s":"C2","t":"central","sc":"You need one number for the 'typical' value","w":"Describes where the centre of the data sits; used in EDA and feature engineering.","tree":true,"id":"2.1"},{"s":"central","t":"mean","sc":"Data is roughly symmetric with no big outliers","w":"Uses every value, so it's the most efficient summary for symmetric data.","tree":true,"c":"A single extreme value can drag it far from the centre.","id":"2.2"},{"s":"mean","t":"wmean","sc":"Some values count more than others","w":"Weights reflect importance or group size.","tree":true,"id":"2.3"},{"s":"mean","t":"trimmed","sc":"Want a mean that resists a few outliers","w":"Dropping the top and bottom k% keeps most information while removing extremes.","tree":true,"id":"2.4"},{"s":"mean","t":"geomean","sc":"Averaging growth rates or ratios","w":"Multiplicative data averages correctly only with a geometric mean.","tree":true,"id":"2.5"},{"s":"mean","t":"harmean","sc":"Averaging rates such as speeds","w":"Gives the right average when values are rates per unit.","tree":true,"id":"2.6"},{"s":"central","t":"median","sc":"Data is skewed or has outliers","w":"Depends only on the middle position, so extreme values barely move it.","tree":true,"c":"Ignores how large values are, so it's less efficient for clean symmetric data.","id":"2.7"},{"s":"central","t":"mode","sc":"Data is categorical or you want the most common value","w":"The only measure of centre that works for labels.","tree":true,"id":"2.9"},{"s":"central","t":"outliereff","sc":"Choosing between mean and median","w":"Outliers pull the mean toward the tail but barely move the median, so a big gap signals skew.","tree":true,"id":"2.11"},{"s":"C2","t":"dispersion","sc":"Two datasets share a mean but look different","w":"Spread tells you how far values typically sit from the centre.","tree":true,"id":"2.12"},{"s":"dispersion","t":"range","sc":"You want the quickest spread measure","w":"Max − min needs no computation.","tree":true,"c":"Uses only two values, so a single outlier dominates it.","id":"2.13"},{"s":"dispersion","t":"variance","sc":"Need a spread measure that uses every value","w":"Averages squared distances from the mean; the foundation of most tests and models.","tree":true,"c":"It's in squared units, so it is hard to read directly.","id":"2.14"},{"s":"variance","t":"bessel","sc":"Computing variance from a sample","w":"x̄ is fitted to the same data, so deviations from it are too small; dividing by n − 1 removes that bias.","tree":true,"id":"2.15"},{"s":"bessel","t":"dof","sc":"A formula or table asks for df","w":"Counts how many values are still free to vary after estimating parameters.","tree":true,"id":"2.16"},{"s":"variance","t":"sd","sc":"Need spread in the original units","w":"The square root of variance reads as 'typical distance from the mean'.","tree":true,"c":"Inflated by outliers, just like the mean.","id":"2.18"},{"s":"sd","t":"cv","sc":"Comparing spread across different units or scales","w":"Expressing the SD as a percentage of the mean makes variability unit-free.","tree":true,"c":"Meaningless when the mean is near zero or the data isn't on a ratio scale.","id":"2.19"},{"s":"dispersion","t":"mad","sc":"Need a spread measure that ignores outliers","w":"Absolute deviations from the median resist extreme values.","tree":true,"id":"2.21"},{"s":"C2","t":"position","sc":"You need to know where a value stands","w":"Locates a value inside the distribution relative to everyone else.","tree":true,"id":"2.22"},{"s":"position","t":"percentile","sc":"Ranking a value against everyone else","w":"Says what share of observations fall below a value.","tree":true,"id":"2.23"},{"s":"percentile","t":"prank","sc":"You have a value and want its percentile","w":"Count the values below it and convert to a percentage.","tree":true,"id":"2.24"},{"s":"percentile","t":"pvalueat","sc":"You have a percentile and want the value","w":"Turns a percentage into a position in the sorted data.","tree":true,"id":"2.25"},{"s":"percentile","t":"quartile","sc":"Splitting data into four equal parts","w":"Q1, Q2 and Q3 mark the 25%, 50% and 75% points.","tree":true,"id":"2.26"},{"s":"quartile","t":"fivenum","sc":"Summarise a distribution in five numbers","w":"Minimum, Q1, median, Q3 and maximum show centre, spread and skew at once.","tree":true,"id":"2.27"},{"s":"quartile","t":"iqr","sc":"Need spread that ignores extremes","w":"Covers the middle 50% of the data, so outliers can't move it.","tree":true,"id":"2.28"},{"s":"iqr","t":"fences","sc":"Flagging outliers without assuming normality","w":"Points beyond the fences are unusually far from the middle half.","tree":true,"id":"2.29"},{"s":"C2","t":"shape","sc":"Centre and spread aren't the whole story","w":"Symmetry and tail weight decide which summary and which test to trust.","tree":true,"id":"2.33"},{"s":"shape","t":"skew","sc":"One tail is longer than the other","w":"Measures asymmetry; tells you mean ≠ median and that normal-based tools may mislead.","tree":true,"id":"2.34"},{"s":"skew","t":"rskew","sc":"A few very large values stretch the right tail","w":"Mean > median > mode; a log transform often makes it symmetric.","tree":true,"id":"2.35"},{"s":"skew","t":"lskew","sc":"A few very small values stretch the left tail","w":"Mean < median < mode.","tree":true,"id":"2.37"},{"s":"shape","t":"kurt","sc":"Worried about extreme values in the tails","w":"Measures tail heaviness, i.e. how outlier-prone the data is.","tree":true,"id":"2.38"},{"s":"ROOT","t":"C3","sc":"You want to see the data before modelling it","w":"Plots expose problems (outliers, skew, non-linearity) before they break a model.","tree":true,"id":"0.3"},{"s":"C3","t":"freqdist","sc":"Count how often each value occurs","w":"The first step to seeing the shape of any variable.","tree":true,"id":"3.1"},{"s":"freqdist","t":"relfreq","sc":"Comparing groups of different sizes, or asking 'how many up to x'","w":"Proportions are comparable across groups; running totals give percentiles.","tree":true,"id":"3.2"},{"s":"C3","t":"barchart","sc":"Comparing counts of categories","w":"Bar lengths are easy to compare across categories.","tree":true,"id":"3.3"},{"s":"barchart","t":"pie","sc":"Showing parts of a whole with only a few categories","w":"Shows each category's share of the total at a glance.","tree":true,"c":"Similar slices are hard to compare; use bars beyond about five categories.","id":"3.4"},{"s":"C3","t":"histogram","sc":"Seeing the shape of a continuous variable","w":"Binning values reveals centre, spread, skew and multiple modes.","tree":true,"id":"3.5"},{"s":"histogram","t":"bins","sc":"A histogram looks too jagged or too flat","w":"Too few bins hide the shape; too many show noise.","tree":true,"id":"3.6"},{"s":"histogram","t":"kde","sc":"Want a smooth version of the histogram","w":"Places a small bump on every point and adds them up to estimate the PDF.","tree":true,"c":"The bandwidth changes the picture, and the curve can leak beyond the data's range.","id":"3.7"},{"s":"C3","t":"boxplot","sc":"Comparing spread and spotting outliers quickly","w":"Draws the five-number summary and flags points beyond the fences.","tree":true,"id":"3.8"},{"s":"boxplot","t":"violin","sc":"Need the box plot plus the shape","w":"A mirrored KDE shows multiple modes that a box plot hides.","tree":true,"id":"3.9"},{"s":"C3","t":"scatter","sc":"Seeing how two numeric variables relate","w":"Shows direction, strength, curvature and outliers of a relationship.","tree":true,"id":"3.10"},{"s":"scatter","t":"pairplot","sc":"Exploring many numeric variables at once","w":"A grid of scatter plots for every pair, with distributions on the diagonal.","tree":true,"id":"3.11"},{"s":"scatter","t":"heatmap","sc":"Scanning many correlations at once","w":"Colour-codes the correlation matrix so strong pairs stand out.","tree":true,"id":"3.12"},{"s":"C3","t":"qqplot","sc":"Checking whether data is normally distributed","w":"Points on the diagonal mean the sample quantiles match a normal distribution's.","tree":true,"c":"Judged by eye; pair it with a formal test for small samples.","id":"3.15"},{"s":"C3","t":"ecdf","sc":"Reading percentiles straight off a plot","w":"A step curve of cumulative proportions with no binning choices.","tree":true,"id":"3.17"},{"s":"C3","t":"lineplot","sc":"Data is ordered in time","w":"Connecting points in time order shows trends and seasonality.","tree":true,"id":"3.18"},{"s":"descstat","t":"central","sc":"Ready to compute the summary numbers","w":"Central tendency and dispersion are the core descriptive statistics.","tree":false,"id":"1.4"},{"s":"descstat","t":"histogram","sc":"Want to see the data as a picture","w":"Charts are the visual half of descriptive statistics.","tree":false,"id":"1.5"},{"s":"infstat","t":"ht","sc":"Testing a specific claim about the population","w":"Hypothesis testing is the decision-making half of inference.","tree":false,"id":"1.7"},{"s":"infstat","t":"ci","sc":"Estimating a population value with a range","w":"Confidence intervals are the estimation half of inference.","tree":false,"id":"1.8"},{"s":"samperr","t":"se","sc":"Need to measure the size of sampling error","w":"The standard error is exactly the typical size of the sampling error.","tree":false,"id":"1.20"},{"s":"discrete","t":"pmf","sc":"Assigning probabilities to each count","w":"Discrete variables are modelled with probability mass functions.","tree":false,"id":"1.25"},{"s":"continuous","t":"pdfn","sc":"Assigning probabilities to ranges of values","w":"Continuous variables are modelled with probability density functions.","tree":false,"id":"1.27"},{"s":"qual","t":"chiind","sc":"Testing whether two categorical variables are related","w":"Chi-square tests work on counts of categories.","tree":false,"id":"1.29"},{"s":"nominal","t":"encoding","sc":"Feeding a nominal variable into a model","w":"Unordered labels are usually one-hot encoded.","tree":false,"id":"1.32"},{"s":"ordinal","t":"spearman","sc":"Correlating ranked data","w":"Spearman's correlation is built on ranks, so it suits ordinal data.","tree":false,"id":"1.34"},{"s":"obsexp","t":"ab","sc":"You can run a randomised experiment","w":"A/B tests are the data-science form of a controlled experiment.","tree":false,"id":"1.38"},{"s":"obsexp","t":"confounder","sc":"You only have observational data","w":"Confounders are the main threat to causal claims from observational data.","tree":false,"id":"1.39"},{"s":"mode","t":"imputation","sc":"Filling missing values in a categorical column","w":"Mode imputation is the standard fill for categories.","tree":false,"id":"2.10"},{"s":"median","t":"imputation","sc":"Filling missing values in a skewed column with outliers","w":"Median imputation isn't pulled by outliers the way mean imputation is.","tree":false,"id":"2.8"},{"s":"dof","t":"tdist","sc":"Looking up a t critical value","w":"The t-distribution's shape is set by the degrees of freedom.","tree":false,"id":"2.17"},{"s":"sd","t":"zscore","sc":"Expressing a value in units of standard deviations","w":"A z-score divides the distance from the mean by the SD.","tree":false,"id":"2.20"},{"s":"position","t":"zscore","sc":"Comparing positions across different scales","w":"z-scores put any variable on a common scale.","tree":false,"id":"2.32"},{"s":"fences","t":"boxplot","sc":"Drawing the fences and outliers","w":"A box plot is the picture of the 1.5 × IQR rule.","tree":false,"id":"2.30"},{"s":"iqr","t":"robust","sc":"Scaling features that contain outliers","w":"Robust scaling divides by the IQR instead of the SD.","tree":false,"id":"2.31"},{"s":"rskew","t":"logtrans","sc":"Need to make right-skewed data symmetric","w":"A log transform compresses the long right tail.","tree":false,"id":"2.36"},{"s":"kurt","t":"powerlaw","sc":"Tails are extremely heavy","w":"Power-law data has far more extreme values than a normal.","tree":false,"id":"2.39"},{"s":"scatter","t":"pearson","sc":"Need a number for the strength of the pattern","w":"Pearson's r quantifies the linear trend a scatter plot shows.","tree":false,"id":"3.14"},{"s":"heatmap","t":"multicol","sc":"Two predictors are very highly correlated","w":"Highly correlated inputs cause multicollinearity in regression.","tree":false,"id":"3.13"},{"s":"qqplot","t":"shapiro","sc":"Need a formal normality test","w":"Shapiro–Wilk gives a p-value for the same question.","tree":false,"id":"3.16"},{"s":"lineplot","t":"tscomp","sc":"Separating trend from seasonality","w":"Time-series decomposition splits the line into components.","tree":false,"id":"3.19"},{"s":"ROOT","t":"C4","sc":"You need to reason about uncertainty","w":"Probability turns 'how likely?' into numbers you can combine and compare.","tree":true,"id":"0.4"},{"s":"C4","t":"prob","sc":"Quantify how likely an event is","w":"A number from 0 (impossible) to 1 (certain) that can be combined with simple rules.","tree":true,"id":"4.1"},{"s":"prob","t":"samplespace","sc":"Setting up a probability problem","w":"Listing every outcome makes sure probabilities add to 1.","tree":true,"id":"4.2"},{"s":"prob","t":"complement","sc":"'At least one' or 'not' questions","w":"Often it's easier to compute the opposite and subtract from 1.","tree":true,"id":"4.3"},{"s":"prob","t":"addition","sc":"Probability that A or B happens","w":"Add both, then subtract the overlap that was counted twice.","tree":true,"id":"4.4"},{"s":"addition","t":"mutex","sc":"Events can't happen together","w":"With zero overlap, probabilities simply add.","tree":true,"c":"Mutually exclusive is not independent: if one happens the other can't, which is strong dependence.","id":"4.5"},{"s":"prob","t":"multrule","sc":"Probability that A and B both happen","w":"Chain the probabilities, using the conditional one when events are dependent.","tree":true,"id":"4.6"},{"s":"multrule","t":"indep","sc":"One event doesn't change the other's chance","w":"The joint probability is just the product.","tree":true,"id":"4.7"},{"s":"prob","t":"condprob","sc":"You already know something happened","w":"Shrinks the sample space to the known event.","tree":true,"id":"4.8"},{"s":"condprob","t":"bayes","sc":"You know P(evidence | cause) but need P(cause | evidence)","w":"Flips a conditional probability using the base rate (prior).","tree":true,"c":"The answer is only as good as the prior you plug in.","id":"4.9"},{"s":"bayes","t":"totalprob","sc":"Need P(evidence) for the Bayes denominator","w":"Adds up every way the evidence can happen.","tree":true,"id":"4.10"},{"s":"condprob","t":"jointmarg","sc":"Working from a two-way table","w":"Joint = cell / total; marginal = row or column total / total; conditional = cell / row total.","tree":true,"id":"4.13"},{"s":"C4","t":"counting","sc":"Need the number of possible outcomes","w":"Probabilities of equally likely outcomes need counts.","tree":true,"id":"4.15"},{"s":"counting","t":"perm","sc":"Order matters","w":"Counts the ways to arrange r items from n.","tree":true,"id":"4.16"},{"s":"counting","t":"comb","sc":"Order doesn't matter","w":"Counts selections; it's the coefficient in the binomial formula.","tree":true,"id":"4.17"},{"s":"C4","t":"rv","sc":"Outcomes need to be numbers","w":"Maps outcomes to numbers so you can compute averages and spreads.","tree":true,"id":"4.18"},{"s":"rv","t":"pmf","sc":"The variable is discrete","w":"Gives P(X = x) for each value; the bars sum to 1.","tree":true,"id":"4.19"},{"s":"rv","t":"pdfn","sc":"The variable is continuous","w":"The area under the curve over an interval is the probability of landing in it.","tree":true,"c":"P(X = one exact value) = 0; only intervals have probability.","id":"4.21"},{"s":"rv","t":"cdf","sc":"Need P(X ≤ x)","w":"Accumulates the PMF or PDF; a z-table is the normal CDF.","tree":true,"id":"4.23"},{"s":"rv","t":"expect","sc":"Need the long-run average of a random variable","w":"A probability-weighted average of outcomes; the basis of decisions under uncertainty.","tree":true,"id":"4.24"},{"s":"expect","t":"varrv","sc":"Need the spread of a random variable","w":"The expected squared distance from E[X].","tree":true,"id":"4.25"},{"s":"C4","t":"lln","sc":"Why bigger samples are more reliable","w":"The sample mean converges to the true mean as n grows.","tree":true,"c":"It says nothing about the shape of the sampling distribution; that's the CLT.","id":"4.26"},{"s":"ROOT","t":"C5","sc":"You need a model for how values are spread","w":"Named distributions give known shapes, means, variances and tables.","tree":true,"id":"0.5"},{"s":"C5","t":"discdist","sc":"Outcomes are counts","w":"PMFs for success/failure trials and event counts.","tree":true,"id":"5.1"},{"s":"discdist","t":"bernoulli","sc":"A single trial with two outcomes","w":"Models one yes/no event with success probability p.","tree":true,"id":"5.2"},{"s":"bernoulli","t":"binomial","sc":"Counting successes in n independent yes/no trials","w":"The sum of n Bernoulli trials with the same p.","tree":true,"c":"Needs fixed n, independent trials and a constant p.","id":"5.3"},{"s":"discdist","t":"poisson","sc":"Counting events in a fixed time or space window","w":"Models rare, independent events arriving at a constant average rate λ.","tree":true,"c":"Assumes mean = variance; over-dispersed counts need a negative binomial.","id":"5.6"},{"s":"discdist","t":"geometric","sc":"Counting trials until the first success","w":"Models waiting time measured in discrete attempts.","tree":true,"id":"5.8"},{"s":"discdist","t":"dunif","sc":"All outcomes equally likely","w":"Each of k values has probability 1/k.","tree":true,"id":"5.9"},{"s":"binomial","t":"hypergeo","sc":"Sampling without replacement from a small population","w":"Like the binomial, but each draw changes the odds for the next.","tree":true,"id":"5.4"},{"s":"C5","t":"contdist","sc":"Outcomes are measurements","w":"PDFs for heights, durations, errors and test statistics.","tree":true,"id":"5.10"},{"s":"contdist","t":"normal","sc":"Values cluster symmetrically around a mean","w":"The bell curve, fully described by μ and σ; sums and averages tend toward it.","tree":true,"id":"5.11"},{"s":"normal","t":"empirical","sc":"Quick ranges for roughly normal data","w":"About 68% of values lie within 1σ, 95% within 2σ and 99.7% within 3σ.","tree":true,"c":"Only valid for approximately normal data; use Chebyshev's bound otherwise.","id":"5.12"},{"s":"empirical","t":"chebyshev","sc":"Need a guarantee for any distribution shape","w":"Gives a minimum share within k SDs, whatever the distribution.","tree":true,"id":"5.13"},{"s":"normal","t":"stdnormal","sc":"Need one table for every normal variable","w":"A normal with μ = 0 and σ = 1; any normal converts to it with z-scores.","tree":true,"id":"5.14"},{"s":"stdnormal","t":"zscore","sc":"How many SDs is a value from the mean?","w":"Puts values from different scales onto one comparable scale.","tree":true,"id":"5.15"},{"s":"zscore","t":"ztable","sc":"Turning a z-score into a probability","w":"Gives the area to the left of z, i.e. the normal CDF.","tree":true,"id":"5.16"},{"s":"contdist","t":"lognormal","sc":"Positive values with a long right tail","w":"If ln(X) is normal then X is log-normal, so a log transform makes it Gaussian.","tree":true,"id":"5.22"},{"s":"contdist","t":"cunif","sc":"Any value in [a, b] is equally likely","w":"A flat PDF; random-number generators start here.","tree":true,"id":"5.23"},{"s":"contdist","t":"exponential","sc":"Time until the next event","w":"Models waiting times between Poisson events; it is memoryless.","tree":true,"id":"5.24"},{"s":"exponential","t":"gammadist","sc":"Waiting time for several events","w":"The sum of k exponential waits; a flexible right-skewed shape.","tree":true,"id":"5.25"},{"s":"contdist","t":"powerlaw","sc":"A few items account for most of the total","w":"Heavy-tailed; it is behind the 80/20 rule.","tree":true,"c":"The mean and variance can be infinite, so averages mislead.","id":"5.26"},{"s":"contdist","t":"tdist","sc":"Population SD is unknown and n is small","w":"Bell-shaped with heavier tails; approaches the normal as df grows.","tree":true,"id":"5.27"},{"s":"contdist","t":"chi2dist","sc":"Working with sums of squared normals or count tests","w":"Right-skewed and set by df; the reference for chi-square tests and variance intervals.","tree":true,"id":"5.29"},{"s":"contdist","t":"fdist","sc":"Comparing two variances","w":"The ratio of two scaled chi-squares; used in ANOVA and regression F-tests.","tree":true,"id":"5.31"},{"s":"contdist","t":"betadist","sc":"Modelling an unknown probability between 0 and 1","w":"A flexible shape on [0, 1] and the conjugate prior for binomial data.","tree":true,"id":"5.33"},{"s":"normal","t":"mvn","sc":"Several correlated normal variables at once","w":"Described by a mean vector and a covariance matrix; used by PCA, LDA and Gaussian processes.","tree":true,"id":"5.20"},{"s":"C5","t":"normtest","sc":"A method assumes normal data","w":"Combine a Q-Q plot, skewness and kurtosis, and a formal test before trusting normal-based tools.","tree":true,"id":"5.35"},{"s":"ROOT","t":"C6","sc":"You only have a sample but care about the population","w":"Estimates and intervals quantify what one sample says about the whole population.","tree":true,"id":"0.6"},{"s":"C6","t":"sampdist","sc":"A statistic changes from sample to sample","w":"Its spread tells you how much to trust the value from one sample.","tree":true,"id":"6.1"},{"s":"sampdist","t":"clt","sc":"Population isn't normal but you need normal-based inference","w":"Means of samples of n ≥ 30 are approximately normal, whatever the population looks like.","tree":true,"c":"Breaks down for extremely heavy tails (infinite variance) and for small n with strong skew.","id":"6.2"},{"s":"sampdist","t":"se","sc":"Need the precision of an estimate","w":"The SD of the sampling distribution; it shrinks with √n.","tree":true,"id":"6.4"},{"s":"C6","t":"pointest","sc":"Need one best guess for a parameter","w":"Uses a sample statistic (x̄, p̂, s) to estimate μ, p or σ.","tree":true,"c":"A single number says nothing about how uncertain it is.","id":"6.6"},{"s":"pointest","t":"ci","sc":"Need a range that probably contains the parameter","w":"Point estimate ± margin of error, at a stated confidence level.","tree":true,"id":"6.7"},{"s":"ci","t":"ciz","sc":"The population SD is known","w":"Use z critical values from the normal table.","tree":true,"id":"6.8"},{"s":"ci","t":"cit","sc":"Only the sample SD is available","w":"Use t critical values with n − 1 df, which widens the interval for small n.","tree":true,"id":"6.9"},{"s":"ci","t":"ciprop","sc":"Estimating a percentage","w":"Uses the normal approximation to the binomial.","tree":true,"id":"6.10"},{"s":"ci","t":"moe","sc":"Deciding how precise an estimate must be","w":"Critical value × standard error; it halves when n quadruples.","tree":true,"id":"6.11"},{"s":"moe","t":"samplesize","sc":"Planning how much data to collect","w":"Solve the margin-of-error formula for n.","tree":true,"id":"6.12"},{"s":"ci","t":"cilevel","sc":"Explaining a confidence interval correctly","w":"If you repeated the study many times, 95% of the intervals built would contain the true parameter.","tree":true,"c":"It is not a 95% probability that this particular interval contains μ; that statement needs a Bayesian credible interval.","id":"6.13"},{"s":"C6","t":"estimator","sc":"Choosing between ways to estimate a parameter","w":"Good estimators are unbiased, consistent and efficient.","tree":true,"id":"6.15"},{"s":"estimator","t":"unbiased","sc":"Does the estimator hit the target on average?","w":"An unbiased estimator has E[θ̂] = θ.","tree":true,"id":"6.16"},{"s":"estimator","t":"consistent","sc":"Comparing two valid estimators","w":"Consistent estimators converge to θ as n grows; efficient ones have the smallest variance.","tree":true,"id":"6.17"},{"s":"estimator","t":"mle","sc":"Fitting a model's parameters to data","w":"Picks the parameter values that make the observed data most probable.","tree":true,"c":"Can overfit small samples and can be biased (the MLE of σ² divides by n).","id":"6.18"},{"s":"estimator","t":"mom","sc":"Need a quick, simple estimator","w":"Match sample moments (mean, variance) to theoretical ones and solve for the parameters.","tree":true,"id":"6.20"},{"s":"C6","t":"bootstrap","sc":"No formula exists for a statistic's SE or CI","w":"Resample the data with replacement many times and use the spread of the recomputed statistic.","tree":true,"c":"Assumes the sample represents the population; weak for tiny samples and for statistics like the max.","id":"6.21"},{"s":"bootstrap","t":"jackknife","sc":"Estimating bias or variance cheaply","w":"Recompute the statistic leaving out one observation at a time.","tree":true,"id":"6.22"},{"s":"bayes","t":"bayesinf","sc":"Updating a whole parameter distribution, not one event","w":"Bayesian inference applies the same theorem to model parameters.","tree":false,"id":"4.11"},{"s":"bayes","t":"naivebayes","sc":"Classifying text or emails with Bayes","w":"Naive Bayes applies the theorem per class.","tree":false,"id":"4.12"},{"s":"jointmarg","t":"chiind","sc":"Testing whether the row and column variables are related","w":"The chi-square test compares a table with what independence predicts.","tree":false,"id":"4.14"},{"s":"pmf","t":"binomial","sc":"Counting successes in fixed trials","w":"The binomial is the most-used PMF.","tree":false,"id":"4.20"},{"s":"pdfn","t":"normal","sc":"Data clusters in a bell shape","w":"The normal is the most-used PDF.","tree":false,"id":"4.22"},{"s":"lln","t":"clt","sc":"You need the shape of the sample mean's distribution, not just its limit","w":"The CLT says that shape is normal.","tree":false,"id":"4.27"},{"s":"binomial","t":"zprop","sc":"n is large and you're testing a proportion","w":"For large n the binomial is approximately normal, so a z-test works.","tree":false,"id":"5.5"},{"s":"poisson","t":"exponential","sc":"You care about the gaps between events, not the count","w":"Waiting times between Poisson events are exponential.","tree":false,"id":"5.7"},{"s":"zscore","t":"standardize","sc":"Scaling features for a model","w":"Standardization applies the z-score to every value.","tree":false,"id":"5.18"},{"s":"zscore","t":"zoutlier","sc":"Flagging extreme values","w":"Values with |z| > 3 are rare under normality.","tree":false,"id":"5.19"},{"s":"ztable","t":"pvalue","sc":"Turning a test statistic into a p-value","w":"The p-value is a tail area from the same table.","tree":false,"id":"5.17"},{"s":"tdist","t":"ttest1","sc":"Testing a mean with σ unknown","w":"The t-test uses this distribution.","tree":false,"id":"5.28"},{"s":"chi2dist","t":"chigof","sc":"Comparing observed and expected counts","w":"The test statistic follows a chi-square distribution.","tree":false,"id":"5.30"},{"s":"fdist","t":"anova","sc":"Comparing several group means","w":"ANOVA's F statistic follows this distribution.","tree":false,"id":"5.32"},{"s":"betadist","t":"conjugate","sc":"Updating a belief about a conversion rate","w":"The beta is the conjugate prior for binomial data.","tree":false,"id":"5.34"},{"s":"mvn","t":"covmatrix","sc":"Need the matrix that defines the shape","w":"A multivariate normal is parameterised by its covariance matrix.","tree":false,"id":"5.21"},{"s":"normtest","t":"qqplot","sc":"Checking normality by eye","w":"Points on a straight line suggest normality.","tree":false,"id":"5.36"},{"s":"normtest","t":"shapiro","sc":"Need a p-value for normality","w":"Shapiro–Wilk is the usual formal test.","tree":false,"id":"5.37"},{"s":"se","t":"ciz","sc":"Building an interval around a mean","w":"A CI is the estimate ± critical value × SE.","tree":false,"id":"6.5"},{"s":"clt","t":"ztest","sc":"Testing a mean with a large sample","w":"The CLT justifies the normal reference distribution.","tree":false,"id":"6.3"},{"s":"cilevel","t":"credible","sc":"You want a direct probability statement about the parameter","w":"A Bayesian credible interval says exactly that.","tree":false,"id":"6.14"},{"s":"mle","t":"likelihood","sc":"Combining the likelihood with prior knowledge","w":"Bayesian inference multiplies the likelihood by a prior.","tree":false,"id":"6.19"},{"s":"bootstrap","t":"cvvsboot","sc":"Confusing bootstrap with cross-validation","w":"They answer different questions: statistic variability vs model performance.","tree":false,"id":"6.23"},{"s":"lln","t":"montecarlo","sc":"The probability is too hard to work out exactly","w":"Simulate the random process many times and count the outcomes; error shrinks like 1/√(runs).","tree":true,"id":"4.28"},{"s":"ROOT","t":"C7","sc":"You must decide whether an effect is real or noise","w":"A test fixes the false-alarm rate before you look at the evidence.","tree":true,"id":"0.7"},{"s":"C7","t":"ht","sc":"Deciding if an observed difference is real","w":"Assume no effect, then ask whether the data would be too surprising under that assumption.","tree":true,"id":"7.1"},{"s":"ht","t":"h0","sc":"Stating the default claim","w":"The status quo you look for evidence against, like 'innocent until proven guilty'.","tree":true,"id":"7.2"},{"s":"h0","t":"h1","sc":"Stating what you suspect","w":"What you accept when the evidence against H₀ is strong enough.","tree":true,"id":"7.3"},{"s":"ht","t":"htsteps","sc":"Running any test end to end","w":"The same five steps work for z, t, chi-square and ANOVA.","tree":true,"id":"7.4"},{"s":"htsteps","t":"teststat","sc":"Summarising the evidence in one number","w":"Measures how far the sample is from H₀, in standard-error units.","tree":true,"id":"7.5"},{"s":"ht","t":"alpha","sc":"Setting how much false-alarm risk you accept","w":"α is the probability of rejecting a true H₀; usually 0.05.","tree":true,"id":"7.6"},{"s":"alpha","t":"critval","sc":"Turning α into a decision boundary","w":"A statistic beyond the critical value falls in the rejection region.","tree":true,"id":"7.7"},{"s":"critval","t":"tails","sc":"Deciding the direction of the alternative","w":"Two-tailed tests detect any difference; one-tailed tests look in one direction and have more power there.","tree":true,"c":"Choosing the tail after seeing the data inflates false positives.","id":"7.8"},{"s":"ht","t":"pvalue","sc":"Measuring how surprising the data is under H₀","w":"The probability of a result at least this extreme if H₀ were true; reject H₀ when p ≤ α.","tree":true,"c":"It is not the probability that H₀ is true, and it says nothing about the size of the effect.","id":"7.10"},{"s":"pvalue","t":"stat_vs_prac","sc":"A tiny p-value on a huge dataset","w":"With very large n, trivial effects become significant; judge the effect size and CI too.","tree":true,"id":"7.11"},{"s":"ht","t":"errors","sc":"Understanding how a test can be wrong","w":"Type I: reject a true H₀ (false positive, probability α). Type II: keep a false H₀ (false negative, probability β).","tree":true,"id":"7.17"},{"s":"errors","t":"power","sc":"Making sure a real effect would be detected","w":"Power = 1 − β; it rises with effect size, sample size and α.","tree":true,"id":"7.18"},{"s":"power","t":"effectsize","sc":"Is the difference big enough to matter?","w":"A standardised size of an effect that doesn't depend on n.","tree":true,"id":"7.19"},{"s":"power","t":"poweranalysis","sc":"Planning a study's sample size","w":"Choose α, target power and the smallest effect you care about, then solve for n.","tree":true,"id":"7.20"},{"s":"pvalue","t":"multiple","sc":"Running many tests at once","w":"Each extra test adds a chance of a false positive.","tree":true,"id":"7.12"},{"s":"multiple","t":"bonferroni","sc":"Need strict control of any false positive","w":"Test each hypothesis at α / m.","tree":true,"c":"Very conservative; with many tests it loses a lot of power.","id":"7.13"},{"s":"multiple","t":"fdr","sc":"Many tests and a few false positives are acceptable","w":"Controls the expected share of false discoveries; more power than Bonferroni.","tree":true,"id":"7.14"},{"s":"multiple","t":"phacking","sc":"Results look too good to be true","w":"Trying many analyses and reporting only the significant ones inflates false positives.","tree":true,"id":"7.15"},{"s":"ht","t":"paramnon","sc":"Unsure whether distribution assumptions hold","w":"Parametric tests assume a distribution (often normal) and are more powerful when it holds; non-parametric tests use ranks and need fewer assumptions.","tree":true,"id":"7.23"},{"s":"ROOT","t":"C8","sc":"You know the question; now pick the right test","w":"Using the wrong test gives wrong p-values even with perfect data.","tree":true,"id":"0.8"},{"s":"C8","t":"choosetest","sc":"Picking the right test for your data","w":"Answer three questions: what type is the outcome, how many groups, are they paired?","tree":true,"id":"8.1"},{"s":"C8","t":"meantests","sc":"Comparing averages","w":"z, t and ANOVA compare means against a value or across groups.","tree":true,"id":"8.7"},{"s":"meantests","t":"ztest","sc":"n ≥ 30, or the population SD is known","w":"Compares a sample mean with a claimed mean using the normal distribution.","tree":true,"id":"8.8"},{"s":"ztest","t":"ztwo","sc":"Two large samples, or known SDs","w":"Normal-based comparison of two means.","tree":true,"id":"8.9"},{"s":"meantests","t":"ttest1","sc":"σ unknown and n < 30","w":"Same idea as the z-test but uses s and the t-distribution with n − 1 df.","tree":true,"id":"8.10"},{"s":"meantests","t":"ttest2","sc":"Comparing the means of two separate groups","w":"Tests whether two population means differ.","tree":true,"id":"8.11"},{"s":"ttest2","t":"welch","sc":"Groups have unequal variances or sizes","w":"Doesn't assume equal variances; a safe default for two groups.","tree":true,"id":"8.12"},{"s":"meantests","t":"pairedt","sc":"The same subjects are measured twice","w":"Tests the mean of the differences, removing person-to-person variation.","tree":true,"id":"8.14"},{"s":"meantests","t":"anova","sc":"Comparing the means of three or more groups","w":"One test instead of many t-tests keeps the overall α at 5%.","tree":true,"c":"A significant result says some mean differs, not which one; follow with a post-hoc test.","id":"8.16"},{"s":"anova","t":"factorlevel","sc":"Setting up an ANOVA","w":"A factor is the categorical variable; levels are its values.","tree":true,"id":"8.17"},{"s":"anova","t":"oneway","sc":"One factor with independent groups","w":"Tests whether all the level means are equal.","tree":true,"id":"8.18"},{"s":"oneway","t":"ssbw","sc":"Computing an ANOVA by hand","w":"F = MS_between / MS_within; a large F means group means differ more than noise explains.","tree":true,"id":"8.19"},{"s":"anova","t":"repanova","sc":"The same subjects are measured under every level","w":"Levels are dependent, so subject-to-subject variation is removed.","tree":true,"id":"8.20"},{"s":"anova","t":"factorial","sc":"Two or more factors at once","w":"Tests each factor's main effect and their interaction in one model.","tree":true,"id":"8.22"},{"s":"factorial","t":"interaction","sc":"One factor's effect depends on another","w":"Non-parallel lines in an interaction plot signal an interaction.","tree":true,"id":"8.23"},{"s":"anova","t":"tukey","sc":"ANOVA is significant: which groups differ?","w":"Compares every pair while controlling the family-wise error rate.","tree":true,"id":"8.24"},{"s":"C8","t":"proptests","sc":"Outcomes are categories or percentages","w":"z-tests compare proportions; chi-square and Fisher compare counts in tables.","tree":true,"id":"8.28"},{"s":"proptests","t":"zprop","sc":"Comparing a sample percentage with a claimed one","w":"Uses the normal approximation to the binomial (needs np₀ ≥ 10 and n(1 − p₀) ≥ 10).","tree":true,"id":"8.29"},{"s":"zprop","t":"z2prop","sc":"Comparing the conversion rates of two groups","w":"The pooled proportion gives the standard error; the classic A/B test for rates.","tree":true,"id":"8.30"},{"s":"proptests","t":"chigof","sc":"Do observed counts match an expected distribution?","w":"Adds up squared gaps between observed and expected counts.","tree":true,"id":"8.32"},{"s":"chigof","t":"chiind","sc":"Are two categorical variables related?","w":"Compares a contingency table with the counts expected if the variables were independent.","tree":true,"id":"8.33"},{"s":"chiind","t":"fisher","sc":"A 2×2 table with small expected counts (< 5)","w":"Exact probability instead of the chi-square approximation.","tree":true,"id":"8.34"},{"s":"chiind","t":"mcnemar","sc":"Paired yes/no outcomes on the same subjects","w":"Tests whether the share of 'yes' changed between two conditions.","tree":true,"id":"8.35"},{"s":"C8","t":"vartests","sc":"Checking the assumptions behind a test","w":"Many tests need equal variances or normal data.","tree":true,"id":"8.38"},{"s":"vartests","t":"ftestvar","sc":"Are two population variances equal?","w":"The ratio s₁² / s₂² follows an F-distribution under H₀.","tree":true,"c":"Very sensitive to non-normal data; Levene's test is safer.","id":"8.39"},{"s":"vartests","t":"levene","sc":"Checking equal variances before ANOVA or a t-test","w":"Robust to non-normal data.","tree":true,"id":"8.40"},{"s":"vartests","t":"shapiro","sc":"Formally testing for normality","w":"H₀: the data is normal; a small p-value means it isn't.","tree":true,"c":"With large n, tiny harmless deviations become significant; look at the Q-Q plot too.","id":"8.41"},{"s":"shapiro","t":"kstest","sc":"Comparing a sample to any distribution, or two samples to each other","w":"Uses the largest vertical gap between two CDFs.","tree":true,"id":"8.42"},{"s":"C8","t":"nonpar","sc":"Data is ordinal, skewed, or the sample is small","w":"Rank-based tests avoid the normality assumption.","tree":true,"id":"8.43"},{"s":"nonpar","t":"mannwhitney","sc":"Two independent groups, data not normal","w":"Rank-based alternative to the two-sample t-test.","tree":true,"id":"8.44"},{"s":"nonpar","t":"wilcoxon","sc":"Paired data, differences not normal","w":"Rank-based alternative to the paired t-test.","tree":true,"id":"8.45"},{"s":"nonpar","t":"kruskal","sc":"Three or more groups, data not normal","w":"Rank-based alternative to one-way ANOVA.","tree":true,"id":"8.46"},{"s":"kruskal","t":"friedman","sc":"Repeated measures, data not normal","w":"Rank-based alternative to repeated measures ANOVA.","tree":true,"id":"8.47"},{"s":"critval","t":"ztest","sc":"Applying the boundary to a real sample","w":"The z-test is the simplest test using ±1.96.","tree":false,"id":"7.9"},{"s":"errors","t":"confmat","sc":"The same errors in a classifier","w":"FP = Type I and FN = Type II in a confusion matrix.","tree":false,"id":"7.22"},{"s":"power","t":"absize","sc":"Planning an A/B test","w":"Experiment sample sizes come from a power calculation.","tree":false,"id":"7.21"},{"s":"paramnon","t":"nonpar","sc":"Assumptions fail","w":"Rank tests are the non-parametric options.","tree":false,"id":"7.24"},{"s":"multiple","t":"tukey","sc":"Comparing all pairs after ANOVA","w":"Tukey HSD controls the error across pairs.","tree":false,"id":"7.16"},{"s":"choosetest","t":"ztest","sc":"Mean vs a value, σ known or n ≥ 30","w":"The normal reference distribution applies.","tree":false,"id":"8.2"},{"s":"choosetest","t":"ttest1","sc":"Mean vs a value, σ unknown, small n","w":"t accounts for estimating σ.","tree":false,"id":"8.3"},{"s":"choosetest","t":"pairedt","sc":"Before vs after on the same people","w":"Pairing removes between-person variation.","tree":false,"id":"8.4"},{"s":"choosetest","t":"anova","sc":"Three or more group means","w":"One F-test keeps α under control.","tree":false,"id":"8.5"},{"s":"choosetest","t":"chiind","sc":"Two categorical variables","w":"Counts in a table call for chi-square.","tree":false,"id":"8.6"},{"s":"ttest2","t":"mannwhitney","sc":"The two groups are skewed or have outliers","w":"The rank-based version doesn't need normality.","tree":false,"id":"8.13"},{"s":"pairedt","t":"wilcoxon","sc":"The differences are not normal","w":"The signed-rank test uses ranks of the differences.","tree":false,"id":"8.15"},{"s":"anova","t":"kruskal","sc":"Groups are not normal","w":"Kruskal–Wallis is ANOVA on ranks.","tree":false,"id":"8.25"},{"s":"repanova","t":"friedman","sc":"Repeated measures but not normal","w":"Friedman is the rank-based version.","tree":false,"id":"8.21"},{"s":"anova","t":"levene","sc":"Check equal variances first","w":"ANOVA assumes the groups have similar spread.","tree":false,"id":"8.26"},{"s":"anova","t":"fdist","sc":"Finding the critical F value","w":"Look it up with df_between and df_within.","tree":false,"id":"8.27"},{"s":"chiind","t":"catassoc","sc":"The test is significant: how strong is the link?","w":"Cramér's V turns χ² into a 0–1 strength.","tree":false,"id":"8.36"},{"s":"z2prop","t":"ab","sc":"Comparing conversion rates in an experiment","w":"The two-proportion z-test is the standard A/B test.","tree":false,"id":"8.31"},{"s":"chigof","t":"srm","sc":"Group sizes in an experiment look off","w":"A goodness-of-fit test on group counts detects sample ratio mismatch.","tree":false,"id":"8.37"},{"s":"nonpar","t":"permtest","sc":"No trustworthy formula for the null distribution","w":"Shuffle the group labels many times; the share of shuffles at least as extreme as the real difference is the p-value.","tree":true,"c":"Assumes observations are exchangeable under H₀; costs many recomputations.","id":"8.48"},{"s":"permtest","t":"bootstrap","sc":"Need a confidence interval rather than a p-value","w":"Bootstrapping resamples with replacement to estimate uncertainty.","tree":false,"id":"8.49"},{"s":"ROOT","t":"C9","sc":"You want to know whether two variables move together","w":"Quantifies association, the first step toward prediction and feature selection.","tree":true,"id":"0.9"},{"s":"C9","t":"covariance","sc":"Do two variables move together?","w":"Positive when X and Y rise together, negative when one rises as the other falls.","tree":true,"c":"Unbounded and unit-dependent, so 500 vs 600 says nothing about which link is stronger.","id":"9.1"},{"s":"covariance","t":"covmatrix","sc":"Many variables at once","w":"Variances on the diagonal and covariances off it; the input to PCA.","tree":true,"id":"9.2"},{"s":"covariance","t":"pearson","sc":"Need the strength of a linear relationship on a fixed scale","w":"Dividing covariance by both SDs bounds it between −1 and +1.","tree":true,"c":"Only captures straight-line relationships, and outliers can distort it.","id":"9.4"},{"s":"pearson","t":"rinterp","sc":"Reading a correlation value","w":"|r| near 1 is strong, near 0 weak; the sign is the direction.","tree":true,"c":"r ≈ 0 means no linear relationship; a strong curved relationship can still exist.","id":"9.5"},{"s":"pearson","t":"spearman","sc":"The relationship is monotonic but curved, or the data has outliers or ranks","w":"Pearson's r computed on ranks, so any steadily increasing curve scores 1.","tree":true,"id":"9.7"},{"s":"spearman","t":"kendall","sc":"Small samples or many tied ranks","w":"Based on the share of concordant vs discordant pairs.","tree":true,"id":"9.8"},{"s":"C9","t":"catassoc","sc":"Both variables are categorical","w":"Rescales the chi-square statistic to a 0–1 strength.","tree":true,"id":"9.10"},{"s":"catassoc","t":"pointbis","sc":"One binary and one numeric variable","w":"Pearson's r with the binary variable coded 0/1.","tree":true,"id":"9.11"},{"s":"C9","t":"causation","sc":"A correlation tempts a causal claim","w":"Association can come from confounders, reverse causation or chance.","tree":true,"id":"9.12"},{"s":"causation","t":"confounder","sc":"A third variable drives both","w":"Adjust for it, stratify on it, or randomise to remove its effect.","tree":true,"id":"9.13"},{"s":"confounder","t":"simpson","sc":"A trend reverses when you split the data into groups","w":"Aggregating across a confounder can flip the direction of an effect.","tree":true,"id":"9.14"},{"s":"causation","t":"spurious","sc":"Two unrelated series correlate strongly","w":"Shared trends over time, or searching many variables, produces correlation by chance.","tree":true,"id":"9.15"},{"s":"C9","t":"multicol","sc":"Predictors are highly correlated with each other","w":"Makes regression coefficients unstable and their standard errors large.","tree":true,"id":"9.17"},{"s":"multicol","t":"vif","sc":"Measuring multicollinearity","w":"VIF above 5 to 10 signals a problem.","tree":true,"id":"9.18"},{"s":"C9","t":"mutualinfo","sc":"Need to catch non-linear dependence","w":"Zero only when the variables are independent; picks up any kind of relationship.","tree":true,"id":"9.21"},{"s":"ROOT","t":"C10","sc":"You want to predict one variable from others","w":"Regression turns relationships into an equation you can use and test.","tree":true,"id":"0.10"},{"s":"C10","t":"linreg","sc":"Predict a numeric outcome from one input","w":"Fits a straight line y = β₀ + β₁x + ε through the data.","tree":true,"id":"10.1"},{"s":"linreg","t":"ols","sc":"Finding the best-fitting line","w":"Chooses the coefficients that minimise the sum of squared residuals.","tree":true,"id":"10.2"},{"s":"linreg","t":"coef","sc":"Interpreting the fitted line","w":"Slope: change in y per unit of x. Intercept: predicted y when x = 0.","tree":true,"id":"10.7"},{"s":"ols","t":"residual","sc":"Checking the fit point by point","w":"Residual = observed − predicted; patterns in them reveal model problems.","tree":true,"id":"10.3"},{"s":"residual","t":"residplot","sc":"Diagnosing a regression","w":"Random scatter around 0 is good; funnels and curves are not.","tree":true,"id":"10.4"},{"s":"linreg","t":"assump","sc":"Before trusting p-values and intervals","w":"Linearity, Independence, Normality of residuals, Equal variance.","tree":true,"id":"10.8"},{"s":"assump","t":"homosc","sc":"The residual spread changes with x","w":"Unequal variance makes standard errors wrong; transform y or use robust SEs.","tree":true,"id":"10.9"},{"s":"assump","t":"durbin","sc":"Observations are ordered in time","w":"Autocorrelated residuals make standard errors too small.","tree":true,"id":"10.11"},{"s":"linreg","t":"r2","sc":"How much of the variation does the model explain?","w":"R² = 1 − SS_res / SS_tot, from 0 (nothing) to 1 (perfect fit).","tree":true,"c":"Always rises when you add predictors, even useless ones.","id":"10.13"},{"s":"r2","t":"adjr2","sc":"Comparing models with different numbers of predictors","w":"Penalises extra predictors, so it only rises when a new one genuinely helps.","tree":true,"id":"10.14"},{"s":"linreg","t":"coeftest","sc":"Is a predictor actually useful?","w":"A t-test per coefficient (H₀: β = 0) plus an overall F-test for the model.","tree":true,"id":"10.15"},{"s":"coeftest","t":"predint","sc":"Reporting uncertainty for a forecast","w":"Prediction intervals for a single new point are much wider than CIs for the average response.","tree":true,"id":"10.16"},{"s":"linreg","t":"multreg","sc":"Several inputs predict the outcome","w":"Each coefficient is the effect of one input holding the others fixed.","tree":true,"id":"10.17"},{"s":"multreg","t":"dummy","sc":"A predictor is categorical","w":"Encode k categories as k − 1 0/1 columns to avoid perfect collinearity.","tree":true,"id":"10.18"},{"s":"multreg","t":"polyreg","sc":"The relationship curves","w":"Adds x², x³ … terms while staying linear in the coefficients.","tree":true,"c":"High degrees overfit and behave wildly outside the data range.","id":"10.19"},{"s":"multreg","t":"interact","sc":"The effect of x₁ depends on x₂","w":"Adding x₁ · x₂ as a feature lets slopes differ by group.","tree":true,"id":"10.20"},{"s":"multreg","t":"regularization","sc":"Many predictors, or multicollinearity","w":"Penalises large coefficients to cut variance; Lasso can shrink some to exactly zero.","tree":true,"id":"10.21"},{"s":"C10","t":"logreg","sc":"The outcome is binary (yes/no)","w":"Models log-odds as linear, so predictions are probabilities between 0 and 1.","tree":true,"id":"10.22"},{"s":"logreg","t":"odds","sc":"Interpreting a logistic coefficient","w":"e^β is the odds ratio for a one-unit increase in x.","tree":true,"id":"10.23"},{"s":"logreg","t":"glm","sc":"The outcome is a count, rate or binary","w":"Links the mean to a linear predictor with a chosen distribution (binomial, Poisson, gamma).","tree":true,"id":"10.24"},{"s":"C10","t":"regmetrics","sc":"Measuring prediction error","w":"MAE, MSE and RMSE summarise how far predictions land from the truth.","tree":true,"id":"10.26"},{"s":"regmetrics","t":"mae","sc":"Errors should count in proportion to their size","w":"Easy to explain and robust to outliers.","tree":true,"id":"10.27"},{"s":"regmetrics","t":"rmse","sc":"Large errors are especially costly","w":"Squaring punishes big misses; RMSE is back in y's units.","tree":true,"id":"10.28"},{"s":"regmetrics","t":"mape","sc":"Need the error as a percentage","w":"Scale-free, so it compares across series.","tree":true,"c":"Explodes when actual values are near zero.","id":"10.29"},{"s":"ROOT","t":"C11","sc":"Raw data must be cleaned and scaled before modelling","w":"Imputation, scaling and transforms are chosen from each feature's statistics.","tree":true,"id":"0.11"},{"s":"C11","t":"missing","sc":"The dataset has NaN values","w":"Why values are missing decides how to fix them.","tree":true,"id":"11.1"},{"s":"missing","t":"mcar","sc":"Deciding why the data is missing","w":"MCAR: purely random. MAR: depends on other observed data. MNAR: depends on the missing value itself.","tree":true,"c":"Under MNAR, simple imputation biases the results.","id":"11.2"},{"s":"missing","t":"deletion","sc":"Few rows are missing, completely at random","w":"Dropping them is simplest and doesn't distort distributions.","tree":true,"c":"Wastes data and biases results if the data isn't MCAR.","id":"11.3"},{"s":"missing","t":"imputation","sc":"Keep the rows by filling gaps","w":"Continuous: mean, or median when there are outliers. Categorical: mode.","tree":true,"c":"Shrinks variance and weakens correlations.","id":"11.4"},{"s":"imputation","t":"advimpute","sc":"Simple fills distort relationships","w":"Predicts missing values from other features; multiple imputation also reflects uncertainty.","tree":true,"id":"11.5"},{"s":"C11","t":"outlierdet","sc":"Some values look extreme","w":"Flag them first, then decide: data error, rare event, or the signal itself.","tree":true,"id":"11.6"},{"s":"outlierdet","t":"zoutlier","sc":"Data is roughly normal","w":"|z| > 3 lies outside 99.7% of a normal distribution.","tree":true,"c":"The mean and SD are themselves pulled by the outliers you are hunting.","id":"11.7"},{"s":"outlierdet","t":"iqroutlier","sc":"Data is skewed, or you want a robust rule","w":"Flag points beyond Q1 − 1.5·IQR or Q3 + 1.5·IQR.","tree":true,"id":"11.8"},{"s":"outlierdet","t":"outlierhandle","sc":"Outliers are confirmed","w":"Remove errors; cap (winsorize), transform, or use robust models for genuine extremes.","tree":true,"id":"11.10"},{"s":"C11","t":"scaling","sc":"Features have different units and ranges","w":"Distance- and gradient-based models (KNN, SVM, k-means, neural nets) need comparable scales.","tree":true,"c":"Tree models (random forest, XGBoost) don't need it.","id":"11.11"},{"s":"scaling","t":"standardize","sc":"Most ML models, roughly normal features","w":"Transforms every feature to mean 0 and SD 1.","tree":true,"id":"11.12"},{"s":"scaling","t":"minmax","sc":"Need values in a fixed range such as 0 to 1","w":"Common for images (pixels 0–255 → 0–1, as in CNNs) and neural nets.","tree":true,"c":"A single outlier squashes all other values together.","id":"11.13"},{"s":"scaling","t":"robust","sc":"Features contain outliers","w":"Uses the median and IQR, which outliers can't move much.","tree":true,"id":"11.14"},{"s":"scaling","t":"leak","sc":"Scaling before the train/test split","w":"Statistics computed on test data leak information and inflate scores.","tree":true,"id":"11.15"},{"s":"C11","t":"transform","sc":"A feature is heavily skewed","w":"Making it more symmetric helps linear models and normal-based tests.","tree":true,"id":"11.16"},{"s":"transform","t":"logtrans","sc":"Right-skewed positive data","w":"Compresses large values; turns log-normal data into normal data.","tree":true,"c":"Undefined for zero or negative values; use log1p or Yeo-Johnson.","id":"11.17"},{"s":"transform","t":"boxcox","sc":"Need the best power transform automatically","w":"Searches for the λ that makes the data most normal; Yeo-Johnson also handles values ≤ 0.","tree":true,"id":"11.19"},{"s":"C11","t":"binning","sc":"Turning a numeric feature into categories","w":"Equal-width or quantile bins capture non-linear effects and reduce noise.","tree":true,"id":"11.20"},{"s":"C11","t":"encoding","sc":"A model needs numbers but the feature is categorical","w":"One-hot for nominal data, ordinal encoding for ordered categories.","tree":true,"id":"11.21"},{"s":"C11","t":"imbalance","sc":"One class is rare","w":"Accuracy misleads; use resampling, class weights and precision/recall.","tree":true,"id":"11.23"},{"s":"C11","t":"pca","sc":"Too many correlated features","w":"Rotates data onto uncorrelated axes ordered by variance explained.","tree":true,"c":"Components are hard to interpret, and features must be scaled first.","id":"11.26"},{"s":"pca","t":"curse","sc":"Many features, relatively few rows","w":"Data becomes sparse and distances lose meaning as dimensions grow.","tree":true,"id":"11.27"},{"s":"covmatrix","t":"pca","sc":"Reducing many correlated variables","w":"PCA diagonalises the covariance matrix.","tree":false,"id":"9.3"},{"s":"pearson","t":"linreg","sc":"Want to predict y, not just measure the link","w":"Regression turns correlation into an equation.","tree":false,"id":"9.9"},{"s":"multicol","t":"regularization","sc":"Must keep all correlated predictors","w":"Ridge regression stabilises the coefficients.","tree":false,"id":"9.19"},{"s":"multicol","t":"pca","sc":"Replacing correlated predictors with uncorrelated ones","w":"PCA components are uncorrelated by construction.","tree":false,"id":"9.20"},{"s":"homosc","t":"logtrans","sc":"Spread grows with the level of y","w":"Logging y often stabilises the variance.","tree":false,"id":"10.10"},{"s":"logreg","t":"logloss","sc":"Evaluating the predicted probabilities","w":"Log loss is logistic regression's training objective.","tree":false,"id":"10.25"},{"s":"regmetrics","t":"crossval","sc":"Need a reliable estimate of out-of-sample error","w":"Cross-validate the metric instead of trusting training error.","tree":false,"id":"10.30"},{"s":"durbin","t":"autocorr","sc":"Residuals are correlated over time","w":"Autocorrelation analysis finds the lag structure.","tree":false,"id":"10.12"},{"s":"iqroutlier","t":"fences","sc":"Computing the fences","w":"Q1 − 1.5 × IQR and Q3 + 1.5 × IQR.","tree":false,"id":"11.9"},{"s":"imbalance","t":"prf","sc":"Measuring performance on the rare class","w":"Precision and recall focus on positives.","tree":false,"id":"11.24"},{"s":"imbalance","t":"stratkfold","sc":"Cross-validating imbalanced data","w":"Stratified folds keep the class ratio in every fold.","tree":false,"id":"11.25"},{"s":"logtrans","t":"lognormal","sc":"Understanding why it works","w":"Log of a log-normal variable is normal.","tree":false,"id":"11.18"},{"s":"encoding","t":"dummy","sc":"Encoding for linear models","w":"Drop one column to avoid the dummy-variable trap.","tree":false,"id":"11.22"},{"s":"rinterp","t":"rtest","sc":"Is an observed r just chance?","w":"Under H₀: ρ = 0, t = r√(n − 2) / √(1 − r²) follows a t-distribution with n − 2 df.","tree":true,"c":"With large n even a tiny, useless r becomes significant; report r and its CI.","id":"9.6"},{"s":"residplot","t":"leverage","sc":"One point may be steering the whole fit","w":"High-leverage points have unusual x; Cook's distance combines leverage and residual size to measure influence.","tree":true,"id":"10.5"},{"s":"leverage","t":"outlierdet","sc":"Deciding what to do with the influential point","w":"Check whether it is an error, a rare event or real signal.","tree":false,"id":"10.6"},{"s":"ROOT","t":"C12","sc":"You need to know if a model really works","w":"Resampling and the right metric estimate real-world performance honestly.","tree":true,"id":"0.12"},{"s":"C12","t":"traintest","sc":"Estimating performance on new data","w":"Hold out data the model never sees while training.","tree":true,"c":"A single split is noisy on small datasets.","id":"12.1"},{"s":"traintest","t":"crossval","sc":"Need a stable estimate from limited data","w":"Train on k − 1 folds, test on the remaining fold, rotate k times and average.","tree":true,"c":"Costs k model fits, and must respect time order and groups.","id":"12.2"},{"s":"crossval","t":"stratkfold","sc":"Classes are imbalanced","w":"Keeps class proportions the same in every fold.","tree":true,"id":"12.3"},{"s":"crossval","t":"loocv","sc":"A very small dataset","w":"k = n: almost no bias, but high variance and n model fits.","tree":true,"id":"12.4"},{"s":"crossval","t":"tscv","sc":"Data is ordered in time","w":"Always train on the past and test on the future.","tree":true,"id":"12.5"},{"s":"crossval","t":"cvvsboot","sc":"Choosing a resampling method","w":"CV estimates how well a model predicts; the bootstrap estimates how variable a statistic is.","tree":true,"id":"12.7"},{"s":"C12","t":"biasvar","sc":"Model error won't go down","w":"Total error = bias² + variance + noise; more complexity lowers bias but raises variance.","tree":true,"id":"12.8"},{"s":"biasvar","t":"overfit","sc":"Great training score but poor test score, or both poor","w":"Overfit: memorises noise (high variance). Underfit: too simple to capture the pattern (high bias).","tree":true,"id":"12.9"},{"s":"C12","t":"classmetrics","sc":"The model predicts classes","w":"Different errors cost differently, so one number is rarely enough.","tree":true,"id":"12.11"},{"s":"classmetrics","t":"confmat","sc":"Seeing every kind of right and wrong prediction","w":"TP, FP, FN, TN; a false positive is a Type I error, a false negative a Type II error.","tree":true,"id":"12.12"},{"s":"confmat","t":"accuracy","sc":"Classes are roughly balanced","w":"The share of all predictions that are correct.","tree":true,"c":"Misleading with imbalance: always predicting 'no fraud' scores 99%.","id":"12.13"},{"s":"confmat","t":"prf","sc":"Positives are rare, or errors cost differently","w":"Precision: of predicted positives, how many are right. Recall: of real positives, how many are found. F1 balances both.","tree":true,"id":"12.14"},{"s":"prf","t":"specificity","sc":"Medical-style test evaluation","w":"Sensitivity = recall (true positive rate); specificity = true negative rate.","tree":true,"id":"12.15"},{"s":"classmetrics","t":"threshold","sc":"Trading false positives against false negatives","w":"Moving the cut-off from 0.5 shifts the balance between precision and recall.","tree":true,"id":"12.17"},{"s":"classmetrics","t":"roc","sc":"Comparing classifiers across all thresholds","w":"Plots TPR against FPR; AUC is the chance a random positive is ranked above a random negative.","tree":true,"c":"Can look optimistic with heavy imbalance; check the precision–recall curve.","id":"12.18"},{"s":"roc","t":"prcurve","sc":"The positive class is rare","w":"Shows the precision/recall trade-off without being flattered by many true negatives.","tree":true,"id":"12.19"},{"s":"classmetrics","t":"logloss","sc":"Evaluating predicted probabilities, not just labels","w":"Heavily penalises confident wrong predictions.","tree":true,"id":"12.20"},{"s":"C12","t":"infotheory","sc":"Measuring uncertainty and the difference between distributions","w":"Entropy and KL divergence power decision trees, loss functions and drift monitoring.","tree":true,"id":"12.21"},{"s":"infotheory","t":"entropy","sc":"How uncertain is an outcome?","w":"Largest when outcomes are equally likely; decision trees split to reduce it.","tree":true,"id":"12.22"},{"s":"infotheory","t":"kl","sc":"How different are two distributions?","w":"The extra information needed to encode P using Q; used for drift detection and in VAEs.","tree":true,"c":"Not symmetric, and infinite when Q is 0 where P isn't.","id":"12.24"},{"s":"ROOT","t":"C13","sc":"You want to update beliefs as data arrives","w":"Bayesian methods combine prior knowledge with evidence and quantify uncertainty directly.","tree":true,"id":"0.13"},{"s":"C13","t":"freqbayes","sc":"Choosing a framework for probability","w":"Frequentist: parameters are fixed and probability is long-run frequency. Bayesian: parameters have distributions that express belief.","tree":true,"id":"13.1"},{"s":"C13","t":"bayesinf","sc":"Updating a belief with new data","w":"Posterior ∝ likelihood × prior.","tree":true,"id":"13.3"},{"s":"bayesinf","t":"prior","sc":"Encoding what you knew before the data","w":"Informative priors add knowledge; weak priors let the data dominate.","tree":true,"c":"A strong, wrong prior biases results until enough data overwhelms it.","id":"13.4"},{"s":"bayesinf","t":"likelihood","sc":"How well each parameter value explains the data","w":"P(data | θ) viewed as a function of θ; also the core of MLE.","tree":true,"id":"13.6"},{"s":"bayesinf","t":"posterior","sc":"Your updated belief","w":"A full distribution for the parameter; today's posterior is tomorrow's prior.","tree":true,"id":"13.7"},{"s":"posterior","t":"conjugate","sc":"Need a closed-form update","w":"Beta(a, b) prior + k successes in n trials → Beta(a + k, b + n − k).","tree":true,"id":"13.8"},{"s":"posterior","t":"credible","sc":"Want 'a 95% chance θ lies in this range'","w":"A direct probability statement from the posterior, unlike a confidence interval.","tree":true,"id":"13.9"},{"s":"posterior","t":"mapest","sc":"Need a single Bayesian point estimate","w":"The mode of the posterior; equals the MLE under a flat prior.","tree":true,"id":"13.10"},{"s":"bayesinf","t":"mcmc","sc":"The posterior has no closed form","w":"Draws samples from the posterior (Metropolis, HMC, NUTS) to approximate it.","tree":true,"id":"13.11"},{"s":"C13","t":"naivebayes","sc":"Fast text or spam classification","w":"Applies Bayes' theorem per class, assuming features are independent given the class.","tree":true,"c":"The independence assumption is rarely true, though class rankings are often still good.","id":"13.12"},{"s":"C13","t":"bayesab","sc":"Want P(B beats A) directly","w":"Compare the posterior distributions of each variant's conversion rate.","tree":true,"id":"13.13"},{"s":"ROOT","t":"C14","sc":"You must show that a product change caused an effect","w":"Randomization makes the groups comparable, so differences are caused by the change.","tree":true,"id":"0.14"},{"s":"C14","t":"ab","sc":"Did a change cause the metric to move?","w":"Randomly split users into control (A) and treatment (B), then compare with a hypothesis test.","tree":true,"id":"14.1"},{"s":"ab","t":"controltreat","sc":"Setting up the comparison","w":"Control sees the current version; treatment sees the change.","tree":true,"id":"14.2"},{"s":"ab","t":"randomization","sc":"Removing hidden differences between groups","w":"Random assignment balances confounders on average, which makes causal claims valid.","tree":true,"id":"14.3"},{"s":"ab","t":"metric","sc":"Deciding what success means before starting","w":"One pre-chosen primary metric; guardrails check that nothing important breaks.","tree":true,"id":"14.4"},{"s":"ab","t":"mde","sc":"Planning the smallest lift worth detecting","w":"Smaller MDEs need much larger samples, roughly n ∝ 1 / MDE².","tree":true,"id":"14.5"},{"s":"mde","t":"absize","sc":"How long must the test run?","w":"Compute n from baseline rate, MDE, α and power; run whole weekly cycles.","tree":true,"id":"14.6"},{"s":"ab","t":"peeking","sc":"Tempted to stop as soon as p < 0.05","w":"Checking repeatedly inflates false positives; fix n in advance or use sequential methods.","tree":true,"id":"14.7"},{"s":"peeking","t":"sequential","sc":"Need to monitor results safely","w":"Alpha-spending rules or always-valid p-values allow early stopping without inflating α.","tree":true,"id":"14.8"},{"s":"ab","t":"srm","sc":"Group sizes differ from the planned split","w":"A chi-square goodness-of-fit test on counts flags broken randomization.","tree":true,"id":"14.10"},{"s":"ab","t":"novelty","sc":"Early results differ from later ones","w":"Users react to the change itself; run long enough for behaviour to settle.","tree":true,"id":"14.12"},{"s":"ab","t":"cuped","sc":"Tests take too long to reach significance","w":"Adjusts the metric with pre-experiment data, cutting variance and the n you need.","tree":true,"id":"14.13"},{"s":"ab","t":"bandit","sc":"Want to earn while you learn","w":"Shifts traffic toward winning variants during the test.","tree":true,"c":"Weaker for clean statistical inference than a fixed-split A/B test.","id":"14.14"},{"s":"ROOT","t":"C15","sc":"Observations are ordered in time","w":"These tools model trend, seasonality and dependence on past values.","tree":true,"id":"0.15"},{"s":"C15","t":"tscomp","sc":"Describing a time series","w":"Decomposition separates the long-run trend, repeating patterns and leftover noise.","tree":true,"id":"15.1"},{"s":"C15","t":"movavg","sc":"Need to see the trend through the noise","w":"Averaging a sliding window of points smooths short-term fluctuations.","tree":true,"id":"15.2"},{"s":"C15","t":"stationarity","sc":"A model assumes stable behaviour over time","w":"Constant mean, variance and autocorrelation over time; required by ARIMA-type models.","tree":true,"id":"15.3"},{"s":"stationarity","t":"adf","sc":"Formally testing for stationarity","w":"H₀: a unit root (non-stationary); p < 0.05 suggests the series is stationary.","tree":true,"id":"15.4"},{"s":"stationarity","t":"differencing","sc":"The series has a trend","w":"yₜ − yₜ₋₁ removes a trend; seasonal differencing removes seasonality.","tree":true,"id":"15.5"},{"s":"stationarity","t":"whitenoise","sc":"Is anything left to model?","w":"White noise is uncorrelated with mean 0; a random walk is the running sum of noise and is non-stationary.","tree":true,"id":"15.6"},{"s":"C15","t":"autocorr","sc":"Values depend on their own past","w":"Correlation of the series with lagged copies of itself.","tree":true,"id":"15.7"},{"s":"autocorr","t":"pacf","sc":"Choosing the order of an AR model","w":"Correlation at lag k after removing the effect of shorter lags.","tree":true,"id":"15.8"},{"s":"C15","t":"arima","sc":"Forecasting a single series","w":"Combines autoregression (AR), differencing (I) and moving-average errors (MA).","tree":true,"id":"15.9"},{"s":"confmat","t":"errors","sc":"Connecting to hypothesis-testing errors","w":"FP is a Type I error and FN a Type II error.","tree":false,"id":"12.16"},{"s":"overfit","t":"regularization","sc":"Reducing variance in a linear model","w":"Penalising coefficients controls overfitting.","tree":false,"id":"12.10"},{"s":"tscv","t":"stationarity","sc":"Validating a forecast","w":"Time-series models need ordered splits and stable behaviour.","tree":false,"id":"12.6"},{"s":"entropy","t":"logloss","sc":"Training a classifier","w":"Log loss is the cross-entropy between labels and predictions.","tree":false,"id":"12.23"},{"s":"ab","t":"bayesab","sc":"Want P(B beats A) instead of a p-value","w":"A Bayesian analysis gives that probability directly.","tree":false,"id":"14.15"},{"s":"ab","t":"z2prop","sc":"Analysing a conversion-rate test","w":"Two-proportion z-test compares the two rates.","tree":false,"id":"14.16"},{"s":"peeking","t":"multiple","sc":"Understanding why peeking is a problem","w":"Every look is another test.","tree":false,"id":"14.9"},{"s":"srm","t":"chigof","sc":"Running the SRM check","w":"Compare observed group counts with the planned split.","tree":false,"id":"14.11"},{"s":"spurious","t":"stationarity","sc":"Two trending series correlate","w":"Differencing to stationarity removes shared trends.","tree":false,"id":"9.16"},{"s":"freqbayes","t":"pvalue","sc":"The frequentist tool for evidence","w":"p-values are the frequentist answer.","tree":false,"id":"13.2"},{"s":"prior","t":"regularization","sc":"Seeing regularization as a prior","w":"Ridge = Gaussian prior, Lasso = Laplace prior.","tree":false,"id":"13.5"}],"root":"ROOT","start":"C1","short":{"C1":"Foundations","C2":"Descriptive","C3":"Visualization","C4":"Probability","C5":"Distributions","C6":"Estimation","C7":"Hypothesis testing","C8":"Tests","C9":"Correlation","C10":"Regression","C11":"Data prep","C12":"Evaluation","C13":"Bayesian","C14":"A/B testing","C15":"Time series"},"titles":{"C1":"Data, Variables & Sampling","C2":"Descriptive Statistics","C3":"Visualizing Data (EDA)","C4":"Probability","C5":"Probability Distributions","C6":"Sampling Distributions & Estimation","C7":"Hypothesis Testing","C8":"Statistical Tests","C9":"Correlation & Relationships","C10":"Regression","C11":"Data Preparation & Feature Engineering","C12":"Model Evaluation","C13":"Bayesian Statistics","C14":"A/B Testing & Experiments","C15":"Time Series Basics"}}</script>

  if (p.m==="random"){ const R=rng(3); while (pick.size<12) pick.add(Math.floor(R()*C*Rw)); cap="12 of 60 picked purely at random: every dot had the same chance."; }
  if (p.m==="strat"){ const R=rng(8); [[0,4],[4,8],[8,12]].forEach(([a,b])=>{ const loc=new Set(); while (loc.size<4){ loc.add(id(a+Math.floor(R()*(b-a)),Math.floor(R()*Rw))); } loc.forEach(v=>pick.add(v)); });
    cap="Three strata (shaded bands); 4 people drawn at random inside each, so every group is represented."; }
  if (p.m==="sys"){ for (let i=2;i<C*Rw;i+=5) pick.add(i); cap="Random start at #3, then every 5th person in the list (k = N / n = 60 / 12)."; }
  if (p.m==="cluster"){ for (const [c0,r0,h] of [[2,0,3],[8,3,2]]) for (let c=c0;c<c0+2;c++) for (let r=r0;r<r0+h;r++) pick.add(id(c,r)); cap="The grid is split into clusters; 2 whole clusters are chosen at random and everyone in them is measured."; }
  if (p.m==="conv"){ for (let c=0;c<4;c++) for (let r=0;r<3;r++) pick.add(id(c,r)); cap="Only the people nearest to hand (top-left) are surveyed: quick, but not representative."; }
  if (p.m==="strat") [[0,4],[4,8],[8,12]].forEach(([a,b],i)=>{ s+=`<rect class="${["fa","fb","fc"][i]}" x="${ox+a*gx-gx/2+2}" y="${oy-14}" width="${(b-a)*gx-4}" height="${Rw*gy+4}" rx="7"/>`+T(ox+((a+b)/2-0.5)*gx,oy-17,["Stratum A","Stratum B","Stratum C"][i],"tk"); });
  if (p.m==="cluster") for (let c=0;c<C;c+=2) for (let r=0;r<Rw-1;r+=3){ const h=r===0?3:2; s+=`<rect class="cl" x="${ox+c*gx-gx/2+3}" y="${oy+r*gy-gy/2+2}" width="${2*gx-6}" height="${h*gy-4}" rx="6"/>`; }
  for (let r=0;r<Rw;r++) for (let c=0;c<C;c++){ const on=pick.has(id(c,r)); s+=`<circle class="${on?"d1":"pd"}" cx="${ox+c*gx}" cy="${oy+r*gy}" r="${on?6:5}"/>`; }
  if (p.m==="sys") s+=T(ox+2*gx,oy-12,"start","tk");
  if (p.m==="conv") s+=T(ox+1.5*gx,H-4,"easy to reach","lb");
  return box(svgw(W,H,s),cap);
};

/* time series */
V.ts = function(p){
  const R=rng(17), n=60, x=[...Array(n).keys()];
  if (p.m==="stat"){ const a=x.map(()=>randn(R)); let w=0; const b=x.map(()=>w+=randn(R)); const W=400; let s="";
    [[a,"Stationary: white noise around a fixed mean"],[b,"Non-stationary: random walk drifts"]].forEach(([y,l],i)=>{
      const P=Plot({w:W,h:180,x:[0,n-1],y:rangeOf(y,0.1),m:[16+i*90,12,96-i*90+8,12]}); P.add(`<rect class="pf" x="${P.L}" y="${P.T}" width="${P.R-P.L}" height="${P.B-P.T}" rx="4"/>`);
      if (!i) P.hl(0,"vl2"); P.poly(x.map(t=>[t,y[t]]),"s"+(i+1)); s+=P.inner()+T(P.L+4,P.T-4,l,"lb","start"); });
    return box(svgw(400,180,s)); }
  let y, extra=[], cap=null;
  if (p.m==="trend"){ y=x.map(t=>20+0.6*t+3*randn(R)); cap="An upward trend with noise."; }
  if (p.m==="season"){ const tr=x.map(t=>20+0.35*t), se=x.map(t=>6*Math.sin(2*Math.PI*t/12)); y=x.map(t=>tr[t]+se[t]+1.5*randn(R)); extra=[[tr,"sd"]]; cap="Series = trend (dashed) + seasonal cycle every 12 points + noise."; }
  if (p.m==="ma"){ y=x.map(t=>30+8*Math.sin(t/9)+4*randn(R)); const ma=x.map(t=>t<6?null:mean(y.slice(t-6,t+1))); extra=[[ma,"s2"]]; cap="A 7-point moving average (orange) smooths out the noise."; }
  if (p.m==="two"){ const a=x.map(t=>10+0.5*t+2*randn(R)), b=x.map(t=>40+0.8*t+3*randn(R)); const all=a.concat(b);
    const P=Plot({x:[0,n-1],y:rangeOf(all),h:160,m:[12,12,22,34]}); P.yax(nice(...rangeOf(all),4)); P.xax(null,"time");
    P.poly(x.map(t=>[t,a[t]]),"s1"); P.poly(x.map(t=>[t,b[t]]),"s2"); P.legend([["s1","cheese sold"],["s2","PhDs awarded"]],P.L+8);
    return box(P.svg(),`Two unrelated series: r = ${fmt(corr(a,b),2)} only because both trend upward.`); }
  const all=y.concat(...extra.map(e=>e[0].filter(v=>v!=null)));
  const P=Plot({x:[0,n-1],y:rangeOf(all),h:160,m:[12,12,22,34]}); P.yax(nice(...rangeOf(all),4)); P.xax(null,"time");
