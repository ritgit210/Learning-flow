"c":"Each layer adds code paths that need their own tests"},{"id":"2.14","s":"e2_reliability","t":"e2_retries","sc":"Transient 429 or 5xx errors","w":"Retries absorb the most common class of LLM API failures.","tree":true,"c":"Stacked retries (SDK + yours + gateway) multiply load and delay"},{"id":"2.15","s":"e2_reliability","t":"e2_timeouts","sc":"Calls hang or users abandon","w":"Bounded waits protect UX and cost.","tree":true,"c":"Too tight a timeout kills slow-but-valid long answers"},{"id":"2.16","s":"e2_reliability","t":"e2_idempotency","sc":"Retries could repeat side effects","w":"Retries are only safe when duplicates are harmless.","tree":true,"c":"Result caches need TTLs and storage; stale answers possible"},{"id":"2.17","s":"e2_reliability","t":"e2_fallbacks","sc":"Primary provider is down","w":"Fallbacks turn hard outages into minor quality dips.","tree":true,"c":"Prompt behavior differs per model; untested fallbacks fail silently"},{"id":"2.18","s":"E2","t":"e2_sdks","sc":"Choosing how to call providers","w":"SDKs encode retries, streaming and types you'd otherwise rebuild.","tree":true,"c":"Each SDK has its own shapes; multi-provider code diverges"},{"id":"2.19","s":"e2_sdks","t":"e2_converse","sc":"Running on AWS Bedrock","w":"Converse is the provider-neutral path inside AWS.","tree":true,"c":"Lowest common denominator; newest features may need native APIs"},{"id":"2.20","s":"e2_sdks","t":"e2_openai_compat","sc":"Want one client for many backends","w":"The OpenAI shape is the de facto interop standard.","tree":true,"c":"Compat is partial; advanced features often break silently"},{"id":"2.21","s":"e2_sdks","t":"e2_gateway","sc":"Many apps share many providers","w":"A gateway centralizes concerns every app would duplicate.","tree":true,"c":"Extra hop and single point of failure; feature lag vs native APIs"},{"id":"2.22","s":"E2","t":"e2_modelids","sc":"Need stable behavior over time","w":"Pinning makes model changes deliberate, testable events.","tree":true,"c":"Pinned models still retire; you must schedule upgrades"},{"id":"2.23","s":"e2_modelids","t":"e2_deprecations","sc":"Pinned model is being retired","w":"Migration is a recurring project; a playbook keeps it cheap.","tree":true,"c":"New models may need prompt rewrites, not just an id swap"},{"id":"2.24","s":"E2","t":"e2_secrets","sc":"Keys need to reach running code","w":"Key leaks are the cheapest way to lose money on LLMs.","tree":true,"c":"Per-team keys add rotation overhead; gateways help"},{"id":"2.25","s":"e2_streaming","t":"e16_streamux","sc":"Rendering partial output in UI","w":"Streaming UX patterns turn raw deltas into a usable interface.","tree":false},{"id":"2.26","s":"e2_stopreasons","t":"e4_validation","sc":"Need to trust parsed output","w":"Validation is the next check after the stop reason is clean.","tree":false,"c":"Validation retries add latency"},{"id":"2.27","s":"e2_stateless","t":"e12_promptcaching","sc":"Resending long identical prefixes","w":"Caching discounts the history you resend every turn.","tree":false,"c":"Cache needs byte-identical prefixes"},{"id":"2.28","s":"e2_gateway","t":"e11_tracing","sc":"Need per-call visibility","w":"Gateways are a natural point to emit traces for every call.","tree":false},{"id":"2.29","s":"e2_batchapi","t":"e10_ci","sc":"Running large eval suites","w":"Batch pricing makes nightly eval runs cheap.","tree":false,"c":"Batch latency doesn't fit fast PR checks"},{"id":"2.30","s":"e2_fallbacks","t":"e12_routing","sc":"Fallback logic grows into policy","w":"Routing generalizes fallbacks into cost/quality-aware model choice.","tree":false},{"id":"2.31","s":"e2_multimodal","t":"e16_docai","sc":"Inputs are scanned documents","w":"Document AI covers parsing and extraction beyond raw image input.","tree":false},{"id":"2.32","s":"e2_modelids","t":"e11_modelupgrade","sc":"Planning a model version swap","w":"Upgrade playbooks pair pinned ids with eval-gated rollouts.","tree":false},{"id":"3.1","s":"E3","t":"e3_promptascode","sc":"Start: prompts are production assets","w":"All prompt craft is wasted if changes can't be tracked or tested.","tree":true,"c":"Process overhead feels heavy for a one-person prototype"},{"id":"3.2","s":"e3_promptascode","t":"e3_templates","sc":"Same prompt, many inputs","w":"Templates are the basic unit of reusable, testable prompts.","tree":true,"c":"Template logic can hide what the model actually sees; log rendered text"},{"id":"3.3","s":"e3_promptascode","t":"e3_versioning","sc":"Prompts change often, by several people","w":"Versions make each prompt change traceable and reversible.","tree":true,"c":"Registry prompts can drift from code that expects their variables"},{"id":"3.4","s":"e3_versioning","t":"e3_testing","sc":"Need confidence a change is safe","w":"Regression tests turn prompt edits into normal code changes.","tree":true,"c":"Small eval sets miss rare regressions; grow from prod failures"},{"id":"3.5","s":"e3_testing","t":"e3_sensitivity","sc":"Tiny edits change results a lot","w":"Brittleness is why prompt changes need regression tests.","tree":true,"c":"Chasing noise wastes time; require wins larger than run variance"},{"id":"3.6","s":"e3_versioning","t":"e3_review","sc":"Several people edit prompts","w":"Review catches contradictions evals don't measure.","tree":true,"c":"Slower iteration; allow fast lanes for experiments"},{"id":"3.7","s":"E3","t":"e3_sysprompt","sc":"Writing the main instructions","w":"Structure is the foundation every other prompt technique sits on.","tree":true,"c":"Long system prompts cost tokens on every call; cache them"},{"id":"3.8","s":"e3_sysprompt","t":"e3_xmltags","sc":"Prompt mixes instructions and data","w":"Delimiters give the model unambiguous structure.","tree":true,"c":"Delimiters reduce but don't prevent prompt injection"},{"id":"3.9","s":"e3_sysprompt","t":"e3_rolespec","sc":"Outputs are generic or off-target","w":"Most bad outputs come from underspecified tasks, not the model.","tree":true,"c":"Over-specifying can make newer models rigid and verbose"},{"id":"3.10","s":"e3_rolespec","t":"e3_persona","sc":"Voice must match the brand","w":"Tone is part of product quality users notice first.","tree":true,"c":"Strong personas can override factual caution; test both"},{"id":"3.11","s":"e3_rolespec","t":"e3_positive","sc":"Model keeps doing the banned thing","w":"Positive framing gives the model a target, not just a fence.","tree":true,"c":"Some rules really are prohibitions; state them plainly"},{"id":"3.12","s":"e3_sysprompt","t":"e3_longdoc","sc":"Prompt holds long documents","w":"Placement is a free quality win on long-context tasks.","tree":true,"c":"Docs-first conflicts with caching if docs vary per request"},{"id":"3.13","s":"e3_longdoc","t":"e3_compression","sc":"Contexts are huge and costly","w":"Compression attacks cost when docs dominate the prompt.","tree":true,"c":"Breaks prompt caching and can drop critical exact details"},{"id":"3.14","s":"e3_sysprompt","t":"e3_hierarchy","sc":"Conflicting instructions from sources","w":"Knowing the hierarchy tells you where each rule belongs.","tree":true,"c":"Models still get tricked; pair with guardrails and least privilege"},{"id":"3.15","s":"E3","t":"e3_fewshot","sc":"Instructions alone don't get the format","w":"Examples convey nuance that rules can't.","tree":true,"c":"Examples cost tokens every call and can be over-imitated"},{"id":"3.16","s":"e3_fewshot","t":"e3_dynamic_fewshot","sc":"Too many cases for a fixed set","w":"Retrieval picks the examples that matter for this input.","tree":true,"c":"Varying examples break prompt caching; adds a retrieval hop"},{"id":"3.17","s":"e3_fewshot","t":"e3_prefill","sc":"Model adds preamble or wrong format","w":"Priming steers the very first tokens of the output.","tree":true,"c":"Not portable; check model support and prefer structured outputs"},{"id":"3.18","s":"E3","t":"e3_chaining","sc":"One prompt can't do it all well","w":"Chains raise reliability by giving each step one job.","tree":true,"c":"Latency adds up per step; errors propagate downstream"},{"id":"3.19","s":"e3_chaining","t":"e3_thinkfirst","sc":"Cheap model fails multi-step logic","w":"Visible reasoning buys accuracy on models without native thinking.","tree":true,"c":"More output tokens and latency; thinking text may be wrong too"},{"id":"3.20","s":"E3","t":"e3_reasoningprompts","sc":"Switching to a reasoning model","w":"Reasoning models invert some classic prompting advice.","tree":true,"c":"Guidance shifts per model generation; verify on your evals"},{"id":"3.21","s":"E3","t":"e3_multilingual","sc":"Users write in many languages","w":"Language is a quality and cost dimension of its own.","tree":true,"c":"Per-locale evals multiply test effort"},{"id":"3.22","s":"E3","t":"e3_metaprompt","sc":"Stuck on how to word the prompt","w":"LLMs are decent prompt writers when given failures to fix.","tree":true,"c":"Can overfit to listed failures; always validate on held-out cases"},{"id":"3.23","s":"e3_metaprompt","t":"e3_promptopt","sc":"Have metric, want more accuracy","w":"Automates the trial-and-error loop of manual prompt tuning.","tree":true,"c":"Costs many LLM calls; overfits small dev sets"},{"id":"3.24","s":"e3_promptopt","t":"e3_dspy","sc":"Pipeline needs systematic tuning","w":"DSPy is the most used framework for programmatic prompt optimization.","tree":true,"c":"Learning curve; compiled prompts are harder to hand-edit"},{"id":"3.25","s":"e3_templates","t":"e5_cachefriendly","sc":"Prompts repeat a large prefix","w":"Cache-friendly layout keeps static template text first.","tree":false,"c":"Forces volatile variables to the end"},{"id":"3.26","s":"e3_testing","t":"e10_ci","sc":"Want tests on every PR","w":"CI gates run prompt regression suites automatically.","tree":false,"c":"Eval runs cost money per PR"},{"id":"3.27","s":"e3_xmltags","t":"e15_injection","sc":"Prompt includes untrusted text","w":"Injection defenses build on clearly separated untrusted content.","tree":false},{"id":"3.28","s":"e3_fewshot","t":"e14_dataset","sc":"Examples grow into hundreds","w":"Large example sets are the seed of a fine-tuning dataset.","tree":false,"c":"Fine-tuning adds training and hosting overhead"},{"id":"3.29","s":"e3_chaining","t":"e9_workflows_vs_agents","sc":"Steps need dynamic decisions","w":"When the chain must branch on its own, consider agents.","tree":false,"c":"Agents trade predictability for flexibility"},{"id":"3.30","s":"e3_prefill","t":"e4_constrained","sc":"Need guaranteed valid JSON","w":"Constrained decoding enforces format where prefill only nudges.","tree":false},{"id":"3.31","s":"e3_versioning","t":"e11_tracing","sc":"Need to link outputs to prompts","w":"Tracing records prompt version per call for debugging.","tree":false},{"id":"3.32","s":"e3_promptopt","t":"e10_judge","sc":"No exact-match metric exists","w":"An LLM judge can provide the metric optimizers need.","tree":false,"c":"Judge bias gets optimized into the prompt"},{"id":"4.1","s":"E4","t":"e4_jsonmode","sc":"Need parseable output, not prose","w":"JSON mode is the cheapest step up from asking nicely in the prompt.","c":"Valid JSON only; keys and types still unchecked","tree":true},{"id":"4.2","s":"e4_jsonmode","t":"e4_jsonschema","sc":"Keys or types keep coming back wrong","w":"Strict schema mode enforces the exact shape during decoding.","c":"Schema keyword limits; first-use compile latency","tree":true},{"id":"4.3","s":"E4","t":"e4_toolextract","sc":"Provider lacks native schema mode","w":"Tool input schemas are supported almost everywhere and map cleanly to objects.","c":"Must force tool_choice; args may still need validation","tree":true},{"id":"4.4","s":"E4","t":"e4_pydantic","sc":"Schema duplicated across prompt and code","w":"One typed model generates schema, validation and app types.","tree":true},{"id":"4.5","s":"e4_pydantic","t":"e4_instructor","sc":"Want typed calls with retries built in","w":"Instructor wraps the client so response_model plus retries is one call.","c":"Hidden retries add cost and latency","tree":true},{"id":"4.6","s":"e4_pydantic","t":"e4_parsers","sc":"Already using a chain framework","w":"Framework parsers plug the typed model into existing chains.","c":"Some parsers fall back to fragile prompt-and-regex","tree":true},{"id":"4.7","s":"E4","t":"e4_validation","sc":"Valid JSON but wrong or inconsistent values","w":"Schema plus business-rule checks with targeted re-asks close the gap.","c":"Each retry is another full call","tree":true},{"id":"4.8","s":"e4_validation","t":"e4_refusals","sc":"Model declines or output is truncated","w":"Refusals and max_tokens cutoffs are distinct failure paths to handle.","tree":true},{"id":"4.9","s":"e4_validation","t":"e4_postprocess","sc":"Model does math or formatting badly","w":"Deterministic code is exact and free for the parts that need no judgment.","tree":true},{"id":"4.10","s":"e4_postprocess","t":"e4_normalize","sc":"Dates and amounts arrive in many formats","w":"Canonical forms make downstream joins and comparisons correct.","c":"Ambiguous locales still need a rule or human","tree":true},{"id":"4.11","s":"e4_validation","t":"e4_testparsers","sc":"Parser crashes after a model change","w":"Fixture-based tests lock in parser behavior on real messy outputs.","tree":true},{"id":"4.12","s":"E4","t":"e4_constrained","sc":"Self-hosting and need guaranteed format","w":"Token masking makes invalid output impossible regardless of model.","c":"Valid shape can still hold wrong values","tree":true},{"id":"4.13","s":"e4_constrained","t":"e4_outlines","sc":"Local Python model, quick typed output","w":"Outlines gives schema and Literal constraints with one call.","tree":true},{"id":"4.14","s":"e4_constrained","t":"e4_xgrammar","sc":"High throughput serving with grammars","w":"XGrammar keeps mask overhead near zero at batch scale.","c":"Engine-level component, not an app library","tree":true},{"id":"4.15","s":"e4_constrained","t":"e4_gbnf","sc":"Running GGUF models via llama.cpp or Ollama","w":"GBNF is the native grammar format there.","c":"Hand-written grammars are easy to get subtly wrong","tree":true},{"id":"4.16","s":"e4_constrained","t":"e4_vllmguided","sc":"Serving open models behind an OpenAI API","w":"vLLM exposes guided decoding via familiar request fields.","c":"Option names vary across vLLM versions","tree":true},{"id":"4.17","s":"e4_constrained","t":"e4_tradeoff","sc":"Accuracy dropped after enforcing schema","w":"Constraints can fight the model's reasoning; know when to relax them.","c":"Looser schemas mean more validation work","tree":true},{"id":"4.18","s":"E4","t":"e4_schemadesign","sc":"Format is valid but fields are wrong","w":"Schema wording and shape act as instructions to the model.","tree":true},{"id":"4.19","s":"e4_schemadesign","t":"e4_fielddesc","sc":"Fields confused or units wrong","w":"Descriptions carry per-field rules right where the model needs them.","tree":true},{"id":"4.20","s":"e4_schemadesign","t":"e4_optional","sc":"Model invents values for missing data","w":"Nullable fields give an honest way to say absent.","c":"More null handling in downstream code","tree":true},{"id":"4.21","s":"e4_schemadesign","t":"e4_flatten","sc":"Big nested schema drops fields","w":"Shallow shapes are easier to fill and fit strict-mode limits.","c":"May need ID references or multiple calls","tree":true},{"id":"4.22","s":"e4_schemadesign","t":"e4_reasonfirst","sc":"Strict JSON hurts reasoning accuracy","w":"Key order lets the model reason before committing to a label.","c":"Extra output tokens per call","tree":true},{"id":"4.23","s":"E4","t":"e4_classify","sc":"Need a label from a fixed set","w":"Enum-constrained output never returns an unknown category.","c":"Label set changes require schema and eval updates","tree":true},{"id":"4.24","s":"e4_classify","t":"e4_abstain","sc":"Some inputs are genuinely ambiguous","w":"An explicit unsure path protects precision on auto-accepted cases.","c":"Lower coverage; humans handle the rest","tree":true},{"id":"4.25","s":"e4_abstain","t":"e4_selfconsistency","sc":"Need confidence the model cannot self-report","w":"Agreement across samples is a better-calibrated signal.","c":"N times the cost and latency","tree":true},{"id":"4.26","s":"E4","t":"e4_extraction","sc":"Turning many documents into database rows","w":"A staged pipeline makes extraction scalable and measurable.","c":"More moving parts to monitor","tree":true},{"id":"4.27","s":"e4_extraction","t":"e4_streaming","sc":"Users wait on long structured replies","w":"Partial parsing renders fields as they arrive.","c":"Must not act on incomplete fields","tree":true},{"id":"4.28","s":"e4_extraction","t":"e6_ingest","sc":"Documents also feed a RAG index","w":"Same parse and chunk stage serves both extraction and retrieval.","c":"Different chunk sizes may suit each","tree":false},{"id":"4.29","s":"e4_extraction","t":"e10_golden","sc":"Need field-level accuracy numbers","w":"A labeled golden set is how extraction quality is tracked.","tree":false},{"id":"4.30","s":"e4_classify","t":"e12_routing","sc":"Labels pick which model or flow runs","w":"Cheap enum classifiers are the usual router front end.","c":"Misroutes are silent unless logged","tree":false},{"id":"4.31","s":"e4_jsonschema","t":"e8_schema","sc":"Same schema skills apply to tools","w":"Tool parameter schemas follow the same design rules.","tree":false},{"id":"4.32","s":"e4_constrained","t":"e13_vllm","sc":"Deploying grammar-constrained models","w":"Serving engines host the grammar backends in production.","tree":false},{"id":"4.33","s":"e4_validation","t":"e2_retries","sc":"Combine format and transport retries","w":"Network retries and validation re-asks need one shared budget.","c":"Nested retries multiply cost","tree":false},{"id":"4.34","s":"e4_streaming","t":"e16_streamux","sc":"Designing progressive result UIs","w":"UX patterns decide how partial objects render.","tree":false},{"id":"4.35","s":"e4_selfconsistency","t":"e10_judge","sc":"Voting is not enough for open text","w":"Judges score free-form fields that cannot be majority-voted.","tree":false},{"id":"5.1","s":"E5","t":"e5_budget","sc":"Context fills up or costs too much","w":"Explicit budget shares make trade-offs visible.","c":"Budgets need retuning per model and task","tree":true},{"id":"5.2","s":"e5_budget","t":"e5_tokencount","sc":"Requests fail on context length","w":"Accurate counts let you trim before sending.","c":"Count calls add a little latency","tree":true},{"id":"5.3","s":"e5_budget","t":"e5_rot","sc":"Answers worsen as prompts grow","w":"Quality degrades with length, so budget below the max.","tree":true},{"id":"5.4","s":"e5_rot","t":"e5_ordering","sc":"Key facts ignored in long prompts","w":"Position strongly affects attention on long inputs.","c":"Gains vary by model; test on yours","tree":true},{"id":"5.5","s":"e5_rot","t":"e5_failmodes","sc":"Agent acts on wrong or stale info","w":"Naming the failure mode points to the fix.","tree":true},{"id":"5.6","s":"E5","t":"e5_history","sc":"Long chats or agent runs","w":"History is the part of context that grows without bound.","tree":true},{"id":"5.7","s":"e5_history","t":"e5_slidingwindow","sc":"Need a simple cap on history","w":"Dropping old turns is the cheapest policy.","c":"Loses early facts; breaks prefix cache","tree":true},{"id":"5.8","s":"e5_history","t":"e5_compaction","sc":"Early decisions must survive","w":"Summaries keep the gist while freeing most tokens.","c":"Summaries lose detail and can embed errors","tree":true},{"id":"5.9","s":"e5_history","t":"e5_trimtools","sc":"Tool outputs dominate the window","w":"Clearing used results frees the most tokens for least loss.","c":"Agent may need to re-run tools","tree":true},{"id":"5.10","s":"E5","t":"e5_jit","sc":"Corpus too big to pre-load","w":"Handles plus tools let the agent fetch only what it needs.","c":"More turns and latency","tree":true},{"id":"5.11","s":"e5_jit","t":"e5_scratchpad","sc":"Long task outlives one context","w":"External notes persist across compaction and resets.","c":"Bad notes persist too","tree":true},{"id":"5.12","s":"e5_jit","t":"e5_instrfiles","sc":"Agent repeats same project mistakes","w":"Auto-loaded instruction files carry durable conventions.","c":"Bloated files tax every session","tree":true},{"id":"5.13","s":"E5","t":"e5_cachefriendly","sc":"High repeat-prefix traffic, high input bill","w":"Stable prefix layout unlocks prompt caching.","c":"Constrains where dynamic data can go","tree":true},{"id":"5.14","s":"e5_jit","t":"e5_subagent","sc":"Exploration floods main context","w":"Isolated sub-contexts return only condensed results.","c":"Higher total tokens; detail lost in handoff","tree":true},{"id":"5.15","s":"E5","t":"e5_memory","sc":"Must remember across sessions","w":"Memory types map to different stores and retrieval.","tree":true},{"id":"5.16","s":"e5_memory","t":"e5_sessionstate","sc":"Unclear what to persist where","w":"Separating thread state from long-term memory sets scope.","tree":true},{"id":"5.17","s":"e5_memory","t":"e5_memstores","sc":"Do not want to build memory from scratch","w":"Existing layers handle extraction, storage and search.","c":"Another dependency and LLM cost per write","tree":true},{"id":"5.18","s":"e5_memstores","t":"e5_mem0","sc":"Want per-user fact memory quickly","w":"Mem0 bundles extraction, dedupe and search.","c":"Extraction quality bounds memory quality","tree":true},{"id":"5.19","s":"e5_memstores","t":"e5_letta","sc":"Agent should manage its own memory","w":"Letta exposes memory editing as agent tools.","c":"Opinionated runtime; more moving parts","tree":true},{"id":"5.20","s":"e5_memstores","t":"e5_lgstore","sc":"Already building on LangGraph","w":"The store reuses LangGraph persistence and namespaces.","tree":true},{"id":"5.21","s":"e5_memory","t":"e5_profile","sc":"Want personalization on every turn","w":"A compact profile is cheap to inject always.","c":"Profile can go stale or wrong","tree":true},{"id":"5.22","s":"e5_memory","t":"e5_memretrieval","sc":"Too many memories to include","w":"Ranking picks the few that matter for this turn.","tree":true},{"id":"5.23","s":"e5_memory","t":"e5_writepolicy","sc":"Memory fills with junk or attacks","w":"Write gates keep only durable, trusted facts.","c":"Strict gates miss some useful facts","tree":true},{"id":"5.24","s":"e5_writepolicy","t":"e5_forgetting","sc":"Old or deleted facts keep resurfacing","w":"Expiry and deletion keep memory accurate and compliant.","c":"Aggressive decay forgets useful facts","tree":true},{"id":"5.25","s":"e5_cachefriendly","t":"e12_promptcaching","sc":"Turn layout into actual savings","w":"Provider caching rules decide breakpoints and TTLs.","tree":false},{"id":"5.26","s":"e5_jit","t":"e6_hybrid","sc":"JIT lookups need good retrieval","w":"Retrieval quality bounds what the agent can fetch.","tree":false},{"id":"5.27","s":"e5_subagent","t":"e9_orchestrator","sc":"Sub-agents need coordination","w":"Orchestrator pattern structures delegation and synthesis.","c":"Coordination overhead","tree":false},{"id":"5.28","s":"e5_trimtools","t":"e8_codeexec","sc":"Large data should never enter context","w":"Processing data in a sandbox returns only the small result.","c":"Needs a secure sandbox","tree":false},{"id":"5.29","s":"e5_writepolicy","t":"e15_injection","sc":"Untrusted content could write memory","w":"Injected text persisted to memory becomes a lasting exploit.","c":"Stricter gates, fewer automatic writes","tree":false},{"id":"5.30","s":"e5_sessionstate","t":"e9_checkpoint","sc":"Persist thread state for resume","w":"Checkpointers implement session state durably.","tree":false},{"id":"5.31","s":"e5_failmodes","t":"e8_mcp","sc":"Many MCP servers flood tool list","w":"Each connected server adds tool definitions that can confuse the model.","c":"Fewer servers, less capability","tree":false},{"id":"5.32","s":"e5_compaction","t":"e10_agenteval","sc":"Check compaction does not hurt tasks","w":"Long-horizon agent evals reveal lost facts.","tree":false},{"id":"6.1","s":"E6","t":"e6_ingest","sc":"Raw sources must become searchable chunks","w":"Retrieval quality starts with what you index.","tree":true,"c":"Pipeline work is unglamorous but compounds"},{"id":"6.2","s":"e6_ingest","t":"e6_parsing","sc":"PDFs and Office docs, not clean text","w":"Parsing is the first lossy step; errors propagate everywhere.","tree":true,"c":"Better parsing costs CPU/GPU or per-page fees"},{"id":"6.3","s":"e6_parsing","t":"e6_parsers","sc":"Need a parser for these doc types","w":"Concrete tools differ sharply on tables and scans.","tree":true,"c":"Hosted parsers send docs to a third party"},{"id":"6.4","s":"e6_parsing","t":"e6_vlmparse","sc":"Scans, charts or tables break parsers","w":"VLMs read pages like a human, layout included.","tree":true,"c":"Token cost per page and possible hallucinated numbers"},{"id":"6.5","s":"e6_ingest","t":"e6_cleaning","sc":"Top-k full of boilerplate or dupes","w":"Removing noise frees top-k slots for real evidence.","tree":true,"c":"Aggressive dedupe can drop legit versions"},{"id":"6.6","s":"E6","t":"e6_chunking","sc":"Docs too long to embed or prompt whole","w":"Chunking decides the unit of retrieval.","tree":true,"c":"Every choice trades precision for context"},{"id":"6.7","s":"e6_chunking","t":"e6_fixedchunk","sc":"Need a baseline today","w":"Simplest splitter, easy to reason about.","tree":true,"c":"Cuts tables and sentences arbitrarily"},{"id":"6.8","s":"e6_chunking","t":"e6_recursivechunk","sc":"Docs have headings, lists or code","w":"Respecting structure keeps chunks coherent.","tree":true,"c":"Uneven chunk sizes; needs per-format rules"},{"id":"6.9","s":"e6_chunking","t":"e6_semanticchunk","sc":"Unstructured prose with topic shifts","w":"Splits where meaning changes, not at a count.","tree":true,"c":"Extra embed cost, gains often marginal"},{"id":"6.10","s":"e6_chunking","t":"e6_latechunk","sc":"Chunks lose meaning out of context","w":"Chunk vectors inherit whole-document context.","tree":true,"c":"Requires long-context token-level embedder"},{"id":"6.11","s":"e6_chunking","t":"e6_chunksize","sc":"Unsure what size to use","w":"Size is the main chunking knob to tune.","tree":true,"c":"Optimal size differs by query type"},{"id":"6.12","s":"e6_chunking","t":"e6_contextual","sc":"Chunks are ambiguous on their own","w":"LLM-written context makes each chunk self-describing.","tree":true,"c":"One LLM call per chunk at ingest"},{"id":"6.13","s":"e6_ingest","t":"e6_metadata","sc":"Queries imply date, region or product","w":"Structured fields enable filters and boosts.","tree":true,"c":"Extraction errors silently exclude docs"},{"id":"6.14","s":"e6_ingest","t":"e6_incremental","sc":"Sources change after first load","w":"Index must track creates, edits and deletes.","tree":true,"c":"Needs change detection and reconciliation jobs"},{"id":"6.15","s":"E6","t":"e6_embedmodel","sc":"Need vectors for chunks and queries","w":"Embedder sets the ceiling for dense recall.","tree":true,"c":"Changing models later means full re-embed"},{"id":"6.16","s":"e6_embedmodel","t":"e6_queryprefix","sc":"Model card mentions prefixes or input_type","w":"Asymmetric models need the right task hints.","tree":true,"c":"Mismatched prefixes silently hurt recall"},{"id":"6.17","s":"e6_embedmodel","t":"e6_matryoshka","sc":"Vectors too big for budget","w":"Truncate MRL vectors instead of changing models.","tree":true,"c":"Small quality drop; only for MRL models"},{"id":"6.18","s":"E6","t":"e6_sparse","sc":"Queries contain IDs, codes, rare terms","w":"Lexical match catches what embeddings blur.","tree":true,"c":"No synonym or paraphrase understanding"},{"id":"6.19","s":"e6_sparse","t":"e6_hybrid","sc":"Need both keyword and semantic matches","w":"Fusing both lists beats either alone on most sets.","tree":true,"c":"Two indexes to build and keep in sync"},{"id":"6.20","s":"e6_hybrid","t":"e6_rerank","sc":"Right chunk retrieved but ranked low","w":"Cross-encoders reorder a short list precisely.","tree":true,"c":"Adds latency and per-query cost"},{"id":"6.21","s":"e6_rerank","t":"e6_smalltobig","sc":"Precise hits but too little context","w":"Return the parent of a matched small chunk.","tree":true,"c":"More prompt tokens per answer"},{"id":"6.22","s":"e6_smalltobig","t":"e6_sentencewindow","sc":"Need sentence-level precision","w":"Finest-grained variant of small-to-big.","tree":true,"c":"Many more vectors in the index"},{"id":"6.23","s":"E6","t":"e6_queryrewrite","sc":"User queries are vague or conversational","w":"Fix the query before blaming the index.","tree":true,"c":"Extra LLM hop on every request"},{"id":"6.24","s":"e6_queryrewrite","t":"e6_hyde","sc":"Short questions vs long technical docs","w":"Answer-shaped text embeds closer to documents.","tree":true,"c":"Hallucinated terms can mislead retrieval"},{"id":"6.25","s":"e6_queryrewrite","t":"e6_decomposition","sc":"Compound or multi-hop questions","w":"Each sub-question gets its own retrieval.","tree":true,"c":"More retrieval calls and fusion logic"},{"id":"6.26","s":"e6_queryrewrite","t":"e6_routing","sc":"Several indexes or tools can answer","w":"Send each query to the source that fits.","tree":true,"c":"Misroutes fail silently unless evaluated"},{"id":"6.27","s":"E6","t":"e6_citations","sc":"Users must verify answers","w":"Grounding makes answers checkable and debuggable.","tree":true,"c":"Strict grounding increases 'I don't know' rate"},{"id":"6.28","s":"E6","t":"e6_acl","sc":"Corpus has restricted documents","w":"Security must be enforced in retrieval, not prompts.","tree":true,"c":"ACL sync adds pipeline complexity"},{"id":"6.29","s":"E6","t":"e6_longcontext","sc":"Corpus might fit in the window","w":"Decide whether to build RAG at all.","tree":true,"c":"Long context costs more per query"},{"id":"6.30","s":"E6","t":"e6_graphrag","sc":"Global or entity-relationship questions","w":"Graph structure answers what chunks can't.","tree":true,"c":"Expensive indexing, complex to maintain"},{"id":"6.31","s":"E6","t":"e6_agenticrag","sc":"One retrieval pass isn't enough","w":"Let the model search iteratively like a researcher.","tree":true,"c":"Higher latency, cost and variance"},{"id":"6.32","s":"E6","t":"e6_multimodal","sc":"Answers live in charts, slides or scans","w":"Retrieve visual pages directly.","tree":true,"c":"Much larger multi-vector storage"},{"id":"6.33","s":"E6","t":"e6_ragfailures","sc":"Answers are wrong and you don't know why","w":"A taxonomy points to the stage to fix.","tree":true},{"id":"6.34","s":"E6","t":"e6_frameworks","sc":"Want a working prototype quickly","w":"Frameworks wire the standard pipeline for you.","tree":true,"c":"Abstractions can hide what's sent to the model"},{"id":"6.35","s":"e6_ragfailures","t":"e10_ragmetrics","sc":"Need numbers, not anecdotes","w":"Measure context recall/precision and faithfulness per stage.","tree":false,"c":"Metric judges need calibration"},{"id":"6.36","s":"e6_hybrid","t":"e7_pgvector","sc":"Already running Postgres","w":"pgvector + tsvector can do both sides of hybrid in SQL.","tree":false,"c":"You hand-write the fusion query"},{"id":"6.37","s":"e6_acl","t":"e7_filtering","sc":"Permission filters are very selective","w":"Filtered ANN behavior decides recall under ACLs.","tree":false,"c":"Post-filtering can return too few results"},{"id":"6.38","s":"e6_matryoshka","t":"e7_quantization","sc":"Still too much memory after truncation","w":"Quantize the truncated vectors and rescore.","tree":false,"c":"Compounding small recall losses"},{"id":"6.39","s":"e6_ingest","t":"e16_docai","sc":"Docs are forms or invoices","w":"Structured extraction may beat chunking for forms.","tree":false},{"id":"6.40","s":"e6_agenticrag","t":"e9_loop","sc":"Building the iterative search loop","w":"Agentic RAG is an agent loop with search tools.","tree":false,"c":"Needs stop conditions and budgets"},{"id":"6.41","s":"e6_citations","t":"e16_trustux","sc":"Showing sources in the UI","w":"Clickable citations turn grounding into user trust.","tree":false},{"id":"6.42","s":"e6_contextual","t":"e12_promptcaching","sc":"Per-chunk context calls are costly","w":"Cache the full document once, vary only the chunk.","tree":false,"c":"Cache TTL limits batching windows"},{"id":"6.43","s":"e6_frameworks","t":"e17_docchat","sc":"Ready to assemble end to end","w":"Doc-chat reference architecture shows the full stack.","tree":false},{"id":"7.1","s":"E7","t":"e7_embeddings","sc":"Need to store and compare embeddings","w":"Everything starts with what a vector is and costs.","tree":true},{"id":"7.2","s":"e7_embeddings","t":"e7_metrics","sc":"Choosing how to score similarity","w":"Metric must match model training and index operator.","tree":true,"c":"Wrong metric gives plausible but worse rankings"},{"id":"7.3","s":"E7","t":"e7_knn_ann","sc":"Search over many vectors","w":"Decide exact vs approximate before picking an index.","tree":true,"c":"ANN gives up some recall for speed"},{"id":"7.4","s":"e7_knn_ann","t":"e7_recall","sc":"Need to quantify ANN quality","w":"Recall@k vs latency is the core tuning curve.","tree":true,"c":"Requires exact ground truth runs"},{"id":"7.5","s":"e7_knn_ann","t":"e7_hnsw","sc":"Low-latency high-recall in RAM","w":"HNSW is the default ANN index almost everywhere.","tree":true,"c":"RAM-hungry, slow builds"},{"id":"7.6","s":"e7_knn_ann","t":"e7_ivf","sc":"Large set, faster builds, less RAM","w":"Clustering limits how much is scanned.","tree":true,"c":"Needs training; recall sensitive to nprobe"},{"id":"7.7","s":"e7_ivf","t":"e7_pq","sc":"Vectors don't fit in RAM","w":"PQ compresses IVF cells dramatically.","tree":true,"c":"Lower recall; rescoring needed"},{"id":"7.8","s":"e7_knn_ann","t":"e7_diskann","sc":"Billions of vectors on few nodes","w":"SSD-resident graph scales past RAM.","tree":true,"c":"Needs fast NVMe; more complex ops"},{"id":"7.9","s":"e7_knn_ann","t":"e7_quantization","sc":"Memory cost dominates the bill","w":"Compact codes with rescoring keep recall.","tree":true,"c":"Rescoring needs full vectors stored somewhere"},{"id":"7.10","s":"e7_knn_ann","t":"e7_faiss","sc":"Want in-process indexes, no server","w":"FAISS implements every major index type.","tree":true,"c":"No filtering, persistence or replication built in"},{"id":"7.11","s":"E7","t":"e7_filtering","sc":"Queries carry tenant, ACL or date filters","w":"Filter strategy decides recall under constraints.","tree":true,"c":"Engine-specific behavior and indexes"},{"id":"7.12","s":"e7_filtering","t":"e7_multitenancy","sc":"Many customers share the store","w":"Tenant isolation is filtering plus partitioning.","tree":true,"c":"Per-tenant indexes multiply ops"},{"id":"7.13","s":"E7","t":"e7_vectordbs","sc":"Need somewhere to store and query vectors","w":"Know the categories before comparing products.","tree":true,"c":"Each store adds a system to operate"},{"id":"7.14","s":"e7_vectordbs","t":"e7_pgvector","sc":"Already run Postgres","w":"Vectors next to relational data with SQL.","tree":true,"c":"Index builds compete with OLTP load"},{"id":"7.15","s":"e7_pgvector","t":"e7_fts_vector","sc":"Need hybrid search in Postgres","w":"One SQL statement fuses vector and full-text.","tree":true,"c":"Postgres ts_rank isn't true BM25"},{"id":"7.16","s":"e7_vectordbs","t":"e7_choosing","sc":"Deciding Postgres vs dedicated","w":"A default rule avoids premature infrastructure.","tree":true,"c":"Migration later if you outgrow it"},{"id":"7.17","s":"e7_vectordbs","t":"e7_hybridindb","sc":"Want BM25 and vectors in one store","w":"Native fusion removes a separate search engine.","tree":true,"c":"Less control over fusion and analyzers"},{"id":"7.18","s":"e7_vectordbs","t":"e7_serverless","sc":"Huge corpus, mostly cold queries","w":"Object storage makes idle data cheap.","tree":true,"c":"Cold-query latency is higher"},{"id":"7.19","s":"E7","t":"e7_sizing","sc":"Planning hardware or budget","w":"Simple arithmetic predicts RAM and cost.","tree":true,"c":"Real overhead varies by engine"},{"id":"7.20","s":"E7","t":"e7_freshness","sc":"Content changes continuously","w":"Update/delete behavior affects staleness and recall.","tree":true,"c":"Rebuilds and compaction cost compute"},{"id":"7.21","s":"E7","t":"e7_reembed","sc":"Changing the embedding model","w":"Model swaps require a full re-index plan.","tree":true,"c":"Embed cost and temporary 2x storage"},{"id":"7.22","s":"E7","t":"e7_benchmark","sc":"Comparing stores or tuning knobs","w":"Your data and filters decide, not vendor charts.","tree":true,"c":"Realistic benchmarks take real effort"},{"id":"7.23","s":"e7_hybridindb","t":"e6_hybrid","sc":"Understand the fusion being applied","w":"RRF and fusion basics live in RAG engineering.","tree":false},{"id":"7.24","s":"e7_multitenancy","t":"e15_leastpriv","sc":"Tenants must never see others' data","w":"Tenant isolation is least privilege applied to retrieval.","tree":false,"c":"A forgotten filter is a data leak"},{"id":"7.25","s":"e7_reembed","t":"e6_embedmodel","sc":"Picking the new model","w":"Choose by retrieval evals before migrating.","tree":false},{"id":"7.26","s":"e7_quantization","t":"e6_embedmodel","sc":"Pick a quantization-friendly embedder","w":"Some models are trained to survive int8/binary codes.","tree":false,"c":"Narrows model choice"},{"id":"7.27","s":"e7_freshness","t":"e6_ingest","sc":"Driving updates from the source","w":"Ingestion change detection feeds upserts/deletes.","tree":false},{"id":"7.28","s":"e7_benchmark","t":"e10_ragmetrics","sc":"ANN recall looks fine, answers don't","w":"End-to-end retrieval metrics catch embedder issues.","tree":false,"c":"Needs labeled queries"},{"id":"7.29","s":"e7_hnsw","t":"e12_latency","sc":"Search is part of the latency budget","w":"efSearch is a direct latency/quality dial.","tree":false,"c":"Higher recall costs ms per query"},{"id":"7.30","s":"e7_choosing","t":"e17_docchat","sc":"Wiring the store into an app","w":"See the full doc-chat reference stack.","tree":false},{"id":"8.1","s":"E8","t":"e8_roundtrip","sc":"Model must act or fetch data","w":"The round trip is the basic mechanic behind every tool and agent.","tree":true},{"id":"8.2","s":"e8_roundtrip","t":"e8_schema","sc":"Model picks wrong tool or args","w":"Names, descriptions and params are the model's only docs.","c":"Longer descriptions cost tokens every call","tree":true},{"id":"8.3","s":"e8_schema","t":"e8_aci","sc":"Tools technically work, agent still fails","w":"Designing for the model's workflow fixes systemic misuse.","c":"Requires transcript review and iteration","tree":true},{"id":"8.4","s":"e8_roundtrip","t":"e8_toolchoice","sc":"Need to force or forbid tool calls","w":"tool_choice gives explicit control per request.","c":"Forced calls can produce junk args when no tool fits","tree":true},{"id":"8.5","s":"e8_roundtrip","t":"e8_parallel","sc":"Several independent lookups per step","w":"Concurrent execution cuts wall-clock latency.","c":"Ordering bugs if calls are not truly independent","tree":true},{"id":"8.6","s":"e8_roundtrip","t":"e8_resultformat","sc":"Tool outputs bloat the context","w":"Compact, capped results keep the loop efficient.","c":"Over-trimming hides data the model needed","tree":true},{"id":"8.7","s":"e8_resultformat","t":"e8_errors","sc":"Agent loops after a failed call","w":"Actionable error text lets the model fix its call.","tree":true},{"id":"8.8","s":"e8_roundtrip","t":"e8_sideeffects","sc":"Tools can change real data","w":"Separating reads from writes enables safe autonomy.","c":"Approvals add friction and latency","tree":true},{"id":"8.9","s":"e8_sideeffects","t":"e8_idempotent","sc":"Retries cause duplicate actions","w":"Idempotency makes repeats harmless.","c":"Needs key storage or downstream support","tree":true},{"id":"8.10","s":"e8_schema","t":"e8_toolsearch","sc":"Dozens to hundreds of tools","w":"Loading only relevant tools keeps selection accurate.","c":"Search miss means the tool is invisible","tree":true},{"id":"8.11","s":"e8_parallel","t":"e8_codemode","sc":"Many chained calls on large data","w":"Code orchestrates calls locally and returns only results.","c":"Requires a sandbox and code review risk","tree":true},{"id":"8.12","s":"E8","t":"e8_hosted","sc":"Deciding build vs use provider tools","w":"Server tools remove infra; client tools give control.","tree":true},{"id":"8.13","s":"e8_hosted","t":"e8_codeexec","sc":"Need exact math or data analysis","w":"Running code beats model arithmetic.","c":"Sandbox escape and resource abuse risks","tree":true},{"id":"8.14","s":"e8_hosted","t":"e8_websearch","sc":"Answers need fresh public info","w":"Search grounds answers past the training cutoff.","c":"Fetched pages can carry prompt injection","tree":true},{"id":"8.15","s":"e8_hosted","t":"e8_computeruse","sc":"Target app has no API","w":"GUI control reaches systems APIs cannot.","c":"Slow, brittle and high-risk; sandbox it","tree":true},{"id":"8.16","s":"E8","t":"e8_mcp","sc":"Same integrations needed across AI apps","w":"A standard protocol makes integrations reusable.","c":"Extra process or network hop; new attack surface","tree":true},{"id":"8.17","s":"e8_mcp","t":"e8_mcparch","sc":"Unclear who owns what in MCP","w":"The host-client-server split sets responsibility.","tree":true},{"id":"8.18","s":"e8_mcparch","t":"e8_mcpprims","sc":"Choosing how to expose server data","w":"Tools, resources and prompts have different controllers.","tree":true},{"id":"8.19","s":"e8_mcp","t":"e8_mcptransport","sc":"Deploying a server locally or remotely","w":"Transport choice sets scale, auth and ops model.","c":"Remote HTTP needs auth and hosting","tree":true},{"id":"8.20","s":"e8_mcptransport","t":"e8_mcpauth","sc":"Remote server with per-user data","w":"OAuth gives scoped, revocable, per-user access.","c":"OAuth setup is the hardest part of remote MCP","tree":true},{"id":"8.21","s":"e8_mcp","t":"e8_fastmcp","sc":"Exposing your own API via MCP","w":"FastMCP turns typed functions into a server fast.","tree":true},{"id":"8.22","s":"e8_mcp","t":"e8_mcpsecurity","sc":"Connecting third-party MCP servers","w":"Untrusted servers can inject instructions or exfiltrate data.","c":"Vetting limits which servers you can use","tree":true},{"id":"8.23","s":"e8_mcp","t":"e8_a2a","sc":"Delegating to other teams' agents","w":"A2A standardizes agent discovery and task handoff.","c":"Younger ecosystem; fewer implementations","tree":true},{"id":"8.24","s":"E8","t":"e8_tooleval","sc":"Shipping changes to tools or prompts","w":"Trajectory-level tests catch tool-use regressions.","c":"Labeled tool-call cases take effort to build","tree":true},{"id":"8.25","s":"e8_roundtrip","t":"e9_loop","sc":"Tool calls repeat until task done","w":"The agent loop is the round trip run repeatedly.","tree":false},{"id":"8.26","s":"e8_codeexec","t":"e15_sandbox","sc":"Running untrusted model-written code","w":"Isolation design determines blast radius.","c":"Stronger isolation, more ops work","tree":false},{"id":"8.27","s":"e8_mcpsecurity","t":"e15_trifecta","sc":"Server mix grants data, input and egress","w":"The trifecta check flags dangerous tool combinations.","tree":false},{"id":"8.28","s":"e8_sideeffects","t":"e9_hitl","sc":"Write actions need human sign-off","w":"HITL patterns implement approvals in the agent loop.","c":"Blocks unattended runs","tree":false},{"id":"8.29","s":"e8_tooleval","t":"e10_agenteval","sc":"Score whole agent runs","w":"Tool-call checks feed agent-level eval suites.","tree":false},{"id":"8.30","s":"e8_websearch","t":"e6_citations","sc":"Search answers need sources shown","w":"Citation patterns make web answers verifiable.","tree":false},{"id":"8.31","s":"e8_toolsearch","t":"e5_budget","sc":"Tool defs eat the context budget","w":"Budget planning shows what deferred loading saves.","tree":false},{"id":"8.32","s":"e8_schema","t":"e4_jsonschema","sc":"Strict args for tool params","w":"Strict schema mode also applies to tool arguments.","c":"Same keyword limits as structured output","tree":false},{"id":"8.33","s":"e8_resultformat","t":"e5_compaction","sc":"Results still pile up over turns","w":"Compaction handles what per-result caps cannot.","tree":false},{"id":"9.1","s":"E9","t":"e9_augmented_llm","sc":"Start from the single building block","w":"Every workflow and agent is built from augmented LLM calls.","tree":true},{"id":"9.2","s":"E9","t":"e9_workflows_vs_agents","sc":"Deciding how much autonomy to grant","w":"The first architecture decision is how much control the model gets.","c":"More autonomy means more flexibility but less predictability.","tree":true},{"id":"9.3","s":"e9_workflows_vs_agents","t":"e9_workflow_patterns","sc":"Steps are known in advance","w":"Predictable tasks are best served by code-defined paths.","c":"Brittle when inputs drift outside the designed paths.","tree":true},{"id":"9.4","s":"e9_workflow_patterns","t":"e9_prompt_chaining","sc":"Task splits into fixed sequential steps","w":"Each step becomes simpler and individually checkable.","c":"Latency adds up with every step.","tree":true},{"id":"9.5","s":"e9_workflow_patterns","t":"e9_routing","sc":"Inputs fall into distinct categories","w":"Specialized handlers beat one prompt trying to cover everything.","c":"A misroute sends the user down the wrong path entirely.","tree":true},{"id":"9.6","s":"e9_workflow_patterns","t":"e9_parallelization","sc":"Independent subtasks or need for confidence","w":"Concurrency cuts latency; voting cuts variance.","c":"Token cost multiplies with the number of calls.","tree":true},{"id":"9.7","s":"e9_workflow_patterns","t":"e9_orchestrator","sc":"Subtasks only known at runtime","w":"A model decides the decomposition while code runs the workers.","c":"Harder to test; workers can duplicate or miss work.","tree":true},{"id":"9.8","s":"e9_workflow_patterns","t":"e9_evaluator_optimizer","sc":"Clear criteria and feedback helps","w":"Iterative critique converges on outputs meeting explicit criteria.","c":"Each round adds a generate plus evaluate call.","tree":true},{"id":"9.9","s":"e9_workflows_vs_agents","t":"e9_loop","sc":"Steps can't be predicted up front","w":"Open-ended tasks need the model to choose actions dynamically.","c":"Cost and latency become variable and need caps.","tree":true},{"id":"9.10","s":"e9_loop","t":"e9_react","sc":"Need to see why each tool was chosen","w":"ReAct is the canonical reason-act-observe shape of the loop.","c":"Reasoning tokens add cost on every step.","tree":true},{"id":"9.11","s":"e9_loop","t":"e9_plan_execute","sc":"Long task needs an inspectable plan","w":"An explicit plan can be reviewed, approved and run by cheaper models.","c":"Plans go stale when early results change the picture.","tree":true},{"id":"9.12","s":"e9_loop","t":"e9_reflection","sc":"Outputs fail and evidence explains why","w":"Grounded critique turns failure signals into better retries.","c":"Ungrounded self-critique can make correct answers worse.","tree":true},{"id":"9.13","s":"e9_loop","t":"e9_stop_conditions","sc":"Runs could loop or overspend","w":"Every loop needs explicit exits beyond the model saying done.","c":"Caps set too low cut off legitimately long tasks.","tree":true},{"id":"9.14","s":"e9_stop_conditions","t":"e9_stuck_detection","sc":"Agent repeats itself before hitting caps","w":"Detecting repetition early saves most of the wasted budget.","c":"False positives on legitimate repeated polling calls.","tree":true},{"id":"9.15","s":"e9_loop","t":"e9_error_recovery","sc":"Tools fail mid-run","w":"Failures handled well become observations the model can fix.","c":"Hiding too many errors from the model hides real problems.","tree":true},{"id":"9.16","s":"e9_loop","t":"e9_subagents","sc":"Context fills with exploration noise","w":"Fresh child contexts keep the main thread focused.","c":"Child lacks parent context, so briefs must be complete.","tree":true},{"id":"9.17","s":"e9_subagents","t":"e9_multiagent","sc":"Work needs several distinct roles","w":"Multiple agents generalize subagents to peer collaboration.","c":"Roughly 15x tokens and new coordination failure modes.","tree":true},{"id":"9.18","s":"e9_multiagent","t":"e9_supervisor","sc":"Need central control over specialists","w":"One coordinator enforces order, budget and completion.","c":"Supervisor is a latency and token bottleneck.","tree":true},{"id":"9.19","s":"e9_multiagent","t":"e9_handoffs","sc":"Specialist should own the rest of the chat","w":"Direct transfers avoid routing every turn through a coordinator.","c":"Harder to enforce global policy; risk of ping-pong.","tree":true},{"id":"9.20","s":"e9_multiagent","t":"e9_debate","sc":"Hard judgment where diverse views help","w":"Cross-critique can surface errors one model misses.","c":"Often no better than voting at equal cost.","tree":true},{"id":"9.21","s":"E9","t":"e9_state_graph","sc":"Control flow needs to be explicit","w":"Graphs make branches, loops and resume points first-class.","c":"Another abstraction to learn and debug.","tree":true},{"id":"9.22","s":"e9_state_graph","t":"e9_state_design","sc":"Deciding what persists between steps","w":"State shape determines context size, resumability and debuggability.","c":"Over-structured state is rigid; under-structured bloats context.","tree":true},{"id":"9.23","s":"e9_state_graph","t":"e9_checkpoint","sc":"Runs must survive crashes and deploys","w":"Persisting state per step makes long runs restartable.","c":"Side-effecting steps must be idempotent to replay safely.","tree":true},{"id":"9.24","s":"e9_checkpoint","t":"e9_hitl","sc":"Risky actions need a human sign-off","w":"Checkpoints let a run pause for hours while waiting on approval.","c":"Approval fatigue makes people rubber-stamp.","tree":true},{"id":"9.25","s":"E9","t":"e9_agent_archetypes","sc":"Building a known kind of agent","w":"Proven archetypes come with tested tool sets and verification.","tree":true},{"id":"9.26","s":"e9_agent_archetypes","t":"e9_coding_agents","sc":"Agent works on a code repo","w":"Tests give coding agents a strong built-in verifier.","c":"Without good tests, agents confidently ship wrong code.","tree":true},{"id":"9.27","s":"e9_coding_agents","t":"e9_sandboxes","sc":"Agent runs arbitrary code or shell","w":"Isolation bounds the blast radius of mistakes and injections.","c":"Sandboxes add startup latency and environment drift.","tree":true},{"id":"9.28","s":"e9_agent_archetypes","t":"e9_browser_agents","sc":"Target system has no API","w":"GUI and browser control reaches software APIs can't.","c":"Slow, brittle and exposed to prompt injection.","tree":true},{"id":"9.29","s":"e9_agent_archetypes","t":"e9_deep_research","sc":"Question needs many sources","w":"Parallel search subagents cover breadth quickly.","c":"High token cost and citation accuracy needs checking.","tree":true},{"id":"9.30","s":"e9_agent_archetypes","t":"e9_long_horizon","sc":"Task exceeds one context window","w":"External notes and git let fresh sessions resume work.","c":"Notes drift from reality if not updated religiously.","tree":true},{"id":"9.31","s":"e9_agent_archetypes","t":"e9_background_agents","sc":"Task takes minutes to hours","w":"Async jobs decouple long runs from request timeouts.","c":"Adds queue infra, status UX and cancel handling.","tree":true},{"id":"9.32","s":"E9","t":"e9_frameworks","sc":"Choosing what to build agents on","w":"Frameworks bundle loop, state, tracing and HITL plumbing.","c":"Abstractions can hide prompts and lock you in.","tree":true},{"id":"9.33","s":"e9_frameworks","t":"e9_framework_vs_code","sc":"Unsure a framework is worth it","w":"An explicit decision avoids both reinventing and over-abstracting.","c":"Switching later costs a rewrite either way.","tree":true},{"id":"9.34","s":"e9_loop","t":"e8_schema","sc":"Agent acts only through its tools","w":"Tool schema quality directly limits how well the loop acts.","tree":false},{"id":"9.35","s":"e9_loop","t":"e11_tracing","sc":"Need to see what the agent did","w":"Span traces of each step are how you debug agent runs.","c":"Full traces are large and may hold sensitive data.","tree":false},{"id":"9.36","s":"e9_stop_conditions","t":"e12_costmodel","sc":"Setting a realistic per-run budget","w":"Budget caps should come from the unit cost model.","tree":false},{"id":"9.37","s":"e9_error_recovery","t":"e2_retries","sc":"Transient API errors inside the loop","w":"Use the standard backoff layer under the agent.","c":"Retries multiply latency on long runs.","tree":false},{"id":"9.38","s":"e9_subagents","t":"e5_compaction","sc":"Main context still grows too large","w":"Compaction complements isolation for long sessions.","c":"Summaries lose detail the agent may later need.","tree":false},{"id":"9.39","s":"e9_multiagent","t":"e10_agenteval","sc":"Proving multi-agent beats one agent","w":"Only task-level evals show if the extra cost pays off.","tree":false},{"id":"9.40","s":"e9_sandboxes","t":"e15_sandbox","sc":"Hardening the execution environment","w":"Security section covers isolation threats in depth.","tree":false},{"id":"9.41","s":"e9_coding_agents","t":"e17_coding","sc":"Designing a full coding assistant","w":"Reference architecture puts the loop in product context.","tree":false},{"id":"9.42","s":"e9_hitl","t":"e15_leastpriv","sc":"Deciding which actions need approval","w":"Least privilege shrinks what needs a human gate.","c":"Too-narrow permissions stall the agent.","tree":false},{"id":"9.43","s":"e9_browser_agents","t":"e15_injection","sc":"Agent reads untrusted web pages","w":"Every page can carry indirect prompt injection.","c":"Defenses reduce but don't eliminate the risk.","tree":false},{"id":"10.1","s":"E10","t":"e10_edd","sc":"Starting to measure an LLM feature","w":"EDD is the operating loop every other eval practice plugs into.","c":"Upfront effort before the first visible feature win.","tree":true},{"id":"10.2","s":"e10_edd","t":"e10_erroranalysis","sc":"Don't yet know what fails","w":"You can only measure failures you have observed and named.","c":"Reading traces is slow, manual work.","tree":true},{"id":"10.3","s":"e10_erroranalysis","t":"e10_open_axial","sc":"Notes pile up without structure","w":"Coding turns raw notes into countable categories.","c":"Taxonomy needs revisiting as the product changes.","tree":true},{"id":"10.4","s":"e10_edd","t":"e10_benchmarks","sc":"Tempted to trust a leaderboard","w":"Product evals, not benchmarks, decide what ships.","c":"Building product evals costs more than reading a chart.","tree":true},{"id":"10.5","s":"E10","t":"e10_golden","sc":"Need a repeatable test set","w":"A fixed dataset makes runs comparable across changes.","c":"Static sets drift away from real traffic.","tree":true},{"id":"10.6","s":"e10_golden","t":"e10_synthetic","sc":"Too few real examples to test","w":"Dimension sampling gives diverse coverage on day one.","c":"Synthetic inputs can be unrealistically clean.","tree":true},{"id":"10.7","s":"e10_golden","t":"e10_annotation","sc":"Cases need expert labels","w":"Good tooling makes expert labeling fast and consistent.","c":"Expert time is the scarcest resource.","tree":true},{"id":"10.8","s":"e10_golden","t":"e10_versioning","sc":"Dataset changes break comparisons","w":"Versions tie each score to the exact data and grader.","c":"More bookkeeping per run.","tree":true},{"id":"10.9","s":"e10_golden","t":"e10_overfitting","sc":"Scores climb but users don't notice","w":"Held-out data and refreshes keep scores honest.","c":"Held-out sets shrink what you can iterate on.","tree":true},{"id":"10.10","s":"E10","t":"e10_graders","sc":"Deciding how to score outputs","w":"Grader choice sets cost, speed and trustworthiness.","c":"No single grader type covers every failure mode.","tree":true},{"id":"10.11","s":"e10_graders","t":"e10_assertions","sc":"Property is checkable in code","w":"Deterministic checks are free, fast and never flaky.","c":"Can't judge tone, helpfulness or reasoning.","tree":true},{"id":"10.12","s":"e10_graders","t":"e10_refmetrics","sc":"You have reference answers","w":"Overlap metrics are cheap when references exist.","c":"Penalize correct paraphrases in open-ended text.","tree":true},{"id":"10.13","s":"e10_graders","t":"e10_judge","sc":"Criterion is semantic or subjective","w":"LLM judges grade what code can't, at scale.","c":"Judges are noisy and biased until calibrated.","tree":true},{"id":"10.14","s":"e10_judge","t":"e10_binary_likert","sc":"Choosing the judge's score format","w":"Binary verdicts are easier to calibrate and act on.","c":"Loses gradation unless split into more criteria.","tree":true},{"id":"10.15","s":"e10_judge","t":"e10_rubric","sc":"Judge verdicts feel arbitrary","w":"A precise rubric makes grading reproducible.","c":"Rubrics take several iterations against labels.","tree":true},{"id":"10.16","s":"e10_judge","t":"e10_pairwise","sc":"Variants too close to separate","w":"Relative comparison is more sensitive than absolute scores.","c":"Doubles judge calls with order swapping.","tree":true},{"id":"10.17","s":"e10_judge","t":"e10_judge_bias","sc":"Judge scores track irrelevant features","w":"Known biases have known mitigations.","c":"Mitigations add calls and prompt complexity.","tree":true},{"id":"10.18","s":"e10_judge","t":"e10_judge_calibration","sc":"Need to trust judge numbers","w":"Agreement with humans is the only proof a judge works.","c":"Requires 100+ expert labels up front.","tree":true},{"id":"10.19","s":"E10","t":"e10_ragmetrics","sc":"Evaluating a RAG pipeline","w":"Split metrics localize faults to retrieval or generation.","c":"LLM-computed metrics inherit judge noise.","tree":true},{"id":"10.20","s":"E10","t":"e10_agenteval","sc":"Evaluating a multi-step agent","w":"Agents need outcome, path and reliability measures.","c":"Environments and repeated trials are expensive.","tree":true},{"id":"10.21","s":"e10_agenteval","t":"e10_final_state","sc":"Many valid paths to success","w":"Checking the end state accepts any correct route.","c":"Misses unsafe or wasteful steps along the way.","tree":true},{"id":"10.22","s":"e10_agenteval","t":"e10_trajectory","sc":"Path matters, not just outcome","w":"Step checks catch unsafe or inefficient behavior.","c":"Reference paths are brittle and costly to label.","tree":true},{"id":"10.23","s":"e10_agenteval","t":"e10_passk","sc":"Agent works sometimes, not always","w":"Repeated trials expose consistency, not just capability.","c":"k trials per task multiply eval cost.","tree":true},{"id":"10.24","s":"e10_agenteval","t":"e10_env_eval","sc":"Agent takes real-world actions","w":"Sandboxed environments make action-taking evals safe and repeatable.","c":"Building faithful environments is real engineering work.","tree":true},{"id":"10.25","s":"E10","t":"e10_ci","sc":"Changes ship without quality checks","w":"Automated gates catch regressions before merge.","c":"Flaky judges cause false blocks; set tolerances.","tree":true},{"id":"10.26","s":"e10_ci","t":"e10_online","sc":"Offline suite passes but prod differs","w":"Live sampling covers inputs your dataset never had.","c":"No ground truth; relies on reference-free graders.","tree":true},{"id":"10.27","s":"e10_online","t":"e10_abtest","sc":"Need proof of real user impact","w":"Only live experiments measure business outcomes.","c":"Slow, needs traffic, and exposes users to the worse variant.","tree":true},{"id":"10.28","s":"E10","t":"e10_stats","sc":"Score differences might be noise","w":"Intervals and paired tests separate signal from noise.","c":"Rigor demands larger datasets and repeated runs.","tree":true},{"id":"10.29","s":"e10_stats","t":"e10_cost","sc":"Eval runs get slow and expensive","w":"Tiering and batching keep rigor affordable.","c":"Cheaper judges and smaller smoke sets lose sensitivity.","tree":true},{"id":"10.30","s":"E10","t":"e10_frameworks","sc":"Choosing eval tooling","w":"Harnesses supply runners, diffs, datasets and dashboards.","c":"Platform lock-in; custom graders still needed.","tree":true},{"id":"10.31","s":"e10_erroranalysis","t":"e11_tracing","sc":"Need traces to read","w":"Error analysis runs on the traces observability captures.","tree":false},{"id":"10.32","s":"e10_golden","t":"e11_feedback","sc":"Growing the dataset from production","w":"User feedback flags the cases worth adding.","c":"Feedback is sparse and skewed to angry users.","tree":false},{"id":"10.33","s":"e10_judge","t":"e4_jsonschema","sc":"Parsing judge verdicts reliably","w":"Structured output makes verdicts machine-readable.","tree":false},{"id":"10.34","s":"e10_ragmetrics","t":"e6_ragfailures","sc":"Metric shows retrieval or grounding gap","w":"Failure catalog maps low scores to concrete fixes.","tree":false},{"id":"10.35","s":"e10_agenteval","t":"e9_loop","sc":"Knowing which loop phase failed","w":"Agent loop phases give trajectory checks their structure.","tree":false},{"id":"10.36","s":"e10_env_eval","t":"e15_sandbox","sc":"Agent under test runs real code","w":"Isolation keeps eval runs from touching production.","tree":false},{"id":"10.37","s":"e10_versioning","t":"e3_versioning","sc":"Prompt and dataset versions must line up","w":"Each run records both versions to stay reproducible.","tree":false},{"id":"10.38","s":"e10_online","t":"e11_flywheel","sc":"Turning prod failures into improvements","w":"Online evals feed the data flywheel.","c":"Closing the loop needs owners, not just dashboards.","tree":false},{"id":"10.39","s":"e10_abtest","t":"e11_modelupgrade","sc":"Rolling out a new model version","w":"A/B results back the model-upgrade decision.","tree":false},{"id":"10.40","s":"e10_cost","t":"e2_batchapi","sc":"Large offline eval runs","w":"Batch APIs cut eval cost substantially.","c":"Results arrive in hours, not minutes.","tree":false},{"id":"11.1","s":"E11","t":"e11_tracing","sc":"First need: see what happened","w":"Every other LLMOps practice builds on per-request traces.","c":"Storage and privacy cost grow with traffic.","tree":true},{"id":"11.2","s":"e11_tracing","t":"e11_spantypes","sc":"Need to filter by step type","w":"Typed spans let you query retrievals, tools and LLM calls separately.","c":"Custom steps need manual span typing.","tree":true},{"id":"11.3","s":"e11_tracing","t":"e11_otel","sc":"Want vendor-neutral instrumentation","w":"OTel GenAI conventions make traces portable across backends.","c":"Spec still evolving; attribute names change.","tree":true},{"id":"11.4","s":"e11_tracing","t":"e11_safelogging","sc":"Traces contain user content","w":"Prompts carry PII and secrets that need redaction and retention rules.","c":"Heavy redaction can hide the bug you need to see.","tree":true},{"id":"11.5","s":"E11","t":"e11_tools","sc":"Don't want to build trace UI","w":"Platforms add storage, search, evals and prompts on top of traces.","c":"Another vendor and data processor to approve.","tree":true},{"id":"11.6","s":"e11_tools","t":"e11_langfuse","sc":"Need OSS and self-hosting","w":"Langfuse covers tracing, prompts and scores in one OSS stack.","c":"Self-host means running ClickHouse and Postgres.","tree":true},{"id":"11.7","s":"e11_tools","t":"e11_langsmith","sc":"Building on LangChain or LangGraph","w":"Native run trees with no extra instrumentation.","c":"Self-hosting is enterprise-tier.","tree":true},{"id":"11.8","s":"e11_tools","t":"e11_phoenix","sc":"Want local, OTel-native debugging","w":"Phoenix runs in a notebook and speaks OpenInference over OTel.","c":"Less polished for prompt management and team workflows.","tree":true},{"id":"11.9","s":"e11_tools","t":"e11_proxylogging","sc":"Need visibility with zero code change","w":"A proxy captures every LLM call by swapping the base URL.","c":"Blind to retrieval and tool spans; extra hop.","tree":true},{"id":"11.10","s":"E11","t":"e11_metrics","sc":"Need numbers, not single traces","w":"Aggregates reveal trends and regressions that one trace cannot.","tree":true},{"id":"11.11","s":"e11_metrics","t":"e11_costtracking","sc":"Spend is growing unexplained","w":"Per-span cost rolled up by user and feature shows the heavy tail.","c":"Price tables drift; keep them versioned.","tree":true},{"id":"11.12","s":"e11_metrics","t":"e11_toolsuccess","sc":"Agent uses tools","w":"Tool failures are a top hidden cause of bad agent answers.","c":"Measuring used-in-answer needs extra judging.","tree":true},{"id":"11.13","s":"e11_metrics","t":"e11_dashboards","sc":"Need to know within minutes","w":"Alerts turn metrics into action before users notice.","c":"Noisy alerts get ignored; tune thresholds.","tree":true},{"id":"11.14","s":"e11_dashboards","t":"e11_slo","sc":"Product asks how good is good","w":"SLOs make quality and latency targets explicit with error budgets.","c":"Quality SLIs need online evals, which cost tokens.","tree":true},{"id":"11.15","s":"e11_dashboards","t":"e11_drift","sc":"Quality drops with no deploy","w":"Drift explains changes from users or providers, not your code.","tree":true},{"id":"11.16","s":"e11_dashboards","t":"e11_incident","sc":"An alert fires","w":"AI incidents need specific levers: flags, fallbacks, rollback.","c":"Fallbacks must be tested before you need them.","tree":true},{"id":"11.17","s":"E11","t":"e11_feedback","sc":"Need ground truth from users","w":"Feedback tied to traces is the cheapest source of real failures.","c":"Sparse and biased toward unhappy users.","tree":true},{"id":"11.18","s":"e11_feedback","t":"e11_implicit","sc":"Explicit feedback is too sparse","w":"Behavior covers all traffic without asking users.","c":"Signals are noisy; calibrate against labels.","tree":true},{"id":"11.19","s":"e11_feedback","t":"e11_annotation","sc":"Flagged traces pile up","w":"Experts turn flags into labeled failure modes and fixes.","c":"Expert time is the bottleneck.","tree":true},{"id":"11.20","s":"e11_feedback","t":"e11_analytics","sc":"Need to know what users ask","w":"Clustering shows topic volume and failure hot spots.","c":"Cluster labels need human sanity checks.","tree":true},{"id":"11.21","s":"E11","t":"e11_flywheel","sc":"Want improvements to compound","w":"Closing the loop from prod to evals to fixes drives steady gains.","tree":true},{"id":"11.22","s":"e11_flywheel","t":"e11_tracetodataset","sc":"Evals don't match real usage","w":"Promoting real traces keeps datasets representative.","c":"Consent and PII rules limit reuse.","tree":true},{"id":"11.23","s":"e11_flywheel","t":"e11_experiments","sc":"Many variants under test","w":"Tracking variants against fixed datasets makes results comparable.","tree":true},{"id":"11.24","s":"E11","t":"e11_promptmgmt","sc":"Prompts change weekly","w":"Versioned prompts decouple prompt iteration from code deploys.","c":"Runtime fetch adds a dependency; cache it.","tree":true},{"id":"11.25","s":"e11_promptmgmt","t":"e11_flags","sc":"Need per-user rollout control","w":"Flags assign variants and give instant kill switches.","tree":true},{"id":"11.26","s":"e11_flags","t":"e11_canary","sc":"Change is risky for all traffic","w":"Shadow and canary test on real inputs with limited blast radius.","c":"Shadow doubles token spend on mirrored traffic.","tree":true},{"id":"11.27","s":"e11_canary","t":"e11_modelupgrade","sc":"A new model or snapshot ships","w":"The playbook chains evals, shadow and canary for model swaps.","c":"Prompts often need retuning for the new model.","tree":true},{"id":"11.28","s":"E11","t":"e11_maturity","sc":"Planning the ops roadmap","w":"Maturity levels order the investments above.","tree":true},{"id":"11.29","s":"e11_safelogging","t":"e15_pii","sc":"Need PII detection details","w":"PII handling techniques are covered in security.","tree":false},{"id":"11.30","s":"e11_costtracking","t":"e12_costmodel","sc":"Want to reduce, not just see, cost","w":"The cost model turns tracked spend into optimization levers.","tree":false},{"id":"11.31","s":"e11_metrics","t":"e12_latency","sc":"Latency metric is high","w":"Latency anatomy explains which phase to fix.","tree":false},{"id":"11.32","s":"e11_annotation","t":"e10_erroranalysis","sc":"Labels ready for analysis","w":"Error analysis turns annotated traces into a failure taxonomy.","tree":false},{"id":"11.33","s":"e11_tracetodataset","t":"e10_golden","sc":"Curated items ready","w":"Promoted traces become golden eval items.","c":"Keep train and eval splits separate.","tree":false},{"id":"11.34","s":"e11_flywheel","t":"e14_dataset","sc":"Prompt fixes plateau","w":"Curated traces seed fine-tuning datasets.","c":"Fine-tuning adds a model to maintain.","tree":false},{"id":"11.35","s":"e11_modelupgrade","t":"e10_ci","sc":"Every upgrade needs a gate","w":"CI evals block regressions automatically.","tree":false},{"id":"11.36","s":"e11_promptmgmt","t":"e3_versioning","sc":"Need prompt versioning basics","w":"Prompt versioning conventions come from the prompting section.","tree":false},{"id":"11.37","s":"e11_proxylogging","t":"e2_gateway","sc":"Proxy grows into routing and keys","w":"An AI gateway adds routing, quotas and failover to logging.","c":"Single point of failure if not HA.","tree":false},{"id":"12.1","s":"E12","t":"e12_latency","sc":"Users say it's slow","w":"You need to know which phase dominates before optimizing.","tree":true},{"id":"12.2","s":"e12_latency","t":"e12_outputlen","sc":"Decode time dominates","w":"Output tokens are sequential and usually the biggest latency term.","c":"Shorter answers may lose detail.","tree":true},{"id":"12.3","s":"e12_latency","t":"e12_streaming","sc":"Total time can't shrink enough","w":"Streaming fixes perceived latency at TTFT.","c":"Harder to validate or moderate before display.","tree":true},{"id":"12.4","s":"e12_latency","t":"e12_parallel","sc":"Pipeline has independent steps","w":"Concurrency turns sum of latencies into max.","c":"More concurrent calls press rate limits.","tree":true},{"id":"12.5","s":"e12_latency","t":"e12_agentbudget","sc":"Agent runs take too long","w":"Budgets and step caps keep multi-step runs interactive.","c":"Hard caps can return incomplete answers.","tree":true},{"id":"12.6","s":"e12_latency","t":"e12_regional","sc":"Network RTT is visible in traces","w":"Region choice affects every call, multiplied by steps.","c":"Residency rules may limit model choice.","tree":true},{"id":"12.7","s":"E12","t":"e12_caching","sc":"Same work is repeated","w":"Caching removes repeated compute at several layers.","c":"Every cache adds staleness risk.","tree":true},{"id":"12.8","s":"e12_caching","t":"e12_promptcaching","sc":"Long shared prefix each call","w":"Provider prefix caching is safe and cuts input cost and TTFT.","c":"Cache writes cost extra; misses are silent.","tree":true},{"id":"12.9","s":"e12_promptcaching","t":"e12_cachebreakpoints","sc":"Cache hit rate is low","w":"Prompt ordering and breakpoints decide hit rate.","c":"Reordering prompts needs re-evaluation.","tree":true},{"id":"12.10","s":"e12_caching","t":"e12_exactcache","sc":"Identical requests repeat","w":"A hash-keyed cache is simple and exact.","c":"Useless for paraphrases and personalized prompts.","tree":true},{"id":"12.11","s":"e12_caching","t":"e12_semcache","sc":"Paraphrased questions repeat","w":"Embedding similarity catches near-duplicates.","c":"False hits return wrong answers confidently.","tree":true},{"id":"12.12","s":"E12","t":"e12_routing","sc":"One model for every request","w":"Most traffic is easy; route it to cheaper models.","c":"Router errors and escalations add latency.","tree":true},{"id":"12.13","s":"e12_routing","t":"e12_rightsize","sc":"Pipeline uses frontier model everywhere","w":"Per-subtask model choice is the simplest routing.","tree":true},{"id":"12.14","s":"e12_routing","t":"e12_reasoningeffort","sc":"Reasoning model is slow and costly","w":"Effort knobs trade accuracy for latency per request.","c":"Low effort fails silently on hard cases.","tree":true},{"id":"12.15","s":"E12","t":"e12_tokens","sc":"Every call is expensive","w":"Fewer tokens lower cost and latency everywhere.","c":"Over-trimming context hurts quality.","tree":true},{"id":"12.16","s":"e12_tokens","t":"e12_maxtokens","sc":"Outputs are long or unbounded","w":"Caps and formats bound worst-case cost.","c":"Truncated outputs break parsers.","tree":true},{"id":"12.17","s":"e12_outputlen","t":"e12_predicted","sc":"Output mostly repeats input","w":"Predicted outputs skip generating known text.","c":"Rejected predictions are still billed.","tree":true},{"id":"12.18","s":"E12","t":"e12_costmodel","sc":"Need to forecast spend","w":"A formula exposes which term drives cost.","tree":true},{"id":"12.19","s":"e12_costmodel","t":"e12_uniteconomics","sc":"Need pricing and margins","w":"Unit economics links token cost to business value.","c":"Means hide heavy-user tails.","tree":true},{"id":"12.20","s":"e12_costmodel","t":"e12_batch","sc":"Work is not latency-sensitive","w":"Batch APIs give about 50% off for async jobs.","c":"Results can take hours.","tree":true},{"id":"12.21","s":"e12_costmodel","t":"e12_attribution","sc":"Multi-tenant product","w":"Attribution makes per-tenant cost visible and cappable.","c":"Requires metadata on every call path.","tree":true},{"id":"12.22","s":"e12_attribution","t":"e12_denialofwallet","sc":"Public or free-tier access","w":"Guards stop abuse and runaway loops from draining budget.","c":"Strict caps can block legit power users.","tree":true},{"id":"12.23","s":"E12","t":"e12_capacity","sc":"Launch or traffic spike ahead","w":"Rate limits, not price, often cap scale first.","tree":true},{"id":"12.24","s":"e12_capacity","t":"e12_provisioned","sc":"Steady high volume, need stable latency","w":"Reserved capacity removes shared-pool contention.","c":"Pay for idle capacity at low utilization.","tree":true},{"id":"12.25","s":"e12_routing","t":"e2_gateway","sc":"Routing logic spreads across services","w":"A gateway centralizes routing, fallbacks and keys.","c":"Extra hop and component to run.","tree":false},{"id":"12.26","s":"e12_promptcaching","t":"e5_cachefriendly","sc":"Designing the prompt layout","w":"Cache-friendly context ordering is the context-engineering side.","tree":false},{"id":"12.27","s":"e12_semcache","t":"e7_filtering","sc":"Cache shared across tenants","w":"Metadata filters scope cache hits to tenant and locale.","tree":false},{"id":"12.28","s":"e12_batch","t":"e10_ci","sc":"Eval runs are expensive","w":"Run large eval suites through batch endpoints.","c":"Slower feedback loop.","tree":false},{"id":"12.29","s":"e12_rightsize","t":"e14_distill","sc":"Small model almost good enough","w":"Distillation can close the gap for one task.","c":"Training and maintenance cost.","tree":false},{"id":"12.30","s":"e12_capacity","t":"e13_gpumem","sc":"Provider limits or cost block scale","w":"Self-hosting gives control of capacity; GPU memory math sizes it.","c":"You now run GPUs.","tree":false},{"id":"12.31","s":"e12_costmodel","t":"e11_metrics","sc":"Need real numbers, not estimates","w":"Tracked cost per request validates the model.","tree":false},{"id":"12.32","s":"e12_denialofwallet","t":"e15_owasp","sc":"Abuse is a security issue","w":"Unbounded consumption is an OWASP LLM risk.","tree":false},{"id":"13.1","s":"E13","t":"e13_selfhost","sc":"Considering running your own models","w":"The decision drives every other choice in this section.","tree":true},{"id":"13.2","s":"e13_selfhost","t":"e13_breakeven","sc":"Cost is the main argument","w":"Break-even math shows utilization decides savings.","c":"Ignores engineer time unless you add it.","tree":true},{"id":"13.3","s":"e13_selfhost","t":"e13_registry","sc":"Decided to self-host","w":"You need safe, pinned, licensed weights first.","c":"Mirroring large weights costs storage.","tree":true},{"id":"13.4","s":"E13","t":"e13_gpumem","sc":"Will the model fit","w":"Memory math sizes weights plus KV cache.","tree":true},{"id":"13.5","s":"e13_gpumem","t":"e13_kvsizing","sc":"Need max context and concurrency","w":"KV cache per token sets tokens in flight.","c":"Long contexts cut concurrency sharply.","tree":true},{"id":"13.6","s":"e13_gpumem","t":"e13_quantformats","sc":"Weights don't fit in VRAM","w":"Lower precision shrinks weights 2–4x.","c":"Quality loss, especially below 4-bit.","tree":true},{"id":"13.7","s":"e13_quantformats","t":"e13_gguf","sc":"Running on CPU, Mac or laptop","w":"GGUF is the format for the llama.cpp family.","c":"Lower throughput than GPU-native formats.","tree":true},{"id":"13.8","s":"e13_quantformats","t":"e13_awqgptq","sc":"Serving on datacenter GPUs","w":"AWQ, GPTQ and FP8 have fast GPU kernels.","c":"Calibration data and kernel support vary.","tree":true},{"id":"13.9","s":"e13_gpumem","t":"e13_parallelism","sc":"Model exceeds one GPU","w":"Sharding across GPUs makes large models servable.","c":"Needs fast interconnect; more failure points.","tree":true},{"id":"13.10","s":"E13","t":"e13_engines","sc":"Need a server for the model","w":"The engine determines throughput, features and ops.","tree":true},{"id":"13.11","s":"e13_engines","t":"e13_vllm","sc":"Datacenter GPU, general workload","w":"vLLM is the default open-source choice.","c":"Fast-moving project; pin versions.","tree":true},{"id":"13.12","s":"e13_vllm","t":"e13_contbatching","sc":"Why throughput scales with users","w":"Continuous batching and paged KV explain capacity.","tree":true},{"id":"13.13","s":"e13_contbatching","t":"e13_throughputlatency","sc":"Choosing max concurrency per replica","w":"The load curve shows the latency knee.","c":"Higher concurrency lowers cost but hurts p95.","tree":true},{"id":"13.14","s":"e13_vllm","t":"e13_prefixcache","sc":"Requests share long prefixes","w":"Reusing KV blocks skips repeated prefill.","c":"Needs sticky routing across replicas.","tree":true},{"id":"13.15","s":"e13_vllm","t":"e13_specdecode","sc":"Per-user latency too high at low load","w":"Drafting tokens speeds decode without changing outputs.","c":"Little gain at high batch; extra memory.","tree":true},{"id":"13.16","s":"e13_vllm","t":"e13_multilora","sc":"Many fine-tunes, one base model","w":"Adapters share base weights and GPUs.","c":"Cold adapters and rank limits add latency.","tree":true},{"id":"13.17","s":"e13_engines","t":"e13_sglang","sc":"Prefix-heavy or agent traffic","w":"RadixAttention excels at shared-prefix reuse.","c":"Smaller ecosystem than vLLM.","tree":true},{"id":"13.18","s":"e13_engines","t":"e13_tgi_trt","sc":"Need maximum NVIDIA throughput","w":"Compiled engines give the best kernels.","c":"Build per GPU type; slower model support.","tree":true},{"id":"13.19","s":"e13_engines","t":"e13_llamacpp","sc":"No datacenter GPU available","w":"llama.cpp runs GGUF on almost anything.","c":"Weak at high concurrency.","tree":true},{"id":"13.20","s":"e13_llamacpp","t":"e13_ollama","sc":"Want easiest local setup","w":"Ollama wraps llama.cpp with pull and run.","c":"Small default context; not for multi-tenant prod.","tree":true},{"id":"13.21","s":"e13_ollama","t":"e13_desktop","sc":"Prefer a GUI or Apple-native speed","w":"LM Studio and MLX target desktop and Mac use.","tree":true},{"id":"13.22","s":"e13_engines","t":"e13_openaicompat","sc":"Existing code uses OpenAI SDK","w":"Compatible endpoints let you swap via base_url.","c":"Tool calling and JSON features vary.","tree":true},{"id":"13.23","s":"e13_engines","t":"e13_embedserving","sc":"Need embeddings or reranking at scale","w":"Encoder servers batch short inputs efficiently.","tree":true},{"id":"13.24","s":"E13","t":"e13_gpus","sc":"Choosing hardware","w":"Memory and bandwidth decide fit and speed.","c":"Top GPUs are scarce and pricey.","tree":true},{"id":"13.25","s":"e13_gpus","t":"e13_edge","sc":"Need offline or on-device AI","w":"Small quantized models run on user hardware.","c":"Limited quality and device variety.","tree":true},{"id":"13.26","s":"E13","t":"e13_autoscale","sc":"Traffic varies through the day","w":"Scaling on queue depth matches GPUs to demand.","c":"Cold starts take minutes.","tree":true},{"id":"13.27","s":"e13_autoscale","t":"e13_serverless","sc":"Spiky or early-stage workload","w":"Per-second billing and scale to zero avoid idle cost.","c":"Higher hourly price and cold starts.","tree":true},{"id":"13.28","s":"E13","t":"e
