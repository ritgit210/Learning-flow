hot reasoning traces, CoT instructions. Prompts tuned for older models are often too prescriptive.","v":"cmp:#Classic model;Reasoning model|CoT ask=helps;redundant|Step lists=helpful;often hurts|Few-shot=strong lever;use sparingly|Depth control=prompt wording;effort param","eq":["e1_modelselect"]},"e3_multilingual":{"k":"I","p":"E3","cl":"azure","t":"Multilingual prompting","s":"Serving many languages: deciding prompt language, forcing reply language, and evaluating quality per locale.","hp":"Helps you avoid replies in the wrong language and silent quality gaps.","x":"English instructions with \"reply in the user's language\" usually work well. Non-Latin scripts use more tokens. Evaluate per language; low-resource languages lag. Keep glossaries for product terms.","v":"gbars:English,Spanish,Hindi,Swahili|Accuracy=90,87,80,68|Tokens per word=1.3,1.6,2.8,2.2"},"e3_metaprompt":{"k":"I","p":"E3","cl":"azure","t":"Meta-prompting","s":"Using an LLM to draft, critique or improve prompts, e.g. generating a first prompt from a task description or rewriting from failing cases.","hp":"Helps you get a strong first draft and fresh ideas fast.","x":"Feed the task, constraints and 5-10 failing examples; ask for a revised prompt plus rationale. Always re-run evals on the result. Provider consoles offer prompt generators and improvers.","v":"flow:Task + failures>LLM drafts prompt>Run evals>Keep if better|loop","code":"META = \"\"\"Improve this prompt. Failing cases are in <failures>.\nKeep variables like {{doc}} unchanged. Return only the new prompt.\n<prompt>{p}<\/prompt><failures>{f}<\/failures>\"\"\"\nnew_prompt = llm(META.format(p=current, f=fails))","eq":["e3_promptopt"]},"e3_promptopt":{"k":"A","p":"E3","cl":"azure","t":"Automatic prompt optimization","s":"Algorithms that search over instructions and examples against a metric, e.g. APE, OPRO, TextGrad, DSPy optimizers.","hp":"Helps you squeeze extra accuracy once you have a solid metric.","x":"Needs a train/dev split (50-500 labeled cases) and an automatic metric. Typical gains: a few to 10+ points on narrow tasks. Re-optimize when the model changes; outputs can be odd-looking but effective.","v":"flow:Seed prompt>Propose variants>Score on dev set>Keep best>Repeat|loop","eq":["e10_golden","e3_testing"]},"e3_dspy":{"k":"A","p":"E3","cl":"aws","t":"DSPy","s":"A framework where you declare typed signatures and modules, and optimizers compile prompts and few-shot demos against your metric.","hp":"Helps you replace hand-tuned prompts with optimizable programs.","x":"Signatures (\"question -> answer\") replace prompt strings; optimizers like MIPROv2 or BootstrapFewShot tune instructions and demos. Recompile per model. Best when you have a clear metric and multi-step pipelines.","v":"arch:DSPy:Signature>Module,Metric>Optimizer>Compiled prompt","code":"import dspy\ndspy.configure(lm=dspy.LM(\"openai/gpt-4.1-mini\"))\nqa = dspy.ChainOfThought(\"question, context -> answer\")\nopt = dspy.MIPROv2(metric=exact_match, auto=\"light\")\ncompiled = opt.compile(qa, trainset=train)","eq":["e3_promptopt"]},"E4":{"k":"S","p":"E4","t":"Structured Output & Reliability","s":"Getting LLMs to return typed, schema-valid data (JSON, enums, objects) and making that output dependable in code.","hp":"Most LLM features feed other code; a parse failure or a wrong enum is a production bug, not a style issue.","x":"JSON mode vs strict schemas, tool calling as extraction, Pydantic/Instructor, validation and retry, constrained decoding, schema design, classification, extraction pipelines, streaming partial JSON","v":"draw:structured","sec":{"pid":"E4","num":4,"title":"Structured Output & Reliability","short":"Structured output"}},"e4_jsonmode":{"k":"B","p":"E4","cl":"multi","t":"JSON mode","s":"A provider flag that guarantees syntactically valid JSON but does not enforce any particular keys or types.","hp":"Helps you stop regex-scraping JSON out of prose for quick prototypes.","x":"OpenAI: response_format={'type':'json_object'}; you must still say 'JSON' in the prompt. Keys can be missing, renamed or wrong-typed, so always validate. Prefer strict schema mode when available.","v":"cmp:#Prompt only;JSON mode;Strict schema|Valid JSON=~90-98%;~100%;~100%|Right keys=often;usually;always|Right types=often;usually;always|Needs validation=yes;yes;light","code":"resp = client.chat.completions.create(\n    model=\"gpt-4.1-mini\",\n    response_format={\"type\": \"json_object\"},\n    messages=[{\"role\": \"user\", \"content\": \"Return JSON with keys name, age: \" + text}],\n)\ndata = json.loads(resp.choices[0].message.content)  # still validate!","eq":["e4_jsonschema","e4_toolextract"]},"e4_jsonschema":{"k":"I","p":"E4","cl":"azure","t":"JSON Schema strict mode","s":"Pass a JSON Schema with strict=true so the provider constrains decoding to exactly that shape: required keys, types, enums.","hp":"Helps you get schema-valid objects every call without retry loops for format errors.","x":"Strict mode needs additionalProperties:false and every key in required (model optional as type ['string','null']). Unsupported keywords (e.g. some formats/patterns) are rejected. First call with a new schema may add latency while it compiles.","v":"flow:Pydantic model>JSON Schema>strict decode>typed object","f":"Structured Outputs","code":"class Invoice(BaseModel):\n    vendor: str\n    total: float\n    currency: Literal[\"USD\", \"EUR\", \"GBP\"]\n\nresp = client.responses.parse(\n    model=\"gpt-4.1-mini\", input=doc_text, text_format=Invoice)\ninvoice = resp.output_parsed  # Invoice instance","eq":["e4_jsonmode","e4_constrained","e4_toolextract"]},"e4_toolextract":{"k":"B","p":"E4","cl":"azure","t":"Tool calling as extraction","s":"Define a single 'tool' whose input schema is the object you want, then force the model to call it; read the arguments, never run anything.","hp":"Helps you get structured data from providers or models that lack a native schema mode.","x":"Force the call (Anthropic tool_choice {type:'tool',name}; OpenAI tool_choice with the function name). Tool args are usually but not always schema-valid unless strict is on, so validate. Works across nearly every vendor SDK.","v":"seq:App,LLM|1>2:text + record tool|2>1:tool_use args|1>1:validate args|1>1:skip execution","code":"resp = client.messages.create(\n    model=MODEL, max_tokens=1024,\n    tools=[{\"name\": \"record_invoice\", \"description\": \"Record extracted invoice fields\",\n            \"input_schema\": Invoice.model_json_schema()}],\n    tool_choice={\"type\": \"tool\", \"name\": \"record_invoice\"},\n    messages=[{\"role\": \"user\", \"content\": doc_text}])\ninv = Invoice.model_validate(resp.content[0].input)","eq":["e4_jsonschema","e8_schema"]},"e4_pydantic":{"k":"B","p":"E4","cl":"aws","t":"Pydantic & Zod models","s":"Define the output shape once as a typed class (Pydantic in Python, Zod in TS) and derive the JSON Schema, validation and types from it.","hp":"Helps you keep schema, validation and app types in one source of truth.","x":"model_json_schema() feeds the API; model_validate_json() checks the reply. Use Field(description=...) since descriptions reach the model. Zod: zodResponseFormat(schema, 'name') in the OpenAI TS SDK.","v":"fan:Pydantic model|JSON Schema,Validator,Type hints,Docs,Test fixtures","f":"schema-as-code","code":"from pydantic import BaseModel, Field\n\nclass Ticket(BaseModel):\n    category: Literal[\"billing\", \"bug\", \"other\"]\n    summary: str = Field(description=\"One sentence, <= 25 words\")\n    urgent: bool\n\nschema = Ticket.model_json_schema()\nticket = Ticket.model_validate_json(llm_text)","eq":["e4_instructor"]},"e4_instructor":{"k":"I","p":"E4","cl":"aws","t":"Instructor library","s":"Python library that patches LLM clients to accept response_model=PydanticClass and handles validation plus automatic re-asks on failure.","hp":"Helps you get typed objects with retries in 3 lines across OpenAI, Anthropic, Gemini, Ollama and more.","x":"max_retries sends validation errors back to the model as a re-ask. Supports streaming partial objects and iterables of objects. Each retry costs a full call, so log retry rates per schema.","v":"flow:create call>LLM>Pydantic validate>re-ask with error|loop","code":"import instructor\nfrom openai import OpenAI\n\nclient = instructor.from_openai(OpenAI())\nuser = client.chat.completions.create(\n    model=\"gpt-4.1-mini\", response_model=UserInfo, max_retries=3,\n    messages=[{\"role\": \"user\", \"content\": \"Jason is 25\"}])\nprint(user.age)  # 25","eq":["e4_parsers","e4_validation"]},"e4_parsers":{"k":"B","p":"E4","cl":"aws","t":"Output parsers","s":"Framework helpers (e.g. LangChain output parsers, with_structured_output) that turn raw model text or tool calls into typed objects.","hp":"Helps you plug structured output into a chain without hand-writing JSON extraction.","x":"Prefer parsers that use native structured output or tool calls over ones that ask for JSON in the prompt and regex it out. Watch for markdown fences and trailing prose in non-strict paths.","v":"flow:raw text>strip fences>json parse>validate>object","code":"structured = llm.with_structured_output(Ticket)  # LangChain\nticket = structured.invoke(\"My card was charged twice\")\n# ticket is a Ticket instance","eq":["e4_instructor","e4_pydantic"]},"e4_validation":{"k":"I","p":"E4","cl":"azure","t":"Validation & repair loop","s":"Validate every reply against the schema plus business rules; on failure, re-ask with the specific error, then fall back.","hp":"Helps you turn a 97% format success rate into ~99.9% with bounded cost.","x":"Cap at 1-2 retries; a third rarely helps. Feed back the exact validator message. Business-rule checks (totals add up, dates in range) catch what schemas cannot. After retries, return a typed failure, not a crash.","v":"flow:LLM reply>schema check>rule check>re-ask w error>fallback|loop","code":"for attempt in range(3):\n    raw = call_llm(messages)\n    try:\n        return Invoice.model_validate_json(raw)\n    except ValidationError as err:\n        messages += [{\"role\": \"assistant\", \"content\": raw},\n                     {\"role\": \"user\", \"content\": f\"Fix these errors: {err}\"}]\nraise ExtractionFailed(raw)","eq":["e4_instructor","e2_retries"]},"e4_refusals":{"k":"I","p":"E4","cl":"multi","t":"Refusals in structured output","s":"When a model declines (safety or missing info), strict schema mode may emit a refusal field or fill required fields with junk instead.","hp":"Helps you avoid storing fabricated values when the model really meant 'no'.","x":"OpenAI exposes message.refusal separately from parsed. Check stop reason too: max_tokens truncation yields invalid JSON. Add an explicit status or error field so the model has a legal way to decline.","v":"fan:Model reply|Parsed object,Refusal text,Truncated JSON,Filled with junk","eq":["e4_abstain"]},"e4_postprocess":{"k":"B","p":"E4","cl":"gcp","t":"Deterministic post-processing","s":"Plain code after the LLM that cleans, normalizes, dedupes and computes derived fields instead of asking the model to do it.","hp":"Helps you move arithmetic and formatting out of the model, where it is cheap and always correct.","x":"Have the model extract line items; compute totals, tax and sums in code. Trim whitespace, canonicalize case, map synonyms to enums. Anything a regex or function can do reliably should not be in the prompt.","v":"flow:LLM extracts raw>normalize>compute totals>dedupe>store","eq":["e4_normalize"]},"e4_normalize":{"k":"B","p":"E4","cl":"azure","t":"Date & number normalization","s":"Convert extracted dates, amounts, units and currencies to canonical forms (ISO 8601, decimal minor units, ISO 4217) in code.","hp":"Helps you avoid '03/04' ambiguity and '1.234,50' parsing bugs downstream.","x":"Ask the model for ISO 8601 and the original string; parse with a locale-aware library and reject on mismatch. Store money as integer cents or Decimal, never float. Pass a reference date for 'next Friday'.","v":"table:Raw,Normalized|03/04/26,2026-03-04|next Fri,2026-10-09|1.234 EUR in DE,123400 cents EUR|5k,5000","code":"from pydantic import field_validator\nimport dateparser\n\nclass Order(BaseModel):\n    due: date\n    @field_validator(\"due\", mode=\"before\")\n    @classmethod\n    def parse_due(cls, v):\n        d = dateparser.parse(v, settings={\"RELATIVE_BASE\": NOW})\n        if not d: raise ValueError(f\"unparseable date {v!r}\")\n        return d.date()","eq":["e4_postprocess"]},"e4_testparsers":{"k":"I","p":"E4","cl":"gcp","t":"Testing parsers & schemas","s":"Unit-test the parse and validation layer with recorded model outputs, malformed JSON, edge values and schema changes.","hp":"Helps you catch schema drift and parser crashes before a model upgrade does.","x":"Keep a fixture folder of real raw replies including failures. Test: fences, truncation, extra keys, null vs missing, unicode, huge numbers. Snapshot the JSON Schema so field renames show up in review.","v":"table:Case,Expect|valid reply,parses|code fences,parses|truncated,typed error|extra keys,rejected|null field,default","code":"@pytest.mark.parametrize(\"raw\", load_fixtures(\"replies/*.txt\"))\ndef test_parser_never_crashes(raw):\n    result = parse_ticket(raw)\n    assert isinstance(result, (Ticket, ParseFailure))\n\ndef test_schema_snapshot(snapshot):\n    assert Ticket.model_json_schema() == snapshot","eq":["e10_golden"]},"e4_constrained":{"k":"I","p":"E4","cl":"azure","t":"Constrained decoding","s":"At each step, mask out tokens that would violate a grammar (JSON Schema, regex, CFG), so output is valid by construction.","hp":"Helps you guarantee format on self-hosted models where no provider strict mode exists.","x":"Grammar is compiled to a token-level automaton; invalid logits are set to -inf. Modern engines add under ~5% overhead. Validity is not correctness: the model can still pick wrong values.","v":"flow:grammar>compile FSM>mask logits>sample>advance state|loop","f":"grammar-guided / guided decoding","eq":["e4_jsonschema","e13_vllm"]},"e4_outlines":{"k":"A","p":"E4","cl":"aws","t":"Outlines","s":"Open-source library for structured generation from Pydantic models, JSON Schema, regex, Literal choices or CFGs on local models.","hp":"Helps you get typed output from Transformers, llama.cpp or vLLM-backed models with one call.","x":"Compiles schemas to finite-state machines indexed by vocabulary. Good for classification with Literal and extraction with Pydantic. Also used as a backend inside some serving engines.","v":"flow:Pydantic type>regex FSM>token index>masked sampling","code":"# outlines >= 1.0\nimport outlines\nfrom typing import Literal\n\nmodel = outlines.from_transformers(hf_model, hf_tokenizer)\nlabel = model(\"Review: arrived broken. Sentiment?\",\n              Literal[\"positive\", \"negative\", \"neutral\"])","eq":["e4_xgrammar","e4_gbnf"]},"e4_xgrammar":{"k":"A","p":"E4","cl":"aws","t":"XGrammar","s":"High-performance grammar engine for constrained decoding that splits tokens into context-independent (precomputed) and context-dependent checks.","hp":"Helps you run JSON-schema constraints at near-zero overhead in high-throughput serving.","x":"Default structured-output backend in recent vLLM and SGLang builds. Supports JSON Schema, EBNF and regex. Compilation is cached per schema, so reuse schemas instead of generating new ones per request.","v":"bars:No grammar=100,XGrammar=97,Older FSM=70","code":"import xgrammar as xgr\n\ninfo = xgr.TokenizerInfo.from_huggingface(tokenizer)\ncompiler = xgr.GrammarCompiler(info)\ncompiled = compiler.compile_json_schema(schema_json)\nmatcher = xgr.GrammarMatcher(compiled)  # fills token bitmask each step","eq":["e4_outlines","e4_vllmguided"]},"e4_gbnf":{"k":"A","p":"E4","cl":"aws","t":"llama.cpp GBNF grammars","s":"llama.cpp's BNF-style grammar format that constrains local GGUF models; JSON Schema can be converted to GBNF automatically.","hp":"Helps you force exact formats from laptop or edge models via Ollama or llama.cpp.","x":"Pass --grammar-file or --json-schema to llama-cli/llama-server. Ollama exposes the same via format=<json schema>. Keep grammars small; huge alternations slow sampling.","v":"tree:root>answer,reason;answer>yes,no;reason>string","f":"GGML BNF","code":"# yesno.gbnf\nroot   ::= \"{\\\"answer\\\": \" answer \", \\\"reason\\\": \" string \"}\"\nanswer ::= \"\\\"yes\\\"\" | \"\\\"no\\\"\"\nstring ::= \"\\\"\" [^\"]* \"\\\"\"\n\n# llama-cli -m model.gguf --grammar-file yesno.gbnf -p \"...\"","eq":["e4_outlines","e13_ollama"]},"e4_vllmguided":{"k":"A","p":"E4","cl":"aws","t":"vLLM guided decoding","s":"vLLM's structured-output support: JSON Schema, regex, choice lists and grammars applied per request on its OpenAI-compatible server.","hp":"Helps you serve strict structured output from your own open-weight models at scale.","x":"Use response_format json_schema like OpenAI, or vLLM-specific options for choice, regex and grammar (names have changed across versions; check yours). Backends: xgrammar, guidance, outlines.","v":"arch:vLLM server:Client>OpenAI API>Grammar backend,Scheduler>GPU","code":"resp = client.chat.completions.create(  # client -> vLLM base_url\n    model=\"Qwen/Qwen2.5-7B-Instruct\",\n    messages=[{\"role\": \"user\", \"content\": text}],\n    response_format={\"type\": \"json_schema\",\n        \"json_schema\": {\"name\": \"ticket\", \"schema\": Ticket.model_json_schema()}})","eq":["e4_xgrammar","e13_vllm"]},"e4_tradeoff":{"k":"A","p":"E4","cl":"multi","t":"Format vs quality trade-off","s":"Tight schemas and constrained decoding can lower answer quality when they force the model off its natural token path or skip reasoning.","hp":"Helps you decide when to let the model think freely first and format second.","x":"Symptoms: worse accuracy on reasoning tasks under strict JSON. Fixes: reasoning field first, two-step (free answer then cheap format call), or looser schema. Measure on your eval set, not on anecdotes.","v":"quad:Schema strictness,Task reasoning load|Simple extract=8,2;Classification=7,3;Math in JSON=8,8;Two-step=4,8;Free text=1,6","eq":["e4_reasonfirst","e4_constrained"]},"e4_schemadesign":{"k":"I","p":"E4","cl":"gcp","t":"Schema design for LLMs","s":"Design output schemas for the model as reader: clear names, descriptions, enums, shallow nesting, and an intentional field order.","hp":"Helps you raise extraction accuracy several points without touching the prompt.","x":"Field names and descriptions are effectively prompt text. Keep depth to 2-3 levels and under ~30-50 fields per call; split bigger jobs. Order fields the way a human would fill them.","v":"hub:Schema|Clear names,Descriptions,Enums,Shallow nesting,Nullable fields,Reason first,Few fields","eq":["e8_schema"]},"e4_fielddesc":{"k":"B","p":"E4","cl":"azure","t":"Field names & descriptions","s":"Use self-explaining field names and per-field descriptions with units, format and edge-case rules; they are sent to the model.","hp":"Helps you fix systematic extraction errors by editing one description instead of the prompt.","x":"Say units and format ('amount in cents, integer'), what to do when absent ('null if not stated'), and disambiguation ('ship date, not order date'). Avoid cryptic keys like amt2.","v":"cmp:#Weak;Strong|Name=dt;invoice_due_date|Desc=none;ISO 8601 or null|Unit=implied;cents integer|Missing=guess;null if absent","code":"class Line(BaseModel):\n    sku: str = Field(description=\"Vendor SKU exactly as printed\")\n    qty: int = Field(description=\"Units ordered; 1 if not stated\")\n    unit_price_cents: int = Field(description=\"Price per unit in cents, pre-tax\")","eq":["e8_schema"]},"e4_optional":{"k":"B","p":"E4","cl":"azure","t":"Optional & nullable fields","s":"Make fields the source may not contain explicitly nullable so the model can say 'not present' instead of inventing a value.","hp":"Helps you cut hallucinated values on sparse documents.","x":"In strict mode keep the key required but allow null: Optional[str] -> type ['string','null']. Distinguish null (absent) from empty string. Track per-field null rates; spikes signal drift.","v":"gbars:Hallucinated,Correct null|Required str=18,0|Nullable str=3,15","eq":["e4_abstain"]},"e4_flatten":{"k":"I","p":"E4","cl":"azure","t":"Avoid deep nesting","s":"Prefer flat or shallow objects and lists of simple items over deeply nested trees and recursive schemas.","hp":"Helps you reduce dropped fields, schema compile errors and token waste.","x":"Deep nesting raises error rates and some strict modes cap depth (e.g. 5-10 levels) and total properties. Flatten to parent_id references or split into multiple calls. Recursive schemas are often unsupported.","v":"cmp:#Deep;Flat|Depth=5+;1-2|Errors=higher;lower|Tokens=more braces;fewer|Strict support=limits;fine","eq":["e4_schemadesign"]},"e4_reasonfirst":{"k":"I","p":"E4","cl":"azure","t":"Reasoning field before answer","s":"Put a short reasoning or evidence field before the decision field so tokens for thinking are generated before the answer is committed.","hp":"Helps you keep chain-of-thought gains while still returning strict JSON.","x":"Output is generated in schema key order, so 'reasoning' then 'label'. Cap it (e.g. 'max 3 sentences') to bound cost. With reasoning models, this matters less; their hidden thinking already precedes output.","v":"flow:evidence>reasoning>label>confidence","f":"CoT in JSON","code":"class Verdict(BaseModel):\n    evidence: list[str]   # quotes from the source first\n    reasoning: str        # <= 3 sentences\n    label: Literal[\"fraud\", \"ok\", \"unclear\"]  # decided last","eq":["e4_tradeoff"]},"e4_classify":{"k":"B","p":"E4","cl":"azure","t":"Classification with enums","s":"Constrain the label to an enum or Literal so the model can only return one of your categories.","hp":"Helps you build routers, taggers and moderators that never return an unknown label.","x":"Define every label with a description and 1-2 examples. Always add 'other' or 'unclear'. Over ~20-30 labels, go hierarchical (coarse then fine) or use embeddings plus LLM rerank.","v":"fan:Ticket text|billing,bug,feature,account,other","code":"class Route(BaseModel):\n    intent: Literal[\"billing\", \"bug\", \"feature\", \"account\", \"other\"]\n\nroute = client.responses.parse(model=SMALL_MODEL, input=msg,\n                               text_format=Route).output_parsed","eq":["e4_selfconsistency","e12_routing"]},"e4_abstain":{"k":"I","p":"E4","cl":"azure","t":"Confidence & abstain option","s":"Give the model a legal way to say 'unsure' (abstain label or low/med/high confidence) and route those cases to fallback or humans.","hp":"Helps you trade a little coverage for much higher precision on what you auto-accept.","x":"Verbalized numeric confidences are poorly calibrated; prefer coarse buckets or derive confidence from logprobs or agreement across samples. Calibrate the accept threshold on labeled data.","v":"line:50%,60%,70%,80%,90%|Precision=82,87,91,95,98|Coverage=100,94,85,71,52","eq":["e4_selfconsistency","e9_hitl"]},"e4_selfconsistency":{"k":"A","p":"E4","cl":"azure","t":"Self-consistency voting","s":"Sample the same structured call N times (temperature > 0) and take the majority value per field; agreement doubles as confidence.","hp":"Helps you boost accuracy and get a usable confidence signal on high-stakes labels.","x":"N=3-5 captures most of the gain at 3-5x cost. Vote per field, not per whole object. Low agreement -> abstain or escalate. Use only where errors are costly.","v":"fanin:Sample 1,Sample 2,Sample 3,Sample 4,Sample 5|Majority vote","code":"from collections import Counter\n\nlabels = [classify(text, temperature=0.7).label for _ in range(5)]\nlabel, votes = Counter(labels).most_common(1)[0]\nconfidence = votes / len(labels)\nif confidence < 0.6:\n    label = \"needs_review\"","eq":["e4_abstain","e1_nondeterminism"]},"e4_extraction":{"k":"I","p":"E4","cl":"gcp","t":"Information extraction pipelines","s":"End-to-end flow that turns documents into rows: parse, chunk, extract per chunk, merge, validate, normalize and load.","hp":"Helps you scale extraction from one demo PDF to millions of documents with measurable accuracy.","x":"Extract per page/section then merge and dedupe by key. Keep source spans for every field for review. Track field-level precision/recall on a labeled set; use batch APIs for bulk jobs (~50% cheaper).","v":"flow:parse doc>chunk>extract>merge>validate>normalize>load","eq":["e16_docai","e2_batchapi"]},"e4_streaming":{"k":"A","p":"E4","cl":"azure","t":"Streaming partial JSON","s":"Parse incomplete JSON as tokens arrive so the UI can render fields progressively while the object is still being generated.","hp":"Helps you show structured results with low perceived latency.","x":"Use a partial-mode parser (pydantic_core.from_json(allow_partial=True), jiter, or Instructor create_partial). Only act on fields once complete; a string may still be growing. Validate fully at the end.","v":"seq:LLM,Parser,UI|1>2:chunk 1|2>3:title only|1>2:chunk 2|2>3:title + items|1>2:done|2>2:full validate","code":"from pydantic_core import from_json\n\nbuf = \"\"\nfor delta in stream_text():\n    buf += delta\n    partial = from_json(buf, allow_partial=True)\n    render(partial.get(\"title\"), partial.get(\"items\", []))\nfinal = Report.model_validate_json(buf)","eq":["e2_streaming","e16_streamux"]},"E5":{"k":"S","p":"E5","t":"Context Engineering & Memory","s":"Deciding what goes into the model's context window on every call, and what is remembered across turns and sessions.","hp":"Most agent failures past the demo stage are context failures: wrong, missing, stale or too much information.","x":"budget allocation, context rot, ordering, compaction, trimming tool results, just-in-time retrieval, scratchpads, instruction files, cache-friendly layout, sub-agent isolation, memory types and stores, write policies","v":"hub:Context|Budget,Ordering,Compaction,Retrieval,Scratchpads,Caching,Sub-agents,Memory","sec":{"pid":"E5","num":5,"title":"Context Engineering & Memory","short":"Context & memory"}},"e5_budget":{"k":"B","p":"E5","cl":"gcp","t":"Context window budget","s":"Plan the window as a budget: fixed shares for system prompt, tools, retrieved docs, history and reserved output tokens.","hp":"Helps you avoid overflow errors and keep the important parts from being crowded out.","x":"Reserve output first (max_tokens), then system + tools (often 5-20K with many tools), then retrieval, history last. Aim to use well under the max; quality drops long before the hard limit.","v":"ctx:System=5,Tools=10,Retrieved=30,History=35,Scratch=5,Output=15|200K","eq":["e1_tokens","e5_tokencount"]},"e5_tokencount":{"k":"B","p":"E5","cl":"gcp","t":"Token counting & truncation","s":"Count tokens with the model's own tokenizer or count endpoint before sending, and truncate by priority when over budget.","hp":"Helps you prevent context-length errors and silent cutoffs.","x":"Tokenizers differ by vendor; chars/4 is only a rough English estimate. Truncate low-priority parts first (old history, long tool output), keep head and tail of documents, never cut the system prompt.","v":"ladder:Old turns,Tool output,Low rank docs,Few-shot,System prompt|drop order (first to last)","code":"import tiktoken\nenc = tiktoken.get_encoding(\"o200k_base\")\nn = len(enc.encode(text))\n\n# Anthropic: exact count via API\nn = client.messages.count_tokens(model=MODEL, system=sys_prompt,\n                                 messages=msgs).input_tokens","eq":["e1_tokens"]},"e5_rot":{"k":"I","p":"E5","cl":"multi","t":"Context rot","s":"Model accuracy and instruction-following degrade as input grows, well before the advertised context limit.","hp":"Helps you treat long context as a cost to minimize, not free capacity.","x":"Needle tests overstate real performance; multi-fact reasoning over 100K+ tokens drops noticeably on many models. Effective context is often a fraction of the max. Prefer fewer, more relevant tokens.","v":"line:8K,32K,64K,128K,200K|Simple recall=99,98,97,95,93|Multi-hop=90,82,74,63,55","f":"long-context degradation","eq":["e5_ordering","e6_ragfailures"]},"e5_ordering":{"k":"B","p":"E5","cl":"azure","t":"Ordering & recency","s":"Place information where models attend best: key instructions at start and repeated near the end, the question after long documents.","hp":"Helps you counter lost-in-the-middle effects without adding tokens.","x":"Put long docs first, query and final instructions last (often notably better on long inputs). Rank retrieved chunks best-first or best at both ends. Restate critical constraints just before generation.","v":"line:Start,25%,Middle,75%,End|Recall=92,78,65,77,94","f":"lost in the middle","eq":["e5_rot","e6_rerank"]},"e5_failmodes":{"k":"A","p":"E5","cl":"multi","t":"Context failure modes","s":"Four ways a full context misleads the model: poisoning, distraction, confusion and clash.","hp":"Helps you diagnose bad agent turns by naming which context failure caused them.","x":"Poisoning: a hallucination gets written into context and reused. Distraction: history outweighs training. Confusion: irrelevant tools or docs get used. Clash: contradictory info from different turns.","v":"table:Mode,Cause,Fix|Poisoning,bad fact persisted,validate writes|Distraction,huge history,compact|Confusion,too many tools,tool search|Clash,stale vs new info,prune old","eq":["e15_injection"]},"e5_history":{"k":"B","p":"E5","cl":"multi","t":"Conversation history management","s":"Strategy for which past turns stay verbatim, which get summarized and which are dropped as a session grows.","hp":"Helps you keep long chats and agent runs coherent without unbounded cost.","x":"The API is stateless: you resend history each call, so cost grows roughly quadratically over a session. Pick a policy per product: window, summarize, or retrieve.","v":"tree:History policy>Keep,Summarize,Drop;Keep>Last N turns,Pinned facts;Summarize>Rolling summary","eq":["e2_messages"]},"e5_slidingwindow":{"k":"B","p":"E5","cl":"azure","t":"Sliding window","s":"Keep only the last N turns (or last T tokens) of conversation and drop the rest.","hp":"Helps you cap cost and latency with one line of code.","x":"Simple and cache-unfriendly: dropping from the front changes the prefix each turn. Never split a tool call from its result. Combine with a pinned summary so early facts are not lost.","v":"flow:turn 1>turn 2>turn 3>turn 4>turn 5>turn 6","code":"def window(msgs, max_tokens=20_000):\n    kept, total = [], 0\n    for m in reversed(msgs):\n        total += count(m)\n        if total > max_tokens:\n            break\n        kept.append(m)\n    return drop_orphan_tool_results(kept[::-1])","eq":["e5_compaction"]},"e5_compaction":{"k":"I","p":"E5","cl":"azure","t":"Compaction & summarization","s":"When history nears a threshold, replace older turns with an LLM-written summary that keeps decisions, facts, open tasks and file paths.","hp":"Helps you run agents for hours without hitting the window or losing the plot.","x":"Trigger at ~70-85% of budget. Prompt the summarizer for what to keep (goals, decisions, unresolved errors, IDs) and keep the last few turns verbatim. Summaries lose detail; pair with notes files for exact facts.","v":"flow:history grows>hit 80 pct>summarize old>keep recent>continue","code":"if count(msgs) > 0.8 * BUDGET:\n    old, recent = msgs[:-6], msgs[-6:]\n    summary = llm(SUMMARIZE_PROMPT, old)  # goals, decisions, open TODOs, IDs\n    msgs = [{\"role\": \"user\", \"content\": f\"Summary of earlier work:\\n{summary}\"},\n            *recent]","eq":["e5_slidingwindow","e5_scratchpad"]},"e5_trimtools":{"k":"I","p":"E5","cl":"azure","t":"Trimming tool results","s":"Shrink or clear bulky tool outputs (search hits, file dumps, API JSON) once they have been used, keeping a short stub.","hp":"Helps you reclaim the largest and least reusable share of an agent's context.","x":"Tool results are often 60-80% of agent tokens. Cap each result (e.g. 5-25K tokens), return summaries plus handles, and replace old results with '[cleared; re-run tool to see]'. Some APIs offer server-side clearing.","v":"gbars:Turn 10,Turn 20,Turn 30|Untrimmed=40,95,150|Trimmed=20,32,45","code":"for m in msgs[:-4]:  # leave the latest results intact\n    for block in m.get(\"content\", []):\n        if block.get(\"type\") == \"tool_result\" and size(block) > 2_000:\n            block[\"content\"] = \"[old result cleared; call the tool again if needed]\"","eq":["e8_codeexec"]},"e5_jit":{"k":"I","p":"E5","cl":"azure","t":"Just-in-time vs pre-loaded context","s":"Either stuff likely-relevant data up front, or give the agent lightweight handles (paths, IDs, queries) and tools to load details when needed.","hp":"Helps you pick between fast single-shot answers and scalable agentic exploration.","x":"Pre-load: lower latency, fits small stable corpora. JIT: scales to large or changing data, keeps context lean, but costs extra tool calls. Hybrid is common: pre-load an index or summary, fetch details on demand.","v":"cmp:#Pre-load;Just-in-time|Latency=low;higher|Context use=heavy;lean|Freshness=snapshot;live|Scale=small corpora;unbounded","eq":["e6_ingest","e6_hybrid"]},"e5_scratchpad":{"k":"I","p":"E5","cl":"azure","t":"Scratchpads & note files","s":"Let the agent write plans, findings and progress to an external file or memory tool and read them back later instead of holding everything in context.","hp":"Helps you survive compaction and context resets on long multi-step tasks.","x":"Typical files: plan/todo list, NOTES.md, progress log. Re-read at the start of each phase. Structured todos also keep the agent on track. Keep notes terse and factual to avoid poisoning.","v":"seq:Agent,Notes file|1>2:write plan|1>2:append finding|1>1:context reset|2>1:read notes|1>2:mark done","eq":["e5_compaction","e9_loop"]},"e5_instrfiles":{"k":"B","p":"E5","cl":"gcp","t":"Instruction files","s":"Repo- or project-level markdown files (CLAUDE.md, AGENTS.md style) auto-loaded into agent context with conventions, commands and gotchas.","hp":"Helps you give coding and ops agents durable project knowledge without repeating it in every prompt.","x":"Keep them short (a few hundred lines max), concrete (exact commands, paths, do/don't) and current. Layer them: user-global, repo root, subfolder. Every line costs tokens every session, so prune.","v":"stack:Session prompt,Subfolder file,Repo root file,User global file|0","f":"CLAUDE.md / AGENTS.md","code":"# AGENTS.md\n## Commands\n- Test: `pytest -q tests/`\n- Lint: `ruff check src/ --fix`\n## Rules\n- Never edit generated files under `gen/`\n- Use `uv` not pip","eq":["e17_coding"]},"e5_cachefriendly":{"k":"I","p":"E5","cl":"gcp","t":"Cache-friendly prompt layout","s":"Order the prompt so the stable part (system, tools, static docs) forms an unchanging prefix and only the suffix varies per call.","hp":"Helps you get prompt-cache hits that cut input cost up to ~90% and lower TTFT.","x":"Caches match exact prefixes: a timestamp or user name early in the system prompt busts every hit. Keep tool list order fixed, append history (do not edit earlier turns), put per-request data last.","v":"stack:User turn,Recent history,Retrieved docs,Tool defs,System prompt|2","code":"resp = client.messages.create(\n    model=MODEL, max_tokens=1024,\n    system=[{\"type\": \"text\", \"text\": STATIC_SYSTEM + POLICY_DOCS,\n             \"cache_control\": {\"type\": \"ephemeral\"}}],  # stable prefix\n    tools=TOOLS,              # fixed order\n    messages=history + [new_turn])  # variable suffix","eq":["e12_promptcaching"]},"e5_subagent":{"k":"A","p":"E5","cl":"azure","t":"Sub-agent context isolation","s":"Delegate a subtask to a sub-agent with its own fresh context; it explores, then returns only a condensed result to the parent.","hp":"Helps you keep the main agent's context clean during broad searches or noisy tool work.","x":"The sub-agent may burn 50K+ tokens and hand back 1-2K. Good for search, research, file exploration. Costs more total tokens and loses shared detail; give each sub-agent a crisp brief and output format.","v":"arch:Delegation:Lead agent>Sub-agent A,Sub-agent B>Summary A,Summary B>Lead agent","code":"# pseudo\nsummary = run_agent(\n    system=\"You are a code search agent. Return <=300 words: files, line refs, findings.\",\n    task=f\"Find where auth tokens are refreshed in {repo}\",\n    tools=[grep, read_file], max_turns=20)\nlead_msgs.append({\"role\": \"user\", \"content\": f\"Search result:\\n{summary}\"})","eq":["e9_orchestrator","e9_multiagent"]},"e5_memory":{"k":"I","p":"E5","cl":"multi","t":"Memory types","s":"Agent memory split by function: working (current context), episodic (past events), semantic (facts) and procedural (how-to rules and skills).","hp":"Helps you choose the right storage and retrieval for each kind of thing an agent should remember.","x":"Working = the window. Episodic = logged past interactions, retrieved by similarity/time. Semantic = extracted facts or profile. Procedural = prompts, instruction files, learned rules. Most apps need only 1-2 types.","v":"draw:memory","eq":["e5_sessionstate"]},"e5_sessionstate":{"k":"B","p":"E5","cl":"multi","t":"Session state vs long-term memory","s":"Session state lives for one thread (messages, scratch vars, checkpoints); long-term memory persists across threads and sessions per user or org.","hp":"Helps you avoid leaking one session's details into another and know what to persist where.","x":"Session state: checkpointer keyed by thread_id. Long-term: store keyed by user/namespace. Default to session-only; promote to long-term only through an explicit write policy.","v":"cmp:#Session state;Long-term memory|Scope=one thread;user or org|Lifetime=minutes-days;months|Key=thread_id;user_id + ns|Store=checkpointer;DB or vector store","eq":["e9_checkpoint"]},"e5_memstores":{"k":"I","p":"E5","cl":"aws","t":"Memory stores & tools","s":"Libraries and services that extract, store, retrieve and update agent memories, usually over a vector DB plus key-value or graph store.","hp":"Helps you add persistent memory without designing extraction and retrieval from scratch.","x":"Common pieces: an extract step (LLM pulls facts from turns), dedupe/update, hybrid retrieval, and a memory tool the agent can call. Evaluate on recall of real user facts, not demo chats.","v":"arch:Memory layer:Chat turns>Extractor LLM>Vector store,KV store>Retriever","eq":["e7_vectordbs"]},"e5_mem0":{"k":"I","p":"E5","cl":"aws","t":"Mem0","s":"Open-source and hosted memory layer that extracts facts from conversations and retrieves them per user, agent or session.","hp":"Helps you add user-level memory to a chatbot in a few lines.","x":"add() runs LLM extraction and dedupe (ADD/UPDATE/DELETE of facts); search() returns relevant memories to inject. Scope by user_id/agent_id/run_id. Extraction adds an LLM call per write.","v":"flow:add turns>extract facts>dedupe update>store>search","code":"from mem0 import Memory\n\nm = Memory()\nm.add([{\"role\": \"user\", \"content\": \"I am vegetarian and live in Pune\"}],\n      user_id=\"alice\")\nhits = m.search(\"dinner suggestions\", user_id=\"alice\")","eq":["e5_letta","e5_lgstore"]},"e5_letta":{"k":"A","p":"E5","cl":"aws","t":"Letta (MemGPT)","s":"Agent framework from the MemGPT paper where the agent manages its own memory: editable core memory blocks in context plus archival and recall storage.","hp":"Helps you build stateful agents that self-edit what they remember.","x":"Core memory blocks (e.g. 'human', 'persona') sit in the prompt and are edited via tools; archival memory is searched on demand. Agents are server-side and persistent. Powerful but more opinionated.","v":"tiers:Core blocks,Recall history,Archival store|in context|out of context","f":"virtual context management","code":"from letta_client import Letta\n\nclient = Letta(base_url=\"http://localhost:8283\")\nagent = client.agents.create(\n    model=\"openai/gpt-4.1-mini\", embedding=\"openai/text-embedding-3-small\",\n    memory_blocks=[{\"label\": \"human\", \"value\": \"Name: Alice\"},\n                   {\"label\": \"persona\", \"value\": \"Concise travel assistant\"}])","eq":["e5_mem0"]},"e5_lgstore":{"k":"I","p":"E5","cl":"aws","t":"LangGraph store","s":"LangGraph's long-term memory API: namespaced JSON documents with optional semantic search, shared across threads, separate from the checkpointer.","hp":"Helps you add cross-thread memory to LangGraph agents with the same persistence backend.","x":"Namespaces like ('users', user_id, 'prefs'). put/get/search; enable an embedding index for semantic search. Use InMemoryStore for dev, Postgres store for prod.","v":"tree:Store>users;users>u1,u2;u1>prefs,facts;u2>prefs","code":"from langgraph.store.memory import InMemoryStore\n\nstore = InMemoryStore(index={\"embed\": embed_fn, \"dims\": 1536})\nstore.put((\"users\", \"u1\"), \"prefs\", {\"text\": \"Prefers answers in French\"})\nhits = store.search((\"users\", \"u1\"), query=\"language preference\", limit=3)","eq":["e9_frameworks","e5_mem0"]},"e5_profile":{"k":"B","p":"E5","cl":"azure","t":"User profile memory","s":"Maintain a small structured profile per user (role, preferences, constraints) that is injected into every prompt.","hp":"Helps you personalize answers cheaply without retrieving over raw history.","x":"Keep it a typed object of ~10-30 fields, updated by an extraction step, editable and visible to the user. Inject into the stable part of the prompt only if it rarely changes.","v":"hub:Profile|Role,Language,Timezone,Units,Tone,Constraints","eq":["e15_pii"]},"e5_memretrieval":{"k":"I","p":"E5","cl":"azure","t":"Memory retrieval & injection","s":"Select which stored memories to put into context per turn, by relevance, recency and importance, and format them clearly.","hp":"Helps you use memory without flooding the window with stale facts.","x":"Score = similarity + recency decay + importance; take top 5-10. Label them ('Known about user:') with dates so the model can weigh freshness. Let the agent call a memory search tool for more.","v":"fanin:Similarity,Recency,Importance|Memory rank","eq":["e6_rerank"]},"e5_writepolicy":{"k":"A","p":"E5","cl":"gcp","t":"Memory write policies","s":"Rules for what gets written to long-term memory, when, by whom, and with what validation.","hp":"Helps you prevent memory poisoning, privacy leaks and contradictory facts.","x":"Write durable, user-stated facts only; not guesses or tool outputs from untrusted content. Update instead of append on conflicts. Store source and timestamp. Write async after the turn to keep latency down.","v":"flow:candidate fact>is durable>is trusted>conflict check>write","eq":["e15_injection","e5_failmodes"]},"e5_forgetting":{"k":"A","p":"E5","cl":"gcp","t":"Forgetting & memory hygiene","s":"Deliberately expire, decay, consolidate and delete memories, including user-requested deletion.","hp":"Helps you keep memory accurate and comply with retention and right-to-erasure rules.","x":"Apply TTLs to episodic items, merge duplicates periodically, demote stale facts. Support 'forget this' and full account deletion across vector and KV stores. Audit what is stored per user.","v":"line:Day 0,Day 7,Day 30,Day 90|Relevance=100,70,40,15|Pinned fact=100,100,100,100","eq":["e15_pii"]},"E6":{"k":"S","p":"E6","t":"Retrieval & RAG Engineering","s":"Building retrieval that actually finds the right evidence: ingestion, parsing, chunking, embeddings, hybrid search, reranking, query rewriting and grounded answers.","hp":"Most bad RAG answers are retrieval failures, so retrieval quality caps answer quality.","x":"ingestion & parsing, chunking, contextual retrieval, embedding choice, BM25/hybrid, reranking, query rewriting, small-to-big, citations, ACLs, GraphRAG, agentic & multimodal RAG, failure modes","v":"draw:rag","sec":{"pid":"E6","num":6,"title":"Retrieval & RAG Engineering","short":"RAG engineering"}},"e6_ingest":{"k":"B","p":"E6","cl":"gcp","t":"Ingestion pipeline","s":"The offline job that turns raw sources into searchable chunks: load, parse, clean, chunk, enrich, embed, index.","hp":"Helps you fix retrieval at the source instead of patching prompts downstream.","x":"Make every stage idempotent and keyed by doc ID + content hash. Store raw, parsed and chunked versions so you can re-chunk or re-embed without re-crawling. Log per-doc failures; silent parse errors are the #1 hidden RAG bug.","v":"flow:Load>Parse>Clean>Chunk>Enrich>Embed>Index","f":"ETL for RAG","eq":["e6_incremental","e16_docai"]},"e6_parsing":{"k":"I","p":"E6","cl":"azure","t":"Document parsing & layout","s":"Extracting text, structure, tables and reading order from PDFs, Office files, HTML and scans before chunking.","hp":"Helps you avoid garbage-in: broken tables and jumbled columns poison every later stage.","x":"Plain pdf-to-text loses headings, merges two-column layouts and flattens tables. Keep tables as Markdown/HTML, keep heading hierarchy, drop headers/footers. Eyeball 20 parsed docs before tuning anything else.","v":"fan:PDF page|Text blocks,Headings,Tables,Figures,Reading order","f":"PDF/Office extraction","eq":["e6_parsers","e6_vlmparse","e16_docai"]},"e6_parsers":{"k":"I","p":"E6","cl":"aws","t":"Parsing tools (Docling, Unstructured)","s":"Libraries and services that convert documents to structured elements or Markdown: Docling, Unstructured, LlamaParse, PyMuPDF, Azure DI, Textract.","hp":"Helps you pick a parser by doc type, cost and accuracy instead of defaulting to pypdf.","x":"PyMuPDF: fast, born-digital text only. Docling/Unstructured hi_res: layout models + table structure, local. LlamaParse/Azure DI/Textract: hosted, OCR for scans, per-page cost. Benchmark on YOUR worst docs.","v":"cmp:#Speed;Tables;Scans|PyMuPDF=fast;weak;no|Docling=medium;good;OCR|Unstructured=medium;good;OCR|LlamaParse=hosted;good;yes","code":"from docling.document_converter import DocumentConverter\n\nres = DocumentConverter().convert(\"report.pdf\")\nmd = res.document.export_to_markdown()  # headings + tables as Markdown","eq":["e6_vlmparse","e16_docai"]},"e6_vlmparse":{"k":"A","p":"E6","cl":"azure","t":"VLM-based parsing & OCR","s":"Using a vision-language model to transcribe each page image into Markdown, including tables, charts and handwriting.","hp":"Helps you handle scans, complex tables and charts where layout parsers fail.","x":"Render pages at ~150–200 DPI, prompt for Markdown with tables, ask to describe figures. Costs ~1–3K tokens per page; watch for hallucinated numbers, so spot-check against OCR text. Batch API halves cost for backfills.","v":"flow:Page image>VLM prompt>Markdown>Verify numbers>Chunk","f":"LLM OCR","eq":["e6_multimodal","e16_vision","e2_batchapi"]},"e6_cleaning":{"k":"B","p":"E6","cl":"gcp","t":"Cleaning & deduplication","s":"Removing boilerplate (nav, footers, cookie banners), normalizing whitespace and dropping exact or near-duplicate documents before indexing.","hp":"Helps you stop top-k from filling with five copies of the same footer or doc version.","x":"Hash normalized text for exact dupes; MinHash/LSH (Jaccard ~0.8–0.9) for near-dupes. Strip repeated page headers by frequency. Keep only the latest version of versioned docs or tag versions in metadata.","v":"bars:Raw chunks=100,Boilerplate=22,Exact dupes=9,Near dupes=11,Kept=58","code":"from datasketch import MinHash, MinHashLSH\nlsh = MinHashLSH(threshold=0.85, num_perm=128)\nfor doc_id, text in docs.items():\n    m = MinHash(num_perm=128)\n    for w in set(text.lower().split()): m.update(w.encode())\n    if lsh.query(m): continue  # near-duplicate\n    lsh.insert(doc_id, m)"},"e6_metadata":{"k":"B","p":"E6","cl":"azure","t":"Metadata enrichment & filters","s":"Attaching fields like source, date, product, tenant, section path and doc type to each chunk so retrieval can filter and rank on them.","hp":"Helps you answer 'latest policy for EU' by filtering, not hoping the embedding gets it.","x":"Extract cheap fields deterministically (path, date, author); use an LLM for tags/summaries only when needed. Filters cut search space and fix recency errors. Store section titles in the chunk text too.","v":"hub:Chunk|source,date,tenant,section,doc type,language,version","code":"results = collection.query(\n    query_texts=[q], n_results=10,\n    where={\"$and\": [{\"region\": \"EU\"}, {\"year\": {\"$gte\": 2025}}]},\n)  # Chroma metadata filter","eq":["e7_filtering","e6_routing"]},"e6_incremental":{"k":"I","p":"E6","cl":"gcp","t":"Incremental updates & deletes","s":"Keeping the index in sync with sources: upsert changed docs, delete removed ones, and never leave orphan chunks behind.","hp":"Helps you avoid answers from deleted or superseded documents.","x":"Key chunks by (doc_id, chunk_no) and store a doc content hash; on change delete all chunks for doc_id then insert. Run periodic full reconciliation to catch missed deletes. Deletion is a compliance requirement, not a nice-to-have.","v":"flow:Change event>Hash diff>Delete old chunks>Re-chunk>Upsert>Reconcile","code":"h = sha256(text.encode()).hexdigest()\nif store.get_hash(doc_id) != h:\n    index.delete(filter={\"doc_id\": doc_id})\n    index.upsert(embed_chunks(doc_id, chunk(text)))\n    store.set_hash(doc_id, h)  # pseudo","eq":["e6_ingest"]},"e6_chunking":{"k":"B","p":"E6","cl":"multi","t":"Chunking strategy","s":"How you split documents into retrievable units; it decides what can be found and what context the LLM sees.","hp":"Helps you balance retrieval precision against keeping enough context to answer.","x":"Start with structure-aware splitting at ~300–800 tokens with 10–20% overlap, then tune on an eval set. Chunks should be self-contained: carry the doc title and section heading. No single size wins across corpora.","v":"draw:chunking","eq":["e6_contextual","e6_smalltobig"]},"e6_fixedchunk":{"k":"B","p":"E6","cl":"azure","t":"Fixed-size chunks + overlap","s":"Splitting text every N tokens with an overlap window so sentences cut at boundaries appear in both neighbors.","hp":"Helps you get a working baseline in minutes before trying smarter splitters.","x":"Typical: 512 tokens, 50–100 overlap. Count tokens, not characters. Cheap and predictable, but cuts tables and sentences mid-thought; overlap above ~25% mostly adds duplicate hits.","v":"flow:Doc>Window 512>Slide by 450>Chunks with overlap","code":"from langchain_text_splitters import TokenTextSplitter\nsplitter = TokenTextSplitter(chunk_size=512, chunk_overlap=64)\nchunks = splitter.split_text(text)","eq":["e6_recursivechunk"]},"e6_recursivechunk":{"k":"I","p":"E6","cl":"azure","t":"Structure-aware chunking","s":"Splitting along natural boundaries (headings, paragraphs, list items, code blocks, functions) and only falling back to smaller separators when too big.","hp":"Helps you keep sections, tables and functions intact so chunks read as complete thoughts.","x":"Recursive splitters try separators in order (\\n\\n, \\n, '. ', ' '). For Markdown split on headers and keep the header path as metadata; for code split by function/class (AST or tree-sitter). Never split a table row.","v":"tree:Doc>H1 Intro,H1 Setup;H1 Setup>H2 Install,H2 Config;H2 Config>Para,Table","f":"recursive / header splitting","code":"from langchain_text_splitters import MarkdownHeaderTextSplitter\nsp = MarkdownHeaderTextSplitter(headers_to_split_on=[(\"#\", \"h1\"), (\"##\", \"h2\")])\ndocs = sp.split_text(markdown)  # each doc.metadata has its header path","eq":["e6_fixedchunk","e6_semanticchunk"]},"e6_semanticchunk":{"k":"I","p":"E6","cl":"azure","t":"Semantic chunking","s":"Embedding consecutive sentences and starting a new chunk where similarity between neighbors drops sharply (a topic shift).","hp":"Helps you chunk unstructured prose (transcripts, emails) that has no headings.","x":"Costs an embedding call per sentence at ingest. Gains over good recursive splitting are often small or zero in published tests, so A/B it on your eval set. Set min/max chunk sizes to avoid tiny or huge chunks.","v":"line:s1,s2,s3,s4,s5,s6,s7,s8|Neighbor sim=0.82,0.79,0.31,0.85,0.8,0.28,0.77,0.81","code":"from langchain_experimental.text_splitter import SemanticChunker\nfrom langchain_openai import OpenAIEmbeddings\nsplitter = SemanticChunker(OpenAIEmbeddings(), breakpoint_threshold_type=\"percentile\")\nchunks = splitter.split_text(transcript)","eq":["e6_recursivechunk","e6_latechunk"]},"e6_latechunk":{"k":"A","p":"E6","cl":"azure","t":"Late chunking","s":"Run the whole document through a long-context embedding model first, then mean-pool token embeddings per chunk span, so each chunk vector sees full-doc context.","hp":"Helps you resolve pronouns and references ('it', 'the company') without LLM-written context.","x":"Needs a long-context embedder that exposes token embeddings (e.g. jina-embeddings-v3, 8K). Cheaper than contextual retrieval (no LLM calls) but limited to the model's window; long docs need macro-chunks.","v":"flow:Full doc>Token embeddings>Pool per span>Chunk vectors","eq":["e6_contextual","e6_semanticchunk"]},"e6_chunksize":{"k":"B","p":"E6","cl":"multi","t":"Chunk size trade-offs","s":"Small chunks give precise matches but lose context; large chunks keep context but dilute the embedding and waste prompt tokens.","hp":"Helps you pick a size from evidence, not folklore.","x":"Fact lookups favor ~200–400 tokens; explanatory questions ~600–1,000. Sweep 3 sizes and measure recall@k and answer quality. If you need both, decouple: retrieve small, return big.","v":"quad:Chunk size,Score|128 tok=1,4;256 tok=3,7;512 tok=5,8;1024 tok=7,6;2048 tok=9,3","eq":["e6_smalltobig","e10_ragmetrics"]},"e6_contextual":{"k":"I","p":"E6","cl":"azure","t":"Contextual retrieval","s":"Before embedding, an LLM writes 50–100 tokens situating each chunk in its document; that context is prepended for both embedding and BM25.","hp":"Helps you rescue chunks that are meaningless alone, like 'revenue grew 3%' with no company.","x":"Anthropic reported failed top-20 retrievals down 35% (embeddings) and 49% (plus contextual BM25), 67% with reranking. Use prompt caching on the full doc so per-chunk cost stays low.","v":"bars:Baseline=5.7,Ctx embed=3.7,Ctx plus BM25=2.9,Plus rerank=1.9","code":"ctx = client.messages.create(model=SMALL_MODEL, max_tokens=150, messages=[{\"role\": \"user\", \"content\": [\n  {\"type\": \"text\", \"text\": f\"<doc>{doc}<\/doc>\", \"cache_control\": {\"type\": \"ephemeral\"}},\n  {\"type\": \"text\", \"text\": f\"Situate this chunk in the doc in 1-2 sentences:\\n{chunk}\"}]}]).content[0].text\nembed_text = ctx + \"\\n\\n\" + chunk","eq":["e6_latechunk","e12_promptcaching"]},"e6_embedmodel":{"k":"B","p":"E6","cl":"gcp","t":"Embedding model choice","s":"Picking the model that maps queries and chunks to vectors, judged on retrieval quality for your domain, language, cost and dimension.","hp":"Helps you avoid a silent ceiling on recall that no reranker can fully fix.","x":"Shortlist from the MTEB retrieval tab (not the average), then test top 3 on 100+ of your own query/answer pairs. Check max input tokens, dims, multilingual support and hosting. Switching later means re-embedding everything.","v":"table:Factor,Check|Retrieval score,MTEB retrieval|Domain fit,Own eval set|Dims,256 to 3072|Languages,Multilingual?|Max input,512 to 8K tok|Hosting,API or local","f":"MTEB, dims, domain fit","code":"from sentence_transformers import SentenceTransformer\nm = SentenceTransformer(\"BAAI/bge-m3\")\nq = m.encode(queries, normalize_embeddings=True)\nd = m.encode(chunks, normalize_embeddings=True)\nrecall = eval_recall_at_k(q @ d.T, gold, k=10)  # your harness","eq":["e6_queryprefix","e10_ragmetrics"]},"e6_matryoshka":{"k":"A","p":"E6","cl":"azure","t":"Matryoshka dimension truncation","s":"Models trained with Matryoshka loss pack the most information into the first dims, so you can cut 3072-d vectors to 256–1024 with modest quality loss.","hp":"Helps you cut vector storage and latency 3–12x without switching models.","x":"Only valid for MRL-trained models (OpenAI text-embedding-3, nomic v1.5, many recent open models). Re-normalize after truncating. Common trick: search short vectors, rescore top candidates with full ones.","v":"line:64,128,256,512,1024,3072|Relative quality=88,93,96,98,99,100","f":"MRL","code":"from openai import OpenAI\nv = OpenAI().embeddings.create(model=\"text-embedding-3-large\", input=chunks,\n                              dimensions=512).data  # MRL truncation server-side","eq":["e7_quantization"]},"e6_queryprefix":{"k":"I","p":"E6","cl":"multi","t":"Query vs document prefixes","s":"Many embedders are asymmetric and expect task prefixes or instructions, e.g. 'query: ' vs 'passage: ' (E5) or 'search_query: ' vs 'search_document: ' (Nomic).","hp":"Helps you avoid a quiet 5–15 point recall loss from skipping the model card.","x":"Read the model card: some need prefixes, some an instruction on queries only, APIs may take input_type ('query' vs 'document'). Use the same prefix at ingest and query time, and never mix two models in one index.","v":"seq:Ingest,Embedder,Query|1>2:passage + text|3>2:query + text|2>2:same vector space","f":"asymmetric embeddings","code":"from sentence_transformers import SentenceTransformer\nm = SentenceTransformer(\"intfloat/e5-large-v2\")\nd = m.encode([\"passage: \" + c for c in chunks], normalize_embeddings=True)\nq = m.encode([\"query: \" + user_q], normalize_embeddings=True)"},"e6_sparse":{"k":"B","p":"E6","cl":"azure","t":"Sparse retrieval (BM25, SPLADE)","s":"Keyword scoring with term frequency and inverse document frequency (BM25), or learned sparse expansions (SPLADE) over an inverted index.","hp":"Helps you nail exact terms embeddings miss: error codes, SKUs, names, acronyms.","x":"BM25 defaults k1≈1.2, b≈0.75. Strong baseline that often beats embeddings on jargon-heavy or ID-heavy queries. SPLADE adds learned term expansion at higher index cost. Usually best as half of hybrid.","v":"cmp:#BM25;Dense|Exact IDs=strong;weak|Synonyms=weak;strong|Cost=very low;embed calls|Out of domain=robust;varies","f":"lexical search","code":"from rank_bm25 import BM25Okapi\nbm25 = BM25Okapi([c.lower().split() for c in chunks])\nscores = bm25.get_scores(query.lower().split())","eq":["e6_hybrid"]},"e6_hybrid":{"k":"I","p":"E6","cl":"azure","t":"Hybrid search + RRF","s":"Run dense vector and BM25 search in parallel and merge the ranked lists, usually with Reciprocal Rank Fusion: score = Σ 1/(k + rank).","hp":"Helps you get both semantic matches and exact keyword hits without tuning score scales.","x":"RRF k=60 is the standard default and needs no score normalization. Retrieve ~20–50 from each side, fuse, then rerank. Weighted score fusion can beat RRF but requires calibrated scores.","v":"draw:hybrid","f":"Reciprocal Rank Fusion","code":"def rrf(*rankings, k=60):\n    scores = {}\n    for ranking in rankings:\n        for rank, doc_id in enumerate(ranking, start=1):\n            scores[doc_id] = scores.get(doc_id, 0) + 1 / (k + rank)\n    return sorted(scores, key=scores.get, reverse=True)\nfused = rrf(dense_ids, bm25_ids)[:50]","eq":["e6_sparse","e7_vectordbs"]},"e6_rerank":{"k":"I","p":"E6","cl":"azure","t":"Cross-encoder reranking","s":"A model scores each (query, chunk) pair jointly, which is far more accurate than vector similarity, applied only to a short candidate list.","hp":"Helps you put the right chunk in the top 5 instead of somewhere in the top 50.","x":"Pattern: retrieve 50–100 → rerank → keep 3–8. Options: Cohere Rerank, Voyage rerank, bge-reranker-v2-m3, Jina reranker. Adds ~50–300 ms; often the single biggest quality win after hybrid.","v":"flow:Query>Retrieve 50>Cross-encoder>Top 5>LLM","f":"Cohere Rerank, bge-reranker","code":"from sentence_transformers import CrossEncoder\nce = CrossEncoder(\"BAAI/bge-reranker-v2-m3\")\nscores = ce.predict([(query, c.text) for c in candidates])\ntop = [c for _, c in sorted(zip(scores, candidates), key=lambda p: -p[0])][:5]","eq":["e6_hybrid","e12_latency"]},"e6_smalltobig":{"k":"I","p":"E6","cl":"azure","t":"Parent-document retrieval","s":"Index small child chunks for precise matching, but return their larger parent section (or whole doc) to the LLM.","hp":"Helps you get precise hits and full context at the same time.","x":"Typical: 200-token children, 1–2K-token parents. Dedupe parents when several children hit. Watch total prompt size: 5 parents × 2K = 10K tokens per question.","v":"arch:Small to big:Query>Child chunks>Parent lookup>Parent sections","f":"small-to-big","code":"from langchain.retrievers import ParentDocumentRetriever\nfrom langchain.storage import InMemoryStore\nretriever = ParentDocumentRetriever(vectorstore=vs, docstore=InMemoryStore(),\n    child_splitter=small_splitter, parent_splitter=big_splitter)\nretriever.add_documents(docs)","eq":["e6_chunksize","e6_sentencewindow"]},"e6_sentencewindow":{"k":"A","p":"E6","cl":"azure","t":"Sentence-window retrieval","s":"Embed individual sentences, then expand each hit to the surrounding N sentences before sending it to the LLM.","hp":"Helps you get pinpoint matching on dense text like contracts and specs.","x":"Window of ±2–3 sentences is typical. Creates many vectors (one per sentence), so index size grows ~10x versus 500-token chunks. Merge overlapping windows from the same doc.","v":"flow:Sentence hit>Expand 3 each side>Merge overlaps>Prompt","code":"from llama_index.core.node_parser import SentenceWindowNodeParser\nfrom llama_index.core.postprocessor import MetadataReplacementPostProcessor\nparser = SentenceWindowNodeParser.from_defaults(window_size=3)\npost = MetadataReplacementPostProcessor(target_metadata_key=\"window\")","eq":["e6_smalltobig"]},"e6_queryrewrite":{"k":"I","p":"E6","cl":"azure","t":"Query rewriting","s":"Transforming the user's raw question before retrieval: resolve chat references, expand into multiple phrasings, or generate search-friendly queries.","hp":"Helps you retrieve for what the user meant, not the literal follow-up 'what about the second one?'.","x":"Always condense multi-turn chat into a standalone query. Multi-query: 3–5 paraphrases, retrieve each, fuse with RRF. Use a small fast model; it adds one LLM hop (~200–500 ms).","v":"fan:User question|Standalone,Paraphrase 1,Paraphrase 2,HyDE answer,Sub-questions","f":"multi-query, condense","code":"prompt = f\"\"\"Chat history:\\n{history}\\nRewrite the last question as a standalone search query,\nthen give 3 alternative phrasings. Return JSON: {{\"queries\": [...]}}\"\"\"\nqueries = json.loads(llm(prompt))[\"queries\"]\nhits = rrf(*[search(q, k=20) for q in queries])  # pseudo","eq":["e6_hyde","e6_decomposition"]},"e6_hyde":{"k":"A","p":"E6","cl":"azure","t":"HyDE (hypothetical document)","s":"Have the LLM write a plausible answer passage and embed that instead of the short question, since answers look more like documents than questions do.","hp":"Helps you bridge short, vague questions and long technical documents.","x":"Works best zero-shot or out-of-domain; can hurt when the LLM hallucinates domain-specific terms. Combine HyDE vector + original query via RRF rather than replacing the query. Adds an LLM call per query.","v":"flow:Question>LLM fake answer>Embed answer>Vector search>Real chunks","f":"Hypothetical Document Embeddings","code":"fake = llm(f\"Write a short passage that answers: {q}\")\nhits = rrf(vector_search(embed(fake)), vector_search(embed(q)))  # pseudo","eq":["e6_queryrewrite"]},"e6_decomposition":{"k":"I","p":"E6","cl":"azure","t":"Decomposition & step-back","s":"Split a compound question into sub-questions retrieved separately, or ask a broader 'step-back' question to fetch background principles.","hp":"Helps you answer comparisons and multi-hop questions one retrieval can't cover.","x":"'Compare refund policy in 2024 vs 2025' → two sub-queries with date filters. Step-back: 'what governs refunds?' before the specific case. Cap at ~3–5 sub-queries; beyond that, use agentic RAG.","v":"tree:Compare A vs B>Facts on A,Facts on B;Facts on A>Chunk A1,Chunk A2;Facts on B>Chunk B1","f":"multi-hop query planning","eq":["e6_agenticrag","e3_chaining"]},"e6_routing":{"k":"I","p":"E6","cl":"azure","t":"Query routing","s":"Classify the query and send it to the right index, tool or path: docs vs FAQ vs SQL vs web vs no retrieval at all.","hp":"Helps you skip useless retrieval and query the source that can actually answer.","x":"Use an LLM with structured output or a small classifier; include a 'no_retrieval' and 'clarify' route. Log route decisions and evaluate routing accuracy separately from answer quality.","v":"fan:Router|Product docs,Policy index,SQL tool,Web search,No retrieval","code":"class Route(BaseModel):\n    target: Literal[\"docs\", \"policies\", \"sql\", \"none\"]\n    filters: dict[str, str] = {}\nroute = llm_structured(question, schema=Route)  # pseudo","eq":["e12_routing","e4_jsonschema"]},"e6_citations":{"k":"B","p":"E6","cl":"gcp","t":"Grounding & citations","s":"Instruct the model to answer only from retrieved sources and cite chunk IDs per claim, then verify citations exist and support the claim.","hp":"Helps you build user trust and make wrong answers easy to catch and debug.","x":"Give each chunk a short ID ([S1], [S2]) with title/URL. Require 'I don't know' when sources don't cover it. Post-check: cited IDs must exist; optionally an NLI/LLM check that each sentence is supported. Some APIs return native citations.","v":"seq:App,LLM,Verifier|1>2:Q + chunks S1-S5|2>1:answer with [S2]|1>3:check S2 supports|3>1:ok or flag","f":"attribution","code":"SYSTEM = \"\"\"Answer ONLY from the sources. After each claim add [S#].\nIf the sources don't contain the answer, say you don't know.\"\"\"\nsources = \"\\n\".join(f\"[S{i}] {c.title}: {c.text}\" for i, c in enumerate(top, 1))","eq":["e16_trustux","e10_ragmetrics"]},"e6_acl":{"k":"I","p":"E6","cl":"gcp","t":"Permission-aware retrieval","s":"Filter retrieved chunks by the requesting user's access rights at query time, mirroring the source system's ACLs.","hp":"Helps you avoid leaking HR or finance docs to anyone who asks the chatbot nicely.","x":"Store allowed groups/users on every chunk and apply them as a pre-filter inside the search, never in the prompt. Sync ACL changes like content changes. Test with a user who should see nothing.","v":"flow:User token>Resolve groups>Filtered search>Only permitted chunks>LLM","f":"document-level security","code":"SELECT id, text FROM chunks\nWHERE allowed_groups && $1::text[]   -- user's groups\nORDER BY embedding <=> $2\nLIMIT 20;","eq":["e7_filtering","e15_leastpriv"]},"e6_longcontext":{"k":"B","p":"E6","cl":"multi","t":"Long context vs RAG","s":"Deciding whether to stuff whole documents into a 200K–1M token window or retrieve a few relevant chunks.","hp":"Helps you skip building RAG when the corpus fits, and know when it doesn't.","x":"Small, stable corpus (<~100–200K tokens) + prompt caching: try long context first. Large, changing, permissioned corpora need RAG. Long context costs more per call, adds latency and still degrades in the middle.","v":"quad:Corpus size,Change rate|Long context=2,2;Cached prompt=3,1;Classic RAG=7,6;Agentic RAG=8,8;Fine-tune=5,1","eq":["e5_budget","e12_promptcaching"]},"e6_graphrag":{"k":"A","p":"E6","cl":"azure","t":"GraphRAG & knowledge graphs","s":"Extract entities and relations into a graph, cluster it into communities with summaries, and answer via graph traversal or community summaries.","hp":"Helps you answer global 'what are the main themes' and multi-hop entity questions.","x":"Indexing is expensive (LLM extraction over every chunk, often 10–100x vector indexing). Wins on global sensemaking, rarely on simple lookups. Try LightRAG or hybrid vector + graph before full Microsoft GraphRAG.","v":"tree:Corpus>Entities,Relations;Entities>Communities;Communities>Summaries","f":"KG-RAG","code":"graphrag init --root ./kb\ngraphrag index --root ./kb\ngraphrag query --root ./kb --method global --query \"Main risk themes?\"","eq":["e6_agenticrag"]},"e6_agenticrag":{"k":"A","p":"E6","cl":"azure","t":"Agentic RAG","s":"Expose search as a tool the model calls iteratively, reformulating queries, choosing sources and stopping when it has enough evidence.","hp":"Helps you handle open-ended, multi-hop research questions a single retrieve-then-answer pass misses.","x":"Give tools with clear schemas (search_docs, fetch_doc, sql). Cap iterations (e.g. 5–8) and token budget. Slower and pricier than one-shot RAG; route only hard questions here.","v":"flow:Plan>Search tool>Read results>Enough?>Search again|loop","code":"{\"name\": \"search_docs\",\n \"description\": \"Hybrid search over internal docs. Returns top 8 chunks with ids.\",\n \"input_schema\": {\"type\": \"object\", \"properties\": {\n   \"query\": {\"type\": \"string\"}, \"product\": {\"type\": \"string\"}},\n   \"required\": [\"query\"]}}","eq":["e9_loop","e8_schema"]},"e6_multimodal":{"k":"A","p":"E6","cl":"azure","t":"Multimodal RAG (ColPali)","s":"Retrieve over page images, figures and tables directly, using late-interaction vision retrievers like ColPali/ColQwen, then answer with a VLM.","hp":"Helps you search slide decks, charts and scanned forms without lossy text extraction.","x":"ColPali stores ~1K patch vectors per page (multi-vector, MaxSim scoring), so storage is much larger than one vector per chunk. Alternatives: caption images with a VLM and index the text. Send the page image to the answering model.","v":"arch:Multimodal RAG:Page images>ColPali patches>MaxSim top pages>VLM answer","code":"from byaldi import RAGMultiModalModel\nrag = RAGMultiModalModel.from_pretrained(\"vidore/colqwen2-v1.0\")\nrag.index(input_path=\"decks/\", index_name=\"decks\")\nhits = rag.search(\"Q3 churn by region\", k=3)","eq":["e6_vlmparse","e16_vision"]},"e6_ragfailures":{"k":"B","p":"E6","cl":"multi","t":"RAG failure modes","s":"A taxonomy for debugging bad answers: missed retrieval, wrong chunk ranked first, lost in the middle, outdated content, conflicting sources, or ignored context.","hp":"Helps you locate the broken stage before randomly tuning chunk size or prompts.","x":"For each bad answer ask: was the evidence in the corpus? retrieved in top-k? ranked high? used by the model? Retrieval vs generation errors need different fixes. Put best chunks first and last.","v":"tree:Bad answer>Retrieval,Generation;Retrieval>Not indexed,Missed,Wrong rank,Stale;Generation>Lost in middle,Ignored ctx,Conflicts","eq":["e10_erroranalysis","e10_ragmetrics"]},"e6_frameworks":{"k":"B","p":"E6","cl":"aws","t":"RAG frameworks","s":"Libraries that bundle loaders, splitters, retrievers and query engines: LlamaIndex, LangChain, Haystack, plus lighter options like DSPy or plain code.","hp":"Helps you prototype fast while knowing when to drop to plain code.","x":"LlamaIndex: richest indexing/retrieval abstractions. LangChain: widest integrations. Haystack: explicit pipelines, production-oriented. Many teams prototype in a framework, then hand-write the hot path for control and debuggability.","v":"cmp:#Strength;Watch out|LlamaIndex=retrieval depth;abstraction layers|LangChain=integrations;API churn|Haystack=typed pipelines;smaller ecosystem|Plain code=full control;more to build","code":"from llama_index.core import VectorStoreIndex, SimpleDirectoryReader\nindex = VectorStoreIndex.from_documents(SimpleDirectoryReader(\"docs\").load_data())\nprint(index.as_query_engine(similarity_top_k=5).query(\"How do refunds work?\"))","eq":["e9_frameworks"]},"E7":{"k":"S","p":"E7","t":"Vector Search & Databases","s":"How similarity search over embeddings works and how to run it in production: ANN indexes, quantization, filtering, and choosing and operating a vector store.","hp":"Index and store choices set recall, latency, memory cost and how painful migrations will be.","x":"similarity metrics, exact vs ANN, recall vs latency, HNSW, IVF, PQ, DiskANN, quantization, filtered search, pgvector, vector DB landscape, multitenancy, sizing, re-embedding, benchmarking","v":"draw:vectorsearch","sec":{"pid":"E7","num":7,"title":"Vector Search & Databases","short":"Vector search"}},"e7_embeddings":{"k":"B","p":"E7","cl":"multi","t":"Embeddings as vectors","s":"Each chunk or query becomes a fixed-length float array (e.g. 384–3072 dims); nearby vectors mean similar content under the model's notion of similarity.","hp":"Helps you reason about storage, speed and why only same-model vectors are comparable.","x":"Store vectors as float32 (4 bytes/dim) unless quantized. Vectors from different models or versions live in different spaces; never mix them in one index. Keep model name + version alongside every vector.","v":"table:Model dims,Bytes per vec,1M vectors|384,1.5 KB,1.5 GB|768,3 KB,3.1 GB|1536,6 KB,6.1 GB|3072,12 KB,12.3 GB","eq":["e6_embedmodel","e7_sizing"]},"e7_metrics":{"k":"B","p":"E7","cl":"multi","t":"Similarity metrics & normalization","s":"Cosine, dot product and L2 distance rank results; on unit-normalized vectors all three give the same ordering.","hp":"Helps you match the index operator to how the model was trained and avoid silently wrong rankings.","x":"Use the metric the model card states (usually cosine). Normalize once at write time, then use dot/inner product: it's the fastest. pgvector: <=> cosine, <#> negative inner product, <-> L2.","v":"cmp:#Formula;Use when|Cosine=angle only;default for text|Dot product=angle x length;normalized vecs|L2=straight distance;some image models","f":"cosine, dot, L2","code":"import numpy as np\nX = X / np.linalg.norm(X, axis=1, keepdims=True)  # unit length\nq = q / np.linalg.norm(q)\nscores = X @ q   # dot == cosine now\ntop = np.argsort(-scores)[:10]"},"e7_knn_ann":{"k":"B","p":"E7","cl":"multi","t":"Exact kNN vs ANN","s":"Exact kNN compares the query to every vector; approximate nearest neighbor (ANN) indexes trade a little recall for orders-of-magnitude speedup.","hp":"Helps you know when brute force is fine and when you need an index.","x":"Brute force on <~100K vectors is often a few ms with numpy/BLAS and gives 100% recall. Beyond ~1M or under tight latency, use ANN (HNSW, IVF, DiskANN). Exact search is also your ground truth for measuring recall.","v":"line:10K,100K,1M,10M,100M|Exact ms=1,8,80,800,8000|HNSW ms=1,1,2,3,5","f":"brute force vs approximate","code":"import faiss\nindex = faiss.IndexFlatIP(d)   # exact inner product\nindex.add(X)                   # X: float32, normalized\nD, I = index.search(Q, 10)"},"e7_recall":{"k":"B","p":"E7","cl":"gcp","t":"Recall@k vs latency","s":"ANN quality is measured as recall@k: the fraction of true top-k neighbors (from exact search) the index returns, traded against latency and QPS.","hp":"Helps you tune index knobs against a number instead of guessing.","x":"Target ~0.95–0.99 recall@10 for RAG; past that, latency climbs steeply. Measure on 1K real queries vs a flat index. Note: ANN recall ≠ retrieval relevance; a perfect index still returns what the embedder ranks high.","v":"line:16,32,64,128,256,512|Recall@10=0.82,0.9,0.95,0.98,0.99,0.995|Latency ms=0.4,0.6,1,1.8,3.4,6.5","code":"def recall_at_k(ann_ids, exact_ids, k=10):\n    return sum(len(set(a[:k]) & set(e[:k])) / k\n               for a, e in zip(ann_ids, exact_ids)) / len(ann_ids)","eq":["e7_benchmark","e10_ragmetrics"]},"e7_hnsw":{"k":"I","p":"E7","cl":"azure","t":"HNSW index & tuning","s":"Hierarchical Navigable Small World: a multi-layer proximity graph searched greedily from sparse top layers down to the dense bottom layer.","hp":"Helps you get high recall at low latency, the default index in most vector stores.","x":"M = links per node (8–64, default 16), efConstruction = build beam (64–400), efSearch = query beam (must be ≥ k; raise for recall). Memory-resident; build is slow and RAM-hungry. Deletes leave tombstones.","v":"draw:hnsw","f":"M, efConstruction, efSearch","code":"import faiss\nindex = faiss.IndexHNSWFlat(d, 32)          # M=32\nindex.hnsw.efConstruction = 200\nindex.add(X)\nindex.hnsw.efSearch = 128                   # recall/latency knob\nD, I = index.search(Q, 10)","eq":["e7_ivf","e7_diskann"]},"e7_ivf":{"k":"I","p":"E7","cl":"azure","t":"IVF (inverted file) index","s":"Cluster vectors with k-means into nlist cells; at query time scan only the nprobe closest cells.","hp":"Helps you index large sets with less memory and faster builds than HNSW.","x":"nlist ≈ sqrt(N) to 4·sqrt(N); nprobe ~1–10% of nlist. Needs a training step on representative data; recall drops if the data distribution drifts. pgvector ivfflat: lists = rows/1000 up to 1M rows.","v":"flow:Query>Find nprobe centroids>Scan those cells>Top k","f":"nlist / nprobe","code":"import faiss\nquantizer = faiss.IndexFlatL2(d)\nindex = faiss.IndexIVFFlat(quantizer, d, 4096)  # nlist\nindex.train(X_sample); index.add(X)\nindex.nprobe = 32\nD, I = index.search(Q, 10)","eq":["e7_hnsw"]},"e7_pq":{"k":"A","p":"E7","cl":"azure","t":"Product quantization (PQ)","s":"Split each vector into m sub-vectors and replace each with a 1-byte code from a 256-entry codebook, compressing e.g. 6 KB to 96 bytes.","hp":"Helps you fit hundreds of millions of vectors in RAM.","x":"Compression 16–64x with noticeable recall loss; always rerank top candidates with full vectors. Often paired with IVF (IVF-PQ) or used for in-RAM codes in DiskANN. m must divide dims.","v":"bars:float32=6144,float16=3072,int8=1536,PQ m96=96,Binary=192","code":"import faiss\nquantizer = faiss.IndexFlatL2(d)\nindex = faiss.IndexIVFPQ(quantizer, d, 4096, 96, 8)  # nlist, m, bits\nindex.train(X_sample); index.add(X)\nindex.nprobe = 32","eq":["e7_quantization","e7_ivf"]},"e7_diskann":{"k":"A","p":"E7","cl":"azure","t":"DiskANN / SSD-resident indexes","s":"A graph index (Vamana) stored on SSD with compressed PQ codes in RAM, so a single node can serve billion-scale search with modest memory.","hp":"Helps you scale far past RAM without sharding across a big cluster.","x":"Query does a few SSD reads per hop; latency a few ms on NVMe. Found in Milvus (DISKANN), Azure Cosmos DB/SQL, pgvectorscale (StreamingDiskANN). Needs fast local NVMe, not network disks.","v":"stack:Query,PQ codes in RAM,Vamana graph on SSD,Full vectors on SSD|0","f":"Vamana graph","eq":["e7_hnsw","e7_serverless"]},"e7_quantization":{"k":"I","p":"E7","cl":"azure","t":"Scalar & binary quantization","s":"Store vectors as int8 (4x smaller) or 1 bit per dim (32x smaller), search on the compact form, then rescore top candidates with full-precision vectors.","hp":"Helps you cut RAM and cost 4–32x while keeping recall close to float32.","x":"int8: ~1% recall loss, near drop-in. Binary: best with ≥1024-dim models trained for it; oversample 3–10x then rescore. Supported in Qdrant, Weaviate, Milvus, Elasticsearch, pgvector (bit + binary_quantize).","v":"flow:Query>Binary search 200>Rescore float32>Top 10","f":"SQ, BQ, rescoring","code":"CREATE INDEX ON items USING hnsw ((binary_quantize(embedding)::bit(1536)) bit_hamming_ops);\nSELECT * FROM (\n  SELECT * FROM items ORDER BY binary_quantize(embedding)::bit(1536) <~> binary_quantize($1) LIMIT 200\n) c ORDER BY c.embedding <=> $1 LIMIT 10;","eq":["e7_pq","e6_embedmodel"]},"e7_faiss":{"k":"I","p":"E7","cl":"aws","t":"FAISS library","s":"Meta's C++/Python library of exact and ANN indexes (Flat, IVF, HNSW, PQ, GPU) that many vector DBs build on or benchmark against.","hp":"Helps you run fast in-process search or prototype index choices without a database.","x":"Index factory strings like 'IVF4096,PQ64' or 'HNSW32,Flat' compose indexes. No metadata, filtering, durability or replication: you build those. GPU indexes give huge build/search speedups for batch jobs.","v":"stack:Your app,FAISS index,numpy arrays,CPU or GPU|0","code":"import faiss\nindex = faiss.index_factory(768, \"HNSW32,Flat\", faiss.METRIC_INNER_PRODUCT)\nindex.add(X)\nfaiss.write_index(index, \"docs.faiss\")","eq":["e7_vectordbs"]},"e7_filtering":{"k":"I","p":"E7","cl":"azure","t":"Filtered vector search","s":"Combining similari
