13_loadtest","sc":"Before launch or any engine change","w":"Benchmarks validate sizing and catch regressions.","tree":true},{"id":"13.29","s":"e13_prefixcache","t":"e12_promptcaching","sc":"Same idea on hosted APIs","w":"Provider prompt caching is the API-side equivalent.","tree":false},{"id":"13.30","s":"e13_multilora","t":"e14_lora","sc":"Need to train the adapters","w":"LoRA fine-tuning produces the adapters you serve.","tree":false},{"id":"13.31","s":"e13_quantformats","t":"e7_quantization","sc":"Confusing weight vs vector quantization","w":"Vector quantization compresses embeddings, not weights.","tree":false},{"id":"13.32","s":"e13_embedserving","t":"e6_embedmodel","sc":"Choosing which encoder to serve","w":"Embedding model choice drives retrieval quality.","tree":false},{"id":"13.33","s":"e13_edge","t":"e12_routing","sc":"On-device model not confident","w":"Cascade to a cloud model on hard inputs.","c":"Network dependency returns for hard cases.","tree":false},{"id":"13.34","s":"e13_loadtest","t":"e11_metrics","sc":"Server is live in production","w":"Production metrics continue what load tests measured.","tree":false},{"id":"13.35","s":"e13_openaicompat","t":"e2_gateway","sc":"Mixing self-hosted and hosted models","w":"A gateway routes across both behind one API.","tree":false},{"id":"13.36","s":"e13_registry","t":"e15_sandbox","sc":"Loading untrusted model code","w":"trust_remote_code and pickles need isolation.","c":"Sandboxing slows iteration.","tree":false},{"id":"14.1","s":"E14","t":"e14_ladder","sc":"Deciding whether to customize at all","w":"The ladder frames every later choice: try cheaper levers before training.","c":"Skipping rungs wastes weeks on training that a prompt would fix.","tree":true},{"id":"14.2","s":"e14_ladder","t":"e14_whenft","sc":"Prompting and RAG plateau","w":"Know what tuning can and can't fix before committing.","c":"Tuned models are harder to update than prompts.","tree":true},{"id":"14.3","s":"e14_whenft","t":"e14_classifier","sc":"Task is narrow labeling or routing","w":"Small encoders beat LLM calls on fixed-label tasks for cost and latency.","c":"Needs labeled data and retraining as labels change.","tree":true},{"id":"14.4","s":"E14","t":"e14_dataset","sc":"Committed to training a model","w":"Data quality drives outcomes more than method or hyperparameters.","c":"Curation is slow, manual work.","tree":true},{"id":"14.5","s":"e14_dataset","t":"e14_chatformat","sc":"Need rows a trainer can read","w":"Chat JSONL plus the right template is the standard input format.","c":"Template mismatch silently degrades quality.","tree":true},{"id":"14.6","s":"e14_dataset","t":"e14_splits","sc":"Need trustworthy eval numbers","w":"Clean held-out splits make before/after comparisons meaningful.","c":"Small test sets are noisy; report confidence intervals.","tree":true},{"id":"14.7","s":"e14_dataset","t":"e14_distill","sc":"Too few real labeled examples","w":"A teacher model can generate and label data at scale.","c":"Inherits teacher errors; filter hard.","tree":true},{"id":"14.8","s":"E14","t":"e14_sft","sc":"Data ready, start training","w":"SFT on demonstrations is the default first training step.","c":"Learns only what demos show, including their mistakes.","tree":true},{"id":"14.9","s":"e14_sft","t":"e14_lora","sc":"Limited GPU memory or many variants","w":"LoRA trains under 1% of parameters with near-full quality.","c":"Slightly lower ceiling than full fine-tuning.","tree":true},{"id":"14.10","s":"e14_lora","t":"e14_qlora","sc":"Only one GPU available","w":"4-bit base cuts memory 3–4x so bigger models fit.","c":"Slower steps and a small quality hit.","tree":true},{"id":"14.11","s":"e14_sft","t":"e14_fullft","sc":"LoRA plateaus and budget allows","w":"Updating all weights gives the highest ceiling.","c":"Needs multi-GPU sharding and risks more forgetting.","tree":true},{"id":"14.12","s":"e14_sft","t":"e14_dpo","sc":"Outputs correct but not preferred","w":"Preference pairs encode 'better' that demos can't.","c":"Needs good pairs; can reward verbosity.","tree":true},{"id":"14.13","s":"e14_dpo","t":"e14_prefdata","sc":"Need chosen/rejected pairs","w":"Preference tuning is only as good as its comparisons.","c":"Human ranking is costly; judges carry bias.","tree":true},{"id":"14.14","s":"e14_dpo","t":"e14_rft","sc":"Correctness is automatically checkable","w":"A verifier replaces preference labels with exact rewards.","c":"Weak graders get reward-hacked.","tree":true},{"id":"14.15","s":"E14","t":"e14_embedft","sc":"Retrieval misses domain terms","w":"Tuning embeddings fixes recall at the retrieval layer itself.","c":"Requires re-embedding the full corpus.","tree":true},{"id":"14.16","s":"e14_embedft","t":"e14_rerankft","sc":"Recall fine, top-k ordering poor","w":"A tuned reranker sharpens precision with no re-index.","c":"Adds per-query latency.","tree":true},{"id":"14.17","s":"E14","t":"e14_tools","sc":"Training open-weight models yourself","w":"Mature stacks remove boilerplate and GPU-efficiency work.","c":"Version churn; pin library versions.","tree":true},{"id":"14.18","s":"e14_tools","t":"e14_trl","sc":"Want code-level control","w":"TRL covers SFT through GRPO with one API family.","c":"More code than config tools.","tree":true},{"id":"14.19","s":"e14_tools","t":"e14_unsloth","sc":"Single GPU and want speed","w":"Custom kernels make small-rig training practical.","c":"Multi-GPU support varies by version.","tree":true},{"id":"14.20","s":"e14_tools","t":"e14_axolotl","sc":"Want reproducible config-driven runs","w":"YAML configs are diffable and reviewable.","c":"Abstractions hide details when debugging.","tree":true},{"id":"14.21","s":"e14_tools","t":"e14_managed","sc":"No GPUs or closed base model","w":"Hosted APIs handle training and serving end-to-end.","c":"Less control, vendor lock-in, data leaves your infra.","tree":true},{"id":"14.22","s":"E14","t":"e14_evalft","sc":"Training finished, is it better?","w":"Fine-tunes must beat the prompted baseline on frozen evals.","c":"Building good evals takes as long as training.","tree":true},{"id":"14.23","s":"e14_evalft","t":"e14_overfit","sc":"Val metrics stall or regress","w":"Loss curves show when to stop.","c":"Val loss can mislead; check task metrics too.","tree":true},{"id":"14.24","s":"e14_evalft","t":"e14_forgetting","sc":"Task gains but general regressions","w":"Narrow tuning can erase general and safety skills.","c":"Broad suites add eval cost.","tree":true},{"id":"14.25","s":"E14","t":"e14_merge","sc":"Tuned model passes evals","w":"Merging and exporting produce a deployable artifact.","c":"Merged weights lose adapter swap flexibility.","tree":true},{"id":"14.26","s":"e14_merge","t":"e14_serveft","sc":"Ready to take production traffic","w":"Serving choices determine cost per tenant or task.","c":"Multi-LoRA adds small latency overhead.","tree":true},{"id":"14.27","s":"E14","t":"e14_cost","sc":"Need budget sign-off","w":"Token-based math gives a quick cost and time estimate.","c":"Iteration count dominates; estimates run low.","tree":true},{"id":"14.28","s":"E14","t":"e14_license","sc":"Choosing a base model or teacher","w":"License terms can block commercial use of the result.","c":"Terms change; recheck on each new base.","tree":true},{"id":"14.29","s":"e14_ladder","t":"e3_fewshot","sc":"Try examples before training","w":"Few-shot prompting often gets most of the gain for free.","c":"Long prompts cost tokens on every call.","tree":false},{"id":"14.30","s":"e14_whenft","t":"e6_ingest","sc":"Gap is missing or fresh knowledge","w":"RAG supplies facts that fine-tuning can't keep current.","tree":false},{"id":"14.31","s":"e14_splits","t":"e10_golden","sc":"Test set doubles as golden set","w":"One frozen set serves both training evals and app evals.","tree":false},{"id":"14.32","s":"e14_prefdata","t":"e11_feedback","sc":"Mine production thumbs and edits","w":"User feedback is a free source of preference signal.","c":"Feedback is sparse and biased toward complaints.","tree":false},{"id":"14.33","s":"e14_rft","t":"e10_judge","sc":"No exact-match grader exists","w":"An LLM judge can act as the reward when rules can't.","c":"Judges are easier to hack than verifiers.","tree":false},{"id":"14.34","s":"e14_embedft","t":"e6_embedmodel","sc":"Compare against stronger base embedders","w":"A newer general embedder may beat a tuned old one.","tree":false},{"id":"14.35","s":"e14_serveft","t":"e13_multilora","sc":"Many adapters on one base","w":"Multi-LoRA serving shares GPU memory across tunes.","tree":false},{"id":"14.36","s":"e14_merge","t":"e13_quantformats","sc":"Need smaller or faster weights","w":"Quantize the merged model for cheaper serving.","c":"Re-run evals; quantization can undo gains.","tree":false},{"id":"14.37","s":"e14_distill","t":"e12_routing","sc":"Student handles easy traffic","w":"Route simple requests to the distilled model, hard ones to the teacher.","c":"Router errors send hard cases to the weak model.","tree":false},{"id":"15.1","s":"E15","t":"e15_owasp","sc":"Starting a threat model","w":"OWASP gives a shared checklist of LLM-specific risks.","c":"A checklist isn't a threat model for your app.","tree":true},{"id":"15.2","s":"e15_owasp","t":"e15_promptleak","sc":"System prompt holds sensitive logic","w":"Prompts leak; move secrets and rules into code.","c":"Some prompt IP exposure is unavoidable.","tree":true},{"id":"15.3","s":"e15_owasp","t":"e15_dow","sc":"Public endpoint with metered costs","w":"Unbounded consumption hits the bill before uptime.","c":"Tight caps can block legitimate heavy users.","tree":true},{"id":"15.4","s":"e15_owasp","t":"e15_supply","sc":"Loading third-party models or packages","w":"Weights and deps execute with your privileges.","c":"Pinning slows adoption of fixes.","tree":true},{"id":"15.5","s":"E15","t":"e15_injection","sc":"App reads text you don't control","w":"Injection is the root LLM-specific vulnerability.","c":"No complete fix exists today.","tree":true},{"id":"15.6","s":"e15_injection","t":"e15_trifecta","sc":"Agent has data, input and egress","w":"The trifecta shows when injection becomes data theft.","c":"Removing a leg limits product features.","tree":true},{"id":"15.7","s":"e15_trifecta","t":"e15_exfil","sc":"Need to cut the outbound leg","w":"Most leaks use a few concrete channels.","c":"Blocking links and images hurts UX.","tree":true},{"id":"15.8","s":"e15_injection","t":"e15_spotlight","sc":"Must mix untrusted text into prompts","w":"Marking data as data lowers attack success cheaply.","c":"Probabilistic; determined attackers bypass it.","tree":true},{"id":"15.9","s":"e15_injection","t":"e15_privsep","sc":"Need guarantees, not probabilities","w":"Architecture keeps untrusted text away from privileged actions.","c":"More complex and less flexible agents.","tree":true},{"id":"15.10","s":"e15_injection","t":"e15_ragpoison","sc":"Indexed sources are writable by others","w":"The knowledge base is an injection vector too.","c":"Provenance tracking adds ingest work.","tree":true},{"id":"15.11","s":"e15_injection","t":"e15_mcppoison","sc":"Using third-party MCP servers","w":"Tool metadata and results reach the model unfiltered.","c":"Vetting every server takes time.","tree":true},{"id":"15.12","s":"E15","t":"e15_leastpriv","sc":"Agent can call tools or APIs","w":"Scope limits the damage of any successful attack.","c":"Fine-grained scopes mean more auth plumbing.","tree":true},{"id":"15.13","s":"e15_leastpriv","t":"e15_confirm","sc":"Action is irreversible or outbound","w":"A human veto stops high-impact mistakes.","c":"Too many prompts cause approval fatigue.","tree":true},{"id":"15.14","s":"e15_leastpriv","t":"e15_multitenant","sc":"Serving multiple customers","w":"Tenant scoping is least privilege at data level.","c":"Partitioned caches lower hit rates.","tree":true},{"id":"15.15","s":"e15_leastpriv","t":"e15_audit","sc":"Need to explain what the agent did","w":"Audit trails make actions accountable and reviewable.","c":"Logs themselves hold sensitive data.","tree":true},{"id":"15.16","s":"E15","t":"e15_sandbox","sc":"Agent writes and runs code","w":"Isolation contains malicious or buggy code.","c":"Strong isolation adds startup latency.","tree":true},{"id":"15.17","s":"E15","t":"e15_outputhandling","sc":"Output feeds browsers, SQL or shells","w":"Downstream systems must not trust model output.","c":"Strict sanitizing can break rich rendering.","tree":true},{"id":"15.18","s":"E15","t":"e15_pii","sc":"Prompts or docs contain personal data","w":"Redaction limits exposure to providers and logs.","c":"Detectors miss some PII and over-redact others.","tree":true},{"id":"15.19","s":"e15_pii","t":"e15_secrets","sc":"Credentials could reach model context","w":"Secrets are high-value data that leaks the same way.","c":"Scanning every trace adds pipeline cost.","tree":true},{"id":"15.20","s":"E15","t":"e15_guardrails","sc":"Need runtime checks around calls","w":"Guardrails catch known-bad inputs and outputs fast.","c":"Add latency and false positives.","tree":true},{"id":"15.21","s":"e15_guardrails","t":"e15_moderation","sc":"Want a quick hosted safety filter","w":"Moderation APIs are cheap and need no hosting.","c":"Fixed taxonomy; data sent to provider.","tree":true},{"id":"15.22","s":"e15_guardrails","t":"e15_llamaguard","sc":"Need self-hosted custom safety policy","w":"Open guard models run in your VPC with custom categories.","c":"You host and tune another model.","tree":true},{"id":"15.23","s":"e15_guardrails","t":"e15_promptguard","sc":"Untrusted content flows into prompts","w":"Dedicated classifiers flag injection attempts.","c":"Misses novel attacks; flags benign security text.","tree":true},{"id":"15.24","s":"e15_guardrails","t":"e15_nemo","sc":"Need declarative dialog and topic rails","w":"Config-driven rails orchestrate many checks.","c":"Each LLM rail adds a model call.","tree":true},{"id":"15.25","s":"e15_guardrails","t":"e15_guardrailsai","sc":"Need reusable output validators","w":"Hub validators add fix/reask behavior quickly.","c":"ML validators add latency.","tree":true},{"id":"15.26","s":"E15","t":"e15_redteam","sc":"Before launch and every model change","w":"Attacking yourself measures real resistance.","c":"Suites go stale as attacks evolve.","tree":true},{"id":"15.27","s":"e15_redteam","t":"e15_redtools","sc":"Manual attacks don't scale","w":"Scanners generate broad attack coverage automatically.","c":"Automated attacks miss creative ones.","tree":true},{"id":"15.28","s":"E15","t":"e15_compliance","sc":"Selling to enterprises or regulated users","w":"Governance turns controls into auditable evidence.","c":"Paperwork competes with engineering time.","tree":true},{"id":"15.29","s":"e15_compliance","t":"e15_euaiact","sc":"Serving users in the EU","w":"Risk tier decides your legal obligations.","c":"Guidance still evolving.","tree":true},{"id":"15.30","s":"e15_compliance","t":"e15_privacy","sc":"Processing personal data via providers","w":"Privacy law governs retention, location and deletion.","c":"ZDR can disable some provider features.","tree":true},{"id":"15.31","s":"e15_compliance","t":"e15_frameworks","sc":"Need a recognized risk framework","w":"NIST and ISO structure the program for auditors.","c":"Certification is costly and slow.","tree":true},{"id":"15.32","s":"e15_compliance","t":"e15_cards","sc":"Need to document limits and risks","w":"Cards communicate scope and safeguards honestly.","c":"Docs rot unless versioned with releases.","tree":true},{"id":"15.33","s":"e15_confirm","t":"e9_hitl","sc":"Implement the approval pause","w":"Agent checkpointing makes pause-and-resume approvals possible.","tree":false},{"id":"15.34","s":"e15_sandbox","t":"e8_codeexec","sc":"Code tool needs an execution backend","w":"The code-exec tool should run inside this sandbox.","tree":false},{"id":"15.35","s":"e15_mcppoison","t":"e8_mcp","sc":"Wiring up MCP servers","w":"Apply vetting and isolation when adding servers.","c":"Locked-down config reduces tool choice.","tree":false},{"id":"15.36","s":"e15_outputhandling","t":"e17_texttosql","sc":"LLM generates SQL to execute","w":"Text-to-SQL is the classic output-handling risk.","c":"Read-only roles limit useful write features.","tree":false},{"id":"15.37","s":"e15_multitenant","t":"e7_filtering","sc":"Enforce tenant filter in retrieval","w":"Metadata filters in vector search apply ACLs pre-generation.","c":"Filtered ANN can lose recall.","tree":false},{"id":"15.38","s":"e15_redteam","t":"e10_ci","sc":"Run attacks on every change","w":"Security evals belong in the same CI gate as quality evals.","c":"Longer CI runs.","tree":false},{"id":"15.39","s":"e15_audit","t":"e11_tracing","sc":"Reuse trace data for audits","w":"Traces already capture prompts and tool calls.","c":"Debug traces need redaction before audit use.","tree":false},{"id":"15.40","s":"e15_guardrails","t":"e2_gateway","sc":"Centralize checks across apps","w":"A gateway applies guardrails uniformly for every team.","c":"Generic checks miss app-specific risks.","tree":false},{"id":"15.41","s":"e15_ragpoison","t":"e6_citations","sc":"Let users verify sources","w":"Citations expose poisoned or off-source answers.","tree":false},{"id":"16.1","s":"E16","t":"e16_vision","sc":"Inputs include images or screenshots","w":"Vision blocks are the base of every multimodal feature.","tree":true,"c":"Images cost far more tokens than their text equivalent"},{"id":"16.2","s":"e16_vision","t":"e16_imagetokens","sc":"Need to forecast image cost","w":"Pixel count drives tokens, cost and latency.","tree":true,"c":"Estimates differ per provider; measure real usage"},{"id":"16.3","s":"e16_imagetokens","t":"e16_detail","sc":"Tokens too high or small text misread","w":"Resolution is the main lever for both cost and accuracy.","tree":true,"c":"Lower detail silently drops fine text"},{"id":"16.4","s":"e16_vision","t":"e16_charts","sc":"Users upload charts or UI screenshots","w":"Charts and UIs have specific failure modes worth knowing.","tree":true,"c":"Exact values from pixels are unreliable"},{"id":"16.5","s":"e16_vision","t":"e16_docai","sc":"Inputs are PDFs or scanned docs","w":"Documents need a deliberate VLM vs OCR choice.","tree":true,"c":"VLM per page is costly at high volume"},{"id":"16.6","s":"e16_docai","t":"e16_layout","sc":"Tables and columns come out scrambled","w":"Layout recovery decides downstream RAG and extraction quality.","tree":true,"c":"Layout tools add latency and another dependency"},{"id":"16.7","s":"e16_vision","t":"e16_imgembed","sc":"Need image search, not image Q&A","w":"Embeddings scale to millions of images cheaply.","tree":true,"c":"Weak on text inside images"},{"id":"16.8","s":"e16_vision","t":"e16_video","sc":"Inputs are recordings or video","w":"Video is frames plus audio; sample wisely.","tree":true,"c":"Sparse sampling misses brief events"},{"id":"16.9","s":"E16","t":"e16_imagegen","sc":"Product must create or edit images","w":"Generation is a separate API family with its own UX and safety needs.","tree":true,"c":"Slow, costly and brand/IP sensitive"},{"id":"16.10","s":"E16","t":"e16_stt","sc":"Users speak or you have audio files","w":"Transcription turns audio into text the LLM can use.","tree":true,"c":"ASR errors propagate into every downstream step"},{"id":"16.11","s":"E16","t":"e16_tts","sc":"Product must talk back","w":"TTS is the output half of any voice experience.","tree":true,"c":"Voices can sound robotic on numbers and names"},{"id":"16.12","s":"E16","t":"e16_voice","sc":"Need live spoken conversation","w":"Combines STT, LLM and TTS under hard timing constraints.","tree":true,"c":"Much harder to test than text chat"},{"id":"16.13","s":"e16_voice","t":"e16_voicelatency","sc":"Conversation feels laggy","w":"Voice-to-voice delay is the top UX metric.","tree":true,"c":"Faster models may be less capable"},{"id":"16.14","s":"e16_voice","t":"e16_vad","sc":"Bot cuts users off or waits too long","w":"Turn detection sets the rhythm of the conversation.","tree":true,"c":"Shorter silence threshold means more cut-offs"},{"id":"16.15","s":"e16_voice","t":"e16_bargein","sc":"Users talk over the bot","w":"Interruptions are normal in speech and must be handled.","tree":true,"c":"Echo and backchannels cause false interrupts"},{"id":"16.16","s":"e16_voice","t":"e16_s2s","sc":"Choosing the voice model stack","w":"Architecture choice fixes latency floor and observability.","tree":true,"c":"S2S is harder to guard and evaluate"},{"id":"16.17","s":"e16_voice","t":"e16_telephony","sc":"Agent must answer phone calls","w":"Phone and browser audio paths need specific plumbing.","tree":true,"c":"8 kHz audio lowers ASR accuracy"},{"id":"16.18","s":"E16","t":"e16_productux","sc":"Shipping AI to real users","w":"UX determines whether model quality turns into user value.","tree":true,"c":"Good UX can't fix a bad model"},{"id":"16.19","s":"e16_productux","t":"e16_streamux","sc":"Answers take several seconds","w":"Streaming is the cheapest perceived-latency win.","tree":true,"c":"Incremental rendering is fiddly for tables/code"},{"id":"16.20","s":"e16_streamux","t":"e16_latencyux","sc":"Tasks take tens of seconds or more","w":"Different waits need different feedback patterns.","tree":true,"c":"Background jobs need notifications and state"},{"id":"16.21","s":"e16_productux","t":"e16_genui","sc":"Text answers are hard to act on","w":"Components turn answers into interactive results.","tree":true,"c":"Component whitelist limits flexibility"},{"id":"16.22","s":"e16_productux","t":"e16_citeux","sc":"Users need to verify answers","w":"Visible sources make verification cheap.","tree":true,"c":"Citation UI clutters short answers"},{"id":"16.23","s":"e16_productux","t":"e16_trustux","sc":"Users over- or under-trust output","w":"Calibrated trust is the core AI UX goal.","tree":true,"c":"Too many caveats make the product feel weak"},{"id":"16.24","s":"e16_trustux","t":"e16_autonomy","sc":"Deciding how much the AI may do alone","w":"Autonomy level is a trust decision per action.","tree":true,"c":"More approvals mean more friction"},{"id":"16.25","s":"e16_trustux","t":"e16_handoff","sc":"AI can't resolve the user's need","w":"A clear human path preserves trust.","tree":true,"c":"Human capacity and cost"},{"id":"16.26","s":"e16_productux","t":"e16_feedbackux","sc":"Need quality signals from production","w":"Feedback controls feed evals and the flywheel.","tree":true,"c":"Explicit feedback is sparse and biased"},{"id":"16.27","s":"e16_productux","t":"e16_emptystate","sc":"Users don't know what to ask","w":"Suggested prompts teach capability fast.","tree":true,"c":"Generic prompts get ignored"},{"id":"16.28","s":"e16_productux","t":"e16_errorux","sc":"Model fails, refuses or times out","w":"Graceful failure keeps users in the flow.","tree":true,"c":"More states to design and test"},{"id":"16.29","s":"e16_productux","t":"e16_agentprogress","sc":"Agent runs take many steps","w":"Visible plans and steps make agents steerable.","tree":true,"c":"Too much detail overwhelms users"},{"id":"16.30","s":"e16_agentprogress","t":"e16_undo","sc":"Agent takes actions with side effects","w":"Reversibility makes mistakes cheap.","tree":true,"c":"Not every action has an inverse"},{"id":"16.31","s":"e16_productux","t":"e16_a11y","sc":"Must serve screen-reader and keyboard users","w":"Streaming and dynamic UIs break assistive tech by default.","tree":true,"c":"Batched announcements lag the visual stream"},{"id":"16.32","s":"e16_productux","t":"e16_uxeval","sc":"Need proof the feature helps users","w":"User testing catches what offline evals miss.","tree":true,"c":"Slow and small-sample"},{"id":"16.33","s":"e16_docai","t":"e4_extraction","sc":"Need typed fields from documents","w":"Extraction schemas turn parsed docs into validated data.","tree":false,"c":"Schema errors on odd layouts"},{"id":"16.34","s":"e16_layout","t":"e6_chunking","sc":"Parsed docs feed a RAG index","w":"Layout-aware chunks keep tables intact.","tree":false,"c":"Structure-aware chunking is more code"},{"id":"16.35","s":"e16_imgembed","t":"e7_vectordbs","sc":"Storing millions of image vectors","w":"Image vectors live in the same ANN indexes.","tree":false,"c":"Separate index per modality/dims"},{"id":"16.36","s":"e16_handoff","t":"e17_support","sc":"Handoff inside a support bot","w":"The support architecture wires handoff into tools and policies.","tree":false,"c":"Handoff queues need staffing"},{"id":"16.37","s":"e16_streamux","t":"e2_streaming","sc":"Implementing the token stream","w":"SSE streaming from the API powers the UI.","tree":false,"c":"Error handling mid-stream is tricky"},{"id":"16.38","s":"e16_feedbackux","t":"e11_feedback","sc":"Storing feedback with traces","w":"Feedback joined to traces enables error analysis.","tree":false,"c":"Needs stable trace ids end to end"},{"id":"16.39","s":"e16_autonomy","t":"e9_hitl","sc":"Implementing approval steps","w":"HITL interrupts implement the copilot levels.","tree":false,"c":"Paused runs need durable state"},{"id":"16.40","s":"e16_citeux","t":"e6_citations","sc":"Backend must produce citations","w":"UI citations need passage-level grounding from RAG.","tree":false,"c":"Citation accuracy needs its own evals"},{"id":"16.41","s":"e16_genui","t":"e17_texttosql","sc":"Rendering query results as charts","w":"Text-to-SQL agents return charts via generative UI.","tree":false,"c":"Chart specs need validation"},{"id":"17.1","s":"E17","t":"e17_docchat","sc":"Users need answers from documents","w":"The canonical RAG product and starting point for most teams.","tree":true,"c":"Quality is bounded by parsing and retrieval"},{"id":"17.2","s":"e17_docchat","t":"e17_entsearch","sc":"Docs span many systems and permissions","w":"Adds connectors and ACL enforcement to docs chat.","tree":true,"c":"Permission sync is the hardest part"},{"id":"17.3","s":"e17_docchat","t":"e17_research","sc":"Questions need many sources and steps","w":"Extends RAG into a multi-step agent.","tree":true,"c":"Minutes of runtime and high token cost"},{"id":"17.4","s":"E17","t":"e17_texttosql","sc":"Users ask questions of structured data","w":"Analytics questions need SQL, not passages.","tree":true,"c":"Wrong SQL looks plausible"},{"id":"17.5","s":"e17_texttosql","t":"e17_schemalink","sc":"Schema too big or columns chosen wrong","w":"Right schema context drives SQL accuracy.","tree":true,"c":"Needs curated table descriptions"},{"id":"17.6","s":"e17_texttosql","t":"e17_sqlguard","sc":"Generated SQL runs on real databases","w":"Guardrails bound the damage of bad SQL.","tree":true,"c":"Strict rules block some valid queries"},{"id":"17.7","s":"e17_texttosql","t":"e17_selfcorrect","sc":"First-draft SQL fails or looks wrong","w":"Execution feedback fixes most errors.","tree":true,"c":"Each retry adds latency and cost"},{"id":"17.8","s":"E17","t":"e17_support","sc":"Automating customer conversations","w":"Combines RAG, tools, policy and handoff.","tree":true,"c":"Wrong actions cost money and trust"},{"id":"17.9","s":"e17_support","t":"e17_voicephone","sc":"Support runs on the phone","w":"Same agent core behind a voice front end.","tree":true,"c":"Strict latency limits tool use"},{"id":"17.10","s":"E17","t":"e17_coding","sc":"Automating software changes","w":"Tests give coding agents a real verifier.","tree":true,"c":"Sandboxing and review are mandatory"},{"id":"17.11","s":"E17","t":"e17_docextract","sc":"Documents must become structured records","w":"Schema extraction plus review gives measurable accuracy.","tree":true,"c":"Long tail of layouts needs review"},{"id":"17.12","s":"E17","t":"e17_classify","sc":"Millions of items need labels or routes","w":"Cheap models and batching make scale affordable.","tree":true,"c":"Small models miss nuance"},{"id":"17.13","s":"e17_classify","t":"e17_moderation","sc":"Labels enforce a content policy","w":"Moderation is classification with tiers and appeals.","tree":true,"c":"False positives anger users"},{"id":"17.14","s":"E17","t":"e17_summarizer","sc":"Recordings need notes and actions","w":"Simple STT + LLM pipeline with high ROI.","tree":true,"c":"Diarization errors misattribute actions"},{"id":"17.15","s":"E17","t":"e17_mcpcopilot","sc":"Employees need AI over internal tools","w":"MCP standardizes tool access across clients.","tree":true,"c":"Broad tool access widens the attack surface"},{"id":"17.16","s":"E17","t":"e17_recs","sc":"Personalizing a large catalog","w":"LLM adds context and reasons on top of classic recsys.","tree":true,"c":"LLM latency on the hot path"},{"id":"17.17","s":"E17","t":"e17_etl","sc":"Messy data needs LLM transforms in bulk","w":"Pipelines bring reproducibility to LLM steps.","tree":true,"c":"Model drift between runs"},{"id":"17.18","s":"E17","t":"e17_evalplatform","sc":"Many teams ship LLM features","w":"Shared eval infra makes quality measurable.","tree":true,"c":"Platform needs an owner"},{"id":"17.19","s":"E17","t":"e17_gateway","sc":"Many apps call many model providers","w":"Central gateway gives control, cost and fallback.","tree":true,"c":"Single point of failure if not HA"},{"id":"17.20","s":"e17_docchat","t":"e6_hybrid","sc":"Retrieval misses exact terms","w":"Hybrid search is the default retriever.","tree":false,"c":"Two indexes to maintain"},{"id":"17.21","s":"e17_docchat","t":"e6_citations","sc":"Answers must be verifiable","w":"Citations make RAG answers checkable.","tree":false,"c":"Citation accuracy needs evals"},{"id":"17.22","s":"e17_docchat","t":"e10_ragmetrics","sc":"Measuring docs chat quality","w":"RAG metrics split retrieval vs generation errors.","tree":false,"c":"Metrics need a labeled set"},{"id":"17.23","s":"e17_entsearch","t":"e7_filtering","sc":"Applying ACLs in vector search","w":"Filtered ANN enforces permissions pre-LLM.","tree":false,"c":"Selective filters hurt recall"},{"id":"17.24","s":"e17_texttosql","t":"e16_genui","sc":"Results should render as charts","w":"Generative UI turns rows into charts.","tree":false,"c":"Chart choice can mislead"},{"id":"17.25","s":"e17_texttosql","t":"e10_golden","sc":"Need text-to-SQL accuracy numbers","w":"Golden question→result pairs gate changes.","tree":false,"c":"Compare results, not SQL strings"},{"id":"17.26","s":"e17_sqlguard","t":"e15_leastpriv","sc":"Deciding the DB role","w":"Least privilege is the real safety boundary.","tree":false,"c":"May need per-user credentials"},{"id":"17.27","s":"e17_selfcorrect","t":"e9_evaluator_optimizer","sc":"Generalizing the repair loop","w":"Same generate-check-revise pattern.","tree":false,"c":"Loops can thrash without caps"},{"id":"17.28","s":"e17_support","t":"e16_trustux","sc":"Customers must know what the bot can do","w":"Clear scope and trust cues reduce escalations.","tree":false,"c":"Too many disclaimers frustrate users"},{"id":"17.29","s":"e17_support","t":"e9_hitl","sc":"Refunds above policy limit","w":"Approval interrupts gate risky tools.","tree":false,"c":"Slower resolution"},{"id":"17.30","s":"e17_coding","t":"e15_sandbox","sc":"Agent runs arbitrary commands","w":"Sandbox contains damage and secrets.","tree":false,"c":"Sandbox setup per repo"},{"id":"17.31","s":"e17_coding","t":"e10_agenteval","sc":"Measuring coding agent success","w":"Agent evals score task completion on real repos.","tree":false,"c":"Expensive eval runs"},{"id":"17.32","s":"e17_docextract","t":"e16_docai","sc":"Choosing how to parse pages","w":"Doc AI decides OCR vs VLM per page.","tree":false,"c":"Mixed pipelines are complex"},{"id":"17.33","s":"e17_docextract","t":"e4_validation","sc":"Extracted JSON must be trusted","w":"Validation catches bad fields before storage.","tree":false,"c":"Rules need domain upkeep"},{"id":"17.34","s":"e17_classify","t":"e2_batchapi","sc":"Work is not latency sensitive","w":"Batch halves cost for offline labeling.","tree":false,"c":"Up to 24 h turnaround"},{"id":"17.35","s":"e17_classify","t":"e14_distill","sc":"Labels exist at large volume","w":"Distill to a small fine-tuned model.","tree":false,"c":"Retrain as labels drift"},{"id":"17.36" "use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const N = D.nodes, SHORT = D.short, LEVEL = D.level;
const OUT = {}, PARENT = {}, INTREE = {}, INOTHER = {}, WALKREF = {};
for (const e of D.edges){
  (OUT[e.s] = OUT[e.s] || []).push(e);
  if (e.tree){ PARENT[e.t] = e.s; INTREE[e.t] = e; }
  else (INOTHER[e.t] = INOTHER[e.t] || []).push(e);
}
const WALKE = {};
for (const [k,n] of Object.entries(N)) if (n.k === "step"){ (WALKREF[n.ref] = WALKREF[n.ref] || []).push(k); (WALKE[n.eid] = WALKE[n.eid] || []).push(k); }

const KIND = {S:"Topic", B:"Basic", I:"Intermediate", A:"Advanced", root:"Start here"};
const CLOUD = {azure:"Technique", aws:"Tool", gcp:"Practice", multi:"Concept"};
const CLC = {azure:"var(--az)", aws:"var(--aws)", gcp:"var(--gcp)", multi:"var(--multi)"};
const EQ = {};
for (const [k,n] of Object.entries(N)) for (const q of (n.eq||[])) if (N[q] && q !== k){ (EQ[k] = EQ[k] || new Set()).add(q); (EQ[q] = EQ[q] || new Set()).add(k); }
const TITLES = D.titles || {};
const KCOL = {S:"var(--entry-bg)", B:"var(--basic)", I:"var(--inter)", A:"var(--adv)", Q:"var(--dec)", root:"var(--entry-bg)",
              guide:"var(--muted)", walk:"var(--walk)", step:"var(--walk)", note:"var(--dec)"};

const $ = s => document.querySelector(s);
const vp = $("#vp"), sizer = $("#sizer"), content = $("#content"), svg = $("#wires");
const SUBT = {}, CARD = {}, ELAB = {}, WIRES = [], LINKCARDS = [];
let scale = 1, mode = "map";
const store = {
  get(){ try { return JSON.parse(localStorage.getItem("ai-eng-map-v1") || "null"); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem("ai-eng-map-v1", JSON.stringify(v)); } catch(e){} }
};

function h(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

/* ---------------- build tree DOM */
function topicTag(p){ return p ? (SHORT[p] || "") : ""; }
function nameOf(k){ return N[k].t; }
function buildCard(k){
  const n = N[k];
  const card = h("div", "card k-" + n.k + (n.cl ? " cl-" + n.cl : "")); card.dataset.key = k;
  const head = h("button", "head"); head.type = "button";
  const tr = h("span", "tagrow");
  tr.append(kindTag(n));
  if (n.p && !n.sec) tr.append(h("span", "sec", topicTag(n.p)));
  head.append(tr);
  head.append(h("span", "title", n.t));
  if (n.f) head.append(h("span", "full", n.f));
  if (n.s) head.append(h("span", "ex", n.s));
  card.append(head);
  const acts = h("div", "acts");
  const outs = OUT[k] || [];
  let kc = null;
  if (outs.length){ kc = h("span", "kc"); kc.setAttribute("aria-hidden", "true"); card.append(kc); }
  const td = h("button", "td", "Details"); td.type = "button"; td.setAttribute("aria-expanded","false");
  td._lbl = "Details";
  td.addEventListener("click", ev => { ev.stopPropagation(); anchored(card, () => setDet(k, !card.classList.contains("dopen"))); });
  acts.append(td);
  card.append(acts);
  head.addEventListener("click", () => {
    if (outs.length) toggleOpen(k, card);
    else anchored(card, () => setDet(k, !card.classList.contains("dopen")));
  });
  card._kc = kc; card._td = td; card._head = head;
  CARD[k] = card;
  return card;
}

function kindTag(n){
  const s = h("span", "kind");
  if (n.sec || n.k === "root"){ s.textContent = n.sec ? "Topic " + n.sec.num : KIND.root; return s; }
  if (n.cl) s.append(h("span", "cbadge", CLOUD[n.cl]));
  s.append(h("span", "lvl lvl-" + n.k, KIND[n.k] || ""));
  return s;
}
function buildLinkCard(e){
  const t = N[e.t];
  const card = h("div", "card link k-" + t.k + (t.cl ? " cl-" + t.cl : "")); card.dataset.target = e.t;
  const head = h("button", "head"); head.type = "button";
  const tr = h("span", "tagrow");
  const kt = kindTag(t); kt.prepend(h("span", null, "Used with ·")); tr.append(kt);
  tr.append(h("span", "sec", topicTag(t.p)));
  head.append(tr);
  head.append(h("span", "title", t.t));
  if (t.s) head.append(h("span", "ex", t.s));
  card.append(head);
  const acts = h("div", "acts");
  const go = h("button", "open", "Go to term"); go.type = "button";
  go.addEventListener("click", ev => { ev.stopPropagation(); jump(e.t, true); });
  head.addEventListener("click", () => jump(e.t, true));
  acts.append(go); card.append(acts);
  LINKCARDS.push(card);
  return card;
}

function buildEdgeLabel(e){
  const lab = h("div", "elabel" + (e.tree ? "" : " dash"));
  const hb = h("button", "ehead"); hb.type = "button"; hb.setAttribute("aria-expanded", "false");
  hb.title = "When to use " + N[e.t].t;
  hb.append(h("span", "enum", e.id), h("span", "etxt", e.sc), h("span", "emark", "?"));
  hb.addEventListener("click", ev => { ev.stopPropagation(); anchored(lab, () => setEdge(e.id, !lab.classList.contains("eopen"))); });
  lab.append(hb);
  ELAB[e.id] = {lab, e, hb};
  return lab;
}
function edgeLink(e, text){ const a = h("a","jump", text); a.href = "#"; a.title = "Open arrow " + e.id;
  a.addEventListener("click", ev => { ev.preventDefault(); ev.stopPropagation(); jumpEdge(e.id); }); return a; }
function edgeDetails(e){
  const d = h("div", "edet");
  d.append(h("h5", null, "Why"), para(e.w));
  if (e.c){ const c = h("div", "catch"); c.append(h("h5", null, "Trade-off"), para(e.c)); d.append(c); }
  return d;
}
function setEdge(id, on){
  const r = ELAB[id]; if (!r) return;
  let d = r.lab.querySelector(".edet");
  if (on && !d){ d = edgeDetails(r.e); r.lab.append(d); }
  if (d) d.hidden = !on;
  r.lab.classList.toggle("eopen", on);
  r.hb.setAttribute("aria-expanded", String(on));
  r.hb.querySelector(".emark").textContent = on ? "×" : "?";
}

function buildSubtree(k){
  const st = h("div", "subtree closed"); st.dataset.key = k; SUBT[k] = st;
  const card = buildCard(k); st.append(card);
  const outs = OUT[k] || [];
  if (outs.length){
    const kids = h("div", "kids");
    for (const e of outs){
      const br = h("div", "branch");
      let lab = null;
      if (e.id){ lab = buildEdgeLabel(e); }
      else if (e.lab){ lab = h("div", "elabel st", e.lab); }
      if (lab) br.append(lab);
      let cc;
      if (e.tree){ const sub = buildSubtree(e.t); br.append(sub); cc = sub.firstChild; }
      else { cc = buildLinkCard(e); br.append(cc); }
      WIRES.push({p: card, l: lab, c: cc, d: !e.tree});
      kids.append(br);
    }
    st.append(kids);
  }
  updTb(k);
  return st;
}

/* ---------------- details */
function para(text, cls){ return h("p", cls || null, text); }
function blk(title, ...nodes){ const b = h("div","blk"); if (title) b.append(h("h4", null, title)); b.append(...nodes); return b; }
function jumpBtn(k, label){ const a = h("a","jump", label || N[k].t); a.href = "#"; a.addEventListener("click", ev => { ev.preventDefault(); ev.stopPropagation(); jump(k, true); }); return a; }
function frag(...parts){ const f = document.createDocumentFragment(); for (const p of parts) f.append(typeof p === "string" ? document.createTextNode(p) : p); return f; }

function buildDetails(k){
  const n = N[k], d = h("div","details");
  if (n.k === "root"){
    d.append(blk(null, para(n.hp)));
    const s = h("div","stats"); for (const [v,l] of n.stats){ const c = h("div"); c.append(h("b",null,String(v)), h("span",null,l)); s.append(c); }
    d.append(blk("Inside", s));
    const L = [["var(--az)","var(--az-bg)","Technique / pattern"],["var(--aws)","var(--aws-bg)","Tool / library / protocol"],
               ["var(--gcp)","var(--gcp-bg)","Practice / metric"],["var(--multi)","var(--card)","Concept"],["var(--entry-bg)","var(--entry-bg)","Topic"],
               ["var(--wire)","transparent","Dashed: a card used together with this one, in another branch"]];
    const b = blk("Colours"); for (const [s2,bg,l] of L){ const r = h("div","lg"); const sw = h("span","sw"); sw.style.setProperty("--s",s2); sw.style.setProperty("--b",bg); if (bg==="transparent") sw.style.borderStyle="dashed"; r.append(sw, h("span",null,l)); b.append(r); }
    d.append(b);
    return d;
  }
  if (n.f) d.append(blk("Also known as", para(n.f, "fullv")));
  if (n.v){ const fig = h("div", "vizwrap"); fig.innerHTML = VIZ.render(n.v); if (fig.firstChild) d.append(blk("Visual", fig)); }
  if (n.hp) d.append(blk("When it helps", para(n.hp)));
  if (n.x) d.append(blk(n.sec ? "Covers" : "Key points", para(n.x)));
  if (n.code) d.append(blk("Example", para(n.code, "code")));
  const eq = [...(EQ[k] || [])].sort((a,b) => ["azure","aws","gcp","multi"].indexOf(N[a].cl) - ["azure","aws","gcp","multi"].indexOf(N[b].cl));
  if (eq.length){ const row = h("div","eqrow");
    for (const q of eq){ const b = h("button","eqbtn cl-" + (N[q].cl||"multi")); b.type = "button"; b.append(h("i"), document.createTextNode(("") + N[q].t));
      b.addEventListener("click", ev => { ev.stopPropagation(); jump(q, true); }); row.append(b); }
    d.append(blk("Alternatives & related", row)); }
  const inc = (INOTHER[k] || []);
  if (inc.length){ const rel = h("div","rel");
    for (const e of inc.slice(0, 12)){ const row = h("div"); row.append(jumpBtn(e.s), document.createTextNode(" · " + e.sc)); rel.append(row); }
    d.append(blk("Also used by", rel)); }
  return d;
}

/* ---------------- state changes */
function updTb(k){
  const c = CARD[k]; if (!c || !c._kc) return;
  const closed = SUBT[k].classList.contains("closed"), n = (OUT[k]||[]).length;
  c._kc.textContent = closed ? String(n) : "−";
  c._head.setAttribute("aria-expanded", String(!closed));
  c._head.title = closed ? "Click to show " + n + (n === 1 ? " branch" : " branches") : "Click to hide the branches";
}
function setOpen(k, open){ const st = SUBT[k]; if (!st || !(OUT[k]||[]).length) return; st.classList.toggle("closed", !open); updTb(k); }
function toggleOpen(k, card){ anchored(card, () => setOpen(k, SUBT[k].classList.contains("closed"))); }
function setDet(k, on){
  const c = CARD[k]; if (!c) return;
  let d = c.querySelector(":scope > .details");
  if (on && !d){ d = buildDetails(k); c.append(d); }
  if (d) d.hidden = !on;
  c.classList.toggle("dopen", on);
  c._td.textContent = on ? "Hide details" : c._td._lbl; c._td.setAttribute("aria-expanded", String(on));
}
function openBelow(k){ setOpen(k, true); for (const e of OUT[k]||[]) if (e.tree) openBelow(e.t); }

/* keep the clicked card still while the layout around it changes */
function anchored(card, fn){
  const r0 = card.getBoundingClientRect();
  fn(); relayout();
  const r1 = card.getBoundingClientRect();
  vp.scrollLeft += r1.left - r0.left; vp.scrollTop += r1.top - r0.top;
  save();
}

/* ---------------- layout & wires */
function relayout(){
  if (mode === "map"){
    const W = content.offsetWidth, H = content.offsetHeight;
    sizer.style.width = Math.ceil(W*scale) + "px"; sizer.style.height = Math.ceil(H*scale) + "px";
    content.style.transform = "scale(" + scale + ")";
    svg.setAttribute("width", W); svg.setAttribute("height", H);
    draw();
  }
}
function box(el){ return {x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight}; }
function curve(x1,y1,x2,y2){ const dx = Math.max(16,(x2-x1)/2); return "M"+x1+","+y1+" C"+(x1+dx)+","+y1+" "+(x2-dx)+","+y2+" "+x2+","+y2; }
function vcurve(x1,y1,x2,y2){ const dy = Math.max(14,(y2-y1)/2); return "M"+x1+","+y1+" C"+x1+","+(y1+dy)+" "+x2+","+(y2-dy)+" "+x2+","+y2; }
function draw(){
  let s = "", d = "", heads = "";
  for (const w of WIRES){
    if (w.c.offsetParent === null) continue;
    const p = box(w.p), c = box(w.c);
    if (layout === "td"){
      const px = p.x + p.w/2, py = p.y + p.h, cx = c.x + c.w/2; let seg;
      if (w.l){ const l = box(w.l), lx = l.x + l.w/2; seg = vcurve(px,py,lx,l.y) + " M" + lx + "," + (l.y+l.h) + " L" + cx + "," + (c.y-2); }
      else seg = vcurve(px,py,cx,c.y-2);
      if (w.d) d += seg + " "; else s += seg + " ";
      heads += '<path class="ah" d="M'+(cx-4.5)+','+(c.y-9)+' L'+cx+','+(c.y-1)+' L'+(cx+4.5)+','+(c.y-9)+' z"/>';
      continue;
    }
    const px = p.x + p.w, py = p.y + p.h/2, cy = c.y + c.h/2;
    let seg;
    if (w.l){ const l = box(w.l); const ly = l.y + l.h/2;
      seg = curve(px,py,l.x,ly) + " M" + (l.x+l.w) + "," + ly + " L" + (c.x-2) + "," + cy; }
    else seg = curve(px,py,c.x-2,cy);
    if (w.d) d += seg + " "; else s += seg + " ";
    heads += '<path class="ah" d="M'+(c.x-9)+','+(cy-4.5)+' L'+(c.x-1)+','+cy+' L'+(c.x-9)+','+(cy+4.5)+' z"/>';
  }
  $("#wsolid").setAttribute("d", s); $("#wdash").setAttribute("d", d); $("#wheads").innerHTML = heads;
}

/* ---------------- zoom & pan */
function setScale(ns, cx, cy){
  ns = Math.max(0.2, Math.min(1.6, ns));
  if (cx == null){ cx = vp.clientWidth/2; cy = vp.clientHeight/2; }
  const X = (vp.scrollLeft + cx)/scale, Y = (vp.scrollTop + cy)/scale;
  scale = ns; relayout();
  vp.scrollLeft = X*scale - cx; vp.scrollTop = Y*scale - cy;
  $("#zv").textContent = Math.round(scale*100) + "%"; save();
}
$("#zin").onclick = () => setScale(scale*1.2);
$("#zout").onclick = () => setScale(scale/1.2);
$("#zfit").onclick = () => { const t = content.querySelector(".subtree"); const W = t.offsetLeft + t.offsetWidth + 40, H = t.offsetTop + t.offsetHeight + 40;
  setScale(Math.min(vp.clientWidth/W, vp.clientHeight/H, 1)); vp.scrollLeft = 0; vp.scrollTop = Math.max(0,(t.offsetTop + t.offsetHeight/2)*scale - vp.clientHeight/2); };
vp.addEventListener("wheel", e => {
  if (mode !== "map" || !(e.ctrlKey || e.metaKey)) return;
  e.preventDefault(); const r = vp.getBoundingClientRect();
  setScale(scale * Math.exp(-e.deltaY * 0.0022), e.clientX - r.left, e.clientY - r.top);
}, {passive:false});
let drag = null;
vp.addEventListener("pointerdown", e => {
  if (mode !== "map" || e.pointerType !== "mouse" || e.button !== 0) return;
  if (e.target.closest(".card,.elabel,button,input,select,a,.legend")) return;
  drag = {x:e.clientX, y:e.clientY, l:vp.scrollLeft, t:vp.scrollTop}; vp.classList.add("drag"); vp.setPointerCapture(e.pointerId);
});
vp.addEventListener("pointermove", e => { if (!drag) return; vp.scrollLeft = drag.l - (e.clientX - drag.x); vp.scrollTop = drag.t - (e.clientY - drag.y); });
const endDrag = () => { drag = null; vp.classList.remove("drag"); };
vp.addEventListener("pointerup", endDrag); vp.addEventListener("pointercancel", endDrag);

/* ---------------- jump / center */
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function center(card){
  if (mode === "map"){
    const b = box(card);
    const vw = vp.clientWidth, vh = vp.clientHeight, cw = b.w*scale, ch = b.h*scale;
    const left = layout === "td" ? (b.x + b.w/2)*scale - vw/2 : b.x*scale - Math.max(24, Math.min((vw - cw)/2, vw*0.38));
    const top = layout === "td" ? b.y*scale - Math.max(24, Math.min((vh - ch)/2, vh*0.3)) : b.y*scale - Math.max(24, (vh - ch)/2);
    vp.scrollTo({left: Math.max(0,left), top: Math.max(0,top), behavior: reduced ? "auto" : "smooth"});
  } else card.scrollIntoView({block:"center", behavior: reduced ? "auto" : "smooth"});
}
function jumpEdge(id){
  const r = ELAB[id]; if (!r) return;
  let a = r.e.s; while (a){ setOpen(a, true); a = PARENT[a]; }
  setEdge(id, true); relayout();
  center(r.lab); r.lab.classList.remove("flash"); void r.lab.offsetWidth; r.lab.classList.add("flash");
  setTimeout(() => r.lab.classList.remove("flash"), 1700); save();
}
function jump(k, details){
  let a = PARENT[k]; while (a){ setOpen(a, true); a = PARENT[a]; }
  if (details) setDet(k, true);
  relayout();
  const c = CARD[k]; center(c);
  c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash");
  setTimeout(() => c.classList.remove("flash"), 1700);
  save();
}

/* ---------------- toolbar */
let layout = "lr";
function applyLayout(l){ layout = l; document.body.classList.toggle("td", l === "td"); const b = $("#layoutbtn"); if (b) b.setAttribute("aria-pressed", String(l === "td")); }
function setLayout(l){ applyLayout(l); relayout(); const r = CARD[D.root]; requestAnimationFrame(() => { center(r); }); save(); }
function setMode(m){
  mode = m; document.body.classList.toggle("outline", m === "outline");
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  if (m === "map") relayout(); else { content.style.transform = ""; }
  save();
}
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { const r = CARD[D.root]; setMode(b.dataset.mode); center(r); });
function setPass(p){ document.body.dataset.pass = p; document.querySelectorAll("[data-pass]").forEach(b => { if (b.tagName === "BUTTON") b.setAttribute("aria-pressed", String(b.dataset.pass === p)); }); save(); }
document.querySelectorAll("button[data-pass]").forEach(b => b.onclick = () => setPass(b.dataset.pass));
function setCloud(c){ document.body.dataset.cloud = c; document.querySelectorAll("button[data-cloud]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cloud === c))); save(); }
document.querySelectorAll("button[data-cloud]").forEach(b => b.onclick = () => setCloud(b.dataset.cloud));
$("#openall").onclick = () => { const r = CARD[D.root]; anchored(r, () => Object.keys(SUBT).forEach(k => setOpen(k, true))); };
$("#closeall").onclick = () => { Object.keys(SUBT).forEach(k => setOpen(k, k === D.root)); relayout(); center(CARD[D.root]); save(); };
$("#alldet").onclick = function(){
  const on = this.getAttribute("aria-pressed") !== "true";
  this.setAttribute("aria-pressed", String(on)); this.textContent = on ? "Close all details" : "Open all details";
  const r = CARD[D.root]; anchored(r, () => { Object.keys(CARD).forEach(k => setDet(k, on)); Object.keys(ELAB).forEach(id => setEdge(id, on)); });
};
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark"; draw(); save();
};
$("#lgx").onclick = () => { $("#legend").hidden = true; save(); };
const secsel = $("#secsel");
Object.keys(TITLES).forEach((p,i) => { const o = h("option", null, (i+1) + ". " + TITLES[p]); o.value = p; secsel.append(o); });
secsel.onchange = () => { const p = secsel.value; if (!p) return; const k = Object.keys(N).find(x => N[x].sec && N[x].sec.pid === p); jump(k, true); secsel.value = ""; };

/* ---------------- search */
const q = $("#q"), res = $("#results");
const IDX = Object.entries(N).filter(([k,n]) => n.k !== "root").map(([k,n]) => ({k, t:(n.t + " " + (n.f||"")).toLowerCase(),
  all:[n.t, n.f, n.s, n.hp, n.x].filter(Boolean).join(" ").toLowerCase()}));
for (const e of D.edges) if (e.id) IDX.push({k: "e:" + e.id, id: e.id, t: (e.id + " " + e.sc).toLowerCase(),
  all: [e.id, e.sc, e.w, e.c, N[e.t].t].filter(Boolean).join(" ").toLowerCase()});
let sel = -1, hits = [];
function runSearch(){
  const terms = q.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  res.innerHTML = ""; sel = -1;
  if (!terms.length){ res.classList.remove("on"); return; }
  hits = IDX.filter(r => terms.every(t => r.all.includes(t))).map(r => {
    let sc = r.id ? -0.5 : 0; for (const t of terms){ if (r.id === t) sc += 20; if (r.t.startsWith(t)) sc += 4; else if (r.t.includes(t)) sc += 3; else sc += 1; }
    return [sc, r.k];
  }).sort((a,b) => b[0]-a[0]).slice(0, 18).map(x => x[1]);
  if (!hits.length){ res.append(h("div","res-empty","Nothing found. Try one word, like cache, queue, vector or gateway.")); }
  hits.forEach((k,i) => {
    const b = h("button","res"); b.type="button"; b.setAttribute("role","option");
    const t = h("span");
    if (k.startsWith("e:")){ const e = ELAB[k.slice(2)].e; b.style.setProperty("--c", "var(--wire)");
      t.append(h("b",null,nameOf(e.t) + " when: " + e.sc), h("small",null,"Arrow " + e.id + " from " + nameOf(e.s))); }
    else { const n = N[k]; b.style.setProperty("--c", n.cl ? CLC[n.cl] : KCOL[n.k]);
      t.append(h("b",null,n.t + (n.f && n.f.length < 40 ? " (" + n.f + ")" : "")), h("small",null,n.sec ? "Topic " + n.sec.num : (n.cl && n.cl !== "multi" ? CLOUD[n.cl] + " · " : "") + (KIND[n.k]||"") + (n.p ? ", " + (TITLES[n.p]||"") : ""))); }
    b.append(h("span","dot"), t);
    b.addEventListener("mousedown", ev => ev.preventDefault());
    b.addEventListener("click", () => pick(i));
    res.append(b);
  });
  res.classList.add("on");
}

q.addEventListener("input", runSearch);

/* ---------------- persistence */
let saveT = null;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(() => store.set({

/* ---------------- init */
const tree = buildSubtree(D.root);

const R = N[D.root];

  setMode(innerWidth < 760 ? "outline" : "map");

$("#zv").textContent = Math.round(scale*100) + "%";

  if (layout === "td"){ vp.scrollLeft = Math.max(0,(b.x + b.w/2)*scale - vp.clientWidth/2); vp.scrollTop = Math.max(0, b.y*scale - 24); }

if (document.fonts) document.fonts.ready.then(relayout);
/* ---------------- Overview: top-to-bottom graph per topic (separate panel; the main map is untouched) */
(function(){
const ov = $("#ov"), ovsel = $("#ovsel"), ovbox = $("#ovbox"), ovzv = $("#ovzv");

const ctx = document.createElement("canvas").getContext("2d");
const FF = getComputedStyle(document.body).fontFamily || "sans-serif";

    node.lab = lines; node.labW = Math.max(...lines.map((l, i) => tw(l, LFS, i === 0))) + 12; node.labH = lines.length * 12.5 + 6; }

      if (key === D.root){ node.kids.push(makeNode(e.t, e, false, null)); continue; }
      const t = N[e.t]; if (e.tree && t.p === top && !t.sec) node.kids.push(makeNode(e.t, e, false, top)); else node.kids.push(makeNode(e.t, e, true, top));

/* compact tidy-tree layout: subtrees are packed level by level (contours); runs of leaf children are staggered in two rows */

  const minX = Math.min(...c.L), shift = 24 - minX; rows.flat().forEach(n => n.cx += shift);

  rows.forEach((row, d) => {
    const labH = Math.max(0, ...row.map(n => n.labH)), rowH = Math.max(...row.map(n => n.h));

    row.forEach(n => { n.y = y + (n.low ? lowOff : 0) + (rowH - n.h) / 2; n.bend = y - 14 - labH - 8; });
    y += rowH + (anyLow ? lowOff : 0);

    n.key === D.root || N[n.key].sec ? ["var(--entry-bg)", "var(--entry-bg)", "var(--entry-ink)", "var(--entry-muted)"] :
    ({ azure: ["var(--az-bg)", "var(--az)"], aws: ["var(--aws-bg)", "var(--aws)"], gcp: ["var(--gcp-bg)", "var(--gcp)"] }[N[n.key].cl] || ["var(--multi-bg)", "var(--multi)"]).concat(["var(--ink)", "var(--muted)"]);

    const by = Math.max(py + 12, Math.min(c.bend, lt)), mid = (py + by) / 2;
    edges += `<path d="M${px.toFixed(1)},${py.toFixed(1)} C${px.toFixed(1)},${mid.toFixed(1)} ${c.cx.toFixed(1)},${mid.toFixed(1)} ${c.cx.toFixed(1)},${by.toFixed(1)} L${c.cx.toFixed(1)},${lt.toFixed(1)}" fill="none" stroke="var(--wire)" stroke-width="1.3"${dash}/>`;
    edges += `<line x1="${c.cx.toFixed(1)}" y1="${(lt + c.labH).toFixed(1)}" x2="${c.cx.toFixed(1)}" y2="${(c.y - 3).toFixed(1)}" stroke="var(--wire)" stroke-width="1.3"${dash}/>`
      + `<polygon points="${c.cx - 4.5},${c.y - 9} ${c.cx + 4.5},${c.y - 9} ${c.cx},${c.y - 1}" fill="var(--wire)"/>`;
    const lx = c.cx - c.labW / 2;
    labels += `<g class="ovlab" data-e="${escX(c.inEdge.id)}"><rect x="${lx.toFixed(1)}" y="${lt.toFixed(1)}" width="${c.labW.toFixed(1)}" height="${c.labH.toFixed(1)}" rx="5" fill="var(--paper)" stroke="var(--line)"/>`;
    c.lab.forEach((ln, i) => { const yy = lt + 15 + i * 12.5;
      if (i === 0){ const sp = ln.indexOf(" "); labels += `<text x="${c.cx.toFixed(1)}" y="${yy.toFixed(1)}" font-size="${LFS}" text-anchor="middle" fill="var(--ink2)"><tspan font-weight="700" fill="var(--ink)">${escX(sp < 0 ? ln : ln.slice(0, sp))}</tspan>${sp < 0 ? "" : " " + escX(ln.slice(sp + 1))}</text>`; }
      else labels += `<text x="${c.cx.toFixed(1)}" y="${yy.toFixed(1)}" font-size="${LFS}" text-anchor="middle" fill="var(--ink2)">${escX(ln)}</text>`; });

    n.title.forEach((t, i) => nodes += `<text x="${n.cx.toFixed(1)}" y="${(n.y + 18 + i * 15).toFixed(1)}" font-size="${TFS}" font-weight="700" text-anchor="middle" fill="${ink}">${escX((n.ghost && i === 0 ? "Go to " : "") + t)}</text>`);
    n.sub.forEach((t, i) => nodes += `<text x="${n.cx.toFixed(1)}" y="${(n.y + 18 + n.title.length * 15 + i * 13 - 1).toFixed(1)}" font-size="${SFS}" text-anchor="middle" fill="${mut}">${escX(t)}</text>`);
    nodes += `</g>`; });

}
function setOvScale(s){ ovScale = Math.max(0.15, Math.min(2, s)); const sv = ovbox.querySelector("svg"); if (sv){ sv.setAttribute("width", (ovDim[0] * ovScale).toFixed(0)); sv.setAttribute("height", (ovDim[1] * ovScale).toFixed(0)); } ovzv.textContent = Math.round(ovScale * 100) + "%"; }
function fitOv(){ const fit = Math.min((ovbox.clientWidth - 20) / ovDim[0], (ovbox.clientHeight - 20) / ovDim[1], 1); setOvScale(fit); ovbox.scrollLeft = 0; ovbox.scrollTop = 0; }
function renderOv(rootKey, focus){
  ovCur = rootKey; ovsel.value = rootKey; const r = svgFor(rootKey); ovbox.innerHTML = r.svg; ovDim = [r.W, r.H];
  const fit = Math.min((ovbox.clientWidth - 20) / r.W, 1); setOvScale(Math.max(fit, 0.55));
  ovbox.scrollTop = 0; ovbox.scrollLeft = Math.max(0, (r.W * ovScale - ovbox.clientWidth) / 2);
  if (focus){ const g = ovbox.querySelector(`.ovnode[data-k="${CSS.escape(focus)}"]:not([data-ghost])`); if (g){ const b = g.getBBox();
      ovbox.scrollLeft = Math.max(0, (b.x + b.width / 2) * ovScale - ovbox.clientWidth / 2); ovbox.scrollTop = Math.max(0, (b.y + b.height / 2) * ovScale - ovbox.clientHeight / 2);
      g.classList.add("ovflash"); setTimeout(() => g.classList.remove("ovflash"), 1800); } }

}
function openOv(){ ov.hidden = false; document.body.classList.add("ovopen"); let last = null; try { last = localStorage.getItem("ov-last"); } catch(e){}
  renderOv(last && N[last] ? last : D.root); $("#ovclose").focus(); }
function closeOv(){ ov.hidden = true; document.body.classList.remove("ovopen"); $("#ovbtn").focus(); }
ovsel.append(h("option", null, "All topics"));
ovsel.lastChild.value = D.root;
Object.keys(TITLES).forEach((p, i) => { const o = h("option", null, (i + 1) + ". " + TITLES[p]); o.value = p; ovsel.append(o); });
ovsel.onchange = () => renderOv(ovsel.value);
$("#ovbtn").onclick = openOv; $("#ovclose").onclick = closeOv;
$("#ovzin").onclick = () => setOvScale(ovScale * 1.2); $("#ovzout").onclick = () => setOvScale(ovScale / 1.2); $("#ovfit").onclick = fitOv;

ovbox.addEventListener("click", e => {
  const g = e.target.closest(".ovnode"); if (!g) return; const k = g.dataset.k;
  if (g.dataset.ghost){ const t = N[k]; renderOv(t.sec ? k : t.p, k); return; }

});
let od = null;
ovbox.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse" || e.button !== 0 || e.target.closest(".ovnode")) return; od = { x: e.clientX, y: e.clientY, l: ovbox.scrollLeft, t: ovbox.scrollTop }; ovbox.classList.add("drag"); ovbox.setPointerCapture(e.pointerId); });

/* Save as PDF: every topic's overview, one per page, through the browser's print dialog */
function buildPrint(){ let pr = document.getElementById("printroot"); if (pr) pr.remove(); pr = h("div"); pr.id = "printroot";
