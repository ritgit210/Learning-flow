_spantypes":{"k":"B","p":"E11","cl":"multi","t":"Span types: LLM, tool, retrieval","s":"Typed spans distinguish generation calls, tool executions, retriever and embedding calls, guardrail checks and agent steps so each gets the right fields and UI.","hp":"Helps you filter traces to the failing step type, e.g. all retrievals returning zero docs.","x":"LLM span: model, messages, usage, finish_reason. Retrieval span: query, top-k doc ids and scores. Tool span: name, args, result, error. Agent span: parent of the loop. Keep large payloads truncated or stored by reference.","v":"tree:Trace>Agent,Guardrail;Agent>LLM,Tool,Retriever;Retriever>Embedding","eq":["e11_otel"]},"e11_otel":{"k":"I","p":"E11","cl":"aws","t":"OpenTelemetry GenAI conventions","s":"OpenTelemetry semantic conventions for GenAI define standard span names and gen_ai.* attributes; OpenLLMetry auto-instruments LLM SDKs and frameworks to emit them.","hp":"Helps you avoid vendor lock-in: instrument once, send traces to any OTel-compatible backend.","x":"Key attributes: gen_ai.operation.name, gen_ai.request.model, gen_ai.usage.input_tokens / output_tokens, gen_ai.response.finish_reasons. Spec is still evolving (development status), so pin instrumentation versions. Content capture is opt-in.","v":"arch:OTel pipeline:App SDK,Agent framework>OTel instrumentation>OTel Collector>Langfuse,Phoenix,Datadog","f":"OTel gen_ai.* semconv, OpenLLMetry","code":"from traceloop.sdk import Traceloop\nTraceloop.init(app_name=\"support-bot\")  # OpenLLMetry auto-instruments OpenAI, Anthropic, LangChain...\n\n# manual span with GenAI attributes\nwith tracer.start_as_current_span(\"chat gpt-4o\") as span:\n    span.set_attribute(\"gen_ai.request.model\", \"gpt-4o\")\n    span.set_attribute(\"gen_ai.usage.input_tokens\", usage.prompt_tokens)","eq":["e11_tracing","e11_phoenix"]},"e11_safelogging":{"k":"I","p":"E11","cl":"gcp","t":"Logging prompts safely: PII & retention","s":"Prompts and completions often contain personal or secret data, so trace logging needs redaction, access control and retention limits like any production data store.","hp":"Helps you keep full-fidelity debugging without creating a GDPR or secrets-leak liability.","x":"Redact PII and secrets before export (regex + NER, e.g. Presidio); hash user ids; set retention (e.g. 30–90 days raw, longer for sampled, consented datasets); restrict who can read raw content; honor deletion requests across trace stores.","v":"flow:Raw span>Redact PII>Hash user id>Sample>Store with TTL>Role-gated view","code":"from presidio_analyzer import AnalyzerEngine\nfrom presidio_anonymizer import AnonymizerEngine\nan, anon = AnalyzerEngine(), AnonymizerEngine()\ndef redact(text):\n    res = an.analyze(text=text, language=\"en\")\n    return anon.anonymize(text=text, analyzer_results=res).text\nspan.set_attribute(\"input\", redact(prompt))","eq":["e15_pii"]},"e11_tools":{"k":"B","p":"E11","cl":"aws","t":"LLM observability platforms","s":"Purpose-built tools that store LLM traces and add prompt management, datasets, evals, annotation and cost views on top.","hp":"Helps you pick a platform by deployment model and workflow instead of building trace UIs yourself.","x":"Main choices: Langfuse (OSS, self-hostable), LangSmith (LangChain ecosystem), Arize Phoenix (OSS, OTel-native), Helicone (proxy), Braintrust (eval-centric), W&B Weave. Most accept OTel spans now; compare self-hosting, pricing per span and eval UX.","v":"cmp:#OSS self-host;Strength;Ingest|Langfuse=yes;prompts + evals;SDK or OTel|LangSmith=enterprise;LangGraph debug;SDK or OTel|Phoenix=yes;OTel-native evals;OTel|Helicone=yes;zero-code proxy;Proxy|Braintrust=hybrid;eval workflow;SDK or proxy","eq":["e11_langfuse","e11_langsmith","e11_phoenix"]},"e11_langfuse":{"k":"I","p":"E11","cl":"aws","t":"Langfuse","s":"Open-source LLM engineering platform for tracing, prompt management, datasets, evals and scores, available as cloud or self-hosted.","hp":"Helps you get tracing plus versioned prompts and feedback scores in one self-hostable stack.","x":"Decorate functions with @observe for nested spans; integrations for OpenAI, LangChain, LlamaIndex and OTel. Self-host needs Postgres, ClickHouse, Redis and blob storage. Attach scores (user feedback, eval results) to traces for filtering.","v":"arch:Langfuse:App>SDK or OTel>Traces,Prompts,Datasets,Scores>UI","code":"from langfuse import observe, get_client\n\n@observe()\ndef answer(q):\n    docs = retrieve(q)          # nested @observe span\n    return llm(q, docs)\n\nlf = get_client()\nlf.create_score(trace_id=tid, name=\"thumbs\", value=1)","eq":["e11_langsmith","e11_phoenix"]},"e11_langsmith":{"k":"I","p":"E11","cl":"aws","t":"LangSmith","s":"LangChain's hosted observability and eval platform with deep tracing of LangChain and LangGraph runs, datasets, experiments and annotation queues.","hp":"Helps you debug LangGraph agents step by step with zero extra instrumentation.","x":"Enable with env vars (LANGSMITH_TRACING=true, LANGSMITH_API_KEY); @traceable wraps non-LangChain code. Self-hosting is an enterprise option. Strong for comparing experiments side by side on a dataset.","v":"seq:App,LangSmith SDK,LangSmith|1>2:@traceable run|2>3:batched spans|3>3:run tree|1>3:add feedback","code":"import os\nos.environ[\"LANGSMITH_TRACING\"] = \"true\"\nfrom langsmith import traceable\n\n@traceable(run_type=\"retriever\")\ndef search(q: str):\n    return vector_db.query(q, k=5)","eq":["e11_langfuse"]},"e11_phoenix":{"k":"I","p":"E11","cl":"aws","t":"Arize Phoenix","s":"Open-source, OpenTelemetry-native tracing and evaluation tool from Arize, runnable locally in a notebook or as a server.","hp":"Helps you inspect traces and run LLM evals locally during development without a SaaS account.","x":"Uses OpenInference instrumentors over OTel; register() sets up the tracer provider. Includes built-in eval templates (hallucination, relevance) and embedding-cluster views for spotting problem topics.","v":"flow:Instrumentor>OTel exporter>Phoenix server>Trace UI>Evals","code":"from phoenix.otel import register\ntracer_provider = register(project_name=\"rag-app\", auto_instrument=True)\n# OpenInference instrumentors now trace OpenAI / LangChain calls","eq":["e11_otel","e11_langfuse"]},"e11_proxylogging":{"k":"I","p":"E11","cl":"azure","t":"Proxy-based logging (Helicone)","s":"Route LLM API calls through a logging proxy or gateway by changing the base URL, capturing requests, costs and latency without SDK instrumentation.","hp":"Helps you get cost and latency visibility across many services in minutes.","x":"Pros: zero code, central caching and rate limits. Cons: sees only LLM calls, not your retrieval or tool spans, and adds a network hop (typically tens of ms). Pair with SDK tracing for agent internals.","v":"arch:Proxy logging:App>Helicone proxy>OpenAI,Anthropic>Logs DB","code":"from openai import OpenAI\nclient = OpenAI(\n    base_url=\"https://oai.helicone.ai/v1\",\n    default_headers={\"Helicone-Auth\": f\"Bearer {HELICONE_KEY}\",\n                     \"Helicone-User-Id\": user_id},\n)","eq":["e2_gateway"]},"e11_metrics":{"k":"B","p":"E11","cl":"gcp","t":"Core LLM production metrics","s":"The small set of numbers to track for every LLM feature: speed, reliability, quality proxies and cost.","hp":"Helps you notice regressions before users complain and compare models on real traffic.","x":"Track TTFT, output tokens/s, end-to-end p50/p95/p99, error and timeout rate, refusal rate, finish_reason=length rate, tool-call success, cost per request and per active user. Slice by model, prompt version and tenant.","v":"hub:LLM metrics|TTFT,Tokens per sec,p50 p95,Error rate,Refusal rate,Cost per req,Tool success,Truncation","eq":["e12_latency","e12_costmodel"]},"e11_costtracking":{"k":"B","p":"E11","cl":"gcp","t":"Cost per request & per user","s":"Compute cost from token usage and price tables on every LLM span, then aggregate by request, user, tenant and feature.","hp":"Helps you find the 5% of users or prompts that drive 50% of spend.","x":"Count cached-input, input, output and reasoning tokens separately; prices differ. Keep a versioned price table. Watch heavy tails: agents with retries or long contexts often cost 10–100x the median request.","v":"bars:p50 request=1,p90 request=4,p99 request=25,Top user per day=60","eq":["e12_costmodel"]},"e11_toolsuccess":{"k":"I","p":"E11","cl":"gcp","t":"Tool-call success rate","s":"Share of agent tool calls that are valid (schema-correct), succeed at execution and are actually used in the final answer.","hp":"Helps you spot broken tool schemas or flaky APIs that silently degrade agent quality.","x":"Track per tool: invalid-args rate, execution error rate, retries per call, and calls per task. A spike in calls per task usually means the agent is looping. Alert on new tools below e.g. 95% success.","v":"gbars:search,sql,email|Valid args=98,91,99|Executed OK=95,82,97","eq":["e10_agenteval"]},"e11_dashboards":{"k":"B","p":"E11","cl":"gcp","t":"Dashboards & alerts for LLM apps","s":"Operational dashboards and alerts on latency, errors, cost and quality scores, sliced by model and prompt version.","hp":"Helps you catch cost spikes, provider outages and quality drops within minutes, not at month end.","x":"Alert on: hourly spend vs baseline (e.g. 2x), p95 latency, 429/5xx rate, refusal or empty-answer rate, online eval score drop, thumbs-down rate. Annotate dashboards with deploys and prompt changes.","v":"line:Mon,Tue,Wed,Thu,Fri,Sat|Daily cost USD=120,118,125,410,130,122|Alert line=250,250,250,250,250,250","eq":["e11_metrics"]},"e11_slo":{"k":"A","p":"E11","cl":"gcp","t":"SLOs for AI features","s":"Service-level objectives that cover not only availability and latency but also answer quality, measured with online evals or feedback.","hp":"Helps you agree with product on what good enough means and when to stop shipping and fix.","x":"Example: 99.5% non-error responses, p95 TTFT < 1.5 s, online groundedness >= 0.9 on sampled traffic, thumbs-down < 5%. Use error budgets; burn on quality as well as uptime.","v":"table:SLI,Target,Window|Success rate,99.5%,30 days|p95 TTFT,1.5 s,7 days|Groundedness,0.90,7 days|Thumbs down,below 5%,7 days"},"e11_drift":{"k":"A","p":"E11","cl":"multi","t":"Drift: inputs, topics & providers","s":"Production behavior changes over time because user inputs shift, new topics appear, or a provider silently updates a model behind the same name.","hp":"Helps you explain quality drops that no code change caused.","x":"Monitor embedding-cluster shares of incoming queries, language mix, input length and unknown-intent rate. Pin dated model snapshots where offered; run a daily canary eval on a fixed set to detect provider-side changes.","v":"line:W1,W2,W3,W4,W5,W6|Known topics pct=92,91,90,84,79,76|Daily canary eval=88,88,87,88,81,81","eq":["e11_analytics","e1_nondeterminism"]},"e11_incident":{"k":"A","p":"E11","cl":"gcp","t":"Incident response for AI features","s":"Runbooks for AI-specific incidents: provider outages, quality regressions, harmful outputs, prompt-injection abuse and runaway cost.","hp":"Helps you respond in minutes with kill switches instead of hot-patching prompts under pressure.","x":"Prepare: feature flag to disable or fall back, fallback model or provider, prompt rollback, per-tenant cost caps, a way to purge cached bad answers. Postmortem should add the failing traces to the eval set.","v":"flow:Alert>Triage traces>Mitigate flag>Rollback or fallback>Add evals>Postmortem","eq":["e15_guardrails"]},"e11_feedback":{"k":"B","p":"E11","cl":"azure","t":"User feedback capture","s":"Collect explicit feedback (thumbs, ratings, comments) and attach it to the exact trace and prompt version that produced the answer.","hp":"Helps you find real failures cheaply and build labeled data from production.","x":"Expect low explicit response rates (often 1–5% of interactions) and a negativity bias. Always store trace_id with feedback; offer a reason picker on thumbs-down. Treat it as a signal to triage, not a quality metric on its own.","v":"seq:User,App,Tracer|2>1:answer + trace id|1>2:thumbs down|2>3:score on trace|3>3:queue for review","code":"# frontend sends {trace_id, value, reason}\n@app.post(\"/feedback\")\ndef feedback(fb: Feedback):\n    langfuse.create_score(trace_id=fb.trace_id, name=\"user_thumbs\",\n                          value=fb.value, comment=fb.reason)","eq":["e11_implicit"]},"e11_implicit":{"k":"I","p":"E11","cl":"azure","t":"Implicit feedback signals","s":"Behavioral signals like copy, retry, regenerate, edit distance of accepted drafts, abandonment and follow-up rephrasing that reveal answer quality without asking.","hp":"Helps you measure quality on 100% of traffic instead of the few who click thumbs.","x":"Strong negatives: immediate regenerate, rephrased same question, conversation abandoned after answer. Positives: copy, accept, low edit distance. Calibrate each signal against human labels before trusting it.","v":"fanin:Copy,Regenerate,Rephrase,Edit distance,Abandon|Quality signal","eq":["e11_feedback"]},"e11_annotation":{"k":"I","p":"E11","cl":"gcp","t":"Annotation queues","s":"Work queues where domain experts review sampled or flagged traces, label failure modes and write corrected outputs.","hp":"Helps you turn raw traces into labeled failure categories and gold answers.","x":"Feed queues from thumbs-down, low online eval scores, guardrail hits and a random sample (e.g. 1%). Use a fixed rubric and short failure taxonomy; track inter-annotator agreement. 50–100 reviewed traces often reveal the top failure modes.","v":"flow:Flagged traces>Queue>Expert review>Label + fix>Dataset","eq":["e10_erroranalysis"]},"e11_analytics":{"k":"A","p":"E11","cl":"azure","t":"Conversation analytics & clustering","s":"Embed and cluster user queries and sessions to see what users actually ask, where answers fail and which topics are growing; session replay shows full conversations.","hp":"Helps you prioritize fixes by traffic share times failure rate.","x":"Pipeline: embed first user turn, cluster (e.g. HDBSCAN or k-means), have an LLM name clusters, join with feedback and eval scores. Re-run weekly; new clusters are unseen use cases to add to evals.","v":"quad:Traffic share,Failure rate|Billing=8,3;Refunds=6,8;Login=3,2;API errors=2,9;Pricing=7,5","eq":["e11_drift"]},"e11_flywheel":{"k":"B","p":"E11","cl":"gcp","t":"Data flywheel","s":"Continuous loop where production traces and feedback become curated datasets that drive evals, prompt fixes and fine-tunes, which then ship and produce new traces.","hp":"Helps you compound improvements from real usage instead of guessing what to fix.","x":"Make each step cheap: one-click add trace to dataset, auto-run evals on new prompt versions, track which dataset version each model or prompt was tuned on. Respect consent and PII rules for reuse.","v":"draw:flywheel","eq":["e10_edd","e14_dataset"]},"e11_tracetodataset":{"k":"I","p":"E11","cl":"azure","t":"Promoting traces to eval datasets","s":"Select interesting production traces, clean and label them, and add them as versioned eval or fine-tuning examples.","hp":"Helps you build an eval set that reflects real users, edge cases and past incidents.","x":"Prefer diverse, hard and failed cases over random ones; dedupe by embedding similarity; store expected output or rubric. Version datasets and never train on your held-out eval split.","v":"flow:Prod traces>Filter + sample>Dedupe>Label>Versioned dataset","code":"ds = langfuse.create_dataset(name=\"support-hard-v3\")\nfor t in flagged_traces:\n    langfuse.create_dataset_item(dataset_name=\"support-hard-v3\",\n        input=t.input, expected_output=t.corrected_output,\n        source_trace_id=t.id)","eq":["e10_golden"]},"e11_experiments":{"k":"I","p":"E11","cl":"gcp","t":"Experiment tracking for LLM apps","s":"Record every prompt, model and config variant with its eval scores, cost and latency on a fixed dataset version so results are comparable.","hp":"Helps you answer which change made it better and reproduce the winning config.","x":"Log: git sha, prompt version, model snapshot, temperature, retrieval params, dataset version, scores, cost. Compare side by side per example, not just averages. Most observability platforms and MLflow support this.","v":"table:Variant,Accuracy,Cost per 1k,p95|Baseline,0.81,4.10,3.2 s|New prompt,0.86,4.30,3.4 s|Small model,0.79,0.90,1.6 s","eq":["e10_ci"]},"e11_promptmgmt":{"k":"B","p":"E11","cl":"gcp","t":"Prompt & config management","s":"Store prompts, model names and parameters as versioned config outside the code, fetched at runtime with labels like production and staging.","hp":"Helps you ship and roll back prompt changes without a redeploy and link traces to prompt versions.","x":"Cache fetched prompts locally with a fallback copy in code. Tag each trace with prompt name and version. Require evals to pass before moving the production label. Treat model id and temperature as part of the prompt version.","v":"flow:Edit prompt>New version>Run evals>Label staging>Label production","code":"prompt = langfuse.get_prompt(\"answer-question\", label=\"production\",\n                             cache_ttl_seconds=60)\nmsgs = prompt.compile(context=docs, question=q)\nresp = client.chat.completions.create(model=prompt.config[\"model\"],\n                                      messages=msgs)","eq":["e3_versioning"]},"e11_flags":{"k":"I","p":"E11","cl":"azure","t":"Feature flags for prompts & models","s":"Use a feature-flag system to choose prompt version, model or pipeline per user, tenant or percentage, with instant kill switches.","hp":"Helps you run A/B tests and roll back an AI change in seconds.","x":"Assign variants by stable hash of user id so sessions stay consistent. Log the variant on every trace. Keep a kill switch per AI feature that falls back to a safe path (smaller model, canned answer or human).","v":"fan:Flag service|Prompt v12 90%,Prompt v13 10%,Kill switch,Fallback model","code":"variant = flags.get_variant(\"answer-prompt\", user_id)  # e.g. LaunchDarkly / Unleash\nprompt = prompts[variant]\nspan.set_attribute(\"prompt.variant\", variant)","eq":["e11_promptmgmt"]},"e11_canary":{"k":"A","p":"E11","cl":"azure","t":"Canary & shadow deploys for LLMs","s":"Shadow mode runs a new prompt or model on copies of live traffic without showing results; canary serves it to a small slice and expands if metrics hold.","hp":"Helps you validate changes on real inputs with bounded blast radius.","x":"Shadow: compare outputs with an LLM judge or diff metrics; costs extra tokens, watch side effects (no tool writes). Canary: 1% then 10% then 50% then 100%, gating on error rate, latency, cost and online eval scores.","v":"draw:canary","eq":["e11_flags"]},"e11_modelupgrade":{"k":"A","p":"E11","cl":"gcp","t":"Model upgrade playbook","s":"A repeatable process for moving to a new model or snapshot: pin versions, run offline evals, shadow, canary, then roll out with rollback ready.","hp":"Helps you adopt better or cheaper models fast without surprise regressions.","x":"Pin dated snapshots, never floating aliases, in prod. Expect prompt retuning: new models change verbosity, tool-call style and refusals. Compare quality, cost, latency on the same dataset. Plan for provider deprecation dates.","v":"ladder:Pin current,Offline evals,Retune prompts,Shadow,Canary,Full rollout|keep rollback until stable","eq":["e1_modelselect","e10_ci"]},"e11_maturity":{"k":"B","p":"E11","cl":"multi","t":"LLMOps maturity levels","s":"A staged view of how teams operate LLM features, from ad-hoc prompts to automated eval-gated releases and data flywheels.","hp":"Helps you decide the next most valuable ops investment for your team.","x":"L0 prompts in code, no logs. L1 tracing and cost dashboards. L2 versioned prompts and offline evals. L3 eval-gated CI, canaries, feedback loops. L4 continuous flywheel with online evals and automated dataset curation.","v":"ladder:Ad hoc,Tracing,Versioned + evals,Gated releases,Flywheel|each level needs the one before"},"E12":{"k":"S","p":"E12","t":"Performance, Latency & Cost","s":"Where LLM latency and spend come from and the concrete levers to cut them: caching, routing, batching, token reduction and capacity planning.","hp":"Latency and unit cost decide whether an LLM feature is usable and profitable at scale.","x":"latency anatomy, output length, streaming, parallel calls, prompt caching, semantic & exact caches, routing & cascades, reasoning effort, token reduction, batch APIs, cost model, unit economics, budgets, capacity","v":"fanin:Caching,Routing,Fewer tokens,Batching,Parallelism|Faster + cheaper","sec":{"pid":"E12","num":12,"title":"Performance, Latency & Cost","short":"Perf & cost"}},"e12_latency":{"k":"B","p":"E12","cl":"multi","t":"Latency anatomy of an LLM call","s":"End-to-end latency = network + queueing + prefill (time to first token) + decode (output tokens divided by tokens/s) + any tool or retrieval steps.","hp":"Helps you attack the phase that actually dominates instead of tuning the wrong thing.","x":"Typical hosted: TTFT 0.2–2 s (grows with input length and reasoning), decode 30–200 tokens/s. A 500-token answer at 60 tok/s is ~8 s of decode alone. Measure TTFT and tokens/s separately, at p50 and p95.","v":"draw:ttft","f":"TTFT + decode","eq":["e11_metrics","e2_streaming"]},"e12_outputlen":{"k":"B","p":"E12","cl":"multi","t":"Output length dominates latency","s":"Decode is sequential, so latency scales roughly linearly with output tokens, while extra input tokens are processed in parallel and cost far less time.","hp":"Helps you get the biggest latency win by asking for shorter outputs.","x":"Rule of thumb: 1 output token costs about as much time as 50–200 input tokens (varies by model). Cutting output from 800 to 200 tokens often saves more than switching models. Reasoning tokens count as output.","v":"line:100,200,400,800,1600|Latency s (out tok)=1.9,3.5,6.8,13.5,27|Latency s (in tok x10)=0.6,0.7,0.8,1.0,1.4","eq":["e12_maxtokens"]},"e12_streaming":{"k":"B","p":"E12","cl":"azure","t":"Streaming for perceived latency","s":"Stream tokens to the UI as they are generated so users start reading at TTFT instead of waiting for the full response.","hp":"Helps you make a 10 s answer feel like 1 s without changing the model.","x":"Use SSE end to end; disable proxy buffering (e.g. nginx proxy_buffering off). Stream status events for tool steps. Structured output still needs a final validation, so stream partial JSON carefully.","v":"cmp:#Blocking;Streaming|First visible=10 s;0.8 s|Total time=10 s;10 s|Feels=stuck;responsive","code":"with client.messages.stream(model=MODEL, max_tokens=1024,\n                            messages=msgs) as stream:\n    for text in stream.text_stream:\n        yield f\"data: {json.dumps(text)}\\n\\n\"","eq":["e2_streaming","e16_streamux"]},"e12_parallel":{"k":"I","p":"E12","cl":"azure","t":"Parallelizing independent calls","s":"Run independent LLM, retrieval and tool calls concurrently instead of sequentially, so wall time equals the slowest call, not the sum.","hp":"Helps you cut multi-call pipeline latency by 2–5x with no quality change.","x":"Map the dependency graph; fan out classification, retrieval and guardrail checks in parallel. Bound concurrency with a semaphore to respect rate limits. Speculatively start likely-next steps and cancel if unused.","v":"bars:Guardrail s=0.4,Retrieve s=0.6,Classify s=0.8,Sequential total=1.8,Parallel total=0.8","code":"import asyncio\nsem = asyncio.Semaphore(8)\nasync def call(p):\n    async with sem:\n        return await aclient.messages.create(model=M, max_tokens=300, messages=p)\nresults = await asyncio.gather(*(call(p) for p in prompts))","eq":["e8_parallel"]},"e12_agentbudget":{"k":"A","p":"E12","cl":"gcp","t":"Latency budgets for multi-step agents","s":"Allocate an end-to-end latency target across agent steps (planning, tool calls, LLM turns) and enforce per-step timeouts and step caps.","hp":"Helps you keep agents interactive instead of drifting to 60 s+ runs.","x":"Example: 8 s budget = 1 s plan + 2 x 2 s tool turns + 3 s final answer. Cap iterations (e.g. 6–10), use small models for routing steps, stream progress, and return a partial answer when the budget runs out.","v":"ctx:Plan=12,Tool turn 1=25,Tool turn 2=25,Final answer=38|8 s","eq":["e9_loop"]},"e12_regional":{"k":"I","p":"E12","cl":"multi","t":"Regional endpoints & data residency","s":"Calling a model in a distant region adds round-trip latency, and residency rules may force a region where capacity or model choice is limited.","hp":"Helps you choose regions that satisfy compliance without adding avoidable latency.","x":"Cross-continent RTT adds ~100–250 ms per call, multiplied by agent steps. Cross-region inference profiles raise capacity but may move data. Co-locate app, vector DB and model endpoint in one region.","v":"bars:Same region ms=20,Same continent ms=60,Cross ocean ms=180,Cross ocean x8 steps=1440"},"e12_caching":{"k":"B","p":"E12","cl":"multi","t":"Caching layers for LLM apps","s":"LLM apps can cache at several levels: exact responses, semantically similar responses, provider-side prompt prefixes, and embeddings or retrievals.","hp":"Helps you pick the cache that matches your traffic instead of only reaching for one.","x":"Order to try: provider prompt caching (safe, no staleness), embedding and retrieval caches, exact-match response cache, then semantic cache (highest risk of wrong answers). Track hit rate per layer.","v":"tiers:Exact match,Semantic,Prompt prefix,Embeddings|cheapest hits first|still pays some compute"},"e12_promptcaching":{"k":"I","p":"E12","cl":"azure","t":"Prompt caching (prefix caching)","s":"Providers cache the processed KV state of a repeated prompt prefix so later calls with the same prefix pay a fraction of input price and get lower TTFT.","hp":"Helps you cut input cost up to ~90% and TTFT notably on long shared system prompts or documents.","x":"Anthropic: explicit cache_control, writes cost ~1.25x input, reads ~0.1x, 5 min TTL (1 h option). OpenAI and Gemini: automatic for prefixes above ~1K tokens. Any byte change before the breakpoint is a miss.","v":"ctx:Tools cached=8,System cached=20,Docs cached=50,History=17,New turn=5|cached prefix","f":"KV prefix cache","code":"resp = client.messages.create(\n    model=MODEL, max_tokens=1024,\n    system=[{\"type\": \"text\", \"text\": LONG_SYSTEM_PROMPT,\n             \"cache_control\": {\"type\": \"ephemeral\"}}],\n    messages=msgs)\nprint(resp.usage.cache_read_input_tokens, resp.usage.cache_creation_input_tokens)","eq":["e5_cachefriendly","e13_vllm"]},"e12_cachebreakpoints":{"k":"A","p":"E12","cl":"azure","t":"Cache breakpoints, TTL & hit rate","s":"Order prompt content from most static to most dynamic and place cache breakpoints at stable boundaries so as many requests as possible reuse the prefix.","hp":"Helps you raise cache hit rate from near zero to 70–90% on chat and agent workloads.","x":"Static first: tools, system, few-shots, docs; then history; then the new turn. No timestamps or request ids early in the prompt. Writes cost extra, so caching only pays when a prefix is reused within the TTL; monitor cached token share.","v":"flow:Tools>System>Examples>Docs>History>New turn","eq":["e5_cachefriendly"]},"e12_exactcache":{"k":"B","p":"E12","cl":"azure","t":"Exact-match response cache","s":"Cache complete responses keyed by a hash of model, parameters and normalized prompt; return the stored answer on identical requests.","hp":"Helps you make repeated identical requests free and instant, e.g. in batch jobs, tests and popular FAQs.","x":"Only safe for deterministic intent (temperature 0, no user-specific context). Include prompt version and model in the key; set TTL; invalidate on knowledge updates. Great for CI eval reruns.","v":"draw:cacheaside","code":"import hashlib, json\nkey = hashlib.sha256(json.dumps({\"m\": MODEL, \"v\": PROMPT_V, \"msgs\": msgs},\n                                sort_keys=True).encode()).hexdigest()\nif (hit := redis.get(key)): return json.loads(hit)\nresp = call_llm(msgs)\nredis.setex(key, 86400, json.dumps(resp))","eq":["e12_semcache"]},"e12_semcache":{"k":"I","p":"E12","cl":"azure","t":"Semantic caching","s":"Embed incoming queries and return a cached answer when a previous query is similar above a threshold, skipping the LLM call.","hp":"Helps you serve repeated paraphrased questions cheaply in high-volume, low-personalization apps.","x":"Thresholds are tight (e.g. cosine 0.92–0.97) and must be tuned on labeled pairs: 'cancel my order' vs 'don't cancel my order' embed close. Scope by tenant and locale; never cache user-specific or time-sensitive answers.","v":"draw:semcache","code":"# pseudo\nv = embed(query)\nhit = vdb.search(v, top_k=1, filter={\"tenant\": t})\nif hit and hit.score >= 0.95:\n    return hit.payload[\"answer\"]\nans = llm(query); vdb.upsert(v, {\"answer\": ans, \"tenant\": t})","eq":["e12_exactcache","e7_filtering"]},"e12_routing":{"k":"I","p":"E12","cl":"azure","t":"Model routing & cascades","s":"Send each request to the cheapest model likely to handle it: route by task type or classifier, or cascade by trying a small model first and escalating on low confidence.","hp":"Helps you cut cost 50–80% while keeping quality on the hard tail.","x":"Router options: rules on task type, small classifier, or LLM router. Escalation signals: validator failure, low self-reported or logprob confidence, judge score. Measure the cascade's total cost including failed small-model attempts.","v":"draw:cascade","eq":["e1_modelselect","e2_gateway"]},"e12_rightsize":{"k":"B","p":"E12","cl":"gcp","t":"Right-sizing the model","s":"Choose the smallest model that meets your eval bar for each subtask rather than one frontier model everywhere.","hp":"Helps you pay frontier prices only where frontier quality is needed.","x":"Split pipelines: classification, extraction and routing usually work on small models; synthesis and complex reasoning may need large ones. Re-check quarterly; small models improve fast. Decide on your own evals, not leaderboards.","v":"quad:Cost,Quality on task|Small model=2,7;Mid model=4,8;Frontier=9,9;Fine-tuned small=2,8","eq":["e1_modelselect","e14_distill"]},"e12_reasoningeffort":{"k":"I","p":"E12","cl":"azure","t":"Tuning reasoning effort","s":"Reasoning models expose knobs (effort level or thinking-token budget) that trade accuracy for latency and cost per request.","hp":"Helps you avoid paying for long hidden thinking on easy requests.","x":"Thinking tokens bill as output and add decode time. Start low or minimal effort for simple tasks; raise only where evals show gains. Route by difficulty: same model, different effort. Watch p95 latency, which explodes at high effort.","v":"line:Minimal,Low,Medium,High|Accuracy pct=72,80,85,87|Latency s=2,5,11,25","f":"thinking budget, reasoning_effort","code":"# OpenAI reasoning models\nclient.responses.create(model=M, reasoning={\"effort\": \"low\"}, input=q)\n# Anthropic extended thinking\nclient.messages.create(model=M, max_tokens=4000, messages=msgs,\n    thinking={\"type\": \"enabled\", \"budget_tokens\": 2000})"},"e12_tokens":{"k":"B","p":"E12","cl":"azure","t":"Reducing tokens per request","s":"Trim what goes in and what comes out: shorter instructions, fewer and smaller retrieved chunks, compact history, terse output formats.","hp":"Helps you cut cost and latency on every call with no infrastructure change.","x":"Audit a real prompt: often 30–60% is redundant instructions, unused tool schemas or oversized context. Retrieve 3–5 good chunks, not 20. Ask for IDs or JSON fields instead of prose. Re-run evals after each cut.","v":"gbars:Before,After|Instructions=1200,500|Tool schemas=3000,900|Retrieved docs=8000,3000|Output=700,250","eq":["e5_budget","e5_compaction"]},"e12_maxtokens":{"k":"B","p":"E12","cl":"azure","t":"Output constraints & max_tokens","s":"Cap and shape outputs with max_tokens, explicit length instructions, stop sequences and structured formats.","hp":"Helps you bound worst-case latency and cost per call.","x":"Set max_tokens per task (e.g. 50 for classification, 500 for answers), but monitor finish_reason=length to catch truncation. Length instructions ('max 3 bullets') work better than word counts. Enums beat free text.","v":"bars:Classify=50,Extract JSON=300,Chat answer=600,Report=2000","code":"resp = client.chat.completions.create(\n    model=M, messages=msgs, max_tokens=60,\n    stop=[\"\\n\\n\"])\nif resp.choices[0].finish_reason == \"length\":\n    log.warning(\"truncated output\")","eq":["e4_jsonschema"]},"e12_predicted":{"k":"A","p":"E12","cl":"azure","t":"Predicted outputs & speculative edits","s":"When most output is known in advance (editing code or docs), pass the expected text so the provider verifies it in parallel instead of generating each token.","hp":"Helps you make rewrite and edit tasks several times faster.","x":"OpenAI predicted outputs accept a prediction; rejected predicted tokens are still billed. Alternatives: ask for diffs or search-replace blocks instead of full files. Wins most when edits are small relative to file size.","v":"cmp:#Full rewrite;Predicted;Diff edits|Output tokens=all;all billed;only changes|Speed=slow;fast;fast|Apply risk=low;low;patch errors","code":"resp = client.chat.completions.create(\n    model=\"gpt-4o\",\n    messages=[{\"role\": \"user\", \"content\": instr + code}],\n    prediction={\"type\": \"content\", \"content\": code})","eq":["e17_coding"]},"e12_costmodel":{"k":"B","p":"E12","cl":"multi","t":"LLM cost model","s":"Cost per task = (input tokens x input price + output tokens x output price) x calls per task, adjusted for cached-input discounts and retries.","hp":"Helps you predict spend before launch and know which term to shrink.","x":"Output tokens often cost 3–5x input. Agents multiply calls (5–30 per task) and re-send growing context each turn, so input tokens dominate agent bills. Include embeddings, rerankers, judges and retries in the model.","v":"fanin:Input tokens,Output tokens,Cached tokens,Calls per task,Retries|Cost per task","code":"def cost(in_tok, out_tok, cached=0, p_in=3.0, p_out=15.0, p_cache=0.3):\n    \"\"\"prices in USD per 1M tokens\"\"\"\n    return ((in_tok - cached) * p_in + cached * p_cache + out_tok * p_out) / 1e6\n\nper_task = sum(cost(**c) for c in calls)   # one entry per LLM call","eq":["e1_tokens","e11_metrics"]},"e12_uniteconomics":{"k":"I","p":"E12","cl":"gcp","t":"Unit economics per user & task","s":"Translate token costs into cost per resolved task, per active user per month and gross margin per plan tier.","hp":"Helps you price plans, set quotas and know if a feature is profitable.","x":"Model the distribution, not the mean: heavy users can cost 20–50x the median. Compare cost per resolved task with the human alternative. Re-run after each model or price change.","v":"table:Metric,Value|Tasks per user mo,120|Cost per task,0.018 USD|LLM cost per user,2.16 USD|Plan price,20 USD|LLM share,11%"},"e12_batch":{"k":"I","p":"E12","cl":"azure","t":"Batch APIs for offline work","s":"Submit large sets of non-urgent requests to a provider batch endpoint for about half price, with results within a window such as 24 hours.","hp":"Helps you halve cost for evals, backfills, enrichment and nightly reports.","x":"Typical: ~50% discount, up to 24 h turnaround, large per-batch limits. Combine with prompt caching where supported. Use custom_id to join results; handle partial failures and resubmit.","v":"seq:Job,Batch API,Store|1>2:upload JSONL|2>2:process async|1>2:poll status|2>3:results file|1>3:join by custom id","code":"batch = client.messages.batches.create(requests=[\n    {\"custom_id\": r.id, \"params\": {\"model\": M, \"max_tokens\": 300,\n                                  \"messages\": [{\"role\": \"user\", \"content\": r.text}]}}\n    for r in rows])","eq":["e2_batchapi"]},"e12_attribution":{"k":"I","p":"E12","cl":"gcp","t":"Cost attribution & tenant budgets","s":"Tag every LLM call with tenant, user, feature and environment so cost can be charged back and capped per tenant.","hp":"Helps you stop one tenant or feature from eating the margin of everyone else.","x":"Pass metadata through the gateway or tracing layer; aggregate daily. Set soft budgets (alert at 80%) and hard caps (degrade to a smaller model or queue). Separate eval and dev spend from production.","v":"fan:LLM spend|Tenant A,Tenant B,Feature chat,Feature search,Evals and dev","eq":["e11_metrics","e2_gateway"]},"e12_denialofwallet":{"k":"A","p":"E12","cl":"gcp","t":"Denial-of-wallet guards","s":"Defenses against abuse or bugs that run up LLM bills: rate limits, token caps, loop limits and anomaly alerts per user and key.","hp":"Helps you avoid a five-figure bill from one script, attacker or runaway agent.","x":"Layer: per-user requests/min and tokens/day, max input size, max agent steps, max_tokens, CAPTCHA or auth for free tiers, spend anomaly alerts, provider-side spend limits. Fail closed when the meter is down.","v":"ladder:Max tokens,Per user rate limit,Daily token quota,Agent step cap,Spend alert,Hard kill switch|stack them","eq":["e15_owasp","e2_ratelimits"]},"e12_capacity":{"k":"A","p":"E12","cl":"gcp","t":"Capacity planning vs rate limits","s":"Estimate peak requests and tokens per minute and compare against provider RPM/TPM limits per model and region before launch.","hp":"Helps you avoid launch-day 429 storms.","x":"Peak TPM = peak RPM x (avg input + output tokens). Leave 30–50% headroom; spread across regions, deployments or providers; request quota increases weeks ahead. Queue and shed low-priority work under pressure.","v":"line:9am,11am,1pm,3pm,5pm,7pm|Peak TPM k=300,650,900,700,450,200|Quota TPM k=800,800,800,800,800,800","code":"peak_rpm = 600\navg_tok = 3500 + 400          # input + output\npeak_tpm = peak_rpm * avg_tok  # 2.34M TPM\nheadroom = 1.4\nneed_tpm = peak_tpm * headroom","eq":["e2_ratelimits"]},"e12_provisioned":{"k":"A","p":"E12","cl":"multi","t":"Provisioned throughput vs pay-as-you-go","s":"Reserved model capacity (provisioned throughput units) buys guaranteed throughput and steadier latency for a fixed fee, versus per-token on-demand pricing.","hp":"Helps you decide when steady high volume justifies a capacity commitment.","x":"Breaks even only at high, steady utilization (often >50–70% of reserved capacity). Gains: predictable latency, no shared-pool 429s. Mix: provisioned for baseline, on-demand spillover for peaks.","v":"line:10%,30%,50%,70%,90%|PAYG cost=10,30,50,70,90|Provisioned cost=55,55,55,55,55","eq":["e12_capacity"]},"E13":{"k":"S","p":"E13","t":"Self-Hosting & Inference Serving","s":"Running open-weight models yourself: when it pays off, sizing GPU memory, quantization formats, serving engines, hardware, scaling and benchmarking.","hp":"Self-hosting trades API simplicity for control over privacy, cost at scale, latency and customization.","x":"self-host vs API, GPU memory math, KV cache sizing, quantization formats, vLLM, SGLang, TensorRT-LLM, llama.cpp, Ollama, batching, parallelism, multi-LoRA, speculative decoding, prefix caching, GPUs, autoscaling, serverless GPU, embedding serving, load testing","v":"arch:Serving stack:Clients>OpenAI-compatible API,Router>vLLM,SGLang,llama.cpp>GPUs,Autoscaler","sec":{"pid":"E13","num":13,"title":"Self-Hosting & Inference Serving","short":"Serving"}},"e13_selfhost":{"k":"B","p":"E13","cl":"multi","t":"Self-host vs API decision","s":"Choose between hosted model APIs and running open-weight models on your own GPUs based on privacy, cost at volume, latency control, customization and team skills.","hp":"Helps you avoid self-hosting for vanity, or paying API premiums when volume and data rules favor your own GPUs.","x":"Self-host when: data cannot leave your boundary, steady high volume, need custom fine-tunes or LoRAs, strict latency or offline use. Stay on APIs for frontier quality, spiky low volume, or no GPU ops capacity.","v":"cmp:#Hosted API;Self-hosted|Quality ceiling=frontier;open weights|Cost at low volume=low;high idle|Cost at scale=linear;can be lower|Data control=contract;full|Ops burden=none;high","eq":["e1_modelselect","e12_costmodel"]},"e13_breakeven":{"k":"I","p":"E13","cl":"gcp","t":"Self-hosting break-even math","s":"Compare API cost per million tokens with GPU hourly cost divided by tokens actually served per hour at your real utilization.","hp":"Helps you see that utilization, not list price, decides whether self-hosting is cheaper.","x":"GPU cost per 1M tokens = hourly price / (tokens/s x 3600 / 1e6) / utilization. A GPU at 30% utilization costs over 3x its peak-rate figure. Add engineer time, redundancy (at least 2 replicas) and idle nights.","v":"line:1M,10M,50M,100M,500M|API cost=3,30,150,300,1500|Self-host cost=150,150,180,220,600","code":"gpu_hr = 4.0               # USD per H100-hour, e.g.\ntok_s = 2500               # aggregate output tok/s at target concurrency\nutil = 0.4\ncost_per_m = gpu_hr / (tok_s * 3600 / 1e6) / util  # ~1.1 USD per 1M tokens"},"e13_registry":{"k":"B","p":"E13","cl":"multi","t":"Weights formats & model registries","s":"Open weights ship as safetensors (or GGUF) on the Hugging Face Hub with config, tokenizer and license; you mirror them to an internal registry or bucket.","hp":"Helps you get reproducible, safe, license-compliant model artifacts into production.","x":"Prefer safetensors over pickle .bin (no code execution on load). Pin a revision commit hash. Mirror weights to your own S3 or registry to avoid Hub outages and rate limits. Check license terms (e.g. Llama, Apache-2.0).","v":"flow:HF Hub>Pin revision>Scan + license check>Mirror to S3>Serve","f":"safetensors, HF Hub","code":"from huggingface_hub import snapshot_download\npath = snapshot_download(\"Qwen/Qwen2.5-7B-Instruct\",\n                         revision=\"<commit-sha>\",\n                         allow_patterns=[\"*.safetensors\", \"*.json\", \"tokenizer*\"])"},"e13_gpumem":{"k":"B","p":"E13","cl":"multi","t":"GPU memory math","s":"GPU memory needed = weights (params x bytes per param) + KV cache (grows with context and batch) + activations and runtime overhead.","hp":"Helps you know before buying whether a model fits and how many concurrent users it can serve.","x":"Weights: 8B at FP16 = 16 GB, at 4-bit ~5 GB; 70B FP16 = 140 GB, 4-bit ~40 GB. Leave ~10–20% for overhead. Whatever remains is KV cache, which sets max concurrency x context.","v":"draw:gpumem","code":"def weights_gb(params_b, bits=16):\n    return params_b * bits / 8          # 70B @ 16-bit -> 140 GB\n\ndef kv_gb(layers, kv_heads, head_dim, seq, batch, bytes_=2):\n    return 2 * layers * kv_heads * head_dim * seq * batch * bytes_ / 1e9","eq":["e13_quantformats"]},"e13_kvsizing":{"k":"I","p":"E13","cl":"azure","t":"KV cache sizing & concurrency","s":"Compute KV cache per token from layers, KV heads and head dim, then divide free GPU memory by it to get total tokens in flight across all requests.","hp":"Helps you set max context and max concurrent sequences without OOMs.","x":"Llama-3.1-8B (32 layers, 8 KV heads, dim 128, FP16): ~128 KB/token, so 1 GB per 8K tokens. 70B (80 layers): ~320 KB/token. GQA and FP8 KV cache cut it 2–8x. Long max context with high concurrency is what blows memory.","v":"ctx:Weights=40,KV cache=48,Activations=7,Overhead=5|80 GB","code":"per_tok = 2 * 32 * 8 * 128 * 2       # bytes, Llama-3.1-8B FP16 = 131072\nfree = 80e9 * 0.9 - 16e9              # H100, 90% util, minus weights\nmax_tokens_in_flight = free / per_tok # ~427K tokens\n# e.g. 52 concurrent requests at 8K context","eq":["e13_gpumem"]},"e13_quantformats":{"k":"I","p":"E13","cl":"multi","t":"Quantization formats in practice","s":"Deployment formats store weights at lower precision: GGUF for llama.cpp, GPTQ and AWQ 4-bit for GPUs, FP8 on Hopper and newer, bitsandbytes NF4 mainly for QLoRA training.","hp":"Helps you pick the format your engine and hardware run fast, at acceptable quality loss.","x":"Typical quality: FP8 near lossless; 8-bit near lossless; 4-bit AWQ/GPTQ/Q4_K_M small drop (often 1–3 points on evals); below 4-bit degrades fast. Always re-run your evals; reasoning and code suffer first.","v":"cmp:#Bits;Best on;Quality|FP8=8;H100 and newer;near lossless|AWQ or GPTQ=4;GPU vLLM;small drop|GGUF Q4_K_M=4.5 avg;CPU Mac llama.cpp;small drop|NF4 bnb=4;QLoRA training;slower serving","eq":["e7_quantization"]},"e13_gguf":{"k":"I","p":"E13","cl":"aws","t":"GGUF & k-quants","s":"GGUF is llama.cpp's single-file format bundling weights, tokenizer and metadata, with k-quant levels such as Q4_K_M, Q5_K_M, Q8_0.","hp":"Helps you run models on laptops, Macs and CPUs with one portable file.","x":"Q4_K_M is the common sweet spot; Q5_K_M or Q6_K if memory allows; Q8_0 near lossless. Imatrix quants improve low-bit quality. Used by llama.cpp, Ollama and LM Studio.","v":"bars:Q3_K_M GB=3.9,Q4_K_M GB=4.9,Q5_K_M GB=5.7,Q6_K GB=6.6,Q8_0 GB=8.5,F16 GB=16","code":"# convert HF model and quantize with llama.cpp tools\npython convert_hf_to_gguf.py ./Llama-3.1-8B-Instruct --outfile f16.gguf\n./llama-quantize f16.gguf model-Q4_K_M.gguf Q4_K_M"},"e13_awqgptq":{"k":"A","p":"E13","cl":"azure","t":"AWQ, GPTQ & FP8 for GPU serving","s":"Post-training weight quantization methods tuned for GPU kernels: AWQ and GPTQ use calibration data for 4-bit, FP8 uses hardware-native 8-bit.","hp":"Helps you fit bigger models per GPU and raise throughput in vLLM or TensorRT-LLM.","x":"Use pre-quantized checkpoints when available. Calibrate on in-domain text (a few hundred samples). FP8 (W8A8) also speeds compute on H100/H200/B200; 4-bit mainly saves memory and helps low-batch latency.","v":"quad:Memory saved,Quality kept|FP16=0,10;FP8=5,9.5;INT8=5,9;AWQ 4-bit=7.5,8.5;GPTQ 4-bit=7.5,8.3;3-bit=8.5,6","code":"# serve a pre-quantized AWQ checkpoint\nvllm serve Qwen/Qwen2.5-32B-Instruct-AWQ --quantization awq\n# FP8 on Hopper: dynamic quantization at load\nvllm serve meta-llama/Llama-3.1-8B-Instruct --quantization fp8"},"e13_parallelism":{"k":"A","p":"E13","cl":"multi","t":"Tensor vs pipeline parallelism","s":"Split a model across GPUs either by sharding each layer's matrices (tensor parallel) or by placing groups of layers on different GPUs (pipeline parallel).","hp":"Helps you serve models that don't fit on one GPU with the least latency penalty.","x":"Tensor parallel within a node over NVLink (TP=2/4/8) cuts latency but needs fast interconnect. Pipeline parallel spans nodes with less bandwidth but adds bubbles. Prefer one GPU or TP-only when the model fits.","v":"cmp:#Tensor parallel;Pipeline parallel|Splits=each layer;layer groups|Needs=NVLink;modest network|Latency=lower;higher|Typical=within node;across nodes","code":"vllm serve meta-llama/Llama-3.3-70B-Instruct \\\n  --tensor-parallel-size 4 --pipeline-parallel-size 1"},"e13_engines":{"k":"B","p":"E13","cl":"multi","t":"Serving engines landscape","s":"Servers that load models, batch requests, manage KV cache and expose an API: vLLM, SGLang, TensorRT-LLM for GPUs; llama.cpp, Ollama, LM Studio, MLX for local.","hp":"Helps you pick by hardware and workload instead of by GitHub stars.","x":"Datacenter GPU default: vLLM or SGLang. Max NVIDIA performance with more build effort: TensorRT-LLM (often via Triton or NIM). Laptop, Mac or CPU: llama.cpp family or MLX. Benchmark on your prompts.","v":"quad:Ease of use,Peak throughput|vLLM=7,8;SGLang=6,8.5;TensorRT-LLM=3,9.5;llama.cpp=6,4;Ollama=9.5,3;MLX=7,4","eq":["e13_vllm","e13_ollama"]},"e13_vllm":{"k":"I","p":"E13","cl":"aws","t":"vLLM","s":"The most widely used open-source LLM serving engine, built around PagedAttention and continuous batching, with an OpenAI-compatible server.","hp":"Helps you serve open models at high throughput with one command.","x":"Key flags: --max-model-len, --gpu-memory-utilization (default 0.9), --max-num-seqs, --tensor-parallel-size, --enable-prefix-caching, --quantization. Supports LoRA adapters, speculative decoding, structured output, many model families.","v":"arch:vLLM:Clients>OpenAI API server>Scheduler>PagedAttention KV,Model workers","code":"vllm serve meta-llama/Llama-3.1-8B-Instruct \\\n  --max-model-len 16384 --gpu-memory-utilization 0.9 \\\n  --max-num-seqs 128 --enable-prefix-caching\n# then: OpenAI(base_url=\"http://localhost:8000/v1\", api_key=\"x\")","eq":["e13_sglang","e13_tgi_trt"]},"e13_contbatching":{"k":"I","p":"E13","cl":"multi","t":"Continuous batching & PagedAttention","s":"The scheduler adds and removes sequences from the running batch every decode step, and PagedAttention stores KV cache in fixed-size blocks to avoid fragmentation.","hp":"Helps you understand why one GPU can serve dozens of concurrent chats efficiently.","x":"In practice: throughput rises with concurrency until KV blocks run out, then requests queue or get preempted. Tune max-num-seqs and max-model-len; watch KV cache usage and preemption counts in engine metrics.","v":"seq:Scheduler,Batch,KV blocks|1>2:add new request|2>3:allocate blocks|2>2:decode step|1>2:evict finished|3>1:free blocks","f":"in-flight batching"},"e13_throughputlatency":{"k":"I","p":"E13","cl":"multi","t":"Throughput vs latency under load","s":"As concurrency rises, total tokens/s grows but per-user tokens/s falls and TTFT climbs; past saturation, latency explodes while throughput flattens.","hp":"Helps you pick an operating point that meets your latency SLO at lowest cost per token.","x":"Benchmark a sweep (1, 4, 16, 64, 128 concurrent) and plot throughput vs p95 TTFT and per-user tokens/s. Set max concurrency per replica just below the knee; scale out beyond it.","v":"line:1,4,16,32,64,128|Total tok per s x100=0.8,3,9,14,18,19|p95 TTFT x100ms=1,1.2,2,3.5,8,20","eq":["e13_loadtest"]},"e13_prefixcache":{"k":"I","p":"E13","cl":"azure","t":"Automatic prefix caching","s":"The engine reuses KV cache blocks for identical prompt prefixes across requests, skipping their prefill.","hp":"Helps you cut TTFT and GPU load for shared system prompts, few-shots and multi-turn chats.","x":"vLLM: --enable-prefix-caching (on by default in recent versions); SGLang: RadixAttention tree. Hit rate depends on identical token prefixes, so keep static content first and route a session to the same replica (prefix-aware routing).","v":"flow:New request>Hash prefix blocks>Reuse cached KV>Prefill rest>Decode","eq":["e12_promptcaching","e5_cachefriendly"]},"e13_specdecode":{"k":"A","p":"E13","cl":"azure","t":"Speculative decoding in serving","s":"A small draft model or n-gram/EAGLE heads propose several tokens that the main model verifies in one pass, keeping exact output distribution.","hp":"Helps you lower per-user latency 1.5–3x at low to moderate load.","x":"Gains shrink at high batch sizes where GPUs are already compute-bound. Acceptance rate matters: draft must share tokenizer and style. Options in vLLM/SGLang: draft model, EAGLE, n-gram prompt lookup (great for edits and RAG).","v":"seq:Draft,Target,Output|1>2:propose 5 tokens|2>2:verify in one pass|2>3:accept 4|2>3:emit 1 corrected","code":"vllm serve meta-llama/Llama-3.1-70B-Instruct --tensor-parallel-size 4 \\\n  --speculative-config '{\"method\": \"ngram\", \"num_speculative_tokens\": 5,\n                         \"prompt_lookup_max\": 4}'"},"e13_multilora":{"k":"A","p":"E13","cl":"azure","t":"Multi-LoRA serving","s":"Serve many LoRA adapters on one shared base model, choosing the adapter per request, so each tenant or task gets its own fine-tune at near-base cost.","hp":"Helps you run hundreds of fine-tunes without a GPU per model.","x":"vLLM: --enable-lora, --max-loras (adapters per batch), --max-lora-rank; request with model=<adapter name>. Adapters swap from CPU or disk; cold adapters add latency. Keep ranks uniform (e.g. 16–64).","v":"fan:Base model|LoRA tenant A,LoRA tenant B,LoRA SQL,LoRA support","f":"S-LoRA, adapter hot-swap","code":"vllm serve meta-llama/Llama-3.1-8B-Instruct --enable-lora \\\n  --lora-modules sql=./lora/sql support=./lora/support --max-loras 4\n# client: model=\"sql\" selects the adapter","eq":["e14_lora"]},"e13_sglang":{"k":"A","p":"E13","cl":"aws","t":"SGLang & RadixAttention","s":"High-performance serving engine whose RadixAttention keeps a radix tree of cached prefixes, excelling at multi-turn chat, agents and structured output.","hp":"Helps you get top throughput on prefix-heavy and structured workloads.","x":"Strong on shared-prefix traffic, fast JSON-constrained decoding, and large MoE models at scale. OpenAI-compatible server. Benchmark against vLLM on your traffic; leadership flips between releases.","v":"tree:Root prefix>System A,System B;System A>Chat 1,Chat 2;Chat 1>Turn 3","code":"python -m sglang.launch_server --model-path Qwen/Qwen2.5-7B-Instruct \\\n  --port 30000 --tp 1","eq":["e13_vllm"]},"e13_tgi_trt":{"k":"A","p":"E13","cl":"aws","t":"TensorRT-LLM, Triton & TGI","s":"NVIDIA TensorRT-LLM compiles models into optimized engines (often served via Triton or NIM); Hugging Face TGI is an older Rust/Python server.","hp":"Helps you squeeze maximum NVIDIA throughput when you can afford a build step.","x":"TensorRT-LLM: best kernels, FP8/FP4, in-flight batching, but per-GPU-type builds and slower model support. TGI is now largely in maintenance mode, with HF pointing users to vLLM or SGLang backends.","v":"flow:HF checkpoint>Build engine>Triton server>Clients","eq":["e13_vllm"]},"e13_llamacpp":{"k":"B","p":"E13","cl":"aws","t":"llama.cpp","s":"C/C++ inference engine for GGUF models running on CPUs, Apple Metal, CUDA, Vulkan and more, including an OpenAI-compatible llama-server.","hp":"Helps you run quantized models on almost any hardware with minimal dependencies.","x":"-ngl offloads N layers to GPU (99 = all); -c sets context; split CPU/GPU when VRAM is short. Throughput is lower than vLLM at high concurrency, but unbeatable for edge, Mac and single-user setups.","v":"stack:llama-server,GGUF model,ggml kernels,CPU or Metal or CUDA|0","code":"llama-server -m model-Q4_K_M.gguf -c 8192 -ngl 99 --port 8080\n# OpenAI-compatible at http://localhost:8080/v1","eq":["e13_ollama","e13_gguf"]},"e13_ollama":{"k":"B","p":"E13","cl":"aws","t":"Ollama","s":"Developer-friendly local model runner built on llama.cpp: pull and run models with one command, with a local REST and OpenAI-compatible API.","hp":"Helps you prototype against local models in minutes and keep dev data on your machine.","x":"ollama pull / run; API on localhost:11434 (OpenAI-compatible under /v1). Modelfile sets system prompt and parameters. Default context is small; raise num_ctx for RAG. Not built for multi-tenant production throughput.","v":"seq:Dev,Ollama,Model|1>2:ollama run llama3.2|2>3:load GGUF|1>2:POST /api/chat|2>1:stream tokens","code":"import ollama\nr = ollama.chat(model=\"llama3.2\",\n                messages=[{\"role\": \"user\", \"content\": \"Summarize this...\"}],\n                options={\"num_ctx\": 8192})\nprint(r[\"message\"][\"content\"])","eq":["e13_llamacpp"]},"e13_desktop":{"k":"B","p":"E13","cl":"aws","t":"LM Studio & MLX","s":"LM Studio is a desktop app to browse, run and serve local models; MLX is Apple's array framework with mlx-lm for fast LLM inference and LoRA on Apple silicon.","hp":"Helps you evaluate and run models locally on a Mac or workstation without command-line setup.","x":"LM Studio runs GGUF and MLX models and exposes an OpenAI-compatible local server. Apple unified memory lets big Macs hold 70B 4-bit models; decode speed is bound by memory bandwidth.","v":"hub:Local desktop|LM Studio,mlx-lm,GGUF,Local server,Mac unified mem","code":"pip install mlx-lm\nmlx_lm.generate --model mlx-community/Llama-3.2-3B-Instruct-4bit \\\n  --prompt \"Explain KV cache in one line\""},"e13_openaicompat":{"k":"B","p":"E13","cl":"multi","t":"OpenAI-compatible server API","s":"Most engines expose /v1/chat/completions and /v1/embeddings in the OpenAI format, so existing SDKs and frameworks work by changing base_url.","hp":"Helps you swap between hosted and self-hosted models with a config change.","x":"Compatibility is partial: tool calling, JSON mode, logprobs and streaming usage stats vary by engine and model chat template. Test tool calls specifically; a wrong chat template silently hurts quality.","v":"arch:Compat layer:App>OpenAI SDK>vLLM,Ollama,llama-server,Hosted API","code":"from openai import OpenAI\nclient = OpenAI(base_url=\"http://vllm:8000/v1\", api_key=\"unused\")\nr = client.chat.completions.create(model=\"meta-llama/Llama-3.1-8B-Instruct\",\n                                   messages=[{\"role\": \"user\", \"content\": \"hi\"}])","eq":["e2_messages"]},"e13_embedserving":{"k":"I","p":"E13","cl":"aws","t":"Embedding & reranker serving","s":"Dedicated servers for encoder models, such as Hugging Face TEI and Infinity, batch many short inputs for high-throughput embeddings and reranking.","hp":"Helps you embed millions of chunks cheaply and keep query-time embedding under ~20 ms.","x":"Encoders are small (100M–1B params): a single L4 or even CPU serves thousands of texts/s. Use dynamic batching, ONNX or FP16, and cap max sequence length. vLLM also serves some embedding models.","v":"fan:TEI server|Embed docs,Embed queries,Rerank top-k,Sparse vectors","code":"docker run --gpus all -p 8080:80 \\\n  ghcr.io/huggingface/text-embeddings-inference:1.5 \\\n  --model-id BAAI/bge-base-en-v1.5\ncurl localhost:8080/embed -d '{\"inputs\": [\"hello\"]}' -H 'Content-Type: application/json'","eq":["e6_embedmodel","e6_rerank"]},"e13_gpus":{"k":"B","p":"E13","cl":"multi","t":"GPU & accelerator choices","s":"Pick accelerators by memory, bandwidth (decode speed), interconnect and price: H100/H200/B200 for big models, L4/L40S/A10G for small, TPUs or Apple silicon as options.","hp":"Helps you match hardware to model size and latency target instead of defaulting to the priciest GPU.","x":"Decode is memory-bandwidth bound, so bandwidth predicts tokens/s per user. 7–8B FP16 fits a 24 GB L4/A10G with modest context; 70B needs 2–4 H100s at FP16 or one at FP8 with care.","v":"table:GPU,Memory GB,Good for|L4 or A10G,24,7B 4-16 bit|L40S,48,13-34B quant|H100,80,70B FP8|H200,141,70B long ctx|B200,180+,large MoE","eq":["e13_gpumem"]},"e13_edge":{"k":"I","p":"E13","cl":"multi","t":"Edge & on-device models","s":"Small models (roughly 1–8B, quantized) running on phones, laptops or edge boxes for privacy, offline use and zero per-call cost.","hp":"Helps you handle simple tasks locally and reserve cloud calls for hard ones.","x":"Good for classification, extraction, autocomplete, summarization of short text. Constraints: RAM, battery, thermals, update distribution. Common pattern: on-device first, cloud fallback on low confidence.","v":"fan:On-device model|Answer locally,Low confidence,Escalate to cloud","eq":["e12_routing"]},"e13_autoscale":{"k":"A","p":"E13","cl":"gcp","t":"GPU autoscaling & cold starts","s":"Scale model replicas on queue depth, running requests or KV usage, not CPU, and manage cold starts from large weight downloads and engine warmup.","hp":"Helps you follow demand without paying for idle GPUs or making users wait minutes.","x":"Cold start = provision GPU node + pull image + load weights (GBs) + compile or CUDA graphs: often 1–10 min. Mitigate: keep a warm minimum, cache weights on local NVMe, preload images, scale on predicted load. Use KEDA or engine metrics.","v":"line:0,5,10,15,20,25,30|Queue depth=2,10,40,35,20,8,3|Replicas=1,1,2,4,4,3,2","eq":["e2_ratelimits"]},"e13_serverless":{"k":"I","p":"E13","cl":"aws","t":"Serverless GPU platforms","s":"Platforms such as Modal, RunPod, Replicate and Baseten run your model containers on demand with per-second GPU billing and scale to zero.","hp":"Helps you self-host spiky or early-stage workloads without running a GPU cluster.","x":"Trade-offs: cold starts (seconds to minutes), higher per-hour price than reserved GPUs, less networking control. Keep a warm instance for latency-sensitive paths; snapshot weights into the image or volume.","v":"cmp:#Serverless GPU;Own GPU cluster|Idle cost=near zero;full|Cold start=yes;no|Per-hour price=higher;lower|Ops effort=low;high","code":"import modal, subprocess\napp = modal.App(\"llm\")\n@app.function(gpu=\"H100\", image=vllm_image, scaledown_window=300)\n@modal.web_server(8000)\ndef serve():\n    subprocess.Popen(\"vllm serve Qwen/Qwen2.5-7B-Instruct --port 8000\", shell=True)"},"e13_loadtest":{"k":"I","p":"E13","cl":"gcp","t":"Load testing & benchmarking LLM servers","s":"Measure TTFT, inter-token latency, tokens/s and error rate across a concurrency sweep with realistic input and output lengths.","hp":"Helps you size replicas and catch regressions from engine, model or flag changes.","x":"Use your real length distribution (e.g. 2K in / 300 out), not 128/128. Report p50/p95 TTFT and ITL plus total throughput at each concurrency. Tools: vllm bench serve, NVIDIA genai-perf, LLMPerf, k6 or Locust.","v":"line:1,8,32,64,128|Output tok per s x100=0.9,6,16,22,24|p95 ITL ms=12,15,25,40,75","code":"vllm bench serve --backend openai-chat --base-url http://localhost:8000 \\\n  --endpoint /v1/chat/completions --model meta-llama/Llama-3.1-8B-Instruct \\\n  --dataset-name random --random-input-len 2000 --random-output-len 300 \\\n  --max-concurrency 32 --num-prompts 500","eq":["e13_throughputlatency"]},"E14":{"k":"S","p":"E14","t":"Fine-Tuning & Customization in Practice","s":"When and how to adapt a model's weights: data curation, SFT with LoRA/QLoRA, preference and RL tuning, embedding/reranker tuning, and shipping the result.","hp":"Fine-tuning is the costliest lever; knowing when it pays (and when RAG or prompting wins) saves weeks.","x":"decision ladder, dataset curation, chat formats, distillation, LoRA/QLoRA, full FT, DPO/ORPO/KTO, RFT/GRPO, embedding & reranker tuning, tools, managed APIs, evals & forgetting, merging & serving, cost, licensing","v":"draw:finetune","sec":{"pid":"E14","num":14,"title":"Fine-Tuning & Customization in Practice","short":"Fine-tuning"}},"e14_ladder":{"k":"B","p":"E14","cl":"multi","t":"Customization decision ladder","s":"Escalate only as needed: prompt engineering, then few-shot, then RAG, then fine-tuning, and pretraining only as a last resort.","hp":"Helps you pick the cheapest lever that closes the quality gap.","x":"Each rung costs roughly 10x more effort than the last. Exhaust prompts + evals first; RAG fixes missing knowledge; fine-tune fixes behavior. Rungs combine: a tuned model can still use RAG.","v":"ladder:Prompt,Few-shot,RAG,Fine-tune,Continued pretrain,Pretrain|effort, data and cost rise per rung","eq":["e3_fewshot","e6_ingest","e1_buildloop"]},"e14_whenft":{"k":"B","p":"E14","cl":"multi","t":"What fine-tuning is (and isn't) for","s":"Fine-tuning reliably teaches format, style, tone, task skill and lets a small model match a big one; it is unreliable for injecting new facts.","hp":"Helps you avoid tuning for knowledge, which RAG does better and keeps fresh.","x":"Good: strict output format, domain jargon, classification, shorter prompts, 10x cheaper/faster small model. Bad: new or changing facts (hallucinations rise), fixing a vague spec, tasks you can't evaluate.","v":"cmp:#Fine-tune;RAG or prompt|Output format=Strong;OK|Style and tone=Strong;OK|Fresh facts=Weak;Strong|Lower latency=Strong;Weak|Citations=Weak;Strong"},"e14_classifier":{"k":"I","p":"E14","cl":"azure","t":"Classifier heads on small models","s":"Put a classification head on a small encoder (e.g. ModernBERT, DeBERTa) and fine-tune it for routing, intent, moderation or tagging.","hp":"Helps you replace per-call LLM classification with a 5 ms, near-free model.","x":"A few thousand labeled examples (LLM-labeled is fine) often match a frontier model on narrow labels. Runs on CPU; calibrate thresholds on a held-out set; retrain as label drift appears.","v":"bars:Frontier LLM ms=900,Small LLM ms=250,Encoder head ms=8","code":"from transformers import AutoModelForSequenceClassification\nmodel = AutoModelForSequenceClassification.from_pretrained(\n    \"answerdotai/ModernBERT-base\", num_labels=5)\n# train with Trainer on (text, label); export to ONNX for CPU serving","eq":["e12_routing"]},"e14_dataset":{"k":"B","p":"E14","cl":"gcp","t":"Dataset curation: quality over quantity","s":"Assemble a clean, diverse, consistent set of input/ideal-output examples that represent real production traffic.","hp":"Helps you get most of the gain from data, which matters more than any hyperparameter.","x":"Typical sizes: 50–100 examples to see an effect, 500–5,000 for solid SFT, 10K+ for broad skills. Dedupe, fix contradictory labels, cover edge cases, mirror prod prompt shape. 1K clean beats 50K noisy.","v":"line:100,500,1K,5K,20K|Clean data=55,72,80,85,87|Noisy data=45,55,60,63,64","eq":["e10_golden","e10_erroranalysis"]},"e14_chatformat":{"k":"B","p":"E14","cl":"multi","t":"Chat JSONL format & chat templates","s":"Training rows are JSONL lists of system/user/assistant messages, rendered into tokens by the model's own chat template.","hp":"Helps you avoid silent train/serve mismatches that wreck tuned-model quality.","x":"Always use tokenizer.apply_chat_template; wrong special tokens are the #1 bug. Mask loss to assistant turns only. Train with the same system prompt and tool schema you will serve with.","v":"flow:messages JSONL>chat template>token ids>loss mask>trainer","code":"{\"messages\":[{\"role\":\"system\",\"content\":\"Extract invoice fields.\"},{\"role\":\"user\",\"content\":\"INV-22 due 3/1 $410\"},{\"role\":\"assistant\",\"content\":\"{\\\"id\\\":\\\"INV-22\\\",\\\"total\\\":410}\"}]}\n# render: tok.apply_chat_template(row[\"messages\"], tokenize=False)","eq":["e2_messages"]},"e14_splits":{"k":"B","p":"E14","cl":"gcp","t":"Train/val/test splits & contamination","s":"Hold out validation and test sets that never leak into training, split by entity or time rather than by random row.","hp":"Helps you trust that eval gains are real, not memorized.","x":"Common split 80/10/10; keep test frozen and small but real (100–500). Split by customer/document/date to avoid near-duplicates leaking. Run n-gram or embedding dedupe between train and test.","v":"fan:Raw examples|Dedupe,Train 80%,Val 10%,Test 10% frozen","code":"# pseudo: drop train rows near-duplicate to any test row\ntest_emb = embed(test_texts)\nkeep = [r for r in train if max_cos(embed([r.text]), test_emb) < 0.9]","eq":["e10_golden"]},"e14_distill":{"k":"I","p":"E14","cl":"azure","t":"Synthetic data & distillation","s":"Use a frontier teacher model to generate or label training data, then fine-tune a small student to imitate it on your task.","hp":"Helps you get near-frontier quality on one task at a fraction of the cost and latency.","x":"Seed with real prompts, have the teacher answer, filter with validators or an LLM judge, keep only passing rows. Vary personas and difficulty to avoid collapse. Check the teacher's terms allow training on outputs.","v":"flow:Real prompts>Teacher LLM>Filter and judge>Clean set>Student SFT>Eval vs teacher","f":"teacher-student / model distillation","code":"# pseudo\nrows = []\nfor p in prod_prompts:\n    ans = teacher.generate(p)\n    if validate(ans) and judge(p, ans) >= 4:\n        rows.append({\"messages\": [{\"role\": \"user\", \"content\": p}, {\"role\": \"assistant\", \"content\": ans}]})","eq":["e12_costmodel","e12_routing"]},"e14_sft":{"k":"I","p":"E14","cl":"azure","t":"SFT hyperparameters that matter","s":"Supervised fine-tuning trains next-token loss on your demonstrations; a handful of knobs decide success.","hp":"Helps you start from sane defaults instead of burning GPU hours on a sweep.","x":"LoRA LR ~1e-4 to 2e-4, full FT ~1e-5 to 2e-5. Epochs 1–3 (more overfits small sets). Effective batch 16–64 via grad accumulation. Warmup 3–5%, cosine decay. Pack sequences; set max_seq_length to your p99.","v":"table:Knob,LoRA,Full FT|LR,2e-4,1e-5|Epochs,1-3,1-2|Eff batch,16-64,64-256|Warmup,3%,3%","f":"supervised fine-tuning / instruction tuning"},"e14_lora":{"k":"I","p":"E14","cl":"azure","t":"LoRA in practice","s":"Train small low-rank adapter matrices on frozen base weights; choose rank, alpha, target modules and dropout.","hp":"Helps you fine-tune 7–70B models on modest GPUs with tiny, swappable adapters.","x":"Start r=16, alpha=2r (32), dropout 0.05, target all linear layers (attention + MLP beats attention-only). Raise r to 64+ for harder tasks. Adapters are ~10–200 MB vs GBs for full weights.","v":"bars:r8 adapter MB=7,r16 adapter MB=13,r32 adapter MB=26,r64 adapter MB=52,r128 adapter MB=105","f":"Low-Rank Adaptation","code":"from peft import LoraConfig\nlora = LoraConfig(r=16, lora_alpha=32, lora_dropout=0.05,\n                  target_modules=\"all-linear\", task_type=\"CAUSAL_LM\")","eq":["e13_multilora"]},"e14_qlora":{"k":"I","p":"E14","cl":"azure","t":"QLoRA on a single GPU","s":"Load the frozen base in 4-bit NF4 and train LoRA adapters in bf16, cutting memory roughly 3–4x.","hp":"Helps you tune a 7–8B model on one 24 GB GPU or a 70B on one 80 GB card.","x":"Use nf4 + double quant + bf16 compute, gradient checkpointing, paged AdamW. Quality is usually within ~1 point of 16-bit LoRA, but training is slower. Merge into a bf16 base, not the 4-bit one.","v":"gbars:7B,13B,70B|LoRA bf16 GB=18,32,160|QLoRA GB=7,12,46","code":"from transformers import BitsAndBytesConfig\nimport torch\nbnb = BitsAndBytesConfig(load_in_4bit=True, bnb_4bit_quant_type=\"nf4\",\n    bnb_4bit_use_double_quant=True, bnb_4bit_compute_dtype=torch.bfloat16)","eq":["e13_gpumem","e13_quantformats"]},"e14_fullft":{"k":"A","p":"E14","cl":"azure","t":"Full fine-tuning","s":"Update every weight of the model; needs optimizer states and gradients for all parameters.","hp":"Helps you get the last few points of quality when LoRA plateaus and you have data and GPUs.","x":"Memory ~16 bytes/param with Adam in mixed precision (7B ≈ 112 GB+), so use FSDP or DeepSpeed ZeRO-3 across GPUs. Higher forgetting risk; use low LR and replay general data. Output is a full checkpoint per run.","v":"cmp:#LoRA;Full FT|GPU memory=Low;Very high|Artifact size=MB;GB|Quality ceiling=High;Highest|Forgetting=Lower;Higher","eq":["e14_lora"]},"e14_dpo":{"k":"A","p":"E14","cl":"azure","t":"Preference tuning: DPO, ORPO, KTO","s":"Train on chosen-vs-rejected outputs so the model prefers better answers, without a separate reward model or PPO loop.","hp":"Helps you fix subtle quality issues (tone, verbosity, refusals) that demos alone can't specify.","x":"DPO: SFT first, then pairs, beta ~0.1, LR ~5e-7 to 5e-6. ORPO folds SFT+preference into one stage. KTO needs only thumbs up/down labels, not pairs. Watch for verbosity creep and reward hacking.","v":"table:Method,Data,Needs SFT first|DPO,pairs,yes|ORPO,pairs,no|KTO,thumbs,usually|SimPO,pairs,yes","f":"Direct Preference Optimization","code":"from trl import DPOConfig, DPOTrainer\n# ds columns: prompt, chosen, rejected\ntrainer = DPOTrainer(model=model, processing_class=tok, train_dataset=ds,\n    args=DPOConfig(output_dir=\"dpo\", beta=0.1, learning_rate=5e-7))\ntrainer.train()"},"e14_prefdata":{"k":"I","p":"E14","cl":"gcp","t":"Collecting preference data","s":"Build chosen/rejected pairs from user feedback, human raters, or an LLM judge comparing sampled outputs.","hp":"Helps you turn production signals into a training set that targets what users actually prefer.","x":"Sample 2–4 outputs per prompt at temperature ~0.8, rank with a rubric judge, spot-check with humans. Pairs should differ meaningfully; drop ties. Log regenerations and edits as implicit preferences.","v":"flow:Prompt>Sample N outputs>Judge or human ranks>Chosen vs rejected>DPO set","eq":["e11_feedback","e10_judge"]},"e14_rft":{"k":"A","p":"E14","cl":"azure","t":"Reinforcement fine-tuning (GRPO)","s":"Optimize the model against a programmatic grader: sample several answers, score them, and push toward above-average ones.","hp":"Helps you improve reasoning and verifiable tasks (SQL, math, code, extraction) beyond what demos teach.","x":"GRPO compares a group of 4–16 samples per prompt, so no value model is needed. Graders must be hard to game: exact match, unit tests, SQL result equality. Needs hundreds of prompts, not thousands of labels.","v":"flow:Prompt>Sample group>Verifier scores>Relative advantage>Policy update|loop","f":"RFT / Group Relative Policy Optimization","code":"from trl import GRPOConfig, GRPOTrainer\ndef exact(completions, answer, **kw):\n    return [1.0 if c.strip() == a else 0.0 for c, a in zip(completions, answer)]\ntrainer = GRPOTrainer(model=\"Qwen/Qwen2.5-1.5B-Instruct\", reward_funcs=exact,\n    args=GRPOConfig(output_dir=\"grpo\", num_generations=8), train_dataset=ds)","eq":["e14_dpo"]},"e14_embedft":{"k":"I","p":"E14","cl":"azure","t":"Embedding model fine-tuning","s":"Contrastively tune an embedding model on (query, relevant passage) pairs from your domain, ideally with mined hard negatives.","hp":"Helps you lift retrieval recall on jargon-heavy corpora where off-the-shelf embeddings miss.","x":"1K–10K pairs (LLM-generated queries per chunk work) often add 5–15 points recall@10. Mine hard negatives from your current retriever's top hits, dropping false negatives. Re-embed the whole corpus after.","v":"flow:Chunks>LLM writes queries>Mine hard negatives>MNRL loss>Re-index","code":"from sentence_transformers import SentenceTransformer, SentenceTransformerTrainer, losses\nmodel = SentenceTransformer(\"BAAI/bge-base-en-v1.5\")\nloss = losses.MultipleNegativesRankingLoss(model)  # cols: anchor, positive, negative\nSentenceTransformerTrainer(model=model, train_dataset=ds, loss=loss).train()","eq":["e6_embedmodel"]},"e14_rerankft":{"k":"A","p":"E14","cl":"azure","t":"Reranker fine-tuning","s":"Fine-tune a cross-encoder to score (query, passage) relevance on your labeled or judge-labeled data.","hp":"Helps you get domain-precise ranking without touching the index.","x":"No re-indexing needed, so it is cheaper to iterate than embedding tuning. Use graded labels from an LLM judge plus hard negatives; train with BCE or listwise loss. Track nDCG@10 on a held-out query set.","v":"quad:Effort,Gain|Bigger LLM=2,3;Prompt tweak=1,1;Tuned embedder=6,7;Tuned reranker=4,6","eq":["e6_rerank","e14_embedft"]},"e14_tools":{"k":"B","p":"E14","cl":"aws","t":"Open-source fine-tuning stacks","s":"Libraries that wrap data loading, PEFT, quantization and distributed training for open-weight models.","hp":"Helps you pick a stack that fits your GPU budget and how much code you want to write.","x":"TRL for code-first control, Unsloth for single-GPU speed, Axolotl and LLaMA-Factory for YAML/UI configs, torchtune for PyTorch-native recipes. All read chat JSONL and output PEFT adapters.","v":"hub:Fine-tune stack|TRL,Unsloth,Axolotl,LLaMA-Factory,torchtune,PEFT,DeepSpeed"},"e14_trl":{"k":"I","p":"E14","cl":"aws","t":"Hugging Face TRL","s":"Hugging Face's post-training library with trainers for SFT, DPO, ORPO, KTO, GRPO and reward modeling.","hp":"Helps you run any post-training method with a few lines on top of transformers + PEFT.","x":"SFTTrainer handles chat templates, packing and assistant-only loss. Pair with accelerate/FSDP for multi-GPU. The reference implementation most other tools build on.","v":"tree:TRL>SFT,Preference,RL;Preference>DPO,ORPO,KTO;RL>GRPO,PPO","code":"from trl import SFTConfig, SFTTrainer\ntrainer = SFTTrainer(model=\"Qwen/Qwen2.5-7B-Instruct\", train_dataset=ds,\n    peft_config=lora, args=SFTConfig(output_dir=\"out\", num_train_epochs=2,\n    learning_rate=2e-4, assistant_only_loss=True))\ntrainer.train()","eq":["e14_unsloth","e14_axolotl"]},"e14_unsloth":{"k":"I","p":"E14","cl":"aws","t":"Unsloth","s":"An optimized fine-tuning library with custom kernels that speeds up LoRA/QLoRA and cuts memory on a single GPU.","hp":"Helps you fine-tune on one consumer or Colab GPU roughly 2x faster with less VRAM.","x":"Provides pre-quantized model checkpoints and exports straight to GGUF / vLLM / Ollama. Best for single-GPU work; check multi-GPU support for your version before planning a cluster run.","v":"gbars:Speed,VRAM|Baseline=1,1|Unsloth=2,0.4","code":"from unsloth import FastLanguageModel\nmodel, tok = FastLanguageModel.from_pretrained(\n    \"unsloth/Llama-3.1-8B-Instruct-bnb-4bit\", max_seq_length=4096, load_in_4bit=True)\nmodel = FastLanguageModel.get_peft_model(model, r=16, lora_alpha=32,\n    target_modules=[\"q_proj\",\"k_proj\",\"v_proj\",\"o_proj\",\"gate_proj\",\"up_proj\",\"down_proj\"])","eq":["e14_trl","e13_ollama"]},"e14_axolotl":{"k":"I","p":"E14","cl":"aws","t":"Axolotl, LLaMA-Factory & torchtune","s":"Config-driven trainers: describe model, dataset, adapter and hyperparameters in YAML (or a web UI) and launch.","hp":"Helps you make runs reproducible and reviewable as config files instead of notebooks.","x":"Axolotl: YAML, multi-GPU (FSDP/DeepSpeed), many dataset formats. LLaMA-Factory: wide model support plus a web UI. torchtune: PyTorch-native recipes. Commit configs next to eval results.","v":"cmp:#Interface;Strength|Axolotl=YAML;Multi-GPU recipes|LLaMA-Factory=YAML or UI;Model coverage|torchtune=Python recipes;PyTorch-native","code":"base_model: Qwen/Qwen2.5-7B-Instruct\nadapter: qlora\nload_in_4bit: true\nlora_r: 16\nlora_alpha: 32\nlora_target_linear: true\ndatasets:\n  - {path: data/train.jsonl, type: chat_template}\n# axolotl train config.yml","eq":["e14_trl"]},"e14_managed":{"k":"B","p":"E14","cl":"aws","t":"Managed fine-tuning APIs","s":"Hosted services that fine-tune and serve models from an uploaded JSONL: OpenAI, Bedrock, Vertex AI, Together, Fireworks.","hp":"Helps you tune without owning GPUs, and is the only way to tune most closed models.","x":"Closed models (OpenAI, Gemini, some Bedrock models) support SFT and sometimes DPO/RFT; Together/Fireworks tune open weights with LoRA and serve adapters serverless. Check per-token training price and hosting fees.","v":"seq:You,FT API,Model host|1>2:upload JSONL|1>2:create job|2>2:train + eval loss|2>3:deploy model id|1>3:call tuned model","code":"from openai import OpenAI\nc = OpenAI()\nf = c.files.create(file=open(\"train.jsonl\", \"rb\"), purpose=\"fine-tune\")\njob = c.fine_tuning.jobs.create(training_file=f.id, model=\"gpt-4o-mini-2024-07-18\")","eq":["e2_gateway"]},"e14_evalft":{"k":"B","p":"E14","cl":"gcp","t":"Eval before and after tuning","s":"Score the base model, the prompted baseline and the tuned model on the same frozen test set plus general benchmarks.","hp":"Helps you prove fine-tuning beat the cheaper prompt/RAG baseline before you ship it.","x":"Always compare against the best prompted frontier model, not the raw base. Track task metric, format-validity rate, latency and cost per call. Keep a regression suite of general prompts.","v":"gbars:Task acc,Format OK,General|Base=58,70,80|Prompted=74,88,80|Tuned=89,99,77","eq":["e10_edd","e10_ci"]},"e14_overfit":{"k":"B","p":"E14","cl":"multi","t":"Overfitting signals","s":"Training loss keeps falling while validation loss rises or plateaus and outputs start parroting training answers.","hp":"Helps you stop at the right checkpoint instead of shipping a memorizer.","x":"Signs: val loss turning up after epoch 1–2, train loss near 0, verbatim copying, lower output diversity. Fixes: fewer epochs, lower LR, more varied data, early stopping on val metric, eval every N steps.","v":"line:0.5,1,1.5,2,2.5,3|Train loss=1.4,1.0,0.8,0.6,0.4,0.2|Val loss=1.5,1.2,1.1,1.1,1.2,1.4"},"e14_forgetting":{"k":"A","p":"E14","cl":"multi","t":"Catastrophic forgetting checks","s":"Fine-tuning on a narrow task can degrade general skills, safety behavior or instruction following.","hp":"Helps you catch a tuned model that aces your task but breaks everything else.","x":"Run a general suite (e.g. MMLU-style, IFEval, your safety prompts) before/after. Mitigate with LoRA, lower LR, fewer epochs, and mixing 5–20% general instruction data into training.","v":"gbars:Task,General QA,Instruct,Safety|Before=60,80,85,95|After tune=88,77,79,86","eq":["e11_modelupgrad
