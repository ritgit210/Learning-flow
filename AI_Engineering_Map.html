<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Engineering Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --paper:#EDF0EB; --paper2:#F6F8F5; --grid:rgba(30,45,38,.065);
  --ink:#1B2420; --ink2:#3C4842; --muted:#64716B; --card:#FFFFFF; --line:#CDD5CF; --wire:#8F9D96;
  --basic:#2B7A4B; --basic-bg:#E5F1E9;
  --inter:#2659A9; --inter-bg:#E4ECF8;
  --adv:#743FA1; --adv-bg:#EFE7F6;
  --dec:#9A6B00; --dec-bg:#FBF0D6; --dec-line:#E2B33E;
  --entry-bg:#1F2E28; --entry-ink:#F1F5F2; --entry-muted:#B6C4BD;
  --walk:#0E7471; --walk-bg:#E0F1F0;
  --focus:#2659A9; --hl:#E2B33E;
  --v0:#2563A8; --v1:#D9480F; --v2:#2B8A3E; --v3:#7B3FA0; --vg:#A3ADA8; --vbg:#FFFFFF; --vink:#1B2420; --vmut:#66736C;
  --note-bg:#FFF4C2; --note-line:#B08300; --note-ink:#3A3000; --catch:#A8323E; --catch-bg:#FBEAEC;
  --shadow:0 1px 0 rgba(20,30,25,.06), 0 2px 8px rgba(20,30,25,.06);
  --az:#0078D4; --az-bg:#E3F0FB; --aws:#C76E00; --aws-bg:#FCEFD9; --gcp:#188038; --gcp-bg:#E2F3E7; --multi:#5B6B73; --multi-bg:#EEF1F2;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121715; --paper2:#171D1A; --grid:rgba(220,235,228,.045);
    --ink:#E3E9E5; --ink2:#C3CDC8; --muted:#95A39C; --card:#1B2220; --line:#2F3A35; --wire:#5F6E67;
    --basic:#6FC391; --basic-bg:#17271E; --inter:#86AEF0; --inter-bg:#172235;
    --adv:#BD92E2; --adv-bg:#251B2F; --dec:#E6B850; --dec-bg:#2A2313; --dec-line:#8C6C1E;
    --entry-bg:#2C3D36; --entry-ink:#EEF4F0; --entry-muted:#A9BAB2;
    --walk:#5CC7C2; --walk-bg:#13292A; --focus:#86AEF0; --hl:#E6B850;
    --v0:#7FAEF0; --v1:#F08C5A; --v2:#6FC391; --v3:#C29BE6; --vg:#5E6D66; --vbg:#1A211E; --vink:#E3E9E5; --vmut:#95A39C;
    --note-bg:#2E2810; --note-line:#E6B850; --note-ink:#F3E7BE; --catch:#F08C97; --catch-bg:#2E1A1D;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.25);
    --az:#4FA8F0; --az-bg:#14263A; --aws:#F2A33A; --aws-bg:#33250F; --gcp:#5CC27E; --gcp-bg:#14291C; --multi:#9AABB3; --multi-bg:#1E2629;
  }
}
:root[data-theme="dark"]{
    --paper:#121715; --paper2:#171D1A; --grid:rgba(220,235,228,.045);
    --ink:#E3E9E5; --ink2:#C3CDC8; --muted:#95A39C; --card:#1B2220; --line:#2F3A35; --wire:#5F6E67;
    --basic:#6FC391; --basic-bg:#17271E; --inter:#86AEF0; --inter-bg:#172235;
    --adv:#BD92E2; --adv-bg:#251B2F; --dec:#E6B850; --dec-bg:#2A2313; --dec-line:#8C6C1E;
    --entry-bg:#2C3D36; --entry-ink:#EEF4F0; --entry-muted:#A9BAB2;
    --walk:#5CC7C2; --walk-bg:#13292A; --focus:#86AEF0; --hl:#E6B850;
    --v0:#7FAEF0; --v1:#F08C5A; --v2:#6FC391; --v3:#C29BE6; --vg:#5E6D66; --vbg:#1A211E; --vink:#E3E9E5; --vmut:#95A39C;
    --note-bg:#2E2810; --note-line:#E6B850; --note-ink:#F3E7BE; --catch:#F08C97; --catch-bg:#2E1A1D;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.25);
    --az:#4FA8F0; --az-bg:#14263A; --aws:#F2A33A; --aws-bg:#33250F; --gcp:#5CC27E; --gcp-bg:#14291C; --multi:#9AABB3; --multi-bg:#1E2629;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

/* ---------- top bar */
.bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 14px;
  background:var(--paper2);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand h1{margin:0;font-size:19px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.grp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
.grp button{border:0;background:none;padding:5px 9px;cursor:pointer;font-size:13px;white-space:nowrap}
.grp button+button{border-left:1px solid var(--line)}
.grp button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.grp .lbl{padding:5px 3px 5px 9px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover,.grp button:hover:not([aria-pressed="true"]){background:var(--paper)}
.zoomv{min-width:46px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);padding:0 4px}
select.btn{padding-right:6px;max-width:170px}
.search{position:relative}
.search input{width:210px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px}
.results{position:absolute;top:calc(100% + 4px);left:0;width:min(420px,92vw);max-height:60vh;overflow:auto;background:var(--card);
  border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:none;z-index:20}
.results.on{display:block}
.res{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:7px;cursor:pointer}
.res[aria-selected="true"],.res:hover{background:var(--paper)}
.res .dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--c)}
.res b{display:block;font-weight:700;font-size:13.5px}
.res small{display:block;color:var(--muted);font-size:12px}
.res-empty{padding:10px;color:var(--muted);font-size:13px}
body.outline .mapOnly{display:none}

/* ---------- canvas */
#vp{flex:1;min-height:0;overflow:auto;position:relative;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:local;overscroll-behavior:contain}
#vp.drag{cursor:grabbing;user-select:none}
#sizer{position:relative}
#content{position:absolute;left:0;top:0;transform-origin:0 0;padding:60px 70vw 50vh 40px;width:max-content}
#wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#wires path{fill:none;stroke:var(--wire);stroke-width:1.4}
#wires path.d{stroke-dasharray:5 4;opacity:.85}
#wires .ah{fill:var(--wire)}

.subtree{display:flex;align-items:center}
.kids{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-left:46px}
.subtree.closed>.kids{display:none}
.branch{display:flex;align-items:center}
.elabel{max-width:188px;margin-right:22px;padding:4px 9px 5px;font-size:12px;line-height:1.3;color:var(--ink2);
  background:var(--paper2);border:1px solid var(--line);border-radius:10px}
.elabel b{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:2px}
.elabel.dash{border-style:dashed}
.elabel{padding:0}
.ehead{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 9px 5px;cursor:pointer;border-radius:9px;line-height:1.3}
.ehead:hover{background:var(--card)}
.ehead b{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:2px}
.emark{display:inline-block;margin-left:5px;min-width:15px;height:15px;line-height:13px;text-align:center;border:1px solid var(--line);border-radius:50%;font-size:11px;font-weight:700;color:var(--muted);vertical-align:1px}
.elabel.eopen{width:310px;max-width:310px;background:var(--card);border-color:var(--ink2);box-shadow:var(--shadow);--c:var(--ink)}
.edet{padding:0 10px 10px;font-size:12.5px;line-height:1.48;color:var(--ink);border-top:1px solid var(--line)}
.edet h5{margin:8px 0 2px;font-size:11.5px;font-weight:800;color:var(--muted)}
.edet p{margin:0}
.edet .eft{margin-top:7px}
.edet .ewk{margin-top:3px}
.elabel.st{color:var(--muted);font-style:italic;border-color:transparent;background:transparent;padding:2px 0}

/* ---------- cards */
.card{position:relative;width:280px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:9px;box-shadow:var(--shadow);--c:var(--wire);--cbg:var(--paper2);transition:width .18s ease}
.card.dopen{width:380px}
.k-B{--c:var(--basic);--cbg:var(--basic-bg)} .k-I{--c:var(--inter);--cbg:var(--inter-bg)} .k-A{--c:var(--adv);--cbg:var(--adv-bg)}
.k-Q{--c:var(--dec);--cbg:var(--dec-bg);background:var(--dec-bg);border-color:var(--dec-line);border-left-color:var(--dec)}
.k-S,.k-root{--c:var(--entry-ink);background:var(--entry-bg);border-color:var(--entry-bg);color:var(--entry-ink)}
.k-root{width:300px}.k-root.dopen{width:400px}
.k-guide{--c:var(--muted)} .k-walk,.k-step{--c:var(--walk);--cbg:var(--walk-bg)} .k-note{--c:var(--dec);background:var(--dec-bg)}
.card.link{background:transparent;border:1.5px dashed var(--wire);border-left:4px solid var(--c);box-shadow:none}
.card.link.k-S{--c:var(--ink);color:var(--ink);border-color:var(--wire);border-left-color:var(--ink)}
.card.link.k-S .tagrow .sec,.card.link.k-S .ex,.card.link.k-S .blk h4{color:var(--muted)}
.card.link.k-S .details{border-top-color:var(--line)}
.card.link.k-S .acts button{background:var(--card);color:var(--ink);border-color:var(--line)}
.head{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px 6px;cursor:pointer;border-radius:8px}
.tagrow{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;line-height:1.2;color:var(--c);font-weight:700}
.tagrow .sec{color:var(--muted);font-weight:600}
.k-S .tagrow .sec,.k-root .tagrow .sec{color:var(--entry-muted)}
.secname{display:block;font-size:12.5px;font-weight:700;color:var(--entry-muted);margin-top:5px;line-height:1.3}
.title{display:block;font-size:14.5px;font-weight:700;line-height:1.28;margin-top:4px}
.k-root .title{font-size:19px;font-weight:800;letter-spacing:-.01em}
.ex{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.k-S .ex,.k-root .ex{color:var(--entry-muted)}
.acts{display:flex;flex-wrap:wrap;gap:5px;padding:2px 10px 9px}
.acts button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:3px 7px;font-size:11.5px;cursor:pointer}
.acts button:hover{border-color:var(--c)}
.k-S .acts button,.k-root .acts button{background:transparent;color:var(--entry-ink);border-color:rgba(255,255,255,.25)}
.k-Q .acts button{background:transparent}
.acts .open{font-weight:700}
.kc{position:absolute;right:-12px;top:50%;transform:translateY(-50%);min-width:23px;height:23px;padding:0 5px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);border:1.5px solid var(--wire);
  font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;pointer-events:none;z-index:1}
.k-S .kc,.k-root .kc{background:var(--entry-bg);color:var(--entry-ink);border-color:var(--entry-muted)}
.k-Q .kc{background:var(--dec-bg);border-color:var(--dec-line)}
.head:hover .title{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}

.details{border-top:1px solid var(--line);padding:8px 12px 12px;font-size:13px;line-height:1.5}
.k-S .details,.k-root .details{border-top-color:rgba(255,255,255,.18)}
.blk{margin-top:9px}
.blk:first-child{margin-top:2px}
.blk h4{margin:0 0 3px;font-size:11.5px;font-weight:800;color:var(--c);letter-spacing:.01em}
.k-S .blk h4,.k-root .blk h4{color:var(--entry-muted)}
.blk p{margin:0}
.scn{font-style:italic;color:var(--ink2)}
.k-S .scn{color:var(--entry-ink)}
.item{padding:6px 0 7px;border-top:1px dashed var(--line)}
.item:first-of-type{border-top:0;padding-top:2px}
.jump{color:var(--c);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.k-S .jump,.k-root .jump{color:var(--entry-ink)}
.eid{font-weight:800;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.stats div{background:rgba(255,255,255,.08);border-radius:7px;padding:6px 7px}
.stats b{display:block;font-size:18px;line-height:1.1;font-weight:800}
.stats span{font-size:11.5px;color:var(--entry-muted)}
.lg{display:flex;align-items:center;gap:8px;margin-top:5px}
.sw{flex:none;width:28px;height:16px;border-radius:4px;border:1px solid var(--line);border-left:4px solid var(--s);background:var(--b)}
.mrow{display:flex;gap:8px;align-items:baseline}
.mrow .pp{flex:none;font-weight:800;font-variant-numeric:tabular-nums;min-width:66px}
.gobtn{margin-top:8px;border:1px solid var(--c);background:var(--cbg);color:var(--ink);border-radius:7px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer}

.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--hl)}20%{box-shadow:0 0 0 6px var(--hl)}100%{box-shadow:0 0 0 0 transparent}}

/* dimming for study passes */
body[data-pass="B"] .card.k-I, body[data-pass="B"] .card.k-A, body[data-pass="BI"] .card.k-A{opacity:.3}
.elabel.flash{animation:flash 1.6s ease-out}
body[data-pass="B"] .card.k-I:hover, body[data-pass="B"] .card.k-A:hover, body[data-pass="BI"] .card.k-A:hover{opacity:.75}

/* legend */
.legend{position:absolute;left:12px;bottom:12px;z-index:4;display:flex;flex-wrap:wrap;gap:6px 12px;max-width:calc(100% - 24px);
  background:var(--paper2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px;color:var(--ink2);box-shadow:var(--shadow)}
.legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--b);border:1px solid var(--line);border-left:3px solid var(--s)}
.legend .x{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 0 0 4px;font-size:13px}
.wrap{flex:1;min-height:0;position:relative;display:flex}


.sticky{margin-top:10px;padding:8px 10px 9px;background:var(--note-bg);border-left:3px solid var(--note-line);border-radius:4px 8px 8px 4px;color:var(--note-ink)}
.sticky h4{margin:0 0 2px;font-size:11.5px;font-weight:800;color:var(--note-line)!important}
.sticky p{margin:0;font-weight:600}
.catch{margin-top:8px;padding:6px 9px 7px;border-radius:6px;background:var(--catch-bg);border-left:3px solid var(--catch)}
.catch h5{margin:0 0 2px!important;color:var(--catch)!important}
.like{font-style:italic;color:var(--ink2)}
.k-S .like{color:var(--entry-ink)}
.ex.hint{font-style:italic}
.ehead{display:flex;align-items:baseline;gap:6px}
.enum{flex:none;font-size:10.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.etxt{flex:1;font-weight:600;color:var(--ink)}
.emark{flex:none}
.edet .efrom{margin-top:9px;font-size:11.5px;color:var(--muted)}
.edet .eft{font-weight:700}
.k-S .sticky,.k-root .sticky{color:var(--note-ink)}


.full{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;font-style:italic}
.k-S .full{color:var(--entry-muted)}
.fullv{font-weight:700}
.sibs{display:flex;flex-direction:column;gap:3px}
.sib{margin:0}


.vizwrap{margin-top:2px;border:1px solid var(--line);border-radius:8px;background:var(--vbg);padding:4px;overflow:hidden}
.vizwrap svg.viz{display:block;width:100%;height:auto;font-family:var(--font)}
.fx{font-family:"Cambria Math","STIX Two Math","Latin Modern Math",Georgia,"Times New Roman",serif;font-size:14px;line-height:1.5;background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;overflow-x:auto;white-space:nowrap}
.card.dopen{width:400px}


/* ---------- cloud styling */
.card.cl-azure{border-left-color:var(--az)} .card.cl-aws{border-left-color:var(--aws)} .card.cl-gcp{border-left-color:var(--gcp)} .card.cl-multi{border-left-color:var(--multi)}
.card.cl-azure:not(.link){background:linear-gradient(90deg,var(--az-bg),var(--card) 46%)}
.card.cl-aws:not(.link){background:linear-gradient(90deg,var(--aws-bg),var(--card) 46%)}
.card.cl-gcp:not(.link){background:linear-gradient(90deg,var(--gcp-bg),var(--card) 46%)}
.cl-azure{--cc:var(--az)} .cl-aws{--cc:var(--aws)} .cl-gcp{--cc:var(--gcp)} .cl-multi{--cc:var(--multi)}
.tagrow .kind{display:inline-flex;align-items:center;gap:5px}
.cbadge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;color:#fff;background:var(--cc);border-radius:9px;padding:1px 7px 1px 6px;letter-spacing:.02em}
.lvl{font-size:10.5px;font-weight:700;border:1px solid currentColor;border-radius:9px;padding:0 6px;opacity:.95}
.lvl-B{color:var(--basic)} .lvl-I{color:var(--inter)} .lvl-A{color:var(--adv)}
.k-S .lvl,.k-root .lvl{color:var(--entry-muted)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.5;background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.eqrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.eqbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--cc);background:var(--card);color:var(--ink);border-radius:7px;padding:3px 8px;font-size:12px;font-weight:700;cursor:pointer}
.eqbtn i{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.eqbtn:hover{background:var(--paper)}
.rel{display:flex;flex-direction:column;gap:3px}
.rel a{font-size:12.5px}
body[data-cloud="azure"] .card.cl-aws,body[data-cloud="azure"] .card.cl-gcp,
body[data-cloud="aws"] .card.cl-azure,body[data-cloud="aws"] .card.cl-gcp,
body[data-cloud="gcp"] .card.cl-azure,body[data-cloud="gcp"] .card.cl-aws{opacity:.28}
.grp button[data-cloud="azure"][aria-pressed="true"]{background:var(--az);color:#fff}
.grp button[data-cloud="aws"][aria-pressed="true"]{background:var(--aws);color:#fff}
.grp button[data-cloud="gcp"][aria-pressed="true"]{background:var(--gcp);color:#fff}

/* ---------- top-down layout (map view only) */
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
body.td:not(.outline) #content{padding:44px 50vw 60vh 40px}
body.td:not(.outline) .subtree{flex-direction:column;align-items:center}
body.td:not(.outline) .kids{flex-direction:row;align-items:flex-start;padding-left:0;padding-top:42px;gap:18px}
body.td:not(.outline) .branch{flex-direction:column;align-items:center}
body.td:not(.outline) .elabel{margin:0 0 18px;max-width:176px}
body.td:not(.outline) .elabel.eopen{width:300px;max-width:300px}
body.td:not(.outline) .card{width:236px}
body.td:not(.outline) .card.dopen{width:380px}
body.td:not(.outline) .kc{right:auto;left:50%;top:auto;bottom:-12px;transform:translateX(-50%)}


/* ---------- overview panel */
#ov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--paper);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#ov[hidden]{display:none}
.ovbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 14px;background:var(--paper2);border-bottom:1px solid var(--line)}
.ovtitle{font-size:16px;font-weight:800}
.ovhint{font-size:12px;color:var(--muted);margin-right:auto}
#ovsel{max-width:260px}
#ovbox{flex:1;min-height:0;overflow:auto;cursor:grab;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;background-attachment:local}
#ovbox.drag{cursor:grabbing}
#ovbox svg{display:block;margin:0 auto}
.ovnode{cursor:pointer}
.ovnode:hover rect{stroke-width:3}
.ovflash rect{animation:ovfl 1.8s ease-out}
@keyframes ovfl{0%,55%{stroke:var(--hl);stroke-width:6}100%{}}
body.ovopen .legend{display:none}
#printroot{display:none}
@media (max-width:760px){ .ovhint{display:none} .ovbar{gap:6px} }
@media print{
  @page{size:A3 landscape;margin:10mm}
  html,body{height:auto!important;overflow:visible!important;display:block!important;background:#fff!important}
  body>*:not(#printroot){display:none!important}
  #printroot{display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact;
    --paper:#FFFFFF;--paper2:#F6F8F5;--ink:#1B2420;--ink2:#3C4842;--muted:#64716B;--card:#FFFFFF;--line:#CDD5CF;--wire:#8F9D96;
    --basic:#2B7A4B;--basic-bg:#E5F1E9;--inter:#2659A9;--inter-bg:#E4ECF8;--adv:#743FA1;--adv-bg:#EFE7F6;--entry-bg:#1F2E28;--entry-ink:#F1F5F2;--entry-muted:#B6C4BD;--az:#0078D4;--az-bg:#E3F0FB;--aws:#C76E00;--aws-bg:#FCEFD9;--gcp:#188038;--gcp-bg:#E2F3E7;--multi:#5B6B73;--multi-bg:#EEF1F2;color:#1B2420}
  .ppage{break-after:page;page-break-after:always}
  .ppage:last-child{break-after:auto;page-break-after:auto}
  .ppage h2{font-family:var(--font);font-size:18px;margin:0 0 8px}
  .pbox svg{display:block}
}

/* ---------- outline view (also used on phones) */
body.outline #sizer{width:auto!important;height:auto!important}
body.outline #content{position:static;transform:none!important;width:auto;padding:16px 14px 90px}
body.outline #wires{display:none}
body.outline .subtree{flex-direction:column;align-items:stretch}
body.outline .kids{padding-left:14px;margin-left:12px;border-left:2px solid var(--line);gap:10px;padding-top:10px}
body.outline .branch{flex-direction:column;align-items:stretch}
body.outline .elabel{max-width:none;margin:0 0 5px;align-self:flex-start}
body.outline .elabel.eopen{width:auto;max-width:720px;align-self:stretch}
body.outline .kc{top:9px;right:9px;transform:none}
body.outline .tagrow .sec{margin-right:30px}
body.outline .card,body.outline .card.dopen,body.outline .k-root{width:auto;max-width:720px}
@media (max-width:760px){
  .bar{padding:8px 10px;gap:7px}
  .brand h1{font-size:17px}
  .brand p{display:none}
  .search{flex:1 1 100%} .search input{width:100%}
  .ctrls{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:3px;scrollbar-width:none}
  .ctrls::-webkit-scrollbar{display:none}
  .ctrls>*{flex:none}
  .grp .lbl{display:none}
  .legend{display:none}
  body.outline .kids{padding-left:6px;margin-left:3px;border-left-width:1.5px;gap:8px;padding-top:8px}
  body.outline #content{padding:12px 8px 90px}
  .head{padding:8px 10px 5px} .acts{padding:2px 8px 8px} .details{padding:8px 10px 11px}
}
@media (prefers-reduced-motion:reduce){
  .card{transition:none}
  .flash{animation:none;outline:3px solid var(--hl);outline-offset:2px}
}

  <div id="ovbox"></div>
</div>
<script>/* AI engineering visualization library: VIZ.render(spec) -> SVG markup. Every drawing is generated here; nothing is fetched. */
const VIZ = (function(){
"use strict";
const W = 320, H = 190;
const C = ["var(--v0)","var(--v1)","var(--v2)","var(--v3)"], G = "var(--vg)", INK = "var(--vink)", MUT = "var(--vmut)";

const AZ = CL.azure, AW = CL.aws, GC = CL.gcp;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function svg(inner, w, h){ return `<svg class="viz" viewBox="0 0 ${w||W} ${h||H}" role="img" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`; }
function T(x,y,s,o){ o=o||{}; return `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${o.fs||9.5}" fill="${o.c||INK}" text-anchor="${o.a||"middle"}" font-weight="${o.b?700:400}"${o.it?' font-style="italic"':''}${o.mono?' font-family="ui-monospace,Menlo,Consolas,monospace"':''}>${esc(s)}</text>`; }

function A(x1,y1,x2,y2,c,dash,w){ c=c||MUT; const a=Math.atan2(y2-y1,x2-x1), s=6;
  const p1=[x2-s*Math.cos(a-0.45), y2-s*Math.sin(a-0.45)], p2=[x2-s*Math.cos(a+0.45), y2-s*Math.sin(a+0.45)];

function wrap(s, max){ const words=[]; String(s).split(/\s+/).forEach(w=>{ while (w.length>max){ let k=w.lastIndexOf("/",max-1); k=k>2?k+1:max-1; words.push(w.slice(0,k)+(w[k-1]==="/"?"":"-")); w=w.slice(k); } if (w) words.push(w); }); const out=[]; let cur="";
  for (const w of words){ if (!cur) cur=w; else if ((cur+" "+w).length<=max) cur+=" "+w; else { out.push(cur); cur=w; } } if (cur) out.push(cur); return out; }

const isActor = s => /^(users?|clients?|browser|mobile|devices?|app|apps|developer|dev|on-?prem|internet|sources?|customers?|agents?|callers?|data sources?)$/i.test(String(s).trim());
const icon = {
  server:(x,y,c)=>R(x,y,14,5,c,c,1,0.5)+R(x,y+6,14,5,c,c,1,0.5)+Ci(x+11,y+2.5,0.9,INK)+Ci(x+11,y+8.5,0.9,INK),

const R2 = {};
/* ---------- generic */
function flowDraw(items,loop){ let s=""; const n=items.length, rows=n>5?2:1, per=Math.ceil(n/rows), bw=Math.min(84,(W-20-(per-1)*14)/per), bh=36; const pos=[];

R2.flow = spec => { const [it,opt]=spec.split("|"); return flowDraw(it.split(">").map(x=>x.trim()).filter(Boolean),opt==="loop"); };
R2.arch = spec => { const i=spec.indexOf(":"), cloud=spec.slice(0,i), cols=spec.slice(i+1).split(">").map(c=>c.split(",").map(x=>x.trim()).filter(Boolean)).filter(c=>c.length);
  const col=CL[cloud]||C[0], n=cols.length, gap=n>4?12:16, bw=Math.min(78,(W-20-(n-1)*gap)/n), top=26; let s="";

  for(let ci=0;ci<n-1;ci++){ const a=pos[ci], b=pos[ci+1];

  const rhs=wrapped.map(r=>Math.max(r[0].length,...r[1].map(v=>v.length))*10+8); const hh=22+rhs.reduce((a,b)=>a+b,0)+4; let s="";
  [["Azure",AZ],["AWS",AW],["Google Cloud",GC]].forEach(([n2,c],j)=>{ const x=4+lw+j*cw; s+=R(x+1,4,cw-2,17,c,c,4,0.85)+T(x+cw/2,16,n2,{b:true,c:"#fff",fs:9}); });
  let y=24; wrapped.forEach((r,i)=>{ const h=rhs[i]; if (i%2===0) s+=R(4,y,W-8,h,G,null,3,0.1);
    r[0].forEach((ln,k)=>s+=T(8,y+12+k*10-(r[0].length-1)*0+((h-8-r[0].length*10)/2),ln,{a:"start",fs:8,b:true,c:MUT}));
    r[1].forEach((v,j)=>{ const x=4+lw+j*cw+cw/2; v.forEach((ln,k)=>s+=T(x,y+12+k*10+((h-8-v.length*10)/2),ln,{fs:8.2,b:i===0})); });
    y+=h; });

R2.table = spec => { const rows=spec.split("|").map(r=>r.split(",").map(c=>c.trim())); const nc=rows[0].length, cw=Math.min(100,(W-16)/nc), x0=(W-cw*nc)/2, maxc=Math.floor(cw/4.6);

<script type="application/json" id="data">{"nodes":{"ROOT":{"k":"root","t":"AI Engineering Map","s":"Build, evaluate, ship and operate LLM-powered products. Every card is a technique, tool, practice or concept; every arrow says when to use it.","hp":"Open a card's Details for a diagram, key points and a code example. Click an arrow's ? to see why it fits and the trade-off.","stats":[[17,"topics"],[458,"terms"],[635,"arrows"]]},"E1":{"k":"S","p":"E1","t":"AI Engineering Foundations","s":"The working mindset of an AI engineer: treating models as APIs, token economics, model choice and the failure modes you design around.","hp":"Every later decision (prompting, RAG, agents, evals) rests on these cost, quality and reliability basics.","x":"role & stack, build loop, LLM vs rules, tokens & context, non-determinism, failure modes, model selection, open vs closed weights","v":"hub:AI engineering|Build loop,Tokens,Model choice,Failure modes,Evals,Stack layers","sec":{"pid":"E1","num":1,"title":"AI Engineering Foundations","short":"Foundations"}},"e1_role":{"k":"B","p":"E1","cl":"multi","t":"What an AI engineer does","s":"Builds products on top of pretrained foundation models: prompts, context, tools, evals and ops, rather than training models from scratch.","hp":"Helps you scope the job: product + data + evals, not GPU training runs.","x":"Day-to-day: wire model APIs into apps, design context (RAG, tools), write evals, watch cost/latency, ship and monitor. Training is the exception (fine-tune only after prompting + RAG plateau).","v":"fanin:Product sense,Software eng,Eval rigor,Data wrangling|AI engineer"},"e1_roles_cmp":{"k":"B","p":"E1","cl":"multi","t":"AI vs ML vs software engineer","s":"How the AI engineer role differs from ML engineers (train/serve models) and software engineers (deterministic systems).","hp":"Helps you know which skills to borrow from each neighbor role.","x":"SWE: deterministic code, unit tests. MLE: datasets, training, feature pipelines, model metrics. AI eng: model is a fixed API, quality comes from context + evals; tests become statistical pass rates.","v":"cmp:#SWE;MLE;AI eng|Core artifact=code;trained model;prompt+context|Testing=unit tests;holdout metrics;eval suites|Data need=little;large labeled;tens of examples|Iteration=hours;days to weeks;minutes"},"e1_modelasapi":{"k":"B","p":"E1","cl":"multi","t":"Model-as-API mindset","s":"Treat the LLM as a remote, versioned, probabilistic dependency you call over HTTP, with cost, latency, rate limits and SLAs.","hp":"Helps you design for swaps, outages and price changes from day one.","x":"Wrap calls behind one internal interface; keep model id in config, not code. Log every request/response with model version. Assume the provider will deprecate your model within ~12 months.","v":"seq:App,Wrapper,Provider|1>2:task(input)|2>2:build prompt|2>3:POST /messages|3>2:text + usage|2>1:typed result","code":"# one seam for every model call\nMODEL = os.getenv(\"LLM_MODEL\", \"claude-sonnet-5-5\")\ndef complete(prompt: str, **kw) -> str:\n    r = client.messages.create(model=MODEL, max_tokens=1024,\n        messages=[{\"role\": \"user\", \"content\": prompt}], **kw)\n    log_call(MODEL, r.usage)\n    return r.content[0].text","eq":["e2_gateway","e2_messages"]},"e1_stack":{"k":"I","p":"E1","cl":"multi","t":"AI engineering stack layers","s":"The layered view: application/UX on top, orchestration (prompts, RAG, agents, evals), model layer, then infra (GPUs, serving, gateways).","hp":"Helps you place each tool and decide what to build vs buy.","x":"Most value and differentiation live in app + orchestration. Model and infra layers are usually bought (APIs, managed hosting) unless cost, privacy or latency force self-hosting.","v":"stack:App and UX,Orchestration,Evals and tracing,Model APIs,Serving infra|2","eq":["e9_frameworks","e13_vllm"]},"e1_buildloop":{"k":"B","p":"E1","cl":"gcp","t":"The AI build loop","s":"Iterative cycle: prototype fast, build an eval set, ship behind flags, monitor production traces, feed failures back into evals.","hp":"Helps you replace guesswork with a measurable improvement loop.","x":"Prototype in hours with a frontier model. Write 20-50 eval cases before polishing. Ship to a slice of traffic, log everything, mine failures weekly, add them to the eval set, repeat.","v":"flow:Prototype>Eval set>Ship behind flag>Monitor traces>Mine failures|loop","eq":["e10_edd","e11_flywheel"]},"e1_vibes_evals":{"k":"I","p":"E1","cl":"gcp","t":"Vibes vs evals","s":"Moving from eyeballing a few outputs (vibe checks) to scored test sets that measure quality before and after each change.","hp":"Helps you prove a prompt or model change helped instead of hoping.","x":"Vibes are fine for the first hour. After that: fixed cases, explicit pass criteria, a score per run. Even 30 cases catch most regressions; grow from real failures.","v":"line:Day 1,Week 1,Week 2,Week 4,Week 8|Vibes only=60,65,62,64,61|With evals=60,70,78,84,88","code":"cases = load_jsonl(\"evals/support.jsonl\")\npassed = sum(check(c[\"expected\"], complete(c[\"input\"])) for c in cases)\nprint(f\"pass rate {passed/len(cases):.0%}\")","eq":["e10_golden","e10_edd"]},"e1_llm_vs_rules":{"k":"B","p":"E1","cl":"multi","t":"LLM vs rules vs classical ML","s":"Choosing the simplest tool that works: regex/rules for fixed patterns, classical ML for high-volume labeled tasks, LLMs for open-ended language.","hp":"Helps you avoid paying LLM latency and cost where a regex would do.","x":"Rules: deterministic, near-free, brittle to variety. Classical ML: cheap at scale, needs ~1k+ labels. LLM: zero-shot, handles messy text, costs cents and seconds. A common pattern: LLM labels data, small model serves.","v":"quad:Input variety,Volume|Regex rules=2,8;Classic ML=5,9;LLM=9,3;LLM then distill=8,8;Human=9,1","eq":["e14_distill","e12_routing"]},"e1_decompose":{"k":"A","p":"E1","cl":"azure","t":"Task decomposition","s":"Splitting a fuzzy job into smaller steps, each solved by code, a rule, or a narrow LLM call with its own check.","hp":"Helps you raise reliability and debug which step failed.","x":"Rule of thumb: if one prompt has 5+ distinct instructions or mixes extraction with judgment, split it. Use code for anything deterministic (math, dates, lookups). Each step gets its own eval.","v":"tree:Answer ticket>Classify,Retrieve,Draft,Check;Classify>LLM small;Retrieve>Code search;Check>Rules + LLM","code":"# pseudo: each step narrow and testable\ncat = classify(ticket)            # small model\ndocs = search_kb(cat, ticket)     # plain code\ndraft = write_reply(ticket, docs) # frontier model\nassert passes_policy(draft)       # rules","eq":["e3_chaining","e9_workflows_vs_agents"]},"e1_jagged":{"k":"A","p":"E1","cl":"multi","t":"Jagged frontier","s":"Model capability is uneven: superhuman on some tasks, surprisingly weak on neighboring ones that look equally easy to humans.","hp":"Helps you test each sub-task instead of assuming competence transfers.","x":"Classic weak spots: exact counting, character-level ops, long arithmetic, spatial layout, very recent facts. Strengths can flip between model versions, so re-probe after upgrades.","v":"bars:Summarize=92,Code edit=85,Classify=90,Count letters=55,Long arithmetic=60,Recent facts=40"},"e1_tokens":{"k":"B","p":"E1","cl":"multi","t":"Tokens & token math","s":"Models read and bill in tokens (sub-word pieces); ~1 token is about 3/4 of an English word, about 4 characters.","hp":"Helps you estimate cost, latency and context fit before you build.","x":"1k tokens is about 750 words. Prices are per million tokens (Mtok), output usually 4-5x input. Code, JSON, non-English text and numbers tokenize worse, often 1.5-3x more tokens per word.","v":"table:Text,Words,Tokens|Tweet,40,55|Email,200,270|10-page doc,5k,6.7k|Novel,90k,120k|Python file,n/a,1 per 3 chars","f":"tok, BPE pieces","code":"words = len(text.split())\nest_tokens = int(words / 0.75)\ncost = est_tokens/1e6*IN_PRICE + out_tokens/1e6*OUT_PRICE","eq":["e5_budget","e12_costmodel"]},"e1_tokenizers":{"k":"I","p":"E1","cl":"multi","t":"Tokenizer differences","s":"Each model family has its own tokenizer, so the same text yields different token counts and therefore different cost and context usage.","hp":"Helps you compare prices fairly across providers.","x":"Counts for the same input can differ 10-35% between families or even model generations. Use the provider's own counter (tiktoken for OpenAI, count_tokens endpoint for Claude) rather than one tokenizer for all.","v":"gbars:English,Code,Japanese|Tokenizer A=100,100,100|Tokenizer B=110,90,140|Tokenizer C=125,115,80","code":"import tiktoken\nenc = tiktoken.encoding_for_model(\"gpt-4o\")\nprint(len(enc.encode(text)))   # OpenAI only\n# Claude: client.messages.count_tokens(model=..., messages=...)","eq":["e1_tokens"]},"e1_pricing":{"k":"B","p":"E1","cl":"gcp","t":"Token pricing math","s":"Estimating per-request and monthly cost from input tokens, output tokens and per-Mtok prices, including cached and batch discounts.","hp":"Helps you kill unprofitable features before building them.","x":"cost = in_tok x in_price + out_tok x out_price (per 1M). Example: 3k in + 500 out at $3/$15 is $0.0165; at 100k req/day that's about $50k/month. Cache reads ~10% of input price; batch ~50% off.","v":"bars:Input 3k tok=9,Output 500 tok=7.5,Cached input=0.9,Batch total=8.3","code":"def cost(in_tok, out_tok, p_in=3.0, p_out=15.0):\n    return in_tok/1e6*p_in + out_tok/1e6*p_out\nmonthly = cost(3000, 500) * 100_000 * 30  # ~ $49.5k","eq":["e12_costmodel","e12_promptcaching","e2_batchapi"]},"e1_context":{"k":"B","p":"E1","cl":"multi","t":"Context window & output limits","s":"The max tokens a model can attend to per request (input + output), plus a separate, much smaller cap on generated output tokens.","hp":"Helps you size prompts and avoid silent truncation.","x":"Typical late-2026: 200k-1M context, 8k-128k max output. Quality degrades well before the limit on needle-style recall; budget ~50-70% of the window. Long output needs streaming to avoid HTTP timeouts.","v":"ctx:System=5,Tools=8,Retrieved docs=40,History=25,Question=2,Output=12,Free=8|200K","eq":["e5_budget","e5_compaction"]},"e1_nondeterminism":{"k":"I","p":"E1","cl":"multi","t":"Non-determinism","s":"Same input can yield different outputs due to sampling, batching and floating-point effects, even at temperature 0.","hp":"Helps you design tests and UX that tolerate variance.","x":"Temperature 0 reduces but does not remove variance (GPU batch effects, MoE routing). Seeds are best-effort. Evaluate with multiple runs (e.g. 3-5) and report pass rate, not a single pass/fail.","v":"bars:Run 1=1,Run 2=1,Run 3=0,Run 4=1,Run 5=1","code":"outs = [complete(prompt, temperature=0) for _ in range(5)]\nprint(len(set(outs)), \"distinct outputs of 5\")\npass_rate = sum(map(grade, outs)) / len(outs)","eq":["e10_edd","e2_retries"]},"e1_failmodes":{"k":"I","p":"E1","cl":"multi","t":"Failure-mode taxonomy","s":"A shared vocabulary for how LLM features fail: hallucination, refusal, format drift, instruction drift, latency/cost blowups.","hp":"Helps you label errors so fixes target the right cause.","x":"Tag every bad trace with one primary failure mode; counts tell you whether to fix retrieval, prompts, schemas or model choice. Format issues are cheap to fix; hallucination needs grounding.","v":"tree:Failure>Content,Form,Behavior;Content>Hallucination,Stale facts;Form>Format drift,Truncation;Behavior>Refusal,Ignores rules","eq":["e10_erroranalysis","e6_ragfailures"]},"e1_hallucination":{"k":"B","p":"E1","cl":"multi","t":"Hallucination","s":"Confident output that is false or unsupported by the provided context, e.g. invented citations, APIs, numbers or policy.","hp":"Helps you pick grounding and verification over hoping.","x":"Mitigate: ground with retrieved sources, ask for quotes/citations, allow \"I don't know\", verify with code or a second check. Detect with groundedness evals against the context.","v":"flow:Question>Retrieve sources>Answer with quotes>Check support>Abstain if weak","code":"SYSTEM = (\"Answer only from <docs>. Quote the supporting sentence. \"\n          \"If the docs do not contain the answer, say \\\"I don't know\\\".\")","eq":["e6_citations","e10_ragmetrics"]},"e1_format_drift":{"k":"A","p":"E1","cl":"multi","t":"Format & instruction drift","s":"Output slowly violates the requested format or rules: extra prose around JSON, ignored length limits, forgotten constraints in long chats.","hp":"Helps you add validators instead of trusting the prompt.","x":"Drift rises with long contexts, many instructions and model upgrades. Fix with structured outputs, validate-and-retry, re-stating key rules near the end, and regression evals per model version.","v":"line:Turn 1,Turn 5,Turn 10,Turn 20,Turn 40|Rule compliance=98,95,90,82,70","code":"from pydantic import BaseModel, ValidationError\nclass Out(BaseModel):\n    label: str\n    score: float\ntry: Out.model_validate_json(raw)\nexcept ValidationError: raw = retry_with_error(raw)","eq":["e4_validation","e4_constrained"]},"e1_refusal":{"k":"I","p":"E1","cl":"multi","t":"Refusals & over-refusal","s":"The model declines a legitimate request (over-refusal) or a safety filter stops output, often signaled by a refusal stop reason.","hp":"Helps you detect and handle declines rather than show blank answers.","x":"Check stop reason / finish reason before reading content. Reduce false refusals with clear legitimate context in the system prompt. Track refusal rate per route; spikes often follow model upgrades.","v":"fan:Request|Answered,Partial answer,Over-refusal,Policy refusal","eq":["e15_guardrails"]},"e1_modelselect":{"k":"I","p":"E1","cl":"gcp","t":"Model selection","s":"Choosing among frontier, small, open-weight and reasoning models per task, using your own evals on quality, cost and latency.","hp":"Helps you pay for capability only where the task needs it.","x":"Start with a frontier model to find the quality ceiling, then try cheaper tiers on the same eval. Reasoning models for multi-step logic/code; small models for classification/extraction at volume.","v":"table:Need,Pick,Why|Hard reasoning,Reasoning model,Accuracy|High volume,Small model,Cost|Data residency,Open weights,Control|Low latency,Small or fast,TTFT|Unknown,Frontier first,Find ceiling","code":"for m in [\"frontier-large\", \"mid-tier\", \"small-fast\"]:\n    r = run_eval(cases, model=m)\n    print(m, r.pass_rate, r.p95_latency, r.cost_per_1k)","eq":["e12_routing","e11_modelupgrade"]},"e1_triangle":{"k":"B","p":"E1","cl":"multi","t":"Capability-cost-latency triangle","s":"Trade-off: more capable models cost more per token and respond slower; you can usually optimize two of the three.","hp":"Helps you state requirements as budgets, not wishes.","x":"Set explicit targets per route, e.g. p95 < 2 s, < $0.01/request, >= 90% eval pass. Levers: smaller model, caching, shorter prompts, routing, batch for offline work.","v":"quad:Cost per Mtok,Capability|Small model=1,4;Mid tier=4,7;Frontier=8,9;Reasoning max=10,10;Open 8B=1,3","eq":["e12_latency","e12_costmodel"]},"e1_reasoning_models":{"k":"A","p":"E1","cl":"multi","t":"Reasoning vs non-reasoning models","s":"Reasoning models spend hidden thinking tokens before answering; better on math, code and planning, slower and costlier per call.","hp":"Helps you decide where extra thinking tokens pay off.","x":"Control depth with effort / thinking settings rather than prompts like \"think step by step\". Thinking tokens bill as output. Low effort is often fine for chat and extraction; raise it for multi-step tasks.","v":"gbars:Math,Extraction,Chat|Non-reasoning=55,90,88|Reasoning=88,91,89","eq":["e1_triangle"]},"e1_small_models":{"k":"A","p":"E1","cl":"azure","t":"Small-model specialization","s":"Using small or distilled models (fast tier, ~1-20B open models) for narrow high-volume tasks, often tuned on frontier-labeled data.","hp":"Helps you cut cost 10-50x on routine, well-defined tasks.","x":"Works for classification, extraction, routing, rewriting. Generate labels with a frontier model, verify a sample, fine-tune or few-shot a small model, then gate with the same eval.","v":"ladder:Frontier zero-shot,Small few-shot,Small fine-tuned,Distilled tiny|cost falls as specialization rises","eq":["e14_distill","e12_routing"]},"e1_openweights":{"k":"I","p":"E1","cl":"multi","t":"Open vs closed weights","s":"Closed models are API-only; open-weight models (e.g. Llama, Qwen, Mistral, Gemma families) can be downloaded and self-hosted.","hp":"Helps you weigh control and privacy against ops burden.","x":"Open: data stays in your VPC, fine-tuning freedom, fixed cost at scale, but you run GPUs. Closed: best capability, zero ops, per-token billing. Many teams mix: closed for hard tasks, open for bulk.","v":"cmp:#Closed API;Open weights|Capability=usually top;close behind|Ops=none;you run GPUs|Data control=vendor terms;full|Cost model=per token;per GPU hour|Customize=limited tuning;full tuning","eq":["e13_vllm","e13_ollama"]},"e1_licenses":{"k":"A","p":"E1","cl":"gcp","t":"Model licenses","s":"Terms attached to open weights: permissive (Apache 2.0, MIT) vs custom community licenses with usage caps, naming rules or acceptable-use clauses.","hp":"Helps you avoid legal surprises when shipping an open model.","x":"Check: commercial use allowed, user-count caps, attribution/naming of derivatives, restrictions on training other models with outputs, acceptable-use policy. Also check API terms for output use.","v":"table:License,Commercial,Notes|Apache 2.0,Yes,Patent grant|MIT,Yes,Minimal|Community custom,Mostly,Caps or naming|Research only,No,Eval only","eq":["e14_distill"]},"e1_modelcards":{"k":"I","p":"E1","cl":"gcp","t":"Model cards & knowledge cutoff","s":"Reading the provider's model card/system card: intended use, evals, limits, context size, and training-data cutoff date.","hp":"Helps you know what the model can't know or shouldn't do.","x":"Knowledge cutoff means no facts after that date unless you supply them (search, RAG, current date in prompt). Cards also list deprecation dates, modalities and known weaknesses.","v":"flow:Cutoff date>Gap until today>Inject date + search>Fresh answer","code":"system = f\"Today is {date.today():%Y-%m-%d}. Your training data may be older; prefer the provided sources for recent facts.\"","eq":["e1_context"]},"E2":{"k":"S","p":"E2","t":"LLM APIs & Integration","s":"Calling model APIs in production: message formats, streaming, rate limits, retries, batching, SDKs, gateways and model versioning.","hp":"Most outages and surprise bills in LLM apps trace back to integration details, not the model.","x":"messages & roles, stop reasons, sampling, streaming, rate limits, retries, timeouts, idempotency, batch, SDKs, gateways, model pinning, secrets","v":"arch:LLM integration:App>SDK client,Retry layer>Gateway>Provider A,Provider B","sec":{"pid":"E2","num":2,"title":"LLM APIs & Integration","short":"LLM APIs"}},"e2_messages":{"k":"B","p":"E2","cl":"aws","t":"Messages API & roles","s":"The chat-style request shape used by all major providers: a system prompt plus alternating user/assistant messages with typed content blocks.","hp":"Helps you build requests that any provider SDK understands.","x":"Roles: system (operator rules), user, assistant, plus tool calls/results. Content is a list of blocks (text, image, document, tool_use). Always set max_tokens. Read response.usage for billing.","v":"seq:App,API|1>2:system + messages|2>1:content blocks|2>1:stop_reason + usage|1>1:append reply","code":"r = client.messages.create(\n    model=\"claude-sonnet-5-5\", max_tokens=1024,\n    system=\"You are a terse support agent.\",\n    messages=[{\"role\": \"user\", \"content\": \"Reset my password?\"}])\nprint(r.content[0].text, r.usage.input_tokens, r.usage.output_tokens)","eq":["e1_modelselect"]},"e2_stateless":{"k":"B","p":"E2","cl":"multi","t":"Stateless conversations","s":"The API keeps no memory between calls: you resend the full history every turn, so cost and latency grow with conversation length.","hp":"Helps you plan history storage, trimming and caching.","x":"Store history server-side; resend it each turn. Cost per turn rises roughly linearly with length, total cost quadratically. Use prompt caching on the stable prefix and compaction past a threshold.","v":"line:Turn 1,Turn 5,Turn 10,Turn 20,Turn 40|Input tokens per call=1,5,10,20,40|With compaction=1,5,10,12,12","eq":["e5_compaction","e12_promptcaching"]},"e2_stopreasons":{"k":"B","p":"E2","cl":"multi","t":"Stop reasons & truncation","s":"Every response says why generation ended: natural end, hit max_tokens, a stop sequence, a tool call, or a refusal.","hp":"Helps you catch truncated JSON and silent refusals.","x":"Anthropic: end_turn, max_tokens, stop_sequence, tool_use, pause_turn, refusal. OpenAI: stop, length, tool_calls, content_filter. Never parse output before checking; on max_tokens raise the cap or continue.","v":"fan:stop_reason|end_turn ok,max_tokens cut,tool_use run tool,refusal handle,stop_sequence","code":"if r.stop_reason == \"max_tokens\":\n    raise Truncated(\"raise max_tokens or stream\")\nif r.stop_reason == \"refusal\":\n    return fallback_reply()\nif r.stop_reason == \"tool_use\":\n    run_tools(r)","eq":["e4_validation"]},"e2_sampling":{"k":"B","p":"E2","cl":"azure","t":"Sampling params in practice","s":"temperature, top_p, top_k and seed control randomness; practical defaults matter more than theory.","hp":"Helps you get consistent outputs for extraction and variety for writing.","x":"Extraction/classification: temperature 0-0.3. Creative: 0.7-1.0. Change temperature or top_p, not both. seed is best-effort reproducibility (OpenAI). Some newer reasoning models reject custom sampling values.","v":"table:Task,Temp,Notes|Extraction,0,Max consistency|Classification,0,Plus few-shot|Chat,0.5-0.7,Natural tone|Brainstorm,0.9-1.0,Diversity|Reasoning model,default,Often fixed","code":"client.chat.completions.create(model=\"gpt-4.1-mini\", temperature=0,\n    seed=42, messages=msgs)  # seed: best-effort determinism","eq":["e1_nondeterminism"]},"e2_logprobs":{"k":"A","p":"E2","cl":"azure","t":"Logprobs","s":"Per-token log probabilities returned by some APIs, usable as a cheap confidence signal for classification or as a hallucination hint.","hp":"Helps you threshold uncertain labels and route them to review.","x":"Request logprobs with top_logprobs=k (OpenAI chat; not on every provider or reasoning model). For a single-token label, exp(logprob) approximates confidence. Calibrate thresholds on your eval set.","v":"bars:yes=0.82,no=0.12,maybe=0.04,other=0.02","code":"r = client.chat.completions.create(model=M, messages=msgs,\n    max_tokens=1, logprobs=True, top_logprobs=3)\nfor t in r.choices[0].logprobs.content[0].top_logprobs:\n    print(t.token, math.exp(t.logprob))","eq":["e12_routing"]},"e2_thinking":{"k":"A","p":"E2","cl":"azure","t":"Reasoning effort & thinking params","s":"API settings that control how much a reasoning model thinks before answering, e.g. effort levels or thinking budgets.","hp":"Helps you trade latency and cost for accuracy per route.","x":"OpenAI: reasoning effort (low/medium/high). Claude: adaptive thinking plus output_config.effort on newer models; older ones took budget_tokens. Thinking bills as output. Sweep effort on your eval; low often suffices.","v":"line:low,medium,high,max|Accuracy=78,85,89,90|Cost=1,1.8,3,5","code":"r = client.messages.create(model=\"claude-opus-5-5\", max_tokens=16000,\n    thinking={\"type\": \"adaptive\"},\n    output_config={\"effort\": \"low\"},\n    messages=msgs)","eq":["e1_modelselect","e12_latency"]},"e2_multimodal":{"k":"I","p":"E2","cl":"aws","t":"Multimodal inputs & Files API","s":"Sending images, PDFs and audio as content blocks, inline (base64/URL) or via an uploaded file id reused across requests.","hp":"Helps you avoid re-uploading large docs on every call.","x":"Images cost tokens by pixel area; downscale to the smallest legible size. PDFs often bill text plus page images. Use a files API id for docs reused across turns; check size and page limits.","v":"flow:Upload file>file_id>Reference in message>Reuse across calls","code":"f = client.files.upload(file=open(\"contract.pdf\", \"rb\"))\nmsg = {\"role\": \"user\", \"content\": [\n  {\"type\": \"document\", \"source\": {\"type\": \"file\", \"file_id\": f.id}},\n  {\"type\": \"text\", \"text\": \"List the termination clauses.\"}]}","eq":["e16_vision","e16_docai"]},"e2_streaming":{"k":"I","p":"E2","cl":"azure","t":"Streaming (SSE)","s":"Receiving output token-by-token over server-sent events so users see text immediately and long generations avoid HTTP timeouts.","hp":"Helps you cut perceived latency from seconds to ~TTFT.","x":"Claude events: message_start, content_block_start, content_block_delta, content_block_stop, message_delta (stop_reason, usage), message_stop. Accumulate deltas; tool JSON arrives as partial_json. Use SDK helpers to get the final message.","v":"seq:Client,API|1>2:stream true|2>1:message_start|2>1:content_block_delta|2>1:content_block_delta|2>1:message_delta|2>1:message_stop","code":"with client.messages.stream(model=M, max_tokens=4096, messages=msgs) as s:\n    for text in s.text_stream:\n        send_to_ui(text)\n    final = s.get_final_message()","eq":["e16_streamux","e12_latency"]},"e2_ratelimits":{"k":"B","p":"E2","cl":"multi","t":"Rate limits (RPM, TPM, tiers)","s":"Provider caps on requests per minute and input/output tokens per minute, raised by usage tier or contract.","hp":"Helps you plan capacity before a launch hits 429s.","x":"Limits apply per org/model, often separately for input and output tokens. Read remaining-quota headers and retry-after. Forecast peak TPM = peak RPS x 60 x tokens/request; request tier increases weeks ahead.","v":"tiers:Tier 4,Tier 3,Tier 2,Tier 1,Free|higher spend unlocks higher RPM and TPM|limits apply per model","eq":["e12_costmodel"]},"e2_concurrency":{"k":"I","p":"E2","cl":"azure","t":"Async concurrency with semaphores","s":"Running many LLM calls in parallel with asyncio while capping in-flight requests to stay under rate limits.","hp":"Helps you process thousands of items fast without a 429 storm.","x":"Start with 5-20 concurrent requests and tune against TPM headroom. Combine a semaphore with retry/backoff. For strict TPM, add a token-bucket limiter keyed on estimated tokens.","v":"fan:Semaphore 10|Worker 1,Worker 2,Worker 3,Worker 10,Queue rest","code":"sem = asyncio.Semaphore(10)\nasync def one(item):\n    async with sem:\n        return await aclient.messages.create(model=M, max_tokens=512,\n            messages=[{\"role\": \"user\", \"content\": item}])\nresults = await asyncio.gather(*(one(i) for i in items))","eq":["e2_batchapi"]},"e2_batchapi":{"k":"I","p":"E2","cl":"aws","t":"Batch APIs","s":"Submit many requests as one async job processed within ~24h at about 50% of normal token price, with separate higher limits.","hp":"Helps you halve cost on evals, backfills and nightly jobs.","x":"Use for evals, labeling, embeddings backfills, summaries of archives. Results come back keyed by custom_id in any order. Most finish well under 24h but plan for the full window. Stacks with prompt caching.","v":"gbars:Price,Latency hrs,Rate limit|Realtime=100,0,100|Batch=50,24,300","f":"Message Batches, OpenAI Batch","code":"batch = client.messages.batches.create(requests=[\n  {\"custom_id\": f\"doc-{i}\", \"params\": {\"model\": M, \"max_tokens\": 512,\n   \"messages\": [{\"role\": \"user\", \"content\": d}]}} for i, d in enumerate(docs)])\n# poll batches.retrieve(batch.id) until processing_status == \"ended\"","eq":["e2_concurrency","e12_costmodel"]},"e2_tokencount":{"k":"I","p":"E2","cl":"aws","t":"Token counting endpoints","s":"Provider endpoints or libraries that return exact input token counts for a request before you send it.","hp":"Helps you enforce context budgets and pre-check cost.","x":"Claude: messages.count_tokens (free, rate-limited separately). OpenAI: tiktoken locally. Gemini: models.count_tokens. Count the full request (system + tools + messages), not just the user text.","v":"ctx:System=8,Tools=12,History=50,User msg=5,Headroom=25|count before send","code":"n = client.messages.count_tokens(model=M, system=SYSTEM,\n    tools=TOOLS, messages=history).input_tokens\nif n > BUDGET: history = trim(history)","eq":["e1_tokens","e5_budget"]},"e2_reliability":{"k":"I","p":"E2","cl":"multi","t":"Production reliability patterns","s":"The set of defenses every LLM call needs: retries, timeouts, idempotency and fallbacks, because providers fail more often than typical APIs.","hp":"Helps you keep features up through provider incidents.","x":"Expect occasional 429/500/overloaded errors and multi-minute slow spells. Layer: per-call timeout, bounded retries with jitter, fallback model/provider, circuit breaker, graceful degraded UX.","v":"ladder:Timeout,Retry with jitter,Fallback model,Fallback provider,Degraded UX|each layer catches what the last missed"},"e2_retries":{"k":"B","p":"E2","cl":"azure","t":"Retries with backoff & jitter","s":"Retrying transient failures with exponentially growing, randomized delays, and never retrying errors that will fail again.","hp":"Helps you ride out blips without hammering the provider.","x":"Retry: 429, 408, 409, 500, 502, 503, 504, 529 overloaded, connection resets. Don't retry: 400, 401, 403, 404, 413. Honor retry-after. Cap at ~3-5 attempts, delay = min(cap, base x 2^n) + jitter.","v":"line:Try 1,Try 2,Try 3,Try 4,Try 5|Delay s=1,2,4,8,16|With jitter=1.3,2.6,3.5,9.1,14","code":"from tenacity import retry, wait_random_exponential, stop_after_attempt, retry_if_exception_type\n@retry(wait=wait_random_exponential(min=1, max=30), stop=stop_after_attempt(5),\n       retry=retry_if_exception_type((RateLimitError, InternalServerError, APIConnectionError)))\ndef call(**kw): return client.messages.create(**kw)","eq":["e2_fallbacks"]},"e2_timeouts":{"k":"I","p":"E2","cl":"azure","t":"Timeouts & cancellation","s":"Setting connect/read/total timeouts per call and cancelling in-flight generations when the user leaves or a deadline passes.","hp":"Helps you stop paying for answers nobody will read.","x":"SDK defaults can be ~10 min; set route-specific limits (e.g. 30 s chat, 5 s classification). For streams use an idle timeout between chunks. Closing the stream stops generation; tokens already produced still bill.","v":"flow:Start call>Deadline timer>Timeout hit>Cancel stream>Fallback reply","eq":["e12_latency"]},"e2_idempotency":{"k":"A","p":"E2","cl":"azure","t":"Idempotency for LLM calls","s":"Making retried requests safe: dedupe by a request key so a retry doesn't double-charge, double-send, or double-execute a tool side effect.","hp":"Helps you retry without duplicate emails, orders or tickets.","x":"LLM generation itself is not idempotent (new sample each time). Store results by request key and return the stored one on retry. Put idempotency keys on side-effecting tools, not on the model call.","v":"seq:Client,Service,Store|1>2:req key 42|2>3:seen key 42?|3>2:miss|2>2:call LLM + tool|2>3:save result|1>2:retry key 42|2>1:cached result","code":"key = hashlib.sha256(json.dumps(req, sort_keys=True).encode()).hexdigest()\nif (hit := cache.get(key)): return hit\nres = call(**req); cache.set(key, res, ex=3600); return res","eq":["e8_schema","e9_checkpoint"]},"e2_fallbacks":{"k":"A","p":"E2","cl":"azure","t":"Provider & model fallbacks","s":"On errors, overload or refusal, re-issue the request to a backup model or provider, ideally one already validated on your evals.","hp":"Helps you survive provider outages with minimal quality loss.","x":"Keep an ordered list per route (e.g. primary model, same model on another cloud, cheaper sibling). Validate prompts on each; outputs differ. Add a circuit breaker so failing primaries are skipped for a cooldown.","v":"flow:Primary model>Error or 529>Same model other cloud>Sibling model>Cached or canned reply","code":"for model in [\"primary\", \"primary@other-region\", \"backup-small\"]:\n    try:\n        return call(model=model, **req)\n    except (RateLimitError, InternalServerError, APITimeoutError):\n        continue\nreturn CANNED_REPLY","eq":["e2_gateway","e12_routing"]},"e2_sdks":{"k":"B","p":"E2","cl":"aws","t":"Provider SDKs","s":"Official client libraries (OpenAI, Anthropic, Google GenAI, AWS boto3 Bedrock) that handle auth, retries, streaming and typed responses.","hp":"Helps you avoid hand-rolled HTTP with subtle bugs.","x":"Use official SDKs: built-in retries (often 2), timeouts, typed errors, streaming helpers, async clients. Pin SDK versions; breaking changes happen. Cloud-hosted variants use cloud auth (IAM, ADC, Entra).","v":"table:Provider,Python package,Call|OpenAI,openai,responses.create|Anthropic,anthropic,messages.create|Google,google-genai,generate_content|AWS,boto3,converse","code":"from google import genai\nclient = genai.Client()\nr = client.models.generate_content(model=\"gemini-2.5-flash\", contents=\"Hi\")\nprint(r.text)"},"e2_converse":{"k":"I","p":"E2","cl":"aws","t":"Bedrock Converse API","s":"AWS Bedrock's unified chat API that accepts one message format across hosted model families (Claude, Llama, Mistral, Nova and more).","hp":"Helps you switch Bedrock models without rewriting request code.","x":"Uses IAM auth, regional endpoints and cross-region inference profiles. Same shape for tools and streaming (converse_stream). Model ids include provider prefixes; some features lag first-party APIs.","v":"arch:Bedrock:App>Converse API>Claude,Llama,Mistral,Nova","code":"br = boto3.client(\"bedrock-runtime\", region_name=\"us-east-1\")\nr = br.converse(modelId=MODEL_ID,\n    messages=[{\"role\": \"user\", \"content\": [{\"text\": \"Hi\"}]}],\n    inferenceConfig={\"maxTokens\": 512, \"temperature\": 0})\nprint(r[\"output\"][\"message\"][\"content\"][0][\"text\"])","eq":["e2_gateway"]},"e2_openai_compat":{"k":"I","p":"E2","cl":"aws","t":"OpenAI-compatible endpoints","s":"Many servers and providers (vLLM, Ollama, Together, Groq, Gemini compat mode) expose the OpenAI chat API shape, so one client works with a changed base_url.","hp":"Helps you swap self-hosted or cheap providers with one line.","x":"Basic chat and streaming usually work; tools, structured output, logprobs and usage fields vary. Test each feature you rely on per endpoint rather than trusting \"compatible\".","v":"fan:OpenAI client|vLLM,Ollama,Hosted open models,Gateway","code":"from openai import OpenAI\nlocal = OpenAI(base_url=\"http://localhost:8000/v1\", api_key=\"unused\")\nlocal.chat.completions.create(model=\"Qwen/Qwen3-8B\", messages=msgs)","eq":["e13_vllm","e13_ollama"]},"e2_gateway":{"k":"I","p":"E2","cl":"aws","t":"LLM gateways & proxies","s":"A layer (e.g. LiteLLM, Portkey, OpenRouter, cloud AI gateways) between apps and providers for unified API, keys, routing, fallbacks, budgets and logs.","hp":"Helps you centralize keys, spend limits and failover for all teams.","x":"Gives: one API for 100+ models, per-team virtual keys and budgets, retries/fallbacks, caching, logging. Self-host (LiteLLM proxy) or SaaS (OpenRouter, Portkey). Adds a hop of a few ms.","v":"arch:Gateway:Apps>Gateway,Keys and budgets,Logs>OpenAI,Anthropic,Bedrock,Self-hosted","code":"import litellm\nr = litellm.completion(model=\"anthropic/claude-sonnet-5-5\",\n    messages=msgs, fallbacks=[\"openai/gpt-4.1\"], num_retries=2)","eq":["e2_fallbacks","e12_routing","e11_tracing"]},"e2_modelids":{"k":"I","p":"E2","cl":"gcp","t":"Model ids, aliases & pinning","s":"Choosing between floating aliases (always latest) and pinned snapshot ids so behavior only changes when you decide.","hp":"Helps you avoid silent behavior changes in production.","x":"Pin exact snapshot ids in prod; use aliases only in prototypes. Store model id in config per route. Record model id with every logged response so evals can compare versions.","v":"cmp:#Alias;Pinned snapshot|Updates=automatic;manual|Behavior=can shift;stable|Use in=prototypes;production|Risk=silent drift;deprecation date","eq":["e11_modelupgrade","e3_versioning"]},"e2_deprecations":{"k":"A","p":"E2","cl":"gcp","t":"Deprecations & model migration","s":"Providers retire models on published schedules; migrating means re-running evals, re-tuning prompts and params, then a staged rollout.","hp":"Helps you upgrade on your schedule, not the provider's.","x":"Track deprecation notices (often months of warning). Migration checklist: run eval suite on new model, diff outputs, check removed params (sampling, prefill, budgets), check tokenizer cost change, canary 5-10%.","v":"flow:Notice>Eval new model>Fix prompts and params>Canary 5%>Full rollout>Remove old","eq":["e11_modelupgrade","e10_ci"]},"e2_secrets":{"k":"B","p":"E2","cl":"gcp","t":"API keys & secret management","s":"Keeping provider keys out of code, browsers and logs; scoping, rotating and monitoring them like any production credential.","hp":"Helps you prevent leaked keys and surprise five-figure bills.","x":"Load from a secret manager or env, never commit. Never call providers directly from the browser or mobile app; proxy through your backend. Separate keys per env/team, set spend limits, rotate on leak. Prefer IAM/workload identity on clouds.","v":"flow:Secret manager>Backend env>SDK client>Provider","eq":["e15_leastpriv","e2_gateway"]},"E3":{"k":"S","p":"E3","t":"Prompt Engineering as Software","s":"Writing, structuring, versioning, testing and optimizing prompts as production code rather than ad-hoc text.","hp":"Prompts are the cheapest, fastest lever on quality; treating them as code keeps that lever safe to pull.","x":"templates, versioning, system prompt structure, XML tags, few-shot, chaining, prefill, long-doc placement, instruction hierarchy, reasoning-model prompting, meta-prompting, DSPy, testing, compression","v":"flow:Template>Version>Test on evals>Review>Deploy>Monitor|loop","sec":{"pid":"E3","num":3,"title":"Prompt Engineering as Software","short":"Prompting"}},"e3_promptascode":{"k":"B","p":"E3","cl":"gcp","t":"Prompts as code","s":"Managing prompts like source: stored in files or a registry, parameterized, versioned, reviewed and tested before release.","hp":"Helps you change prompts without breaking production by accident.","x":"Keep prompts out of string literals scattered in code; one file or registry entry per prompt with an id and version. Every change runs the eval suite; every response logs the prompt version.","v":"cmp:#Ad-hoc strings;Prompts as code|Location=inline in code;files or registry|Changes=edit and hope;PR + evals|Traceability=none;version per log|Rollback=redeploy;flip version","eq":["e1_buildloop"]},"e3_templates":{"k":"B","p":"E3","cl":"azure","t":"Prompt templates","s":"Parameterized prompts (f-strings, Jinja2, provider template tools) that separate fixed instructions from per-request variables.","hp":"Helps you reuse one tested prompt across thousands of inputs.","x":"Use Jinja2 for loops/conditionals (few-shot lists, optional sections); f-strings for trivial cases. Escape or tag user input. Keep static text first and variables last to stay cache-friendly.","v":"flow:Template file>Fill variables>Rendered prompt>LLM","code":"from jinja2 import Template\nT = Template(open(\"prompts/summarize.j2\").read())\nprompt = T.render(doc=doc, max_words=120,\n                  examples=examples[:3])","eq":["e5_cachefriendly","e3_fewshot"]},"e3_versioning":{"k":"I","p":"E3","cl":"gcp","t":"Prompt versioning & registries","s":"Assigning immutable versions to prompts, stored in git or a registry (e.g. Langfuse, PromptLayer, MLflow), with labels like production and staging.","hp":"Helps you roll back a bad prompt in seconds and attribute regressions.","x":"Version = template + model id + params together. Deploy by moving a label, not editing in place. Log prompt name@version on every trace so evals and incidents link to the exact text.","v":"tree:summarize>v1,v2,v3;v3>staging label;v2>production label","code":"from langfuse import Langfuse\np = Langfuse().get_prompt(\"summarize\", label=\"production\")\nprompt = p.compile(doc=doc)\n# trace metadata: {\"prompt\": p.name, \"version\": p.version}","eq":["e11_tracing","e3_testing"]},"e3_testing":{"k":"I","p":"E3","cl":"gcp","t":"Prompt regression testing","s":"Running every prompt change against a fixed eval set with assertions and graded scores, blocking merges that regress.","hp":"Helps you catch the fix that broke three other cases.","x":"Mix cheap deterministic asserts (contains, JSON valid, length) with LLM-judge rubrics. Run 3+ samples per case to absorb variance. Tools: promptfoo, pytest + judge, provider eval suites.","v":"gbars:Format,Accuracy,Tone,Safety|v4=99,84,90,100|v5 candidate=99,88,76,100","code":"# promptfooconfig.yaml\nprompts: [file://prompts/support_v5.txt]\nproviders: [anthropic:messages:claude-sonnet-5-5]\ntests:\n  - vars: {q: \"refund after 40 days?\"}\n    assert: [{type: icontains, value: \"30 days\"}, {type: llm-rubric, value: \"polite, no promises\"}]","eq":["e10_ci","e10_golden"]},"e3_sensitivity":{"k":"I","p":"E3","cl":"multi","t":"Prompt sensitivity & brittleness","s":"Small wording, ordering or formatting changes can swing accuracy by several points, and the effect differs per model.","hp":"Helps you distrust single-run wins and test paraphrases.","x":"Sources: example order, label wording, whitespace/format, instruction position. Test 2-3 paraphrases of key instructions; prefer the one robust across them. Re-test on every model upgrade.","v":"bars:Original=82,Reordered examples=76,Paraphrase A=84,Paraphrase B=79,Markdown vs XML=80","eq":["e1_nondeterminism"]},"e3_review":{"k":"I","p":"E3","cl":"gcp","t":"Prompt review practices","s":"Code-review norms for prompts: diffs reviewed with eval results attached, owners per prompt, style rules and a changelog.","hp":"Helps you keep many contributors from silently conflicting.","x":"Checklist: eval delta attached, no contradictory rules, examples still match instructions, variables documented, no secrets or PII in examples, cache-breaking edits noted. Assign a CODEOWNER per prompt.","v":"flow:Edit prompt>Run evals>Open PR with deltas>Owner review>Merge and label","eq":["e10_ci"]},"e3_sysprompt":{"k":"B","p":"E3","cl":"azure","t":"System prompt structure","s":"A predictable layout for the system prompt: role, context, task rules, output format, examples, then edge cases.","hp":"Helps you write prompts others can read, edit and debug.","x":"Common order: role/goal, background, rules, tool guidance, output format, examples. Explain why behind rules; models generalize from reasons. Keep stable sections first for caching; put volatile data last.","v":"stack:Role and goal,Background,Rules with reasons,Output format,Examples,Dynamic data|0","code":"SYSTEM = \"\"\"You are a billing support agent for Acme.\n<context>{policy}<\/context>\n<rules>Refunds within 30 days only, because finance audits later.<\/rules>\n<format>Reply in <=3 sentences, plain text.<\/format>\"\"\"","eq":["e5_cachefriendly"]},"e3_xmltags":{"k":"B","p":"E3","cl":"azure","t":"Delimiters & XML tags","s":"Wrapping instructions, documents, examples and user input in clear delimiters (XML tags, fenced blocks) so the model knows what is what.","hp":"Helps you stop the model from confusing data with instructions.","x":"Use descriptive tags (<document>, <example>, <user_input>) and refer to them by name in instructions. Tags also make outputs parseable (<answer>...<\/answer>). Pick one style and be consistent.","v":"arch:Prompt:Instructions>docs tag,examples tag,user_input tag>Answer tag","code":"prompt = f\"\"\"Summarize the report in <report> for executives.\n<report>\n{report_text}\n<\/report>\nReturn the summary inside <summary><\/summary> tags.\"\"\"","eq":["e15_injection"]},"e3_rolespec":{"k":"B","p":"E3","cl":"azure","t":"Clear role & task spec","s":"Stating who the model is, who the audience is, what success looks like and the constraints, as if briefing a smart new hire.","hp":"Helps you get the right output on the first try.","x":"Test: could a new colleague do the task from this prompt alone? Include goal, audience, inputs, length, format, what to do when unsure. Vague asks (\"make it good\") yield generic outputs.","v":"hub:Task spec|Goal,Audience,Inputs,Constraints,Format,If unsure,Success test"},"e3_persona":{"k":"B","p":"E3","cl":"azure","t":"Persona & tone control","s":"Setting voice, register and brand style via role, style rules and short examples rather than adjectives alone.","hp":"Helps you keep a consistent brand voice across replies.","x":"Show, don't tell: 2-3 sample replies beat \"be friendly\". Specify reading level, length, banned phrases, emoji policy. Personas don't add knowledge; they set style and scope.","v":"quad:Formality,Warmth|Legal notice=9,2;Support agent=5,8;Sales chat=3,9;API docs=7,3;Kids tutor=2,9","eq":["e3_fewshot"]},"e3_positive":{"k":"B","p":"E3","cl":"azure","t":"Positive vs negative instructions","s":"Telling the model what to do instead of only what not to do, since negations can prime the unwanted behavior.","hp":"Helps you fix rules the model keeps breaking.","x":"\"Write in flowing prose paragraphs\" beats \"don't use bullet points\". Keep hard prohibitions for safety, and pair each with the desired alternative. Avoid ALL-CAPS shouting; newer models overreact to it.","v":"cmp:#Negative;Positive|Format=no markdown;plain prose paragraphs|Length=don't ramble;max 3 sentences|Unknowns=never guess;say I don't know|Tone=don't be rude;warm and direct"},"e3_longdoc":{"k":"I","p":"E3","cl":"azure","t":"Long-document placement","s":"With long inputs, put documents first and the question/instructions last; quality is often measurably better than question-first.","hp":"Helps you get better answers over 20k+ token contexts.","x":"Order: docs (tagged with source and metadata), then instructions, then the question at the very end. Ask the model to first extract relevant quotes, then answer from them.","v":"ctx:Docs=78,Instructions=10,Quote step=4,Question=3,Output=5|docs first","code":"prompt = (\n  \"\".join(f\"<doc source='{d.src}'>{d.text}<\/doc>\" for d in docs)\n  + \"\\nFirst quote the relevant passages in <quotes>, then answer.\\n\"\n  + f\"<question>{q}<\/question>\")","eq":["e5_budget","e6_citations"]},"e3_compression":{"k":"A","p":"E3","cl":"azure","t":"Prompt compression","s":"Shrinking prompts by dropping low-information tokens (e.g. LLMLingua) or summarizing context, trading a little accuracy for cost and latency.","hp":"Helps you cut input tokens 2-10x on bloated contexts.","x":"LLMLingua-family methods use a small LM to drop tokens; reported 2-20x compression with modest loss. Simpler wins first: trim boilerplate, dedupe chunks, shorter few-shot. Verify on evals; numbers and names can get mangled.","v":"bars:Original=10000,Trimmed=6000,LLMLingua 4x=2500,Summary=1200","code":"from llmlingua import PromptCompressor\npc = PromptCompressor()\nout = pc.compress_prompt(context, question=q, target_token=1500)\nprompt = out[\"compressed_prompt\"]","eq":["e5_compaction","e12_costmodel"]},"e3_hierarchy":{"k":"I","p":"E3","cl":"multi","t":"Instruction hierarchy","s":"Models are trained to weigh system/developer instructions above user messages, and both above text inside tool results or documents.","hp":"Helps you put rules where they carry the right authority.","x":"Put non-negotiable policy in the system prompt; treat retrieved docs, web pages and tool output as data, never commands. Remind the model that instructions inside documents are untrusted. Not a security boundary on its own.","v":"tiers:System,Developer,User,Tool output,Retrieved docs|highest authority|treat as data only","eq":["e15_injection","e15_trifecta"]},"e3_fewshot":{"k":"B","p":"E3","cl":"azure","t":"Few-shot examples","s":"Including a few input-output examples in the prompt so the model copies format, style and decision boundaries.","hp":"Helps you nail tricky formats and edge cases fast.","x":"3-5 diverse examples usually suffice; cover edge cases and each label. Wrap in <example> tags. Models copy surface details (length, phrasing), so vary them. Watch label order and class balance.","v":"flow:Instructions>Example 1>Example 2>Example 3>New input>Output","f":"in-context examples","code":"EXAMPLES = [(\"Card charged twice\", \"billing\"), (\"App crashes on login\", \"bug\")]\nshots = \"\\n\".join(f\"<example><in>{i}<\/in><out>{o}<\/out><\/example>\" for i, o in EXAMPLES)\nprompt = f\"Classify the ticket.\\n{shots}\\n<in>{ticket}<\/in>\"","eq":["e3_templates","e14_dataset"]},"e3_dynamic_fewshot":{"k":"A","p":"E3","cl":"azure","t":"Dynamic example retrieval","s":"Selecting the most relevant few-shot examples per request from a labeled pool via embedding similarity, instead of a fixed set.","hp":"Helps you scale few-shot to hundreds of edge cases.","x":"Embed a pool of 100-10k verified examples; retrieve top 3-8 by similarity, add diversity (MMR) and label balance. Great for text-to-SQL and classification. Pool doubles as eval data; keep them separate.","v":"flow:New input>Embed>Search example pool>Top k diverse>Build prompt>LLM","code":"hits = store.similarity_search(user_q, k=5)  # e.g. LangChain vector store\nshots = \"\\n\".join(f\"<example>Q: {h.page_content}\\nSQL: {h.metadata['sql']}<\/example>\" for h in hits)","eq":["e6_embedmodel","e17_texttosql"]},"e3_prefill":{"k":"I","p":"E3","cl":"azure","t":"Prefill & response priming","s":"Starting the assistant's reply for it (e.g. \"{\" or \"<answer>\") to force a format or skip preamble.","hp":"Helps you enforce format cheaply on models that allow it.","x":"Supported on some APIs and older models; newer Claude models reject assistant prefill and some providers never supported it. Prefer structured outputs or format instructions; priming via a final line like \"Answer:\" still works.","v":"seq:App,Model|1>2:user msg|1>2:assistant starts {|2>1:continues JSON|1>1:prepend {","eq":["e4_constrained","e4_jsonschema"]},"e3_chaining":{"k":"I","p":"E3","cl":"azure","t":"Prompt chaining","s":"Splitting a task into sequential prompts where each output feeds the next, with code checks in between.","hp":"Helps you debug, cache and evaluate each step separately.","x":"Typical chains: extract then analyze then write; draft then critique then revise. Pass data between steps in tags or JSON. Add gates (validation, routing) between steps; use different models per step.","v":"flow:Extract facts>Validate>Analyze>Draft>Critique>Final","code":"facts = llm(EXTRACT.render(doc=doc))\nassert valid_json(facts)\nanalysis = llm(ANALYZE.render(facts=facts))\nreport = llm(WRITE.render(analysis=analysis), model=BIG)","eq":["e9_workflows_vs_agents","e3_thinkfirst"]},"e3_thinkfirst":{"k":"I","p":"E3","cl":"azure","t":"Think-then-answer scaffolds","s":"For non-reasoning models, asking for reasoning in a <thinking> block before a separate <answer> block you parse.","hp":"Helps you get multi-step accuracy from cheaper models.","x":"Ask for structured steps (\"list the relevant rules, check each, then decide\"). Parse only the answer tag; log the thinking for debugging. Skip it on reasoning models, which think natively.","v":"flow:Question>Thinking tag>Answer tag>Parse answer only","code":"out = llm(prompt + \"\\nThink in <thinking> tags, then give the final label in <answer> tags.\")\nlabel = re.search(r\"<answer>(.*?)<\/answer>\", out, re.S).group(1).strip()","eq":["e3_reasoningprompts"]},"e3_reasoningprompts":{"k":"A","p":"E3","cl":"azure","t":"Prompting reasoning models","s":"Reasoning models need less hand-holding: give goals, constraints and context, not step-by-step procedures or \"think step by step\".","hp":"Helps you avoid degrading reasoning models with old habits.","x":"Do: state the goal, success criteria, full context up front; tune effort instead of prompt tricks. Avoid: rigid step lists, few-s
