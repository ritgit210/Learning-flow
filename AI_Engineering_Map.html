ty with metadata conditions (tenant, ACL, date); pre-filtering applies conditions during search, post-filtering drops results after.","hp":"Helps you avoid queries that return 2 of 10 results, or silently wrong ones, once filters are selective.","x":"Post-filter: top 10 then filter, may leave 0 hits. Pre/in-filter (Qdrant, Weaviate, Milvus) keeps recall but needs payload indexes. pgvector ≥0.8: SET hnsw.iterative_scan to keep scanning. Very selective filters: exact scan is fine.","v":"cmp:#Post-filter;Pre or in-filter|Recall=drops when selective;stays high|Speed=fast;slower when mid-range|Support=everywhere;engine-specific","f":"pre- vs post-filtering","code":"from qdrant_client import models\nhits = client.query_points(collection_name=\"docs\", query=qvec, limit=10,\n    query_filter=models.Filter(must=[models.FieldCondition(\n        key=\"tenant_id\", match=models.MatchValue(value=\"acme\"))])).points","eq":["e7_multitenancy","e6_hybrid"]},"e7_hybridindb":{"k":"I","p":"E7","cl":"azure","t":"Native hybrid search in the DB","s":"Vector stores that keep a BM25/sparse index next to the vector index and fuse both in one query (Weaviate, Qdrant, Elasticsearch, OpenSearch, Milvus, Vespa).","hp":"Helps you run hybrid retrieval without operating a separate search engine.","x":"Check fusion options (RRF vs weighted/relative score), analyzers/tokenizers for your languages, and whether sparse vectors (SPLADE, BGE-M3) are supported. Still rerank afterward.","v":"fanin:BM25 index,Dense HNSW,Sparse vectors|Fused top k","code":"res = collection.query.hybrid(query=\"error E1234 on login\", alpha=0.5, limit=20)  # Weaviate v4: alpha 0=BM25, 1=vector","eq":["e6_hybrid","e7_fts_vector"]},"e7_fts_vector":{"k":"I","p":"E7","cl":"azure","t":"Vector + full-text in one SQL","s":"In Postgres, run pgvector similarity and tsvector full-text search as two CTEs and fuse with RRF in a single statement, joined to your business tables.","hp":"Helps you get hybrid search with joins, ACL filters and transactions in one database.","x":"Index both: HNSW on embedding, GIN on tsvector. Postgres ts_rank is not BM25; for true BM25 consider extensions like ParadeDB pg_search. Fetch ~40 from each side before fusing.","v":"arch:Single SQL:Query>Vector CTE,FTS CTE>RRF join>Top 10","code":"WITH v AS (SELECT id, row_number() OVER (ORDER BY emb <=> $1) r FROM docs ORDER BY emb <=> $1 LIMIT 40),\nf AS (SELECT id, row_number() OVER (ORDER BY ts_rank(tsv, q) DESC) r\n      FROM docs, plainto_tsquery('english', $2) q WHERE tsv @@ q LIMIT 40)\nSELECT id, COALESCE(1.0/(60+v.r),0) + COALESCE(1.0/(60+f.r),0) AS score\nFROM v FULL JOIN f USING (id) ORDER BY score DESC LIMIT 10;","eq":["e7_hybridindb","e6_hybrid"]},"e7_vectordbs":{"k":"B","p":"E7","cl":"aws","t":"Vector DB landscape","s":"Options span Postgres extensions, dedicated vector DBs, search engines with vectors, embedded libraries and object-storage-backed serverless stores.","hp":"Helps you shortlist stores by deployment model and scale instead of by hype.","x":"Dedicated: Qdrant, Weaviate, Milvus, Pinecone. Search engines: Elasticsearch, OpenSearch, Vespa. Embedded/dev: Chroma, LanceDB. In-memory: Redis. Object-storage/serverless: Turbopuffer, S3 Vectors. Plus pgvector.","v":"table:Store,Type,Sweet spot|pgvector,Postgres ext,Have Postgres|Qdrant,Dedicated OSS,Filters + perf|Milvus,Dedicated OSS,Billion scale|Pinecone,Managed,Zero ops|Elastic/OpenSearch,Search engine,Hybrid + logs|Chroma/LanceDB,Embedded,Prototypes|Turbopuffer,Object storage,Cheap at scale","f":"Qdrant, Weaviate, Milvus, Pinecone","eq":["e7_pgvector","e7_choosing"]},"e7_pgvector":{"k":"B","p":"E7","cl":"aws","t":"pgvector","s":"Postgres extension adding vector, halfvec, bit and sparsevec types, distance operators, and HNSW/IVFFlat indexes.","hp":"Helps you add vector search next to your relational data with SQL, joins and transactions.","x":"HNSW defaults m=16, ef_construction=64, hnsw.ef_search=40. vector indexes up to 2,000 dims; halfvec halves storage and indexes up to 4,000 dims. Build with high maintenance_work_mem; check EXPLAIN uses the index.","v":"stack:SQL query,HNSW or IVFFlat,halfvec column,Postgres storage|0","f":"Postgres vector extension","code":"CREATE EXTENSION IF NOT EXISTS vector;\nCREATE TABLE chunks (id bigserial PRIMARY KEY, tenant_id int, body text, emb halfvec(1536));\nCREATE INDEX ON chunks USING hnsw (emb halfvec_cosine_ops) WITH (m = 16, ef_construction = 64);\nSET hnsw.ef_search = 100;\nSELECT id, body FROM chunks WHERE tenant_id = 7 ORDER BY emb <=> $1 LIMIT 10;","eq":["e7_fts_vector","e7_choosing"]},"e7_choosing":{"k":"B","p":"E7","cl":"gcp","t":"Postgres first vs dedicated DB","s":"A decision rule: start in the database you already run (Postgres, Elastic, Mongo) and move to a dedicated vector DB only when measured limits demand it.","hp":"Helps you avoid running and syncing an extra stateful system before you need it.","x":"pgvector is comfortable to roughly tens of millions of vectors on one node with tuning. Go dedicated for 100M+ vectors, heavy filtered QPS, multi-vector/sparse needs, or when index builds hurt the OLTP DB.","v":"ladder:numpy or FAISS,pgvector,pgvector + replicas,Dedicated vector DB,Sharded or DiskANN|Move up only on measured pain","eq":["e7_vectordbs","e7_pgvector"]},"e7_serverless":{"k":"A","p":"E7","cl":"multi","t":"Object-storage vector stores","s":"Stores like Turbopuffer, LanceDB and S3 Vectors keep indexes on object storage with SSD/memory caching, trading cold-query latency for far lower cost.","hp":"Helps you serve huge, mostly-cold, many-tenant corpora at a fraction of RAM-based pricing.","x":"Warm queries can be ~10–50 ms, cold ones hundreds of ms. Great for per-user or per-tenant namespaces that are rarely queried. Check write-to-read visibility latency and filtering support.","v":"quad:Cost per GB,Latency|In-memory HNSW=9,1;DiskANN on SSD=5,3;Object storage=1,7;Warm cache=2,3","eq":["e7_diskann","e7_vectordbs"]},"e7_multitenancy":{"k":"I","p":"E7","cl":"gcp","t":"Multitenancy in vector stores","s":"Isolating customers' vectors via a filter field, a partition/namespace per tenant, or a separate index/collection per tenant.","hp":"Helps you prevent cross-tenant leaks while keeping per-tenant recall and cost sane.","x":"Shared index + tenant filter: simplest, but needs a payload/partition index and fails open if a filter is forgotten. Namespace per tenant (Pinecone, Turbopuffer, Milvus partition keys, Qdrant tenant indexing) isolates better. Enforce tenant in server code.","v":"cmp:#Filter field;Namespace;Index per tenant|Isolation=weak;good;strong|Ops cost=low;low;high|Small tenants=fine;fine;wasteful","f":"namespaces, partition keys","code":"index.query(vector=qvec, top_k=10, namespace=f\"tenant-{tenant_id}\",\n            include_metadata=True)  # Pinecone namespace per tenant","eq":["e7_filtering","e15_leastpriv"]},"e7_sizing":{"k":"I","p":"E7","cl":"gcp","t":"Index sizing math","s":"Estimate memory as vectors × dims × bytes per dim, plus graph overhead (HNSW ~M×2 links per vector) and metadata, before choosing hardware.","hp":"Helps you avoid an index that silently spills to disk or a surprise cloud bill.","x":"10M × 1536 × 4 B ≈ 61 GB raw float32; halfvec ≈ 31 GB; int8 ≈ 15 GB; binary ≈ 2 GB. HNSW links add ~M×2×4–8 B per vector (≈0.1–0.3 KB at M=16). Leave 30–50% headroom for builds.","v":"bars:float32=61,halfvec=31,int8=15,binary=2","code":"n, d, M = 10_000_000, 1536, 16\nraw_gb  = n * d * 4 / 1e9          # 61.4\ngraph_gb = n * M * 2 * 4 / 1e9      # ~1.3\nprint(f\"{raw_gb + graph_gb:.1f} GB + metadata + headroom\")","eq":["e7_quantization","e7_embeddings"]},"e7_freshness":{"k":"A","p":"E7","cl":"multi","t":"Freshness, upserts & deletes","s":"How fast a write becomes searchable and how indexes handle updates: HNSW marks deletes as tombstones; IVF/PQ clusters drift as data changes.","hp":"Helps you avoid stale or deleted content in answers and creeping recall loss.","x":"Check write-to-query visibility (immediate vs seconds). Heavy update/delete churn degrades HNSW; schedule compaction/vacuum or rebuilds. IVF/PQ: retrain when distribution shifts. Postgres: VACUUM, then REINDEX CONCURRENTLY if bloated.","v":"line:Week 0,Week 2,Week 4,Week 6,Week 8|Recall no rebuild=0.97,0.95,0.92,0.9,0.88|Recall with rebuild=0.97,0.97,0.97,0.97,0.97","code":"from qdrant_client import models\nclient.upsert(collection_name=\"docs\", points=[models.PointStruct(\n    id=chunk_id, vector=vec, payload={\"doc_id\": doc_id, \"v\": doc_hash})])\nclient.delete(collection_name=\"docs\", points_selector=models.FilterSelector(filter=old_version_filter))","eq":["e6_ingest"]},"e7_reembed":{"k":"A","p":"E7","cl":"gcp","t":"Re-embedding & model migration","s":"Switching embedding models requires re-embedding the full corpus into a new index, because old and new vectors are incomparable.","hp":"Helps you upgrade embedders without downtime or a recall regression.","x":"Build the new index in parallel (dual-write new docs to both), backfill via batch APIs, compare recall on your eval set, then flip an alias and keep the old index for rollback. Budget embed cost: tokens in corpus × price.","v":"flow:New index>Dual write>Backfill batch>Eval both>Flip alias>Drop old","code":"# pseudo: blue/green index swap\ncreate_index(\"chunks_v2\", dims=1024)\nwrite_targets = [\"chunks_v1\", \"chunks_v2\"]   # dual write\nbackfill(\"chunks_v2\", model=\"new-embedder\")\nif eval_recall(\"chunks_v2\") >= eval_recall(\"chunks_v1\"):\n    set_alias(\"chunks\", \"chunks_v2\")","eq":["e6_embedmodel","e11_modelupgrade"]},"e7_benchmark":{"k":"I","p":"E7","cl":"gcp","t":"Benchmarking vector search","s":"Measuring recall, latency percentiles, QPS, build time and memory on your own data and filters, using ANN-Benchmarks or VectorDBBench as harnesses.","hp":"Helps you choose and tune stores on evidence rather than vendor charts.","x":"Vendor benchmarks use unfiltered public datasets; your filters and dims change everything. Report p50/p99 at fixed recall (e.g. 0.95), include concurrent writes, and test at 2–3x expected corpus size.","v":"gbars:Store A,Store B,Store C|p99 ms at 0.95=12,8,20|QPS x100=15,22,9","eq":["e7_recall","e7_vectordbs"]},"E8":{"k":"S","p":"E8","t":"Tool Use, Function Calling & MCP","s":"Designing, exposing and operating the tools an LLM can call, from single functions to MCP servers and agent-to-agent protocols.","hp":"Tools are how models touch real systems; their design decides agent accuracy, cost and blast radius.","x":"tool call round trip, schema and ACI design, tool_choice, parallel calls, results and errors, side effects, tool search, code execution, web and computer use, MCP, A2A, tool-call evals","v":"arch:Tool use:User>LLM>Function tools,MCP servers,Hosted tools>APIs,DBs,Sandbox","sec":{"pid":"E8","num":8,"title":"Tool Use, Function Calling & MCP","short":"Tools & MCP"}},"e8_roundtrip":{"k":"B","p":"E8","cl":"multi","t":"Tool-call round trip","s":"The model emits a structured tool call; your code executes it and sends back a tool result; the model continues until it answers.","hp":"Helps you reason about where tool latency, cost and errors enter the loop.","x":"Each round trip is a full model call that re-reads the whole context. Match every tool_use id with exactly one tool_result. Loop until stop_reason is end_turn, with a max-iterations cap (e.g. 10-25).","v":"seq:App,LLM,Tool|1>2:msgs + tool defs|2>1:tool_use get_order|1>3:execute|3>1:result JSON|1>2:tool_result|2>1:final answer","f":"function calling","code":"while True:\n    resp = client.messages.create(model=M, max_tokens=1024, tools=TOOLS, messages=msgs)\n    msgs.append({\"role\": \"assistant\", \"content\": resp.content})\n    if resp.stop_reason != \"tool_use\":\n        break\n    results = [{\"type\": \"tool_result\", \"tool_use_id\": b.id, \"content\": run(b)}\n               for b in resp.content if b.type==\"tool_use\"]\n    msgs.append({\"role\": \"user\", \"content\": results})","eq":["e9_loop"]},"e8_schema":{"k":"B","p":"E8","cl":"gcp","t":"Tool schema design","s":"Write tool names, descriptions and parameter schemas as prompts for the model: what it does, when to use it, what each argument means.","hp":"Helps you raise tool-selection accuracy more than most prompt tweaks.","x":"Descriptions of 3-4+ sentences beat one-liners: purpose, when not to use, return shape, limits. Use enums and formats on params, namespaced verb_noun names (crm_search_contacts), and few, high-level tools.","v":"cmp:#Weak;Strong|Name=search;crm_search_contacts|Desc=Searches;when to use and returns|Params=q string;query + enum status|Count=40 tiny tools;8 task tools","code":"{\"name\": \"crm_search_contacts\",\n \"description\": \"Search CRM contacts by name or email. Use before creating a contact to avoid duplicates. Returns up to 10 matches with id, name, email.\",\n \"input_schema\": {\"type\": \"object\",\n   \"properties\": {\"query\": {\"type\": \"string\", \"description\": \"Name or email fragment\"},\n                  \"status\": {\"type\": \"string\", \"enum\": [\"active\", \"archived\"]}},\n   \"required\": [\"query\"]}}","eq":["e4_jsonschema","e8_aci"]},"e8_aci":{"k":"I","p":"E8","cl":"gcp","t":"Agent-computer interface (ACI)","s":"Treat tools as a UI for the model: design them around the model's workflow, test how it uses them, and iterate like UX.","hp":"Helps you cut agent errors by fixing the tool instead of the prompt.","x":"Consolidate multi-step chains into one task-level tool (schedule_event, not list_users+list_events+create). Return human-readable fields, not opaque UUIDs. Poka-yoke params (absolute paths). Read transcripts to find misuse.","v":"flow:write tool>run evals>read transcripts>fix tool>rerun|loop","f":"ACI","eq":["e8_schema","e8_tooleval"]},"e8_toolchoice":{"k":"B","p":"E8","cl":"multi","t":"tool_choice modes","s":"Request setting that controls whether the model may call tools: auto, required/any, none, or a specific named tool.","hp":"Helps you force extraction, block tools in a summary step, or let the agent decide.","x":"auto: default for agents. required (OpenAI) / any (Anthropic): must call some tool. Specific tool: forced extraction or a fixed first step. none: answer in text with tools still defined (keeps cache prefix).","v":"table:Mode,Model may,Use for|auto,call or answer,agents|required,must call one,routing step|named tool,must call it,extraction|none,text only,final summary","code":"# OpenAI\nclient.chat.completions.create(model=M, messages=msgs, tools=tools, tool_choice=\"required\")\n# Anthropic\nclient.messages.create(model=M, max_tokens=512, messages=msgs, tools=tools,\n                       tool_choice={\"type\": \"any\"})","eq":["e4_jsonschema"]},"e8_parallel":{"k":"I","p":"E8","cl":"azure","t":"Parallel tool calls","s":"The model emits several independent tool calls in one turn; you run them concurrently and return all results together.","hp":"Helps you cut agent wall-clock time when lookups do not depend on each other.","x":"Return all results in one message, matched by id. Run with asyncio.gather and per-call timeouts. Disable (parallel_tool_calls=false / disable_parallel_tool_use) when calls have ordering or side effects.","v":"fan:One model turn|get_weather NYC,get_weather SF,get_weather LA","code":"import asyncio\n\ncalls = [b for b in resp.content if b.type==\"tool_use\"]\noutputs = await asyncio.gather(\n    *(asyncio.wait_for(run_tool(c.name, c.input), timeout=20) for c in calls),\n    return_exceptions=True)\nresults = [tool_result(c.id, o) for c, o in zip(calls, outputs)]","eq":["e12_latency"]},"e8_resultformat":{"k":"I","p":"E8","cl":"gcp","t":"Tool result formatting & limits","s":"Return compact, relevant, model-readable results with a hard size cap, pagination and a hint when output was truncated.","hp":"Helps you keep context lean and stop agents drowning in raw API JSON.","x":"Strip unused fields; prefer names over IDs; offer a response_format param (concise vs detailed). Cap at e.g. 10-25K tokens and say 'truncated; refine with filter X'. Paginate with cursors.","v":"bars:Raw API JSON=12000,Filtered JSON=3000,Concise text=800","code":"def search_orders(q: str, limit: int = 10) -> str:\n    rows = db.search(q, limit=limit + 1)\n    lines = [f\"{r.id} | {r.customer} | {r.status} | ${r.total:.2f}\" for r in rows[:limit]]\n    if len(rows) > limit:\n        lines.append(f\"[more results; narrow the query or pass offset={limit}]\")\n    return \"\\n\".join(lines) or \"No orders matched.\"","eq":["e8_errors"]},"e8_errors":{"k":"B","p":"E8","cl":"gcp","t":"Errors as actionable feedback","s":"Return tool failures as clear messages that tell the model what went wrong and how to fix the call, flagged as an error.","hp":"Helps you let agents self-correct instead of looping or giving up.","x":"Bad: stack trace or 'Error 400'. Good: 'date must be YYYY-MM-DD; got 03/04'. Set is_error true on the result. Distinguish retryable (timeout) from fatal (permission). Never leak secrets in messages.","v":"cmp:#Unhelpful;Actionable|Message=Error 400;date must be ISO|Next step=none;example given|Flag=plain text;is_error true|Retry hint=none;retry after 5s","code":"try:\n    out = create_event(**args)\n    return {\"type\": \"tool_result\", \"tool_use_id\": tid, \"content\": out}\nexcept ValueError as e:\n    return {\"type\": \"tool_result\", \"tool_use_id\": tid, \"is_error\": True,\n            \"content\": f\"Invalid input: {e}. Use start like 2026-10-03T09:00.\"}","eq":["e8_resultformat","e2_retries"]},"e8_sideeffects":{"k":"I","p":"E8","cl":"gcp","t":"Read vs write tools","s":"Separate read-only tools from tools with side effects, and gate writes (send, pay, delete) behind confirmation or policy.","hp":"Helps you let agents act freely on reads while keeping destructive actions safe.","x":"Tag tools read/write/destructive. Auto-run reads; require user confirmation or a dry-run diff for writes; block destructive ops outside allowlists. Log every write with args and approver.","v":"tiers:Destructive,Write,Read only|needs human approval|auto-run","eq":["e9_hitl","e15_leastpriv"]},"e8_idempotent":{"k":"A","p":"E8","cl":"azure","t":"Idempotent tools","s":"Design write tools so repeating the same call (retry, model repeat, replay) has the same effect as calling once.","hp":"Helps you survive retries and agent loops without double charges or duplicate tickets.","x":"Derive an idempotency key from run id + tool_use id and pass it to downstream APIs. Prefer upsert/set over increment/append. Agents repeat calls more often than humans; assume duplicates.","v":"seq:Agent,Tool,Payments API|1>2:refund key r1|2>3:refund r1|1>2:retry key r1|2>3:refund r1|3>2:already done","code":"def refund(order_id: str, amount_cents: int, *, ctx) -> str:\n    key = f\"{ctx.run_id}:{ctx.tool_use_id}\"\n    r = stripe.Refund.create(payment_intent=lookup_pi(order_id),\n                             amount=amount_cents, idempotency_key=key)\n    return f\"refund {r.id} status={r.status}\"","eq":["e2_retries","e9_checkpoint"]},"e8_toolsearch":{"k":"A","p":"E8","cl":"azure","t":"Tool search & dynamic loading","s":"Instead of sending every tool definition, expose a search tool or router that loads only the relevant tools for the current task.","hp":"Helps you scale to hundreds of tools without blowing the context or confusing selection.","x":"Selection accuracy and cost degrade past ~20-50 tools; definitions can cost 10K+ tokens. Options: provider tool search with deferred loading, embedding search over tool descriptions, or per-step tool subsets.","v":"line:5,20,50,100,200|Select accuracy=96,93,85,74,60|With tool search=96,95,93,91,89","code":"# Anthropic tool search (beta at time of writing; check docs)\ntools = [\n    {\"type\": \"tool_search_tool_regex_20251119\", \"name\": \"tool_search_tool_regex\"},\n    *[{**t, \"defer_loading\": True} for t in ALL_TOOLS],  # loaded only when found\n]","eq":["e5_budget"]},"e8_codemode":{"k":"A","p":"E8","cl":"azure","t":"Programmatic tool calling","s":"The model writes code that calls tools as functions (loops, filters, joins) in a sandbox, instead of one JSON tool call per round trip.","hp":"Helps you cut round trips and keep large intermediate results out of the context window.","x":"Good for many similar calls or data-heavy steps: 1 model turn replaces 10-50. Only the printed result returns to context. Needs a sandbox, typed tool stubs, and the same auth and limits as direct calls.","v":"cmp:#JSON tool calls;Code mode|Turns for 20 calls=up to 20;1|Context use=all results;printed summary|Control flow=model per step;loops in code|Needs=nothing extra;sandbox","f":"code mode","code":"# pseudo: model-generated code running in a sandbox with tool stubs\nlate = []\nfor oid in list_open_orders(region=\"EU\"):\n    o = get_order(oid)\n    if o.days_late > 3:\n        late.append((oid, o.customer))\nprint(len(late), late[:10])  # only this enters context","eq":["e8_codeexec"]},"e8_hosted":{"k":"B","p":"E8","cl":"multi","t":"Client vs server-side tools","s":"Client tools run in your code; server (hosted) tools like web search or code execution run inside the provider and return results in the same call.","hp":"Helps you decide what you must implement and secure yourself versus rent from the API.","x":"Hosted tools: no infra, billed per use, less control over data paths and logging. Client tools: full control, your auth and sandbox. Mixing both in one request is normal.","v":"cmp:#Client tool;Server tool|Runs in=your app;provider|Round trip=yours;inside call|Control=full;limited|Examples=DB query;web search","eq":["e8_mcp"]},"e8_codeexec":{"k":"I","p":"E8","cl":"aws","t":"Code execution sandbox","s":"A tool that runs model-written code (usually Python) in an isolated sandbox for math, data analysis, file transforms and charts.","hp":"Helps you get exact computation instead of the model guessing at arithmetic or data stats.","x":"Hosted options exist on major APIs; self-host with containers, gVisor, Firecracker or services like E2B. Enforce no-network or egress allowlist, CPU/mem/time limits, and fresh state per session.","v":"arch:Sandbox:LLM>Code tool>Container,No network,Time limit>stdout,files","code":"resp = client.messages.create(\n    model=MODEL, max_tokens=4096,\n    tools=[{\"type\": \"code_execution_20250825\", \"name\": \"code_execution\"}],\n    messages=[{\"role\": \"user\", \"content\": \"Load sales.csv and plot monthly revenue\"}])\n# may need a beta header depending on API version","eq":["e15_sandbox","e8_codemode"]},"e8_websearch":{"k":"B","p":"E8","cl":"aws","t":"Web search & fetch tools","s":"Tools that query a search engine and fetch page content so the model can answer with fresh, cited information.","hp":"Helps you answer questions past the training cutoff with sources.","x":"Hosted search tools return results with citations; cap uses per request (e.g. max_uses 3-5) and set allowed/blocked domains. Fetched pages are untrusted input: a prime prompt-injection vector.","v":"flow:query>search API>top results>fetch page>cite answer","code":"tools = [{\"type\": \"web_search_20250305\", \"name\": \"web_search\", \"max_uses\": 5,\n          \"allowed_domains\": [\"docs.python.org\", \"peps.python.org\"]}]\nresp = client.messages.create(model=MODEL, max_tokens=2048, tools=tools,\n                              messages=[{\"role\": \"user\", \"content\": q}])","eq":["e6_citations","e15_injection"]},"e8_computeruse":{"k":"A","p":"E8","cl":"aws","t":"Computer use & browser automation","s":"Agents that operate a GUI from screenshots via mouse and keyboard actions, or drive a browser via DOM/accessibility trees (e.g. Playwright).","hp":"Helps you automate apps that have no API.","x":"Slow (seconds per action) and error-prone versus APIs; use only when no API exists. Run in an isolated VM with no real credentials, cap steps, and require approval for purchases or sends. DOM-based browser tools are faster than pixels.","v":"flow:screenshot>model plans>click or type>new screenshot|loop","f":"CUA, browser agents","code":"tools = [{\"type\": \"computer_20250124\", \"name\": \"computer\",\n          \"display_width_px\": 1280, \"display_height_px\": 800}]\nresp = client.beta.messages.create(model=MODEL, max_tokens=1024, tools=tools,\n    betas=[\"computer-use-2025-01-24\"], messages=msgs)\n# you execute each returned action (click, type, screenshot) in a VM","eq":["e15_sandbox","e9_hitl"]},"e8_mcp":{"k":"B","p":"E8","cl":"aws","t":"Model Context Protocol (MCP)","s":"Open protocol (JSON-RPC) that lets any AI host connect to any server exposing tools, resources and prompts in a standard way.","hp":"Helps you write an integration once and use it from many AI apps and agents.","x":"Turns M apps x N integrations into M + N. Supported by major assistants, IDEs and agent SDKs. A server is just a process or HTTP endpoint; tools from it look like normal function tools to the model.","v":"draw:mcp","eq":["e8_hosted","e8_a2a"]},"e8_mcparch":{"k":"B","p":"E8","cl":"multi","t":"MCP hosts, clients & servers","s":"The host is the AI app; it runs one MCP client per connection; each client talks to one server exposing capabilities.","hp":"Helps you know which side owns auth, consent and tool routing.","x":"Lifecycle: initialize (capability negotiation) -> list tools/resources -> calls -> notifications (e.g. tools list changed). The host decides which server tools reach the model and asks user consent.","v":"arch:MCP:User>Host app>Client 1,Client 2>Server A,Server B","eq":["e8_mcpprims"]},"e8_mcpprims":{"k":"B","p":"E8","cl":"multi","t":"MCP primitives","s":"Servers expose tools (model-invoked actions), resources (app-controlled read-only data) and prompts (user-chosen templates).","hp":"Helps you pick the right primitive instead of making everything a tool.","x":"Tools: model decides. Resources: URIs the host attaches as context. Prompts: slash-command style templates. Client-side features include sampling (server asks host LLM) and elicitation (ask the user).","v":"table:Primitive,Controlled by,Example|Tools,model,create_issue|Resources,app,file URI|Prompts,user,review PR","eq":["e8_mcparch"]},"e8_mcptransport":{"k":"I","p":"E8","cl":"multi","t":"MCP transports","s":"How client and server exchange JSON-RPC: stdio for local subprocess servers, Streamable HTTP for remote servers.","hp":"Helps you choose between a local dev tool and a shared, multi-user remote service.","x":"stdio: host spawns the server; simple, single user, inherits local creds. Streamable HTTP: one endpoint, POST plus optional SSE streaming, sessions, works behind load balancers. Old HTTP+SSE transport is deprecated.","v":"cmp:#stdio;Streamable HTTP|Runs=local subprocess;remote service|Users=one;many|Auth=env vars;OAuth|Scale=per machine;load balanced","code":"{\n  \"mcpServers\": {\n    \"sqlite\": {\"command\": \"uvx\", \"args\": [\"mcp-server-sqlite\", \"--db-path\", \"app.db\"]},\n    \"issues\": {\"type\": \"http\", \"url\": \"https://mcp.example.com/mcp\"}\n  }\n}","eq":["e8_mcpauth"]},"e8_mcpauth":{"k":"A","p":"E8","cl":"azure","t":"MCP authorization (OAuth)","s":"Remote MCP servers authorize users via OAuth 2.1: the server acts as a resource server and the client obtains scoped tokens from an authorization server.","hp":"Helps you expose per-user data through MCP without sharing API keys.","x":"Uses protected resource metadata for discovery, PKCE, and audience-bound tokens. Never pass the client's token through to upstream APIs (token passthrough is forbidden); exchange it. Request minimal scopes.","v":"seq:Client,MCP server,Auth server|1>2:call no token|2>1:401 + metadata|1>3:OAuth + PKCE|3>1:access token|1>2:call with token","eq":["e15_leastpriv"]},"e8_fastmcp":{"k":"I","p":"E8","cl":"aws","t":"Building an MCP server (FastMCP)","s":"Write an MCP server in Python with decorators: type hints and docstrings become the tool schema and description.","hp":"Helps you expose an internal API or DB to every MCP host in ~20 lines.","x":"FastMCP ships in the official mcp Python SDK and as a standalone package. Test with MCP Inspector. Keep tools task-level and read-only by default; return concise text.","v":"flow:define tools>type hints>schema auto>run server>MCP Inspector","code":"from mcp.server.fastmcp import FastMCP\n\nmcp = FastMCP(\"orders\")\n\n@mcp.tool()\ndef get_order_status(order_id: str) -> str:\n    \"\"\"Return status and ETA for an order id like ORD-1234.\"\"\"\n    o = db.get(order_id)\n    return f\"{o.status}, ETA {o.eta:%Y-%m-%d}\" if o else \"Order not found\"\n\nmcp.run(transport=\"stdio\")","eq":["e8_schema"]},"e8_mcpsecurity":{"k":"A","p":"E8","cl":"gcp","t":"MCP security risks","s":"MCP-specific threats: tool poisoning (malicious instructions in descriptions), rug-pull updates, shadowed tool names, over-broad scopes and untrusted servers.","hp":"Helps you connect third-party servers without handing attackers your agent.","x":"Pin and review server versions; show full tool descriptions; allowlist servers; least-privilege tokens per server; never mix untrusted-content servers with private-data and send-capable tools (lethal trifecta).","v":"hub:MCP risks|Tool poisoning,Rug pull,Name shadowing,Broad scopes,Token theft,Injection","eq":["e15_trifecta","e15_injection"]},"e8_a2a":{"k":"A","p":"E8","cl":"aws","t":"Agent2Agent (A2A) protocol","s":"Open protocol for agents to discover each other via Agent Cards and delegate long-running tasks across vendors and frameworks.","hp":"Helps you connect independently built agents without custom glue for each pair.","x":"MCP connects an agent to tools; A2A connects agents to agents. Agent Card (JSON at a well-known URL) lists skills and auth. Tasks have states (working, input-required, completed) and stream updates.","v":"cmp:#MCP;A2A|Connects=agent to tools;agent to agent|Unit=tool call;task|Duration=short;long running|Discovery=list tools;Agent Card","eq":["e8_mcp","e9_multiagent"]},"e8_tooleval":{"k":"I","p":"E8","cl":"gcp","t":"Tool-call evaluation","s":"Test whether the model picks the right tool, with correct arguments, in the right order, and stops when done.","hp":"Helps you catch regressions from tool description edits or model upgrades.","x":"Metrics: tool selection accuracy, argument exact/semantic match, unnecessary calls, steps to completion, error recovery rate. Check trajectories, not just final answers. Run on every tool or prompt change.","v":"fanin:Right tool,Right args,Right order,No extra calls|Tool-call score","code":"@pytest.mark.parametrize(\"case\", load_cases(\"tool_cases.jsonl\"))\ndef test_tool_selection(case):\n    resp = call_model(case[\"input\"], tools=TOOLS)\n    call = first_tool_use(resp)\n    assert call.name == case[\"expected_tool\"]\n    assert call.input.items() >= case[\"required_args\"].items()","eq":["e10_agenteval"]},"E9":{"k":"S","p":"E9","t":"Agent Architecture & Orchestration","s":"Designing and operating LLM agents and agentic workflows: patterns, control loops, state, durability, human oversight, multi-agent setups and frameworks.","hp":"Production agents fail on control flow, state and stopping more than on the model; this makes them reliable.","x":"workflows vs agents, workflow patterns, agent loop, ReAct, plan-and-execute, reflection, stop conditions, state graphs, checkpointing, human-in-the-loop, subagents, multi-agent, agent archetypes, sandboxes, frameworks","v":"tree:Agents>Workflows,Agent loop,State,Multi-agent;Workflows>Chain,Route,Parallel;Agent loop>ReAct,Plan,Reflect;State>Checkpoint,HITL","sec":{"pid":"E9","num":9,"title":"Agent Architecture & Orchestration","short":"Agents"}},"e9_augmented_llm":{"k":"B","p":"E9","cl":"multi","t":"The augmented LLM","s":"The basic building block: one LLM call enriched with retrieval, tools and memory, where the model decides when to use each.","hp":"Gives you the unit every workflow and agent is composed from.","x":"Get one augmented call solid first: clear tool docs, retrieval that returns the right chunk, typed output. Most 'agent' bugs reproduce at this level. MCP is a common way to plug in tools and resources.","v":"hub:LLM|Retrieval,Tools,Memory,Typed output,System prompt","f":"Tool-augmented LLM call","eq":["e8_mcp","e8_schema"]},"e9_workflows_vs_agents":{"k":"B","p":"E9","cl":"multi","t":"Workflows vs agents","s":"Workflows run LLM calls along code-defined paths; agents let the model choose the next step in a loop with tools until the task is done.","hp":"Helps you pick the least autonomous design that solves the task: cheaper, faster, easier to test.","x":"Escalate: single call → workflow → agent, only when steps can't be predicted and errors are cheap to detect and fix. Don't build an agent for fixed pipelines, tight latency (<2 s) or zero-tolerance actions.","v":"cmp:#Workflow;Agent|Control=Code paths;Model decides|Cost=Predictable;Variable|Latency=Low;High|Testing=Unit-testable;Needs evals|Fit=Known steps;Open-ended","f":"When not to build an agent"},"e9_workflow_patterns":{"k":"B","p":"E9","cl":"multi","t":"Workflow patterns catalog","s":"Five composable shapes for LLM workflows: prompt chaining, routing, parallelization, orchestrator-workers and evaluator-optimizer.","hp":"Gives you a vocabulary of proven shapes before you invent a custom agent.","x":"Patterns compose: a router can send to a chain whose middle step fans out in parallel. Each is ~20–100 lines of plain async code; write it directly before reaching for a framework.","v":"draw:workflows","f":"Building-effective-agents patterns"},"e9_prompt_chaining":{"k":"B","p":"E9","cl":"azure","t":"Prompt chaining with gates","s":"Split a task into fixed sequential LLM steps, each consuming the previous output, with programmatic checks (gates) between steps.","hp":"Trades latency for accuracy by making each call easier and each failure locatable.","x":"E.g. outline → gate → draft → polish. Gates are cheap code checks (length, schema, keyword) that abort or retry early. 2–5 steps is typical; each step adds a full round-trip of latency.","v":"flow:Outline>Gate check>Draft>Polish","code":"outline = llm(f\"Outline the report on: {topic}\")\nif len(outline.splitlines()) < 3:  # gate: cheap code check\n    raise RetryStep(\"outline too thin\")\ndraft = llm(f\"Write the report from this outline:\\n{outline}\")\nfinal = llm(f\"Tighten the prose, keep every fact:\\n{draft}\")","eq":["e3_chaining"]},"e9_routing":{"k":"B","p":"E9","cl":"azure","t":"Routing","s":"Classify the input first, then send it to a specialized prompt, tool set or model for that category.","hp":"Lets each path have a focused prompt and a right-sized model instead of one bloated prompt.","x":"Router can be a small LLM with structured output, an embedding classifier or rules. Always include a fallback route, log every decision, and measure router accuracy separately (aim for >95%).","v":"fan:Router|Billing,Tech support,Refund,Fallback","code":"# pseudo: classifier returns a typed label\nroute = classify(q)  # Literal[\"billing\", \"tech\", \"refund\", \"other\"]\nhandler = {\"billing\": billing_flow, \"tech\": tech_agent,\n           \"refund\": refund_flow}.get(route, fallback_flow)\nreturn handler(q)","eq":["e12_routing"]},"e9_parallelization":{"k":"I","p":"E9","cl":"azure","t":"Parallelization: sectioning & voting","s":"Run LLM calls concurrently: sectioning splits independent subtasks; voting runs the same task N times and aggregates the answers.","hp":"Cuts wall-clock latency and raises reliability on high-stakes judgments.","x":"Sectioning: e.g. a guardrail check runs alongside the main answer. Voting: 3–5 samples, majority vote, or 'any flag fails' for safety checks. Cost scales with N; respect rate limits with a semaphore.","v":"fan:Input|Section A,Section B,Vote 1,Vote 2,Vote 3","code":"import asyncio\nsem = asyncio.Semaphore(8)\nasync def run(p):\n    async with sem:\n        return await allm(p)\nvotes = await asyncio.gather(*[run(prompt) for _ in range(5)])\nverdict = max(set(votes), key=votes.count)  # majority vote","eq":["e8_parallel"]},"e9_orchestrator":{"k":"I","p":"E9","cl":"azure","t":"Orchestrator-workers","s":"A central LLM decomposes the task at runtime, delegates subtasks to worker calls, then synthesizes their results.","hp":"Handles tasks whose subtasks aren't known in advance, like multi-file edits or broad research.","x":"Unlike parallelization, the model decides the subtasks, not your code. Cap workers (e.g. 5–10), give each a self-contained brief, and have workers return compact summaries, not raw transcripts.","v":"arch:Orchestrator:Task>Orchestrator>Worker A,Worker B,Worker C>Synthesizer"},"e9_evaluator_optimizer":{"k":"I","p":"E9","cl":"azure","t":"Evaluator-optimizer loop","s":"One LLM generates, another evaluates against explicit criteria and returns feedback; loop until it passes or hits a max-iteration cap.","hp":"Improves output when clear criteria exist and feedback demonstrably helps.","x":"Fits when a human critique would measurably improve the draft (translation, code that must pass tests). Cap at 2–4 rounds. Use code checks (tests, linters) as the evaluator where possible: they never hallucinate approval.","v":"flow:Generate>Evaluate>Feedback|loop","code":"draft = generate(task)\nfor _ in range(3):\n    review = evaluate(task, draft)  # -> {passed: bool, feedback: str}\n    if review.passed:\n        break\n    draft = generate(task, previous=draft, feedback=review.feedback)","eq":["e10_judge"]},"e9_loop":{"k":"B","p":"E9","cl":"multi","t":"The agent loop","s":"An agent repeats: gather context, take an action via a tool, verify the result, then decide whether to continue or stop.","hp":"Gives you the mental model to debug any agent: which phase broke?","x":"In code it is a loop over tool calls until the model stops requesting tools or a stop condition fires. Verify is the most-skipped phase: run the tests, re-read the file, check the API response.","v":"flow:Gather context>Act>Verify>Decide|loop","f":"Gather, act, verify, repeat","code":"msgs = [{\"role\": \"user\", \"content\": task}]\nfor step in range(MAX_STEPS):\n    r = client.messages.create(model=MODEL, max_tokens=4096, tools=TOOLS, messages=msgs)\n    msgs.append({\"role\": \"assistant\", \"content\": r.content})\n    if r.stop_reason != \"tool_use\":\n        break\n    msgs.append({\"role\": \"user\", \"content\": run_tools(r.content)})"},"e9_react":{"k":"B","p":"E9","cl":"azure","t":"ReAct (reason + act)","s":"Pattern where the model interleaves reasoning, a tool action and the resulting observation, repeating until it can answer.","hp":"Explains the shape of native tool-calling loops and why visible reasoning improves tool choice.","x":"The 2022 version parsed text ('Thought / Action / Observation'); today native tool calling plus thinking models implement it. Typical failure: long chains of low-value searches, so cap steps.","v":"seq:Model,Tool|1>1:Thought|1>2:Action search|2>1:Observation|1>1:Thought|1>2:Action read|2>1:Observation","f":"Reason + Act"},"e9_plan_execute":{"k":"I","p":"E9","cl":"azure","t":"Plan-and-execute","s":"A planner call writes an explicit step list up front; an executor (often a cheaper model) runs the steps; a replanner revises after failures.","hp":"Makes long tasks inspectable and lets a cheaper model do most of the work.","x":"Keep the plan in state so a human can approve it before execution. Replan on failure or every N steps; rigid plans break when early observations change the picture. 'Plan mode' in coding agents is this pattern.","v":"flow:Plan>Approve>Execute step>Check>Replan|loop"},"e9_reflection":{"k":"I","p":"E9","cl":"azure","t":"Reflection & self-critique","s":"The model critiques its own output or trajectory and retries using that critique, optionally storing lessons for later attempts.","hp":"Catches some errors cheaply, but only when there is an external signal to reflect on.","x":"Ungrounded self-critique often just rephrases, or flips correct answers to wrong ones. It works when grounded in evidence: failing test output, validator errors, tool results. Reflexion-style memory keeps lessons across attempts.","v":"cmp:#Ungrounded;Grounded|Signal=Own opinion;Tests or tool output|Typical gain=Small or negative;Often large|Cost=One extra call;Extra call and run"},"e9_stop_conditions":{"k":"B","p":"E9","cl":"gcp","t":"Stop conditions & budget caps","s":"Explicit rules that end an agent run: task done, max steps, max tokens or dollars, wall-clock timeout, or a streak of failures.","hp":"Prevents runaway loops that burn money and leave users waiting.","x":"Set all of: max_steps (e.g. 20–50), a token/$ budget per run, a timeout, and max consecutive tool errors (e.g. 3). On a cap, return partial results plus the reason. Showing remaining budget to the model helps it wrap up.","v":"fanin:Task done,Max steps,Budget,Timeout,Error streak|Stop run","code":"if step >= 40 or spent_usd > 2.00 or time.monotonic() - t0 > 600:\n    return Result(status=\"budget_exceeded\", partial=state.summary)\nif consecutive_errors >= 3:\n    return Result(status=\"stuck\", partial=state.summary)"},"e9_stuck_detection":{"k":"I","p":"E9","cl":"gcp","t":"Loop & stuck detection","s":"Detect agents repeating the same tool call, oscillating between states or making no progress, then intervene.","hp":"Stops expensive spinning before the step cap and gives the run a chance to recover.","x":"Hash (tool, args) and flag 3+ identical calls in a window; track a progress signal (new files, tests passing). Intervene by injecting a 'change approach' note, escalating to a stronger model, or handing off to a human.","v":"line:1,2,3,4,5,6,7,8|Progress=1,2,4,5,5,5,5,5|Repeat calls=0,0,0,1,2,3,4,5","code":"key = (call.name, json.dumps(call.input, sort_keys=True))\nseen[key] = seen.get(key, 0) + 1\nif seen[key] >= 3:\n    msgs.append({\"role\": \"user\", \"content\":\n        \"You have made this exact call 3 times. Try a different approach.\"})"},"e9_error_recovery":{"k":"I","p":"E9","cl":"azure","t":"Error recovery inside agents","s":"Retry transient failures in code beneath the model, and turn semantic tool failures into informative observations the model can act on.","hp":"Lets agents self-correct instead of crashing or hallucinating success.","x":"Transport errors (429, 5xx, timeouts): retry with backoff, invisible to the model. Semantic errors (bad args, not found): return an is_error tool result with an actionable message. Never return an empty string on failure.","v":"fan:Tool error|Retry w backoff,Error to model,Fallback tool,Escalate human","code":"try:\n    out = tool(**args)\n    return {\"type\": \"tool_result\", \"tool_use_id\": tid, \"content\": out}\nexcept ValidationError as e:\n    return {\"type\": \"tool_result\", \"tool_use_id\": tid, \"is_error\": True,\n            \"content\": f\"Invalid args: {e}. Dates must be YYYY-MM-DD.\"}","eq":["e2_retries"]},"e9_subagents":{"k":"I","p":"E9","cl":"azure","t":"Subagents & context isolation","s":"Spawn a child agent with a fresh context and a narrow brief; it explores or works on its own and returns only a condensed result.","hp":"Keeps the main agent's context clean and lets search-heavy work run in parallel.","x":"A subagent might read 50K tokens and return 1–2K. The brief must be self-contained (goal, constraints, output format) because the child can't see the parent's history. Great for search; risky for tightly coupled edits.","v":"arch:Context isolation:Main agent>Sub A reads 50K,Sub B reads 40K>2K summaries","eq":["e5_compaction"]},"e9_multiagent":{"k":"A","p":"E9","cl":"multi","t":"Multi-agent systems","s":"Several LLM agents with distinct roles, prompts or tools cooperate via a supervisor, handoffs or shared state to complete a task.","hp":"Helps you decide whether splitting work across agents pays off or just multiplies cost and failure modes.","x":"Wins on breadth-first, parallelizable work (research). Hurts on tightly coupled work like coding: context is lost between agents. Reported token use is ~4x chat for one agent and ~15x for multi-agent. Try one agent plus subagents first.","v":"bars:Chat=1,Single agent=4,Multi-agent=15","f":"MAS"},"e9_supervisor":{"k":"A","p":"E9","cl":"azure","t":"Supervisor pattern","s":"A supervisor agent picks which specialist agent acts next and decides when the overall task is complete.","hp":"Gives central control and one place to enforce budgets and policy.","x":"Supervisor sees summaries; specialists see focused tool sets. Every hop goes through the supervisor, adding latency and tokens. Use hierarchical supervisors (teams of teams) only for genuinely large tool sets.","v":"tree:Supervisor>SQL agent,Chart agent,Writer;SQL agent>Schema tool,Query tool"},"e9_handoffs":{"k":"A","p":"E9","cl":"azure","t":"Handoffs & swarm","s":"Agents transfer control of the conversation directly to each other through a handoff tool, with no central coordinator.","hp":"Fits triage-style flows where the right specialist should own the rest of the conversation.","x":"OpenAI Agents SDK handoffs and LangGraph swarm implement this. Decide what context transfers (full history vs summary). Guard against ping-pong with a hop limit and log every transfer.","v":"seq:Triage,Billing,Refunds|1>2:handoff|2>2:answers invoice|2>3:handoff refund|3>3:issues refund","code":"from agents import Agent, Runner\nbilling = Agent(name=\"Billing\", instructions=\"Handle invoice questions.\")\nrefunds = Agent(name=\"Refunds\", instructions=\"Handle refund requests.\")\ntriage = Agent(name=\"Triage\", instructions=\"Route the user.\", handoffs=[billing, refunds])\nresult = await Runner.run(triage, \"I was charged twice\")","eq":["e9_supervisor"]},"e9_debate":{"k":"A","p":"E9","cl":"azure","t":"Multi-agent debate","s":"Several agents propose and critique each other's answers over a few rounds; a judge or vote picks the final answer.","hp":"Can raise accuracy on hard reasoning or judgment tasks, at several times the cost.","x":"Gains are modest and inconsistent versus simple self-consistency voting at equal cost; agents tend to converge on the majority. Use different model families to reduce shared blind spots; cap at 2–3 rounds.","v":"quad:Cost,Accuracy gain|Single call=1,2;Reflection=3,4;Voting x5=5,6;Debate=8,6.5","eq":["e9_parallelization"]},"e9_state_graph":{"k":"I","p":"E9","cl":"multi","t":"State machines & graphs","s":"Model the agent as a graph of nodes (LLM calls, tools, checks) joined by conditional edges over a typed shared state.","hp":"Makes control flow explicit, testable and resumable instead of buried in prompts.","x":"LangGraph StateGraph: a TypedDict state, nodes, add_conditional_edges, compile(checkpointer=...). Cycles allow loops; each step is a checkpoint boundary. 5–10 nodes cover most apps.","v":"arch:StateGraph:Start>Agent>Tools,Review>End","f":"LangGraph StateGraph","code":"from langgraph.graph import StateGraph, START, END\ng = StateGraph(State)\ng.add_node(\"agent\", call_model)\ng.add_node(\"tools\", run_tools)\ng.add_edge(START, \"agent\")\ng.add_conditional_edges(\"agent\", route, {\"tools\": \"tools\", \"done\": END})\ng.add_edge(\"tools\", \"agent\")\napp = g.compile(checkpointer=saver)"},"e9_state_design":{"k":"I","p":"E9","cl":"gcp","t":"Agent state design","s":"Decide what the agent carries between steps (messages, structured fields, artifact references, counters) and what gets serialized.","hp":"Keeps context small, resumes clean and makes runs debuggable.","x":"Separate structured state (plan, todos, ids, budget used) from the transcript. Store big artifacts (files, query results) externally and keep references. State must be JSON-serializable to checkpoint; use reducers for parallel writes.","v":"table:Field,Kind,Lives in|messages,transcript,checkpoint|plan,structured,checkpoint|files,artifact,blob store|spent_usd,counter,checkpoint","code":"class State(TypedDict):\n    messages: Annotated[list, add_messages]  # reducer appends\n    plan: list[str]\n    done: list[str]\n    artifacts: dict[str, str]  # name -> blob key, not content\n    spent_usd: float","eq":["e5_memory"]},"e9_checkpoint":{"k":"A","p":"E9","cl":"azure","t":"Checkpointing & durable execution","s":"Persist agent state after each step so runs survive crashes, deploys and long waits, then resume exactly where they stopped.","hp":"Lets multi-minute or multi-day agents and approval waits run reliably in production.","x":"LangGraph: a checkpointer (Postgres, SQLite, Redis) keyed by thread_id; resume by invoking the same thread. Temporal, Restate, DBOS: durable workflows that replay; wrap LLM and tool calls as activities. Make side-effecting tools idempotent.","v":"seq:Worker,Store,New worker|1>2:save step 3|1>1:crash|3>2:load thread|2>3:state at step 3|3>3:resume step 4","f":"Durable agents","code":"from langgraph.checkpoint.postgres import PostgresSaver\nwith PostgresSaver.from_conn_string(DB_URI) as saver:\n    saver.setup()\n    app = graph.compile(checkpointer=saver)\n    cfg = {\"configurable\": {\"thread_id\": \"run-42\"}}\n    app.invoke(None, cfg)  # resumes from the last checkpoint"},"e9_hitl":{"k":"I","p":"E9","cl":"azure","t":"Human-in-the-loop interrupts","s":"Pause the agent at defined points (risky tool calls, plan approval, low confidence) so a human can approve, edit or reject, then resume.","hp":"Lets you ship agents that touch real systems while keeping a human on irreversible actions.","x":"Gate by risk: reads auto-run; writes, payments and emails need approval. Requires checkpointing so a pause can last hours. LangGraph: interrupt() inside a node, resume with Command(resume=...). Show the exact action or diff, not a summary.","v":"seq:Agent,Store,Human|1>2:checkpoint|1>3:approve refund?|3>1:approve|1>1:execute tool","f":"Approvals","code":"from langgraph.types import interrupt, Command\ndef send_email(state):\n    decision = interrupt({\"action\": \"send_email\", \"draft\": state[\"draft\"]})\n    if decision != \"approve\":\n        return {\"status\": \"rejected\"}\n    return {\"status\": mailer.send(state[\"draft\"])}\napp.invoke(Command(resume=\"approve\"), cfg)","eq":["e9_checkpoint"]},"e9_agent_archetypes":{"k":"B","p":"E9","cl":"multi","t":"Agent archetypes","s":"Recurring production agent types with shared design needs: coding, browser/computer-use, deep research, long-horizon and background agents.","hp":"Lets you borrow proven designs instead of starting from a blank loop.","x":"Agents that work share: verifiable outputs (tests, citations), sandboxed actions, cheap rollback (git), and clear done criteria. Domains lacking these are much harder to automate well.","v":"hub:Agent types|Coding,Browser,Research,Long-horizon,Background,Data analysis"},"e9_coding_agents":{"k":"B","p":"E9","cl":"multi","t":"Coding agents","s":"Agents that read, edit and run code in a repo with file, search, shell and test tools, verifying changes by executing them.","hp":"The most mature agent category; its patterns transfer to other domains.","x":"Core tools: grep/glob, read with line ranges, exact-string edit, shell, tests. Verification by tests, linters and type checkers is what makes them work. A repo instructions file (CLAUDE.md, AGENTS.md) sets conventions.","v":"flow:Read issue>Search code>Edit>Run tests>Fix|loop","eq":["e17_coding"]},"e9_sandboxes":{"k":"I","p":"E9","cl":"gcp","t":"Agent sandboxes & environments","s":"Isolated execution environments (containers, microVMs, hosted sandboxes) where agents run code and tools without touching production.","hp":"Lets agents act freely while bounding damage from bugs or injected instructions.","x":"Options: Docker with no network, gVisor or Firecracker microVMs, hosted sandboxes (e.g. E2B, Modal, Daytona). Set CPU, memory and time limits, an egress allowlist, a throwaway filesystem and no prod credentials. Snapshot for reproducible evals.","v":"stack:Agent,Tools,Sandbox microVM,Egress allowlist,Host|2","eq":["e15_sandbox","e8_codeexec"]},"e9_browser_agents":{"k":"A","p":"E9","cl":"azure","t":"Browser & computer-use agents","s":"Agents that operate GUIs through screenshots and mouse/keyboard actions, or browsers through DOM and accessibility-tree actions.","hp":"Automates software that has no API, at a cost in speed and reliability.","x":"Prefer API > DOM/accessibility tree (e.g. Playwright) > pixel-level computer use. Each step takes seconds and a screenshot costs ~1–2K tokens. Every page is untrusted input: an injection surface. Run in an isolated VM or browser profile.","v":"tiers:API,DOM,A11y tree,Pixels|most reliable|least reliable","eq":["e8_computeruse"]},"e9_deep_research":{"k":"I","p":"E9","cl":"azure","t":"Deep research pattern","s":"A lead agent plans the question, fans out parallel search subagents, iterates on gaps, and writes a cited report.","hp":"Gives a template for any broad, many-source information task.","x":"Lead saves the plan to memory; subagents search in parallel and return condensed findings with sources; lead checks coverage and loops; a citation pass maps claims to sources. Runs take minutes and often 100K–1M+ tokens.","v":"flow:Plan>Fan-out search>Synthesize>Gap check>Cite>Report","eq":["e6_citations"]},"e9_long_horizon":{"k":"A","p":"E9","cl":"gcp","t":"Long-horizon agents","s":"Agents that run for hours or across many context windows, persisting progress externally so each fresh session resumes coherently.","hp":"Lets agents finish work far larger than one context window.","x":"Patterns: a progress/notes file updated every few steps, git commits as checkpoints and history, a feature list with pass/fail status, an init script to restore the environment. Each new session reads notes and git log before acting.","v":"flow:Read notes>Pick next task>Work>Commit>Update notes|loop","code":"# session-start ritual for a long-running coding agent\ncat PROGRESS.md\ngit log --oneline -20\n./init.sh && pytest -q --lf\n# ...work on exactly one feature...\ngit commit -am \"feat: export passes tests\" && echo \"- [x] export\" >> PROGRESS.md","eq":["e5_memory"]},"e9_background_agents":{"k":"A","p":"E9","cl":"azure","t":"Background & async agents","s":"Agents that run detached from the request: enqueued as jobs, executed by workers, with status polling or notifications on completion.","hp":"Supports tasks that take minutes to hours without request timeouts or lost work.","x":"Return a run id at once (HTTP 202), execute from a queue (Celery, SQS, Temporal), stream progress events to the UI, notify by webhook or email. Needs checkpointing, idempotent steps, per-job budgets and a cancel endpoint.","v":"seq:Client,API,Queue,Worker|1>2:POST task|2>3:enqueue job|2>1:202 run id|4>3:pull job|4>4:run agent|1>2:GET status","code":"@app.post(\"/agent-runs\", status_code=202)\nasync def start(req: RunReq):\n    run_id = str(uuid4())\n    await db.insert_run(run_id, status=\"queued\")\n    await queue.enqueue(\"run_agent\", run_id=run_id, task=req.task)  # pseudo\n    return {\"run_id\": run_id, \"status_url\": f\"/agent-runs/{run_id}\"}"},"e9_frameworks":{"k":"I","p":"E9","cl":"aws","t":"Agent frameworks landscape","s":"Libraries providing agent loops, tool wiring, state, memory and tracing: LangGraph, OpenAI Agents SDK, Claude Agent SDK, Google ADK, Pydantic AI and more.","hp":"Helps you pick a framework by control level and ecosystem, not by hype.","x":"Low-level graphs: LangGraph. Agent-loop SDKs: OpenAI Agents SDK, Claude Agent SDK, Google ADK, Pydantic AI (typed), smolagents (code-acting). Role-based multi-agent: CrewAI, AutoGen/AG2. TypeScript: Mastra.","v":"quad:Abstraction,Control|LangGraph=3,9;Pydantic AI=4,7;OpenAI SDK=6,6;Google ADK=6,6;Claude SDK=7,5;smolagents=5,5;CrewAI=8,3"},"e9_framework_vs_code":{"k":"I","p":"E9","cl":"gcp","t":"Framework vs plain code","s":"Decide whether to adopt an agent framework or write the loop yourself on the raw model SDK.","hp":"Avoids both reinventing durability and getting trapped behind opaque abstractions.","x":"Plain code: a tool loop is ~50 lines with full control and easy debugging. A framework pays off for checkpointing, HITL, streaming, tracing and multi-agent plumbing. Rule: if you can't see the exact prompt sent, the abstraction is too thick.","v":"cmp:#Plain SDK;Framework|Setup=Minutes;Hours|Prompt visibility=Full;Varies|Durability=Build it;Built in|Lock-in=None;Medium|Debugging=Easy;Harder"},"E10":{"k":"S","p":"E10","t":"Evaluation Engineering","s":"Measuring LLM application quality systematically: error analysis, datasets, code and LLM graders, RAG and agent evals, CI gates and online evals.","hp":"Without evals every prompt or model change is a guess; evals turn iteration into engineering.","x":"eval-driven development, error analysis, golden datasets, synthetic data, code assertions, LLM-as-judge, judge calibration, reference metrics, RAG metrics, agent evals, CI gates, online evals, A/B tests, statistics, harnesses","v":"flow:Traces>Error analysis>Dataset>Graders>CI gate>Online evals|loop","sec":{"pid":"E10","num":10,"title":"Evaluation Engineering","short":"Evals"}},"e10_edd":{"k":"B","p":"E10","cl":"gcp","t":"Eval-driven development","s":"Build the eval before or alongside the feature, then iterate prompts, models and code against it the way TDD iterates against tests.","hp":"Lets you change prompts and models with evidence instead of vibes.","x":"Loop: look at data → name failure modes → write graders → change the system → rerun → ship if nothing regressed. Start with 20–50 cases in week one; a crude eval now beats a perfect one later.","v":"draw:evalloop","f":"EDD","eq":["e1_buildloop"]},"e10_erroranalysis":{"k":"B","p":"E10","cl":"gcp","t":"Error analysis","s":"Systematically read real traces, note what went wrong, and group failures into a taxonomy that tells you what to fix and what to measure.","hp":"Points effort at the failures that actually happen, not imagined ones.","x":"Read 50–100 traces per round; stop when new failure types stop appearing (saturation). Count each category: often 2–3 modes cause most failures. One domain expert owns the judgments; build a simple trace viewer.","v":"bars:Wrong join=34,Missed filter=22,Bad chart type=12,Invented column=9,Tone=4","f":"Trace review, failure taxonomy"},"e10_open_axial":{"k":"I","p":"E10","cl":"azure","t":"Open & axial coding","s":"Qualitative method: write a free-form note on each failing trace (open coding), then cluster notes into named failure categories (axial coding).","hp":"Produces a failure taxonomy grounded in your data rather than a generic checklist.","x":"Open code: one short note per trace on the first upstream error. Axial: group into ~5–10 categories, merge or split, define each crisply enough that someone else could label it. An LLM can propose clusters; a human decides.","v":"flow:Read trace>Open note>Cluster notes>Name category>Count"},"e10_benchmarks":{"k":"B","p":"E10","cl":"multi","t":"Public benchmarks vs product evals","s":"Public benchmarks (e.g. MMLU-Pro, GPQA, SWE-bench) rank general ability; product evals measure your task on your data against your criteria.","hp":"Stops you choosing models from leaderboards that don't predict your use case.","x":"Benchmarks get contaminated and saturate fast; leaderboard gaps of 1–3 points rarely transfer to your app. Use them to shortlist, then run your own eval on 100–300 product cases before switching models.","v":"cmp:#Public benchmark;Product eval|Data=Generic;Your traffic|Criteria=Fixed;Your rubric|Contamination=Likely;Low|Use for=Shortlist;Decision","eq":["e1_modelselect"]},"e10_golden":{"k":"B","p":"E10","cl":"gcp","t":"Golden datasets & test cases","s":"A curated, versioned set of inputs with expected outputs or criteria, covering core use cases, edge cases and known past failures.","hp":"Gives a stable yardstick to compare every change against.","x":"Size: 20–50 to start, 100–300 for ship decisions, 1000+ to resolve small differences. Mix real traffic, every past bug, adversarial and out-of-scope inputs. Each case: input, reference or rubric, tags (feature, difficulty).","v":"ctx:Happy path=40,Edge cases=25,Past bugs=20,Adversarial=10,Out of scope=5|200 cases","code":"{\"id\": \"sql-017\", \"input\": \"Revenue by region last quarter\",\n \"expected_sql_contains\": [\"GROUP BY region\"], \"tags\": [\"sql\", \"date-math\"],\n \"difficulty\": \"medium\", \"source\": \"prod-trace-2026-09-12\"}"},"e10_synthetic":{"k":"I","p":"E10","cl":"azure","t":"Synthetic test generation","s":"Use an LLM to generate test inputs by sampling combinations of dimensions such as persona × scenario × difficulty, then filter by hand.","hp":"Fills coverage gaps before you have real traffic, or for rare cases.","x":"Define 3–4 dimensions with 3–6 values each, sample tuples, and generate one input per tuple in its own call (more diverse than one big list). Drop unrealistic ones; replace with real traces as they arrive.","v":"table:Persona,Scenario,Difficulty|Analyst,Trend query,Easy|Executive,Comparison,Hard|Novice,Ambiguous ask,Medium","code":"import itertools, random\ndims = {\"persona\": [\"analyst\", \"exec\", \"novice\"],\n        \"scenario\": [\"trend\", \"comparison\", \"ambiguous\"],\n        \"difficulty\": [\"easy\", \"hard\"]}\ntuples = random.sample(list(itertools.product(*dims.values())), 12)\ncases = [llm(f\"Write one realistic user question for {t}\") for t in tuples]"},"e10_annotation":{"k":"I","p":"E10","cl":"gcp","t":"Human annotation & review tooling","s":"Interfaces and processes that let domain experts label traces and outputs quickly and consistently.","hp":"Gets high-quality labels for judges, datasets and error analysis without burning out experts.","x":"Small custom viewers often beat generic tools: render the trace for the domain, pass/fail plus a note, keyboard shortcuts. Write labeling guidelines; check agreement on a ~10% overlap. E.g. Argilla, Label Studio, annotation queues.","v":"flow:Sample traces>Queue>Expert labels>Agreement check>Dataset"},"e10_versioning":{"k":"I","p":"E10","cl":"gcp","t":"Eval dataset versioning","s":"Version eval datasets, graders and run results together so scores stay comparable over time.","hp":"Makes 'score went from 82 to 87' meaningful instead of an artifact of a changed dataset.","x":"Keep datasets in git (JSONL) or a platform with immutable versions (LangSmith, Braintrust, Langfuse). Log dataset, grader, prompt and model versions with every run. Don't edit cases in place; add and deprecate.","v":"flow:v1 50 cases>v2 add bugs>v3 new grader>v4 refresh","eq":["e3_versioning"]},"e10_overfitting":{"k":"A","p":"E10","cl":"gcp","t":"Guarding against eval overfitting","s":"Prevent prompts and models from being tuned to the eval set so scores rise while real-world quality doesn't.","hp":"Keeps eval scores a trustworthy proxy for production quality.","x":"Keep a held-out split you rarely look at; add fresh production cases monthly; don't reuse eval items as few-shot examples; when scores near 100% the eval is saturated, so add harder cases. Cross-check with online metrics.","v":"line:v1,v2,v3,v4,v5,v6|Dev set=60,70,78,85,90,94|Held-out=58,67,72,74,73,72"},"e10_graders":{"k":"B","p":"E10","cl":"multi","t":"Grader types","s":"The three ways to score an output: deterministic code checks, model-based grading (LLM-as-judge), and human review.","hp":"Helps you use the cheapest grader that reliably catches each failure mode.","x":"Use code when the property is checkable (format, SQL runs, value present); LLM judges for semantic or subjective criteria; humans for calibration and high-stakes samples. Most suites mix all three, one per failure mode.","v":"cmp:#Code;LLM judge;Human|Cost=~0;Cents;Dollars|Speed=ms;Seconds;Minutes|Nuance=Low;Medium;High|Deterministic=Yes;Mostly;No"},"e10_assertions":{"k":"B","p":"E10","cl":"azure","t":"Code-based assertions","s":"Deterministic checks on outputs: exact match, regex, JSON Schema validation, executing generated SQL, unit tests on generated code.","hp":"Gives free, fast, flake-free signals for every property that code can check.","x":"E.g. valid JSON per schema, required fields present, no banned phrases, citations point to real doc ids, SQL returns the gold rows, code passes tests. Run on 100% of eval cases, and on production traffic too.","v":"tree:Assertions>Exact match,Regex,Schema,Execution;Execution>SQL result,Unit tests","code":"import json, re, jsonschema\ndef grade(out, case):\n    data = json.loads(out)\n    jsonschema.validate(data, ANSWER_SCHEMA)\n    assert re.search(r\"GROUP BY\\s+region\", data[\"sql\"], re.I)\n    assert run_sql(data[\"sql\"]) == run_sql(case[\"gold_sql\"])  # result match","eq":["e4_validation"]},"e10_refmetrics":{"k":"I","p":"E10","cl":"multi","t":"Reference-based metrics & limits","s":"Scores that compare output to a reference answer: exact match, token F1, BLEU/ROUGE, BERTScore, embedding similarity.","hp":"Helps you know when overlap metrics are fine and when they mislead.","x":"EM and F1 suit short factual answers and extraction. BLEU/ROUGE correlate poorly with quality for open-ended LLM text: correct paraphrases score low. Embedding similarity misses negations and numbers. Cheap signals, not ship gates.","v":"table:Metric,Good for,Weak for|Exact match,IDs and labels,Free text|Token F1,Short QA,Paraphrase|ROUGE,Summary overlap,Factuality|BERTScore,Paraphrase,Negation|Cosine sim,Topic match,Numbers","f":"EM, F1, BLEU, ROUGE, BERTScore"},"e10_judge":{"k":"I","p":"E10","cl":"azure","t":"LLM-as-judge","s":"Use an LLM with a focused rubric to grade outputs on criteria code can't check, ideally one judge per failure mode.","hp":"Scales nuanced grading to thousands of cases at a fraction of human cost.","x":"One binary judge per failure mode beats one 'overall quality 1–10' judge. Ask for reasoning before the verdict, return structured JSON, use a strong model, and validate against ~100+ human labels before trusting it.","v":"draw:judge","f":"Model-graded eval","code":"JUDGE = (\"Did the ANSWER use only facts in CONTEXT? Reply JSON with keys \"\n         \"reasoning (str) then pass (bool).\\nCONTEXT: {ctx}\\nANSWER: {ans}\")\nverdict = json.loads(llm(JUDGE.format(ctx=ctx, ans=ans), temperature=0))\nok = verdict[\"pass\"]"},"e10_binary_likert":{"k":"B","p":"E10","cl":"multi","t":"Binary pass/fail vs Likert","s":"Choose between a yes/no verdict per criterion and a graded 1–5 scale for judge and human scoring.","hp":"Gives clearer, more consistent and more actionable labels.","x":"Binary forces a decision and is easy to calibrate and aggregate (pass rate). Likert midpoints are fuzzy and drift between raters and runs. Need nuance? Split into several binary criteria instead of one 1–5 score.","v":"cmp:#Binary;Likert 1-5|Agreement=Higher;Lower|Actionable=Clear fail;What is a 3?|Aggregate=Pass rate;Drifting mean|Calibrate=TPR and TNR;Harder"},"e10_rubric":{"k":"I","p":"E10","cl":"gcp","t":"Judge rubric design","s":"Writing the judge prompt: a precise pass/fail definition, labeled examples of each, and scope limited to one criterion.","hp":"Turns a vague 'is this good?' into a reproducible measurement.","x":"Include the criterion from your failure taxonomy, 2–4 labeled pass and fail examples (from real traces, not the test split), what to ignore, and the output format. Iterate the rubric against human labels like any prompt.","v":"stack:Criterion,Pass definition,Fail examples,What to ignore,Output JSON|0","eq":["e4_jsonschema"]},"e10_pairwise":{"k":"I","p":"E10","cl":"azure","t":"Pairwise vs pointwise judging","s":"Pointwise grades one output against a rubric; pairwise asks which of two outputs is better, often more reliable for subtle differences.","hp":"Lets you compare prompt or model variants when absolute scores can't separate them.","x":"Pairwise suits A-vs-B comparisons but needs order swapping (judge A/B and B/A; call a tie if they disagree) and gives no absolute quality. Pointwise is what regression gates and monitoring need.","v":"seq:Runner,Judge|1>2:A then B|2>1:A wins|1>2:B then A|2>1:A wins|1>1:A wins both orders"},"e10_judge_bias":{"k":"A","p":"E10","cl":"multi","t":"Judge biases","s":"Systematic LLM-judge errors: position bias, verbosity bias, self-preference for its own model family, and leniency.","hp":"Helps you design judges whose scores don't move with irrelevant features.","x":"Swap order in pairwise; state that length isn't a criterion and test with padded answers; judge with a different model family than the generator; anchor with labeled examples; distrust suspiciously high pass rates.","v":"hub:Judge bias|Position,Verbosity,Self-preference,Leniency,Format,Anchoring"},"e10_judge_calibration":{"k":"A","p":"E10","cl":"gcp","t":"Calibrating judges vs humans","s":"Measure judge agreement with expert labels using TPR/TNR and Cohen's kappa on held-out data, then correct reported pass rates.","hp":"Tells you whether to trust the judge and how far to correct its numbers.","x":"Label 100–200 traces; split train (examples), dev (iterate), test (final check). Aim for TPR and TNR >90%; kappa >0.6 is substantial. True rate = (observed + TNR − 1) / (TPR + TNR − 1).","v":"table:Judge vs human,Human pass,Human fail|Judge pass,88,7|Judge fail,6,49","f":"Judge alignment, meta-evaluation","code":"from sklearn.metrics import cohen_kappa_score, confusion_matrix\ntn, fp, fn, tp = confusion_matrix(human, judge).ravel()\ntpr, tnr = tp / (tp + fn), tn / (tn + fp)\nkappa = cohen_kappa_score(human, judge)\ntrue_rate = (observed_rate + tnr - 1) / (tpr + tnr - 1)"},"e10_ragmetrics":{"k":"I","p":"E10","cl":"gcp","t":"RAG metrics","s":"Score retrieval and generation separately: context precision/recall for retrieval, faithfulness and answer relevance for generation.","hp":"Tells you whether to fix the retriever or the generator.","x":"Retrieval: recall@k against labeled relevant chunks, precision, MRR. Generation: faithfulness (claims supported by context), answer relevance, correctness vs reference. RAGAS computes these with LLM judges, so calibrate them too.","v":"table:Metric,Stage,Asks|Context recall,Retrieval,All facts found?|Context precision,Retrieval,Top hits relevant?|Faithfulness,Generation,Claims grounded?|Answer relevance,Generation,Answers the ask?","f":"RAGAS metrics","code":"# ragas classic API; newer versions also expose metric classes\nfrom ragas import evaluate\nfrom ragas.metrics import faithfulness, answer_relevancy, context_precision, context_recall\nres = evaluate(ds, metrics=[faithfulness, answer_relevancy,\n                            context_precision, context_recall])","eq":["e6_ragfailures"]},"e10_agenteval":{"k":"I","p":"E10","cl":"gcp","t":"Agent evals","s":"Evaluate agents on outcome (final state), path (trajectory and tool calls) and reliability across repeated trials in realistic environments.","hp":"Catches agent failures that single-turn output checks miss.","x":"Grade the outcome first (row changed, tests pass); add trajectory checks for safety and efficiency (forbidden tools, step count). Run each task several times since agents are stochastic. Track cost and steps per task too.","v":"tree:Agent eval>Outcome,Trajectory,Reliability,Efficiency;Outcome>Final state,Answer;Reliability>pass@k,pass^k"},"e10_final_state":{"k":"B","p":"E10","cl":"azure","t":"Final-state checks","s":"Grade an agent by inspecting the environment after the run (database rows, files, tickets, test results) rather than its text.","hp":"Gives robust grades that don't penalize valid alternative paths.","x":"Seed the environment, run the agent, assert on state: order refunded with the right amount, tests pass, nothing else changed. Many trajectories can be correct. Always check for unwanted side effects too.","v":"flow:Seed env>Run agent>Inspect state>Assert","code":"def test_refund_task(env):\n    env.seed(\"orders.json\")\n    run_agent(\"Refund order 1042\", env=env)\n    assert env.db.get(\"orders\", 1042)[\"status\"] == \"refunded\"\n    assert env.db.count(\"refunds\") == 1  # no duplicate side effects"},"e10_trajectory":{"k":"A","p":"E10","cl":"azure","t":"Trajectory & tool-call evaluation","s":"Score the sequence of agent steps: right tools, valid arguments, sensible order, no forbidden actions, reasonable step count.","hp":"Finds wasteful or unsafe paths even when the final answer is right.","x":"Checks: exact, in-order or any-order match to reference tool calls, argument validity, forbidden tool used, steps vs budget. Strict path matching is brittle; prefer constraint checks plus an LLM judge on the trajectory.","v":"cmp:#Strict match;Constraint checks|Reference=Exact path;Rules|Brittleness=High;Low|Catches=Any deviation;Unsafe or wasteful|Effort=Label paths;Write rules"},"e10_passk":{"k":"A","p":"E10","cl":"multi","t":"pass@k vs pass^k","s":"pass@k: probability at least one of k trials succeeds; pass^k: probability all k succeed. Capability vs consistency.","hp":"Shows how reliable an agent really is for users who run it again and again.","x":"With per-trial success p: pass@k = 1 − (1 − p)^k rises with k; pass^k = p^k falls. At p = 0.8, pass^8 ≈ 0.17. User-facing agents need pass^k; pass@k fits tasks with a verifier that picks the best of k.","v":"line:k=1,k=2,k=4,k=8|pass@k=80,96,99.8,100|pass^k=80,64,41,17","code":"from math import comb\ndef pass_at_k(n, c, k):  # n trials, c successes (unbiased estimator)\n    return 1.0 if n - c < k else 1 - comb(n - c, k) / comb(n, k)\ndef pass_hat_k(n, c, k):  # all k sampled trials succeed\n    return comb(c, k) / comb(n, k)"},"e10_env_eval":{"k":"A","p":"E10","cl":"gcp","t":"Environment-based agent evals","s":"Run agents in sandboxed, resettable environments (mock APIs, seeded DBs, simulated users) with task sets and programmatic graders.","hp":"Makes agent evals reproducible and safe enough to run in CI.","x":"Parts: task set, environment with reset/snapshot, tools wired to sandboxed backends, an LLM user simulator for multi-turn tasks (as in tau-bench), graders. Keep it deterministic: freeze time, seed data, stub external APIs.","v":"arch:Eval env:Task set>Agent,User sim>Sandbox tools,Seeded DB>Graders","eq":["e15_sandbox"]},"e10_ci":{"k":"B","p":"E10","cl":"gcp","t":"Regression evals in CI","s":"Run the eval suite on every prompt, model or code change and block merges when scores drop below thresholds or regress versus baseline.","hp":"Stops silent quality regressions from reaching production.","x":"Gate per metric: e.g. assertions 100%, judge pass rate ≥ baseline − 2 pts, zero failures on must-pass cases. Run a 20–50 case smoke suite per PR (minutes) and the full suite nightly. Post a diff of changed cases on the PR.","v":"flow:PR>Smoke evals>Compare baseline>Gate>Merge","f":"Eval gates","code":"# .github/workflows/evals.yml (steps excerpt)\n- name: Run smoke evals\n  run: python -m evals.run --suite smoke --out results.json\n- name: Gate against main baseline\n  run: python -m evals.gate results.json --baseline main --max-drop 0.02"},"e10_online":{"k":"I","p":"E10","cl":"gcp","t":"Online evals on production traffic","s":"Run graders (assertions, judges) asynchronously on a sample of live traces to monitor quality without ground-truth labels.","hp":"Catches drift and failure modes your offline set never covered.","x":"Score 1–10% of traces with judges (100% for cheap code checks), off the request path. Chart pass rate per failure mode, alert on drops, and route flagged traces into review queues and back into the golden set.","v":"flow:Prod traces>Sample 5%>Async graders>Dashboard>Alert","eq":["e11_feedback","e11_metrics"]},"e10_abtest":{"k":"A","p":"E10","cl":"gcp","t":"A/B tests for prompts & models","s":"Split live traffic between variants and compare business and quality metrics with statistical tests before full rollout.","hp":"Validates that offline eval wins turn into real user outcomes.","x":"Randomize by user, not request; choose one primary metric (task success, thumbs-up rate, conversion) plus guardrails (latency, cost). Small effects need thousands of sessions; run full weekly cycles. Offline evals first, A/B last.","v":"gbars:Task success %,Thumbs up %,Cost per task c|Prompt A=72,61,4|Prompt B=76,64,5","eq":["e11_modelupgrade"]},"e10_stats":{"k":"A","p":"E10","cl":"gcp","t":"Statistical rigor in evals","s":"Treat eval scores as noisy estimates: size samples adequately, report confidence intervals, and measure variance across repeated runs.","hp":"Stops you shipping or reverting changes based on noise.","x":"95% CI ≈ ±1.96·√(p(1−p)/n): at n = 100, p = 0.8 that's ±8 pts. Resolving a 3-pt gain needs ~1000 cases or paired tests. Run cases 3–5× at prod temperature; compare variants with paired tests (McNemar, paired bootstrap).","v":"line:n=50,n=100,n=200,n=500,n=1000|CI half-width pts=11,8,5.5,3.5,2.5","code":"import numpy as np\ndef paired_bootstrap(a, b, n=10_000):  # per-case 0/1 scores on the same cases\n    d = np.array(b) - np.array(a)\n    idx = np.random.randint(0, len(d), (n, len(d)))\n    boots = d[idx].mean(axis=1)\n    return d.mean(), np.percentile(boots, [2.5, 97.5])","eq":["e1_nondeterminism"]},"e10_cost":{"k":"I","p":"E10","cl":"gcp","t":"Cost of evals","s":"Eval runs cost tokens, judge calls, compute and expert time; budget them like any other workload.","hp":"Keeps evals fast and cheap enough that people actually run them.","x":"Cost ≈ cases × (app calls + judge calls) × repeats. Tier it: ~20-case smoke per commit, full suite nightly or pre-release. Use batch APIs (often ~50% off), prompt caching for judge prompts, and cheaper judges once calibrated.","v":"tiers:Full nightly,Pre-merge,Smoke per commit|thousands of cases|about 20 cases","eq":["e12_costmodel"]},"e10_frameworks":{"k":"I","p":"E10","cl":"aws","t":"Eval harnesses & platforms","s":"Tools to define datasets, run evals, grade and compare runs: promptfoo, DeepEval, RAGAS, Inspect AI, OpenAI Evals, Braintrust, LangSmith, Langfuse, Phoenix.","hp":"Saves you building run tracking, diffing and judge plumbing from scratch.","x":"Code-first: promptfoo (YAML, CI-friendly), DeepEval (pytest-style), Inspect AI (agent and sandbox evals), RAGAS (RAG metrics), OpenAI Evals. Platforms with tracing, datasets and experiments: Braintrust, LangSmith, Langfuse and Arize Phoenix (open source).","v":"quad:Code-first to platform,Agent eval depth|promptfoo=2,4;DeepEval=3,4;Inspect AI=2,9;RAGAS=2,2;Braintrust=8,5;LangSmith=8,7;Langfuse=7,5","code":"from deepeval import assert_test\nfrom deepeval.test_case import LLMTestCase\nfrom deepeval.metrics import AnswerRelevancyMetric\ndef test_answer():\n    tc = LLMTestCase(input=q, actual_output=app(q))\n    assert_test(tc, [AnswerRelevancyMetric(threshold=0.7)])"},"E11":{"k":"S","p":"E11","t":"Observability & LLMOps","s":"How to see, measure and continuously improve LLM features in production: tracing, metrics, feedback, safe rollouts and the data flywheel.","hp":"LLM apps fail quietly with plausible wrong answers; without traces, metrics and feedback you are flying blind.","x":"tracing & spans, OpenTelemetry GenAI, observability platforms, safe logging, metrics & SLOs, feedback, flywheel, prompt management, canary & shadow, model upgrades, drift, incidents, maturity","v":"hub:LLMOps|Tracing,Metrics,Feedback,Flywheel,Prompt mgmt,Rollouts,Drift,Incidents","sec":{"pid":"E11","num":11,"title":"Observability & LLMOps","short":"LLMOps"}},"e11_tracing":{"k":"B","p":"E11","cl":"multi","t":"LLM tracing: traces & spans","s":"A trace records one user request end to end as a tree of timed spans for every LLM call, tool call and retrieval step, with inputs, outputs, tokens and cost.","hp":"Helps you debug why a specific answer was wrong, slow or expensive in seconds instead of guessing.","x":"Propagate one trace_id per request and a session_id per conversation. Capture model, params, prompt version, tokens, latency and errors on every span. Agent runs easily produce 20–200 spans; a waterfall view is the main debugging UI.","v":"draw:tracing","f":"LLM traces, run trees","eq":["e11_otel","e11_tools"]},"e11
