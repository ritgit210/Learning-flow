alytics","s":"Warehouses, lakehouses, ETL, Spark, streaming analytics, catalogs and BI.","hp":"Turn raw data into reports, features and decisions.","x":"Fabric/Synapse, Redshift, BigQuery, Glue/Data Factory/Dataflow, Databricks, BI","v":"draw:lakehouse","sec":{"pid":"T10","num":10,"title":"Data & Analytics","short":"Data & analytics"}},"T11":{"k":"S","p":"T11","t":"AI & ML Platforms (GenAI + MLOps)","s":"Foundation models, RAG, agents, guardrails, fine-tuning and the full MLOps lifecycle.","hp":"Build GenAI apps and train, deploy and govern ML models.","x":"Microsoft Foundry, Amazon Bedrock, Vertex AI, SageMaker, Azure ML, TPUs","v":"draw:rag","sec":{"pid":"T11","num":11,"title":"AI & ML Platforms (GenAI + MLOps)","short":"AI & ML platforms"}},"T12":{"k":"S","p":"T12","t":"Applied AI Services","s":"Prebuilt APIs for vision, documents, speech, language, search, bots and assistants.","hp":"Add AI features with an API call, no training needed.","x":"AI Search/Kendra/Vertex AI Search, Document Intelligence/Textract, Speech, Lex","v":"flow:Input>Prebuilt AI API>Structured result>Your app","sec":{"pid":"T12","num":12,"title":"Applied AI Services","short":"Applied AI"}},"T13":{"k":"S","p":"T13","t":"DevOps, CI/CD & IaC","s":"Pipelines, infrastructure as code, deployment strategies, GitOps and supply-chain security.","hp":"Ship safely and often; rebuild any environment from code.","x":"Azure DevOps, GitHub Actions, CodePipeline, Cloud Build, Terraform, Bicep, CDK","v":"draw:cicd","sec":{"pid":"T13","num":13,"title":"DevOps, CI/CD & IaC","short":"DevOps & IaC"}},"T14":{"k":"S","p":"T14","t":"Observability & Operations","s":"Metrics, logs, traces, alerts, audit trails, patching and chaos testing.","hp":"Know when things break and why, before users do.","x":"Azure Monitor, CloudWatch, Cloud Monitoring, X-Ray, Prometheus, Grafana, OTel","v":"draw:observability","sec":{"pid":"T14","num":14,"title":"Observability & Operations","short":"Observability & ops"}},"T15":{"k":"S","p":"T15","t":"Governance, Cost, Migration & DR","s":"Policies, landing zones, cost control, migration and disaster recovery.","hp":"Stay compliant, on budget and recoverable at scale.","x":"Azure Policy, Control Tower, Org Policy, Cost Explorer, Azure Migrate, DR","v":"draw:dr","sec":{"pid":"T15","num":15,"title":"Governance, Cost, Migration & DR","short":"Governance & cost"}},"T16":{"k":"S","p":"T16","t":"Reference Architectures","s":"Common scenarios mapped to services on each cloud.","hp":"See which services fit together for a given problem.","x":"Web apps, serverless APIs, RAG & agents, MLOps, lakehouse, streaming, IoT, HA","v":"arch:multi:Users>Edge / CDN>App tier>Data tier,AI services","sec":{"pid":"T16","num":16,"title":"Reference Architectures","short":"Architectures"}},"t1_regions":{"k":"B","cl":"multi","t":"Regions & availability zones","s":"A region is a geographic area of datacenters; AZs are isolated sites in it with own power/network.","hp":"Pick region for latency, data residency, price; spread across AZs for HA","x":"Not every service/GPU SKU exists in every region. Prices differ by region. Cross-AZ traffic is usually billed. Multi-region = DR, not default.","p":"T1","v":"draw:region"},"az_regions":{"k":"B","cl":"azure","t":"Azure regions & availability zones","s":"60+ Azure regions; AZ-enabled regions have 3 zones; many regions have a paired region for DR.","hp":"Zone-redundant SKUs give 99.99% SLAs without app changes","x":"Zone numbers (1,2,3) are mapped per subscription, so zone 1 differs between subs. Some regions are non-paired. Sovereign clouds separate.","p":"T1","code":"az account list-locations -o table","v":"tree:Geography>Region A,Region B;Region A>Zone 1,Zone 2,Zone 3;Region B>Zone 1b","eq":["aws_regions","gcp_regions"]},"aws_regions":{"k":"B","cl":"aws","t":"AWS Regions & Availability Zones","s":"~38 AWS Regions, each with 3+ AZs (~120 AZs total) that are physically separate yet low-latency linked.","hp":"Deploy across 2-3 AZs for HA; most AWS SLAs assume multi-AZ","x":"AZ names (us-east-1a) are shuffled per account; use AZ IDs (use1-az1) to align. Opt-in regions must be enabled. Inter-AZ data billed.","p":"T1","code":"aws ec2 describe-availability-zones --region us-east-1","v":"tree:Region>AZ a,AZ b,AZ c;AZ a>Data center 1,Data center 2","eq":["az_regions","gcp_regions"]},"gcp_regions":{"k":"B","cl":"gcp","t":"Google Cloud regions & zones","s":"40+ Google Cloud regions, usually 3 zones each; resources are zonal, regional or multi-regional.","hp":"Regional resources (GKE regional, regional MIG) survive a zone outage","x":"Some services are global (VPC, LB, IAM). Multi-region and dual-region buckets/DBs exist. Zone names like us-central1-a.","p":"T1","code":"gcloud compute zones list --filter=\"region:us-central1\"","v":"tree:Region>Zone a,Zone b,Zone c;Zone a>Zonal VM;Region>Global VPC","eq":["az_regions","aws_regions"]},"t1_edgelocs":{"k":"I","cl":"multi","t":"Edge & local zones","s":"Small footprints near users: CDN PoPs, AWS Local Zones/Wavelength, Azure Extended Zones, Google edge.","hp":"Single-digit ms latency for gaming, media, 5G or metro users","x":"Limited service catalog and instance types vs full regions; higher price. CDN PoPs cache only, they don't run your VMs.","p":"T1","v":"cmp:Edge zones=Azure Extended Zones;AWS Local Zones;Google Distributed Cloud|5G edge=Azure Operator Nexus;AWS Wavelength;GDC Edge|CDN PoPs=Front Door;CloudFront;Cloud CDN"},"t1_servicemodels":{"k":"B","cl":"multi","t":"Service models: IaaS, PaaS, SaaS, FaaS","s":"Layers of how much the cloud manages for you, from raw VMs up to finished software.","hp":"Choose the highest layer that still fits your control needs","x":"Higher layer = less ops, faster delivery, more lock-in and less tuning. Containers/CaaS sit between IaaS and PaaS.","p":"T1","v":"stack:Application,Data,Runtime,Middleware,OS,Virtualization,Servers,Network|4"},"t1_iaas":{"k":"B","cl":"multi","t":"IaaS (Infrastructure as a Service)","s":"You rent VMs, disks and networks; you manage OS, runtime, app and data.","hp":"Lift-and-shift, custom OS/kernels, licensed software, full control","x":"You patch the OS and build HA yourself. Cheapest per vCPU but most ops toil.","p":"T1","v":"cmp:VMs=Azure VMs;Amazon EC2;Compute Engine|Disks=Managed Disks;EBS;Persistent Disk|Networks=VNet;VPC;VPC"},"t1_paas":{"k":"B","cl":"multi","t":"PaaS (Platform as a Service)","s":"You deploy code or containers; the provider runs OS, runtime, scaling and patching.","hp":"Ship web apps/APIs without managing servers","x":"Opinionated runtimes and limits (timeouts, ports, file system). Managed DBs are PaaS too.","p":"T1","v":"cmp:Web apps=App Service;Elastic Beanstalk;App Engine|Containers=Container Apps;App Runner;Cloud Run|SQL=Azure SQL;RDS;Cloud SQL"},"t1_saas":{"k":"B","cl":"multi","t":"SaaS (Software as a Service)","s":"Finished applications you consume by subscription (M365, Salesforce, Google Workspace).","hp":"Buy, don't build, for commodity capabilities","x":"You still own data, identities and configuration (shared responsibility). Integration via APIs/SSO.","p":"T1","v":"stack:Your data & users,Application,Platform,Infrastructure|3"},"t1_faas":{"k":"B","cl":"multi","t":"FaaS / serverless functions","s":"Run event-triggered functions; the platform scales instances (to zero) and bills per invocation/duration.","hp":"Spiky, event-driven glue code and APIs with near-zero idle cost","x":"Cold starts, max timeouts (Lambda 15 min), statelessness. Serverless also covers DBs/queues billed per use.","p":"T1","v":"draw:serverless"},"t1_shared":{"k":"B","cl":"multi","t":"Shared responsibility model","s":"Security split: the provider secures the cloud itself; you secure what you put in it.","hp":"Know exactly which controls (patching, IAM, encryption) are yours","x":"Always yours: data, identities, access config, endpoints. Your share shrinks from IaaS to SaaS but never hits zero.","p":"T1","v":"draw:shared"},"t1_hierarchy":{"k":"B","cl":"multi","t":"Resource hierarchy","s":"How each cloud groups accounts/projects and resources for policy, billing and access inheritance.","hp":"Design it first: it decides blast radius, billing and IAM inheritance","x":"Policies and IAM inherit downward. Account/subscription/project = main isolation and billing boundary.","p":"T1","v":"cmp:Top=Tenant root MG;Organization root;Organization|Grouping=Management groups;OUs;Folders|Boundary=Subscription;Account;Project|Container=Resource group;(tags);(labels)"},"az_mgmt":{"k":"B","cl":"azure","t":"Azure management groups, subscriptions & resource groups","s":"Entra tenant > management groups (up to 6 levels) > subscriptions > resource groups > resources.","hp":"Apply Azure Policy/RBAC once at MG level; use RGs for lifecycle grouping","x":"Every resource lives in exactly one RG; deleting an RG deletes all inside. Subscription = billing + quota boundary. RG location is metadata only.","p":"T1","code":"az group create -n rg-app -l eastus2 --tags env=dev","v":"tree:Root MG>Platform,Landing zones;Platform>Connectivity sub,Identity sub;Landing zones>Prod sub,Dev sub;Prod sub>rg-app","eq":["aws_orgaccts","gcp_rm"]},"aws_orgaccts":{"k":"B","cl":"aws","t":"AWS accounts & Organizational Units","s":"AWS Organizations: a management account with OUs (up to 5 levels) holding member accounts.","hp":"Account-per-workload/env gives strong isolation; SCPs apply per OU","x":"The account is the hard security & billing boundary. Keep management account empty of workloads. Consolidated billing shares discounts.","p":"T1","f":"AWS Organizations","code":"aws organizations create-organizational-unit --parent-id r-abcd --name Workloads","v":"tree:Root>Security OU,Workloads OU,Sandbox OU;Security OU>Log archive,Audit;Workloads OU>Prod acct,Dev acct","eq":["az_mgmt","gcp_rm"]},"gcp_rm":{"k":"B","cl":"gcp","t":"Google Cloud Resource Manager (organization, folders, projects)","s":"Organization node > folders (up to 10 levels) > projects > resources; IAM and org policies inherit down.","hp":"Folders per business unit/env; one project per app per environment","x":"Project ID is global and immutable. Organization needs Cloud Identity or Workspace domain. Deleted projects recoverable 30 days.","p":"T1","code":"gcloud projects create app-prod-123 --folder=123456789","v":"tree:Organization>Prod folder,Nonprod folder;Prod folder>app-prod,data-prod;Nonprod folder>app-dev,sandbox","eq":["az_mgmt","aws_orgaccts"]},"t1_pricing":{"k":"B","cl":"multi","t":"Pricing models","s":"Pay-as-you-go, commitment discounts, or spare-capacity spot pricing for the same compute.","hp":"Mix models: commit the steady baseline, spot the flexible, on-demand the rest","x":"Data egress, storage ops and idle resources often dominate bills. Commitments are billed even if unused.","p":"T1","v":"draw:pricing"},"t1_ondemand":{"k":"B","cl":"multi","t":"On-demand / pay-as-you-go","s":"Pay per second/hour of use with no commitment; the default list price.","hp":"New, spiky or short-lived workloads where usage is unknown","x":"Most expensive rate for steady use. Per-second billing on most Linux VMs (60s minimum on AWS/GCP).","p":"T1","v":"bars:On-demand=100,Savings plan=60,Reserved=45,Spot=15"},"t1_commit":{"k":"I","cl":"multi","t":"Commitment discounts","s":"Commit to 1 or 3 years of usage or spend in exchange for large discounts.","hp":"Cover the always-on baseline once usage is stable","x":"Pay upfront, partial or monthly. Size to the floor of usage, not peak. Track utilization/coverage monthly.","p":"T1","v":"cmp:Resource commit=Reservations;Reserved Instances;Resource-based CUDs|Spend commit=Savings plan;Savings Plans;Spend-based CUDs|Max off=~72%;~72%;~70%"},"az_reservations":{"k":"I","cl":"azure","t":"Azure Reservations","s":"1- or 3-year commitment to a VM size family/region (also SQL, Cosmos DB, storage) for up to ~72% off.","hp":"Predictable VMs/databases that won't change SKU or region","x":"Instance size flexibility within a family. Exchanges/refunds limited. Can scope to shared, sub or RG.","p":"T1","v":"bars:PAYG=100,1-year=60,3-year=38","eq":["aws_ri","gcp_cud"]},"az_savingsplan":{"k":"I","cl":"azure","t":"Azure savings plan for compute","s":"Commit hourly compute spend for 1 or 3 years across VM sizes, regions, App Service, Functions Premium.","hp":"Compute that shifts SKUs or regions but has stable spend","x":"Up to ~65% off. Reservations apply first, then savings plan. Not for databases.","p":"T1","eq":["aws_savingsplans","gcp_cud"]},"aws_ri":{"k":"I","cl":"aws","t":"Reserved Instances","s":"1- or 3-year reservation for EC2, RDS, ElastiCache, OpenSearch, Redshift capacity at up to ~72% off.","hp":"Databases and caches with fixed instance types","x":"For EC2, AWS recommends Savings Plans instead. Standard vs Convertible RIs. Zonal RIs also reserve capacity.","p":"T1","eq":["az_reservations","gcp_cud"]},"aws_savingsplans":{"k":"I","cl":"aws","t":"Savings Plans","s":"Commit $/hour for 1 or 3 years: Compute SP (EC2, Fargate, Lambda), EC2 Instance SP, SageMaker AI SP.","hp":"Default commitment for EC2/Fargate/Lambda baseline","x":"Compute SP up to ~66% off and flexible across family/region/OS; EC2 Instance SP up to ~72% but family+region locked.","p":"T1","code":"aws savingsplans describe-savings-plans","v":"table:Plan,Max off,Flex|Compute,66%,1|EC2 Instance,72%,family|SageMaker AI,64%,ML","eq":["az_savingsplan","gcp_cud"]},"gcp_cud":{"k":"I","cl":"gcp","t":"Committed use discounts (CUDs)","s":"1- or 3-year commitments: resource-based (vCPU/memory/GPU in a region) or spend-based (flexible, per service).","hp":"Steady Compute Engine, GKE, Cloud SQL, Cloud Run baseline","x":"Resource CUDs up to ~55% (70% memory-optimized); flexible compute CUDs up to ~46%. Commitments can't be cancelled.","p":"T1","code":"gcloud compute commitments create cud-1 --region=us-central1 --plan=12-month --resources=vcpu=8,memory=32GB","eq":["az_reservations","aws_savingsplans"]},"gcp_sud":{"k":"I","cl":"gcp","t":"Sustained use discounts","s":"Automatic discount (up to ~30%) for some Compute Engine VM families that run most of a month.","hp":"Get savings without any commitment on GCP","x":"Applies to N1, N2, N2D, C2 etc.; not E2, N4, C3 or spot. No sign-up needed. Usage covered by CUDs gets no SUD.","p":"T1","v":"bars:25% month=100,50% month=93,75% month=80,100% month=70"},"t1_spot":{"k":"B","cl":"multi","t":"Spot / preemptible capacity","s":"Spare capacity at 60-90% off that the provider can reclaim with short notice (30s-2 min).","hp":"Batch, CI runners, stateless workers, training with checkpoints","x":"Design for interruption: checkpoints, diversified instance types, fallback to on-demand. No SLA.","p":"T1","v":"cmp:Name=Azure Spot VMs;EC2 Spot;Spot VMs|Notice=30 seconds;2 minutes;30 seconds|Max discount=~90%;~90%;~91%"},"t1_egress":{"k":"I","cl":"multi","t":"Data transfer (egress) costs","s":"Ingress is free; data out to internet, across regions and often across AZs is billed per GB.","hp":"Budget and architect around data gravity and chatty cross-zone traffic","x":"Common surprise: NAT gateway processing, cross-AZ replication, multi-cloud egress. CDNs and private interconnects lower per-GB rates.","p":"T1","v":"bars:Same AZ=0,Cross-AZ=1,Cross-region=2,Internet=9"},"t1_freetier":{"k":"B","cl":"multi","t":"Free tiers & credits","s":"New-account credits plus always-free usage allowances for learning and prototypes.","hp":"Learn and prototype without a bill; set budgets on day 1","x":"Free tiers exceed easily (NAT gateways, public IPv4, idle DBs). Always set a budget alert.","p":"T1","v":"cmp:Credit=$200 / 30 days;Up to $200;$300 / 90 days|Always free=55+ services;30+ services;20+ products|Example=Functions 1M req;Lambda 1M req;e2-micro VM"},"az_free":{"k":"B","cl":"azure","t":"Azure free account","s":"$200 credit for 30 days, 12 months of popular services free, plus 55+ always-free services.","hp":"Try Azure services hands-on at no cost","x":"Must upgrade to pay-as-you-go to continue after 30 days. Students: Azure for Students ($100, no card).","p":"T1","eq":["aws_freetier","gcp_free"]},"aws_freetier":{"k":"B","cl":"aws","t":"AWS Free Tier","s":"Since July 2025 new accounts get up to $200 credits on a 6-month free plan, plus always-free offers.","hp":"Hands-on AWS learning without charges","x":"Free plan accounts can't use some services until upgraded; accounts before 15 Jul 2025 keep legacy 12-month offers.","p":"T1","eq":["az_free","gcp_free"]},"gcp_free":{"k":"B","cl":"gcp","t":"Google Cloud Free Program","s":"$300 credit for 90 days plus Free Tier: e2-micro VM, 5 GB Cloud Storage, 1 TB BigQuery queries/month, etc.","hp":"Generous BigQuery and Cloud Run free usage for prototypes","x":"Free trial won't auto-charge until you activate a full account. Free Tier limits are per billing account.","p":"T1","eq":["az_free","aws_freetier"]},"t1_waf":{"k":"I","cl":"multi","t":"Well-architected frameworks","s":"Each cloud's best-practice guidance and review tools organized into pillars.","hp":"Run a review before go-live and at major changes","x":"Same core ideas everywhere; AWS and Google add Sustainability. Reviews produce prioritized risk lists.","p":"T1","v":"cmp:Framework=Azure Well-Architected;AWS Well-Architected;Google Well-Architected|Pillars=5;6;6|Tool=WAF Assessment;WA Tool;Architecture Center"},"t1_pillars":{"k":"I","cl":"multi","t":"Pillars","s":"Reliability, Security, Cost optimization, Operational excellence, Performance efficiency (+ Sustainability).","hp":"Use pillars to frame trade-offs explicitly","x":"Pillars conflict: more reliability costs more; more security can slow ops. Document the trade-offs you choose.","p":"T1","v":"hub:Workload|Reliability,Security,Cost,Operations,Performance,Sustainability"},"az_wellarch":{"k":"I","cl":"azure","t":"Azure Well-Architected Framework","s":"Microsoft guidance with 5 pillars, service guides and the Well-Architected Review assessment.","hp":"Assess Azure workloads; Azure Advisor maps recommendations to pillars","x":"Complements Cloud Adoption Framework (landing zones). Has AI/ML, SaaS and mission-critical workload guides.","p":"T1","eq":["aws_wellarch","gcp_wellarch"]},"aws_wellarch":{"k":"I","cl":"aws","t":"AWS Well-Architected Framework","s":"6 pillars, domain lenses (Serverless, ML, GenAI, SaaS) and the free Well-Architected Tool in the console.","hp":"Track high/medium risks per workload over time","x":"Lenses add domain questions; Partner-led reviews may fund fixes. Pillars incl. Sustainability since 2021.","p":"T1","eq":["az_wellarch","gcp_wellarch"]},"gcp_wellarch":{"k":"I","cl":"gcp","t":"Google Cloud Well-Architected Framework","s":"Google's best-practice framework (formerly Architecture Framework) with pillars and AI/ML perspective.","hp":"Design GCP workloads against Google's recommended practices","x":"Pillars: operational excellence; security, privacy & compliance; reliability; cost; performance; sustainability.","p":"T1","f":"Formerly Google Cloud Architecture Framework","eq":["az_wellarch","aws_wellarch"]},"t1_sla":{"k":"I","cl":"multi","t":"SLAs (service level agreements)","s":"Provider's uptime commitment per service; misses earn service credits, not compensation for your losses.","hp":"Know each dependency's SLA to set realistic SLOs","x":"SLA needs the right config (multi-AZ, Premium tier). 99.9% = ~43 min/month down; 99.99% = ~4.3 min.","p":"T1","v":"bars:99%=438,99.9%=44,99.95%=22,99.99%=4"},"t1_compositesla":{"k":"I","cl":"multi","t":"Composite SLA","s":"Availability of serial dependencies multiplies: 99.95% app x 99.99% DB = ~99.94% overall.","hp":"Calculate end-to-end availability; add redundancy where it drops","x":"Serial chains lower availability; parallel redundant paths raise it: 1-(1-a)^n. Include DNS, LB, identity.","p":"T1","v":"flow:App 99.95%>DB 99.99%>Cache 99.9%>Total ~99.84%"},"t1_slo":{"k":"I","cl":"multi","t":"SLIs, SLOs & error budgets","s":"SLI = measured metric, SLO = internal target, error budget = allowed unreliability before slowing releases.","hp":"Balance feature velocity with reliability using data","x":"Set SLOs tighter than the customer SLA. Cloud Monitoring, CloudWatch and Azure Monitor support SLO tracking.","p":"T1","v":"flow:SLI measured>SLO target>Error budget>Release decision|loop"},"t1_tools":{"k":"B","cl":"multi","t":"Cloud tooling: CLIs, consoles, SDKs","s":"Ways to interact with a cloud: web console, CLI/shell, SDKs and IaC, all calling the same REST APIs.","hp":"Console to explore, CLI to script, SDK in apps, IaC for repeatable infra","x":"Everything is an API call governed by IAM. Avoid ClickOps for production; capture as IaC.","p":"T1","v":"cmp:CLI=az / Az PowerShell;aws;gcloud / bq|Shell=Azure Cloud Shell;AWS CloudShell;Cloud Shell|Console=Azure portal;AWS Console;Google Cloud console|IaC=Bicep;CloudFormation;Infra Manager"},"az_cli":{"k":"B","cl":"azure","t":"Azure CLI & PowerShell","s":"Cross-platform az CLI and the Az PowerShell module for managing Azure resources.","hp":"Scripting, CI pipelines, quick resource queries with JMESPath","x":"az uses --query JMESPath; az login supports device code, managed identity, federated tokens. Extensions add preview cmds.","p":"T1","code":"az login && az account set --subscription <sub-id>","v":"flow:az login>Set subscription>az group create>az deployment","eq":["aws_cli","gcp_cli"]},"az_cloudshell":{"k":"B","cl":"azure","t":"Azure Cloud Shell","s":"Browser-based Bash/PowerShell with az, kubectl, terraform preinstalled, authenticated as you.","hp":"Run commands from any browser without local install","x":"Optional storage account persists $HOME; ephemeral sessions need no storage. Times out after 20 min idle.","p":"T1"},"aws_cli":{"k":"B","cl":"aws","t":"AWS CLI & CloudShell","s":"AWS CLI v2 for all services plus CloudShell, a browser shell pre-authenticated with your console role.","hp":"Scripting AWS; SSO login via aws configure sso","x":"Use profiles + IAM Identity Center, not long-lived keys. CloudShell: 1 GB persistent home per region; can run in a VPC.","p":"T1","code":"aws configure sso && aws s3 ls --profile dev","v":"flow:aws configure sso>aws sso login>aws sts get-caller-identity>aws <service>","eq":["az_cli","gcp_cli"]},"gcp_cli":{"k":"B","cl":"gcp","t":"gcloud CLI & Cloud Shell","s":"Google Cloud CLI (gcloud, gcloud storage, bq, kubectl) and Cloud Shell browser VM with 5 GB home.","hp":"Scripting GCP; gcloud auth application-default login for local SDK auth","x":"gsutil is legacy; use gcloud storage. Configurations switch project/account. Cloud Shell has Cloud Shell Editor.","p":"T1","code":"gcloud config set project my-proj && gcloud run services list","v":"flow:gcloud init>Set project>gcloud auth ADC>gcloud <service>","eq":["az_cli","aws_cli"]},"t1_consoles":{"k":"B","cl":"multi","t":"Web consoles","s":"Azure portal, AWS Management Console and Google Cloud console for browsing and configuring resources.","hp":"Explore services, view metrics, troubleshoot visually","x":"All now embed AI assistants: Copilot in Azure, Amazon Q, Gemini Cloud Assist. Don't rely on clicks for prod changes.","p":"T1","v":"cmp:Console=Azure portal;AWS Console;Cloud console|Assistant=Copilot in Azure;Amazon Q;Gemini Cloud Assist|Mobile app=Azure app;AWS Console app;Cloud app"},"t1_sdks":{"k":"B","cl":"multi","t":"SDKs & default credentials","s":"Language SDKs (Python, JS, .NET, Java, Go) with credential chains that find env, CLI or workload identity.","hp":"Same code works locally (CLI login) and in cloud (managed identity) unchanged","x":"Use DefaultAzureCredential, boto3 default chain, Google ADC. Never hard-code keys.","p":"T1","v":"cmp:Python SDK=azure-* packages;boto3;google-cloud-*|Cred chain=DefaultAzureCredential;Default chain;ADC|Local login=az login;aws sso login;gcloud auth ADC"},"t1_hybrid":{"k":"I","cl":"multi","t":"Hybrid & multicloud","s":"Run and manage workloads across on-prem, edge and multiple clouds with one control plane.","hp":"Data residency, low latency to factories, or consolidated management","x":"Adds complexity and skills cost. Multicloud for best-of-breed or regulation, not by default.","p":"T1","v":"cmp:Control plane=Azure Arc;Systems Manager;GKE multi-cloud|On-prem HW=Azure Local;AWS Outposts;GDC connected|Air-gapped=Azure Local disconnected;Outposts;GDC air-gapped"},"az_arc":{"k":"I","cl":"azure","t":"Azure Arc","s":"Projects servers, Kubernetes clusters and SQL Server running anywhere into Azure Resource Manager.","hp":"Apply Azure Policy, Defender, Monitor, updates to on-prem or other-cloud machines","x":"Arc-enabled servers free; you pay for add-ons (Defender, Update Manager, Monitor). Also enables ESU and pay-as-you-go SQL.","p":"T1","code":"azcmagent connect --resource-group rg-arc --location eastus --subscription-id <sub>","v":"hub:Azure Resource Manager|On-prem servers,AWS EC2,GCP VMs,K8s clusters,SQL Server","eq":["aws_outposts","gcp_gdc"]},"az_local":{"k":"A","cl":"azure","t":"Azure Local","s":"Azure-managed hyperconverged infrastructure on validated on-prem hardware, run via Arc.","hp":"Run VMs/AKS on-prem with Azure management and billing","x":"Formerly Azure Stack HCI. Per-core monthly fee. Supports disconnected operation in some scenarios.","p":"T1","f":"Formerly Azure Stack HCI","eq":["aws_outposts","gcp_gdc"]},"aws_outposts":{"k":"A","cl":"aws","t":"AWS Outposts","s":"AWS-owned racks or 1U/2U servers installed on-prem, running EC2, EBS, ECS, EKS, RDS locally.","hp":"Low-latency or data-residency workloads using AWS APIs on-prem","x":"Needs reliable link to parent Region (control plane). 3-year term. Limited instance types and services.","p":"T1","v":"arch:aws:Factory apps>Outposts rack>Service link>AWS Region","eq":["az_local","gcp_gdc"]},"gcp_gdc":{"k":"A","cl":"gcp","t":"Google Distributed Cloud","s":"Google-managed hardware/software for on-prem and edge: connected or fully air-gapped variants.","hp":"Sovereign, air-gapped or edge sites needing GKE and Vertex AI locally","x":"Air-gapped needs no Google Cloud link. Software-only GKE on bare metal/VMware also available.","p":"T1","v":"cmp:Variant=Connected;Air-gapped;Software-only|Link=Needs GCP;None;Varies|Use=Edge/retail;Gov/defense;Own HW","eq":["az_arc","aws_outposts"]},"t1_multicloud":{"k":"I","cl":"multi","t":"Multicloud strategy","s":"Using 2+ public clouds deliberately: per-workload best fit, or portable layers like Kubernetes and Terraform.","hp":"Avoid single-vendor risk or use unique services (e.g. Gemini, Bedrock)","x":"Lowest-common-denominator design wastes managed services. Egress costs and identity federation are the hard parts.","p":"T1","v":"hub:Shared layer|Terraform,Kubernetes,OpenTelemetry,OIDC identity,Git/CI"},"t1_quotas":{"k":"I","cl":"multi","t":"Quotas & service limits","s":"Per-account/subscription/project caps on resources (vCPUs, IPs, API rates) to protect capacity and you.","hp":"Check and raise quotas before launches, migrations and GPU work","x":"GPU quotas often start at 0. Increases can take days. Hard limits can't be raised; design around them.","p":"T1","v":"cmp:Scope=Subscription+region;Account+region;Project+region|Tool=Quotas page / az quota;Service Quotas;Cloud Quotas|Typical=vCPU per family;vCPU per class;CPUs/GPUs"},"az_quotas":{"k":"I","cl":"azure","t":"Azure quotas","s":"Per-subscription, per-region limits, e.g. vCPUs per VM family; request increases in the Quotas portal.","hp":"Pre-request vCPU/GPU quota for AKS or Foundry deployments","x":"Azure OpenAI uses tokens-per-minute quota per model per region. Quota groups share across subscriptions.","p":"T1","code":"az vm list-usage --location eastus -o table","eq":["aws_servicequotas","gcp_quotas"]},"aws_servicequotas":{"k":"I","cl":"aws","t":"AWS Service Quotas","s":"Central console/API to view and request increases for per-account, per-region limits.","hp":"Raise EC2 vCPU, Lambda concurrency, Bedrock token limits","x":"EC2 on-demand quotas are vCPU-based per instance class. Quota request templates apply to new Org accounts.","p":"T1","code":"aws service-quotas get-service-quota --service-code ec2 --quota-code L-1216C47A","eq":["az_quotas","gcp_quotas"]},"gcp_quotas":{"k":"I","cl":"gcp","t":"Cloud Quotas","s":"Per-project rate and allocation quotas; Cloud Quotas API, quota adjuster and alerts.","hp":"Raise CPUs, GPUs, API rates; alert before hitting limits","x":"Some quotas at region, some global. Quota adjuster can auto-raise. New projects start with low GPU quota.","p":"T1","code":"gcloud compute regions describe us-central1 --format='value(quotas)'","eq":["az_quotas","aws_servicequotas"]},"t1_tagging":{"k":"B","cl":"multi","t":"Tagging & labels","s":"Key-value metadata on resources for cost allocation, ownership, automation and policy.","hp":"Enforce owner, env, cost-center tags from day one","x":"Define a small mandatory tag set; enforce via policy. Tags don't fix bad account/project structure.","p":"T1","v":"cmp:Name=Tags;Tags;Labels|Max per resource=50;50;64|Enforce with=Azure Policy;Tag policies + SCP;Org Policy / IaC"},"az_tags":{"k":"B","cl":"azure","t":"Azure tags","s":"Name/value pairs on subscriptions, RGs and resources; usable in Cost Management.","hp":"Allocate costs and filter resources by env/team","x":"Not inherited by default; use Azure Policy 'inherit tag' effects. Some resource types don't support tags.","p":"T1","code":"az tag update --resource-id <id> --operation merge --tags env=prod owner=team-a","eq":["aws_tags","gcp_labels"]},"aws_tags":{"k":"B","cl":"aws","t":"AWS tags & cost allocation tags","s":"Key-value tags on most resources; activate them as cost allocation tags to see in billing.","hp":"Cost reports per team; ABAC IAM conditions on tags","x":"Activate tags in Billing before they appear in Cost Explorer. Tag policies (Organizations) standardize keys.","p":"T1","code":"aws resourcegroupstaggingapi get-resources --tag-filters Key=env,Values=prod","eq":["az_tags","gcp_labels"]},"gcp_labels":{"k":"B","cl":"gcp","t":"Labels & resource tags (GCP)","s":"Labels = key-value metadata for billing/filtering; separate 'tags' are IAM-governed for policy conditions.","hp":"Labels for cost breakdown; tags for conditional IAM/firewall","x":"Labels lowercase only, max 64. Billing export to BigQuery includes labels. Network tags are a third, different thing.","p":"T1","code":"gcloud compute instances add-labels vm-1 --labels=env=prod --zone=us-central1-a","eq":["az_tags","aws_tags"]},"t1_scaleterms":{"k":"B","cl":"multi","t":"Scalability, elasticity & HA","s":"Core vocabulary for how systems grow, shrink and survive failures.","hp":"Speak precisely in design reviews and SLAs","x":"Scalability = can grow; elasticity = grows and shrinks automatically; HA = stays up through component failure.","p":"T1","v":"table:Term,Means|Scale up,Bigger machine|Scale out,More machines|Elastic,Auto up and down|HA,Survives failures|DR,Recovers from disaster"},"t1_scaling":{"k":"B","cl":"multi","t":"Vertical vs horizontal scaling","s":"Vertical = resize to a bigger instance; horizontal = add more instances behind a load balancer.","hp":"Scale out stateless tiers; scale up when software can't be distributed","x":"Vertical has a ceiling and often needs restart. Horizontal needs stateless design and load balancing.","p":"T1","v":"draw:autoscale"},"t1_elasticity":{"k":"B","cl":"multi","t":"Elasticity & autoscaling","s":"Automatically adding and removing capacity to match demand, paying only for what runs.","hp":"Handle daily peaks and spikes without over-provisioning","x":"Scale on the right signal (queue depth, RPS), not just CPU. Warm-up times and min instances matter.","p":"T1","v":"cmp:VM autoscale=VM Scale Sets;Auto Scaling groups;Managed instance groups|Serverless=Functions/Container Apps;Lambda/Fargate;Cloud Run|K8s=AKS autoscaler;Karpenter;GKE Autopilot"},"t1_ha":{"k":"B","cl":"multi","t":"High availability & fault tolerance","s":"Redundancy across zones/instances so one failure doesn't cause an outage; fault tolerance = zero interruption.","hp":"Multi-AZ by default for production tiers","x":"Remove single points of failure: LB, zones, DB replicas, health checks. HA != backup != DR.","p":"T1","v":"draw:lb"},"t1_dr":{"k":"I","cl":"multi","t":"Disaster recovery: RPO & RTO","s":"RPO = max data loss; RTO = max time to restore. Tiers: backup, pilot light, warm standby, active-active.","hp":"Pick the cheapest DR tier that meets business RPO/RTO","x":"Test failover regularly. Lower RPO/RTO cost exponentially more. Cross-region replication + IaC rebuilds.","p":"T1","v":"draw:dr"},"t1_cloudnative":{"k":"I","cl":"multi","t":"Cloud-native principles","s":"Design for the cloud: stateless services, managed backing services, automation, observability, immutability.","hp":"Get elasticity and resilience the platform can provide","x":"Containers + managed services + CI/CD + IaC. Microservices are optional; a modular monolith can be cloud-native.","p":"T1","v":"hub:Cloud-native app|Stateless,12-factor,Containers,IaC,CI/CD,Observability,Managed services"},"t1_12factor":{"k":"I","cl":"multi","t":"Twelve-factor app","s":"12 practices: config in env, attached backing services, stateless processes, logs as streams, dev/prod parity.","hp":"Checklist for apps that deploy cleanly to PaaS/containers","x":"Config in env vars or a config store, secrets in a vault. Disposable processes start fast, shut down gracefully.","p":"T1","v":"table:Factor,Practice|Config,Env vars|Processes,Stateless|Logs,Stdout streams|Backing svcs,Attached URLs|Disposability,Fast start/stop"},"t1_stateless":{"k":"I","cl":"multi","t":"Stateless services","s":"Keep no session or file state on the instance; store it in a DB, cache or object store.","hp":"Lets any instance serve any request, enabling scale-out and spot","x":"Move sessions to Redis, uploads to object storage. Sticky sessions are a smell. Idempotent handlers help retries.","p":"T1","v":"arch:multi:Clients>Load balancer>App 1,App 2,App 3>Cache,DB,Object store"},"t1_immutable":{"k":"I","cl":"multi","t":"Immutable infrastructure","s":"Never patch running servers; build a new image/container and replace instances.","hp":"Predictable deploys and easy rollback","x":"Golden images or container images built in CI. Pairs with blue/green and canary deploys. Cattle, not pets.","p":"T1","v":"flow:Code change>Build image>Test>Replace instances>Delete old"},"t2_idp":{"k":"B","cl":"multi","t":"Identity providers (workforce)","s":"Directory that authenticates employees and admins and federates SSO into clouds and apps.","hp":"One identity per person, SSO everywhere, central offboarding","x":"Federate rather than create per-cloud users. Use SAML/OIDC to Okta/Entra/Google as the single source of truth.","p":"T2","v":"cmp:Directory=Microsoft Entra ID;IAM Identity Center;Cloud Identity|SSO protocol=SAML / OIDC;SAML / OIDC;SAML / OIDC|External IdP=Federation;External IdP;Workforce Identity Fed"},"az_entra":{"k":"B","cl":"azure","t":"Microsoft Entra ID","s":"Microsoft's cloud identity service: users, groups, app registrations, SSO, MFA for Azure, M365 and SaaS.","hp":"Single sign-on and MFA for Azure portal, M365 and thousands of SaaS apps","x":"Free, P1 (Conditional Access), P2 (ID Protection, PIM). Every Azure subscription trusts one Entra tenant.","p":"T2","f":"Formerly Azure Active Directory","code":"az ad group create --display-name devs --mail-nickname devs","v":"hub:Entra ID|Azure portal,Microsoft 365,SaaS apps,Custom apps,Devices","eq":["aws_sso","gcp_cloudidentity"]},"az_pim":{"k":"A","cl":"azure","t":"Privileged Identity Management (PIM)","s":"Just-in-time, time-bound, approval-gated activation of Entra and Azure RBAC admin roles.","hp":"Remove standing admin access; elevate only when needed","x":"Needs Entra ID P2 or ID Governance licence. Audit history and access reviews included.","p":"T2","v":"flow:Eligible user>Request role>Approve + MFA>Active 4h>Auto-expire"},"aws_sso":{"k":"B","cl":"aws","t":"AWS IAM Identity Center","s":"Workforce SSO into many AWS accounts and apps using permission sets; built-in directory or external IdP.","hp":"Human access to all Org accounts with short-lived credentials","x":"Formerly AWS SSO. Free. Permission sets become IAM roles in each account. SCIM sync from Entra/Okta.","p":"T2","f":"Formerly AWS Single Sign-On","code":"aws configure sso","v":"fan:Identity Center|Prod account,Dev account,Sandbox,SaaS apps","eq":["az_entra","gcp_cloudidentity"]},"gcp_cloudidentity":{"k":"B","cl":"gcp","t":"Cloud Identity","s":"Google's IDaaS for users, groups and devices; also underpins Google Workspace and the GCP organization.","hp":"Manage GCP users/groups; SSO from Entra/Okta via SAML","x":"Free and Premium editions. Creates the org node. Grant IAM to groups, not users. GCDS/SCIM sync from AD.","p":"T2","v":"hub:Cloud Identity|GCP org,Workspace,Groups,Devices,SAML apps","eq":["az_entra","aws_sso"]},"gcp_wfif":{"k":"I","cl":"gcp","t":"Workforce Identity Federation","s":"Lets users from an external IdP (Entra, Okta) access GCP via IAM without syncing to Cloud Identity.","hp":"Use your existing IdP for GCP console/CLI access directly","x":"Attribute-based IAM principals (principalSet). Some products have limited support; check per service.","p":"T2"},"t2_authz":{"k":"B","cl":"multi","t":"Authorization (IAM)","s":"Who (principal) can do what (role/permissions) on which resource (scope).","hp":"Grant least-privilege roles at the narrowest scope","x":"Prefer groups and built-in/predefined roles; audit wildcards. Explicit deny wins in AWS; deny assignments/policies elsewhere.","p":"T2","v":"draw:iam"},"az_rbac":{"k":"B","cl":"azure","t":"Azure RBAC","s":"Role assignments bind a principal to a role definition at a scope (MG, subscription, RG, resource).","hp":"Give teams Contributor on their RG, Reader elsewhere","x":"Owner/Contributor/Reader + 100s of built-in roles; custom roles; ABAC conditions; data-plane roles (e.g. Storage Blob Data Reader).","p":"T2","code":"az role assignment create --assignee <obj-id> --role Reader --scope /subscriptions/<sub>","v":"tree:Management group>Subscription;Subscription>Resource group;Resource group>Resource","eq":["aws_iam","gcp_iam"]},"aws_iam":{"k":"B","cl":"aws","t":"AWS IAM","s":"Global service for users, roles and JSON policies that allow/deny actions on resources.","hp":"Roles with scoped policies for apps; deny guardrails org-wide","x":"Free. Policy types: identity, resource, boundary, SCP/RCP, session. Explicit deny > allow > implicit deny.","p":"T2","code":"aws iam create-role --role-name app --assume-role-policy-document file://trust.json","v":"flow:Request>Explicit deny?>SCP/RCP allow?>Resource policy>Identity policy>Allow","eq":["az_rbac","gcp_iam"]},"aws_iam_roles":{"k":"I","cl":"aws","t":"IAM roles & STS","s":"Assumable identities with a trust policy; STS returns temporary credentials (15 min-12 h).","hp":"Cross-account access, federation and workload credentials without keys","x":"Prefer roles over IAM users with access keys. Use ExternalId for third parties. Role chaining caps session at 1 h.","p":"T2","code":"aws sts assume-role --role-arn arn:aws:iam::111122223333:role/ops --role-session-name me","v":"seq:Caller,STS,Service|1>2:AssumeRole|2>1:Temp creds|1>3:Signed API call|3>1:Response"},"aws_permboundary":{"k":"A","cl":"aws","t":"Permission boundaries","s":"A managed policy capping the maximum permissions an IAM user/role can ever receive.","hp":"Let developers create roles safely without privilege escalation","x":"Effective permissions = identity policy AND boundary. Doesn't grant anything by itself.","p":"T2","v":"fanin:Identity policy,Boundary,SCP|Effective perms"},"gcp_iam":{"k":"B","cl":"gcp","t":"Google Cloud IAM","s":"Allow policies bind principals to roles on org, folder, project or resource; plus deny policies.","hp":"Grant predefined roles to groups at the project/resource level","x":"Avoid basic roles (Owner/Editor/Viewer). IAM Conditions for time/resource. Policies inherit downward.","p":"T2","code":"gcloud projects add-iam-policy-binding my-proj --member=group:devs@x.com --role=roles/viewer","v":"tree:Organization>Folder;Folder>Project;Project>Bucket,VM","eq":["az_rbac","aws_iam"]},"gcp_iam_roles":{"k":"I","cl":"gcp","t":"Basic, predefined & custom roles","s":"GCP role types: broad basic roles, service-specific predefined roles, and custom permission sets.","hp":"Pick predefined roles; build custom roles only for gaps","x":"Editor grants ~thousands of permissions; avoid in prod. IAM recommender suggests shrinking over-granted roles.","p":"T2","v":"table:Type,Granularity,Use|Basic,Very broad,Avoid|Predefined,Per service,1|Custom,Exact,Gaps only"},"t2_workloadid":{"k":"I","cl":"multi","t":"Workload identities","s":"Identities for code (VMs, functions, pods, CI) that get short-lived tokens instead of stored secrets.","hp":"Remove keys and connection-string passwords from apps and pipelines","x":"Platform injects tokens via metadata endpoint or federation. Grant each workload its own identity and least privilege.","p":"T2","v":"cmp:VM/app=Managed identity;IAM role (instance profile);Attached service account|Kubernetes=AKS Workload ID;EKS Pod Identity/IRSA;GKE Workload Identity|External/CI=Federated credential;OIDC provider + role;Workload Identity Fed"},"az_mi":{"k":"I","cl":"azure","t":"Azure managed identities","s":"Entra identities auto-managed for Azure resources: system-assigned (per resource) or user-assigned.","hp":"App Service, Functions, VMs, AKS reach Key Vault, Storage, SQL with no secrets","x":"User-assigned can carry federated identity credentials (GitHub, K8s). Token via IMDS. Free.","p":"T2","code":"az identity create -g rg-app -n id-app","v":"seq:App,IMDS,Entra ID,Key Vault|1>2:Get token|2>3:MI auth|3>1:Access token|1>4:Call with token","eq":["aws_ec2_role","gcp_sa"]},"az_aks_wi":{"k":"A","cl":"azure","t":"Microsoft Entra Workload ID for AKS","s":"AKS pods exchange a projected K8s service account token for an Entra token via federated credentials.","hp":"Per-pod Azure identity on AKS","x":"Replaces deprecated AAD Pod Identity. Needs OIDC issuer + workload identity enabled on cluster.","p":"T2","code":"az aks update -g rg -n aks1 --enable-oidc-issuer --enable-workload-identity","eq":["aws_eks_podid","gcp_gke_wi"]},"aws_ec2_role":{"k":"I","cl":"aws","t":"IAM roles for EC2, Lambda & ECS","s":"Attach a role (instance profile, Lambda/ECS task role); SDKs fetch temporary creds automatically.","hp":"AWS compute calls S3, DynamoDB, Bedrock without access keys","x":"Enforce IMDSv2 on EC2. One role per function/task. Credentials rotate automatically.","p":"T2","v":"flow:Attach role>Compute starts>SDK reads creds>STS temp keys>Call AWS API","eq":["az_mi","gcp_sa"]},"aws_irsa":{"k":"A","cl":"aws","t":"IAM Roles for Service Accounts (IRSA)","s":"EKS pods assume IAM roles via the cluster's OIDC provider and AssumeRoleWithWebIdentity.","hp":"Per-pod AWS permissions on EKS (works with self-managed clusters too)","x":"Needs IAM OIDC provider per cluster and SA annotation. Trust policy per cluster limits reuse; Pod Identity is simpler.","p":"T2","code":"eksctl create iamserviceaccount --cluster c1 --name app --attach-policy-arn <arn> --approve","eq":["az_aks_wi","gcp_gke_wi"]},"aws_eks_podid":{"k":"I","cl":"aws","t":"EKS Pod Identity","s":"Map a K8s service account to an IAM role through an EKS API association; agent add-on serves creds.","hp":"Simplest per-pod IAM on EKS; reuse roles across clusters","x":"No OIDC provider needed. Supports session tags for ABAC. EKS only (not self-managed K8s).","p":"T2","code":"aws eks create-pod-identity-association --cluster-name c1 --namespace app --service-account sa --role-arn R","eq":["az_aks_wi","gcp_gke_wi"]},"gcp_sa":{"k":"I","cl":"gcp","t":"Service accounts (GCP)","s":"Non-human principals attached to VMs, Cloud Run, functions, GKE; tokens served by the metadata server.","hp":"Each GCP workload runs as its own least-privilege identity","x":"Avoid SA keys (new orgs block key creation by default). Don't use default compute SA with Editor. Impersonation for humans.","p":"T2","code":"gcloud iam service-accounts create app-sa --display-name='App runtime'","v":"flow:Create SA>Grant roles>Attach to Cloud Run>Metadata token>Call API","eq":["az_mi","aws_ec2_role"]},"gcp_gke_wi":{"k":"I","cl":"gcp","t":"Workload Identity Federation for GKE","s":"GKE pods authenticate as IAM principals (K8s service account) or impersonate a Google service account.","hp":"Per-pod Google Cloud access on GKE without key files","x":"Enabled by default on Autopilot. Grant roles directly to principal://...ns/sa identifiers.","p":"T2","eq":["az_aks_wi","aws_eks_podid"]},"gcp_wif":{"k":"A","cl":"gcp","t":"Workload Identity Federation","s":"Pools/providers let external workloads (AWS, Azure, GitHub, OIDC/SAML) exchange their tokens for Google creds.","hp":"CI/CD or other-cloud workloads access GCP without SA keys","x":"Map and restrict via attribute conditions (e.g. repo, branch). STS token exchange; optional SA impersonation.","p":"T2","code":"gcloud iam workload-identity-pools create gh-pool --location=global","v":"seq:Workload,External IdP,Google STS,GCP API|1>2:Get OIDC token|1>3:Exchange token|3>1:Federated token|1>4:Call API"},"t2_ghoidc":{"k":"I","cl":"multi","t":"GitHub Actions OIDC federation","s":"GitHub issues a signed OIDC token per job; clouds trust it and return short-lived credentials.","hp":"Deploy from CI with no cloud secrets stored in GitHub","x":"Set permissions: id-token: write. Restrict trust on sub claim (repo:org/repo:ref/environment).","p":"T2","v":"cmp:Trust config=Federated credential;IAM OIDC provider;WIF provider|Login action=azure/login;configure-aws-credentials;google-github-actions/auth|Scope claim=subject;sub condition;attribute condition"},"t2_ciam":{"k":"I","cl":"multi","t":"Customer identity (CIAM)","s":"Sign-up/sign-in for your app's end users: social logins, MFA, user profiles, token issuance.","hp":"Add auth to consumer/B2B apps without building a user database","x":"Priced per monthly active user. Customize UX/branding. Separate from workforce directory.","p":"T2","v":"cmp:Service=Entra External ID;Amazon Cognito;Identity Platform|Free tier=50k MAU;10k MAU (Essentials);50k MAU|Social login=Yes;Yes;Yes"},"az_extid":{"k":"I","cl":"azure","t":"Microsoft Entra External ID","s":"CIAM in an external tenant: sign-up flows, social/email OTP, MFA, branding for customer apps.","hp":"Customer sign-in for apps on Azure with native Entra tokens","x":"Successor to Azure AD B2C (no new B2C customers since May 2025). First 50k MAU free. Also B2B guest collaboration.","p":"T2","f":"Successor to Azure AD B2C","eq":["aws_cognito","gcp_idp"]},"aws_cognito":{"k":"I","cl":"aws","t":"Amazon Cognito","s":"User pools (sign-up/sign-in, OIDC tokens) and identity pools (exchange tokens for AWS creds).","hp":"Auth for web/mobile apps; API Gateway/ALB authorizers","x":"Tiers Lite/Essentials/Plus (2024); managed login UI. Identity pools give users temp AWS creds for S3 etc.","p":"T2","code":"aws cognito-idp create-user-pool --pool-name app-users","v":"flow:User>Managed login>User pool JWT>API Gateway authorizer>Lambda","eq":["az_extid","gcp_idp"]},"gcp_idp":{"k":"I","cl":"gcp","t":"Identity Platform","s":"Google's CIAM: Firebase Authentication plus enterprise features (SAML/OIDC, MFA, multi-tenancy).","hp":"Customer auth for Firebase/GCP apps, IAP for external users","x":"Free up to 50k MAU (email/social); SMS and SAML/OIDC billed. Same SDKs as Firebase Auth.","p":"T2","eq":["az_extid","aws_cognito"]},"t2_keymgmt":{"k":"I","cl":"multi","t":"Key management (KMS)","s":"Managed services that create, store and use encryption keys inside HSMs, with audit and rotation.","hp":"Encrypt data with keys you control and can revoke","x":"Uses envelope encryption: KMS key wraps data keys. Default provider-managed keys vs customer-managed keys.","p":"T2","v":"draw:envelope"},"az_keyvault":{"k":"I","cl":"azure","t":"Azure Key Vault","s":"Stores keys, secrets and certificates; Standard (software) or Premium (HSM-backed keys).","hp":"CMK for Storage/SQL/Disks; secrets and certs for apps","x":"Use RBAC permission model. Soft delete is mandatory; enable purge protection. Per-operation pricing; rate limits per vault.","p":"T2","code":"az keyvault create -n kv-app-01 -g rg-app --enable-rbac-authorization true","v":"hub:Key Vault|Keys,Secrets,Certificates,Managed identity,Private endpoint","eq":["aws_kms","gcp_kms"]},"az_mhsm":{"k":"A","cl":"azure","t":"Azure Key Vault Managed HSM","s":"Single-tenant, FIPS 140-3 Level 3 validated HSM pool for keys only.","hp":"Regulated workloads needing dedicated HSM and full key control","x":"Billed per HSM pool hour (expensive). Keys only, no secrets/certs. Security domain backup is your job.","p":"T2","eq":["aws_cloudhsm","gcp_cloudhsm"]},"aws_kms":{"k":"I","cl":"aws","t":"AWS KMS","s":"Managed keys in FIPS-validated HSMs; integrates with S3, EBS, RDS, Secrets Manager and 100+ services.","hp":"Customer-managed keys with key policies and CloudTrail audit","x":"$1/key/month + per-request fees. Key policy is required and primary. Direct encrypt max 4 KB; use data keys.","p":"T2","code":"aws kms create-key --description 'app data key'","v":"seq:App,KMS,S3|1>2:GenerateDataKey|2>1:Plain + wrapped key|1>3:Store ciphertext|1>2:Decrypt wrapped key","eq":["az_keyvault","gcp_kms"]},"aws_cloudhsm":{"k":"A","cl":"aws","t":"AWS CloudHSM","s":"Dedicated single-tenant HSM clusters in your VPC that you fully control (PKCS#11, JCE, KMS custom key store).","hp":"Strict compliance, custom crypto, TLS offload","x":"Billed per HSM hour; deploy 2+ for HA. AWS can't access your keys; losing creds = losing keys.","p":"T2","eq":["az_mhsm","gcp_cloudhsm"]},"gcp_kms":{"k":"I","cl":"gcp","t":"Cloud KMS","s":"Key rings and keys at software, HSM or external (Cloud EKM) protection levels; CMEK for GCP services.","hp":"CMEK for BigQuery, GCS, GKE; Autokey automates key creation","x":"Location-bound key rings can't be deleted. Per key-version and per-op pricing. Automatic rotation schedules.","p":"T2","code":"gcloud kms keys create k1 --keyring=kr1 --location=us --purpose=encryption","v":"tree:Project>Key ring;Key ring>Key A,Key B;Key A>Version 1,Version 2","eq":["az_keyvault","aws_kms"]},"gcp_cloudhsm":{"k":"A","cl":"gcp","t":"Cloud HSM & Cloud EKM","s":"Cloud HSM = keys in FIPS 140-2 L3 HSMs via KMS API; Cloud EKM = keys stay in a partner/external key manager.","hp":"Regulated data; hold-your-own-key sovereignty","x":"Cloud HSM is multi-tenant but managed; single-tenant option exists. EKM adds latency and external dependency.","p":"T2","eq":["az_mhsm","aws_cloudhsm"]},"t2_cmk":{"k":"I","cl":"multi","t":"Provider-managed vs customer-managed keys","s":"All three clouds encrypt at rest by default; CMK/CMEK lets you own rotation, access and revocation.","hp":"Use CMK when compliance needs key control or crypto-shredding","x":"CMK adds cost, ops and outage risk (deleted/disabled key = unreadable data). Provider keys are fine by default.","p":"T2","v":"table:Option,Control,Effort|Platform-managed,Low,None|Customer-managed,1,Medium|External/HYOK,Full,High"},"t2_secrets":{"k":"B","cl":"multi","t":"Secrets management","s":"Central store for passwords, API keys and connection strings with access control, versioning and rotation.","hp":"Get secrets out of code, env files and CI variables","x":"Prefer workload identity to avoid secrets entirely. Cache secrets in apps; vault APIs are rate-limited and billed.","p":"T2","v":"cmp:Service=Key Vault secrets;Secrets Manager;Secret Manager|Rotation=Event Grid + Function;Built-in Lambda;Pub/Sub notify|Price=Per 10k ops;$0.40/secret/mo;Per version + ops"},"az_kv_secrets":{"k":"B","cl":"azure","t":"Key Vault secrets","s":"Versioned secret values in Azure Key Vault, read via managed identity or Key Vault references.","hp":"App Service/Functions Key Vault references; AKS Secrets Store CSI driver","x":"Near-expiry events via Event Grid for custom rotation. 25 KB max per secret. Use one vault per app per env.","p":"T2","code":"az keyvault secret set --vault-name kv-app-01 -n db-pass --value '<secret>'","eq":["aws_secrets","gcp_secret"]},"aws_secrets":{"k":"B","cl":"aws","t":"AWS Secrets Manager","s":"Stores and automatically rotates secrets (RDS, Redshift, DocumentDB, custom via Lambda), encrypted with KMS.","hp":"DB credentials with managed rotation; cross-region replicas","x":"$0.40/secret/month + API calls. Parameter Store is cheaper for config/non-rotating values. Use caching clients.","p":"T2","code":"aws secretsmanager get-secret-value --secret-id prod/db","v":"flow:Schedule>Rotation Lambda>Create new>Set in DB>Test>Finish|loop","eq":["az_kv_secrets","gcp_secret"]},"gcp_secret":{"k":"B","cl":"gcp","t":"Secret Manager","s":"Global or regional secrets with versions, IAM per secret, CMEK and rotation notifications via Pub/Sub.","hp":"Mount secrets in Cloud Run/GKE/functions as env or files","x":"Rotation is notify-only; you write the rotator. Pin versions in prod instead of 'latest' for safer rollouts.","p":"T2","code":"gcloud secrets versions access latest --secret=db-pass","eq":["az_kv_secrets","aws_secrets"]},"t2_certs":{"k":"I","cl":"multi","t":"Certificate management","s":"Issue, deploy and auto-renew TLS certs for load balancers, CDNs and apps; private CAs for internal mTLS.","hp":"Never let a cert expire in prod again","x":"Managed public certs are free when attached to provider endpoints. Public TLS validity is shrinking (47 days by 2029).","p":"T2","v":"cmp:Public certs=App Service/Front Door;ACM;Certificate Manager|Store=Key Vault certs;ACM;Certificate Manager|Private CA=Key Vault + CA;AWS Private CA;CA Service"},"az_kv_certs":{"k":"I","cl":"azure","t":"Key Vault certificates","s":"Create/import certs, auto-renew via integrated CAs (DigiCert, GlobalSign); feeds App Gateway/App Service.","hp":"Central cert lifecycle for Azure endpoints","x":"Front Door and App Service also offer free managed certs. Key Vault stores private key as key + secret.","p":"T2","eq":["aws_acm","gcp_certmgr"]},"aws_acm":{"k":"I","cl":"aws","t":"AWS Certificate Manager","s":"Free public certs for ELB, CloudFront, API Gateway with automatic renewal; DNS or email validation.","hp":"HTTPS on ALB/CloudFront with zero cert maintenance","x":"CloudFront certs must be in us-east-1. Standard certs not exportable; exportable public certs (2025) are paid.","p":"T2","code":"aws acm request-certificate --domain-name example.com --validation-method DNS","eq":["az_kv_certs","gcp_certmgr"]},"aws_pca":{"k":"A","cl":"aws","t":"AWS Private CA","s":"Managed private certificate authority for internal TLS, mTLS, IoT and code signing.","hp":"Issue internal certs for service mesh/mTLS","x":"Monthly fee per CA plus per-cert; short-lived cert mode is cheaper. Integrates with ACM and cert-manager.","p":"T2","eq":["gcp_certmgr"]},"gcp_certmgr":{"k":"I","cl":"gcp","t":"Certificate Manager","s":"Google-managed or uploaded certs for Cloud Load Balancing at scale (incl. wildcard via DNS authorization).","hp":"TLS for global LBs with many domains","x":"Certificate maps scale to thousands of certs. Pair with Certificate Authority Service for private PKI.","p":"T2","code":"gcloud certificate-manager certificates create cert1 --domains=example.com --dns-authorizations=auth1","eq":["az_kv_certs","aws_acm"]},"t2_threat":{"k":"I","cl":"multi","t":"Threat detection & posture (CSPM/CWPP)","s":"Continuously find misconfigurations, vulnerabilities and active threats across cloud accounts.","hp":"Turn on in every account/subscription/project on day one","x":"CSPM = config posture; CWPP = workload protection; CNAPP = both. Route findings to a SIEM and owners.","p":"T2","v":"cmp:Posture=Defender CSPM;Security Hub CSPM;SCC|Threats=Defender plans;GuardDuty;SCC Event Threat Det.|Vulns=Defender Vuln Mgmt;Inspector;SCC Vuln findings"},"az_defender":{"k":"I","cl":"azure","t":"Microsoft Defender for Cloud","s":"CNAPP: secure score, CSPM, and Defender plans for servers, containers, storage, SQL, AI, APIs across clouds.","hp":"Posture + threat protection for Azure, AWS and GCP in one place","x":"Foundational CSPM free; Defender CSPM and workload plans billed per resource. Connects AWS/GCP accounts.","p":"T2","code":"az security pricing create -n VirtualMachines --tier Standard","v":"hub:Defender for Cloud|Servers,Containers,Storage,SQL,AI,AWS/GCP","eq":["aws_securityhub","gcp_scc"]},"aws_guardduty":{"k":"I","cl":"aws","t":"Amazon GuardDuty","s":"Managed threat detection from CloudTrail, VPC Flow, DNS logs plus S3, EKS, runtime, RDS, Lambda, malware.","hp":"Detect compromised credentials, crypto-mining, exfiltration","x":"Enable org-wide via delegated admin. Extended Threat Detection correlates multi-stage attacks. Priced per volume.","p":"T2","code":"aws guardduty create-detector --enable","v":"fanin:CloudTrail,VPC Flow Logs,DNS logs,EKS audit,Runtime|GuardDuty","eq":["az_defender","gcp_scc"]},"aws_securityhub":{"k":"I","cl":"aws","t":"AWS Security Hub","s":"Aggregates findings (GuardDuty, Inspector, Macie, partners) and runs CSPM checks (CIS, FSBP standards).","hp":"Single pane for security findings across all accounts","x":"2025: relaunched Security Hub correlates exposures; prior posture checks now 'Security Hub CSPM'. Needs AWS Config.","p":"T2","code":"aws securityhub enable-security-hub","v":"fanin:GuardDuty,Inspector,Macie,Config|Security Hub","eq":["az_defender","gcp_scc"]},"aws_inspector":{"k":"I","cl":"aws","t":"Amazon Inspector","s":"Automated vulnerability scanning of EC2, ECR container images and Lambda, plus code security scanning.","hp":"Find CVEs in images and instances continuously","x":"Agentless or SSM-agent EC2 scans. Rescans when new CVEs publish. Exports SBOMs. CI/CD image scan plugins.","p":"T2","code":"aws inspector2 enable --resource-types EC2 ECR LAMBDA","eq":["az_defender","gcp_scc"]},"gcp_scc":{"k":"I","cl":"gcp","t":"Security Command Center","s":"GCP's CNAPP: misconfig, vulnerability, threat "hp":"Petabyte-scale detection with long retention","x":"Formerly Chronicle. Licensed by ingestion or subscription. YARA-L detection rules. Bundled with SCC Enterprise.","p":"T2","f":"Formerly Chronicle","eq":["az_sentinel","aws_securitylake"]},"t2_edge":{"k":"I","cl":"multi","t":"Edge protection: WAF & DDoS","s":"Filter malicious HTTP (OWASP Top 10, bots) and absorb volumetric DDoS before traffic hits your apps.","hp":"Put every public web app/API behind a WAF","x":"Start rules in detection/count mode, then block. Basic L3/L4 DDoS protection is free on all clouds.","p":"T2","v":"cmp:WAF=Azure WAF;AWS WAF;Cloud Armor|Attaches to=Front Door/App GW;CloudFront/ALB/APIGW;External App LB|DDoS paid=DDoS Protection;Shield Advanced;Armor Enterprise"},"az_waf":{"k":"I","cl":"azure","t":"Azure Web Application Firewall","s":"Managed OWASP rule sets (DRS), bot protection and custom rules on Front Door or Application Gateway.","hp":"Protect Azure web apps globally (Front Door) or regionally (App GW)","x":"Policy-based; per-rule exclusions to cut false positives. Rate limiting and geo-filtering custom rules.","p":"T2","v":"arch:azure:Users>Front Door + WAF>App Service,AKS","eq":["aws_waf","gcp_armor"]},"az_ddos":{"k":"I","cl":"azure","t":"Azure DDoS Protection","s":"Adaptive L3/L4 DDoS mitigation for public IPs in a VNet: Network Protection or per-IP Protection.","hp":"Mission-critical public endpoints needing SLA, cost protection, rapid response","x":"Network Protection ~$2,900/month covers 100 IPs; IP Protection billed per IP. Infra-level protection free.","p":"T2","eq":["aws_shield","gcp_armor"]},"aws_waf":{"k":"I","cl":"aws","t":"AWS WAF","s":"Web ACLs with managed rules, rate limits and Bot Control on CloudFront, ALB, API Gateway, AppSync.","hp":"Block SQLi/XSS, bots and abusive IPs on AWS endpoints","x":"Pay per web ACL, rule and million requests; managed bot/fraud rules extra. Firewall Manager deploys org-wide.","p":"T2","v":"arch:aws:Users>CloudFront + WAF>ALB>ECS,Lambda","eq":["az_waf","gcp_armor"]},"aws_shield":{"k":"I","cl":"aws","t":"AWS Shield","s":"Shield Standard: free automatic L3/L4 DDoS defence. Shield Advanced: L7 help, SRT team, cost protection.","hp":"Advanced for high-value public apps needing DDoS response","x":"Advanced is $3,000/month per org with 1-year commitment; includes WAF at no extra cost for protected resources.","p":"T2","eq":["az_ddos","gcp_armor"]},"aws_firewallmgr":{"k":"A","cl":"aws","t":"AWS Firewall Manager","s":"Centrally deploy WAF rules, Shield Advanced, security groups and Network Firewall policies across an Org.","hp":"Enforce consistent edge rules on every account automatically","x":"Requires AWS Organizations + Config. Auto-applies to new resources matching scope.","p":"T2"},"gcp_armor":{"k":"I","cl":"gcp","t":"Cloud Armor","s":"WAF and DDoS defence at Google's edge for external Application LBs: OWASP rules, rate limits, bots.","hp":"Protect Cloud Run/GKE/VMs behind global LB","x":"Standard pay-as-you-go; Enterprise subscription adds Adaptive Protection (ML) and DDoS response.","p":"T2","code":"gcloud compute security-policies create edge-policy","v":"arch:gcp:Users>Cloud Armor>Global LB>Cloud Run,GKE","eq":["az_waf","aws_waf"]},"t2_dataprot":{"k":"I","cl":"multi","t":"Sensitive data discovery & DLP","s":"Find and classify PII/secrets in storage and data warehouses; mask, tokenize or block leaks.","hp":"Know where PII lives before auditors or attackers do","x":"Scans cost per GB; sample or schedule. Classification feeds access policy and DLP.","p":"T2","v":"cmp:Service=Purview DLP;Amazon Macie;Sensitive Data Protection|Scans=M365/endpoints/data map;S3;BigQuery/GCS/SQL|De-identify=Masking (SQL);No;Yes (API)"},"az_purview_dlp":{"k":"I","cl":"azure","t":"Microsoft Purview DLP & Information Protection","s":"Sensitivity labels and DLP policies across M365, endpoints, and Azure data via the Purview Data Map.","hp":"Classify and protect sensitive data across Microsoft estate","x":"DLP strongest for M365/endpoints; Azure data classification via Data Map scans. Also DSPM for AI.","p":"T2","eq":["aws_macie","gcp_sdp"]},"aws_macie":{"k":"I","cl":"aws","t":"Amazon Macie","s":"ML and pattern-based discovery of sensitive data (PII, credentials) in S3, with bucket security posture.","hp":"Find PII in S3 data lakes; flag public/unencrypted buckets","x":"Automated discovery samples cheaply; full jobs priced per GB scanned. S3 only.","p":"T2","code":"aws macie2 enable-macie","eq":["az_purview_dlp","gcp_sdp"]},"gcp_sdp":{"k":"I","cl":"gcp","t":"Sensitive Data Protection","s":"Discovery, inspection and de-identification (masking, tokenization) for BigQuery, GCS, Cloud SQL and any text.","hp":"Profile BigQuery for PII; de-identify data before ML/LLM use","x":"Formerly Cloud DLP. DLP API usable inline to redact prompts. Discovery profiles priced per GB/subscription.","p":"T2","f":"Formerly Cloud DLP","eq":["az_purview_dlp","aws_macie"]},"t2_zerotrust":{"k":"I","cl":"multi","t":"Zero trust","s":"Never trust network location: verify explicitly, use least privilege, assume breach for every request.","hp":"Replace VPN-perimeter thinking with identity- and context-based access","x":"Pillars: identity, device, network, app, data. Implement gradually: MFA, conditional access, segmentation, logs.","p":"T2","v":"draw:zerotrust"},"t2_leastpriv":{"k":"B","cl":"multi","t":"Least privilege","s":"Grant only the permissions needed, at the narrowest scope, for the shortest time.","hp":"Limit blast radius of leaked creds or compromised workloads","x":"Start narrow, use access analyzers to trim. JIT elevation for admins. Separate identities per workload.","p":"T2","v":"cmp:Analyzer=Entra access reviews;IAM Access Analyzer;IAM recommender|JIT=PIM;TEAM / Identity Center;PAM|Guardrail=Azure Policy;SCPs/RCPs;Org Policy/deny"},"aws_accessanalyzer":{"k":"I","cl":"aws","t":"IAM Access Analyzer","s":"Finds externally shared resources and unused access; validates or generates least-privilege policies.", cl":"gcp","t":"Identity-Aware Proxy (IAP)","s":"Google's zero-trust proxy: per-request IAM and context checks for web apps and SSH/RDP TCP forwarding.","hp":"Expose internal apps or VM SSH without VPN or public IPs","x":"Free for basic use; Context-Aware Access levels via Access Context Manager. Works with Cloud Run, GKE, VMs.","p":"T2","code":"gcloud compute ssh vm-1 --tunnel-through-iap --zone=us-central1-a","eq":["az_condaccess","aws_verifiedaccess"]},"t2_oauth":{"k":"B","cl":"multi","t":"OAuth 2.0 & OpenID Connect","s":"OAuth 2.0 delegates authorization via access tokens; OIDC adds an ID token for authentication (sign-in).","hp":"Standard way to sign users in and call APIs securely","x":"Use authorization code + PKCE for web/mobile, client credentials for services. Never implicit flow.","p":"T2","v":"seq:User,App,IdP,API|1>2:Click sign in|2>3:Auth code + PKCE|3>2:ID + access token|2>4:Bearer access token|4>2:Data"},"t2_jwt":{"k":"I","cl":"multi","t":"Tokens: ID, access, refresh (JWT)","s":"Signed JSON Web Tokens with claims (iss, aud, sub, exp, scopes); refresh tokens obtain new access tokens.","hp":"Validate tokens statelessly at APIs and gateways","x":"Always check signature, iss, aud, exp. Keep access tokens short-lived. Don't put secrets in JWT payloads.","p":"T2","v":"table:Token,Purpose,Lifetime|ID,Who signed in,Short|Access,Call API,1|Refresh,Get new tokens,Long"},"t2_saml":{"k":"I","cl":"multi","t":"SAML 2.0 federation","s":"XML-based SSO standard between an IdP and service providers; common for enterprise and cloud console SSO.","hp":"Federate corporate IdP into AWS, GCP and legacy SaaS","x":"Browser-only; OIDC preferred for new apps and APIs. Watch certificate expiry on signing certs.","p":"T2","v":"seq:User,SP,IdP|1>2:Access app|2>1:Redirect to IdP|1>3:Authenticate|3>1:SAML assertion|1>2:Post assertion"},"t3_vm":{"k":"B","cl":"multi","t":"Virtual machines (IaaS)","s":"Rent a virtual server: you pick CPU/RAM/disk and own the OS, patches and runtime."," s regions and shared across tenants.","hp":"Distribute golden images to VMSS and teams worldwide.","x":"Image definitions + versions; replica counts per region; share via RBAC, community or direct sharing. Azure VM Image Builder automates builds.","code":"az sig image-version create -g rg -r gal -i def -e 1.0.0 --managed-image img","v":"flow:Build image>Gallery version>Replicate regions>VMSS uses it","eq":["aws_ami","gcp_gce_images"],"p":"T3"},"aws_ami":{"k":"B","cl":"aws","t":"Amazon Machine Images (AMIs)","s":"Regional image (EBS snapshots + launch metadata) used to start EC2 instances.","hp":"Launch pre-configured instances; share images across accounts.","x":"Copy to other regions explicitly. Deprecate old AMIs. EC2 Image Builder automates build/test/distribute.","code":"aws ec2 create-image --instance-id i-123 --name app-v1","v":"flow:Base AMI>Image Builder>Golden AMI>Launch template>ASG","eq":["az_gallery","gcp_gce_images"],"p":"T3"},"gcp_gce_images":{"k":"I","cl":"gcp","t":"Compute Engine images","s":"Public, custom images and image families, plus machine images that capture whole VMs.","hp":"Bake golden images; image families always point at the latest version.","x":"Custom images can be global or regional. Machine images include config + all disks. Share via IAM across projects.","code":"gcloud compute images create app-v1 --source-disk=disk1 --family=app","v":"flow:Source disk>Custom image>Image family>Instance template","eq":["az_gallery","aws_ami"],"p":"T3"},"t3_dedicated":{"k":"A","cl":"multi","t":"Dedicated / sole-tenant hosts","s":"Whole physical servers reserved for your VMs only.","hp":"Licensing tied to physical cores, compliance or strict isolation needs.","x":"Most expensive option; you pay for the whole host. Usually only for BYOL (Windows/SQL/Oracle) or regulators.","v":"cmp:Service=Dedicated Host;Dedicated Hosts;Sole-tenant nodes|Billing=Per host;Per host;Per node|BYOL=Yes;Yes;Yes","p":"T3"},"az_dedicatedhost":{"k":"A","cl":"azure","t":"Azure
