 by default (MACsec on Direct, or VPN over ER). Global Reach links sites. Use 2 circuits/peering locations for HA.","v":"arch:azure:Data center>Provider edge>MS edge>ER gateway>Hub VNet","eq":["aws_dx","gcp_interconnect"],"p":"T8"},"aws_vpn":{"k":"I","cl":"aws","t":"AWS Site-to-Site VPN","s":"Managed IPsec connection with two tunnels to a virtual private gateway or Transit Gateway.","hp":"Quick on-prem link or backup for Direct Connect on AWS","x":"~1.25 Gbps per tunnel; ECMP over TGW for more. Accelerated VPN uses Global Accelerator. Client VPN for users.","code":"aws ec2 create-vpn-connection --type ipsec.1 --customer-gateway-id cgw-1 --transit-gateway-id tgw-1","v":"arch:aws:Customer gateway>2 IPsec tunnels>TGW or VGW>VPCs","eq":["az_vpngw","gcp_vpn"],"p":"T8"},"aws_dx":{"k":"A","cl":"aws","t":"AWS Direct Connect","s":"Dedicated (1/10/100/400 Gbps) or hosted (50 Mbps-25 Gbps) private connections into AWS.","hp":"Steady large data flows, low latency hybrid, lower egress rates","x":"DX data-out is cheaper than internet egress. Use DX Gateway for many VPCs/Regions. MACsec on dedicated. Use 2 locations.","v":"arch:aws:Data center>DX location>DX Gateway>TGW>VPCs","eq":["az_expressroute","gcp_interconnect"],"p":"T8"},"gcp_vpn":{"k":"I","cl":"gcp","t":"Cloud VPN","s":"HA VPN gateways with two interfaces and BGP via Cloud Router, 99.99% SLA when fully configured.","hp":"Encrypted link from GCP VPCs to on-prem or other clouds","x":"~3 Gbps per tunnel. HA VPN needs 2 tunnels for SLA. Classic VPN is legacy. Also used over Interconnect for encryption.","code":"gcloud compute vpn-gateways create havpn1 --network=vpc1 --region=us-central1","v":"arch:gcp:On-prem>2 tunnels>HA VPN>Cloud Router>VPC","eq":["az_vpngw","aws_vpn"],"p":"T8"},"gcp_interconnect":{"k":"A","cl":"gcp","t":"Cloud Interconnect","s":"Dedicated (10/100 Gbps) or Partner (50 Mbps-50 Gbps) private links, plus Cross-Cloud Interconnect.","hp":"High-bandwidth hybrid or direct GCP ↔ AWS/Azure/OCI links","x":"Reduced egress pricing. Redundant pairs for 99.9/99.99% SLA. Cross-Cloud Interconnect avoids colo setup.","v":"arch:gcp:Data center>Colo facility>VLAN attachments>Cloud Router>VPC","eq":["az_expressroute","aws_dx"],"p":"T8"},"t8_netfw":{"k":"I","cl":"multi","t":"Network firewalls","s":"Managed stateful firewalls with FQDN filtering, IDS/IPS and TLS inspection for north-south & east-west.","hp":"Central egress control, threat prevention, compliance (PCI, HIPAA)","x":"Route traffic through it (UDR/route tables/policies). Charged per hour + GB processed: can be a big line item.","v":"cmp:Service=Azure Firewall;Network Firewall;Cloud NGFW|Tiers=Basic/Std/Premium;Single;Ess/Std/Enterprise|IPS + TLS=Premium;Suricata rules;Enterprise|FQDN filter=Yes;Domain lists;Standard+","p":"T8"},"az_firewall":{"k":"I","cl":"azure","t":"Azure Firewall","s":"Managed, zone-redundant stateful firewall with FQDN/application rules, threat intel and IDPS (Premium).","hp":"Hub VNet egress control and spoke-to-spoke inspection on Azure","x":"Basic/Standard/Premium. Managed via Firewall Policy & Firewall Manager. Needs AzureFirewallSubnet (/26). ~$1.25/h Standard.","code":"az network firewall create -g rg -n fw1 --sku AZFW_VNet --tier Premium","v":"arch:azure:Spoke VNets>Azure Firewall (hub)>Internet,On-prem","eq":["aws_netfw","gcp_ngfw"],"p":"T8"},"aws_netfw":{"k":"I","cl":"aws","t":"AWS Network Firewall","s":"Managed stateful firewall with Suricata-compatible IPS rules, domain filtering and TLS inspection.","hp":"VPC/TGW-wide inspection and egress domain allow-lists on AWS","x":"Firewall endpoints per AZ; route through them. Native Transit Gateway attachment. Per endpoint-hour + GB processed.","code":"aws network-firewall create-firewall --firewall-name fw1 --firewall-policy-arn $ARN --vpc-id vpc-1 ...","v":"arch:aws:IGW>Firewall endpoint>NAT GW>Private subnets","eq":["az_firewall","gcp_ngfw"],"p":"T8"},"gcp_ngfw":{"k":"I","cl":"gcp","t":"Cloud NGFW","s":"Distributed firewall built into the VPC: Essentials, Standard (FQDN, geo, threat intel) and Enterprise (IPS).","hp":"Add L7 threat prevention on GCP without rerouting traffic","x":"Enforced on every VM, no chokepoint. Enterprise IPS via firewall endpoints (Palo Alto tech), billed per endpoint-hour + GB.","v":"stack:Hierarchical policy,Global network policy,Regional policy,VM NIC","eq":["az_firewall","aws_netfw"],"p":"T8"},"t8_egress":{"k":"B","cl":"multi","t":"Outbound internet (NAT)","s":"Managed NAT lets private instances reach the internet (updates, APIs) without inbound exposure.","hp":"Private subnets that need outbound calls with stable source IPs","x":"Allow-listing by partners uses NAT IPs. SNAT port exhaustion is a classic outage cause. Data processing fees apply.","v":"cmp:Service=NAT Gateway;NAT gateway;Cloud NAT|Scope=Subnets (zonal);Per AZ subnet;Region via Router|Billing=Hour + GB;Hour + GB;Per VM-hour + GB|Static IPs=Up to 16;EIPs;Manual or auto","p":"T8"},"az_nat":{"k":"B","cl":"azure","t":"Azure NAT Gateway","s":"Fully managed outbound SNAT for subnets with up to 16 public IPs (64k ports each).","hp":"Explicit outbound for VMs/AKS now default outbound access is retiring","x":"Zonal (StandardV2 adds zone redundancy). Takes precedence over LB outbound rules. Hour + GB processed.","code":"az network nat gateway create -g rg -n nat1 --public-ip-addresses ip1","v":"fanin:VM,AKS node,Function|NAT Gateway","eq":["aws_natgw","gcp_nat"],"p":"T8"},"aws_natgw":{"k":"B","cl":"aws","t":"NAT gateway (AWS)","s":"Managed NAT in a public subnet giving private subnets outbound IPv4 internet access.","hp":"Private EC2/EKS/Lambda need to reach the internet","x":"One per AZ for HA (regional mode added late 2025). ~$0.045/h + $0.045/GB processed. Use S3/DDB gateway endpoints to save.","code":"aws ec2 create-nat-gateway --subnet-id subnet-pub --allocation-id eipalloc-1","v":"arch:aws:Private subnet>NAT gateway>IGW>Internet","eq":["az_nat","gcp_nat"],"p":"T8"},"gcp_nat":{"k":"B","cl":"gcp","t":"Cloud NAT","s":"Software-defined regional NAT configured on Cloud Router; no proxy VMs in the data path.","hp":"GCP private VMs/GKE/Cloud Run egress with fixed IPs","x":"Public NAT and Private NAT (between overlapping VPCs). Dynamic port allocation. Logging for port exhaustion.","code":"gcloud compute routers nats create n1 --router=r1 --auto-allocate-nat-external-ips --nat-all-subnet-ip-ranges","v":"flow:Private VM>Cloud Router>Cloud NAT>Internet","eq":["az_nat","aws_natgw"],"p":"T8"},"t8_egresscost":{"k":"I","cl":"multi","t":"Data transfer & egress costs","s":"Clouds charge for data leaving a region/zone/internet, plus NAT and endpoint processing; ingress is free.","hp":"Avoid surprise bills in chatty or data-heavy architectures","x":"Internet egress ~$0.05-0.12/GB; AWS/GCP charge cross-AZ ~$0.01/GB each way. First 100 GB/mo internet egress free on Azure & AWS.","v":"bars:Same AZ=0,Cross-AZ=1,Cross-region=2,Internet=9,Via NAT extra=4","p":"T8"},"t8_hubspoke":{"k":"I","cl":"multi","t":"Hub-spoke & transit networks","s":"Central hub network (firewall, VPN/ER, DNS) connected to many spoke networks via peering or a transit router.","hp":"Scale beyond a few VNets with shared egress, inspection and hybrid links","x":"Peering is non-transitive: hubs need a router/firewall or managed transit. Plan CIDRs and route tables centrally.","v":"draw:hubspoke","p":"T8"},"t8_transit_cmp":{"k":"I","cl":"multi","t":"Transit services by cloud","s":"Side-by-side of managed hub/transit and network-sharing options.","hp":"Pick the managed transit option for your cloud","x":"All three support customer-built hubs (peering + NVA/firewall) as an alternative to managed transit.","v":"cmp:Managed hub=Virtual WAN;Transit Gateway;NCC|Peering=VNet peering;VPC peering;VPC peering|Share network=—;VPC sharing (RAM);Shared VPC|Global=Virtual WAN hubs;Cloud WAN;Global VPC","p":"T8"},"az_vwan":{"k":"A","cl":"azure","t":"Azure Virtual WAN","s":"Microsoft-managed hubs uniting VNets, VPN, ExpressRoute, P2S and SD-WAN with transitive routing.","hp":"Large/global Azure estates and branches without hand-built hubs","x":"Standard tier for full transit. Secured hub = Azure Firewall + routing intent. Hub hourly + data processing fees.","code":"az network vhub create -g rg -n hub1 --vwan wan1 --address-prefix 10.100.0.0/23 -l eastus","v":"hub:Virtual WAN hub|Spoke VNet,Spoke VNet,VPN branch,ExpressRoute,Users P2S","eq":["aws_tgw","gcp_ncc"],"p":"T8"},"aws_tgw":{"k":"I","cl":"aws","t":"AWS Transit Gateway","s":"Regional cloud router connecting VPCs, VPNs and Direct Connect with route tables and inter-Region peering.","hp":"Connect dozens-thousands of VPCs across accounts on AWS","x":"Per attachment-hour + $0.02/GB processed. Share via RAM. Segment with TGW route tables. Cloud WAN for global policy.","code":"aws ec2 create-transit-gateway --description core-tgw","v":"hub:Transit Gateway|VPC A,VPC B,VPC C,VPN,Direct Connect","eq":["az_vwan","gcp_ncc"],"p":"T8"},"gcp_ncc":{"k":"A","cl":"gcp","t":"Network Connectivity Center","s":"Hub-and-spoke orchestration for VPC spokes and hybrid spokes (VPN, Interconnect, SD-WAN appliances).","hp":"Mesh or star connectivity between many GCP VPCs and sites","x":"VPC spokes replace peering limits; preset topologies (mesh, star). Data transfer between hybrid sites billed.","v":"hub:NCC hub|VPC spoke,VPC spoke,HA VPN,Interconnect,Router appliance","eq":["az_vwan","aws_tgw"],"p":"T8"},"t8_peering":{"k":"B","cl":"multi","t":"VNet/VPC peering","s":"Direct private link between two networks with no gateway; supported intra- and cross-region on all clouds.","hp":"Connect a few networks cheaply with lowest latency","x":"Non-transitive; CIDRs must not overlap. Azure/AWS charge per GB across peering; GCP free same-zone. Mesh grows n²/2.","code":"az network vnet peering create -g rg -n a-to-b --vnet-name a --remote-vnet b --allow-vnet-access","v":"flow:VNet A>Peering>VNet B","p":"T8"},"gcp_sharedvpc":{"k":"I","cl":"gcp","t":"Shared VPC","s":"Host project owns the VPC; service projects deploy resources into its shared subnets.","hp":"Central network team, many app teams/projects on GCP","x":"Separation of duties: network admins vs app owners. Grant compute.networkUser per subnet. Same org required.","v":"hub:Host project VPC|Service proj A,Service proj B,Service proj C","p":"T8"},"aws_vpcsharing":{"k":"I","cl":"aws","t":"VPC sharing (AWS RAM)","s":"Owner account shares VPC subnets with other accounts in the Organization; they launch resources into them.","hp":"Fewer VPCs and TGW attachments in multi-account AWS","x":"Participants can't modify the VPC. Cuts TGW and NAT costs. Security groups remain per account.","v":"hub:Network account VPC|App acct 1,App acct 2,App acct 3","p":"T8"},"t8_admin":{"k":"B","cl":"multi","t":"Secure admin access (no public SSH/RDP)","s":"Reach private VMs via identity-aware brokers instead of public IPs or jump boxes.","hp":"Remove open 22/3389 ports, log every session, use SSO + MFA","x":"Never expose SSH/RDP to 0.0.0.0/0. Prefer brokered sessions with IAM and audit logs.","v":"cmp:Service=Azure Bastion;SSM Session Manager;IAP TCP forwarding|Agent=None;SSM Agent;None|Auth=Entra ID + RBAC;IAM;IAM + IAP|Cost=Hourly SKU;Free (EC2);Free","p":"T8"},"az_bastion":{"k":"B","cl":"azure","t":"Azure Bastion","s":"Managed RDP/SSH broker reached via the Azure portal or native client over TLS, no public IP on VMs.","hp":"Secure portal/CLI access to Azure VMs without jump boxes","x":"SKUs: Developer (free, shared), Basic, Standard, Premium (session recording, private-only). Needs AzureBastionSubnet.","code":"az network bastion ssh -g rg -n bastion1 --target-resource-id $VMID --auth-type AAD","v":"arch:azure:Admin browser>Bastion>Private VMs","eq":["aws_ssm_session","gcp_iap_tcp"],"p":"T8"},"aws_ssm_session":{"k":"B","cl":"aws","t":"SSM Session Manager","s":"Shell and port-forwarding sessions to EC2/on-prem via SSM Agent, authorized by IAM, logged to S3/CloudWatch.","hp":"Replace bastion hosts and SSH keys on AWS","x":"No inbound ports. Needs SSM Agent + instance role and outbound (or VPC endpoints). EC2 Instance Connect Endpoint is an alt.","code":"aws ssm start-session --target i-0123456789abcdef0","v":"seq:Admin,SSM,Agent on EC2|1>2:start-session|3>2:outbound channel|2>1:shell","eq":["az_bastion","gcp_iap_tcp"],"p":"T8"},"gcp_iap_tcp":{"k":"B","cl":"gcp","t":"IAP TCP forwarding","f":"Identity-Aware Proxy","s":"Identity-Aware Proxy tunnels SSH/RDP/any TCP to VMs without external IPs after IAM checks.","hp":"SSH into private GCP VMs with Google identity and MFA","x":"Allow ingress from 35.235.240.0/20 in firewall. Grant iap.tunnelResourceAccessor. Works with OS Login.","code":"gcloud compute ssh vm1 --zone=us-central1-a --tunnel-through-iap","v":"flow:Admin>IAP (IAM check)>Firewall 35.235.240.0/20>VM","eq":["az_bastion","aws_ssm_session"],"p":"T8"},"t8_s2s":{"k":"A","cl":"multi","t":"Service-to-service networking","s":"App-layer connectivity across VPCs/clusters: service discovery, mTLS, retries, traffic splitting, auth.","hp":"Microservices across many networks/accounts or clusters","x":"Meshes add sidecars/proxies and ops overhead; managed options reduce it. Ambient/sidecar-less modes emerging.","v":"cmp:Service=AKS Istio add-on;VPC Lattice;Cloud Service Mesh|Scope=AKS clusters;VPCs + accounts;GKE + VMs|mTLS=Yes;IAM auth (SigV4);Yes|Data plane=Envoy sidecar;Managed;Envoy / proxyless","p":"T8"},"aws_lattice":{"k":"A","cl":"aws","t":"Amazon VPC Lattice","s":"Managed app networking connecting services across VPCs and accounts with IAM auth policies, no peering or TGW.","hp":"Expose services across accounts with L7 routing and auth","x":"Service networks, HTTP/gRPC/TCP, targets EC2/ECS/EKS/Lambda. Overlapping CIDRs fine. Billed per service-hour + GB + requests.","v":"hub:Service network|Orders svc,Payments svc,Lambda,EKS svc","eq":["az_aks_istio","gcp_csm"],"p":"T8"},"t9_queue":{"k":"B","cl":"multi","t":"Message queues","s":"Durable buffer where producers drop messages and consumers pull them at their own pace.","hp":"Decouple services, absorb spikes, retry failed work without losing it.","x":"Point-to-point: each message handled by one consumer. At-least-once delivery is the norm, so consumers must be idempotent.","v":"cmp:Service=Service Bus queue;Amazon SQS;Cloud Tasks|Cheap/simple=Queue Storage;SQS standard;Pub/Sub pull|Ordering=Sessions;SQS FIFO;Ordering keys|Dead-letter=Built-in DLQ;Redrive policy;Dead-letter topic|Max message=256KB-100MB;1 MiB;1 MB (task)","p":"T9"},"az_servicebus":{"k":"B","cl":"azure","t":"Azure Service Bus","s":"Fully managed enterprise message broker with queues, topics/subscriptions, sessions and transactions.","hp":"Reliable business messaging on Azure: orders, commands, workflows.","x":"Tiers Basic (queues only), Standard, Premium (dedicated MUs, VNet, up to 100 MB msgs). AMQP 1.0, JMS 2.0 on Premium.","code":"az servicebus queue create -g rg --namespace-name sb1 -n orders","v":"draw:queue","eq":["aws_sqs","gcp_tasks"],"p":"T9"},"az_servicebus_sessions":{"k":"I","cl":"azure","t":"Service Bus sessions","s":"Groups related messages by SessionId so one receiver processes them in FIFO order.","hp":"Guarantee per-entity ordering (e.g. all events of one order).","x":"Session lock pins a session to one consumer; also enables request/reply. Parallelism = number of active sessions.","v":"flow:Set SessionId>Lock session>Process in order>Release","p":"T9"},"az_servicebus_dlq":{"k":"I","cl":"azure","t":"Service Bus dead-letter queue","s":"Automatic sub-queue holding messages that exceeded MaxDeliveryCount, expired or were rejected.","hp":"Inspect and replay poison messages without blocking the main queue.","x":"Default MaxDeliveryCount 10. Path <queue>/$deadletterqueue. Messages never auto-expire from DLQ; monitor its count.","v":"flow:Receive>Fail x10>Move to DLQ>Inspect>Resubmit","p":"T9"},"az_storagequeue":{"k":"B","cl":"azure","t":"Azure Queue Storage","s":"Simple, very cheap queue inside an Azure Storage account accessed over HTTP/REST.","hp":"Huge backlogs of simple background jobs at minimal cost.","x":"64 KB messages, millions of msgs per queue, no ordering, no DLQ (Functions adds a -poison queue). Pay per storage + transactions.","code":"az storage queue create -n jobs --account-name mystorage","v":"draw:queue","eq":["aws_sqs","gcp_tasks"],"p":"T9"},"aws_sqs":{"k":"B","cl":"aws","t":"Amazon SQS","f":"Simple Queue Service","s":"Fully managed, serverless message queue with standard and FIFO types.","hp":"Default way to decouple and buffer work between AWS components.","x":"Retention up to 14 days, visibility timeout up to 12 h, long polling 20 s. Pay per request; first 1M requests/month free.","code":"aws sqs create-queue --queue-name orders","v":"draw:queue","eq":["az_servicebus","az_storagequeue","gcp_tasks"],"p":"T9"},"aws_sqs_fifo":{"k":"I","cl":"aws","t":"SQS FIFO queues","s":"Queue type with exactly-once processing and strict ordering per message group ID.","hp":"Ordering matters (ledger entries, per-customer commands).","x":"Name ends .fifo. 300 msg/s per API (3,000 batched); high-throughput mode far higher. Dedup window 5 min.","code":"aws sqs create-queue --queue-name o.fifo --attributes FifoQueue=true","v":"table:Type,Order,Delivery,Scale|Standard,Best effort,At-least-once,Unlimited|FIFO,Per group,Exactly-once,Throttled","p":"T9"},"aws_sqs_dlq":{"k":"I","cl":"aws","t":"SQS dead-letter queues & redrive","s":"Secondary queue receiving messages after maxReceiveCount failed attempts, with redrive back to source.","hp":"Stop poison messages from looping forever and replay them after a fix.","x":"Configured via RedrivePolicy; DLQ must match type (FIFO/standard). Console/API redrive moves msgs back. Set DLQ retention longer.","v":"flow:Receive>Fail N times>DLQ>Alarm>Redrive","p":"T9"},"gcp_tasks":{"k":"I","cl":"gcp","t":"Cloud Tasks","s":"Managed queue that dispatches explicit tasks to HTTP targets with rate limits, retries and scheduling.","hp":"Offload slow work from a request to Cloud Run/Functions with controlled rate.","x":"Push to HTTP target; set max dispatches/s, concurrency, retries; schedule up to 30 days ahead. Pub/Sub is the pull-style option.","code":"gcloud tasks queues create jobs --location=us-central1","v":"seq:App,Cloud Tasks,Worker|1>2:create task|2>3:HTTP POST|3>2:2xx ack|2>3:retry on 5xx","eq":["az_storagequeue","az_servicebus","aws_sqs"],"p":"T9"},"t9_pubsub":{"k":"B","cl":"multi","t":"Pub/sub & notifications","s":"Publishers send to a topic; every subscription gets its own copy of each message.","hp":"One event must reach many independent consumers.","x":"Subscribers are decoupled from each other; filters cut noise. Often combined with a queue per subscriber for buffering.","v":"cmp:Service=Service Bus topics;Amazon SNS;Pub/Sub|Push targets=Functions, queues;SQS, Lambda, HTTP;HTTP push|Filtering=SQL/correlation;Filter policies;Attribute filters|Ordering=Sessions;SNS FIFO;Ordering keys|Mobile/SMS=Notification Hubs;SNS mobile/SMS;FCM","p":"T9"},"az_servicebus_topics":{"k":"I","cl":"azure","t":"Service Bus topics & subscriptions","s":"Pub/sub on Service Bus: each subscription is a virtual queue fed by filter rules.","hp":"Enterprise fan-out with per-subscriber filtering, DLQ and sessions on Azure.","x":"Standard or Premium tier only. SQL and correlation filters, actions to modify props. Up to 2,000 subscriptions per topic.","code":"az servicebus topic subscription create -g rg --namespace-name sb1 --topic-name t -n s1","v":"draw:pubsub","eq":["aws_sns","gcp_pubsub"],"p":"T9"},"aws_sns":{"k":"B","cl":"aws","t":"Amazon SNS","f":"Simple Notification Service","s":"Managed pub/sub topics pushing to SQS, Lambda, HTTP, email, SMS and mobile push.","hp":"Fan out an event to many AWS consumers or notify humans.","x":"Standard and FIFO topics; message filter policies; 256 KB payload. Pattern: SNS topic to many SQS queues for durable fan-out.","code":"aws sns subscribe --topic-arn $T --protocol sqs --notification-endpoint $QARN","v":"fan:SNS topic|SQS queue A,SQS queue B,Lambda,HTTPS,Email","eq":["az_servicebus_topics","gcp_pubsub"],"p":"T9"},"gcp_pubsub":{"k":"B","cl":"gcp","t":"Pub/Sub","s":"Global, serverless messaging for event ingestion and fan-out with push and pull subscriptions.","hp":"Default async messaging and streaming ingestion on Google Cloud.","x":"10 MB msgs, retention up to 31 days, ordering keys, exactly-once (pull), dead-letter topics, replay via seek. Pub/Sub Lite shut down 2026.","code":"gcloud pubsub topics create orders && gcloud pubsub subscriptions create w --topic=orders","v":"draw:pubsub","eq":["az_servicebus_topics","aws_sns","az_eventhubs","aws_kinesis"],"p":"T9"},"gcp_pubsub_export":{"k":"I","cl":"gcp","t":"Pub/Sub BigQuery & Cloud Storage subscriptions","s":"Subscription types that write messages straight into BigQuery tables or Cloud Storage files.","hp":"Land events in the warehouse or lake with zero pipeline code.","x":"No Dataflow job needed for simple loads; supports topic schema or table schema mapping. Transform with single message transforms (SMTs).","v":"fan:Pub/Sub topic|BigQuery sub,GCS sub,Push sub,Pull sub","p":"T9"},"t9_eventrouting":{"k":"I","cl":"multi","t":"Event routing (event buses)","s":"Services that route events from cloud resources, SaaS and apps to targets based on rules.","hp":"React to things happening (file uploaded, VM stopped) without polling.","x":"Event = fact that happened (small, often CloudEvents). Routers filter and push; targets are functions, queues, workflows.","v":"cmp:Service=Event Grid;EventBridge;Eventarc|Format=CloudEvents/EG;EventBridge JSON;CloudEvents|Sources=Azure + custom;AWS, SaaS, custom;GCP, audit logs|Point-to-point=Pipes (n/a);EventBridge Pipes;Eventarc Advanced|Scheduler=Logic Apps;EB Scheduler;Cloud Scheduler","p":"T9"},"az_eventgrid":{"k":"I","cl":"azure","t":"Azure Event Grid","s":"Serverless event broker that pushes Azure resource and custom events to handlers; also an MQTT broker.","hp":"Trigger code when blobs land, resources change or apps publish events.","x":"System topics for Azure services, custom topics, CloudEvents 1.0, retries up to 24 h + dead-letter to Blob. Pay per operation.","code":"az eventgrid event-subscription create --source-resource-id $SA -n onblob --endpoint $FN","v":"fan:Event Grid|Functions,Logic Apps,Service Bus,Webhook,Event Hubs","eq":["aws_eventbridge","gcp_eventarc"],"p":"T9"},"az_eventgrid_mqtt":{"k":"A","cl":"azure","t":"Event Grid namespaces (MQTT broker)","s":"Event Grid namespace tier offering MQTT v3.1.1/v5 broker and pull-delivery topics.","hp":"Connect IoT devices or apps over MQTT and route messages onward.","x":"Client auth by X.509 or Entra; topic spaces; route to Event Hubs, Functions. Pull delivery acts like a lightweight queue.","v":"flow:MQTT clients>Namespace broker>Routing>Event Hubs","p":"T9"},"aws_eventbridge":{"k":"I","cl":"aws","t":"Amazon EventBridge","s":"Serverless event bus routing AWS service, SaaS and custom events to 20+ target types via rules.","hp":"Event-driven architectures on AWS; react to AWS service events.","x":"Default, custom and partner buses; schema registry; archive & replay; cross-account buses. Pay per event published.","code":"aws events put-rule --name s3up --event-pattern file://pattern.json","v":"fan:Event bus rule|Lambda,Step Functions,SQS,API destination,Other bus","eq":["az_eventgrid","gcp_eventarc"],"p":"T9"},"aws_eb_pipes":{"k":"A","cl":"aws","t":"EventBridge Pipes","s":"Point-to-point link from a source (SQS, Kinesis, DynamoDB Streams, MSK) to a target, with filter/enrich.","hp":"Replace glue Lambdas that just read, filter and forward.","x":"Steps: source > filter > enrichment (Lambda, Step Functions, API) > target. Batching supported; pay per request after filtering.","v":"flow:Source>Filter>Enrich>Target","p":"T9"},"gcp_eventarc":{"k":"I","cl":"gcp","t":"Eventarc","s":"Managed eventing that routes Google Cloud, Audit Log and custom CloudEvents to Cloud Run, GKE and Workflows.","hp":"Trigger Cloud Run services from GCS uploads, Firestore changes, audit logs.","x":"Eventarc Standard (triggers) and Eventarc Advanced (message bus, pipelines, transforms). Uses Pub/Sub as transport.","code":"gcloud eventarc triggers create t1 --destination-run-service=svc --event-filters=type=$EVENT_TYPE","v":"fan:Eventarc|Cloud Run,Run functions,GKE,Workflows","eq":["az_eventgrid","aws_eventbridge"],"p":"T9"},"t9_streaming":{"k":"I","cl":"multi","t":"Event streaming","s":"Append-only, partitioned logs that many consumers read independently and can replay.","hp":"High-volume telemetry, clickstreams, CDC, logs feeding real-time analytics.","x":"Ordering within a partition; consumers track offsets; retention-based replay. Differs from queues: messages are not deleted on read.","v":"cmp:Service=Event Hubs;Kinesis Data Streams;Pub/Sub|Managed Kafka=Event Hubs Kafka;Amazon MSK;Managed Kafka|Scale unit=TU/PU/CU;Shard / on-demand;Auto|Max retention=90 days;365 days;31 days|Land in lake=Capture;Data Firehose;BQ/GCS subs","p":"T9"},"az_eventhubs":{"k":"I","cl":"azure","t":"Azure Event Hubs","s":"Big-data streaming platform and event ingestion service with partitions and consumer groups.","hp":"Ingest telemetry, logs, clickstreams at massive scale on Azure.","x":"Tiers Basic, Standard (TUs), Premium (PUs), Dedicated (CUs). Retention 1 to 90 days. Schema Registry. Kafka endpoint Standard+.","code":"az eventhubs eventhub create -g rg --namespace-name eh1 -n telemetry --partition-count 8","v":"draw:streaming","eq":["aws_kinesis","aws_msk","gcp_pubsub","gcp_kafka"],"p":"T9"},"az_eventhubs_kafka":{"k":"I","cl":"azure","t":"Event Hubs for Apache Kafka","s":"Kafka protocol endpoint on Event Hubs so Kafka clients connect by changing config only.","hp":"Run Kafka producers/consumers without managing brokers or ZooKeeper.","x":"Kafka 1.0+ clients, Kafka Connect and Streams support (limits apply). Not a full Kafka cluster: no broker configs or topic compaction on all tiers.","v":"flow:Kafka client>SASL/OAuth>Event Hubs ns>Consumer groups","p":"T9"},"az_eventhubs_capture":{"k":"I","cl":"azure","t":"Event Hubs Capture","s":"Automatically writes stream data to Blob Storage or ADLS Gen2 in Avro or Parquet on a time/size window.","hp":"Archive raw events to the lake for batch analytics with no code.","x":"Configured per event hub; included in Premium/Dedicated, extra charge on Standard.","v":"flow:Event Hub>Capture window>ADLS Parquet>Spark/Fabric","p":"T9"},"aws_kinesis":{"k":"I","cl":"aws","t":"Amazon Kinesis Data Streams","s":"Serverless streaming data service with shards, ordering per partition key and replay.","hp":"Real-time ingestion on AWS for analytics, ML features, logs.","x":"Per shard 1 MB/s or 1,000 rec/s in, 2 MB/s out; on-demand or provisioned mode; retention 24 h to 365 days; enhanced fan-out.","code":"aws kinesis create-stream --stream-name clicks --stream-mode-details StreamMode=ON_DEMAND","v":"draw:streaming","eq":["az_eventhubs","gcp_pubsub"],"p":"T9"},"aws_firehose":{"k":"I","cl":"aws","t":"Amazon Data Firehose","f":"Formerly Kinesis Data Firehose","s":"Fully managed delivery stream that batches, transforms and loads streaming data into destinations.","hp":"Get streams into S3, Redshift, OpenSearch, Splunk or Iceberg tables with no code.","x":"Buffers by size/time, optional Lambda transform, format conversion to Parquet, dynamic partitioning. Pay per GB ingested.","v":"flow:Producers>Firehose buffer>Transform>S3/Iceberg","p":"T9"},"aws_msk":{"k":"I","cl":"aws","t":"Amazon MSK","f":"Managed Streaming for Apache Kafka","s":"Fully managed Apache Kafka clusters on AWS, with provisioned and serverless options.","hp":"Kafka ecosystem compatibility (Connect, Streams) without operating brokers.","x":"Provisioned (Standard or Express brokers), MSK Serverless, MSK Connect for connectors. KRaft mode. Pay per broker-hour + storage.","code":"aws kafka create-cluster-v2 --cluster-name c1 --serverless file://sls.json","v":"draw:streaming","eq":["az_eventhubs","gcp_kafka"],"p":"T9"},"gcp_kafka":{"k":"I","cl":"gcp","t":"Managed Service for Apache Kafka","s":"Google-managed Apache Kafka clusters sized by vCPU and memory, with auto-rebalancing.","hp":"Run Kafka workloads on GCP without managing brokers.","x":"Sized in vCPUs/RAM, storage tiered automatically; Kafka Connect clusters; IAM auth. Alternative: Pub/Sub for GCP-native streaming.","code":"gcloud managed-kafka clusters create k1 --location=us-central1 --cpu=3 --memory=3GiB --subnets=$SUBNET","v":"draw:streaming","eq":["az_eventhubs","aws_msk"],"p":"T9"},"t9_brokers":{"k":"I","cl":"multi","t":"Traditional message brokers (AMQP/JMS/MQTT)","s":"Standards-based brokers like ActiveMQ and RabbitMQ used by existing enterprise apps.","hp":"Lift-and-shift apps that speak AMQP, JMS, STOMP or MQTT.","x":"Prefer cloud-native queues for new apps; managed brokers keep protocol compatibility. GCP has no native broker: use Marketplace or GKE.","v":"cmp:Service=Service Bus Premium;Amazon MQ;Marketplace/GKE|Protocols=AMQP 1.0, JMS 2.0;AMQP, MQTT, STOMP;Self-managed|Engines=Native;ActiveMQ, RabbitMQ;RabbitMQ on GKE","p":"T9"},"aws_mq":{"k":"I","cl":"aws","t":"Amazon MQ","s":"Managed message broker service for Apache ActiveMQ Classic and RabbitMQ.","hp":"Migrate existing broker-based apps to AWS without code rewrites.","x":"Single-instance or active/standby (ActiveMQ) and cluster (RabbitMQ) deployments; pay per broker-hour + storage.","code":"aws mq create-broker --broker-name b1 --engine-type RABBITMQ --deployment-mode CLUSTER_MULTI_AZ ...","v":"arch:aws:Legacy apps>Amazon MQ>Consumers","eq":["az_servicebus"],"p":"T9"},"t9_workflow":{"k":"I","cl":"multi","t":"Workflow orchestration","s":"Managed state machines that sequence steps, retries, branches and waits across services.","hp":"Multi-step processes: order handling, ETL, approvals, AI agent pipelines.","x":"Central orchestrator vs choreography via events. Keep state out of your code; get visual history and retries for free.","v":"cmp:Low-code=Logic Apps;Step Functions;Workflows|Code-first=Durable Functions;SFN + SDK;Workflows YAML|Max duration=Unbounded;1 yr Standard;1 yr|Connectors=1,400+;220+ AWS svcs;Google APIs|Pricing=Per action/plan;Per transition;Per step","p":"T9"},"az_logicapps":{"k":"B","cl":"azure","t":"Azure Logic Apps","s":"Low-code workflow service with 1,400+ connectors for SaaS, enterprise and Azure integration.","hp":"Integrate SaaS/enterprise systems (Office 365, SAP, Salesforce) visually.","x":"Consumption (multi-tenant, pay per action) vs Standard (single-tenant, VNet, stateful/stateless). Part of Azure Integration Services.","code":"az logic workflow create -g rg -n wf1 --definition @wf.json","v":"flow:Trigger>Condition>Connector A>Connector B>Respond","eq":["aws_stepfunctions","gcp_workflows"],"p":"T9"},"az_durable":{"k":"I","cl":"azure","t":"Durable Functions","s":"Extension of Azure Functions for stateful orchestrations written in code (C#, JS, Python, Java, PowerShell).","hp":"Code-first workflows: fan-out/fan-in, human approval, long-running sagas.","x":"Orchestrator, activity and entity functions; event-sourced replay so orchestrators must be deterministic. Durable Task Scheduler backend.","v":"seq:Client,Orchestrator,Activity|1>2:start|2>3:call activity|3>2:result|2>1:status/output","eq":["aws_stepfunctions","gcp_workflows"],"p":"T9"},"aws_stepfunctions":{"k":"I","cl":"aws","t":"AWS Step Functions","s":"Serverless visual state machines (Amazon States Language) orchestrating Lambda and 220+ AWS services.","hp":"Orchestrate serverless apps, ETL, ML and GenAI pipelines on AWS.","x":"Direct SDK integrations, wait-for-callback tokens, Distributed Map for huge parallel batches, JSONata. Standard vs Express.","code":"aws stepfunctions start-execution --state-machine-arn $SM --input '{\"id\":1}'","v":"flow:Validate>Charge>Choice>Ship>Notify","eq":["az_logicapps","az_durable","gcp_workflows"],"p":"T9"},"aws_sfn_express":{"k":"A","cl":"aws","t":"Step Functions Standard vs Express","s":"Two workflow types: Standard (durable, exactly-once, up to 1 year) and Express (high-volume, up to 5 min).","hp":"Pick Express for event processing at high rates; Standard for long business flows.","x":"Standard billed per state transition with full history; Express billed per request + duration, at-least-once, logs to CloudWatch.","v":"table:Type,Duration,Semantics,Billing|Standard,1 year,Exactly-once,Transitions|Express,5 min,At-least-once,Duration","p":"T9"},"gcp_workflows":{"k":"I","cl":"gcp","t":"Workflows","s":"Serverless orchestration of Google Cloud services and HTTP APIs defined in YAML or JSON.","hp":"Chain Cloud Run, BigQuery, Vertex AI and APIs with retries on GCP.","x":"Connectors for Google APIs, callbacks, parallel steps, executions up to 1 year. Pay per step (internal vs external). Use Composer for data DAGs.","code":"gcloud workflows deploy wf1 --source=wf.yaml --location=us-central1","v":"flow:Call API>Switch>Run job>Wait callback>Return","eq":["az_logicapps","az_durable","aws_stepfunctions"],"p":"T9"},"t9_scheduling":{"k":"B","cl":"multi","t":"Job scheduling (cron)","s":"Managed cron that fires jobs, functions or messages on a schedule or at a one-time point.","hp":"Nightly reports, cleanup tasks, periodic syncs without a VM running cron.","x":"Use idempotent jobs: schedulers may fire twice or late. Mind time zones and DST.","v":"cmp:Service=Timer trigger/Logic;EB Scheduler;Cloud Scheduler|One-time jobs=Logic Apps delay;Yes;No (use Tasks)|Targets=Function/workflow;270+ services;HTTP, Pub/Sub|Cost=Execution-based;14M free/month;0.10 USD/job/mo","p":"T9"},"az_timer":{"k":"B","cl":"azure","t":"Functions timer trigger & Logic Apps recurrence","s":"NCRONTAB timer trigger in Azure Functions, or the Recurrence trigger in Logic Apps.","hp":"Run code or a workflow every N minutes/hours on Azure.","x":"Timer uses 6-field NCRONTAB with seconds; singleton lock across instances. WEBSITE_TIME_ZONE for local time (not on all plans).","code":"[TimerTrigger(\"0 */5 * * * *\")] // every 5 minutes","v":"flow:Schedule>Timer fires>Function runs|loop","eq":["aws_eb_scheduler","gcp_scheduler"],"p":"T9"},"aws_eb_scheduler":{"k":"I","cl":"aws","t":"Amazon EventBridge Scheduler","s":"Serverless scheduler for one-time or recurring (cron/rate) invocations of 270+ AWS services.","hp":"Millions of schedules: reminders, timeouts, periodic jobs on AWS.","x":"Time zones and DST aware, flexible time windows, retries + DLQ. Replaces scheduled EventBridge rules for most cases.","code":"aws scheduler create-schedule --name nightly --schedule-expression 'cron(0 2 * * ? *)' ...","v":"flow:Schedule>Flexible window>Invoke target>Retry/DLQ","eq":["az_timer","gcp_scheduler"],"p":"T9"},"gcp_scheduler":{"k":"B","cl":"gcp","t":"Cloud Scheduler","s":"Fully managed cron job service targeting HTTP endpoints, Pub/Sub topics and App Engine.","hp":"Trigger Cloud Run jobs, Workflows or functions on a cron schedule.","x":"Unix cron syntax with time zone, retries with backoff, OIDC/OAuth auth to targets. 3 free jobs per billing account.","code":"gcloud scheduler jobs create http nightly --schedule='0 2 * * *' --uri=$URL --location=us-central1","v":"flow:Cron>Scheduler>HTTP or Pub/Sub","eq":["az_timer","aws_eb_scheduler"],"p":"T9"},"t9_apimgmt":{"k":"B","cl":"multi","t":"API management & gateways","s":"Front door for APIs: auth, rate limiting, routing, transformation, analytics and developer portal.","hp":"Expose backends safely to clients, partners or AI agents.","x":"Gateway = runtime proxy; API management adds products, keys, portal, monetization. Also used as AI gateway for LLM APIs.","v":"cmp:Full APIM=API Management;API GW + portal;Apigee|Light gateway=APIM Consumption;HTTP API;API Gateway|GraphQL=APIM GraphQL;AppSync;Apigee GraphQL|WebSocket=APIM WebSocket;WebSocket API;Apigee|AI gateway=APIM AI gateway;Bedrock + GW;Apigee AI policies","p":"T9"},"az_apim":{"k":"I","cl":"azure","t":"Azure API Management","s":"Hybrid, multi-cloud API management platform: gateway, policies, developer portal and analytics.","hp":"Publish and secure APIs on Azure, including LLM and MCP endpoints.","x":"Tiers Consumption, Developer, Basic/Standard/Premium and v2 tiers. XML policies (JWT, rate-limit, transform). Self-hosted gateway.","code":"az apim create -g rg -n apim1 --publisher-email a@b.com --publisher-name Org --sku-name StandardV2","v":"draw:apigw","eq":["aws_apigw","gcp_apigee","gcp_apigw"],"p":"T9"},"az_apim_aigateway":{"k":"A","cl":"azure","t":"APIM AI gateway","s":"APIM capabilities for LLM traffic: token limits, token metrics, semantic caching, load balancing, MCP.","hp":"Govern Azure OpenAI/Foundry usage across teams; expose APIs as MCP tools.","x":"Policies llm-token-limit, llm-emit-token-metric, semantic cache; circuit breaker across model backends; content safety policy.","v":"fan:APIM AI gateway|Foundry model A,Foundry model B,Other LLM,MCP server","p":"T9"},"aws_apigw":{"k":"B","cl":"aws","t":"Amazon API Gateway","s":"Managed service to create, publish and secure REST, HTTP and WebSocket APIs at any scale.","hp":"Put an API in front of Lambda, containers or HTTP backends on AWS.","x":"Pay per request. Integration timeout 29 s default, 10 MB payload. Authorizers: IAM, Cognito, Lambda, JWT (HTTP APIs).","code":"aws apigatewayv2 create-api --name api --protocol-type HTTP --target $LAMBDA_ARN","v":"draw:apigw","eq":["az_apim","gcp_apigee","gcp_apigw"],"p":"T9"},"aws_apigw_types":{"k":"I","cl":"aws","t":"API Gateway REST vs HTTP vs WebSocket","s":"Three API types: REST (full features), HTTP (cheaper, faster) and WebSocket (persistent two-way).","hp":"HTTP for simple proxies, REST for keys/caching/WAF, WebSocket for chat/live updates.","x":"REST: usage plans, API keys, caching, request validation, private APIs, WAF. HTTP: up to ~70% cheaper, JWT auth, fewer features.","v":"table:Type,Best for,Cost|REST,Full features,Higher|HTTP,Lambda proxies,Lowest|WebSocket,Real-time push,Per msg+min","p":"T9"},"aws_app "k":"I","cl":"multi","t":"Messaging & integration patterns","s":"Cloud-neutral patterns that make distributed, message-driven systems reliable.","hp":"Design for retries, failures and partial success from day one.","x":"Key ideas: async decoupling, at-least-once + idempotency, poison-message handling, sagas, transactional outbox, fan-out.","v":"tree:Patterns>Reliability,Consistency,Topology;Reliability>Idempotency,DLQ;Consistency>Saga,Outbox;Topology>Fan-out,Async","p":"T9"},"t9_async":{"k":"B","cl":"multi","t":"Asynchronous decoupling","s":"Caller hands work to a queue/event and returns immediately; workers process it independently.","hp":"Fast API responses, resilience when downstream is slow or down.","x":"Return 202 Accepted + status URL. Queue depth becomes your scaling signal (KEDA, Lambda, Functions scale on it).","v":"seq:Client,API,Queue,Worker|1>2:POST job|2>3:enqueue|2>1:202 Accepted|4>3:poll + process","p":"T9"},"t9_idempotency":{"k":"B","cl":"multi","t":"Idempotent consumers","s":"Processing the same message twice has the same effect as once.","hp":"Required whenever delivery is at-least-once (almost always).","x":"Use idempotency keys/message IDs stored in a dedup table, conditional writes, or natural upserts. FIFO dedup is only a window.","v":"flow:Receive msg>Check key seen?>Process>Store key>Ack","p":"T9"},"t9_dlq":{"k":"B","cl":"multi","t":"Dead-letter queues & poison messages","s":"Messages that repeatedly fail are moved aside to a DLQ after N attempts.","hp":"Keep the main flow moving and keep failures for investigation.","x":"Alert on DLQ depth, log failure reason, provide a redrive tool. Pair with exponential backoff and max delivery count.","v":"flow:Queue>Consumer fails>Retry w/ backoff>DLQ after N>Alert","p":"T9"},"t9_saga":{"k":"A","cl":"multi","t":"Saga pattern","s":"A long business transaction split into local steps, each with a compensating action on failure.","hp":"Consistency across microservices without distributed (2PC) transactions.","x":"Orchestrated (Step Functions, Durable Functions, Workflows) or choreographed via events. Compensations must be idempotent.","v":"flow:Reserve stock>Charge card>Book shipping>Fail: compensate","p":"T9"},"t9_outbox":{"k":"A","cl":"multi","t":"Transactional outbox","s":"Write the business change and the outgoing event in the same DB transaction; a relay publishes it later.","hp":"Avoid 'saved to DB but event lost' (dual-write) bugs.","x":"Relay via polling or CDC (DynamoDB Streams, Cosmos DB change feed, Debezium). Consumers must still dedupe.","v":"flow:Data+outbox txn>Relay/CDC reads>Publish event>Mark sent","p":"T9"},"t9_fanout":{"k":"B","cl":"multi","t":"Fan-out / fan-in","s":"One message is copied to many consumers (fan-out); results are aggregated back (fan-in).","hp":"Parallel processing or notifying many systems of the same event.","x":"Fan-out via topics (SNS to SQS, Service Bus topics, Pub/Sub subs). Fan-in via Durable Functions, Step Functions Map.","v":"fan:Order placed|Billing,Inventory,Email,Analytics","p":"T9"},"t10_dw":{"k":"B","cl":"multi","t":"Cloud data warehouse","s":"Columnar, massively parallel SQL engine for analytics over large structured data.","hp":"Dashboards, reporting and ad-hoc SQL over billions of rows.","x":"Storage and compute separated; pay for compute (slots/RPUs/CUs) and storage. Partition + cluster tables to cut scanned data.","v":"cmp:Service=Fabric Warehouse;Amazon Redshift;BigQuery|Serverless=Yes (capacity);Redshift Serverless;Yes (native)|Pricing=Fabric CU capacity;RPU-hr or nodes;Per TiB or slots|Open format=Delta in OneLake;Iceberg via Spectrum;BigLake Iceberg|Legacy=Synapse dedicated;Provisioned DC2;n/a","p":"T10"},"t10_oltpolap":{"k":"B","cl":"multi","t":"OLTP vs OLAP","s":"Transactional databases serve many small reads/writes; analytical stores scan huge data for aggregates.","hp":"Know why you copy app data out of Postgres/SQL into a warehouse or lakehouse.","x":"OLTP: row store, indexes, ms latency. OLAP: columnar,
