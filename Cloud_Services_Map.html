ogle,Partner,Open;Google>Gemini,Imagen,Veo;Partner>Claude,Mistral;Open>Llama,Gemma","eq":["az_foundry_models","aws_bedrock_catalog"],"p":"T11"},"gcp_gemini":{"k":"B","cl":"gcp","t":"Gemini models on Vertex AI","s":"Google's multimodal LLMs (Gemini 3 Pro, 2.5 Pro/Flash/Flash-Lite) with long context and native tools.","hp":"Long-context, multimodal (video/audio/PDF) reasoning at competitive price","x":"1M-token context, Grounding with Google Search, code execution, Live API. Implicit caching. Use global endpoint for availability.","code":"gcloud ai models list --region=us-central1","v":"bars:Flash-Lite=1,Flash=3,Pro=10","eq":["az_openai","aws_bedrock_catalog"],"p":"T11"},"t11_openmodels":{"k":"I","cl":"multi","t":"Open-weight vs proprietary models","s":"Open-weight models (Llama, Mistral, DeepSeek, gpt-oss, Gemma) can be self-hosted; proprietary are API-only.","hp":"Pick open weights for control/cost at scale; proprietary for top quality","x":"Open models: self-host on GPUs/GKE/EKS/AKS or use serverless MaaS. Check license (Llama community license, Apache 2.0).","v":"table:Aspect,Open-weight,Proprietary|Hosting,you or MaaS,API only|Tuning,full / LoRA,limited|Data control,1,provider","p":"T11"},"t11_serving":{"k":"I","cl":"multi","t":"Model serving modes","s":"How you pay for inference: shared pay-per-token, reserved provisioned throughput, or discounted async batch.","hp":"Match pricing mode to traffic shape: spiky, steady/latency-critical, or offline","x":"Pay-as-you-go can hit 429 throttling at peaks; provisioned gives guaranteed capacity; batch ~50% off with ~24h turnaround.","v":"cmp:Pay per token=Standard / Global;On-demand;Standard PayGo|Reserved=PTU;Provisioned Throughput;Provisioned Throughput|Unit=PTU;Model unit;GSU|Batch=Global Batch;Batch inference;Batch prediction|Batch discount=~50%;~50%;~50%","p":"T11"},"t11_paygo":{"k":"B","cl":"multi","t":"Pay-per-token (serverless) inference","s":"Shared capacity billed per input/output token; quotas in tokens or requests per minute.","hp":"Default for dev, POCs and spiky traffic","x":"Output tokens cost 3-8x input. 429s under regional load: retry with backoff, use global/cross-region routing.","v":"draw:pricing","p":"T11"},"az_ptu":{"k":"A","cl":"azure","t":"Azure OpenAI Provisioned (PTU)","s":"Reserved model processing capacity in Provisioned Throughput Units: Global, Data Zone or Regional provisioned.","hp":"Steady high-volume or latency-critical Azure OpenAI workloads","x":"Hourly PTU billing or monthly/yearly reservations for big discounts. Spillover to Standard on overflow. Min PTUs vary by model.","v":"bars:Pay per token=100,PTU hourly=80,PTU 1-yr reservation=45","eq":["aws_bedrock_pt","gcp_vertex_pt"],"p":"T11"},"aws_bedrock_pt":{"k":"A","cl":"aws","t":"Bedrock Provisioned Throughput","s":"Dedicated model units for a base or custom model, bought hourly (no commit) or for 1 or 6 months.","hp":"Guaranteed throughput, and the way to serve many custom/fine-tuned models","x":"Billed per model unit-hour. Many custom models require it; some now support on-demand. Commit terms cut price.","code":"aws bedrock create-provisioned-model-throughput --model-units 1 --provisioned-model-name pt1 --model-id ID","eq":["az_ptu","gcp_vertex_pt"],"p":"T11"},"gcp_vertex_pt":{"k":"A","cl":"gcp","t":"Vertex AI Provisioned Throughput","s":"Fixed-cost subscription of Generative AI Scale Units (GSUs) for Gemini and partner models.","hp":"Predictable Gemini throughput for production peaks","x":"Terms 1 week to 1 year. Overflow falls back to pay-as-you-go by default. Sized by tokens/sec per GSU per model.","eq":["az_ptu","aws_bedrock_pt"],"p":"T11"},"t11_batchinfer":{"k":"I","cl":"multi","t":"Batch inference","s":"Submit a file (JSONL) of many prompts; results land in storage hours later at about half price.","hp":"Offline jobs: classification, summarizing archives, evals, embeddings backfill","x":"Azure Global Batch (24h target), Bedrock batch inference (S3 in/out), Vertex batch prediction (GCS/BigQuery). Separate quotas.","v":"flow:JSONL to storage>Create batch job>Async processing>Results file","p":"T11"},"t11_eval":{"k":"I","cl":"multi","t":"Prompt engineering & evaluation","s":"Version prompts, test them against datasets and score outputs with metrics or an LLM judge before shipping.","hp":"Catch regressions when you change prompt, model or retrieval","x":"Metrics: groundedness, relevance, coherence, safety, task success. Run evals in CI and on sampled production traffic.","v":"cmp:Evaluation=Foundry evaluations;Bedrock Evaluations;Gen AI evaluation service|Prompt mgmt=Prompts in Foundry;Prompt Management;Vertex prompt mgmt|LLM judge=Yes;Yes;Yes|Red teaming=AI Red Teaming Agent;Guardrail tests;Model Armor tests","p":"T11"},"az_foundry_eval":{"k":"I","cl":"azure","t":"Foundry evaluations","s":"Built-in/custom evaluators (groundedness, relevance, safety, agent tool use) on datasets or live traces.","hp":"On Azure: score RAG/agent quality and safety before and after release","x":"Azure AI Evaluation SDK, continuous evaluation on production, AI Red Teaming Agent (PyRIT). Prompt flow is legacy in new Foundry.","v":"flow:Dataset>Run app>Evaluators>Scores dashboard>Compare runs","eq":["aws_bedrock_eval","gcp_genai_eval"],"p":"T11"},"aws_bedrock_eval":{"k":"I","cl":"aws","t":"Bedrock Evaluations","s":"Evaluate models and Knowledge Bases with programmatic metrics, LLM-as-a-judge or human workers.","hp":"On AWS: compare models or RAG configs on your own dataset","x":"Model + RAG evals, LLM judge or humans. Pair with Prompt Management (versioned prompts) and Bedrock Flows.","v":"flow:Prompt dataset in S3>Eval job>Judge model>Report in S3","eq":["az_foundry_eval","gcp_genai_eval"],"p":"T11"},"gcp_genai_eval":{"k":"I","cl":"gcp","t":"Gen AI evaluation service","s":"Vertex AI service for pointwise/pairwise, rubric-based and computation metrics on models, RAG and agents.","hp":"On GCP: benchmark Gemini/Claude/open models and agents on your data","x":"Via Vertex AI SDK; adaptive rubrics; agent trajectory metrics; results tracked in Vertex AI Experiments.","v":"flow:Eval dataset>Candidate model>Autorater>Metrics>Experiments","eq":["az_foundry_eval","aws_bedrock_eval"],"p":"T11"},"t11_llmjudge":{"k":"I","cl":"multi","t":"LLM-as-a-judge","s":"Use a strong model with a rubric to grade another model's outputs at scale.","hp":"Cheap, fast scoring of open-ended answers where exact-match fails","x":"Calibrate against human labels; judges have position/verbosity bias. Use pairwise + swap order.","v":"seq:App,Judge LLM,Report|1>2:answer + rubric|2>3:score + reason","p":"T11"},"t11_promptpatterns":{"k":"B","cl":"multi","t":"Prompt engineering basics","s":"System prompt, few-shot examples, structured output (JSON schema), chain-of-thought and tool definitions.","hp":"Cheapest lever for quality before RAG or fine-tuning","x":"Use structured outputs to avoid parsing errors; keep stable prefix first for caching; version prompts like code.","v":"stack:System prompt,Few-shot examples,Retrieved context,User question,Output schema","p":"T11"},"t11_rag":{"k":"B","cl":"multi","t":"Retrieval-augmented generation (RAG)","s":"Retrieve relevant chunks of your data and add them to the prompt so the model answers from your facts.","hp":"Ground answers in private, fresh data with citations; cut hallucinations","x":"Quality depends on chunking, embeddings, hybrid search and reranking. Respect document ACLs at query time.","v":"draw:rag","p":"T11"},"az_foundry_iq":{"k":"I","cl":"azure","t":"Foundry IQ (knowledge bases)","s":"Foundry's knowledge layer: reusable knowledge bases over Azure AI Search with agentic retrieval for agents.","hp":"On Azure: give agents permission-aware, multi-source knowledge","x":"Announced Ignite 2025 (preview). Built on Azure AI Search indexes and knowledge sources (Blob, SharePoint, OneLake, web).","eq":["aws_bedrock_kb","gcp_ragengine"],"p":"T11"},"aws_bedrock_kb":{"k":"B","cl":"aws","t":"Bedrock Knowledge Bases","s":"Managed RAG: ingest from S3/Confluence/SharePoint/web, chunk, embed, store, Retrieve(AndGenerate).","hp":"On AWS: RAG with citations in hours, usable by Agents and AgentCore","x":"Vector stores: OpenSearch Serverless, S3 Vectors, Aurora PG, Neptune (GraphRAG), Pinecone, MongoDB. Structured data -> SQL on Redshift.","code":"aws bedrock-agent-runtime retrieve --knowledge-base-id KBID --retrieval-query text=refund","v":"arch:aws:S3 docs>Knowledge Base>Embeddings>OpenSearch,S3 Vectors>Claude","eq":["az_foundry_iq","gcp_ragengine"],"p":"T11"},"gcp_ragengine":{"k":"I","cl":"gcp","t":"Vertex AI RAG Engine","s":"Managed RAG orchestration on Vertex: corpora, import from GCS/Drive, chunk, embed and retrieve for Gemini.","hp":"On GCP: plug a RAG corpus into Gemini or ADK agents as a tool","x":"Backends: RagManaged DB (Spanner), Vertex AI Vector Search, Vertex AI Search, Pinecone, Weaviate. Reranking supported.","v":"arch:gcp:GCS / Drive>RAG corpus>Embeddings>Vector Search>Gemini","eq":["az_foundry_iq","aws_bedrock_kb"],"p":"T11"},"t11_embeddings":{"k":"B","cl":"multi","t":"Embeddings","s":"Models that turn text/images into vectors so semantically similar content is close in vector space.","hp":"Power semantic search, RAG retrieval, clustering, dedupe and recommendations","x":"Azure text-embedding-3, Titan V2 / Nova / Cohere on Bedrock, gemini-embedding-001. Re-embed everything if you switch models.","v":"draw:vectorsearch","p":"T11"},"t11_vectorstore":{"k":"I","cl":"multi","t":"Vector stores","s":"Indexes for approximate nearest-neighbour search over embeddings (HNSW, IVF, DiskANN).","hp":"Choose by scale, hybrid-search needs and what DB you already run","x":"Options: AI Search, Cosmos DB, PG pgvector, OpenSearch, S3 Vectors, Vertex Vector Search, AlloyDB. Hybrid (BM25+vector) usually wins.","v":"cmp:Search-native=Azure AI Search;OpenSearch Service;Vertex AI Vector Search|In your DB=Cosmos DB / PG;Aurora PG / DynamoDB*;AlloyDB / Spanner|Cheap at scale=Blob + AI Search;S3 Vectors;Vector Search 2.0","p":"T11"},"t11_chunking":{"k":"I","cl":"multi","t":"Chunking & reranking","s":"Split documents into retrievable passages, then rerank top-k hits with a cross-encoder before prompting.","hp":"Biggest quality lever in RAG after data cleanliness","x":"Semantic/layout-aware chunks with overlap; keep titles/metadata. Rerankers: AI Search semantic ranker, Cohere Rerank, Vertex ranking.","v":"flow:Parse layout>Chunk + overlap>Embed>Hybrid search top 50>Rerank top 5>Prompt","p":"T11"},"t11_agents":{"k":"B","cl":"multi","t":"AI agents","s":"LLM that plans, calls tools/APIs, observes results and loops until a goal is met, with memory and guardrails.","hp":"Automate multi-step tasks that need tools and decisions, not just answers","x":"Need: runtime, tool gateway (MCP), memory, identity/auth for tools, observability and evals. Start single-agent; add multi-agent only if needed.","v":"draw:agent","p":"T11"},"az_agentservice":{"k":"I","cl":"azure","t":"Foundry Agent Service","s":"Managed agent runtime with tools (AI Search, Bing, code interpreter, OpenAPI, MCP) and multi-agent workflows.","hp":"On Azure: host enterprise agents and publish to Teams / M365 Copilot","x":"Threads/state stored for you or in your Cosmos DB/Storage (standard setup). Connected agents, workflows, hosted agents (preview).","v":"arch:azure:App / Teams>Agent Service>GPT model>AI Search,Functions,MCP","eq":["aws_agentcore","gcp_agentengine"],"p":"T11"},"az_agentframework":{"k":"I","cl":"azure","t":"Microsoft Agent Framework","s":"Open-source .NET/Python SDK for agents and multi-agent workflows; successor to Semantic Kernel + AutoGen.","hp":"Code-first agents that run locally or on Foundry Agent Service","x":"Public preview Oct 2025; supports MCP, A2A, OpenAPI tools, graph-based workflows, OpenTelemetry tracing.","eq":["aws_strands","gcp_adk"],"p":"T11"},"aws_agentcore":{"k":"I","cl":"aws","t":"Amazon Bedrock AgentCore","s":"Modular services to run any-framework agents: Runtime, Gateway, Memory, Identity, tools, Observability.","hp":"On AWS: take LangGraph/Strands/CrewAI agents to production at scale","x":"GA Oct 2025. Runtime sessions up to 8h with microVM isolation; Gateway turns APIs/Lambda into MCP tools. Any model, not just Bedrock.","code":"pip install bedrock-agentcore-starter-toolkit && agentcore launch","v":"hub:AgentCore|Runtime,Gateway,Memory,Identity,Browser,Code Interpreter,Observability","eq":["az_agentservice","gcp_agentengine"],"p":"T11"},"aws_bedrock_agents":{"k":"I","cl":"aws","t":"Bedrock Agents","s":"Config-based agents: instructions + action groups (Lambda/OpenAPI) + Knowledge Bases; multi-agent support.","hp":"Quick managed agents without writing an orchestration loop","x":"Less flexible than AgentCore; supports return-of-control and Guardrails. Good for simple tool-calling assistants.","v":"arch:aws:User>Bedrock Agent>Action group,Knowledge Base>Lambda","p":"T11"},"aws_strands":{"k":"I","cl":"aws","t":"Strands Agents SDK","s":"AWS open-source, model-driven Python/TypeScript agent SDK: model + tools + prompt, with MCP and A2A support.","hp":"Write agents in a few lines and deploy to AgentCore, Lambda or containers","x":"Works with Bedrock, Anthropic, OpenAI, Ollama, LiteLLM. Built-in OTel tracing; multi-agent patterns (swarm, graph).","eq":["az_agentframework","gcp_adk"],"p":"T11"},"gcp_agentengine":{"k":"I","cl":"gcp","t":"Vertex AI Agent Engine","f":"Formerly LangChain on Vertex AI / Reasoning Engine","s":"Managed runtime (part of Agent Builder) for ADK/LangGraph/LangChain agents with Sessions and Memory Bank.","hp":"On GCP: host Python agents without managing servers","x":"Part of Vertex AI Agent Builder. Sessions, Memory Bank, Code Execution, evaluation and Cloud Trace built in.","v":"arch:gcp:App>Agent Engine>Gemini>RAG Engine,Cloud Run tools,MCP","eq":["az_agentservice","aws_agentcore"],"p":"T11"},"gcp_adk":{"k":"I","cl":"gcp","t":"Agent Development Kit (ADK)","s":"Google's open-source code-first agent framework (Python, Java, Go) for single and multi-agent systems.","hp":"Build agents locally, deploy to Agent Engine, Cloud Run or GKE","x":"Model-agnostic (Gemini, Claude, LiteLLM); built-in eval, dev UI, MCP tools and A2A support.","code":"pip install google-adk && adk web","eq":["az_agentframework","aws_strands"],"p":"T11"},"t11_mcp":{"k":"B","cl":"multi","t":"Model Context Protocol (MCP)","s":"Open protocol (from Anthropic) for connecting LLM apps to tools, data and prompts via MCP servers.","hp":"Expose a tool once, use it from any agent framework or IDE assistant","x":"Supported by Foundry, AgentCore Gateway, ADK, Copilot, Claude. Donated to Linux Foundation (Agentic AI Foundation). Secure with OAuth.","v":"seq:Agent,MCP client,MCP server,API|1>2:need tool|2>3:tools/call|3>4:HTTP request|3>1:result","p":"T11"},"t11_a2a":{"k":"I","cl":"multi","t":"Agent2Agent protocol (A2A)","s":"Open protocol (from Google, now Linux Foundation) for agents to discover each other and delegate tasks.","hp":"Let agents built on different frameworks/clouds collaborate","x":"Complements MCP (agent-to-tool). Supported by ADK, Agent Framework, Strands/AgentCore. HTTP + JSON-RPC, streaming.","v":"seq:Client agent,Remote agent|1>2:get Agent Card|1>2:send task|2>1:status / artifacts","p":"T11"},"t11_guardrails":{"k":"B","cl":"multi","t":"Guardrails & responsible AI","s":"Checks on prompts and responses: harmful content, jailbreaks/injection, PII, off-topic, ungrounded output.","hp":"Required for any user-facing LLM app; reduces abuse and data leaks","x":"Layer: platform filters + guardrail service + app checks + least-privilege tools. Log and review blocked items.","v":"cmp:Service=AI Content Safety;Bedrock Guardrails;Model Armor|Prompt injection=Prompt Shields;Prompt attack filter;Prompt injection filter|PII=Language PII / filters;Sensitive info filter;Sensitive Data Protection|Grounding=Groundedness detection;Contextual grounding;Grounding check API|Model-agnostic=Yes;Yes (ApplyGuardrail);Yes","p":"T11"},"az_contentsafety":{"k":"B","cl":"azure","t":"Azure AI Content Safety","s":"Detects hate, sexual, violence and self-harm content (with severity) in text and images; custom categories.","hp":"On Azure: moderate inputs/outputs of any model, incl. user uploads","x":"Built into Foundry model deployments as content filters; also standalone API. Protected material and groundedness detection.","v":"flow:Prompt>Prompt Shields>Model>Content filter>Groundedness>User","eq":["aws_guardrails","gcp_modelarmor"],"p":"T11"},"az_promptshields":{"k":"I","cl":"azure","t":"Prompt Shields","s":"Detects direct jailbreak attempts and indirect prompt injection hidden in documents or tool output.","hp":"RAG/agents that read untrusted web pages, emails or files","x":"Part of Content Safety; enabled in Foundry content filters. Pair with spotlighting (delimit untrusted data).","p":"T11"},"aws_guardrails":{"k":"B","cl":"aws","t":"Bedrock Guardrails","s":"Policies: content filters, denied topics, word filters, PII redaction, grounding checks, Automated Reasoning.","hp":"On AWS: one guardrail reused across models, agents and KBs","x":"ApplyGuardrail API works with non-Bedrock models too. Priced per text unit per policy. Image content filters supported.","code":"aws bedrock create-guardrail --name app-gr --blocked-input-messaging no --blocked-outputs-messaging no","v":"flow:Input>Guardrail>Model>Guardrail>Output","eq":["az_contentsafety","gcp_modelarmor"],"p":"T11"},"gcp_modelarmor":{"k":"I","cl":"gcp","t":"Model Armor","s":"Model-agnostic screening of prompts/responses for injection, jailbreaks, harmful content, PII, bad URLs.","hp":"On GCP: shared policy for Gemini, open models or any LLM API","x":"Templates + floor settings; works with Apigee, Vertex, GKE gateway. Gemini also has per-request safety filter thresholds.","v":"flow:Prompt>Model Armor>LLM>Model Armor>Response","eq":["az_contentsafety","aws_guardrails"],"p":"T11"},"t11_promptinjection":{"k":"I","cl":"multi","t":"Prompt injection & agent security","s":"Attack where untrusted text instructs the model to ignore rules, leak data or misuse tools.","hp":"Design agents assuming any retrieved content may be hostile","x":"No filter is perfect: least-privilege tools, human approval for risky actions, output validation, OWASP LLM Top 10.","v":"draw:zerotrust","p":"T11"},"t11_finetune":{"k":"I","cl":"multi","t":"Fine-tuning & model customization","s":"Adapt a base model on your examples to change style, format or narrow-task skill; or distill big to small.","hp":"When prompting + RAG can't reach required quality, latency or cost","x":"Teaches behavior, not fresh facts (use RAG). Needs 100s-1000s of clean examples. Hosting tuned models has extra cost.","v":"draw:finetune","p":"T11"},"az_foundry_ft":{"k":"I","cl":"azure","t":"Foundry fine-tuning","s":"Supervised, DPO and reinforcement fine-tuning for Azure OpenAI, plus serverless tuning of open models.","hp":"On Azure: tune GPT-4.1 family/o4-mini or Llama/Phi on your data","x":"Training billed per token or hour; deployed tuned models have hourly hosting fee (Developer tier is cheaper, no SLA).","code":"az cognitiveservices account deployment create ... --model-name gpt-4.1-mini.ft-xyz","eq":["aws_bedrock_custom","gcp_vertex_tuning"],"p":"T11"},"aws_bedrock_custom":{"k":"I","cl":"aws","t":"Bedrock custom models","s":"Fine-tuning, continued pre-training, Model Distillation and Custom Model Import on Bedrock.","hp":"On AWS: distill a large model into a cheap one, or import your own weights","x":"Distillation uses teacher outputs to train student (e.g. Nova Premier -> Nova Lite). Import Llama/Mistral/Qwen weights from S3.","code":"aws bedrock create-model-customization-job --customization-type FINE_TUNING --base-model-identifier ...","eq":["az_foundry_ft","gcp_vertex_tuning"],"p":"T11"},"gcp_vertex_tuning":{"k":"I","cl":"gcp","t":"Vertex AI tuning","s":"Supervised and preference tuning for Gemini, plus PEFT/full tuning of open models from Model Garden.","hp":"On GCP: tune Gemini Flash for format, classification or domain style","x":"Gemini tuning is adapter (LoRA)-based; tuned model served on same pricing as base. Datasets in GCS JSONL.","code":"gcloud ai tuning-jobs list --region=us-central1","eq":["az_foundry_ft","aws_bedrock_custom"],"p":"T11"},"t11_lora":{"k":"A","cl":"multi","t":"LoRA / PEFT","s":"Parameter-efficient fine-tuning: train small low-rank adapter matrices instead of all weights.","hp":"Tune big open models on a single GPU; swap many adapters on one base","x":"QLoRA adds 4-bit quantization. Multi-LoRA serving (vLLM) hosts hundreds of adapters cheaply.","v":"stack:LoRA adapter (MBs),Frozen base model (GBs)|1","p":"T11"},"t11_ft_vs_rag":{"k":"B","cl":"multi","t":"Prompt vs RAG vs fine-tune","s":"Decision guide: prompt first, RAG for knowledge, fine-tune for behavior/format/latency.","hp":"Avoid tuning when RAG would do (and vice versa)","x":"Combine: RAG + light fine-tune is common. Fine-tuning won't keep facts fresh.","v":"table:Need,Use|New/changing facts,RAG|Style or format,Fine-tune|Quick fix,1|Lower cost/latency,Distill","p":"T11"},"t11_mlplatform":{"k":"I","cl":"multi","t":"ML platforms (classic ML)","s":"End-to-end environments to prepare data, train, tune, register, deploy and monitor your own ML models.","hp":"Training custom models (tabular, vision, forecasting) or self-hosting open LLMs","x":"Notebooks, managed compute, AutoML, HPO, distributed training, endpoints, MLOps. Billed by compute used.","v":"cmp:Platform=Azure Machine Learning;Amazon SageMaker AI;Vertex AI|IDE=AML studio / VS Code;SageMaker Unified Studio;Colab Ent / Workbench|AutoML=AutoML;Autopilot (Canvas);AutoML|Large training=AML clusters;HyperPod;Training clusters / GKE|Pre-built models=Model catalog;JumpStart;Model Garden","p":"T11"},"az_aml":{"k":"I","cl":"azure","t":"Azure Machine Learning","s":"Azure's ML platform: workspaces, compute, AutoML, MLflow tracking, pipelines, registries, endpoints.","hp":"On Azure: train and deploy custom models with MLOps (CLI/SDK v2)","x":"Pay only for compute. Hub/project shared with Foundry. Serverless compute for jobs. Managed VNet isolation.","code":"az ml job create -f train.yml -w ws -g rg","v":"flow:Data asset>Job on compute>MLflow tracking>Register model>Online endpoint","eq":["aws_sagemaker","gcp_vertex_training"],"p":"T11"},"aws_sagemaker":{"k":"I","cl":"aws","t":"Amazon SageMaker AI","f":"Formerly Amazon SageMaker","s":"AWS's service to build, train, tune and deploy ML models at scale (renamed from Amazon SageMaker).","hp":"On AWS: custom training/inference, self-hosting open LLMs, MLOps","x":"'SageMaker' now names the data+AI suite (Unified Studio); SageMaker AI is the ML part. Autopilot AutoML lives in Canvas.","code":"aws sagemaker list-endpoints --region us-east-1","v":"flow:Studio notebook>Training job>Model Registry>Endpoint>Model Monitor","eq":["az_aml","gcp_vertex_training"],"p":"T11"},"aws_sm_studio":{"k":"I","cl":"aws","t":"SageMaker Unified Studio","s":"Single IDE for data and AI: SQL analytics, notebooks, ML, Bedrock apps over a lakehouse with governance.","hp":"One workspace for data engineers, analysts and ML engineers on AWS","x":"GA Mar 2025 as part of next-gen SageMaker; SageMaker AI Studio (classic ML IDE) still available.","v":"hub:Unified Studio|Notebooks,SQL editor,ML training,Bedrock apps,Catalog","p":"T11"},"aws_sm_jumpstart":{"k":"I","cl":"aws","t":"SageMaker JumpStart","s":"Hub of pretrained/open models (Llama, Mistral, Qwen...) you deploy or fine-tune in a few clicks.","hp":"Self-host an open LLM on your own SageMaker endpoint","x":"You pay endpoint instance hours. Gives full control of instance type, VPC and scaling vs Bedrock serverless.","p":"T11"},"aws_sm_hyperpod":{"k":"A","cl":"aws","t":"SageMaker HyperPod","s":"Resilient managed clusters for large-scale foundation model training/inference with auto node recovery.","hp":"Training or tuning big models on hundreds of GPUs/Trainium chips","x":"Orchestrate with Slurm or EKS; checkpointing and health checks; flexible training plans reserve capacity.","v":"arch:aws:Slurm / EKS>HyperPod cluster>P5,Trn2>FSx Lustre","p":"T11"},"gcp_vertex_training":{"k":"I","cl":"gcp","t":"Vertex AI training & AutoML","s":"Custom training jobs (any container, GPUs/TPUs), hyperparameter tuning, AutoML and notebooks on Vertex AI.","hp":"On GCP: train custom models with managed GPUs/TPUs","x":"Workbench & Colab Enterprise notebooks; AutoML for tabular/image (text tasks moved to Gemini tuning); DWS for scarce GPUs.","code":"gcloud ai custom-jobs create --region=us-central1 --display-name=train --config=job.yaml","v":"flow:Notebook>Custom job>Experiments>Model Registry>Endpoint","eq":["az_aml","aws_sagemaker"],"p":"T11"},"t11_mlops":{"k":"I","cl":"multi","t":"MLOps","s":"Practices and tooling to version data/models, automate training, deploy safely and monitor in production.","hp":"Make models reproducible, auditable and continuously retrained","x":"Core blocks: pipelines, experiment tracking, model registry, feature store, endpoints, monitoring for drift.","v":"flow:Data>Train pipeline>Track>Register>Approve>Deploy>Monitor drift|loop","p":"T11"},"t11_pipelines":{"k":"I","cl":"multi","t":"ML pipelines","s":"DAGs of steps (prep, train, eval, register) that run reproducibly on managed compute.","hp":"Automate retraining and gate deployment on evaluation","x":"Trigger from CI or schedules; cache steps; parameterize per environment.","v":"cmp:Service=Azure ML pipelines;SageMaker Pipelines;Vertex AI Pipelines|Authoring=SDK v2 / YAML;Python SDK;KFP v2 / TFX|Billing=compute only;compute only;per run + compute","p":"T11"},"az_aml_pipelines":{"k":"I","cl":"azure","t":"Azure ML pipelines","s":"Reusable components chained into pipeline jobs in Azure ML (CLI/SDK v2, designer).","hp":"On Azure: automated train/eval/register workflows","x":"Components versioned in registries; schedule or trigger from Azure DevOps/GitHub Actions.","code":"az ml job create -f pipeline.yml","eq":["aws_sm_pipelines","gcp_vertex_pipelines"],"p":"T11"},"aws_sm_pipelines":{"k":"I","cl":"aws","t":"SageMaker Pipelines","s":"Serverless workflow orchestration for ML steps (processing, training, condition, register) in SageMaker AI.","hp":"On AWS: CI/CD for models with approval gates","x":"No charge for orchestration; pay step compute. Integrates with Model Registry and EventBridge.","eq":["az_aml_pipelines","gcp_vertex_pipelines"],"p":"T11"},"gcp_vertex_pipelines":{"k":"I","cl":"gcp","t":"Vertex AI Pipelines","s":"Serverless runner for Kubeflow Pipelines (KFP v2) and TFX workflows with lineage in Vertex ML Metadata.","hp":"On GCP: portable, containerized ML workflows","x":"Small per-run fee + compute. Google Cloud Pipeline Components for BigQuery, AutoML, endpoints.","code":"gcloud ai pipeline-jobs list --region=us-central1","eq":["az_aml_pipelines","aws_sm_pipelines"],"p":"T11"},"t11_registry":{"k":"I","cl":"multi","t":"Model registry","s":"Catalog of model versions with metadata, lineage, stage/approval status and deploy links.","hp":"Know what model is in prod, how it was trained, and roll back fast","x":"Promote via approval; share across workspaces/accounts/projects for dev->prod.","v":"cmp:Service=AML model registry / registries;SageMaker Model Registry;Vertex AI Model Registry|Versioning=versions + MLflow;model package groups;versions + aliases|Approval=tags / stages;Approved status;aliases / labels","p":"T11"},"t11_featurestore":{"k":"A","cl":"multi","t":"Feature store","s":"Shared, versioned features with offline store (training) and low-latency online store (serving).","hp":"Avoid training/serving skew and recompute of the same features","x":"Point-in-time correct joins for training; online store for real-time inference. Often overkill for small teams.","v":"cmp:Service=AML managed feature store;SageMaker Feature Store;Vertex AI Feature Store|Offline=ADLS / Spark;S3 (Iceberg);BigQuery|Online=Redis;Online store;Bigtable / optimized","p":"T11"},"t11_tracking":{"k":"I","cl":"multi","t":"Experiment tracking (MLflow)","s":"Log params, metrics and artifacts per run to compare and reproduce experiments; MLflow is the standard.","hp":"Compare runs and know exactly which code/data produced a model","x":"MLflow 3 adds GenAI tracing and evals. All three clouds offer hosted tracking.","v":"cmp:Service=AML (MLflow-native);SageMaker managed MLflow;Vertex AI Experiments|Format=MLflow;MLflow;Vertex SDK / TensorBoard","p":"T11"},"t11_endpoints":{"k":"I","cl":"multi","t":"Model endpoints (inference modes)","s":"Ways to serve a custom model: real-time, serverless, asynchronous and batch.","hp":"Pick by latency need, payload size and traffic pattern","x":"Real-time = always-on instances; serverless = scale to zero, cold starts; async = big payloads/queue; batch = offline files.","v":"cmp:Real-time=Managed online endpoint;Real-time endpoint;Online prediction|Serverless=Serverless API (MaaS);Serverless Inference;Cloud Run GPU|Async=Batch endpoint;Async Inference;Batch prediction|Batch=Batch endpoint;Batch Transform;Batch prediction","p":"T11"},"az_aml_endpoints":{"k":"I","cl":"azure","t":"AML online & batch endpoints","s":"Managed online endpoints with blue/green traffic split, plus batch endpoints for large scoring jobs.","hp":"On Azure: host custom models or open LLMs on dedicated compute","x":"Traffic split and mirroring for safe rollout; autoscale via Azure Monitor; private endpoints.","code":"az ml online-endpoint create -n churn -f endpoint.yml","v":"draw:bluegreen","eq":["aws_sm_endpoints","gcp_vertex_endpoints"],"p":"T11"},"aws_sm_endpoints":{"k":"I","cl":"aws","t":"SageMaker AI inference options","s":"Real-time endpoints (multi-model, inference components), Serverless, Async Inference, Batch Transform.","hp":"On AWS: any serving pattern from ms latency to offline scoring","x":"Async handles payloads up to 1 GB and scales to zero; Serverless has no GPU support; inference components pack models on GPUs.","v":"table:Mode,Latency,Scale to 0|Real-time,ms,no|Serverless,ms+cold,1|Async,min,yes|Batch,hours,yes","eq":["az_aml_endpoints","gcp_vertex_endpoints"],"p":"T11"},"gcp_vertex_endpoints":{"k":"I","cl":"gcp","t":"Vertex AI endpoints & batch prediction","s":"Online prediction endpoints (dedicated, PSC-private) and batch prediction jobs for custom/open models.","hp":"On GCP: serve models with autoscaling GPUs/TPUs","x":"Endpoints keep min 1 replica (no scale to zero); use Cloud Run GPUs or GKE for scale-to-zero serving.","code":"gcloud ai endpoints deploy-model ENDPOINT --model=MODEL --region=us-central1 --display-name=v1","eq":["az_aml_endpoints","aws_sm_endpoints"],"p":"T11"},"t11_modelmonitor":{"k":"A","cl":"multi","t":"Model monitoring & drift","s":"Detect data drift, prediction drift and quality decay of deployed models; trigger retraining.","hp":"Catch silent model degradation in production","x":"AML model monitoring, SageMaker Model Monitor / Clarify, Vertex AI Model Monitoring v2. Needs logged inputs/labels.","v":"flow:Log requests>Compare to baseline>Drift alert>Retrain pipeline|loop","p":"T11"},"t11_accel":{"k":"A","cl":"multi","t":"AI accelerators (GPUs, TPUs, Trainium)","s":"Specialized hardware for training and serving models: NVIDIA GPUs plus cloud-custom chips.","hp":"Self-hosting/training models, or picking cheaper non-NVIDIA silicon","x":"Capacity is scarce: use reservations/capacity blocks/DWS. Inference often fits smaller GPUs (L4, L40S, A10).","v":"cmp:Top NVIDIA=ND GB200 v6 / H200;P6 B200 / P5 H100;A4 B200 / A3 H100|Inference GPU=NC / NV series;G6 / G6e;G2 (L4)|Custom chip=Maia (internal);Trainium / Inferentia;TPU|Capacity=Reservations;Capacity Blocks for ML;DWS flex-start / calendar","p":"T11"},"az_ndvms":{"k":"A","cl":"azure","t":"Azure ND/NC-series GPU VMs","s":"NVIDIA GPU VMs: ND H100/H200 v5, ND GB200/GB300 v6 for training; NC/NV series for inference.","hp":"On Azure: training clusters or self-hosted LLMs on AKS/AML","x":"InfiniBand for multi-node. Azure Maia 100 is Microsoft's in-house chip for its own services, not rentable VMs. AMD MI300X VMs too.","code":"az vm list-skus -l eastus --resource-type virtualMachines --query \"[?starts_with(name,'Standard_ND')]\"","eq":["aws_gpu_instances","gcp_gpu_vms"],"p":"T11"},"aws_gpu_instances":{"k":"A","cl":"aws","t":"EC2 GPU instances (P & G)","s":"P5/P5e/P5en (H100/H200), P6 (B200/GB200) for training; G5/G6/G6e for inference and graphics.","hp":"On AWS: NVIDIA GPUs for EKS, SageMaker or raw EC2","x":"EFA networking, UltraClusters. Capacity Blocks reserve GPUs for 1-182 days at a known price.","code":"aws ec2 describe-instance-type-offerings --filters Name=instance-type,Values=p5.48xlarge","eq":["az_ndvms","gcp_gpu_vms"],"p":"T11"},"aws_trainium":{"k":"A","cl":"aws","t":"AWS Trainium & Inferentia","s":"AWS-designed ML chips: Trainium (Trn1, Trn2, Trainium3) for training; Inferentia2 for inference.","hp":"Lower cost per token than GPUs for supported models on AWS","x":"Use AWS Neuron SDK (PyTorch/JAX); Anthropic trains on Trainium. Check model/operator support before porting.","v":"bars:GPU baseline=100,Inferentia2=60,Trainium2=65","eq":["az_ndvms","gcp_tpu"],"p":"T11"},"gcp_gpu_vms":{"k":"A","cl":"gcp","t":"Compute Engine GPU VMs (A3, A4, G2)","s":"A3 (H100/H200), A4 (B200), A4X (GB200) for training; G2 (L4) for inference; also on GKE.","hp":"On GCP: NVIDIA GPUs for GKE, Vertex or raw VMs","x":"Dynamic Workload Scheduler: flex-start (queued) or calendar mode (reserved). AI Hypercomputer for large clusters.","eq":["az_ndvms","aws_gpu_instances"],"p":"T11"},"gcp_tpu":{"k":"A","cl":"gcp","t":"Cloud TPU","s":"Google's TPUs: v5e, v5p, Trillium (v6e) and Ironwood (7th gen) pods for training and inference.","hp":"Large-scale training/serving with JAX or PyTorch/XLA at strong price-performance","x":"Ironwood GA late 2025, inference-focused. TPU VMs or GKE TPU node pools; vLLM TPU support. Gemini trains on TPUs.","code":"gcloud compute tpus tpu-vm create tpu1 --zone=us-east5-b --accelerator-type=v6e-8 --version=v2-alpha-tpuv6e","v":"bars:v5e=1,v5p=2,Trillium=4,Ironwood=8","eq":["az_ndvms","aws_trainium"],"p":"T11"},"t11_llmops":{"k":"I","cl":"multi","t":"LLMOps: cost, routing & observability","s":"Running LLM apps economically and reliably: token budgets, caching, model routing, gateways and tracing.","hp":"Keep LLM spend and latency under control as usage grows","x":"Biggest levers: smaller models for easy calls, prompt caching, batch, trimming context, rate limits per tenant.","v":"cmp:Model routing=Foundry model router;Intelligent prompt routing;Model Optimizer (exp.)|Prompt caching=Auto (>=1024 tok);Cache checkpoints;Implicit + explicit|AI gateway=APIM AI gateway;API Gateway + Lambda;Apigee AI policies|Tracing=Foundry tracing;AgentCore Observability;Cloud Trace","p":"T11"},"t11_tokens":{"k":"B","cl":"multi","t":"Tokens & context windows","s":"LLMs bill and limit by tokens (~4 chars English); context window caps input+output per call.","hp":"Estimate cost and avoid context overflow errors","x":"Output tokens pricier than input; reasoning tokens bill as output. Long context raises cost and latency.","v":"gbars:Small,Medium,Large|Input $/Mtok=0.1,1,3|Output $/Mtok=0.4,4,15","p":"T11"},"t11_promptcache":{"k":"I","cl":"multi","t":"Prompt caching","s":"Provider reuses computation for a repeated prompt prefix (system prompt, docs, tools) at a big discount.","hp":"Chatbots/agents with long stable system prompts or documents","x":"Azure OpenAI auto for prompts >=1024 tokens; Bedrock explicit cache checkpoints (~5 min TTL); Gemini implicit + explicit context caching.","v":"stack:Cached prefix (system + docs),Dynamic suffix (user turn)|1","p":"T11"},"t11_routing":{"k":"I","cl":"multi","t":"Model routing","s":"Send each request to the cheapest model able to handle it (small for easy, large/reasoning for hard).","hp":"Cut cost while keeping quality on hard prompts","x":"Managed routers or your own classifier; evaluate routed quality vs single model.","v":"fan:Router|Small model,Mid model,Reasoning model","p":"T11"},"az_modelrouter":{"k":"I","cl":"azure","t":"Foundry model router","s":"A single deployable model that routes each prompt to the best underlying model (GPT-4.1/5 family, o-series).","hp":"On Azure: automatic cost/quality routing behind one deployment","x":"Routing modes (balanced, quality, cost); billed at underlying model rates plus router.","eq":["aws_promptrouter"],"p":"T11"},"aws_promptrouter":{"k":"I","cl":"aws","t":"Bedrock intelligent prompt routing","s":"Routes requests within a model family (e.g. Claude Sonnet vs Haiku, Nova Pro vs Lite) by predicted quality.","hp":"On AWS: up to ~30% cost savings with minimal quality loss","x":"GA Apr 2025; default and custom routers; single router ARN used as model ID.","eq":["az_modelrouter"],"p":"T11"},"t11_aigateway":{"k":"I","cl":"multi","t":"AI gateway","s":"Gateway in front of LLM endpoints: auth, per-team token quotas, load balancing, caching, logging.","hp":"Many apps/teams share LLM capacity and you need chargeback + control","x":"Azure APIM AI gateway policies (token limit, token metrics, semantic cache); Apigee AI policies; on AWS often API GW + Lambda or LiteLLM.","v":"draw:apigw","p":"T11"},"t11_llmobs":{"k":"I","cl":"multi","t":"LLM observability & tracing","s":"Trace prompts, tool calls, tokens, latency and costs per request using OpenTelemetry GenAI conventions.","hp":"Debug agent behavior and attribute cost per feature/tenant","x":"Foundry tracing -> App Insights; AgentCore Observability -> CloudWatch; Vertex -> Cloud Trace. Also Langfuse, LangSmith.","v":"draw:observability","p":"T11"},"t12_prebuilt_vs_llm":{"k":"B","cl":"multi","t":"Prebuilt AI API vs LLM","s":"Task-specific APIs (OCR, STT, translation) vs prompting a general LLM for the same job.","hp":"Pick prebuilt for scale/cost/accuracy on narrow tasks; LLM for flexible reasoning","x":"Prebuilt: cheaper per call, deterministic, compliance certs. LLM: handles odd formats and extraction schemas. Hybrids common.","v":"table:Need,Prebuilt API,LLM|Fixed task at scale,1,costly|Odd formats,weak,1|Deterministic output,1,variable|Reasoning,no,1","p":"T12"},"t12_search":{"k":"B","cl":"multi","t":"Enterprise search & retrieval","s":"Managed search over your content (keyword, vector, hybrid, semantic ranking); often the RAG retriever.","hp":"Search apps and the retrieval half of RAG","x":"Hybrid (BM25 + vector) + reranker is best default. Respect document permissions (security trimming).","v":"cmp:Service=Azure AI Search;Amazon Kendra;Vertex AI Search|Vector + hybrid=Yes;GenAI Index;Yes|Reranker=Semantic ranker;Built-in;Built-in|Connectors=Indexers;40+ connectors;Connectors / Gemini Ent|Pricing=Search units/hr;Index hours;Per query + storage","p":"T12"},"az_aisearch":{"k":"B","cl":"azure","t":"Azure AI Search","f":"Formerly Azure Cognitive Search","s":"Search service with full-text, vector, hybrid and semantic ranking, indexers, skillsets and agentic retrieval.","hp":"On Azure: retrieval layer for RAG and Foundry agents","x":"Tiers Free, Basic, S1-S3, L1-L2; billed per search unit (replicas x partitions). Formerly Azure Cognitive Search.","code":"az search service create -n mysearch -g rg --sku standard --partition-count 1 --replica-count 2","v":"arch:azure:Blob / SQL>Indexer + skills>Search index>Hybrid + semantic>App / Agent","eq":["aws_kendra","gcp_vertex_search"],"p":"T12"},"az_aisearch_vector":{"k":"I","cl":"azure","t":"Vector & hybrid search","s":"HNSW/exhaustive KNN vector fields queried together with BM25 keyword search, fused by RRF.","hp":"Queries with both exact terms (SKUs, codes) and meaning","x":"Supports quantization (scalar/binary) to cut memory; multi-vector and filters.","v":"draw:vectorsearch","p":"T12"},"az_aisearch_semantic":{"k":"I","cl":"azure","t":"Semantic ranker","s":"Microsoft cross-encoder reranker that reorders top results and returns captions/answers.","hp":"Boost RAG relevance with one setting","x":"Billed per 1,000 queries beyond free quota; available Basic tier and up.","p":"T12"},"az_aisearch_intvec":{"k":"I","cl":"azure","t":"Integrated vectorization","s":"Indexers chunk docs and call embedding models at ingestion, and vectorize queries at search time.","hp":"RAG ingestion without writing a chunk/embed pipeline","x":"Uses Azure OpenAI/Foundry embedding skills; Document Layout skill for structure-aware chunking.","v":"flow:Blob docs>Indexer>Split skill>Embedding skill>Vector index","p":"T12"},"aws_kendra":{"k":"I","cl":"aws","t":"Amazon Kendra","s":"ML-powered enterprise search with 40+ connectors, ACL-aware results and GenAI Index for RAG.","hp":"On AWS: permission-aware search over SharePoint, Confluence, S3, etc.","x":"Developer/Enterprise editions billed per hour; GenAI Enterprise Edition usable by Bedrock KB and Q Business. Costly baseline.","code":"aws kendra query --index-id IDX --query-text \"vacation policy\"","eq":["az_aisearch","gcp_vertex_search"],"p":"T12"},"gcp_vertex_search":{"k":"I","cl":"gcp","t":"Vertex AI Search","s":"Google-quality search over websites, unstructured docs and structured data, with grounding and summaries.","hp":"On GCP: managed search and RAG retrieval with minimal tuning","x":"Part of AI Applications (formerly Agent Builder/Gen App Builder). Powers Gemini Enterprise search. Per-query pricing.","code":"gcloud alpha discovery-engine data-stores list --location=global","eq":["az_aisearch","aws_kendra"],"p":"T12"},"t12_vision":{"k":"B","cl":"multi","t":"Image analysis (vision APIs)","s":"Prebuilt APIs for labels, objects, OCR, faces, moderation and custom image classifiers.","hp":"Tag, moderate or read text from images at scale cheaply","x":"Multimodal LLMs now cover many vision tasks; prebuilt wins on cost and consistency at volume.","v":"cmp:Service=Azure AI Vision;Amazon Rekognition;Cloud Vision API|OCR=Read API;DetectText;Text detection|Faces=Face API (limited);Face detection/search;Face detection|Custom=Custom models;Custom Labels;AutoML / Vertex|Moderation=Content Safety;Moderation;SafeSearch","p":"T12"},"az_vision":{"k":"B","cl":"azure","t":"Azure AI Vision","f":"Formerly Computer Vision","s":"Image Analysis 4.0 (captions, tags, objects, OCR), Read OCR, Face API and multimodal embeddings.","hp":"On Azure: captions, OCR and image search embeddings","x":"Face identification/verification is Limited Access (approval). Formerly Computer Vision.","eq":["aws_rekognition","gcp_vision"],"p":"T12"},"aws_rekognition":{"k":"B","cl":"aws","t":"Amazon Rekognition","s":"Image and video analysis: labels, faces, text, celebrity, content moderation and Custom Labels.","hp":"On AWS: moderate user uploads or detect objects/faces in S3 images","x":"Per-image pricing; Custom Labels billed per inference hour. Face collections for search.","code":"aws rekognition detect-labels --image 'S3Object={Bucket=b,Name=a.jpg}'","eq":["az_vision","gcp_vision"],"p":"T12"},"gcp_vision":{"k":"B","cl":"gcp","t":"Cloud Vision API","s":"Pretrained image labels, OCR, SafeSearch, landmarks, logos and object localization.","hp":"On GCP: quick image tagging and OCR","x":"First 1,000 units/month free per feature. For documents prefer Document AI.","code":"gcloud ml vision detect-labels gs://bucket/img.jpg","eq":["az_vision","aws_rekognition"],"p":"T12"},"t12_video":{"k":"I","cl":"multi","t":"Video analysis","s":"Extract scenes, labels, faces, speech transcripts, OCR and topics from video for search and moderation.","hp":"Index media archives or moderate user video","x":"Video is expensive per minute: sample frames or use Gemini/BDA when you need summaries.","v":"cmp:Service=Azure AI Video Indexer;Rekognition Video;Video Intelligence API|Transcript=Yes;via Transcribe;Speech transcription|Edge=Arc-enabled;Streaming events;Streaming (limited)","p":"T12"},"az_videoindexer":{"k":"I","cl":"azure","t":"Azure AI Video Indexer","s":"Extracts transcripts, faces, labels, OCR, topics and scenes from video and audio.","hp":"On Azure: searchable media libraries","x":"Also runs on-prem/ed ed GitHub OIDC token for cloud credentials, no stored keys.","hp":"Use for every cloud deploy from Actions to eliminate long-lived secrets","x":"Azure: federated credential on app/managed identity. AWS: IAM OIDC provider + role. GCP: Workload Identity Federation. Needs id-token: write.","p":"T13","v":"seq:Workflow,GitHub OIDC,Cloud STS,Cloud API|1>2:request ID token|2>1:signed JWT|1>3:exchange JWT|3>1:short-lived creds|1>4:deploy"},"aws_codepipeline":{"k":"I","cl":"aws","t":"AWS CodePipeline","s":"Managed release orchestration that chains source, build, test, approval and deploy stages.","hp":"Use when you want AWS-native CD wired to CodeBuild, CodeDeploy, CloudFormation and ECS","x":"V2 pipelines: $0.002 per action-execution minute, git triggers with branch/tag filters. Sources: GitHub, GitLab, Bitbucket, CodeCommit, S3, ECR.","p":"T13","code":"aws codepipeline start-pipeline-execution --name my-pipeline","v":"flow:Source>CodeBuild>Manual approval>Deploy (CFN/ECS)","eq":["az_devops","gcp_cloudbuild"]},"aws_codebuild":{"k":"I","cl":"aws","t":"AWS CodeBuild","s":"Fully managed build service running buildspec.yml in containers, billed per build minute.","hp":"Use for builds needing VPC access or AWS IAM roles, inside or outside CodePipeline","x":"EC2, Lambda, reserved-capacity fleets; can host self-hosted GitHub Actions runners. Docker layer and S3 caching.","p":"T13","code":"aws codebuild start-build --project-name my-app","v":"flow:Source>Install>Pre_build>Build>Post_build>Artifacts","eq":["az_devops_pipelines","gcp_cloudbuild"]},"aws_codedeploy":{"k":"I","cl":"aws","t":"AWS CodeDeploy","s":"Automates deployments to EC2/on-prem, Lambda and ECS with in-place or blue/green strategies.","hp":"Use for controlled rollouts with automatic rollback on CloudWatch alarms","x":"Free for EC2/Lambda/ECS; on-prem per-instance fee. appspec.yml lifecycle hooks. ECS now also has built-in blue/green (2025).","p":"T13","code":"aws deploy create-deployment --application-name app --deployment-group-name prod --s3-location ...","v":"flow:Revision>Deployment group>Lifecycle hooks>Shift traffic>Alarm check","eq":["az_devops_pipelines","gcp_clouddeploy"]},"aws_codecommit":{"k":"I","cl":"aws","t":"AWS CodeCommit","s":"AWS-hosted private Git repositories with IAM-based access.","hp":"Consider only if you need repos fully inside AWS IAM boundaries","x":"Closed to new customers Jul 2024; AWS reversed course in late 2025 and resumed full support. Most teams use GitHub/GitLab via CodeConnections.","p":"T13","v":"flow:git push>CodeCommit>EventBridge>CodePipeline"},"gcp_cloudbuild":{"k":"I","cl":"gcp","t":"Cloud Build","s":"Serverless CI that runs build steps as containers defined in cloudbuild.yaml.","hp":"Use on GCP to build images to Artifact Registry and trigger deploys","x":"First 2,500 build-min/month free (e2-standard-2). Private pools for VPC access. Triggers from GitHub, GitLab, Bitbucket. Cloud Source Repos closed to new users.","p":"T13","code":"gcloud builds submit --tag us-docker.pkg.dev/p/repo/app:v1","v":"flow:Trigger>Step containers>Push image>Deploy step","eq":["az_devops_pipelines","aws_codebuild"]},"gcp_clouddeploy":{"k":"I","cl":"gcp","t":"Cloud Deploy","s":"Managed continuous delivery that promotes releases through targets for GKE, Cloud Run and more.","hp":"Use for staged promotion, approvals and canaries on GKE or Cloud Run","x":"Delivery pipeline + targets; Skaffold renders manifests. Rollback, approvals, deploy policies. Priced per active delivery pipeline.","p":"T13","code":"gcloud deploy releases create rel-1 --delivery-pipeline=app --region=us-central1","v":"flow:Release>dev target>staging target>Approval>prod target","eq":["aws_codedeploy","az_devops_pipelines"]},"gcp_cd_canary":{"k":"A","cl":"gcp","t":"Cloud Deploy canary","s":"Cloud Deploy strategy that shifts a percentage of traffic to a new release in phases.","hp":"Use for progressive delivery on GKE or Cloud Run without hand-written scripts","x":"Phases like 25/50/100 with verify jobs; uses Gateway API or service networking on GKE, traffic split on Cloud Run.","p":"T13","v":"bars:Phase 1=25,Phase 2=50,Stable=100"},"t13_iac":{"k":"B","cl":"multi","t":"Infrastructure as Code","s":"Declare cloud resources in versioned files and let a tool create, update and delete them.","hp":"Use for every non-trivial environment: reproducible, reviewable, rebuildable infra","x":"Declarative (Terraform, Bicep, CFN) vs imperative languages (CDK, Pulumi). Run via CI with plan review; avoid click-ops drift.","p":"T13","v":"cmp:Native=Bicep / ARM;CloudFormation;Infra Manager|Code-first=Bicep;AWS CDK;CDKTF/Pulumi|State=ARM (none);CFN stacks;TF state in GCS|Preview=what-if;Change sets;Terraform plan|Multi-cloud=Terraform;Terraform;Terraform"},"x_terraform":{"k":"B","cl":"multi","t":"Terraform / OpenTofu","s":"Declarative HCL tool with providers for every cloud; OpenTofu is the open-source MPL fork.","hp":"Default for multi-cloud or when one tool must manage clouds, SaaS and Kubernetes","x":"Terraform is BSL-licensed (IBM owns HashiCorp); OpenTofu under Linux Foundation. Remote state + locking required for teams. HCP Terraform for runs/policy.","p":"T13","code":"terraform init && terraform plan -out tf.plan && terraform apply tf.plan","v":"flow:Write HCL>init>plan>review>apply>state updated","eq":["az_bicep","aws_cfn","gcp_infra_manager"]},"az_bicep":{"k":"B","cl":"azure","t":"Bicep & ARM templates","s":"Azure-native declarative IaC; Bicep is a concise DSL that compiles to ARM JSON.","hp":"Use on Azure-only estates for day-0 support of new resource types without state files","x":"No state file: ARM is the source of truth. what-if previews; modules via registries and Azure Verified Modules. Free.","p":"T13","code":"az deployment group create -g rg-app -f main.bicep -p env=prod","v":"flow:main.bicep>bicep build>ARM JSON>ARM deploy>Resources","eq":["aws_cfn","gcp_infra_manager"]},"az_deploystacks":{"k":"A","cl":"azure","t":"Azure deployment stacks","s":"Manage a group of Bicep/ARM resources as one unit with deny settings and cleanup.","hp":"Use to delete resources removed from templates and block out-of-band changes","x":"actionOnUnmanage detach/delete; denySettings stop portal edits. Scope: resource group, subscription, management group.","p":"T13","code":"az stack group create -n app -g rg-app -f main.bicep --action-on-unmanage deleteAll --deny-settings-mode none","v":"flow:Template>Stack>Managed resources>Deny edits"},"aws_cfn":{"k":"B","cl":"aws","t":"AWS CloudFormation","s":"AWS-native declarative IaC that provisions resources as stacks from YAML/JSON templates.","hp":"Use for AWS-only infra with managed state, rollback and drift detection","x":"Free for AWS resources. Change sets preview, StackSets for multi-account, IaC generator imports existing resources, Hooks for guardrails.","p":"T13","code":"aws cloudformation deploy --template-file stack.yml --stack-name app --capabilities CAPABILITY_IAM","v":"flow:Template>Change set>Stack create/update>Rollback on fail","eq":["az_bicep","gcp_infra_manager"]},"aws_cfn_stacksets":{"k":"A","cl":"aws","t":"CloudFormation StackSets","s":"Deploy one stack template across many accounts and regions from a central account.","hp":"Use for org-wide baselines: roles, Config rules, logging buckets","x":"Service-managed with AWS Organizations auto-deploys to new accounts in OUs. Control concurrency and failure tolerance.","p":"T13","v":"fan:Admin account|Account A,Account B,Account C,New OU accounts"},"aws_cdk":{"k":"I","cl":"aws","t":"AWS CDK","s":"Define AWS infra in TypeScript, Python, Java, C# or Go; synthesizes to CloudFormation.","hp":"Use when devs prefer real code, loops and reusable constructs over YAML","x":"L1/L2/L3 constructs; cdk diff/deploy; bootstrap per account/region. Still bounded by CloudFormation limits. CDK for Terraform is deprecated.","p":"T13","code":"cdk bootstrap && cdk diff && cdk deploy MyStack","v":"flow:TS/Python code>cdk synth>CFN template>CFN deploy","eq":["az_bicep","x_pulumi"]},"gcp_infra_manager":{"k":"I","cl":"gcp","t":"Infrastructure Manager","s":"Google-managed service that runs Terraform deployments with state, logs and IAM.","hp":"Use on GCP for managed Terraform runs without operating your own runner/state","x":"Runs Terraform via Cloud Build, stores state; previews. Replaces Cloud Deployment Manager (end of support Mar 31 2026).","p":"T13","code":"gcloud infra-manager deployments apply projects/p/locations/us-central1/deployments/d --local-source=.","v":"flow:Terraform config>Preview>Apply via Cloud Build>Managed state","eq":["az_bicep","aws_cfn"]},"x_pulumi":{"k":"I","cl":"multi","t":"Pulumi","s":"IaC in TypeScript, Python, Go, C#, Java or YAML with providers for all clouds.","hp":"Use when teams want full programming languages and testing for multi-cloud infra","x":"State in Pulumi Cloud or self-managed S3/Blob/GCS backends. Pulumi ESC manages config/secrets. Can use Terraform providers.","p":"T13","code":"pulumi preview && pulumi up --stack prod","v":"flow:Program>pulumi preview>pulumi up>State backend","eq":["aws_cdk","x_terraform"]},"t13_state":{"k":"I","cl":"multi","t":"IaC state & drift","s":"State maps code to real resources; drift is when reality diverges from code.","hp":"Understand before running Terraform in a team or debugging surprise changes","x":"Store TF state remotely (azurerm/s3/gcs) with locking (S3 native lockfile in TF 1.10+). State holds secrets: encrypt, restrict. Detect drift on a schedule.","p":"T13","code":"terraform plan -refresh-only -detailed-exitcode","v":"table:Tool,State,Drift check|Terraform,Remote backend,plan -refresh-only|CloudFormation,AWS-managed,detect-stack-drift|Bicep,ARM itself,what-if"},"t13_modules":{"k":"I","cl":"multi","t":"IaC modules & reuse","s":"Package common infra patterns as versioned modules consumed by many teams.","hp":"Use to standardize networks, clusters and landing zones across teams","x":"Terraform Registry/private registry, Bicep registry in ACR, tion; sam pipeline init.","p":"T13","code":"sam build && sam deploy --guided","v":"flow:template.yaml>sam build>sam local>sam deploy>CFN stack","eq":["az_azd","gcp_skaffold"]},"gcp_skaffold":{"k":"I","cl":"gcp","t":"Skaffold & Firebase CLI","s":"Skaffold automates build/push/deploy loops for Kubernetes; Firebase CLI deploys and emulates Firebase apps.","hp":"Use Skaffold for GKE/Cloud Run dev loops; Firebase CLI for Firebase apps","x":"Skaffold powers Cloud Code and Cloud Deploy rendering. Firebase Local Emulator Suite runs Auth, Firestore, Functions locally.","p":"T13","code":"skaffold dev --default-repo=us-docker.pkg.dev/p/repo","v":"flow:Edit code>Build image>Deploy to cluster>Stream logs|loop","eq":["az_azd","aws_sam"]},"t13_config":{"k":"I","cl":"multi","t":"Configuration & feature flags","s":"Externalized app settings and runtime flags changed without redeploying code.","hp":"Use to separate config from code and toggle features safely in production","x":"Keep secrets in a secret store, reference them from config. Version/snapshot config; validate before rollout.","p":"T13","v":"cmp:Service=App Configuration;AppConfig;Parameter Manager|Key-value=Yes;Parameter Store;Yes|Feature flags=Feature Manager;AppConfig flags;Remote Config|Secret refs=Key Vault refs;Secrets Mgr refs;Secret Manager refs|Rollout=Snapshots;Deploy strategies;Versions"},"az_appconfig":{"k":"I","cl":"azure","t":"Azure App Configuration","s":"Managed store for app settings and feature flags with labels, snapshots and Key Vault references.","hp":"Use on Azure to centralize config and flags across services and environments","x":"Free, Developer, Standard, Premium tiers; geo-replicas; .NET/Java/Python/JS providers with dynamic refresh; Entra auth.","p":"T13","code":"az appconfig kv set -n appcfg --key App:Color --value blue --label prod","v":"hub:App Configuration|Web app,Functions,AKS,Key Vault refs","eq":["aws_appconfig","gcp_parammgr"]},"aws_appconfig":{"k":"I","cl":"aws","t":"AWS AppConfig & Parameter Store","s":"Systems Manager capabilities for validated config/feature-flag rollouts and hierarchical parameters.","hp":"Use AppConfig for flags/dynamic config; Parameter Store for simple settings","x":"AppConfig: validators, gradual deployment strategies, auto-rollback on CloudWatch alarms, Lambda/agent caching. Billed per config request.","p":"T13","code":"aws appconfig start-deployment --application-id a --environment-id e --configuration-profile-id c ...","v":"flow:Config/flag>Validate>Gradual deploy>Alarm watch>Rollback","eq":["az_appconfig","gcp_parammgr"]},"aws_paramstore":{"k":"B","cl":"aws","t":"SSM Parameter Store","s":"Hierarchical key-value store for config strings and KMS-encrypted SecureStrings.","hp":"Use for simple env config referenced from Lambda, ECS, CFN and CodeBuild","x":"Standard tier free (10k params, 4 KB); Advanced 8 KB + policies, paid. Throughput limits; Secrets Manager for rotation.","p":"T13","code":"aws ssm put-parameter --name /app/prod/db_host --value db.internal --type String","v":"tree:/app>/app/dev,/app/prod;/app/prod>db_host,api_key"},"gcp_parammgr":{"k":"I","cl":"gcp","t":"Parameter Manager","s":"Secret Manager extension storing versioned config parameters (JSON/YAML) that can reference secrets.","hp":"Use on GCP for centralized app config with secret references","x":"GA 2025; global and regional parameters; renders secret references at read. Runtime Configurator is deprecated. Flags: Firebase Remote Config.","p":"T13","code":"gcloud parametermanager parameters create app-config --location=global --parameter-format=YAML","v":"flow:Parameter>Version>Render secret refs>App reads","eq":["az_appconfig","aws_appconfig"]},"t13_deploystrat":{"k":"I","cl":"multi","t":"Deployment strategies","s":"Patterns for releasing new versions while limiting blast radius and enabling rollback.","hp":"Pick one per service based on risk, cost and rollback speed","x":"Rolling = cheap, slow rollback. Blue/green = instant switch, 2x capacity. Canary = small % first with metrics. Flags decouple deploy from release.","p":"T13","v":"cmp:Slots/swap=App Service slots;CodeDeploy B/G;Cloud Run revisions|Canary=Front Door/ACA split;CodeDeploy linear;Cloud Deploy canary|K8s=AKS + Argo Rollouts;EKS + Argo Rollouts;GKE + Cloud Deploy|Flags=App Configuration;AppConfig;Remote Config"},"t13_rolling":{"k":"B","cl":"multi","t":"Rolling deployment","s":"Replace instances in batches so old and new versions run side by side briefly.","hp":"Use for stateless services where brief mixed versions are acceptable","x":"Default in Kubernetes Deployments (maxSurge/maxUnavailable), VMSS, ASG instance refresh, MIG rolling updates. Rollback = another roll.","p":"T13","code":"kubectl rollout status deploy/api && kubectl rollout undo deploy/api","v":"flow:v1 v1 v1>v2 v1 v1>v2 v2 v1>v2 v2 v2"},"t13_bluegreen":{"k":"I","cl":"multi","t":"Blue/green deployment","s":"Run a full new (green) environment, test it, then switch all traffic from blue at once.","hp":"Use when you need instant rollback and can afford double capacity briefly","x":"Switch at load balancer, DNS or slot swap. Database schema must be backward compatible for both versions.","p":"T13","v":"draw:bluegreen"},"az_slots":{"k":"I","cl":"azure","t":"App Service deployment slots","s":"Live staging slots of an App Service app that can be warmed up and swapped with production.","hp":"Use for zero-downtime blue/green on App Service and Functions","x":"Standard tier and up (Standard 5 slots, Premium 20). Slot-sticky settings; swap with preview; % traffic routing to a slot.","p":"T13","code":"az webapp deployment slot swap -g rg -n myapp --slot staging --target-slot production","v":"flow:Deploy to staging>Warm up>Swap>Prod live|loop","eq":["aws_cd_traffic","gcp_run_traffic"]},"t13_canary":{"k":"I","cl":"multi","t":"Canary deployment","s":"Send a small share of traffic to the new version, watch metrics, then increase or roll back.","hp":"Use for high-traffic services where real-user signals catch problems early","x":"Needs good SLO metrics and automated analysis. Variants: linear (10% every N min), canary (10% then 100%). Tools: Argo Rollouts, Flagger.","p":"T13","v":"draw:canary"},"aws_cd_traffic":{"k":"A","cl":"aws","t":"CodeDeploy traffic shifting","s":"CodeDeploy configs that shift Lambda alias or ECS traffic in canary, linear or all-at-once steps.","hp":"Use on AWS for automated canary/linear rollouts with alarm-based rollback","x":"e.g. LambdaCanary10Percent5Minutes, ECSLinear10PercentEvery1Minutes. Pre/post traffic hook Lambdas; ALB listener swap for ECS.","p":"T13","v":"bars:Canary step=10,Linear 1=20,Linear 2=40,Linear 3=60,Done=100","eq":["az_slots","gcp_run_traffic"]},"gcp_run_traffic":{"k":"I","cl":"gcp","t":"Cloud Run traffic splitting","s":"Route percentages of traffic across Cloud Run revisions, with tagged URLs for testing.","hp":"Use on Cloud Run for canary, blue/green and instant rollback","x":"Deploy with --no-traffic, test via tag URL, then shift %. Rollback = route 100% to previous revision.","p":"T13","code":"gcloud run services update-traffic api --to-revisions=api-00042=10","v":"bars:Old revision=90,New revision=10","eq":["az_slots","aws_cd_traffic"]},"t13_featureflags":{"k":"I","cl":"multi","t":"Feature flags","s":"Runtime switches that turn code paths on per user, cohort or percentage without redeploying.","hp":"Use to decouple deploy from release, run experiments and kill-switch features","x":"Managed: Azure App Configuration, AWS AppConfig, Firebase Remote Config; SaaS: LaunchDarkly etc. OpenFeature is the open SDK standard. Clean up stale flags.","p":"T13","v":"fan:Flag service|Internal users,5% users,EU only,Everyone"},"t13_gitops":{"k":"I","cl":"multi","t":"GitOps","s":"Git is the source of truth; an in-cluster controller continuously reconciles clusters to it.","hp":"Use for Kubernetes fleets needing audit, drift correction and pull-based deploys","x":"Pull model: no cluster creds in CI. PR = change request; revert = rollback. Works with Helm/Kustomize/OCI artifacts.","p":"T13","v":"draw:gitops"},"x_argocd":{"k":"I","cl":"multi","t":"Argo CD & Flux (GitOps)","s":"CNCF-graduated GitOps controllers that sync Kubernetes manifests from Git/OCI to clusters.","hp":"Use Argo CD for UI-driven multi-cluster apps; Flux for lightweight, composable GitOps","x":"Argo CD: Applications/ApplicationSets, UI, SSO. Flux: Kustomization/HelmRelease CRDs. Add Argo Rollouts/Flagger for canaries.","p":"T13","code":"argocd app create api --repo https://github.com/org/gitops --path apps/api --dest-namespace api","v":"arch:multi:Git repo>Argo CD / Flux>Cluster A,Cluster B,Cluster C"},"az_flux":{"k":"I","cl":"azure","t":"GitOps with Flux on AKS & Arc","s":"Microsoft-managed Flux v2 cluster extension for AKS and Azure Arc-enabled Kubernetes.","hp":"Use on Azure to apply GitOps at scale, enforced via Azure Policy","x":"microsoft.flux extension + fluxConfigurations resources; compliance state in portal; Argo CD extension also offered (preview).","p":"T13","code":"az k8s-configuration flux create -g rg -c aks1 -t managedClusters -n app --url https://github.com/org/repo","v":"flow:Git>Flux extension>AKS / Arc cluster>Compliance status","eq":["x_argocd","gcp_configsync"]},"gcp_configsync":{"k":"I","cl":"gcp","t":"Config Sync","s":"GKE GitOps service that syncs configs from Git, OCI or Helm repos to clusters and fleets.","hp":"Use on GKE fleets for consistent config and policy across clusters","x":"RootSync/RepoSync CRDs; pairs with Policy Controller (Gatekeeper). Managed via GKE fleet features.","p":"T13","code":"gcloud beta container fleet config-management apply --membership=c1 --config=apply-spec.yaml","v":"fan:Git / OCI repo|GKE cluster 1,GKE cluster 2,Attached cluster","eq":["az_flux","x_argocd"]},"t13_k8spkg":{"k":"I","cl":"multi","t":"Kubernetes packaging","s":"Ways to template, version and customize Kubernetes manifests per environment.","hp":"Use whenever you deploy the same app to several clusters or envs","x":"Helm = templated, versioned charts with releases; Kustomize = template-free overlays (built into kubectl). Often combined.","p":"T13","v":"table:Need,Helm,Kustomize|Templating,1,No|Versioned package,1,No|Env overlays,values files,1"},"x_helm":{"k":"B","cl":"multi","t":"Helm","s":"Kubernetes package manager: charts template manifests, values customize them, releases track installs.","hp":"Use to install third-party software or package your app for many clusters","x":"Charts in OCI registries (ACR, ECR, Artifact Registry). Helm 3 is client-only; Helm 4 released late 2025. Upgrade/rollback by release revision.","p":"T13","code":"helm upgrade --install api oci://myacr.azurecr.io/charts/api --version 1.4.0 -f values-prod.yaml","v":"flow:Chart>values.yaml>Rendered YAML>Release v1>Upgrade v2>Rollback"},"x_kustomize":{"k":"I","cl":"multi","t":"Kustomize","s":"Template-free customization of Kubernetes YAML via bases and overlays, built into kubectl.","hp":"Use for per-env patches (replicas, images, labels) on plain manifests","x":"kubectl apply -k; overlays patch a base; images/configMapGenerator. Native in Argo CD and Flux.","p":"T13","code":"kubectl apply -k overlays/prod","v":"tree:base>dev overlay,prod overlay;prod overlay>replicas: 5,image tag"},"t13_artifacts":{"k":"I","cl":"multi","t":"Artifact & package management","s":"Private feeds for language packages and build outputs, proxying public registries.","hp":"Use to share internal libraries and cache/curate public npm, PyPI, Maven packages","x":"Upstream proxying protects against public outages and lets you vet packages. Container images: see ACR/ECR/Artifact Registry.","p":"T13","v":"cmp:Service=Azure Artifacts;CodeArtifact;Artifact Registry|Formats=NuGet npm Maven PyPI;npm PyPI Maven NuGet;Docker npm PyPI etc|Upstreams=Yes;Yes;Remote repos|Auth=PAT/Entra;IAM token;IAM/ADC"},"az_artifacts":{"k":"I","cl":"azure","t":"Azure Artifacts","s":"Azure DevOps package feeds for NuGet, npm, Maven, Python, Cargo and Universal Packages.","hp":"Use with Azure DevOps to publish and consume internal packages","x":"2 GiB free per org, then billed by storage. Upstream sources to public registries; views (@release) for promotion.","p":"T13","code":"az artifacts universal publish --feed my-feed --name tool --version 1.0.0 --path ./dist","v":"flow:Pipeline>Publish package>Feed @local>Promote @release","eq":["aws_codeartifact","gcp_artifact"]},"aws_codeartifact":{"k":"I","cl":"aws","t":"AWS CodeArtifact","s":"Managed artifact repository for npm, PyPI, Maven, NuGet, Swift, Ruby, Cargo and generic packages.","hp":"Use on AWS to host internal packages and proxy public registries","x":"Domains share storage across repos; upstream to public; auth tokens expire (default 12h). Pay per GB stored and requests.","p":"T13","code":"aws codeartifact login --tool npm --domain my-org --repository internal","v":"flow:Build>Repo>Upstream repo>npmjs / PyPI","eq":["az_artifacts","gcp_artifact"]},"t13_devenv":{"k":"I","cl":"multi","t":"Cloud dev environments","s":"Pre-configured, cloud-hosted developer machines or containers created on demand.","hp":"Use for fast onboarding, secure source access and powerful hardware for devs","x":"Defined by images or devcontainer.json; auto-stop to save cost. AWS Cloud9 closed to new customers (Jul 2024).","p":"T13","v":"cmp:Service=Microsoft Dev Box;None (Cloud9 closed);Cloud Workstations|Form=Windows desktop;n/a;Container on VM|IDE=Any (VS/VS Code);VS Code remote;Code OSS/JetBrains|Network=VNet;n/a;Private VPC"},"az_devbox":{"k":"I","cl":"azure","t":"Microsoft Dev Box","s":"Self-service, project-configured Windows dev workstations in the cloud.","hp":"Use for Windows/.NET dev needing full desktops on corporate networks","x":"Dev centers, projects, pools, hibernation, auto-stop. Microsoft is folding Dev Box into Windows 365; closed to new customers from Nov 2025.","p":"T13","v":"tree:Dev center>Project A,Project B;Project A>Pool VS2022,Pool GPU","eq":["gcp_workstations","x_codespaces"]},"gcp_workstations":{"k":"I","cl":"gcp","t":"Cloud Workstations","s":"Managed container-based dev environments on Compute Engine inside your VPC.","hp":"Use for secure browser/IDE dev with no source code on laptops","x":"Workstation configs define image, machine, disks; Code OSS, JetBrains, local VS Code via SSH; idle timeouts; per-hour + mgmt fee.","p":"T13","code":"gcloud workstations start ws1 --cluster=c1 --config=cfg --region=us-central1","v":"arch:gcp:Developer browser/IDE>Workstation container>Private VPC,Artifact Registry","eq":["az_devbox","x_codespaces"]},"x_codespaces":{"k":"B","cl":"multi","t":"GitHub Codespaces","s":"Cloud dev containers for a GitHub repo, defined by devcontainer.json, opened in VS Code or browser.","hp":"Use for one-click repo onboarding on any machine","x":"Personal accounts get free core-hours/month; orgs pay per core-hour + storage. Prebuilds speed startup.","p":"T13","code":"gh codespace create --repo org/app --machine standardLinux32gb","v":"flow:Repo>devcontainer.json>Codespace VM>VS Code"},"t13_supply":{"k":"A","cl":"multi","t":"Software supply-chain security","s":"Protecting the path from source to running workload: scan, sign, attest, verify.","hp":"Use whenever you ship containers or packages to production","x":"Frameworks: SLSA levels, SBOMs, provenance attestations. Verify at admission time, not just in CI.","p":"T13","v":"flow:Source>Build>Scan>SBOM>Sign>Registry>Verify at deploy"},"t13_imgscan":{"k":"I","cl":"multi","t":"Container image scanning","s":"Detect OS and language package CVEs in images in registries and running workloads.","hp":"Use on every registry; block deploys of critical CVEs","x":"Azure: Defender for Containers on ACR. AWS: ECR basic or Inspector enhanced scanning. GCP: Artifact Analysis. CI: Trivy/Grype.","p":"T13","v":"cmp:Scanner=Defender Containers;Amazon Inspector;Artifact Analysis|Registry=ACR;ECR;Artifact Registry|Continuous=Yes;Enhanced scan;On-demand + auto"},"t13_signing":{"k":"A", us validation; dry-run mode; break-glass.","p":"T13","code":"gcloud container binauthz policy import policy.yaml","v":"flow:Cloud Build>Attestation>Deploy request>Policy check>Allow / deny","eq":["az_notation","aws_signer"]},"t13_sbom":{"k":"I","cl":"multi","t":"SBOM","s":"Software Bill of Materials: machine-readable list of components in an artifact (SPDX or CycloneDX).","hp":"Use to answer 'are we affected?' fast when a new CVE drops","x":"Generate in CI (syft, docker buildx --sbom, Trivy); export from Inspector or Artifact Analysis; attach to image as attestation.","p":"T13","code":"syft myimage:1.0 -o cyclonedx-json > sbom.json","v":"tree:Image>OS packages,App deps;App deps>log4j 2.17,requests 2.32"},"t14_observability":{"k":"B","cl":"multi","t":"Observability: metrics, logs, traces","s":"Understanding system state from its telemetry: metrics (numbers), logs (events), traces (request paths).","hp":"Start here: you can't operate, debug or set SLOs on what you can't see","x":"Metrics alert, traces locate, logs explain. Correlate via trace IDs. Cost driven by log ingest volume and metric cardinality.","p":"T14","v":"draw:observability"},"t14_monitoring":{"k":"B","cl":"multi","t":"Platform monitoring","s":"Each cloud's built-in service collecting resource metrics, logs, dashboards and alerts.","hp":"Use as the default telemetry backbone for every cloud workload","x":"Platform metrics are free/automatic; agents add guest OS metrics/logs; custom metrics and log ingest are billed.","p":"T14","v":"cmp:Service=Azure Monitor;CloudWatch;Cloud Monitoring|Logs=Log Analytics;CloudWatch Logs;Cloud Logging|APM=App Insights;Application Signals;Cloud Trace|Agent=Azure Monitor Agent;CloudWatch agent;Ops Agent|Query=KQL;Logs Insights QL;SQL / PromQL"},"az_monitor":{"k":"B","cl":"azure","t":"Azure Monitor","s":"Azure's unified platform for metrics, logs, traces, alerts, workbooks and dashboards.","hp":"Use for all Azure resource and app telemetry, alerts and dashboards","x":"Platform metrics kept 93 days free. Azure Monitor Agent + data collection rules (legacy MMA retired Aug 2024). Pay per GB ingested.","p":"T14","code":"az monitor metrics list --resource <id> --metric 'Percentage CPU' --interval PT5M","v":"hub:Azure Monitor|Metrics,Log Analytics,App Insights,Alerts,Workbooks,Managed Prometheus","eq":["aws_cloudwatch","gcp_monitoring"]},"aws_cloudwatch":{"k":"B","cl":"aws","t":"Amazon CloudWatch","s":"AWS monitoring for metrics, logs, alarms, dashboards, APM, synthetics and RUM.","hp":"Use for all AWS resource metrics, logs and alarms","x":"Basic metrics free (5-min EC2); detailed 1-min and custom metrics billed. CloudWatch agent for OS metrics/logs. Cross-account observability.","p":"T14","code":"aws cloudwatch get-metric-statistics --namespace AWS/EC2 --metric-name CPUUtilization ...","v":"hub:CloudWatch|Metrics,Logs,Alarms,Dashboards,Application Signals,Synthetics,RUM","eq":["az_monitor","gcp_monitoring"]},"gcp_monitoring":{"k":"B","cl":"gcp","t":"Cloud Monitoring","s":"Google Cloud Observability service for metrics, dashboards, uptime checks, SLOs and alerting.","hp":"Use for GCP and GKE metrics, dashboards and alert policies","x":"Google Cloud metrics free; custom/Prometheus metrics billed per sample/MiB. PromQL supported; MQL deprecated. Metrics scopes span projects.","p":"T14","code":"gcloud monitoring dashboards create --config-from-file=dash.json","v":"hub:Cloud Monitoring|Metrics,Dashboards,Uptime checks,SLOs,Alerting","eq":["az_monitor","aws_cloudwatch"]},"t14_logs":{"k":"B","cl":"multi","t":"Logs & log analytics","s":"Central collection, retention and querying of application, platform and audit logs.","hp":"Use to debug incidents, investigate security events and build log-based metrics","x":"Use structured JSON logs. Biggest observability cost: filter at source, use cheaper tiers for verbose logs, set retention per table/bucket.","p":"T14","v":"cmp:Store=Log Analytics;CloudWatch Logs;Cloud Logging|Query=KQL;Logs Insights;Logging uring incidents","x":"Billed per GB scanned; field discovery for JSON logs; saved queries; pattern analysis and query generation in natural language.","p":"T14","code":"aws logs start-query --log-group-name /aws/lambda/fn --start-time 1730000000 --end-time 1730003600 ...","v":"flow:fields>filter>stats by bin(5m)>sort"},"gcp_logging":{"k":"B","cl":"gcp","t":"Cloud Logging","s":"Managed log ingestion, storage, routing and querying for GCP, GKE and apps.","hp":"Use for all GCP logs; route to BigQuery, Storage or Pub/Sub as needed","x":"Log Router sinks; _Required bucket (400 days, free) and _Default (30 days). First 50 GiB/project/month free; exclusion filters cut cost.","p":"T14","code":"gcloud logging read 'severity>=ERROR AND resource.type=cloud_run_revision' --limit=20","v":"fan:Log Router|_Default bucket,_Required bucket,BigQuery sink,Pub/Sub sink,GCS sink","eq":["az_loganalytics","aws_cwlogs"]},"gcp_loganalytics":{"k":"I","cl":"gcp","t":"Log Analytics (Cloud Logging)","s":"SQL analytics over upgraded log buckets, optionally linked to BigQuery datasets.","hp":"Use when you need SQL joins/aggregations over logs or to combine with BigQuery data","x":"Upgrade bucket once; no extra ingest copy. Linked dataset queries billed as BigQuery. Charts and saved queries.","p":"T14","code":"gcloud logging buckets update _Default --location=global --enable-analytics","v":"flow:Log bucket>Upgrade>SQL query>BigQuery linked dataset"},"gcp_errorreporting":{"k":"I","cl":"gcp","t":"Error Reporting","s":"Groups and counts application exceptions from Cloud Logging and notifies on new errors.","hp":"Use to spot new crash types in Cloud Run, GKE, Functions apps","x":"Automatic for supported runtimes logging stack traces; no extra charge beyond logging.","p":"T14","v":"flow:Stack trace log>Group>Count>Notify"},"t14_apm":{"k":"I","cl":"multi","t":"APM & distributed tracing","s":"Tracking requests across services: latency, errors, dependencies and code hotspots.","hp":"Use for microservices/ ument>Golden signals>Service map>SLOs"},"gcp_trace":{"k":"I","cl":"gcp","t":"Cloud Trace","s":"Distributed tracing for GCP apps with latency analysis and trace explorer.","hp":"Use on Cloud Run, GKE and App Engine to inspect request latency","x":"Accepts OTLP via the Telemetry API (telemetry.googleapis.com). Automatic for some services (Cloud Run, App Engine). Spans billed after free quota.","p":"T14","v":"arch:gcp:Cloud Run>OTel SDK>Cloud Trace>Trace explorer","eq":["az_appinsights","aws_xray"]},"gcp_profiler":{"k":"A","cl":"gcp","t":"Cloud Profiler","s":"Low-overhead continuous CPU and heap profiling for production apps.","hp":"Use to find which functions burn CPU or memory in production","x":"Free; agents for Java, Go, Node.js, Python; flame graphs compared across versions.","p":"T14","v":"stack:main,handler,json.Marshal,alloc|0"},"x_otel":{"k":"I","cl":"multi","t":"OpenTelemetry","s":"CNCF vendor-neutral standard (APIs, SDKs, Collector, OTLP) for traces, metrics and logs.","hp":"Use to instrument once and send telemetry to any cloud or vendor backend","x":"Collector pipelines: receivers>processors>exporters. Auto-instrumentation for Java, .NET, Python, Node. All three clouds now prefer OTel.","p":"T14","code":"OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4317 opentelemetry-instrument python app.py","v":"arch:multi:App SDK>OTel Collector>Azure Monitor,CloudWatch,Cloud Monitoring"},"az_otel_distro":{"k":"I","cl":"azure","t":"Azure Monitor OpenTelemetry Distro","s":"Microsoft-supported OTel packages exporting traces, metrics and logs to Application Insights.","hp":"Use for new Azure app instrumentation instead of classic App Insights SDKs","x":".NET, Java, Node.js, Python; one-call setup; also OTLP ingestion to Azure Monitor (preview).","p":"T14","code":"pip install azure-monitor-opentelemetry  # configure_azure_monitor()","v":"flow:App>Azure Monitor distro>App Insights","eq":["aws_adot","gcp_otel"]},"aws_adot":{"k":"I","cl":"aws","t":"AWS Distro for OpenTelemetry" aged nodes using patch baselines and policies.","hp":"Use on AWS for compliant, scheduled patching across accounts/regions","x":"Patch policies via Quick Setup; baselines with approval delays; compliance reported to Security Hub/Config.","p":"T14","code":"aws ssm send-command --document-name AWS-RunPatchBaseline --targets Key=tag:Env,Values=prod ...","v":"flow:Baseline>Scan>Maintenance window>Install>Compliance"},"aws_sessionmgr":{"k":"B","cl":"aws","t":"SSM Session Manager","s":"Browser/CLI shell and port forwarding to instances via IAM, no SSH keys or open ports.","hp":"Use instead of bastion hosts and inbound SSH/RDP","x":"Sessions logged to S3/CloudWatch; works in private subnets via VPC endpoints; port forwarding to RDS.","p":"T14","code":"aws ssm start-session --target i-0123456789abcdef0","v":"seq:Engineer,IAM,SSM,Instance agent|1>2:authorize|1>3:start-session|3>4:open channel|4>1:shell stream"},"aws_runcommand":{"k":"I","cl":"aws","t":"SSM Run Command","s":"Run documents/scripts across many managed nodes with rate and error controls.","hp":"Use for ad-hoc fleet-wide commands without logging into hosts","x":"Targets by tag or resource group; concurrency/error thresholds; output to S3/CloudWatch.","p":"T14","code":"aws ssm send-command --document-name AWS-RunShellScript --targets Key=tag:App,Values=web ...","v":"fan:Run Command|web-1,web-2,web-3,web-4"},"gcp_vmmanager":{"k":"I","cl":"gcp","t":"VM Manager (OS Config)","s":"Compute Engine tools for OS patch jobs, OS inventory and OS policies via the OS Config agent.","hp":"Use on GCP to patch and configure VM fleets","x":"Patch deployments with schedules and rollout zones; OS policies enforce packages/files; access via IAP + OS Login.","p":"T14","code":"gcloud compute os-config patch-jobs execute --instance-filter-all --display-name=monthly","v":"flow:OS Config agent>Inventory>Patch job>Report","eq":["az_automation","aws_ssm"]},"t14_health":{"k":"B","cl":"multi","t":"Cloud service health & incidents","s":"Provid
