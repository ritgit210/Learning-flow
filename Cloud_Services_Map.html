ch template;Instance template|Policy=Autoscale rules;Target tracking;Autoscaler policy|Healing=App health ext;ELB health check;Autohealing","p":"T3"},"az_vmss":{"k":"I","cl":"azure","t":"Azure Virtual Machine Scale Sets","f":"VMSS","s":"Managed groups of VMs that scale in/out and spread across zones and fault domains.","hp":"Scale web tiers, AKS node pools and batch workers on Azure.","x":"Flexible orchestration is recommended for new sets; Uniform still powers some services. Autoscale via Azure Monitor rules.","code":"az vmss create -g rg -n web --image Ubuntu2204 --instance-count 2 --orchestration-mode Flexible","v":"arch:azure:Load Balancer>VMSS zone1,VMSS zone2,VMSS zone3","eq":["aws_asg","gcp_mig"],"p":"T3"},"az_vmss_flex":{"k":"A","cl":"azure","t":"VMSS Flexible orchestration","s":"Scale-set mode where instances are standard VMs you can mix sizes and manage individually.","hp":"High availability at scale with mixed sizes and Spot/regular mix.","x":"Supports Spot priority mix and up to 1000 VMs. Uniform mode uses identical instances with the instance model.","v":"table:Mode,Mix sizes,Use|Flexible,Yes,New workloads|Uniform,No,Identical fleets","p":"T3"},"aws_asg":{"k":"I","cl":"aws","t":"EC2 Auto Scaling groups","f":"ASG","s":"Keeps a desired number of EC2 instances healthy and scales them with policies.","hp":"Run stateless fleets behind an ALB that grow and shrink with load.","x":"Target tracking, step, scheduled and predictive scaling. Mixed instances + Spot. Warm pools cut boot time. Instance refresh rolls updates.","code":"aws autoscaling update-auto-scaling-group --auto-scaling-group-name web --desired-capacity 4","v":"draw:autoscale","eq":["az_vmss","gcp_mig"],"p":"T3"},"aws_launchtemplate":{"k":"I","cl":"aws","t":"EC2 launch templates","s":"Versioned launch spec (AMI, type, SG, user data, IAM role) used by ASGs and EC2 Fleet.","hp":"Define exactly how instances boot; roll new versions safely.","x":"Launch configurations are legacy (new accounts can't create them since 2024). Use $Latest or pinned versions.","v":"flow:AMI + type + user data>Template v3>ASG instance refresh","p":"T3"},"gcp_mig":{"k":"I","cl":"gcp","t":"Managed instance groups","f":"MIG","s":"Groups of identical Compute Engine VMs from an instance template with autoscaling and autohealing.","hp":"Scalable, self-healing backends for Cloud Load Balancing.","x":"Zonal or regional (multi-zone). Autoscale on CPU, LB utilisation, metrics or schedules. Rolling and canary updates.","code":"gcloud compute instance-groups managed create web --template=tpl --size=2 --region=us-central1","v":"arch:gcp:Cloud LB>MIG zone a,MIG zone b,MIG zone c","eq":["az_vmss","aws_asg"],"p":"T3"},"gcp_instancetemplate":{"k":"I","cl":"gcp","t":"Instance templates","s":"Immutable VM config (machine type, image, metadata) that MIGs use to create VMs.","hp":"Standardise VM creation; roll out a new template to update a MIG.","x":"Templates are immutable; create a new one per change. Regional templates are available.","v":"flow:Template v1>Template v2>MIG rolling update","p":"T3"},"t3_pricing":{"k":"B","cl":"multi","t":"Compute pricing models","s":"Pay-as-you-go, commitments for steady use, and spot for interruptible work.","hp":"Cut compute bills 30-90% by matching purchase option to workload shape.","x":"Typical mix: commit for baseline, on-demand for peaks, spot for batch/CI. Rightsize before committing.","v":"draw:pricing","p":"T3"},"t3_spotcat":{"k":"I","cl":"multi","t":"Spot / preemptible capacity","s":"Spare cloud capacity sold at deep discounts that can be reclaimed at short notice.","hp":"Batch, CI runners, stateless workers, training with checkpoints.","x":"Design for interruption: checkpoint, diversify sizes and zones, handle the notice signal. Not for stateful singletons.","v":"cmp:Service=Spot VMs;EC2 Spot;Spot VMs|Discount=Up to 90%;Up to 90%;60-91%|Notice=30 s;2 min;30 s|Signal=Scheduled Events;Metadata/EventBridge;ACPI / metadata","p":"T3"},"az_spot":{"k":"I","cl":"azure","t":"Azure Spot VMs","s":"Azure VMs priced on spare capacity that can be evicted when Azure needs it back.","hp":"Cheap dev/test, batch, render and CI capacity on Azure.","x":"Eviction policy Deallocate or Delete; optional max price. 30-second notice via Scheduled Events. No SLA.","code":"az vm create -g rg -n s1 --image Ubuntu2204 --priority Spot --eviction-policy Delete --max-price -1","v":"bars:Pay-as-you-go=100,Spot (typical)=25","eq":["aws_spot","gcp_spot"],"p":"T3"},"aws_spot":{"k":"I","cl":"aws","t":"EC2 Spot Instances","s":"Unused EC2 capacity at up to 90% off, reclaimed with a two-minute notice.","hp":"Batch, CI, containers and fault-tolerant fleets on AWS.","x":"Use price-capacity-optimized allocation and many instance types. Rebalance recommendations give early warning.","v":"bars:On-Demand=100,Spot (typical)=30","eq":["az_spot","gcp_spot"],"p":"T3"},"gcp_spot":{"k":"I","cl":"gcp","t":"Spot VMs (GCP)","s":"Compute Engine VMs on spare capacity at 60-91% off with no maximum runtime.","hp":"Batch, GKE spot node pools, CI and ML jobs that checkpoint.","x":"Successor to legacy preemptible VMs (which stop after 24 h). 30-second preemption notice. Prices change at most monthly.","code":"gcloud compute instances create s1 --provisioning-model=SPOT --instance-termination-action=DELETE","v":"bars:On-demand=100,Spot (typical)=30","eq":["az_spot","aws_spot"],"p":"T3"},"t3_commit":{"k":"I","cl":"multi","t":"Commitment discounts","s":"Commit to 1 or 3 years of usage or spend in exchange for large discounts.","hp":"Steady 24x7 baseline workloads you know will keep running.","x":"Spend-based plans (savings plans, flexible CUDs) beat resource-locked reservations for flexibility. Commit only after rightsizing.","v":"cmp:Flexible=Compute savings plan;Compute Savings Plan;Flexible CUDs|Resource-locked=Reservations;Reserved Instances;Resource-based CUDs|Automatic=None;None;Sustained use disc.|Term=1 or 3 yr;1 or 3 yr;1 or 3 yr","p":"T3"},"az_vm_reservation":{"k":"I","cl":"azure","t":"Azure Reservations & savings plan for compute","s":"1- or 3-year commitments on specific VM sizes (reservations) or an hourly spend (savings plan).","hp":"Lower the cost of always-on Azure VMs, App Service and more.","x":"Reservations: deepest discount, size-flexible within a family. Savings plan: applies across VM series and regions.","v":"bars:Pay-as-you-go=100,Savings plan 3yr=50,Reservation 3yr=40","eq":["aws_ec2_savingsplans","gcp_gce_cud"],"p":"T3"},"aws_ec2_savingsplans":{"k":"I","cl":"aws","t":"Savings Plans & Reserved Instances","s":"Commit to $/hour of compute (Savings Plans) or specific instances (RIs) for 1 or 3 years.","hp":"Lower cost for steady EC2, Fargate and Lambda usage.","x":"Compute Savings Plans also cover Fargate and Lambda. EC2 Instance Savings Plans give more discount but lock the family/region.","v":"bars:On-Demand=100,Compute SP 3yr=50,EC2 Instance SP 3yr=40","eq":["az_vm_reservation","gcp_gce_cud"],"p":"T3"},"gcp_gce_cud":{"k":"I","cl":"gcp","t":"Committed use discounts","s":"1- or 3-year commitments to resources (vCPU/RAM/GPU) or to spend (flexible CUDs).","hp":"Lower cost for steady Compute Engine, GKE and Cloud Run usage.","x":"Sustained use discounts apply automatically to N1/N2-type VMs running much of the month. Flexible CUDs span series and regions.","v":"bars:On-demand=100,Flex CUD 3yr=54,Resource CUD 3yr=45","eq":["az_vm_reservation","aws_ec2_savingsplans"],"p":"T3"},"t3_paas":{"k":"B","cl":"multi","t":"PaaS web hosting","s":"Managed platforms that run your web app code or container; the provider runs servers and OS.","hp":"Ship web apps and APIs fast without managing VMs.","x":"Less control than VMs/K8s; runtime and scaling limits per plan. For new container apps compare with Cloud Run / Container Apps.","v":"cmp:Service=App Service;Elastic Beanstalk;App Engine|Simple VPS=App Service (Basic);Lightsail;Compute Engine e2|Containers=Yes;Yes (Docker);Flexible env|Staging=Deployment slots;Env swap (CNAME);Traffic splitting","p":"T3"},"az_appservice":{"k":"B","cl":"azure","t":"Azure App Service","s":"Fully managed hosting for web apps, APIs and containers (.NET, Java, Node, Python, PHP).","hp":"Default home for web apps and APIs on Azure with built-in auth, TLS and CI/CD.","x":"Runs on an App Service plan (Free to Premium v3, Isolated v2 = ASE). Easy Auth, VNet integration, autoscale.","code":"az webapp up -n myapp --runtime PYTHON:3.12 --sku B1","v":"arch:azure:Users>App Service,Slots>SQL DB,Key Vault","eq":["aws_beanstalk","gcp_appengine"],"p":"T3"},"az_appservice_plan":{"k":"I","cl":"azure","t":"App Service plans","s":"The VM capacity (tier, size, instance count) that one or more web apps share.","hp":"Control cost and scale for a group of apps.","x":"Apps in one plan share CPU/RAM. Free/Shared for tests; Basic no autoscale; Standard+ autoscale + slots; Isolated for private ASE.","v":"tiers:Free,Basic,Standard,Premium v3,Isolated v2","p":"T3"},"az_appservice_slots":{"k":"I","cl":"azure","t":"Deployment slots","s":"Live staging copies of an app with their own hostname that you can swap into production.","hp":"Zero-downtime releases, warm-up before swap and instant rollback.","x":"Standard+ tiers (Standard 5 slots, Premium 20). Slot-sticky settings stay put. Swap with preview; route % of traffic for testing.","code":"az webapp deployment slot swap -g rg -n myapp --slot staging --target-slot production","v":"draw:bluegreen","p":"T3"},"aws_beanstalk":{"k":"I","cl":"aws","t":"AWS Elastic Beanstalk","s":"Upload code and Beanstalk provisions EC2, Auto Scaling, load balancer and monitoring for you.","hp":"Quick PaaS-style deploys on AWS while keeping access to the EC2 underneath.","x":"No extra charge beyond resources. Platforms for Java, .NET, Node, Python, Go, Docker. Blue/green via environment URL swap.","code":"eb init -p python-3.12 app && eb create prod-env","v":"stack:Your code,Beanstalk env,ALB + ASG,EC2|2","eq":["az_appservice","gcp_appengine"],"p":"T3"},"aws_lightsail":{"k":"B","cl":"aws","t":"Amazon Lightsail","s":"Simple VPS, containers, databases and load balancers at fixed monthly bundle prices.","hp":"Small sites, WordPress, prototypes, learning; predictable bills.","x":"Bundles include VM, SSD and data transfer. Limited networking/scaling; peer to a VPC to use other AWS services.","v":"stack:App (WordPress),Lightsail instance,Bundle: SSD + transfer|1","eq":["az_appservice","gcp_gce"],"p":"T3"},"gcp_appengine":{"k":"I","cl":"gcp","t":"App Engine","s":"Google's original PaaS: Standard (sandboxed, scale to zero) and Flexible (Docker on VMs) environments.","hp":"Existing App Engine apps; simple scale-to-zero web apps.","x":"Google recommends Cloud Run for new apps. Versions + traffic splitting. One App Engine app per project, region fixed.","code":"gcloud app deploy app.yaml","v":"table:Env,Scale to 0,Runtime|Standard,1,Sandboxed|Flexible,No,Docker on VMs","eq":["az_appservice","aws_beanstalk"],"p":"T3"},"t3_serverless":{"k":"B","cl":"multi","t":"Serverless functions (FaaS)","s":"Run small functions on events or HTTP; the platform scales instances from zero and bills per use.","hp":"Event glue, APIs with spiky traffic, file/queue processing, cron jobs.","x":"Time limits, cold starts, per-invocation billing that gets pricey at sustained high load. Keep functions small and stateless.","v":"cmp:Service=Azure Functions;AWS Lambda;Cloud Run functions|Max run=Unbounded (Flex);15 min;60 min (HTTP)|Max memory=4 GB (Flex);10 GB;32 GiB|Scale-to-zero=Yes;Yes;Yes|Cold-start fix=Always ready;SnapStart / PC;Min instances","p":"T3"},"t3_coldstart":{"k":"I","cl":"multi","t":"Cold starts","s":"Extra latency when a new function instance must boot runtime and code before handling a request.","hp":"Understand p99 latency spikes on serverless and how to remove them.","x":"Worse for JVM/.NET, big packages, VNet attach. Fixes: provisioned concurrency, SnapStart, always-ready/min instances, smaller deps.","v":"seq:Client,Platform,New instance|1>2:request|2>3:boot runtime + init|3>2:ready|2>1:response (slow)","p":"T3"},"az_functions":{"k":"B","cl":"azure","t":"Azure Functions","s":"Event-driven serverless code on Azure with triggers and bindings for HTTP, queues, timers, Cosmos DB and more.","hp":"Glue Azure services together or build serverless APIs and processors.","x":"Plans: Flex Consumption (recommended), Consumption, Premium, Dedicated. Linux Consumption is legacy (retiring 2028). Durable Functions for workflows.","code":"func azure functionapp publish myfuncapp","v":"draw:serverless","eq":["aws_lambda","gcp_functions"],"p":"T3"},"az_func_flex":{"k":"I","cl":"azure","t":"Flex Consumption plan","s":"Newest Functions hosting plan: per-function scaling, VNet integration and optional always-ready instances.","hp":"Serverless functions that need private networking and fewer cold starts.","x":"Linux only. Choose instance memory (512 MB/2 GB/4 GB). Scale up to 1000 instances. Pay per execution plus always-ready baseline.","code":"az functionapp create -g rg -n f1 -s st1 --flexconsumption-location eastus --runtime python","v":"table:Plan,VNet,Scale to 0|Flex Consumption,1,Yes|Consumption,No,Yes|Premium,1,No|Dedicated,1,No","p":"T3"},"aws_lambda":{"k":"B","cl":"aws","t":"AWS Lambda","s":"Run code on 200+ AWS event sources or HTTP with automatic scaling and per-ms billing.","hp":"Default serverless compute on AWS for APIs, ETL, automation and event handlers.","x":"15-min max, up to 10 GB memory and /tmp, zip or container image (10 GB). Concurrency quotas per region. arm64 is cheaper.","code":"aws lambda invoke --function-name my-fn out.json","v":"draw:serverless","eq":["az_functions","gcp_functions"],"p":"T3"},"aws_lambda_layers":{"k":"I","cl":"aws","t":"Lambda layers","s":"Zip archives of libraries or runtimes shared across functions and mounted at /opt.","hp":"Share dependencies (e.g. numpy, SDKs, extensions) between functions.","x":"Up to 5 layers; 250 MB unzipped total with code. Not used with container-image functions. Versioned and immutable.","code":"aws lambda publish-layer-version --layer-name deps --zip-file fileb://deps.zip","v":"stack:Function code,Layer: deps,Layer: extension,Runtime|1","p":"T3"},"aws_lambda_snapstart":{"k":"A","cl":"aws","t":"Lambda SnapStart","s":"Snapshots an initialised function's memory and resumes from it to cut cold-start time.","hp":"Slash cold starts for Java, Python and .NET functions.","x":"Works on published versions/aliases. Make init code snapshot-safe (unique IDs, connections). Caching/restore fees for Python/.NET.","v":"bars:Cold start no SnapStart=6,With SnapStart=1","p":"T3"},"aws_lambda_url":{"k":"I","cl":"aws","t":"Lambda function URLs","s":"Built-in dedicated HTTPS endpoint for a function, no API Gateway needed.","hp":"Simple webhooks, internal APIs or streamed LLM responses.","x":"Auth = AWS_IAM or NONE. Supports response streaming. No usage plans, WAF or custom domains directly (front with CloudFront).","code":"aws lambda create-function-url-config --function-name f --auth-type AWS_IAM","v":"flow:HTTPS client>Function URL>Lambda","p":"T3"},"aws_lambda_edge":{"k":"A","cl":"aws","t":"Lambda@Edge & CloudFront Functions","s":"Run code at CloudFront locations to modify requests/responses near users.","hp":"Header rewrites, auth checks, redirects, A/B routing at the edge.","x":"CloudFront Functions: JS, sub-ms, cheapest. Lambda@Edge: Node/Python, network access, longer runtime, deployed from us-east-1.","v":"draw:cdn","p":"T3"},"gcp_functions":{"k":"B","cl":"gcp","t":"Cloud Run functions","f":"Formerly Cloud Functions (2nd gen)","s":"Function-as-a-service on GCP, built and run on Cloud Run with Eventarc triggers.","hp":"HTTP endpoints and event handlers (Pub/Sub, Storage, Firestore) on GCP.","x":"Renamed 2024; deploys as a Cloud Run service. Concurrency up to 1000 per instance, min instances for warm starts, GPUs possible.","code":"gcloud functions deploy fn --gen2 --runtime=python312 --trigger-http --region=us-central1","v":"draw:serverless","eq":["az_functions","aws_lambda"],"p":"T3"},"t3_batch":{"k":"I","cl":"multi","t":"Batch & HPC","s":"Queue many jobs and let a service provision VMs to run them, then tear them down.","hp":"Rendering, simulations, genomics, ETL, ML pre-processing at scale.","x":"You pay only for the VMs. Combine with Spot and checkpoints. Tightly-coupled MPI needs HPC VM families and fast interconnect.","v":"cmp:Batch service=Azure Batch;AWS Batch;Batch|HPC Slurm=CycleCloud;ParallelCluster/PCS;Cluster Toolkit|Spot=Yes;Yes;Yes|Containers=Yes;Yes;Yes","p":"T3"},"az_batch":{"k":"I","cl":"azure","t":"Azure Batch","s":"Runs large-scale parallel and HPC jobs on managed pools of Azure VMs.","hp":"Render farms, Monte Carlo, media transcoding on Azure.","x":"Pools, jobs, tasks; autoscale formulas; Spot VMs (low-priority retired). No charge for Batch itself.","code":"az batch job create --id job1 --pool-id pool1","v":"flow:Submit job>Pool scales VMs>Run tasks>Write output>Pool shrinks","eq":["aws_batch","gcp_batch"],"p":"T3"},"az_cyclecloud":{"k":"A","cl":"azure","t":"Azure CycleCloud","s":"Orchestrates traditional HPC clusters (Slurm, PBS, LSF, Grid Engine) on Azure VMs.","hp":"Lift on-prem HPC schedulers to Azure with autoscaling nodes.","x":"CycleCloud Workspace for Slurm gives a marketplace deploy. Use with HB/HC/ND InfiniBand VMs.","v":"arch:azure:Login node>Slurm scheduler>HPC VM nodes>Azure Managed Lustre","p":"T3"},"aws_batch":{"k":"I","cl":"aws","t":"AWS Batch","s":"Fully managed batch scheduling on EC2, Spot, Fargate or EKS compute environments.","hp":"Run containerised jobs, array jobs and ML workloads on AWS.","x":"Job queues + compute environments + job definitions. Array jobs, dependencies, fair-share scheduling. No extra charge.","code":"aws batch submit-job --job-name j1 --job-queue q --job-definition jd","v":"flow:Submit job>Job queue>Compute env (Spot)>Container runs","eq":["az_batch","gcp_batch"],"p":"T3"},"aws_pcluster":{"k":"A","cl":"aws","t":"AWS ParallelCluster","s":"Open-source tool that builds and manages Slurm-based HPC clusters on AWS.","hp":"Self-managed HPC clusters with EFA and FSx for Lustre.","x":"You operate the head node. AWS Parallel Computing Service (PCS) is the fully managed Slurm alternative (2024).","code":"pcluster create-cluster --cluster-name hpc --cluster-configuration cluster.yaml","v":"arch:aws:Head node>Slurm>Compute fleet (EFA)>FSx Lustre","p":"T3"},"aws_pcs":{"k":"A","cl":"aws","t":"AWS Parallel Computing Service","s":"Managed service that runs Slurm clusters for you on EC2.","hp":"Slurm HPC without operating scheduler infrastructure.","x":"Launched Aug 2024. Managed Slurm controller; compute node groups from launch templates.","v":"stack:HPC jobs,Slurm controller,EC2 node groups|2","p":"T3"},"gcp_batch":{"k":"I","cl":"gcp","t":"Google Cloud Batch","s":"Managed batch job service that provisions Compute Engine VMs (incl. GPUs, Spot) to run scripts or containers.","hp":"Simulations, genomics and data jobs on GCP.","x":"Pay only for VMs. Task groups and parallelism; logs to Cloud Logging. Workflows can orchestrate pipelines.","code":"gcloud batch jobs submit job1 --location=us-central1 --config=job.json","v":"flow:Job config>Batch>Spot VMs>Tasks run>Cloud Logging","eq":["az_batch","aws_batch"],"p":"T3"},"gcp_clustertoolkit":{"k":"A","cl":"gcp","t":"Cluster Toolkit","f":"Formerly HPC Toolkit","s":"Open-source blueprints to deploy Slurm HPC and AI clusters on Google Cloud.","hp":"Repeatable HPC/AI training clusters with A3/A4 GPUs or H3 CPUs.","x":"Blueprint YAML -> Terraform/Packer. Integrates Filestore/Managed Lustre. You operate the cluster.","code":"gcluster deploy hpc-slurm.yaml","v":"flow:Blueprint>gcluster>Terraform>Slurm cluster","p":"T3"},"t3_static":{"k":"B","cl":"multi","t":"Static & frontend hosting","s":"Host SPAs and static sites on a global CDN with Git-driven builds and preview URLs.","hp":"Deploy React/Vue/Next frontends with HTTPS and previews per PR.","x":"Static assets are cheap; SSR frameworks may need a compute backend. Alternative: object storage + CDN.","v":"cmp:Service=Static Web Apps;Amplify Hosting;Firebase Hosting|SSR=Hybrid Next.js;Next.js SSR;App Hosting|PR previews=Yes;Branch deploys;Preview channels|API backend=Functions;Lambda;Cloud Run","p":"T3"},"az_swa":{"k":"B","cl":"azure","t":"Azure Static Web Apps","s":"Hosts static frontends globally with GitHub/Azure DevOps builds, auth and an integrated Functions API.","hp":"Deploy React/Angular/Vue/Blazor apps with PR staging environments.","x":"Free and Standard plans. Managed or bring-your-own Functions API, custom domains, built-in auth providers.","code":"swa deploy ./dist --env production","v":"arch:azure:GitHub>Actions build>SWA edge>Managed Functions","eq":["aws_amplify","gcp_firebase"],"p":"T3"},"aws_amplify":{"k":"B","cl":"aws","t":"AWS Amplify Hosting","s":"Git-based CI/CD and hosting for static and SSR web apps (Next.js, Nuxt) on AWS.","hp":"Full-stack/frontend deploys with branch environments on AWS.","x":"Build minutes + storage + transfer billing. Uses CloudFront. Amplify Gen 2 defines backends in TypeScript (CDK).","code":"npx ampx sandbox","v":"arch:aws:Git push>Amplify build>CloudFront>SSR compute","eq":["az_swa","gcp_firebase"],"p":"T3"},"gcp_firebase":{"k":"B","cl":"gcp","t":"Firebase Hosting","s":"Fast global CDN hosting for static content and SPAs with one-command deploys.","hp":"Ship frontends and mobile web apps with preview channels.","x":"Free Spark tier quotas. Rewrites to Cloud Run/functions for dynamic routes. Preview channels per PR via GitHub Action.","code":"firebase deploy --only hosting","v":"draw:cdn","eq":["az_swa","aws_amplify"],"p":"T3"},"gcp_firebase_apphosting":{"k":"I","cl":"gcp","t":"Firebase App Hosting","s":"Git-connected hosting for SSR frameworks (Next.js, Angular) that builds and runs on Cloud Run + Cloud CDN.","hp":"Full-stack Next.js/Angular apps on Google Cloud without wiring Cloud Run yourself.","x":"GA in 2025. Needs Blaze (pay-as-you-go) plan. Builds via Cloud Build; secrets via Secret Manager.","v":"flow:GitHub push>Cloud Build>Cloud Run>Cloud CDN","p":"T3"},"t3_choose":{"k":"B","cl":"multi","t":"Choosing compute","s":"Decision guide: VMs vs containers vs serverless based on control, scale pattern and ops effort.","hp":"Pick the least-ops option that still meets runtime, latency and cost needs.","x":"Default: serverless containers/functions for new apps; K8s for many services/teams; VMs for legacy or special hardware.","v":"table:Need,VM,Container,Serverless|OS control,1,Partial,No|Ops effort,High,Medium,1|Scale to zero,No,Some,1|Long jobs,1,1,Limited|Steady high load,1,1,Costly","p":"T3"},"t3_servicemodels":{"k":"B","cl":"multi","t":"IaaS vs PaaS vs FaaS","s":"The service models: how much of the stack you manage vs the provider.","hp":"Explain responsibility splits when choosing a hosting model.","x":"Moving up the stack trades control for less ops. Containers (CaaS) sit between IaaS and PaaS.","v":"stack:Function code,App runtime,Containers,OS,Virtualisation,Hardware|2","p":"T3"},"t4_containers":{"k":"B","cl":"multi","t":"Container basics","s":"Package an app with its dependencies into a portable image that runs the same everywhere.","hp":"Consistent builds from laptop to prod; foundation for K8s and serverless containers.","x":"Containers share the host kernel (lighter than VMs, weaker isolation). Keep images small, non-root, and scanned.","v":"flow:Dockerfile>docker build>Image>Push registry>Pull + run","p":"T4"},"t4_image":{"k":"B","cl":"multi","t":"Container images & layers","s":"Read-only, layered filesystem snapshot plus metadata, addressed by tag or immutable digest.","hp":"Understand caching, size and why to deploy by digest.","x":"Layers are cached and shared. Tags are mutable; pin @sha256 digests in prod. Multi-arch images cover amd64 + arm64.","code":"docker buildx build --platform linux/amd64,linux/arm64 -t repo/app:1.0 --push .","v":"stack:App code,Dependencies,Runtime,Base OS layer|0","p":"T4"},"t4_dockerfile":{"k":"B","cl":"multi","t":"Dockerfile","s":"Text recipe of instructions (FROM, COPY, RUN, CMD) used to build an image.","hp":"Write reproducible, small, secure images.","x":"Use multi-stage builds, slim/distroless bases, .dockerignore, pinned versions, USER non-root. Order steps for cache hits.","code":"docker build -t app:1.0 .","v":"flow:FROM base>COPY deps>RUN install>COPY src>CMD start","p":"T4"},"t4_oci":{"k":"I","cl":"multi","t":"OCI standards","s":"Open Container Initiative specs for image format, runtime and distribution.","hp":"Know any OCI image runs on Docker, containerd, Podman and every cloud.","x":"Registries also store OCI artifacts: Helm charts, SBOMs, signatures (Notation, Cosign). Docker is one OCI-compatible tool.","v":"hub:OCI|Image spec,Runtime spec,Distribution spec,Artifacts","p":"T4"},"t4_registry":{"k":"B","cl":"multi","t":"Container registries","s":"Private repositories that store, scan and serve container images and OCI artifacts.","hp":"Keep images close to your clusters with IAM, scanning and replication.","x":"Use the registry in the same region as compute. Enable vulnerability scanning and lifecycle/cleanup policies.","v":"cmp:Service=Container Registry;ECR;Artifact Registry|Scanning=Defender;Inspector;Artifact Analysis|Replication=Geo-rep (Premium);Cross-region rules;Multi-region repos|Other formats=OCI artifacts;OCI artifacts;Maven/npm/PyPI/apt","p":"T4"},"az_acr":{"k":"B","cl":"azure","t":"Azure Container Registry","f":"ACR","s":"Managed private OCI registry for container images, Helm charts and artifacts.","hp":"Store images for AKS, Container Apps and App Service on Azure.","x":"Tiers Basic/Standard/Premium; Premium adds geo-replication, private endpoints. Pull via managed identity (AcrPull).","code":"az acr build -r myacr -t app:1.0 .","v":"arch:azure:CI build>ACR,Geo-replica>AKS,Container Apps","eq":["aws_ecr","gcp_artifact"],"p":"T4"},"az_acr_tasks":{"k":"I","cl":"azure","t":"ACR Tasks","s":"Cloud builds of container images inside ACR, triggered by commits, base-image updates or schedules.","hp":"Build images without a Docker daemon and auto-rebuild on base-image patches.","x":"Multi-step YAML tasks; supports Linux/Windows and arm64. Billed per build-second.","code":"az acr task create -r myacr -n build -c https://github.com/org/app.git -f Dockerfile","v":"flow:Git commit / base update>ACR Task build>Push image","p":"T4"},"aws_ecr":{"k":"B","cl":"aws","t":"Amazon ECR","f":"Elastic Container Registry","s":"Managed private and public OCI registry for container images and artifacts on AWS.","hp":"Store images for ECS, EKS, Lambda container images and App Runner.","x":"IAM-based auth; lifecycle policies; pull-through cache for Docker Hub/GHCR; cross-region/account replication.","code":"aws ecr get-login-password | docker login --username AWS --password-stdin 123.dkr.ecr.us-east-1.amazonaws.com","v":"arch:aws:CodeBuild>ECR>ECS,EKS,Lambda","eq":["az_acr","gcp_artifact"],"p":"T4"},"aws_ecr_scanning":{"k":"I","cl":"aws","t":"ECR image scanning","s":"Basic CVE scans or enhanced continuous scanning (via Amazon Inspector) of pushed images.","hp":"Catch vulnerable OS/language packages before deploy.","x":"Enhanced scanning re-scans when new CVEs appear and covers language packages. Findings to Security Hub/EventBridge.","v":"flow:Push image>Inspector scan>Findings>Block deploy","p":"T4"},"gcp_artifact":{"k":"B","cl":"gcp","t":"Artifact Registry","s":"GCP's universal package manager for container images and language/OS packages.","hp":"Store images for GKE/Cloud Run plus npm/Maven/PyPI packages in one place.","x":"Standard, remote (proxy cache) and virtual repos. Container Registry (gcr.io) is shut down; gcr.io now served by Artifact Registry.","code":"gcloud artifacts repositories create app --repository-format=docker --location=us-central1","v":"arch:gcp:Cloud Build>Artifact Registry>GKE,Cloud Run","eq":["az_acr","aws_ecr"],"p":"T4"},"gcp_artifact_analysis":{"k":"I","cl":"gcp","t":"Artifact Analysis","s":"Vulnerability scanning and metadata (SBOM, provenance) for images in Artifact Registry.","hp":"Scan images on push and feed Binary Authorization policies.","x":"On-push and continuous scanning; on-demand scanning in CI. Works with Binary Authorization to block unsigned images.","v":"flow:Push image>Scan>Attestation>Binary Authorization","p":"T4"},"t4_managedk8s":{"k":"I","cl":"multi","t":"Managed Kubernetes","s":"The cloud runs the Kubernetes control plane; you run workloads (and optionally nodes).","hp":"Many microservices, portability, rich ecosystem (Helm, GitOps, operators).","x":"Powerful but complex: upgrades every ~4 months, networking, add-ons. Use auto modes to offload node management.","v":"cmp:Service=AKS;EKS;GKE|Control plane=Free / $0.10 hr;$0.10 hr;$0.10 hr|Hands-off mode=AKS Automatic;EKS Auto Mode;GKE Autopilot|Node autoscale=NAP (Karpenter);Karpenter;NAP / ComputeClass|Pod identity=Entra Workload ID;Pod Identity / IRSA;Workload Identity|Mesh=Istio add-on;VPC Lattice;Cloud Service Mesh","p":"T4"},"az_aks":{"k":"I","cl":"azure","t":"Azure Kubernetes Service","f":"AKS","s":"Managed Kubernetes on Azure with Entra ID integration, node pools on VMSS and many add-ons.","hp":"Run microservices and AI workloads on Kubernetes in Azure.","x":"Free/Standard/Premium tiers (Standard adds SLA; Premium adds LTS). Azure CNI Overlay, KEDA, Istio, Flux add-ons.","code":"az aks create -g rg -n aks1 --tier standard --node-count 3 --enable-oidc-issuer --enable-workload-identity","v":"draw:k8s","eq":["aws_eks","gcp_gke"],"p":"T4"},"az_aks_automatic":{"k":"I","cl":"azure","t":"AKS Automatic","s":"Opinionated AKS mode with production defaults: node autoprovisioning, scaling, security and monitoring preset.","hp":"Get production-ready AKS without tuning node pools and add-ons.","x":"GA in 2025. Uses NAP, KEDA, VPA, managed Prometheus/Grafana, Deployment Safeguards. Less low-level control.","code":"az aks create -g rg -n auto1 --sku automatic","v":"stack:Your workloads,Safeguards + monitoring,Node autoprovisioning,Control plane|3","p":"T4"},"az_aks_nap":{"k":"A","cl":"azure","t":"AKS node autoprovisioning","f":"NAP","s":"Karpenter-based provisioning that picks VM sizes for pending pods automatically.","hp":"Right-size nodes and cut cost without managing many node pools.","x":"Replaces manual node pools + cluster autoscaler for many cases. Configure via NodePool/AKSNodeClass CRDs.","v":"flow:Pending pods>NAP picks VM size>Node joins>Pods scheduled>Consolidate","p":"T4"},"az_aks_istio":{"k":"A","cl":"azure","t":"Istio-based service mesh add-on for AKS","s":"Microsoft-supported managed Istio for mTLS, traffic shifting and telemetry in AKS.","hp":"Add mTLS and canary routing between AKS services.","x":"Revisioned upgrades managed by AKS. Replaces the retiring Open Service Mesh add-on.","code":"az aks mesh enable -g rg -n aks1","v":"arch:azure:Ingress gateway>Svc A + Envoy>Svc B + Envoy","p":"T4"},"az_aks_agc":{"k":"A","cl":"azure","t":"Application Gateway for Containers","s":"Managed L7 load balancer for AKS supporting Kubernetes Gateway API and Ingress.","hp":"Gateway API ingress with traffic splitting and WAF for AKS.","x":"Successor to AGIC for new designs. Also consider the managed NGINX app routing add-on for simple ingress.","v":"arch:azure:Clients>App GW for Containers>AKS services","p":"T4"},"aws_eks":{"k":"I","cl":"aws","t":"Amazon EKS","f":"Elastic Kubernetes Service","s":"Managed Kubernetes on AWS running upstream K8s with managed node groups, Fargate or Auto Mode.","hp":"Kubernetes on AWS with IAM, VPC networking and AWS load balancers.","x":"$0.10/hr per cluster (standard support); $0.60/hr in extended support. VPC CNI gives pods VPC IPs (plan IP space).","code":"eksctl create cluster --name c1 --region us-east-1 --enable-auto-mode","v":"draw:k8s","eq":["az_aks","gcp_gke"],"p":"T4"},"aws_eks_automode":{"k":"I","cl":"aws","t":"EKS Auto Mode","s":"EKS mode where AWS manages nodes, scaling, load balancing, storage and networking add-ons.","hp":"Run EKS without managing node groups, Karpenter or core add-ons.","x":"Launched Dec 2024. Uses Karpenter under the hood, Bottlerocket nodes; extra per-instance management fee.","v":"stack:Your pods,Karpenter + LB + EBS CSI,EC2 nodes,Control plane|3","p":"T4"},"aws_karpenter":{"k":"A","cl":"aws","t":"Karpenter","s":"Open-source node autoscaler that launches right-sized EC2 instances directly for pending pods.","hp":"Fast, cost-efficient node scaling with Spot and many instance types.","x":"NodePools + EC2NodeClass CRDs. Consolidation removes underused nodes. Faster than Cluster Autoscaler on AWS.","code":"kubectl get nodepools","v":"flow:Pending pod>Karpenter>EC2 Fleet API>Node ready>Consolidate|loop","p":"T4"},"aws_eks_podidentity":{"k":"I","cl":"aws","t":"EKS Pod Identity & IRSA","s":"Map Kubernetes service accounts to IAM roles so pods get scoped AWS credentials.","hp":"Pods access S3, DynamoDB, Bedrock without node-wide permissions.","x":"Pod Identity (2023) is simpler: no OIDC trust per cluster. IRSA still widely used. Avoid node instance-role sharing.","code":"aws eks create-pod-identity-association --cluster-name c1 --namespace app --service-account sa --role-arn arn","v":"flow:Pod SA>Pod Identity agent>IAM role creds>AWS API","p":"T4"},"aws_lbc":{"k":"I","cl":"aws","t":"AWS Load Balancer Controller","s":"K8s controller that provisions ALBs for Ingress and NLBs for Services on EKS.","hp":"Expose EKS services through AWS load balancers.","x":"IP target mode routes straight to pods. IngressGroup shares one ALB. Built into EKS Auto Mode.","v":"arch:aws:Clients>ALB>Pods (IP targets)","p":"T4"},"aws_eks_vpclattice":{"k":"A","cl":"aws","t":"Amazon VPC Lattice","s":"Managed application networking for service-to-service traffic across VPCs, accounts, EKS, ECS and Lambda.","hp":"Service connectivity, auth policies and routing without sidecars.","x":"Recommended path off AWS App Mesh (no new customers since Sept 2024, end of support Sept 30 2026). Gateway API controller for EKS.","v":"hub:Lattice service network|EKS svc,ECS svc,Lambda,EC2","p":"T4"},"gcp_gke":{"k":"I","cl":"gcp","t":"Google Kubernetes Engine","f":"GKE","s":"Google's managed Kubernetes with Autopilot or Standard modes and strong autoscaling.","hp":"Kubernetes with the least ops burden; large-scale AI/ML serving and training.","x":"Cluster fee $0.10/hr (free-tier credit covers one zonal/Autopilot cluster). Release channels auto-upgrade. Up to 65k nodes.","code":"gcloud container clusters create-auto c1 --region=us-central1","v":"draw:k8s","eq":["az_aks","aws_eks"],"p":"T4"},"gcp_gke_autopilot":{"k":"I","cl":"gcp","t":"GKE Autopilot","s":"GKE mode where Google manages nodes and you pay for pod resource requests.","hp":"Production K8s without node management; secure defaults.","x":"Default for new clusters. Pod-based billing; some privileged workloads restricted. ComputeClasses pick hardware incl. GPUs.","v":"stack:Your pods,Node mgmt + security,Nodes,Control plane|3","p":"T4"},"gcp_gke_nap":{"k":"A","cl":"gcp","t":"GKE node auto-provisioning & ComputeClasses","s":"Automatically creates node pools sized for pending pods; ComputeClasses define preferred machine types.","hp":"Efficient nodes and fallbacks (e.g. Spot first, then on-demand).","x":"Works with cluster autoscaler in Standard mode. Custom ComputeClasses set priority lists of machine families.","v":"flow:Pending pods>ComputeClass rules>New node pool>Pods run","p":"T4"},"gcp_gke_gateway":{"k":"I","cl":"gcp","t":"GKE Gateway controller","s":"Google's implementation of Kubernetes Gateway API backed by Cloud Load Balancing.","hp":"Multi-team, multi-cluster ingress with traffic splitting.","x":"GatewayClasses for global/regional external and internal LBs; multi-cluster Gateways. Preferred over Ingress for new apps.","v":"arch:gcp:Clients>Cloud LB (Gateway)>HTTPRoute>GKE services","p":"T4"},"gcp_csm":{"k":"A","cl":"gcp","t":"Cloud Service Mesh","s":"Google-managed Istio-based mesh for GKE and VMs (successor to Anthos Service Mesh/Traffic Director).","hp":"mTLS, traffic policies and service-level observability across services.","x":"Managed control plane; Istio or Google Cloud APIs. Can be priced per client endpoint; check pricing for your mode.","v":"arch:gcp:Gateway>Svc A + proxy>Svc B + proxy","p":"T4"},"t4_k8s":{"k":"B","cl":"multi","t":"Kubernetes concepts","s":"Core building blocks of Kubernetes, identical on AKS, EKS, GKE and on-prem.","hp":"Learn once, run on any managed K8s.","x":"Declarative YAML; controllers reconcile desired vs actual state. Manage with kubectl, Helm, GitOps.","v":"tree:Cluster>Namespace,Node;Namespace>Deployment,Service;Deployment>Pod","p":"T4"},"t4_pod":{"k":"B","cl":"multi","t":"Pod","s":"Smallest deployable unit: one or more containers sharing network and storage.","hp":"Understand what K8s schedules and restarts.","x":"Pods are ephemeral; never manage them directly in prod. Set requests/limits and probes on every pod.","code":"kubectl get pods -n app","v":"hub:Pod|App container,Sidecar,Shared volume,Pod IP","p":"T4"},"t4_deployment":{"k":"B","cl":"multi","t":"Deployment","s":"Controller that keeps N replicas of a pod template running and performs rolling updates.","hp":"Run stateless apps with zero-downtime rollouts and rollback.","x":"Uses ReplicaSets. StatefulSet for stable identity/storage; DaemonSet for one pod per node; Job/CronJob for batch.","code":"kubectl rollout undo deployment/web","v":"flow:New image>New ReplicaSet>Scale up new>Scale down old","p":"T4"},"t4_service":{"k":"B","cl":"multi","t":"Service","s":"Stable virtual IP and DNS name that load-balances to a set of pods by label.","hp":"Let pods find each other; expose apps inside or outside the cluster.","x":"Types: ClusterIP (internal), NodePort, LoadBalancer (cloud LB), ExternalName. Headless for StatefulSets.","code":"kubectl expose deployment web --port=80 --type=ClusterIP","v":"draw:lb","p":"T4"},"t4_namespace":{"k":"B","cl":"multi","t":"Namespace","s":"Logical partition of a cluster for names, RBAC, quotas and network policies.","hp":"Separate teams, apps or environments in one cluster.","x":"Not a hard security boundary; combine with RBAC, NetworkPolicy and ResourceQuota. Strict isolation needs separate clusters.","code":"kubectl create namespace team-a","v":"hub:Cluster|team-a,team-b,monitoring,kube-system","p":"T4"},"t4_config":{"k":"B","cl":"multi","t":"ConfigMaps & Secrets","s":"Objects that inject config and sensitive values into pods as env vars or files.","hp":"Separate configuration from images.","x":"Secrets are base64, not encrypted by default; enable KMS encryption or use Secrets Store CSI / External Secrets.","code":"kubectl create secret generic db --from-literal=password=xyz","v":"fan:ConfigMap / Secret|Env vars,Mounted files","p":"T4"},"t4_hpa":{"k":"I","cl":"multi","t":"Horizontal Pod Autoscaler","f":"HPA","s":"Scales the replica count of a Deployment on CPU, memory or custom metrics.","hp":"Handle traffic changes automatically at the pod level.","x":"Needs resource requests and metrics-server. VPA adjusts requests instead. Pods still need node capacity (cluster autoscaler).","code":"kubectl autoscale deployment web --cpu-percent=60 --min=2 --max=20","v":"draw:autoscale","p":"T4"},"t4_keda":{"k":"I","cl":"multi","t":"KEDA","f":"Kubernetes Event-driven Autoscaling","s":"CNCF autoscaler that scales workloads on event sources (queues, streams, Prometheus) including to zero.","hp":"Scale workers on queue length, not CPU.","x":"60+ scalers (SQS, Service Bus, Pub/Sub, Kafka). Managed add-on in AKS; powers Azure Container Apps scaling.","v":"flow:Queue depth>KEDA scaler>HPA>Pods 0..N","p":"T4"},"t4_clusterautoscaler":{"k":"I","cl":"multi","t":"Node autoscaling","s":"Adds or removes nodes when pods can't be scheduled or nodes sit idle.","hp":"Give HPA-scaled pods somewhere to run and cut idle node cost.","x":"Cluster Autoscaler scales node groups; Karpenter/NAP provisions best-fit nodes directly and consolidates.","v":"table:Tool,Model,Clouds|Cluster Autoscaler,Node groups,All|Karpenter,Per-pod fit,AWS + Azure NAP|GKE NAP,Node pools,GCP","p":"T4"},"t4_ingress":{"k":"I","cl":"multi","t":"Ingress & Gateway API","s":"K8s APIs for routing external HTTP(S) traffic to services; Gateway API is the newer, role-oriented successor.","hp":"One entry point with host/path routing, TLS and traffic splitting.","x":"Prefer Gateway API for new work. Community ingress-nginx is being retired (Mar 2026); plan migration.","v":"arch:multi:Clients>Gateway>HTTPRoute>Service A,Service B","p":"T4"},"t4_mesh":{"k":"A","cl":"multi","t":"Service mesh","s":"Proxy layer (sidecar or ambient) adding mTLS, retries, traffic shifting and telemetry between services.","hp":"Zero-trust service traffic and canaries across many microservices.","x":"Istio is the de facto choice; ambient mode removes sidecars. Adds complexity; skip for few services.","v":"draw:zerotrust","p":"T4"},"t4_workloadid":{"k":"I","cl":"multi","t":"Workload identity","s":"Pattern where pods exchange their K8s service-account token for short-lived cloud credentials.","hp":"Remove static cloud keys from clusters.","x":"Built on OIDC federation. Each cloud has its own flavour: Entra Workload ID, EKS Pod Identity/IRSA, GKE Workload Identity.","v":"seq:Pod,K8s OIDC,Cloud IAM,Cloud API|1>2:get SA token|1>3:exchange token|3>1:short-lived creds|1>4:call API","p":"T4"},"t4_serverlesscont":{"k":"B","cl":"multi","t":"Serverless containers","s":"Run container images without managing clusters or servers; the platform scales them.","hp":"Web APIs, workers and jobs in containers with minimal ops.","x":"Less control than K8s (no DaemonSets/CRDs). Often the best default for new containerised apps.","v":"cmp:Service=Container Apps;Fargate / App Runner;Cloud Run|Scale to zero=Yes;No;Yes|Jobs=ACA jobs;ECS tasks / Batch;Cloud Run jobs|GPUs=Serverless GPUs;No;Yes (L4)|Billing=Per vCPU-s;Per vCPU-s;Per vCPU-s","p":"T4"},"az_aca":{"k":"B","cl":"azure","t":"Azure Container Apps","f":"ACA","s":"Serverless container platform on Kubernetes with KEDA scaling, Dapr and revisions, no cluster to manage.","hp":"Microservices, APIs, event workers and AI apps on Azure.","x":"Consumption and dedicated workload profiles. Scale to zero, traffic split between revisions, built-in ingress.","code":"az containerapp up -n api -g rg --image myacr.azurecr.io/api:1.0 --ingress external --target-port 8080","v":"arch:azure:Ingress>Revision A,Revision B>Service Bus","eq":["aws_ecs","aws_fargate","gcp_run"],"p":"T4"},"az_aca_jobs":{"k":"I","cl":"azure","t":"Container Apps jobs","s":"Run-to-completion containers triggered manually, on a schedule or by events (KEDA).","hp":"Batch tasks, queue processors, cron jobs on Azure.","x":"Event-driven jobs scale per message backlog. Self-hosted CI runners are a common use.","code":"az containerapp job create -n nj -g rg --environment e --trigger-type Schedule --cron-expression \"0 2 * * *\"","v":"flow:Trigger>Job execution>Replicas run>Exit","p":"T4"},"az_aca_gpu":{"k":"A","cl":"azure","t":"Container Apps serverless GPUs","s":"On-demand NVIDIA A100/T4 GPUs for Container Apps with scale to zero.","hp":"Serve open models or run inference without a GPU cluster.","x":"Per-second GPU billing; needs GPU quota. Good for bursty inference; long training belongs on VMs/AKS/AML.","v":"flow:Request>Scale from 0>GPU replica>Inference>Scale to 0","p":"T4"},"aws_fargate":{"k":"I","cl":"aws","t":"AWS Fargate","s":"Serverless compute engine for ECS tasks and EKS pods: no EC2 to manage.","hp":"Run containers on AWS without patching or sizing hosts.","x":"Billed per vCPU and GB-second. No GPUs, DaemonSets or privileged containers. Graviton supported. 20-200 GB ephemeral storage.","code":"aws ecs run-task --cluster c1 --launch-type FARGATE --task-definition app --network-configuration file://n","v":"stack:Task / pod,Fargate micro-VM,AWS infrastructure|2","eq":["az_aca","gcp_run"],"p":"T4"},"aws_fargate_spot":{"k":"I","cl":"aws","t":"Fargate Spot","s":"Interruptible Fargate capacity for ECS at up to 70% off.","hp":"Cheap fault-tolerant ECS tasks: workers, batch, dev environments.","x":"ECS only (not EKS). Two-minute warning via SIGTERM. Mix with on-demand via capacity provider strategy.","v":"bars:Fargate=100,Fargate Spot=30","p":"T4"},"aws_apprunner":{"k":"I","cl":"aws","t":"AWS App Runner","s":"Fully managed service from source or image to an autoscaling HTTPS web service.","hp":"Simplest way to run a containerised web app on AWS.","x":"No scale to zero (idle instances bill memory). Check AWS lifecycle status before adopting; ECS Express Mode is the newer simple path.","code":"aws apprunner list-services","v":"flow:Image or repo>App Runner>HTTPS URL>Autoscale","eq":["az_aca","gcp_run"],"p":"T4"},"gcp_run":{"k":"B","cl":"gcp","t":"Cloud Run","s":"Serverless platform for containers: services (HTTP), jobs and worker pools that scale to zero.","hp":"Default for containerised APIs, web apps, AI inference and jobs on GCP.","x":"Per-request or instance billing, concurrency up to 1000, min instances, Direct VPC egress. Source deploys via buildpacks.","code":"gcloud run deploy api --image=us-docker.pkg.dev/p/r/api:1.0 --region=us-central1 --allow-unauthenticated","v":"draw:serverless","eq":["az_aca","aws_fargate","aws_apprunner"],"p":"T4"},"gcp_run_jobs":{"k":"I","cl":"gcp","t":"Cloud Run jobs","s":"Run containers to completion as parallel tasks, on demand or on a schedule.","hp":"Batch scripts, migrations, data processing on GCP.","x":"Up to 10k tasks per execution, task timeout up to 168 h. Trigger with Cloud Scheduler or Workflows.","code":"gcloud run jobs execute migrate --region=us-central1","v":"fan:Job execution|Task 0,Task 1,Task 2,Task N","p":"T4"},"gcp_run_gpu":{"k":"A","cl":"gcp","t":"Cloud Run GPUs","s":"Attach NVIDIA L4 GPUs to Cloud Run services and jobs with scale to zero.","hp":"Serverless LLM/vision inference with open models (Gemma, Llama).","x":"GA 2025; per-second billing, fast startup. Needs GPU quota and min CPU/memory. Good for bursty inference.","code":"gcloud run deploy llm --image=IMG --gpu=1 --gpu-type=nvidia-l4 --region=us-central1","v":"flow:Request>Instance + L4>Load model>Infer>Scale to 0","p":"T4"},"t4_simplerun":{"k":"B","cl":"multi","t":"Single container runs","s":"Start one container (or a small group) on demand without any orchestrator.","hp":"Quick tasks, build agents, simple sidecar-free jobs.","x":"No autoscaling or rolling updates. For services use serverless containers or K8s.","v":"cmp:Service=Container Instances;ECS RunTask Fargate;Cloud Run jobs|Billing=Per second;Per second;Per second|Scale=Manual;Manual;Parallel tasks","p":"T4"},"az_aci":{"k":"B","cl":"azure","t":"Azure Container Instances","f":"ACI","s":"Run Linux or Windows containers on Azure on demand with per-second billing and Hyper-V isolation.","hp":"Quick jobs, CI agents, burst capacity for AKS (virtual nodes).","x":"Container groups share network/storage. VNet deploy, confidential containers, Spot containers. No autoscaling.","code":"az container create -g rg -n job1 --image mcr.microsoft.com/azuredocs/aci-helloworld --restart-policy Never","v":"hub:Container group|App,Sidecar,Azure Files,Public IP","eq":["aws_fargate","gcp_run"],"p":"T4"},"t4_orch":{"k":"I","cl":"multi","t":"Cloud-native orchestrators (non-K8s)","s":"Provider-designed container orchestrators that are simpler than Kubernetes.","hp":"Run many container services without K8s complexity.","x":"Simpler and cheaper to operate; less portable. ECS is AWS's flagship; Azure/GCP equivalents are Container Apps and Cloud Run.","v":"cmp:Service=Container Apps;Amazon ECS;Cloud Run|Control plane fee=None;None;None|Compute=Managed;EC2 / Fargate;Managed|Portability=Medium (Dapr);Low;High (Knative)","p":"T4"},"aws_ecs":{"k":"I","cl":"aws","t":"Amazon ECS","f":"Elastic Container Service","s":"AWS-native container orchestrator running tasks and services on EC2, Fargate or on-prem (ECS Anywhere).","hp":"Run containerised services on AWS with less complexity than EKS.","x":"No control-plane fee. Task definitions + services + clusters. Rolling and blue/green deploys; integrates ALB, IAM, CloudWatch.","code":"aws ecs update-service --cluster c1 --service web --force-new-deployment","v":"arch:aws:ALB>ECS service,Tasks (Fargate)>RDS","eq":["az_aca","gcp_run"],"p":"T4"},"aws_ecs_capacity":{"k":"A","cl":"aws","t":"ECS capacity providers","s":"Strategies that place tasks on Fargate, Fargate Spot or Auto Scaling groups of EC2.","hp":"Mix on-demand and Spot, or scale EC2 hosts with tasks.","x":"Managed scaling adjusts the ASG to task demand. Base + weight split tasks between providers.","v":"fan:Capacity strategy|Fargate,Fargate Spot,EC2 ASG","p":"T4"},"aws_ecs_svcconnect":{"k":"A","cl":"aws","t":"ECS Service Connect","s":"Built-in service discovery and service-to-service proxy for ECS using Cloud Map.","hp":"Microservice calls with retries and metrics on ECS.","x":"Managed Envoy-based proxy. Recommended App Mesh replacement for ECS. Short names like http://orders.","v":"arch:aws:Svc A + proxy>Cloud Map>Svc B + proxy","p":"T4"},"t4_choose":{"k":"B","cl":"multi","t":"Choosing a container platform","s":"Decision guide across serverless containers, cloud orchestrators and managed Kubernetes.","hp":"Pick the least complex platform that meets your needs.","x":"Start serverless (ACA/Cloud Run/Fargate). Move to K8s for portability, CRDs/operators, GPUs at scale or platform teams.","v":"table:Need,Pick (AWS),Pick (Azure/GCP)|Simple web app,ECS Fargate,ACA / Cloud Run|Many teams + CRDs,EKS,AKS / GKE|Scale to zero,Lambda,ACA / Cloud Run|One-off task,ECS RunTask,ACI / Run jobs|GPU fleets,EKS,AKS / GKE","p":"T4"},"t4_ecs_vs_eks":{"k":"I","cl":"multi","t":"ECS vs EKS vs Fargate","s":"AWS-specific choice: orchestrator (ECS or EKS) and compute (EC2 or Fargate) are separate decisions.","hp":"Avoid the common confusion that Fargate is an orchestrator.","x":"ECS: simpler, AWS-only. EKS: K8s standard, more ops. Fargate: serverless compute for either; EC2: cheaper at scale, GPUs.","v":"table:Option,ECS,EKS|EC2 nodes,1,1|Fargate,1,Pods only|Control fee,None,$0.10/hr|Portability,Low,High","p":"T4"},"t5_choose":{"k":"B","cl":"multi","t":"Object vs block vs file storage","s":"The three storage models: objects over HTTP, raw disks attached to a VM, and shared POSIX/SMB file systems.","hp":"Pick the model from the access pattern before picking a service","x":"Object: cheapest, infinite scale, API access. Block: lowest latency, one VM (mostly). File: shared mounts, lift-and-shift apps.","v":"table:Model,Access,Typical use|Object,HTTP API,media backups lakes|Block,Attached disk,OS DBs VMs|File,NFS / SMB,shared app data","p":"T5"},"t5_objectstorage":{"k":"B","cl":"multi","t":"Object storage","s":"Flat, virtually unlimited store of objects (bytes + metadata) in buckets/containers, accessed over HTTPS APIs.","hp":"Default home for files, media, backups, logs, ML datasets and data lakes","x":"Pay per GB-month + requests + egress. ~11 nines durability. Tiers trade storage price for access cost. Not a file system.","v":"cmp:Service=Blob Storage;Amazon S3;Cloud Storage|Container=Container;Bucket;Bucket|Cold tier=Cool/Cold/Archive;IA/Glacier;Nearline-Archive|Share link=SAS;Presigned URL;Signed URL|Events=Event Grid;S3 events;Pub/Sub notif.","p":"T5"},"az_blob":{"k":"B","cl":"azure","t":"Azure Blob Storage","s":"Azure's object store inside a storage account; block, append and page blobs organized in containers.","hp":"Files, images, backups, logs, ML data and static assets on Azure","x":"Use StorageV2 (GPv2) or Premium block blob accounts. Auth with Entra ID + RBAC over account keys. Account-level redundancy (LRS-GZRS).","code":"az storage blob upload --account-name acct -c data -f a.csv -n a.csv --auth-mode login","v":"tiers:Hot,Cool,Cold,Archive","eq":["aws_s3","gcp_gcs"],"p":"T5"},"az_blob_tiers":{"k":"I","cl":"azure","t":"Blob access tiers","s":"Per-blob tiers Hot, Cool, Cold and Archive with falling storage price and rising read cost.","hp":"Cut cost of data you rarely read without moving it to another service","x":"Min retention: Cool 30d, Cold 90d, Archive 180d (early-delete fee). Archive is offline: rehydrate takes up to 15h (High priority <1h for small).","code":"az storage blob set-tier --account-name acct -c data -n a.csv --tier Cold --auth-mode login","v":"tiers:Hot,Cool,Cold,Archive","p":"T5"},"az_blob_lifecycle":{"k":"I","cl":"azure","t":"Blob lifecycle management","s":"Account-level JSON rules that tier or delete blobs, versions and snapshots by age or last access time.","hp":"Automate Hot→Cool→Archive→delete without writing jobs","x":"Filters by prefix and blob index tags. Last-access tracking must be enabled. Runs once a day; changes can take up to 24h+.","v":"flow:Hot>30d Cool>90d Cold>180d Archive>Delete","p":"T5"},"az_blob_immutable":{"k":"I","cl":"azure","t":"Blob versioning, soft delete & immutability","s":"Versioning, soft delete and point-in-time restore, plus WORM via time-based retention and legal holds.","hp":"Recover from deletes/overwrites and meet SEC 17a-4 style WORM rules","x":"Immutability at container or version level; locked policies can't be shortened. Combine with resource locks against account deletion.","v":"flow:Write>New version>Delete>Soft-deleted>Restore","p":"T5"},"az_blob_sas":{"k":"I","cl":"azure","t":"Shared access signatures (SAS)","f":"SAS = shared access signature","s":"Signed URL token granting time-limited, scoped access to a blob, container or account.","hp":"Let browsers/clients upload or download directly without your API proxying bytes","x":"Prefer user delegation SAS (signed with Entra credentials, max 7 days) over account-key SAS. Use stored access policies to revoke.","code":"az storage blob generate-sas --blob-url $URL --permissions r --expiry 2027-01-01 --as-user --auth-mode login","v":"seq:Client,API,Blob|1>2:Request upload|2>1:User delegation SAS|1>3:PUT with SAS|3>1:201 Created","p":"T5"},"az_blob_staticweb":{"k":"B","cl":"azure","t":"Blob static website hosting","s":"Serves HTML/JS/CSS from a special $web container at a web endpoint.","hp":"Cheap hosting for SPAs and docs sites","x":"No server-side code. For custom-domain HTTPS, caching and WAF put Azure Front Door in front. Consider Static Web Apps for CI/CD + APIs.","code":"az storage blob service-properties update --account-name acct --static-website --index-document index.html","v":"arch:azure:Users>Front Door>$web container","p":"T5"},"az_blob_ors":{"k":"A","cl":"azure","t":"Blob object replication","s":"Asynchronous copy of block blobs between containers in two storage accounts, even across regions or tenants.","hp":"Keep a copy near another region's users or in a separate account for isolation","x":"Requires blob versioning + change feed on source. Rules per container pair; optional prefix filters. No SLA on lag (priority option exists).","v":"flow:Source container>Change feed>Async copy>Dest container","p":"T5"},"aws_s3":{"k":"B","cl":"aws","t":"Amazon S3","f":"Simple Storage Service","s":"AWS's object store: buckets of objects with 11 nines durability and strong read-after-write consistency.","hp":"Default storage for almost everything on AWS: assets, backups, logs, data lakes","x":"General purpose vs directory buckets. Block Public Access on by default; SSE-S3 encryption by default. Pay storage + requests + egress.","code":"aws s3 cp ./build s3://my-bucket/site --recursive","v":"tiers:Standard,Standard-IA,Glacier IR,Glacier Flexible,Deep Archive","eq":["az_blob","gcp_gcs"],"p":"T5"},"aws_s3_classes":{"k":"I","cl":"aws","t":"S3 storage classes","s":"Per-object classes: Standard, Intelligent-Tiering, Standard-IA, One Zone-IA, Glacier, Express One Zone.","hp":"Match price to access frequency; Intelligent-Tiering when the pattern is unknown","x":"IA classes: 30-day min + per-GB retrieval fee. One Zone-IA lives in a single AZ. Intelligent-Tiering adds a small per-object monitoring fee.","v":"tiers:Standard,Intelligent-Tiering,Standard-IA,Glacier IR,Deep Archive","p":"T5"},"aws_glacier":{"k":"I","cl":"aws","t":"S3 Glacier storage classes","s":"Archive classes of S3: Glacier Instant Retrieval, Glacier Flexible Retrieval and Glacier Deep Archive.","hp":"Long-term retention of backups, compliance records and raw data at the lowest price","x":"IR: ms reads, 90d min. Flexible: minutes-12h restore, 90d min. Deep Archive: 12-48h, 180d min. Legacy Glacier vault API closed to new customers.","code":"aws s3 cp backup.tar s3://archive-bkt/ --storage-class DEEP_ARCHIVE","v":"bars:Instant Retrieval=0,Flexible (bulk h)=12,Deep Archive (h)=48","p":"T5"},"aws_s3_lifecycle":{"k":"I","cl":"aws","t":"S3 Lifecycle rules","s":"Bucket rules that transition objects between storage classes and expire objects or old versions.","hp":"Automatic tiering and cleanup, e.g. logs to Glacier after 90 days, delete after 1 year","x":"Filter by prefix/tags/size. Also expire noncurrent versions and abort incomplete multipart uploads (hidden cost). Transition fees per object.","code":"aws s3api put-bucket-lifecycle-configuration --bucket logs --lifecycle-configuration file://lc.json","v":"flow:Standard>30d Standard-IA>90d Glacier>365d Expire","p":"T5"},"aws_s3_objectlock":{"k":"I","cl":"aws","t":"S3 Versioning & Object Lock","s":"Versioning keeps every object version; Object Lock adds WORM retention (governance/compliance), legal holds.","hp":"Protect against deletes, ransomware and meet regulated retention","x":"Object Lock requires versioning. Compliance mode: nobody, not even root, can delete until expiry. Add MFA Delete for extra safety.","v":"flow:PUT>Version 1>PUT>Version 2>Delete marker>Restore v2","p":"T5"},"aws_s3_presigned":{"k":"B","cl":"aws","t":"S3 presigned URLs","s":"Time-limited URL signed with the caller's credentials to GET or PUT one object.","hp":"Direct browser uploads/downloads without making the bucket public","x":"Max 7 days with SigV4; ends early when the signing session credentials expire. Use presigned POST for form uploads with size limits.","code":"aws s3 presign s3://my-bucket/report.pdf --expires-in 3600","v":"seq:Browser,API,S3|1>2:Ask to upload|2>1:Presigned PUT URL|1>3:PUT object|3>1:200 OK","p":"T5"},"aws_s3_website":{"k":"B","cl":"aws","t":"S3 static website hosting","s":"Serves a bucket's content as a website (index/error documents, redirects) over an HTTP website endpoint.","hp":"Host SPAs and static sites cheaply","x":"Website endpoint is HTTP only. Best practice: private bucket + CloudFront with Origin Access Control for HTTPS, caching and WAF.","code":"aws s3 website s3://my-site/ --index-document index.html --error-document error.html","v":"arch:aws:Users>CloudFront>S3 bucket (OAC)","p":"T5"},"aws_s3_express":{"k":"A","cl":"aws","t":"S3 Express One Zone","s":"High-performance storage class in directory buckets in a single AZ with single-digit ms latency.","hp":"Hot data for ML training, analytics scratch and request-heavy workloads","x":"Up to 10x faster than S3 Standard, lower request prices. Single AZ = no AZ-loss resilience. Co-locate compute in the same AZ; CreateSession auth.","v":"bars:S3 Standard (rel latency)=10,Express One Zone=1","p":"T5"},"aws_s3_events":{"k":"I","cl":"aws","t":"S3 event notifications","s":"Emit events on object create/delete/restore to SNS, SQS, Lambda or Amazon EventBridge.","hp":"Kick off processing (thumbnails, ETL, scanning) as soon as files land","x":"Enable EventBridge for rich filtering and many targets. Delivery is at-least-once; make consumers idempotent. Avoid write-back loops.","v":"fan:S3 PUT|Lambda,SQS,SNS,EventBridge","p":"T5"},"aws_s3_replication":{"k":"I","cl":"aws","t":"S3 Replication (CRR / SRR)","f":"CRR = Cross-Region Replication, SRR = Same-Region Replication","s":"Asynchronous copy of objects to buckets in other regions (CRR) or the same region (SRR), across accounts too.","hp":"DR copy, data sovereignty, or aggregating logs into one account","x":"Requires versioning. Only new objects by default; use Batch Replication for existing. Replication Time Control: 99.99% within 15 min.","v":"flow:Source bucket>Replication rule>Dest bucket (other region)","p":"T5"},"gcp_gcs":{"k":"B","cl":"gcp","t":"Cloud Storage","f":"GCS","s":"Google Cloud's object store: buckets with a single API across all storage classes and locations.","hp":"Files, media, backups, ML datasets and lake data on Google Cloud","x":"All classes have ms first-byte latency. Uniform bucket-level access recommended. Soft delete on by default (7 days). Autoclass auto-tiers.","code":"gcloud storage buckets create gs://my-bkt --location=us-central1 --uniform-bucket-level-access","v":"tiers:Standard,Nearline,Coldline,Archive","eq":["az_blob","aws_s3"],"p":"T5"},"gcp_gcs_classes":{"k":"I","cl":"gcp","t":"Cloud Storage classes & Autoclass","s":"Standard, Nearline (30d min), Coldline (90d), Archive (365d) classes; Autoclass moves objects by access.","hp":"Lower cost for infrequently read data while keeping instant access","x":"Unlike Glacier/Archive tier, even Archive class is online with ms latency; you pay retrieval fees and min-duration charges instead.","code":"gcloud storage buckets update gs://my-bkt --enable-autoclass","v":"tiers:Standard,Nearline,Coldline,Archive","p":"T5"},"gcp_gcs_lifecycle":{"k":"I","cl":"gcp","t":"Object Lifecycle Management","s":"Bucket rules that change storage class or delete objects based on age, versions, prefix and more.","hp":"Automate tiering and cleanup of logs, temp data and old versions","x":"Actions: SetStorageClass, Delete, AbortIncompleteMultipartUpload. Changes may take up to 24h to apply. Not needed if using Autoclass for tiering.","code":"gcloud storage buckets update gs://my-bkt --lifecycle-file=lifecycle.json","v":"flow:Standard>30d Nearline>90d Coldline>365d Delete","p":"T5"},"gcp_gcs_retention":{"k":"I","cl":"gcp","t":"Versioning, soft delete & Bucket Lock","s":"Object versioning, soft delete, retention policies, object holds and Bucket Lock for WORM compliance.","hp":"Recover deleted data and enforce immutable retention","x":"Bucket Lock makes the retention policy permanent (irreversible). Object Retention Lock sets per-object retention. Soft delete adds storage cost.","v":"flow:Write>Retention policy>Lock>No delete until expiry","p":"T5"},"gcp_gcs_signedurl":{"k":"B","cl":"gcp","t":"Cloud Storage signed URLs","s":"URLs signed by a service account (V4) granting time-limited access to one object.","hp":"Direct client uploads/downloads from private buckets","x":"Max 7 days. Sign via IAM signBlob (no key files) from Cloud Run/GKE. Signed policy documents for HTML form uploads.","code":"gcloud storage sign-url gs://b/a.pdf --duration=1h --impersonate-service-account=sa@p.iam.gserviceaccount.com","v":"seq:Client,API,GCS|1>2:Request URL|2>1:Signed URL|1>3:PUT object|3>1:200 OK","p":"T5"},"gcp_gcs_website":{"k":"B","cl":"gcp","t":"Cloud Storage static website","s":"Bucket configured with main page and 404 page served as a static site.","hp":"Host static sites on GCP","x":"Custom domain HTTPS needs an external Application Load Balancer with a backend bucket (+ Cloud CDN). Firebase Hosting is simpler for apps.","code":"gcloud storage buckets update gs://www.example.com --web-main-page-suffix=index.html","v":"arch:gcp:Users>Load Balancer + CDN>Backend bucket","p":"T5"},"gcp_gcs_notify":{"k":"I","cl":"gcp","t":"Pub/Sub notifications & Eventarc for GCS","s":"Bucket notifications publish object finalize/delete events to Pub/Sub; Eventarc routes them to Cloud Run.","hp":"Trigger processing as soon as objects are written","x":"At-least-once delivery; dedupe in consumers. Eventarc/Cloud Run functions triggers use the same events. Up to 100 notification configs per bucket.","code":"gcloud storage buckets notifications create gs://my-bkt --topic=uploads","v":"fan:Object finalize|Pub/Sub,Eventarc,Cloud Run functions","p":"T5"},"t5_datalake":{"k":"I","cl":"multi","t":"Data lake storage","s":"Object storage organized for analytics: open formats (Parquet, Iceberg, Delta) + catalog and access control.","hp":"Cheap single store for raw→curated data shared by Spark, SQL engines and ML","x":"Needs a catalog and governance or it becomes a swamp. Table formats add ACID and time travel. Directory-style namespaces speed up Spark jobs.","v":"cmp:Storage=ADLS Gen2;S3 + S3 Tables;Cloud Storage|Namespace=Hierarchical (HNS);Flat prefixes;Flat or HNS|Catalog=Unity / OneLake;Glue Data Catalog;BigLake / Dataplex|Governance=Purview;Lake Formation;Dataplex","p":"T5"},"az_adls":{"k":"I","cl":"azure","t":"Azure Data Lake Storage Gen2","f":"ADLS Gen2","s":"Blob Storage with hierarchical namespace (HNS): real directories, POSIX ACLs and the ABFS driver for Spark.","hp":"Data lakes for Databricks, Fabric, Synapse and HDInsight-style workloads","x":"Enable HNS at account creation (one-way upgrade possible). Atomic directory rename/delete. Some Blob features differ with HNS.","code":"az storage account create -n lakeacct -g rg --sku Standard_ZRS --kind StorageV2 --hns true","v":"draw:lakehouse","eq":["aws_s3_lake","gcp_gcs_lake"],"p":"T5"},"aws_s3_lake":{"k":"I","cl":"aws","t":"S3 data lake + Lake Formation","s":"S3 buckets as the lake, Glue Data Catalog for schemas and Lake Formation for table/column/row permissions.","hp":"Governed lake queried by Athena, EMR, Redshift Spectrum and SageMaker","x":"Lake Formation centralizes grants (incl. tag-based, cross-account). Partition and compact files; many small files hurt performance.","v":"arch:aws:Sources>S3 raw,S3 curated>Glue Catalog>Athena,EMR,Redshift","eq":["az_adls","gcp_gcs_lake"],"p":"T5"},"aws_s3_tables":{"k":"A","cl":"aws","t":"Amazon S3 Tables","s":"Table buckets that store Apache Iceberg tables with automatic compaction and snapshot management.","hp":"Managed Iceberg tables without running compaction jobs","x":"Launched Dec 2024. Queried via Athena, Redshift, EMR, Spark and other Iceberg engines through the Iceberg REST catalog / Glue integration.","code":"aws s3tables create-table-bucket --name analytics-tables","v":"stack:Query engines,Iceberg REST catalog,Table bucket,S3 storage|2","p":"T5"},"gcp_gcs_lake":{"k":"I","cl":"gcp","t":"Cloud Storage lake + BigLake","s":"Cloud Storage as the lake with BigLake tables (incl. Iceberg) for governed access from BigQuery and Spark.","hp":"Query open-format files in GCS with BigQuery security and performance","x":"Hierarchical namespace buckets available for faster Spark/Hadoop. Dataplex Universal Catalog for discovery, quality and lineage.","v":"arch:gcp:Sources>GCS (Iceberg/Parquet)>BigLake>BigQuery,Dataproc","eq":["az_adls","aws_s3_lake"],"p":"T5"},"t5_blockstorage":{"k":"B","cl":"multi","t":"Block storage (VM disks)","s":"Network-attached virtual disks you format and mount on a VM, like a SAN volume.","hp":"OS disks, self-managed databases and any app needing low-latency random I/O","x":"Zonal: tied to one AZ (zone-redundant/regional options exist). Usually single-attach. Pay for provisioned size (and IOPS/throughput tiers).","v":"cmp:Service=Managed Disks;Amazon EBS;PD & Hyperdisk|General SSD=Premium SSD v2;gp3;Hyperdisk Balanced|Top perf=Ultra Disk;io2 Block Express;Hyperdisk Extreme|Cross-zone=ZRS disks;none (use snaps);Regional PD/HA","p":"T5"},"az_disk":{"k":"B","cl":"azure","t":"Azure Managed Disks","s":"Block volumes for Azure VMs: Standard HDD, Standard SSD, Premium SSD, Premium SSD v2 and Ultra Disk.","hp":"OS and data disks for Azure VMs and VM scale sets","x":"LRS by default; ZRS for Standard/Premium SSD. Shared disks for clusters. Encrypted at rest; add CMK via disk encryption set.","code":"az disk create -g rg -n data1 --size-gb 256 --sku PremiumV2_LRS --zone 1","v":"tiers:Ultra Disk,Premium SSD v2,Premium SSD,Standard SSD,Standard HDD","eq":["aws_ebs","gcp_pd"],"p":"T5"},"az_disk_types":{"k":"I","cl":"azure","t":"Premium SSD v2 & Ultra Disk","s":"Disk types where capacity, IOPS and throughput are set independently and adjustable online.","hp":"Databases needing high IOPS without overbuying capacity","x":"Premium SSD v2: up to 80k IOPS, 1,200 MB/s, sub-ms. Ultra: up to 400k IOPS, 10,000 MB/s. Neither can be an OS disk; zonal VMs only.","v":"bars:Premium SSD v2 kIOPS=80,Ultra Disk kIOPS=400","p":"T5"},"aws_ebs":{"k":"B","cl":"aws","t":"Amazon EBS","f":"Elastic Block Store","s":"AZ-scoped block volumes for EC2: SSD (gp3, io2) and HDD (st1, sc1) types.","hp":"Root and data volumes for EC2 instances and self-managed databases","x":"Replicated within one AZ. Encrypt by default per region (KMS). Elastic Volumes: change size/type/IOPS online. Instance store is separate & ephemeral.","code":"aws ec2 create-volume --availability-zone us-east-1a --size 200 --volume-type gp3 --iops 6000","v":"tiers:io2 Block Express,gp3,st1,sc1","eq":["az_disk","gcp_pd"],"p":"T5"},"aws_ebs_types":{"k":"I","cl":"aws","t":"EBS gp3 & io2 Block Express","s":"gp3: general SSD, 3,000 IOPS baseline, IOPS/throughput set independently; io2 BE: highest-perf SSD.","hp":"gp3 for most workloads; io2 for mission-critical databases","x":"gp3 now up to 80k IOPS / 2,000 MB/s (2025). io2 BE: up to 256k IOPS, 99.999% durability, Multi-Attach. Migrate gp2→gp3 for ~20% savings.","v":"bars:gp3 max kIOPS=80,io2 BE max kIOPS=256","p":"T5"},"gcp_pd":{"k":"B","cl":"gcp","t":"Persistent Disk & Hyperdisk","s":"Block storage for Compute Engine/GKE: Persistent Disk (standard, balanced, SSD) and newer Hyperdisk family.","hp":"VM boot and data disks on Google Cloud","x":"Newer machine series (C3, C4, N4) use Hyperdisk only. Regional PD / Hyperdisk Balanced HA replicate synchronously across 2 zones.","code":"gcloud compute disks create data1 --type=hyperdisk-balanced --size=200GB --zone=us-central1-a","v":"tiers:Hyperdisk Extreme,Hyperdisk Balanced,PD SSD,PD Balanced,PD Standard","eq":["az_disk","aws_ebs"],"p":"T5"},"gcp_hyperdisk":{"k":"I","cl":"gcp","t":"Hyperdisk","s":"Next-gen block storage with capacity, IOPS and throughput set separately: Balanced, Extreme, Throughput, ML.","hp":"Tune performance per workload; Hyperdisk ML for fast read-only model loading","x":"Hyperdisk Storage Pools share capacity/perf across disks. Extreme up to 350k IOPS. Hyperdisk ML can attach read-only to many VMs.","v":"table:Type,Use|Balanced,general DBs apps|Extreme,top IOPS DBs|Throughput,analytics scans|ML,model weights","p":"T5"},"t5_snapshots":{"k":"I","cl":"multi","t":"Disk snapshots","s":"Point-in-time, usually incremental copies of block volumes stored durably outside the disk.","hp":"Backups, cloning environments, moving disks across zones/regions","x":"Crash-consistent unless you quiesce the app. Incremental billing on changed blocks. Copy cross-region for DR. Automate with policies.","v":"cmp:Service=Disk snapshots;EBS snapshots;Disk snapshots|Automation=Azure Backup;Data Lifecycle Mgr;Snapshot schedules|Fast restore=Instant restore;Fast Snapshot Rest.;Instant snapshots|Archive=Copy to Std HDD;Snapshots Archive;Archive snapshots","p":"T5"},"az_disk_snapshot":{"k":"I","cl":"azure","t":"Managed disk incremental snapshots","s":"Incremental snapshots of managed disks billed for changed data, storable on Standard HDD storage.","hp":"Quick disk-level backups and cloning on Azure","x":"Can copy incremental snapshots across regions. For scheduled, app-consistent VM backups use Azure Backup instead.","code":"az snapshot create -g rg -n snap1 --source data1 --incremental true","v":"flow:Disk>Snapshot>New disk","eq":["aws_ebs_snapshot","gcp_pd_snapshot"],"p":"T5"},"aws_ebs_snapshot":{"k":"I","cl":"aws","t":"EBS snapshots","s":"Incremental, point-in-time backups of EBS volumes stored regionally in S3 (managed by AWS).","hp":"Back up, clone and copy EC2 volumes across regions/accounts","x":"Automate with Data Lifecycle Manager or AWS Backup. Fast Snapshot Restore avoids lazy-load latency. Recycle Bin guards against deletes.","code":"aws ec2 create-snapshot --volume-id vol-0abc --description nightly","v":"flow:EBS volume>Snapshot>Copy to region>Restore volume","eq":["az_disk_snapshot","gcp_pd_snapshot"],"p":"T5"},"gcp_pd_snapshot":{"k":"I","cl":"gcp","t":"Compute Engine disk snapshots","s":"Incremental snapshots of PD/Hyperdisk stored regionally or multi-regionally; plus instant snapshots.","hp":"Back up and clone GCE disks, restore into any zone","x":"Snapshot schedules automate retention. Instant snapshots are in-zone and fast but not a full backup. Use Backup and DR for policy/vaults.","code":"gcloud compute snapshots create snap1 --source-disk=data1 --source-disk-zone=us-central1-a","v":"flow:Disk>Snapshot (multi-region)>Disk in any zone","eq":["az_disk_snapshot","aws_ebs_snapshot"],"p":"T5"},"t5_filestorage":{"k":"B","cl":"multi","t":"File storage (NFS / SMB shares)","s":"Managed network file systems mounted by many VMs, containers or on-prem clients at once.","hp":"Shared app data, home dirs, CMS uploads, lift-and-shift apps, HPC scratch","x":"Choose by protocol (NFS vs SMB), performance and features (snapshots, AD join). NetApp-based options give enterprise NAS features.","v":"cmp:General=Azure Files;Amazon EFS;Filestore|Enterprise NAS=Azure NetApp Files;FSx for ONTAP;NetApp Volumes|Windows SMB=Azure Files SMB;FSx Windows;NetApp Volumes|HPC=Managed Lustre;FSx for Lustre;Managed Lustre","p":"T5"},"az_files":{"k":"B","cl":"azure","t":"Azure Files","s":"Fully managed SMB and NFS file shares in a storage account, mountable from Azure, on-prem and AKS.","hp":"Shared drives, lift-and-shift Windows apps, AKS persistent volumes","x":"Standard (HDD) or Premium (SSD; required for NFS). Provisioned v2 billing lets you set size/IOPS/throughput. Entra Kerberos for SMB identity.","code":"az storage share-rm create -g rg --storage-account acct -n share1 --quota 1024","v":"hub:Azure Files share|VMs,AKS pods,On-prem PCs,File Sync","eq":["aws_efs","aws_fsx","gcp_filestore"],"p":"T5"},"az_filesync":{"k":"I","cl":"azure","t":"Azure File Sync","s":"Syncs Windows file servers with Azure Files and tiers cold files to the cloud.","hp":"Keep fast local access in branches while centralizing data in Azure","x":"Agent on Windows Server. Cloud tiering keeps a local cache. Multi-site sync; not real-time collaborative locking across sites.","v":"arch:azure:Branch servers>Sync service>Azure Files","p":"T5"},"az_netapp":{"k":"A","cl":"azure","t":"Azure NetApp Files","s":"First-party NetApp ONTAP-based NAS on Azure: NFSv3/4.1 and SMB volumes with sub-ms latency.","hp":"SAP HANA, Oracle, HPC, VDI and enterprise NAS migrations","x":"Capacity pools with Standard/Premium/Ultra/Flexible service levels. Snapshots, cross-region/zone replication. Higher minimum spend.","code":"az netappfiles volume create -g rg -a anf1 -p pool1 -v vol1 -l eastus --usage-threshold 100 --file-path vol1","v":"stack:Volumes,Capacity pool,NetApp account|2","eq":["aws_fsx","gcp_netappvol"],"p":"T5"},"aws_efs":{"k":"B","cl":"aws","t":"Amazon EFS","f":"Elastic File System","s":"Serverless, elastic NFSv4.1 file system for Linux, mountable across AZs by EC2, ECS, EKS and Lambda.","hp":"Shared Linux storage that grows and shrinks automatically","x":"Regional (multi-AZ) or One Zone. Standard, IA and Archive classes with lifecycle. Elastic throughput mode. No Windows/SMB.","code":"aws efs create-file-system --performance-mode generalPurpose --throughput-mode elastic --encrypted","v":"hub:EFS|EC2,ECS tasks,EKS pods,Lambda","eq":["az_files","gcp_filestore"],"p":"T5"},"aws_fsx":{"k":"I","cl":"aws","t":"Amazon FSx","s":"Family of managed file systems: FSx for Windows File Server, NetApp ONTAP, OpenZFS and Lustre.","hp":"Bring a specific file system (SMB/AD, ONTAP, ZFS, Lustre HPC) to AWS","x":"Lustre links to S3 for ML/HPC scratch. ONTAP: multiprotocol, SnapMirror. Windows: AD-joined SMB with DFS. Provisioned capacity.","code":"aws fsx create-file-system --file-system-type LUSTRE --storage-capacity 1200 --subnet-ids subnet-0abc","v":"table:Variant,Best for|Windows,SMB + AD apps|NetApp ONTAP,enterprise NAS|OpenZFS,Linux NFS perf|Lustre,HPC/ML on S3","eq":["az_netapp","gcp_netappvol"],"p":"T5"},"gcp_filestore":{"k":"I","cl":"gcp","t":"Filestore","s":"Managed NFS file servers for Compute Engine and GKE in Basic, Zonal and Regional tiers.","hp":"Shared NFS for GKE, media rendering and lift-and-shift Linux apps","x":"Provisioned capacity (Basic min 1 TiB). Regional tier replicates across zones. GKE CSI driver available. Snapshots and backups.","code":"gcloud filestore instances create fs1 --zone=us-central1-a --tier=BASIC_HDD --file-share=name=v1,capacity=1TB","v":"hub:Filestore|GCE VMs,GKE pods,Batch jobs","eq":["az_files","aws_efs"],"p":"T5"},"gcp_netappvol":{"k":"A","cl":"gcp","t":"Google Cloud NetApp Volumes","s":"Google-managed NetApp ONTAP-based NFS/SMB volumes with snapshots, replication and backups.","hp":"Enterprise NAS, SAP and Windows SMB shares on Google Cloud","x":"Service levels Flex, Standard, Premium, Extreme. Cross-region replication. Good fit when migrating NetApp on-prem estates.","v":"stack:Volumes,Storage pool,Service level|1","eq":["az_netapp","aws_fsx"],"p":"T5"},"t5_backup":{"k":"B","cl":"multi","t":"Backup services","s":"Managed, policy-driven backup of VMs, disks, databases and file shares into isolated vaults.","hp":"Recover from deletion, corruption and ransomware; meet retention rules","x":"Look for immutable/locked vaults, cross-region/cross-account copies, and restore testing. Backups ≠ DR replication (RTO differs).","v":"cmp:Service=Azure Backup;AWS Backup;Backup and DR|Vault=Recovery Svcs vault;Backup vault;Backup vault|Immutability=Immutable vault;Vault Lock;Enforced retention|Org-wide=Backup center;Organizations;Org policies","p":"T5"},"az_backup":{"k":"B","cl":"azure","t":"Azure Backup","s":"Managed backup for Azure VMs, SQL/SAP HANA in VMs, Azure Files, Blobs, Disks, AKS and PostgreSQL.","hp":"One place to set backup policies and restore Azure workloads","x":"Recovery Services and Backup vaults. Soft delete, immutable vaults, multi-user authorization. Cross-region restore with GRS vaults.","code":"az backup protection enable-for-vm -g rg -v vault1 --vm vm1 --policy-name DefaultPolicy","v":"flow:Policy>Snapshot>Vault (GRS)>Restore","eq":["aws_backup","gcp_backupdr"],"p":"T5"},"aws_backup":{"k":"B","cl":"aws","t":"AWS Backup","s":"Central backup service across EC2, EBS, RDS/Aurora, DynamoDB, EFS, FSx, S3 and more.","hp":"Org-wide backup plans, cross-account/region copies and compliance audits","x":"Backup plans by tag. Vault Lock (WORM), logically air-gapped vaults, restore testing, Backup Audit Manager. Works with Organizations.","code":"aws backup start-backup-job --backup-vault-name main --resource-arn arn:aws:ec2:... --iam-role-arn arn:...","v":"flow:Backup plan>Tagged resources>Vault>Copy to other region","eq":["az_backup","gcp_backupdr"],"p":"T5"},"gcp_backupdr":{"k":"I","cl":"gcp","t":"Backup and DR Service","s":"Google Cloud's managed backup with backup vaults for Compute Engine, disks, Cloud SQL and more.","hp":"Immutable, policy-based backups isolated from the source project","x":"Backup vaults enforce minimum retention (can't be deleted early, even by admins). Legacy management-server mode covers VMware and databases.","v":"flow:Backup plan>Workloads>Backup vault>Restore","eq":["az_backup","aws_backup"],"p":"T5"},"t5_321":{"k":"I","cl":"multi","t":"3-2-1 & immutable backups","s":"Keep 3 copies on 2 media types with 1 off-site/isolated copy; make at least one immutable.","hp":"Survive ransomware that has admin credentials","x":"Use a separate account/subscription/project for vaults, locked retention, MFA/multi-user auth on deletes. Test restores regularly.","v":"hub:Data|Primary,Snapshot,Vault copy,Other region","p":"T5"},"t5_transfer":{"k":"I","cl":"multi","t":"Data transfer & offline migration","s":"Tools to move large datasets online (agents, managed copy) or offline (shipped appliances) into the cloud.","hp":"Migrate TBs/PBs, sync shares, or copy between clouds"
