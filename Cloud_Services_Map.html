ed; Snowball availability is restricted for new customers. Consider DataSync or AWS Data Transfer Terminal.","v":"flow:Order device>Copy data>Ship to AWS>Import to S3","eq":["az_databox","gcp_transfer"],"p":"T5"},"aws_datasync":{"k":"I","cl":"aws","t":"AWS DataSync","s":"Managed online transfer between NFS/SMB/HDFS, object stores, other clouds and S3, EFS or FSx.","hp":"Migrate or regularly sync file shares and buckets into AWS","x":"Agent for on-prem; Enhanced mode for S3 and some cross-cloud copies. Integrity checks, scheduling, bandwidth limits. Per-GB pricing.","code":"aws datasync start-task-execution --task-arn arn:aws:datasync:us-east-1:123456789012:task/task-0abc","v":"arch:aws:NAS / other cloud>DataSync agent>S3,EFS,FSx","eq":["az_storagemover","gcp_transfer"],"p":"T5"},"aws_transferfamily":{"k":"I","cl":"aws","t":"AWS Transfer Family","s":"Managed SFTP, FTPS, FTP and AS2 endpoints that read/write S3 or EFS.","hp":"Partners send files over SFTP straight into S3","x":"Identity via service users, Directory Service or custom IdP (Lambda). Hourly endpoint charge + per-GB. Web apps for browser access.","v":"flow:Partner SFTP>Transfer endpoint>S3>Event processing","p":"T5"},"gcp_transfer":{"k":"I","cl":"gcp","t":"Storage Transfer Service & Transfer Appliance","s":"Managed online transfers into Cloud Storage from S3, Azure, HTTP or on-prem agents, plus Transfer Appliance.","hp":"Migrate or continuously sync data into GCS","x":"Agentless for cloud sources; event-driven transfers from S3/GCS. Transfer Appliance for offline bulk. Free service; egress from source applies.","code":"gcloud transfer jobs create s3://src-bkt gs://dst-bkt --source-creds-file=creds.json","v":"fanin:Amazon S3,Azure Blob,On-prem NFS,URL list|Cloud Storage","eq":["az_databox","aws_datasync"],"p":"T5"},"t5_redundancy":{"k":"B","cl":"multi","t":"Storage redundancy options","s":"How many copies are kept and where: one datacenter, across zones, or across regions.","hp":"Choose durability/availability vs cost for each dataset","x":"Zone copies survive a datacenter loss; geo copies survive a region outage but are async (RPO > 0). Single-AZ classes are cheapest.","v":"cmp:Single zone=LRS;One Zone-IA/Express;Zonal (rapid)|Multi-zone=ZRS;S3 Standard (3+ AZ);Region bucket|Multi-region=GRS/GZRS;CRR (add-on);Dual/multi-region|Read 2nd region=RA-GRS/RA-GZRS;Replica bucket;Built-in","p":"T5"},"az_storage_redundancy":{"k":"I","cl":"azure","t":"Azure LRS / ZRS / GRS / GZRS","s":"Storage-account redundancy: LRS (3 copies, 1 DC), ZRS (3 zones), GRS/GZRS (+ async copy to paired region).","hp":"Pick per account: ZRS for HA in-region, GZRS for region-level DR","x":"RA- variants allow reads from the secondary. Geo failover is customer-initiated; secondary lags (RPO typically <15 min, no SLA).","code":"az storage account update -g rg -n acct --sku Standard_GZRS","v":"table:Option,Zone loss,Region loss|LRS,no,no|ZRS,1,no|GRS,no,1|GZRS,1,1","eq":["gcp_gcs_locations"],"p":"T5"},"gcp_gcs_locations":{"k":"I","cl":"gcp","t":"Cloud Storage locations (region, dual, multi)","s":"Buckets are regional, dual-region or multi-region; dual-region can add turbo replication (15-min RPO).","hp":"Dual-region for active-active analytics/DR with a single bucket name","x":"Location is fixed at creation. Multi-region (US, EU, ASIA) for content serving. Replication charges apply to dual/multi-region writes.","code":"gcloud storage buckets create gs://b --location=NAM4 --rpo=ASYNC_TURBO","v":"table:Location,Copies|Region,multi-zone|Dual-region,2 regions|Multi-region,2+ regions","eq":["az_storage_redundancy","aws_s3_replication"],"p":"T5"},"t5_encryption":{"k":"B","cl":"multi","t":"Encryption at rest","s":"Data is encrypted on disk by default; choose provider-managed, customer-managed (KMS) or client-side keys.","hp":"Meet compliance and control key revocation for sensitive data","x":"All three clouds encrypt storage by default (AES-256). CMK adds key rotation control and audit; uses envelope encryption with a KMS.","v":"draw:envelope","p":"T5"},"t5_cmk":{"k":"I","cl":"multi","t":"Customer-managed keys (CMK / CMEK)","s":"Storage encrypted with a key you own in a KMS, rather than the provider's default key.","hp":"Revoke access by disabling the key; separate duties between key and data admins","x":"Adds KMS request cost and an availability dependency (lost key = lost data). SSE-KMS, Azure CMK, GCP CMEK; client-side for zero trust.","v":"cmp:Default=Microsoft-managed;SSE-S3;Google default|Customer key=CMK in Key Vault;SSE-KMS;CMEK (Cloud KMS)|Client-provided=Customer-provided;SSE-C;CSEK","p":"T5"},"t6_choose":{"k":"B","cl":"multi","t":"Choosing a relational database","s":"Decide by engine compatibility, scale (single node vs distributed), global needs and how much ops you'll own.","hp":"Start with managed Postgres/MySQL; go cloud-native or distributed only when needed","x":"Engine lock-in is low for Postgres. Distributed SQL (Spanner, DSQL) adds limits. SQL Server licensing drives Azure choices.","v":"table:Need,Pick|Default OLTP,Managed Postgres|SQL Server app,Azure SQL / RDS SQL|High scale/HA,Aurora / AlloyDB / Hyperscale|Global writes,Spanner / Aurora DSQL|Oracle estate,Oracle Database@cloud","p":"T6"},"t6_managed":{"k":"B","cl":"multi","t":"Managed relational databases (DBaaS)","s":"The provider runs the engine: patching, backups, HA, monitoring; you manage schema, queries and sizing.","hp":"Avoid running databases on VMs unless you need OS/engine control","x":"You lose superuser/OS access and some extensions. Pay per vCPU/memory + storage + IOPS + backup. Maintenance windows cause brief failovers.","v":"stack:Schema & queries,Sizing & tuning,Backups & HA,Patching,OS,Hardware|4","p":"T6"},"aws_rds":{"k":"B","cl":"aws","t":"Amazon RDS","f":"Relational Database Service","s":"AWS managed relational service for PostgreSQL, MySQL, MariaDB, SQL Server, Oracle and Db2 (plus Aurora).","hp":"Default way to run a relational DB on AWS","x":"Instance classes (db.t4g/m7g/r7g...), gp3/io2 storage, Multi-AZ, read replicas, Blue/Green deployments. Extended Support fees on old majors.","code":"aws rds create-db-instance --db-instance-identifier app --engine postgres --db-instance-class db.t4g.micro","v":"hub:Amazon RDS|PostgreSQL,MySQL,MariaDB,SQL Server,Oracle,Db2,Aurora","eq":["az_pg","gcp_cloudsql"],"p":"T6"},"gcp_cloudsql":{"k":"B","cl":"gcp","t":"Cloud SQL","s":"Google Cloud's managed MySQL, PostgreSQL and SQL Server instances.","hp":"Default managed relational DB on Google Cloud","x":"Enterprise vs Enterprise Plus editions. Private IP or Private Service Connect. IAM DB auth. Storage auto-increase (can't shrink).","code":"gcloud sql instances create pg1 --database-version=POSTGRES_17 --edition=ENTERPRISE --tier=db-custom-2-8192","v":"hub:Cloud SQL|PostgreSQL,MySQL,SQL Server","eq":["az_pg","aws_rds"],"p":"T6"},"gcp_cloudsql_editions":{"k":"I","cl":"gcp","t":"Cloud SQL Enterprise vs Enterprise Plus","s":"Two editions: Enterprise (general) and Enterprise Plus (faster machines, data cache, 99.99% SLA).","hp":"Enterprise Plus for critical MySQL/Postgres with near-zero-downtime maintenance","x":"Enterprise Plus: sub-second downtime maintenance, 35-day PITR logs, up to 128 vCPU class machines. Costs more per vCPU.","v":"table:Edition,SLA|Enterprise,99.95%|Enterprise Plus,99.99%","p":"T6"},"t6_sqlserver":{"k":"B","cl":"multi","t":"Managed SQL Server","s":"Microsoft SQL Server as a service: PaaS database, managed instance or SQL Server on managed VMs.","hp":"Run .NET/Windows-era apps' databases without managing Windows servers","x":"License-included vs bring-your-own (Azure Hybrid Benefit). Instance-level features (Agent, CLR, cross-DB) need MI/RDS, not single DB.","v":"cmp:PaaS DB=Azure SQL Database;RDS for SQL Server;Cloud SQL SQL Srv|Near-full compat=SQL Managed Inst.;RDS Custom;Cloud SQL SQL Srv|VM option=SQL Server on VM;SQL on EC2;SQL on Compute Eng.|Licensing=AHB / incl.;License incl.;License incl.","p":"T6"},"az_sqldb":{"k":"B","cl": h zone-redundant HA, built-in PgBouncer and elastic clusters.","hp":"Managed Postgres on Azure for apps, APIs and AI (vector) workloads","x":"Burstable, General Purpose, Memory Optimized tiers. Single Server retired (2025). Entra auth. Elastic clusters (Citus) for sharding.","code":"az postgres flexible-server create -g rg -n pg1 --tier GeneralPurpose --sku-name Standard_D2ds_v5","v":"arch:azure:App>PgBouncer>Primary (zone 1)>Standby (zone 2)","eq":["aws_rds_pg","gcp_cloudsql_pg"],"p":"T6"},"aws_rds_pg":{"k":"B","cl":"aws","t":"Amazon RDS for PostgreSQL","s":"Community PostgreSQL on RDS with Multi-AZ, read replicas and Blue/Green deployments.","hp":"Managed Postgres on AWS when Aurora's extras aren't needed","x":"Multi-AZ DB cluster gives 2 readable standbys and faster failover. Optimized Reads on NVMe classes. Often cheaper than Aurora at low I/O.","code":"aws rds create-db-instance --db-instance-identifier pg1 --engine postgres --db-instance-class db.m7g.large","v":"draw:replication","eq":["az_pg","gcp_cloudsql_pg"],"p":"T6"},"gcp_cloudsql_pg":{"k":"B","cl":"gcp","t":"Cloud SQL for PostgreSQL","s":"Managed community PostgreSQL on Cloud SQL with HA, replicas and PITR.","hp":"Managed Postgres on Google Cloud for typical apps","x":"Enterprise Plus adds data cache and near-zero downtime maintenance. pgvector supported. IAM DB auth and Cloud SQL connectors.","v":"arch:gcp:Cloud Run>Connector>Cloud SQL PG>HA standby","eq":["az_pg","aws_rds_pg"],"p":"T6"},"gcp_alloydb":{"k":"I","cl":"gcp","t":"AlloyDB for PostgreSQL","s":"Google's PostgreSQL-compatible engine with disaggregated storage, columnar engine and built-in AI.","hp":"Demanding OLTP + real-time analytics on Postgres","x":"Google cites up to 4x faster OLTP vs standard PG and fast analytics via columnar engine. Read pools, cross-region secondaries. AlloyDB Omni runs anywhere.","code":"gcloud alloydb clusters create c1 --region=us-central1 --password=$PW","v":"arch:gcp:App>Primary,Read pool>Distributed storage","eq" ites.","hp":"When a single managed instance can't meet scale, HA or global needs","x":"Separate compute from storage. Distributed SQL (Spanner, DSQL, Limitless) scales writes but needs schema/txn design care.","v":"cmp:Shared storage=SQL Hyperscale;Aurora;AlloyDB|Scale-out writes=Elastic clusters;Aurora Limitless;Spanner|Serverless=SQL serverless;Aurora Serverless v2;Spanner (PUs)|Global writes=(none GA);Aurora DSQL;Spanner multi-region","p":"T6"},"az_sqldb_hyperscale":{"k":"I","cl":"azure","t":"Azure SQL Database Hyperscale","s":"Azure SQL tier with distributed page servers and log service: up to 128 TB, fast scaling and snapshot backups.","hp":"Large or fast-growing SQL Server-engine databases","x":"Up to 4 HA replicas and 30 named replicas for read scale-out. Near-instant backups, fast restores. Serverless option. Reverse migration possible.","v":"arch:azure:Compute primary,Named replicas>Log service>Page servers>Azure Storage","eq":["aws_aurora","gcp_alloydb"],"p":"T6"},"az_cosmos_pg":{"k":"A","cl":"azure","t":"Azure Cosmos DB for PostgreSQL","s":"Distributed PostgreSQL built on the Citus extension, sharding tables across nodes.","hp":"Existing Citus users needing multi-tenant or real-time analytics scale-out","x":"Microsoft no longer recommends it for new projects: use elastic clusters in Azure Database for PostgreSQL instead.","v":"draw:sharding","eq":["aws_aurora_limitless","gcp_spanner"],"p":"T6"},"az_horizondb":{"k":"A","cl":"azure","t":"Azure HorizonDB","s":"New Azure cloud-native PostgreSQL-compatible service with scale-out compute and shared storage.","hp":"Future option for Aurora/AlloyDB-class Postgres on Azure","x":"Announced at Ignite 2025 in preview; not yet for production. Track GA, limits and pricing before planning on it.","v":"arch:azure:App>Primary,Replicas>Shared storage","eq":["aws_aurora","gcp_alloydb"],"p":"T6"},"aws_aurora":{"k":"I","cl":"aws","t":"Amazon Aurora","s":"AWS's MySQL- and PostgreSQL-compatible engine with storage replicated 6 TP and global apps needing strong consistency and 99.999% SLA","x":"Scale in processing units (100 PU = 0.1 node). Editions Standard/Enterprise/Enterprise Plus. Graph, vector and full-text search built in.","code":"gcloud spanner instances create i1 --config=regional-us-central1 --processing-units=100 --description=dev","v":"draw:sharding","eq":["aws_aurora_dsql","az_cosmos_pg"],"p":"T6"},"t6_ha":{"k":"B","cl":"multi","t":"High availability & read replicas","s":"Synchronous standby in another zone for failover; asynchronous read replicas for scaling reads.","hp":"Survive zone failures and offload read traffic","x":"HA standby usually not readable (except Business Critical, Multi-AZ cluster). Replicas lag: read-your-writes needs routing to primary.","v":"draw:replication","p":"T6"},"az_db_zrha":{"k":"I","cl":"azure","t":"Azure zone-redundant HA (SQL, PG, MySQL)","s":"Zone-redundant configurations: standby/replicas in other availability zones with automatic failover.","hp":"Zone-loss resilience for Azure SQL, PostgreSQL and MySQL flexible servers","x":"Azure SQL Business Critical includes readable secondary. PG/MySQL: synchronous standby, failover 60-120s. Read replicas are separate.","v":"draw:region","eq":["aws_rds_multiaz","gcp_cloudsql_ha"],"p":"T6"},"aws_rds_multiaz":{"k":"I","cl":"aws","t":"RDS Multi-AZ deployments","s":"Multi-AZ instance (1 standby, not readable) or Multi-AZ DB cluster (2 readable standbys, faster failover).","hp":"Production HA for RDS databases","x":"Failover via DNS flip: typically 60-120s for instance, under 35s for DB cluster. Aurora handles HA via its replicas.","code":"aws rds modify-db-instance --db-instance-identifier pg1 --multi-az --apply-immediately","v":"draw:replication","eq":["az_db_zrha","gcp_cloudsql_ha"],"p":"T6"},"gcp_cloudsql_ha":{"k":"I","cl":"gcp","t":"Cloud SQL high availability","s":"Regional instance with a standby in another zone using synchronous replication to regional disks.","hp":"Zone-failure protection for Cloud SQL","x":"Failover usually under 60s; Enterprise Plus near-zero downtime maintenance. Read replicas (incl. cross-region) are separate.","code":"gcloud sql instances patch pg1 --availability-type=REGIONAL","v":"draw:region","eq":["az_db_zrha","aws_rds_multiaz"],"p":"T6"},"t6_readreplicas":{"k":"I","cl":"multi","t":"Read replicas & read scale-out","s":"Asynchronous copies serving read-only queries, optionally in other regions.","hp":"Reporting, read-heavy APIs, and as a cross-region DR candidate","x":"RDS/Aurora up to 15 replicas; Azure PG up to 5, MySQL up to 10; Cloud SQL many incl. cascading. Promote a replica for DR.","v":"fan:Primary|Replica 1,Replica 2,Cross-region replica","p":"T6"},"t6_backup_pitr":{"k":"B","cl":"multi","t":"Backups & point-in-time restore (PITR)","s":"Automated full backups plus transaction-log backups let you restore to any second within the retention window.","hp":"Undo bad deploys, accidental deletes or corruption","x":"Restore creates a new server/instance (then repoint the app). Retention ~7-35 days; use long-term retention/AWS Backup for years.","v":"cmp:Default retention=7 days;7 days (0-35);7 days|Max PITR=35 days;35 days;35 days (E+)|Long-term=LTR up to 10 yrs;AWS Backup/snapshots;On-demand/retained|Restore to=New database;New instance;New instance","p":"T6"},"az_db_pitr":{"k":"I","cl":"azure","t":"Azure SQL / PG / MySQL PITR & LTR","s":"Automatic backups with PITR (1-35 days) and Azure SQL long-term retention up to 10 years.","hp":"Restore Azure databases to a point in time or keep compliance backups","x":"Backup storage redundancy LRS/ZRS/GRS. Geo-restore from geo-redundant backups. Hyperscale restores fast via snapshots.","code":"az sql db restore -g rg -s srv1 -n appdb --dest-name appdb_fix --time 2025-11-01T10:00:00Z","v":"draw:dr","eq":["aws_rds_backup","gcp_cloudsql_backup"],"p":"T6"},"aws_rds_backup":{"k":"I","cl":"aws","t":"RDS automated backups & snapshots","s":"Daily snapshots + transaction logs enable PITR (~5 min RPO); manual snapshots kept until deleted.","hp":"Restore RDS/Aurora to any second in retention or from snapshots","x":"Retention 1-35 days. Cross-region automated backup replication. Manual snapshots shareable across accounts. Aurora restores via clones are fast.","code":"aws rds create-db-snapshot --db-instance-identifier pg1 --db-snapshot-identifier pg1-pre-release","v":"draw:dr","eq":["az_db_pitr","gcp_cloudsql_backup"],"p":"T6"},"gcp_cloudsql_backup":{"k":"I","cl":"gcp","t":"Cloud SQL backups & PITR","s":"Automated and on-demand backups plus binlog/WAL-based point-in-time recovery.","hp":"Restore Cloud SQL instances after mistakes","x":"PITR logs 7 days (Enterprise), up to 35 (Enterprise Plus). Retained backups can survive instance deletion. Backup and DR integration.","code":"gcloud sql instances clone pg1 pg1-restore --point-in-time=2025-11-01T10:00:00Z","v":"draw:dr","eq":["az_db_pitr","aws_rds_backup"],"p":"T6"},"t6_pooling":{"k":"I","cl":"multi","t":"Connection pooling & secure connectivity","s":"A pooler multiplexes many short client connections onto a few DB connections.","hp":"Serverless functions or many app pods exhausting max_connections","x":"Postgres connections are heavy (process per conn). Transaction pooling breaks session features (prepared statements, temp tables).","v":"cmp:Pooler=Built-in PgBouncer;RDS Proxy;Managed pooling|Secure connect=Private endpoint;IAM auth + Proxy;Auth Proxy|Secrets=Key Vault / Entra;Secrets Manager;Secret Manager / IAM","p":"T6"},"az_pg_pgbouncer":{"k":"I","cl":"azure","t":"Built-in PgBouncer (Azure PostgreSQL)","s":"PgBouncer bundled with Azure Database for PostgreSQL flexible server, enabled by a server parameter.","hp":"Pool connections from App Service, Functions or AKS without running a pooler","x":"Listens on port 6432; transaction pooling by default. Not on Burstable tier. Survives HA failover with the server.","code":"az postgres flexible-server parameter set -g rg -s pg1 -n pgbouncer.enabled --value true","v":"fanin:App pods,Functions,Jobs|PgBouncer :6432","eq":["aws_rdsproxy","gcp_cloudsql_pooling"],"p":"T6"},"aws_rdsproxy":{"k":"I","cl":"aws","t":"Amazon RDS Proxy","s":"Fully managed connection pooler for RDS and Aurora (MySQL, PostgreSQL, MariaDB, SQL Server).","hp":"Lambda or bursty apps that open many connections","x":"Reuses connections, cuts failover time (up to ~66%), enforces IAM auth with Secrets Manager. Priced per vCPU/ACU of the DB.","code":"aws rds create-db-proxy --db-proxy-name p1 --engine-family POSTGRESQL --auth file://auth.json --role-arn $R","v":"fanin:Lambda,ECS tasks,EC2|RDS Proxy","eq":["az_pg_pgbouncer","gcp_cloudsql_pooling"],"p":"T6"},"gcp_cloudsql_pooling":{"k":"I","cl":"gcp","t":"Cloud SQL managed connection pooling","s":"Built-in connection pooling for Cloud SQL Enterprise Plus instances (PostgreSQL and MySQL).","hp":"Handle connection spikes from Cloud Run/GKE without a pooler sidecar","x":"Newer (2025) Enterprise Plus feature; transaction or session mode. Alternative: run PgBouncer yourself on GKE.","v":"fanin:Cloud Run,GKE pods,Functions|Managed pooler","eq":["az_pg_pgbouncer","aws_rdsproxy"],"p":"T6"},"gcp_cloudsql_authproxy":{"k":"B","cl":"gcp","t":"Cloud SQL Auth Proxy & connectors","s":"Sidecar and language libraries opening IAM-authorized, TLS-encrypted connections to Cloud SQL/AlloyDB.","hp":"Secure connections without IP allowlists or managing certs","x":"Built into Cloud Run via --add-cloudsql-instances. Supports IAM DB auth (no passwords). Not a pooler.","code":"gcloud run deploy api --image $IMG --add-cloudsql-instances=proj:us-central1:pg1","v":"seq:App,Auth Proxy,Cloud SQL|1>2:Local connect|2>3:mTLS + IAM token|3>1:Query results","p":"T6"},"t6_global":{"k":"A","cl":"multi","t":"Global distribution & cross-region DR","s":"Replicate databases across regions for DR or low-latency reads, or run multi-region writes.","hp":"Region-level outage protection or users on several continents","x":"Async geo-replication means RPO > 0 and failover changes endpoints. Multi-region writes need distributed SQL (Spanner, DSQL).","v":"cmp:Geo DR=Failover groups;Aurora Global DB;Cross-region replica|Global writes=(none GA);Aurora DSQL;Spanner multi-region|Typical RPO=Seconds;~1 s;0 (sync)|Endpoint=Listener (auto);Global writer endpt;Same instance","p":"T6"},"az_sqldb_failovergroup":{"k":"I","cl":"azure","t":"Active geo-replication & failover groups","s":"Azure SQL DB/MI geo-secondaries in another region; failover groups add stable read-write/read-only listeners.","hp":"Region-level DR for Azure SQL with no connection-string change","x":"Geo-replication: up to 4 readable secondaries (SQL DB). Failover groups fail over many DBs together; planned (no loss) or forced.","code":"az sql failover-group create -g rg -s srv1 -n fg1 --partner-server srv2 --add-db appdb","v":"draw:dr","eq":["aws_aurora_global","gcp_spanner_multiregion"],"p":"T6"},"aws_aurora_global":{"k":"A","cl":"aws","t":"Aurora Global Database","s":"One primary region plus read-only secondary Aurora clusters in other regions, replicated with typical <1s lag.","hp":"Cross-region DR (RPO ~1s, RTO ~1 min) and local reads worldwide","x":"Managed switchover (no data loss) or failover. Write forwarding lets secondaries send writes to primary. Global writer endpoint.","v":"draw:dr","eq":["az_sqldb_failovergroup","gcp_spanner_multiregion"],"p":"T6"},"gcp_spanner_multiregion":{"k":"A","cl":"gcp","t":"Spanner multi-region configurations","s":"Spanner instances spanning regions with synchronous Paxos replication and 99.999% availability.","hp":"Global OLTP with zero RPO and strongly consistent reads anywhere","x":"Configs like nam6, eur3 or custom; choose leader region near writers. Write latency higher than regional. Geo-partitioning (preview/new).","code":"gcloud spanner instances create g1 --config=nam6 --nodes=1 --description=global","v":"draw:region","eq":["az_sqldb_failovergroup","aws_aurora_global"],"p":"T6"},"t6_pgvector":{"k":"I","cl":"multi","t":"pgvector & AI in relational DBs","s":"Postgres extension storing embeddings with approximate nearest-neighbour indexes (HNSW, IVFFlat).","hp":"RAG and semantic search next to your transactional data, no extra vector DB","x":"Great to millions of vectors; for billions consider dedicated vector services. Watch index memory and build time.","v":"draw:vectorsearch","p":"T6"},"az_pg_vector":{"k":"I","cl":"azure","t":"Azure PostgreSQL vector & AI extensions","s":"pgvector plus pg_diskann (DiskANN index) and the azure_ai extension calling Azure OpenAI from SQL.","hp":"RAG on Azure with embeddings stored in Postgres","x":"DiskANN gives high-recall, disk-friendly indexes at scale. azure_ai generates embeddings in-database.","code":"CREATE EXTENSION vector; CREATE INDEX ON docs USING diskann (embedding vector_cosine_ops);","v":"draw:rag","eq":["aws_pgvector","gcp_alloydb_ai"],"p":"T6"},"aws_pgvector":{"k":"I","cl":"aws","t":"pgvector on Aurora / RDS PostgreSQL","s":"pgvector extension on Aurora PostgreSQL and RDS PostgreSQL, usable as a Bedrock Knowledge Base vector store.","hp":"RAG on AWS keeping vectors in your existing Postgres","x":"HNSW indexes; Aurora Optimized Reads speeds large indexes. Aurora ML can call Bedrock/SageMaker from SQL.","code":"CREATE EXTENSION vector; CREATE INDEX ON docs USING hnsw (embedding vector_cosine_ops);","v":"draw:vectorsearch","eq":["az_pg_vector","gcp_alloydb_ai"],"p":"T6"},"gcp_alloydb_ai":{"k":"I","cl":"gcp","t":"AlloyDB AI","s":"AlloyDB features for gen AI: pgvector with ScaNN index, in-DB embeddings and model calls via Vertex AI.","hp":"High-scale vector search and natural-language queries on operational data","x":"ScaNN index for faster large-scale ANN vs HNSW. google_ml_integration calls Vertex AI models. Also in AlloyDB Omni.","v":"draw:rag","eq":["az_pg_vector","aws_pgvector"],"p":"T6"},"t6_migration":{"k":"I","cl":"multi","t":"Database migration services","s":"Managed tools for full-load + change-data-capture (CDC) migrations, with schema conversion for engine changes.","hp":"Move on-prem/other-cloud databases with minimal downtime","x":"Homogeneous (same engine) is easy; heterogeneous (Oracle→Postgres) needs code/schema conversion. Validate data, rehearse cutover.","v":"flow:Assess>Convert schema>Full load>CDC sync>Validate>Cut over","p":"T6"},"az_dms":{"k":"I","cl":"azure","t":"Azure Database Migration Service","s":"Managed migrations of SQL Server to Azure SQL DB/MI/VM, online or offline, plus some open-source paths.","hp":"SQL Server → Azure SQL with minimal downtime","x":"Driven from portal, PowerShell or CLI (Azure Data Studio extension retired). Use Azure Migrate for assessment; PG has its own migration service.","v":"flow:Assess (Azure Migrate)>DMS>Log replay>Cutover","eq":["aws_dms","gcp_dms"],"p":"T6"},"aws_dms":{"k":"I","cl":"aws","t":"AWS Database Migration Service","s":"Managed full-load + CDC replication between many source/target engines, including DMS Serverless.","hp":"Migrate or continuously replicate DBs into RDS, Aurora, S3, Redshift and more","x":"Replication instances or serverless capacity. Homogeneous migrations use native tools. LOB and data-type settings need care.","code":"aws dms start-replication-task --replication-task-arn $ARN --start-replication-task-type start-replication","v":"flow:Source DB>DMS replication>Target DB|loop","eq":["az_dms","gcp_dms"],"p":"T6"},"aws_dms_sc":{"k":"A","cl":"aws","t":"DMS Schema Conversion","s":"Converts schemas and code (procedures, functions) between engines, e.g. Oracle/SQL Server → Aurora PostgreSQL.","hp":"Heterogeneous migrations with assessment reports","x":"Managed successor to the desktop Schema Conversion Tool (SCT); generative AI assists hard conversions. Manual fixes still expected.","v":"flow:Assessment report>Auto-convert>Gen AI assist>Manual fixes","p":"T6"},"gcp_dms":{"k":"I","cl":"gcp","t":"Database Migration Service (GCP)","s":"Serverless migrations into Cloud SQL and AlloyDB from MySQL, PostgreSQL, SQL Server and Oracle.","hp":"Lift to Cloud SQL/AlloyDB with continuous replication","x":"Native replication for homogeneous moves. Oracle→PostgreSQL conversion workspaces with Gemini assistance. No charge for homogeneous.","v":"flow:Connection profile>Migration job>CDC>Promote","eq":["az_dms","aws_dms"],"p":"T6"},"t6_oracle":{"k":"A","cl":"multi","t":"Oracle Database in hyperscalers","s":"Oracle Exadata and Autonomous Database run by OCI inside Azure, AWS and Google datacenters.","hp":"Move Oracle workloads near cloud apps without re-platforming","x":"Billed via cloud marketplace; counts toward commits. RAC supported (unlike RDS for Oracle). Region availability still growing.","v":"cmp:Service=Oracle DB@Azure;Oracle DB@AWS;Oracle DB@Google|GA=2023-24;2025;2024|Alt managed=SQL MI (migrate);RDS for Oracle;Bare Metal Sol.","p":"T6"},"az_oracledb":{"k":"A","cl":"azure","t":"Oracle Database@Azure","s":"Oracle Exadata and Autonomous Database services in Azure datacenters, managed by OCI.","hp":"Oracle apps moving to Azure with low-latency access from Azure services","x":"Purchased via Azure Marketplace; delegated subnet in VNet. Integrates with Entra, Monitor, Fabric. Limited regions.","v":"arch:azure:Azure apps>VNet>Exadata (OCI-run)","eq":["aws_oracledb","gcp_oracledb"],"p":"T6"},"aws_oracledb":{"k":"A","cl":"aws","t":"Oracle Database@AWS","s":"Exadata Database Service and Autonomous Database on dedicated infrastructure inside AWS regions.","hp":"Oracle RAC/Exadata workloads next to AWS apps","x":"GA 2025 in limited regions. Zero-ETL to Redshift, S3 backups. Otherwise RDS for Oracle (no RAC) or EC2 self-managed.","v":"arch:aws:AWS apps>ODB network>Exadata (OCI-run)","eq":["az_oracledb","gcp_oracledb"],"p":"T6"},"gcp_oracledb":{"k":"A","cl":"gcp","t":"Oracle Database@Google Cloud","s":"Oracle Exadata and Autonomous Database running in Google Cloud regions, operated by OCI.","hp":"Oracle workloads alongside BigQuery and Vertex AI","x":"Bought via Google Cloud Marketplace. Connects to VPC; data usable from BigQuery and Vertex AI. Region list expanding.","v":"arch:gcp:GCP apps>VPC>Exadata (OCI-run)","eq":["az_oracledb","aws_oracledb"],"p":"T6"},"t7_nosql":{"k":"B","cl":"multi","t":"NoSQL data models","s":"Non-relational databases: key-value, document, wide-column, graph, time-series, search and vector stores.","hp":"Pick when access patterns are known, scale is huge or the schema is fluid","x":"Model data around queries, not entities. Few/no joins; denormalize. Most scale horizontally by partition key.","v":"draw:nosql","p":"T7"},"t7_cap":{"k":"I","cl":"multi","t":"CAP & consistency levels","f":"Consistency, Availability, Partition tolerance","s":"Under a network partition a distributed DB must choose consistency or availability; PACELC adds latency.","hp":"Decide how stale a read may be before choosing a DB or setting","x":"Strong = latest write, higher latency. Eventual = fast, may be stale. Session/read-your-writes is the usual sweet spot.","v":"table:Level,Reads see,Latency|Strong,latest write,highest|Bounded,≤ K/T behind,high|Session,own writes,1|Eventual,any order,lowest","p":"T7"},"t7_sharding":{"k":"I","cl":"multi","t":"Partitioning & sharding","s":"Splitting data across nodes by a partition (shard) key so storage and throughput scale out.","hp":"Design keys before launch; a bad key causes hot partitions","x":"Pick high-cardinality, evenly accessed keys (userId, tenantId). Avoid dates/status as key. Cross-partition queries are slow & costly.","v":"draw:sharding","p":"T7"},"t7_access":{"k":"I","cl":"multi","t":"Access-pattern data modeling","s":"Design items/documents from the list of queries the app runs: embed, duplicate, use composite keys.","hp":"Use before creating any DynamoDB/Cosmos/Firestore table","x":"List queries first. Single-table design in DynamoDB; embed vs reference in documents; overload keys like PK=USER#1, SK=ORDER#9.","v":"flow:List queries>Pick PK>Pick sort key>Add indexes>Denormalize>Load test","p":"T7"},"t7_choose":{"k":"B","cl":"multi","t":"Choosing a NoSQL store","s":"Decision guide: match the data shape and query style to the right family of database.","hp":"Quick shortlist before you design or price anything","x":"Default to relational unless scale/latency/flexibility demands NoSQL. Mixing stores (polyglot) adds ops cost.","v":"table:Need,Pick|Lookups by key at any scale,Key-value|JSON per entity,Document|Huge write-heavy rows,Wide-column|Relationships/paths,Graph|Sub-ms reads,1|Similarity search,Vector","p":"T7"},"t7_kvdoc":{"k":"B","cl":"multi","t":"Key-value & document databases","s":"Serverless/managed NoSQL that stores items or JSON documents addressed by a key, scaling to any size.","hp":"Default NoSQL choice for app backends with known access patterns","x":"Single-digit ms at any scale; pay per request or provisioned throughput. Limited queries outside keys/indexes.","v":"cmp:Service=Cosmos DB;DynamoDB;Firestore|Model=Doc + multi-API;Key-value + doc;Document|Billing=RU/s or serverless;On-demand or prov.;Per op + storage|Item max=2 MB;400 KB;1 MiB|Global=Multi-region write;Global tables;Multi-region loc.|Change feed=Change feed;Streams;Listeners/Eventarc","p":"T7"},"az_cosmos":{"k":"B","cl":"azure","t":"Azure Cosmos DB","s":"Globally distributed multi-model NoSQL database with turnkey multi-region replication and SLAs.","hp":"Azure apps needing global low latency, JSON docs or multi-API compatibility","x":"99.999% SLA multi-region. Free tier 1000 RU/s + 25 GB. Partition key is immutable. Also stores vectors for RAG.","code":"az cosmosdb create -n mycosmos -g rg --locations regionName=eastus","v":"arch:azure:App>Cosmos DB account>Database>Container,Partitions","eq":["aws_dynamodb","gcp_firestore"],"p":"T7"},"az_cosmos_apis":{"k":"I","cl":"azure","t":"Cosmos DB APIs","s":"Wire-protocol choices per account: NoSQL (native), MongoDB (RU), Apache Cassandra, Apache Gremlin, Table.","hp":"Lift existing Mongo/Cassandra/Gremlin/Table code with few changes","x":"API is fixed per account. New features land first on NoSQL API. Cosmos DB for PostgreSQL: not for new projects.","v":"hub:Cosmos DB|NoSQL,MongoDB,Cassandra,Gremlin,Table","p":"T7"},"az_cosmos_consistency":{"k":"I","cl":"azure","t":"Cosmos DB consistency levels","s":"Five tunable levels: Strong, Bounded staleness, Session (default), Consistent prefix, Eventual.","hp":"Trade read freshness for latency, availability and RU cost","x":"Strong costs 2x RU for reads and limits multi-region writes. Session gives read-your-writes per client token.","v":"tiers:Strong,Bounded staleness,Session,Consistent prefix,Eventual","p":"T7"},"az_cosmos_ru":{"k":"I","cl":"azure","t":"Request Units, autoscale & serverless","s":"Throughput currency: 1 RU ≈ a 1 KB point read. Provision RU/s (manual/autoscale) or go serverless.","hp":"Size cost: steady load = provisioned; spiky = autoscale; dev/low = serverless","x":"Autoscale scales 10-100% of max RU/s. Serverless bills per RU used, single region. Throttling returns HTTP 429.","v":"bars:Point read 1KB=1,Write 1KB=5,Query small=10,Cross-part query=50","p":"T7"},"az_cosmos_changefeed":{"k":"I","cl":"azure","t":"Cosmos DB change feed","s":"Ordered per-partition log of inserts/updates on a container, consumable by Functions or SDK processors.","hp":"Event-sourcing, materialized views, syncing to search/analytics","x":"Default mode omits deletes (use TTL soft-delete); all-versions-and-deletes mode needs continuous backup.","v":"flow:Write doc>Change feed>Function trigger>Update view","p":"T7"},"aws_dynamodb":{"k":"B","cl":"aws","t":"Amazon DynamoDB","s":"Serverless key-value and document database with single-digit ms latency at any scale.","hp":"AWS default for serverless backends, sessions, carts, IoT and metadata","x":"Item max 400 KB. Query by partition + sort key; scans are costly. Pay per request or provisioned. PITR & TTL built in.","code":"aws dynamodb create-table --table-name t --billing-mode PAY_PER_REQUEST ...","v":"arch:aws:API Gateway>Lambda>DynamoDB>Streams,DAX","eq":["az_cosmos","gcp_firestore"],"p":"T7"},"aws_ddb_capacity":{"k":"I","cl":"aws","t":"DynamoDB on-demand vs provisioned","s":"Capacity modes: on-demand bills per request; provisioned sets RCU/WCU with optional auto scaling.","hp":"On-demand for new/spiky tables; provisioned for steady, predictable load","x":"On-demand prices cut ~50% in Nov 2024, now the default advice. Reserved capacity only for provisioned mode.","v":"gbars:Spiky,Steady|On-demand=3,6|Provisioned=6,3","p":"T7"},"aws_ddb_gsi":{"k":"I","cl":"aws","t":"Global & local secondary indexes","s":"GSIs add alternate partition/sort keys queryable at any time; LSIs share the partition key.","hp":"Serve extra access patterns (e.g. orders by status) without scans","x":"GSIs are eventually consistent, up to 20 per table, own throughput. LSIs only at table creation, 10 GB per key.","v":"tree:Table>GSI by email,GSI by status,LSI by date","p":"T7"},"aws_ddb_streams":{"k":"I","cl":"aws","t":"DynamoDB Streams","s":"Time-ordered change log of item modifications kept 24 hours, consumed by Lambda or Kinesis adapter.","hp":"Trigger workflows, audit, replicate or fan out on writes","x":"24h retention, exactly-once per shard order. Alternative: Kinesis Data Streams for DynamoDB for longer retention.","v":"flow:PutItem>Stream record>Lambda>Downstream","p":"T7"},"aws_ddb_global":{"k":"A","cl":"aws","t":"DynamoDB global tables","s":"Multi-Region, multi-active replicas of a table with automatic replication.","hp":"Active-active apps and Region-level DR with local-latency writes","x":"Default async (last writer wins). Multi-Region strong consistency (MRSC) GA 2025 across 3 Regions. Replicated writes billed.","v":"hub:Global table|us-east-1,eu-west-1,ap-south-1","p":"T7"},"aws_dax":{"k":"A","cl":"aws","t":"DynamoDB Accelerator (DAX)","f":"DAX","s":"In-memory write-through cache cluster API-compatible with DynamoDB for microsecond reads.","hp":"Read-heavy hot keys needing µs latency without app cache logic","x":"Runs in your VPC, node-based pricing. Eventually consistent reads only. Many apps prefer ElastiCache for flexibility.","v":"seq:App,DAX,DynamoDB|1>2:GetItem|2>3:miss: GetItem|3>2:item|2>1:cached item","p":"T7"},"gcp_firestore":{"k":"B","cl":"gcp","t":"Firestore","s":"Serverless document database with real-time listeners, offline mobile/web SDKs and strong consistency.","hp":"GCP/Firebase apps: mobile/web sync, user profiles, chat, app state","x":"Pay per document read/write/delete + storage; free quota daily. Security Rules for client access. Composite indexes needed.","code":"gcloud firestore databases create --location=nam5","v":"tree:Collection>Doc A,Doc B;Doc A>Subcollection","eq":["az_cosmos","aws_dynamodb"],"p":"T7"},"gcp_firestore_modes":{"k":"I","cl":"gcp","t":"Firestore Native vs Datastore mode","s":"Native mode adds real-time and mobile SDKs; Datastore mode keeps the legacy Datastore API for servers.","hp":"Pick Native for new apps; Datastore mode for existing Datastore code","x":"Mode is per database. Editions: Standard and Enterprise (Enterprise adds MongoDB compatibility, richer queries).","v":"table:Option,Real-time,Use for|Native mode,Yes,1|Datastore mode,No,Legacy servers|Enterprise ed.,Varies,Mongo apps","p":"T7"},"t7_mongo":{"k":"I","cl":"multi","t":"MongoDB-compatible document DBs","s":"Managed services that speak the MongoDB wire protocol so existing drivers, ODMs and tools keep working.","hp":"Migrate a MongoDB app to a cloud-native managed service","x":"Compatibility is partial: check unsupported operators, change streams, transactions. MongoDB Atlas is the full-fidelity option.","v":"cmp:Service=DocumentDB (vCore);DocumentDB;Firestore Mongo|Engine=OSS DocumentDB/PG;Aurora-like storage;Firestore|Billing=vCore cluster;Instances or serverless;Per op|Scale out=Sharding;Elastic clusters;Automatic","p":"T7"},"az_cosmos_mongovcore":{"k":"I","cl":"azure","t":"Azure DocumentDB","f":"Formerly Azure Cosmos DB for MongoDB (vCore)","s":"vCore-based MongoDB-compatible service built on the open-source DocumentDB engine (PostgreSQL-based).","hp":"Lift MongoDB workloads to Azure with familiar cluster sizing","x":"Billed per vCore cluster + storage, not RUs. Native vector search, HA replicas, free tier. Separate from Cosmos DB for MongoDB (RU).","v":"arch:azure:App (Mongo driver)>DocumentDB cluster>Shards,HA replica","eq":["aws_documentdb","gcp_firestore_mongo"],"p":"T7"},"aws_documentdb":{"k":"I","cl":"aws","t":"Amazon DocumentDB","f":"with MongoDB compatibility","s":"Managed MongoDB-compatible JSON database with Aurora-style storage replicated 6 ways across 3 AZs.","hp":"AWS home for MongoDB apps without running replica sets yourself","x":"Instance-based, serverless option, or elastic clusters for sharding. Not all MongoDB APIs supported; check compat docs.","code":"aws docdb create-db-cluster --db-cluster-identifier d1 --engine docdb ...","v":"arch:aws:App>Primary,Replicas>Shared storage (3 AZ)","eq":["az_cosmos_mongovcore","gcp_firestore_mongo"],"p":"T7"},"gcp_firestore_mongo":{"k":"I","cl":"gcp","t":"Firestore with MongoDB compatibility","s":"Firestore Enterprise edition exposing a MongoDB-compatible API on serverless Firestore storage.","hp":"Run MongoDB driver code on GCP with zero cluster management","x":"GA 2025. Serverless, multi-region, 99.999% SLA. Billed per operation. Supports a subset of MongoDB APIs.","v":"arch:gcp:App (Mongo driver)>Firestore Enterprise>Multi-region storage","eq":["az_cosmos_mongovcore","aws_documentdb"],"p":"T7"},"x_atlas":{"k":"I","cl":"multi","t":"MongoDB Atlas","s":"MongoDB's own managed service running on Azure, AWS and GCP, with Atlas Search and Vector Search.","hp":"You need full MongoDB features or multi-cloud clusters","x":"Buy via cloud marketplaces to burn commit. Full API fidelity. Clusters span providers. Data leaves your cloud bill.","v":"hub:Atlas|Azure,AWS,GCP","p":"T7"},"t7_widecol":{"k":"I","cl":"multi","t":"Wide-column databases","s":"Sparse tables of rows with dynamic columns, partitioned by row key, built for massive write throughput.","hp":"IoT, telemetry, time series, personalization at TB-PB scale","x":"Model by query, design row keys to avoid hotspots. Cassandra = CQL; Bigtable = HBase API + SQL.","v":"cmp:Service=Managed Cassandra;Keyspaces;Bigtable|API=Apache Cassandra;CQL (Cassandra);HBase + SQL|Ops model=Managed clusters;Serverless;Nodes/autoscale|Latency=ms;ms;single-digit ms","p":"T7"},"az_cassandra_mi":{"k":"A","cl":"azure","t":"Azure Managed Instance for Apache Cassandra","s":"Managed open-source Apache Cassandra data centers deployed into your VNet, hybrid with on-prem rings.","hp":"Run real Cassandra on Azure or extend an on-prem cluster","x":"Pay per VM node. Full Cassandra features. Alternative: Cosmos DB for Apache Cassandra (serverless-ish, RU-based).","v":"arch:azure:On-prem DC>VPN/ExpressRoute>Managed Cassandra DC","eq":["aws_keyspaces","gcp_bigtable"],"p":"T7"},"aws_keyspaces":{"k":"I","cl":"aws","t":"Amazon Keyspaces","f":"for Apache Cassandra","s":"Serverless Apache Cassandra-compatible database; use existing CQL drivers without managing nodes.","hp":"Move Cassandra apps to AWS without cluster ops","x":"On-demand or provisioned capacity. Multi-Region replication. Some Cassandra features (e.g. some UDFs, LWT limits) differ.","v":"arch:aws:App (CQL)>Keyspaces>3-AZ storage","eq":["az_cassandra_mi","gcp_bigtable"],"p":"T7"},"gcp_bigtable":{"k":"I","cl":"gcp","t":"Bigtable","s":"Fully managed wide-column NoSQL store with HBase API, SQL queries and low-latency at PB scale.","hp":"Time series, IoT, ad-tech, ML feature stores on GCP","x":"Billed per node + storage, autoscaling, multi-cluster replication. Row key design is everything. Not for small data.","code":"gcloud bigtable instances create bt1 --cluster-config=id=c1,zone=us-central1-a,nodes=1","v":"table:Row key,cf:temp,cf:hum|dev1#2025-10-01,21,40|dev1#2025-10-02,1,41","eq":["az_cassandra_mi","aws_keyspaces"],"p":"T7"},"t7_cache":{"k":"B","cl":"multi","t":"In-memory caching","s":"Managed Redis-compatible (Valkey/Redis/Memcached) stores holding hot data in RAM for sub-ms access.","hp":"Cut DB load and latency for hot reads, sessions, rate limits, leaderboards","x":"Data is volatile unless persistence/durable service. Size memory for working set. Valkey is the open-source Redis fork.","v":"cmp:Service=Azure Managed Redis;ElastiCache;Memorystore|Engines=Redis Enterprise;Valkey/Redis/Memcached;Valkey/Redis/Memcached|Serverless=No;Yes;No|Durable DB=Persistence;MemoryDB;Persistence","p":"T7"},"az_redis":{"k":"B","cl":"azure","t":"Azure Managed Redis","s":"Redis Enterprise-based cache with modules (Search, JSON, TimeSeries, Bloom) and active geo-replication.","hp":"Azure caching, sessions, vector/semantic cache for LLM apps","x":"GA 2025; tiers Memory/Balanced/Compute/Flash Optimized. Azure Cache for Redis is retiring (Enterprise 2027, others 2028).","code":"az redisenterprise create -n myredis -g rg -l eastus --sku Balanced_B5","v":"arch:azure:App Service>Managed Redis>Azure SQL","eq":["aws_elasticache","gcp_memorystore"],"p":"T7"},"aws_elasticache":{"k":"B","cl":"aws","t":"Amazon ElastiCache","s":"Managed in-memory cache supporting Valkey, Redis OSS and Memcached, node-based or serverless.","hp":"AWS default cache in front of RDS/DynamoDB, sessions and pub/sub","x":"Valkey is ~20% cheaper (nodes) / ~33% cheaper (serverless) than Redis OSS. Cluster mode shards keys. Runs in your VPC.","code":"aws elasticache create-serverless-cache --serverless-cache-name c1 --engine valkey","v":"arch:aws:ECS service>ElastiCache Valkey>Aurora","eq":["az_redis","gcp_memorystore"],"p":"T7"},"aws_elasticache_serverless":{"k":"I","cl":"aws","t":"ElastiCache Serverless","s":"Cache that auto-scales memory and compute with no node sizing; billed per GB-hour and ECPUs.","hp":"Spiky or unknown cache load, quick start without capacity planning","x":"Valkey serverless minimum ~100 MB data billed; Multi-AZ by default. Node-based is cheaper for steady big caches.","v":"draw:autoscale","p":"T7"},"aws_memorydb":{"k":"I","cl":"aws","t":"Amazon MemoryDB","s":"Durable Valkey/Redis OSS-compatible in-memory database with a Multi-AZ transaction log.","hp":"Use Redis data structures as the primary database, not just cache","x":"µs reads, single-digit ms writes. No data loss on failover. Costs more than ElastiCache. Supports vector search.","v":"stack:App,MemoryDB in-memory,Multi-AZ txn log|1","eq":["az_redis","gcp_memorystore"],"p":"T7"},"gcp_memorystore":{"k":"B","cl":"gcp","t":"Memorystore","s":"Managed in-memory service on GCP: Memorystore for Valkey, Redis Cluster, Redis and Memcached.","hp":"GCP caching for Cloud Run/GKE apps, sessions, leaderboards","x":"Connect via Private Service Connect or private IP. Valkey and Redis Cluster scale out with zero-downtime resizing.","code":"gcloud memorystore instances create c1 --location=us-central1 --shard-count=1 ...","v":"arch:gcp:Cloud Run>Memorystore Valkey>Cloud SQL","eq":["az_redis","aws_elasticache"],"p":"T7"},"t7_cacheaside":{"k":"B","cl":"multi","t":"Cache-aside pattern","s":"App reads cache first; on miss it reads the DB, writes the result to cache with a TTL.","hp":"Simplest, most common caching pattern for read-heavy APIs","x":"Always set TTLs; invalidate on write. Watch for stampedes (use locking/jitter). Alternatives: write-through, write-behind.","v":"draw:cacheaside","p":"T7"},"t7_session":{"k":"B","cl":"multi","t":"Session store pattern","s":"Keep user sessions/tokens in a shared Redis/Valkey store so any stateless app instance serves any user.","hp":"Scale web tiers horizontally without sticky sessions","x":"Use TTL = session timeout. Alternatives: DynamoDB/Cosmos with TTL, or signed JWT cookies. Enable HA replicas.","v":"fanin:Pod 1,Pod 2,Pod 3|Redis sessions","p":"T7"},"t7_graph":{"k":"I","cl":"multi","t":"Graph databases","s":"Store nodes and edges to query relationships and multi-hop paths fast (Gremlin, openCypher, GQL, SPARQL).","hp":"Fraud rings, recommendations, knowledge graphs, identity, GraphRAG","x":"Great for deep traversals that would need many SQL joins. Smaller ecosystem; query language choice matters.","v":"cmp:Service=Cosmos DB Gremlin;Neptune;Spanner Graph|Query=Gremlin;Gremlin/openCypher/SPARQL;GQL + SQL|Scale=RU partitions;Instances/serverless;Spanner nodes|Analytics=No;Neptune Analytics;BigQuery graph","p":"T7"},"az_cosmos_gremlin":{"k":"A","cl":"azure","t":"Azure Cosmos DB for Apache Gremlin","s":"Cosmos DB API for property graphs queried with Apache TinkerPop Gremlin, globally distributed.","hp":"Azure graph workloads that need global scale and Cosmos SLAs","x":"Partition graphs carefully: cross-partition traversals cost RUs. Gremlin only, no openCypher.","v":"tree:User>Device,Account;Account>Payment","eq":["aws_neptune","gcp_spannergraph"],"p":"T7"},"aws_neptune":{"k":"I","cl":"aws","t":"Amazon Neptune","s":"Managed graph database for property graphs (Gremlin, openCypher) and RDF (SPARQL).","hp":"Knowledge graphs, fraud, identity graphs, GraphRAG with Bedrock","x":"Neptune Database: instances or serverless, up to 15 read replicas. Integrates with Bedrock Knowledge Bases for GraphRAG.","code":"aws neptune create-db-cluster --db-cluster-identifier g1 --engine neptune","v":"draw:nosql","eq":["az_cosmos_gremlin","gcp_spannergraph"],"p":"T7"},"aws_neptune_analytics":{"k":"A","cl":"aws","t":"Neptune Analytics","s":"In-memory graph analytics engine running algorithms and vector similarity over large graphs in seconds.","hp":"PageRank, community detection, GraphRAG on billions of edges","x":"Load from S3 or Neptune Database. Billed per memory-optimized capacity units. openCypher only.","v":"flow:S3 / Neptune>Load graph>Run algorithms>Results","p":"T7"},"gcp_spannergraph":{"k":"A","cl":"gcp","t":"Spanner Graph","s":"Graph capability inside Spanner using ISO GQL, interoperable with SQL, full-text and vector search.","hp":"Graph queries on globally consistent data already in Spanner","x":"GA 2025. Requires Spanner Enterprise edition. Same Spanner scale, HA and pricing (compute + storage).","v":"stack:GQL queries,SQL tables,Spanner storage|1","eq":["az_cosmos_gremlin","aws_neptune"],"p":"T7"},"t7_timeseries":{"k":"I","cl":"multi","t":"Time-series & log analytics","s":"Stores optimized for timestamped telemetry, metrics and logs with fast ingest and time-window queries.","hp":"IoT telemetry, app logs, metrics, observability and security analytics","x":"Columnar compression, retention tiers, downsampling. Query languages differ: KQL, SQL, InfluxQL/Flux.","v":"cmp:Service=Data Explorer;Timestream;Bigtable + BigQuery|Query=KQL;SQL / InfluxQL;SQL|Model=Columnar;Serverless / Influx;Wide-column + DW|SaaS path=Fabric Eventhouse;—;—","p":"T7"},"az_adx":{"k":"I","cl":"azure","t":"Azure Data Explorer","f":"ADX / Kusto","s":"Fast columnar analytics engine (Kusto) for logs, telemetry and time series queried with KQL.","hp":"Interactive analysis over billions of log/IoT records in seconds","x":"Same engine as Log Analytics and Fabric Eventhouse. Hot cache + cold storage. New projects often start in Fabric RTI.","code":"az kusto cluster create -n adx1 -g rg --sku name=Standard_E8ads_v5 tier=Standard","v":"arch:azure:Event Hubs,IoT Hub>Data Explorer>Grafana,Power BI","eq":["aws_timestream","gcp_ts_bq"],"p":"T7"},"az_eventhouse":{"k":"I","cl":"azure","t":"Fabric Eventhouse","s":"SaaS Kusto databases in Microsoft Fabric Real-Time Intelligence, sharing OneLake.","hp":"Real-time analytics without managing ADX clusters","x":"Capacity-based Fabric billing. Same KQL. Microsoft's strategic direction for new real-time analytics.","v":"flow:Eventstream>Eventhouse>KQL queryset>Real-Time Dashboard","p":"T7"},"aws_timestream":{"k":"I","cl":"aws","t":"Amazon Timestream","s":"Time-series database family: Timestream for LiveAnalytics (serverless) and Timestream for InfluxDB.","hp":"IoT and DevOps metrics needing time-window queries on AWS","x":"LiveAnalytics closed to new customers (June 2025); new workloads use Timestream for InfluxDB.","v":"arch:aws:IoT Core>Timestream>Grafana","eq":["az_adx","gcp_ts_bq"],"p":"T7"},"aws_timestream_influx":{"k":"I","cl":"aws","t":"Timestream for InfluxDB","s":"Managed open-source InfluxDB instances with single-digit ms query latency.","hp":"Run InfluxDB/Telegraf/Grafana stacks without ops","x":"Instance-based pricing, Multi-AZ option. Works with existing InfluxDB clients and Flux/InfluxQL.","v":"flow:Telegraf>InfluxDB>Grafana","p":"T7"},"gcp_ts_bq":{"k":"I","cl":"gcp","t":"Bigtable + BigQuery for time series","s":"GCP has no dedicated TSDB: Bigtable serves low-latency series reads; BigQuery handles analytics.","hp":"Ingest IoT/metrics at scale and analyze with SQL on GCP","x":"Bigtable row key = device#reversed-timestamp. BigQuery time-partitioned tables + ML. Managed Prometheus for metrics.","v":"arch:gcp:Pub/Sub>Dataflow>Bigtable,BigQuery>Looker","eq":["az_adx","aws_timestream"],"p":"T7"},"t7_search":{"k":"I","cl":"multi","t":"Search engines","s":"Inverted-index engines for full-text, faceted, log and hybrid (keyword + vector) search.","hp":"Product search, site search, log analytics, RAG retrieval","x":"Not a system of record: index from a primary DB. Relevance tuning, analyzers and shard sizing matter.","v":"cmp:Service=Azure AI Search;OpenSearch Service;Vertex AI Search|Engine=Microsoft;OpenSearch;Google|Vector=Yes;k-NN;Yes|Log analytics=No;Yes;No","p":"T7"},"aws_opensearch":{"k":"I","cl":"aws","t":"Amazon OpenSearch Service","s":"Managed OpenSearch (and legacy Elasticsearch) clusters for search, logs, observability and vectors.","hp":"Full-text search, log analytics dashboards, vector store for RAG","x":"Domains sized by instances + EBS; UltraWarm/cold tiers. OpenSearch Ingestion pipelines. Fine-grained access control.","code":"aws opensearch create-domain --domain-name logs --engine-version OpenSearch_2.19","v":"arch:aws:Apps,Logs>OpenSearch Ingestion>OpenSearch>Dashboards","eq":["az_aisearch","gcp_vertex_search"],"p":"T7"},"aws_opensearch_serverless":{"k":"I","cl":"aws","t":"OpenSearch Serverless","s":"Serverless collections (search, time series, vector search) billed in OpenSearch Compute Units.","hp":"Spiky or new search/vector workloads without cluster sizing","x":"Default vector store for Bedrock Knowledge Bases. Has a minimum OCU floor; can be pricier than small domains.","v":"draw:autoscale","p":"T7"},"x_elastic":{"k":"I","cl":"multi","t":"Elastic Cloud (Elasticsearch)","s":"Elastic's managed Elasticsearch/Kibana on Azure, AWS and GCP, including serverless projects.","hp":"Need latest Elasticsearch features, ELK stack or Elastic Observability/SIEM","x":"Buy through marketplaces (Azure native integration). Licensed features beyond OpenSearch. Data leaves your cloud account.","v":"hub:Elastic Cloud|Azure,AWS,GCP","p":"T7"},"t7_vector":{"k":"B","cl":"multi","t":"Vector databases for AI","s":"Stores embeddings and finds nearest neighbours (ANN: HNSW, DiskANN, ScaNN, IVF) for semantic search and RAG.","hp":"Ground LLMs in your data, semantic search, recommendations, dedup","x":"Prefer vectors in the DB you already run. Watch recall vs latency, dimensions, filters and hybrid (keyword + vector).","v":"draw:vectorsearch","p":"T7"},"t7_vector_cmp":{"k":"B","cl":"multi","t":"Vector store options by cloud","s":"Side-by-side of the main managed vector stores on each cloud.","hp":"Shortlist a vector store matching your existing data platform","x":"Search services (AI Search, OpenSearch) add hybrid ranking; DB-native vectors avoid a second copy of data.","v":"cmp:Search engine=Azure AI Search;OpenSearch k-NN;Vertex Vector Search|In operational DB=Cosmos DB;MemoryDB/Aurora;AlloyDB/Spanner|Cheap at scale=DiskANN;S3 Vectors;Vector Search|Postgres=pgvector;pgvector;pgvector/ScaNN","p":"T7"},"az_cosmos_vector":{"k":"I","cl":"azure","t":"Cosmos DB vector search","s":"Native vector indexing (DiskANN, quantizedFlat, flat) in Cosmos DB NoSQL with full-text and hybrid search.","hp":"Keep embeddings next to operational JSON data on Azure","x":"Define vector policy at container creation. DiskANN scales to billions. Hybrid search with RRF. RU cost per query.","v":"flow:Embed doc>Store vector field>VectorDistance()>Top-K docs","eq":["aws_s3vectors","gcp_vectorsearch"],"p":"T7"},"aws_s3vectors":{"k":"I","cl":"aws","t":"Amazon S3 Vectors","s":"S3 bucket type storing vector indexes with native similarity queries at very low cost.","hp":"Large, infrequently queried embedding sets; cheap RAG memory","x":"GA Dec 2025; up to ~90% cheaper than DB vector stores. Sub-second (not ms) queries. Integrates with Bedrock KB & OpenSearch.","code":"aws s3vectors create-index --vector-bucket-name vb --index-name i --dimension 1024 ...","v":"tiers:MemoryDB,OpenSearch,S3 Vectors","eq":["az_cosmos_vector","gcp_vectorsearch"],"p":"T7"},"aws_opensearch_knn":{"k":"I","cl":"aws","t":"OpenSearch k-NN vector search","s":"Vector engine in OpenSearch (Faiss, Lucene; HNSW/IVF) with filters and hybrid keyword + vector queries.","hp":"Low-latency RAG retrieval with hybrid ranking on AWS","x":"Quantization and disk-based mode cut memory. Serverless vector collections or domains. Tiers to S3 Vectors.","v":"flow:Embed query>k-NN + BM25>Hybrid rerank>Top-K","p":"T7"},"aws_memorydb_vector":{"k":"A","cl":"aws","t":"MemoryDB vector search","s":"In-memory HNSW/flat vector indexes in MemoryDB for single-digit ms queries at high recall.","hp":"Real-time semantic cache, fraud or recommendation needing fastest vector lookups","x":"Data must fit in RAM, so costly at scale. Also available in ElastiCache for Valkey.","v":"bars:MemoryDB ms=1,OpenSearch ms=20,S3 Vectors ms=300","p":"T7"},"gcp_vectorsearch":{"k":"I","cl":"gcp","t":"Vertex AI Vector Search","s":"Managed ANN service using Google ScaNN for billion-scale, low-latency similarity search with filters.","hp":"GCP RAG, semantic search and recommendations at large scale","x":"Index + deployed endpoint (node-hours billed even idle). Batch or streaming updates. Hybrid with sparse vectors.","code":"gcloud ai index-endpoints deploy-index ENDPOINT --index=INDEX --deployed-index-id=d1 --region=us-central1","v":"arch:gcp:Embeddings>Vector Search index>Endpoint>RAG app","eq":["az_cosmos_vector","aws_s3vectors"],"p":"T7"},"t7_pgvector":{"k":"B","cl":"multi","t":"pgvector & AlloyDB AI","s":"Postgres extension for vector columns and HNSW/IVFFlat indexes; AlloyDB AI adds ScaNN index.","hp":"Add RAG to an app already on PostgreSQL with zero new services","x":"On Azure PG, RDS/Aurora, Cloud SQL, AlloyDB. SQL joins + filters with vectors. Tune m/ef_search; RAM bound.","code":"CREATE INDEX ON docs USING hnsw (embedding vector_cosine_ops);","v":"table:Cloud,Postgres option|Azure,Azure DB for PostgreSQL|AWS,Aurora / RDS|GCP,1","p":"T7"},"t8_vnet":{"k":"B","cl":"multi","t":"Virtual networks","s":"Your private, isolated IP network in the cloud where VMs, containers and private endpoints live.","hp":"First thing to design: every private workload sits in a VNet/VPC","x":"Scope differs: Azure VNet & AWS VPC are regional, GCP VPC is global with regional subnets. Plan non-overlapping CIDRs.","v":"draw:vpc","p":"T8"},"az_vnet":{"k":"B","cl":"azure","t":"Azure Virtual Network","f":"VNet","s":"Regional private network; subnets span all availability zones of the region.","hp":"Host VMs, AKS, App Service VNet integration and private endpoints","x":"Free (peering/gateways cost). 5 IPs reserved per subnet. Default outbound internet access is retiring: use NAT Gateway.","code":"az network vnet create -g rg -n vnet1 --address-prefixes 10.0.0.0/16 --subnet-name app","v":"arch:azure:Internet>Public IP / LB>Subnet app,Subnet data>Private endpoint","eq":["aws_vpc","gcp_vpc"],"p":"T8"},"aws_vpc":{"k":"B","cl":"aws","t":"Amazon VPC","f":"Virtual Private Cloud","s":"Regional virtual network; each subnet lives in one AZ and is public or private by its route table.","hp":"Network for EC2, EKS, RDS, Lambda-in-VPC and endpoints","x":"Free (NAT, endpoints, IPv4 cost). Up to 5 CIDR blocks (raise via quota). 5 IPs reserved per subnet. Default VPC per Region.","code":"aws ec2 create-vpc --cidr-block 10.0.0.0/16","v":"draw:vpc","eq":["az_vnet","gcp_vpc"],"p":"T8"},"gcp_vpc":{"k":"B","cl":"gcp","t":"Google Cloud VPC","s":"Global virtual network: one VPC spans all regions, subnets are regional.","hp":"One network for multi-region apps without peering between regions","x":"Free. Use custom-mode (not auto-mode) VPCs in production. 4 IPs reserved per subnet. Global dynamic routing option.","code":"gcloud compute networks create vpc1 --subnet-mode=custom","v":"arch:gcp:Global VPC>us-central1 subnet,europe-west1 subnet>VMs,GKE","eq":["az_vnet","aws_vpc"],"p":"T8"},"t8_subnets":{"k":"B","cl":"multi","t":"Subnets & route tables","s":"Subnets slice the address space; route tables decide where traffic goes (internet, NAT, firewall, peer).","hp":"Separate tiers (web/app/data) and control the egress path of each","x":"Public subnet = route to internet gateway. Private = route via NAT or firewall. Use user-defined routes on Azure.","v":"cmp:Subnet scope=Region (all AZs);One AZ;Region|Custom routes=UDR route tables;Route tables;VPC routes + tags|Internet path=Public IP / NAT;IGW / NAT GW;External IP / NAT","p":"T8"},"t8_cidr":{"k":"I","cl":"multi","t":"CIDR & IP address planning","s":"Allocating non-overlapping private ranges (RFC 1918) across VNets, regions, accounts and on-prem.","hp":"Plan before building: overlaps block peering, VPN and transit later","x":"Give each VNet a /16-/20 from a central plan (IPAM). Leave room for AKS/EKS pod IPs. Avoid 172.17/16 (Docker).","v":"table:Range,Use|10.0.0.0/16,1|10.1.0.0/16,Spoke B|10.200.0.0/16,On-prem|100.64.0.0/10,Pod CIDR","p":"T8"},"t8_ipv6":{"k":"A","cl":"multi","t":"IPv6 & dual-stack","s":"Running VNets, load balancers and workloads with IPv6 alongside or instead of IPv4.","hp":"Cut public IPv4 charges and exhaustion; reach IPv6-only clients","x":"AWS bills $0.005/h per public IPv4 (since 2024). AWS egress-only IGW; GCP IPv6-only subnets; Azure dual-stack VNets.","v":"cmp:Support=Dual-stack VNets;Dual-stack/IPv6-only;Dual-stack/IPv6-only|IPv4 charge=Public IP fee;Per public IPv4;Per external IP","p":"T8"},"t8_filter":{"k":"B","cl":"multi","t":"Traffic filtering (L3/L4)","s":"Stateful allow/deny rules on IP, port and protocol attached to NICs, instances or subnets.","hp":"Least-privilege network access between tiers and from the internet","x":"Free. Prefer referencing identities (SG ids, ASGs, service accounts, tags) over raw IPs. Default deny inbound.","v":"cmp:Service=NSG;Security groups;VPC firewall rules|Attach to=NIC or subnet;ENI (instance);VPC + tags/SA|Deny rules=Yes;SG no, NACL yes;Yes|Stateful=Yes;SG yes, NACL no;Yes","p":"T8"},"az_nsg":{"k":"B","cl":"azure","t":"Network security groups","f":"NSG","s":"Stateful rule sets (priority 100-4096) on subnets or NICs using IPs, service tags and ASGs.","hp":"Lock down Azure subnets and VMs to required ports and sources","x":"Service tags (e.g. AzureLoadBalancer, Storage). NSG flow logs retiring: use VNet flow logs. Free.","code":"az network nsg rule create -g rg --nsg-name nsg1 -n https --priority 100 --destination-port-ranges 443","v":"table:Pri,Source,Port,Action|100,Internet,443,Allow|200,VNet,22,Allow|4096,Any,Any,1","eq":["aws_sg","gcp_fw"],"p":"T8"},"az_asg":{"k":"I","cl":"azure","t":"Application security groups","f":"ASG","s":"Named groups of NICs used as source/destination in NSG rules instead of IP addresses.","hp":"Write rules like 'web → app on 8080' that survive IP changes","x":"Free. NICs must be in the same VNet. Like AWS SG references or GCP network tags.","v":"flow:Web ASG>NSG rule 8080>App ASG","p":"T8"},"aws_sg":{"k":"B","cl":"aws","t":"Security groups & NACLs","s":"Security groups: stateful allow-rules per ENI. Network ACLs: stateless allow/deny per subnet.","hp":"SGs for nearly everything; NACLs as coarse subnet guardrails","x":"SGs can reference other SGs. NACL rules numbered, need ephemeral return ports. Free. Max 5 SGs per ENI (default).","code":"aws ec2 authorize-security-group-ingress --group-id sg-1 --protocol tcp --port 443 --cidr 0.0.0.0/0","v":"stack:NACL (subnet),Security group (ENI),Instance","eq":["az_nsg","gcp_fw"],"p":"T8"},"gcp_fw":{"k":"B","cl":"gcp","t":"VPC firewall rules & policies","s":"Stateful VPC rules targeting VMs by network tag, secure tag or service account; plus hierarchical policies.","hp":"Filter GCP VM/GKE traffic and enforce org-wide rules from folders","x":"Hierarchical policies (org/folder) > network policies > VPC rules. Implied deny ingress, allow egress. Logging optional.","code":"gcloud compute firewall-rules create allow-https --network=vpc1 --allow=tcp:443 --target-tags=web","v":"tree:Org policy>Folder policy;Folder policy>Network policy,VPC rules","eq":["az_nsg","aws_sg"],"p":"T8"},"t8_lb":{"k":"B","cl":"multi","t":"Load balancing (L4/L7)","s":"Distribute traffic across healthy targets: L4 by IP/port, L7 by HTTP host, path, headers.","hp":"Any service with >1 instance, HA, TLS termination or path routing","x":"L7 for HTTP(S)/gRPC with WAF & TLS; L4 for TCP/UDP, static IPs, extreme throughput. Health checks are critical.","v":"cmp:L7 regional=Application Gateway;ALB;Regional App LB|L4=Load Balancer;NLB;Network LB|L7 global=Front Door;CloudFront + ALB;Global App LB|Appliances=Gateway LB SKU;GWLB;Packet mirroring","p":"T8"},"t8_l4l7":{"k":"B","cl":"multi","t":"L4 vs L7 load balancers","s":"L4 forwards connections without reading them; L7 terminates HTTP and routes on content.","hp":"Pick the layer before picking the service","x":"L7: path/host routing, cookies, WAF, auth. L4: any protocol, lower latency, preserves client IP, static IPs.","v":"draw:lb","p":"T8"},"az_lb":{"k":"I","cl":"azure","t":"Azure Load Balancer","s":"L4 TCP/UDP load balancer (public or internal) with zone redundancy and HA ports.","hp":"Spread TCP/UDP to VMs/VMSS; internal LB for NVAs and private tiers","x":"Standard SKU only (Basic retired Sept 2025). Global tier for cross-region. Closed by default: needs NSG allow.","code":"az network lb create -g rg -n lb1 --sku Standard --frontend-ip-name fe --backend-pool-name be","v":"draw:lb","eq":["aws_nlb","gcp_lb"],"p":"T8"},"az_appgw":{"k":"I","cl":"azure","t":"Azure Application Gateway","s":"Regional L7 load balancer with TLS termination, path/host routing, autoscaling and optional WAF.","hp":"Publish web apps inside a VNet with WAF and URL routing","x":"v2 SKU (v1 retiring Apr 2026). WAF_v2 adds OWASP rules. Ingress for AKS via AGIC or App Gateway for Containers.","code":"az network application-gateway create -g rg -n agw --sku WAF_v2 --vnet-name vnet1 --subnet agw","v":"arch:azure:Users>App Gateway + WAF>/api VMSS,/web App Service","eq":["aws_alb","gcp_lb"],"p":"T8"},"az_agc":{"k":"A","cl":"azure","t":"Application Gateway for Containers","s":"Kubernetes Gateway API-native L7 load balancer for AKS, managed by an ALB controller.","hp":"Modern ingress for AKS with traffic splitting and fast updates","x":"Successor path to AGIC. Supports Gateway API and Ingress, weighted canaries, mTLS. WAF support added 2025.","v":"flow:Gateway API>ALB Controller>App GW for Containers>AKS pods","p":"T8"},"aws_alb":{"k":"B","cl":"aws","t":"Application Load Balancer","s":"L7 HTTP/HTTPS/gRPC load balancer with host/path/header rules, targets EC2, IPs, Lambda or ECS.","hp":"Default front door for web apps and APIs in a VPC","x":"Billed per hour + LCU. ACM certs, OIDC/Cognito auth, WAF. Ingress target for EKS via AWS Load Balancer Controller.","code":"aws elbv2 create-load-balancer --name alb1 --type application --subnets subnet-a subnet-b","v":"arch:aws:Users>ALB>/api ECS,/img Lambda","eq":["az_appgw","gcp_lb"],"p":"T8"},"aws_nlb":{"k":"I","cl":"aws","t":"Network Load Balancer","s":"L4 TCP/UDP/TLS load balancer with static IP per AZ, ultra-low latency and source-IP preservation.","hp":"Non-HTTP protocols, static IPs, extreme scale or PrivateLink services","x":"Millions of req/s. Supports security groups. Required to publish a PrivateLink endpoint service. Billed per NLCU.","code":"aws elbv2 create-load-balancer --name nlb1 --type network --subnets subnet-a subnet-b","v":"draw:lb","eq":["az_lb","gcp_lb"],"p":"T8"},"aws_gwlb":{"k":"A","cl":"aws","t":"Gateway Load Balancer","f":"GWLB","s":"Transparently inserts fleets of third-party virtual appliances (firewalls, IDS) into traffic using GENEVE.","hp":"Scale Palo Alto/Fortinet-style appliances behind one endpoint","x":"Used with GWLB endpoints in route tables. AWS Network Firewall is the managed alternative.","v":"flow:Traffic>GWLB endpoint>GWLB>Appliances>Return","p":"T8"},"gcp_lb":{"k":"I","cl":"gcp","t":"Cloud Load Balancing","s":"Family of global and regional L7 (Application) and L4 (proxy/passthrough Network) load balancers.","hp":"One anycast IP serving users worldwide with cross-region failover","x":"Global external App LB: anycast IP, Cloud CDN, Cloud Armor, IAP. Internal variants for private services. Billed per rule + GB.","code":"gcloud compute forwarding-rules create fr1 --global --target-https-proxy=p1 --ports=443","v":"arch:gcp:Users>Anycast IP>Global App LB>us backend,eu backend","eq":["az_appgw","aws_alb"],"p":"T8"},"t8_edge":{"k":"B","cl":"multi","t":"Global edge & CDN","s":"Edge networks that cache content, terminate TLS near users and route over the provider backbone.","hp":"Speed up global web apps, offload origins, absorb DDoS at the edge","x":"Cache static assets with long TTLs + versioned names. Edge WAF/DDoS. Egress from CDN is usually cheaper than origin.","v":"cmp:Service=Front Door;CloudFront;Cloud CDN|Includes=L7 LB + CDN + WAF;CDN + Functions;CDN on global LB|Edge code=Rules engine;CF Functions/L@E;Service Extensions|Static IP accel=—;Global Accelerator;Anycast LB IP","p":"T8"},"t8_cdncache":{"k":"B","cl":"multi","t":"How a CDN works","s":"Edge PoPs cache responses keyed by URL/headers; misses go to the origin, hits return in ms.","hp":"Understand caching headers, TTLs and invalidation","x":"Use Cache-Control and immutable hashed filenames. Invalidations cost time/money. Private content via signed URLs/cookies.","v":"draw:cdn","p":"T8"},"az_frontdoor":{"k":"B","cl":"azure","t":"Azure Front Door","s":"Global L7 entry point combining anycast load balancing, CDN caching, TLS and WAF.","hp":"Global web apps/APIs needing failover across regions + caching","x":"Standard/Premium tiers (Premium: managed WAF rules, Private Link origins). Classic retiring 2027; Azure CDN (classic) retiring.","code":"az afd profile create -g rg --profile-name fd1 --sku Premium_AzureFrontDoor","v":"arch:azure:Users>Front Door edge>East US app,West EU app","eq":["aws_cloudfront","gcp_cdn"],"p":"T8"},"aws_cloudfront":{"k":"B","cl":"aws","t":"Amazon CloudFront","s":"Global CDN with 600+ PoPs caching content from S3, ALB or any origin, with edge compute and WAF.","hp":"Serve static sites/SPAs from S3 and accelerate APIs worldwide","x":"Always-free 1 TB/month out. Use Origin Access Control for private S3. Free ACM certs (must be us-east-1).","code":"aws cloudfront create-distribution --origin-domain-name mybucket.s3.amazonaws.com","v":"arch:aws:Users>CloudFront>S3,ALB","eq":["az_frontdoor","gcp_cdn"],"p":"T8"},"aws_cf_edgecode":{"k":"I","cl":"aws","t":"CloudFront Functions & Lambda@Edge","s":"Edge code: CloudFront Functions (JS, sub-ms, viewer events) or Lambda@Edge (Node/Python, more power).","hp":"Header rewrites, redirects, auth checks, A/B routing at the edge","x":"Functions: cheapest, no network calls. Lambda@Edge: network & body access, deployed from us-east-1. KeyValueStore for config.","v":"seq:Viewer,Edge fn,Cache,Origin|1>2:request|2>3:rewritten req|3>4:miss|4>1:response","p":"T8"},"gcp_cdn":{"k":"I","cl":"gcp","t":"Cloud CDN","s":"Google edge caching enabled on the global external Application Load Balancer backends or buckets.","hp":"Cache static and dynamic content for GCP-hosted apps worldwide","x":"Turn on per backend service/bucket. Signed URLs/cookies. Media CDN for large-scale video streaming.","code":"gcloud compute backend-services update be1 --global --enable-cdn","v":"draw:cdn","eq":["az_frontdoor","aws_cloudfront"],"p":"T8"},"aws_globalaccel":{"k":"I","cl":"aws","t":"AWS Global Accelerator","s":"Two static anycast IPs that route TCP/UDP over the AWS backbone to the nearest healthy regional endpoint.","hp":"Non-HTTP or static-IP global apps needing fast regional failover","x":"No caching. Endpoints: ALB, NLB, EC2, EIP. Failover in seconds (vs DNS TTLs). Hourly + premium data transfer fee.","v":"arch:aws:Users>Anycast IPs>us-east-1 NLB,eu-west-1 NLB","eq":["az_frontdoor","gcp_lb"],"p":"T8"},"t8_dns":{"k":"B","cl":"multi","t":"DNS","s":"Managed authoritative DNS (public and private zones) with health checks and traffic routing policies.","hp":"Name services, route users by latency/geo/weight, fail over regions","x":"100% SLA on all three. Low TTLs speed failover but add queries. Private zones resolve endpoints inside VNets.","v":"cmp:Service=Azure DNS;Route 53;Cloud DNS|Routing=Traffic Manager;Built-in policies;Routing policies|Private zones=Private DNS zones;Private hosted zones;Private zones|Hybrid=DNS Private Resolver;Route 53 Resolver;DNS forwarding","p":"T8"},"az_dns":{"k":"B","cl":"azure","t":"Azure DNS","s":"Hosts public and private DNS zones on Microsoft's anycast name servers.","hp":"Host your domains and private endpoint zones on Azure","x":"Billed per zone + queries. Alias records to Azure resources. Private DNS zones linked to VNets. DNSSEC for public zones.","code":"az network dns zone create -g rg -n example.com","v":"flow:Client>Resolver>Azure DNS>IP","eq":["aws_route53","gcp_dns"],"p":"T8"},"az_trafficmgr":{"k":"I","cl":"azure","t":"Azure Traffic Manager","s":"DNS-based traffic routing: priority, weighted, performance, geographic, multivalue, subnet.","hp":"Fail over or spread traffic across regions for non-HTTP endpoints","x":"Only answers DNS; clients connect directly. Failover bound by TTL. For HTTP prefer Front Door.","v":"fan:Traffic Manager|East US,West Europe,On-prem","p":"T8"},"az_dnsresolver":{"k":"I","cl":"azure","t":"Azure DNS Private Resolver","s":"Managed inbound/outbound DNS endpoints to resolve between on-prem and Azure private zones.","hp":"Hybrid name resolution without custom DNS VMs","x":"Inbound endpoint for on-prem → Azure; outbound + forwarding rulesets for Azure → on-prem. Deploy in hub VNet.","v":"arch:azure:On-prem DNS>Inbound endpoint>Private DNS zones","p":"T8"},"aws_route53":{"k":"B","cl":"aws","t":"Amazon Route 53","s":"Highly available DNS, domain registration and health checks with rich routing policies.","hp":"Host AWS domains, alias to ALB/CloudFront, multi-Region failover","x":"100% SLA. Alias records are free for AWS targets. $0.50 per hosted zone/month. Private hosted zones per VPC.","code":"aws route53 create-hosted-zone --name example.com --caller-reference $(date +%s)","v":"flow:Client>Route 53>Health check>Healthy endpoint","eq":["az_dns","gcp_dns"],"p":"T8"},"aws_r53_policies":{"k":"I","cl":"aws","t":"Route 53 routing policies","s":"Simple, weighted, latency, failover, geolocation, geoproximity, multivalue and IP-based routing.","hp":"Blue/green by weight, active-passive DR, per-country routing","x":"Pair with health checks. Failover speed limited by TTL and resolver caching. Policies combine via nested records.","v":"table:Policy,Use|Weighted,Canary / blue-green|Latency,1|Failover,Active-passive DR|Geolocation,Compliance by country","p":"T8"},"aws_r53_resolver":{"k":"I","cl":"aws","t":"Route 53 Resolver endpoints","s":"Inbound/outbound resolver endpoints and forwarding rules for hybrid DNS, plus DNS Firewall.","hp":"Resolve on-prem names from VPCs and VPC names from on-prem","x":"Billed per endpoint ENI-hour. Share rules across accounts with RAM. DNS Firewall blocks exfiltration domains.","v":"arch:aws:VPC>Outbound endpoint>On-prem DNS","p":"T8"},"gcp_dns":{"k":"B","cl":"gcp","t":"Cloud DNS","s":"Managed authoritative DNS with public, private, forwarding and peering zones plus routing policies.","hp":"Host domains and private names for GCP VPCs and GKE","x":"100% SLA. Routing policies: weighted, geolocation, failover with health checks. DNSSEC. Response policies.","code":"gcloud dns managed-zones create z1 --dns-name=example.com. --description=prod","v":"tree:Cloud DNS>Public zone,Private zone,Forwarding zone","eq":["az_dns","aws_route53"],"p":"T8"},"t8_private":{"k":"B","cl":"multi","t":"Private access to PaaS","s":"Reach managed services (storage, DBs, AI APIs) over private IPs instead of public endpoints.","hp":"Compliance or zero-trust: no PaaS traffic over the internet","x":"Private endpoints need private DNS zones to resolve correctly. Disable public network access after cutover.","v":"cmp:Private endpoint=Private Link;Interface endpoint;PSC endpoint|Free option=Service endpoints;Gateway endpoints;Private Google Access|Publish own svc=Private Link service;Endpoint service (NLB);PSC service attachment","p":"T8"},"t8_privatelink_how":{"k":"I","cl":"multi","t":"How private endpoints work","s":"A NIC with a private IP in your subnet maps to one service instance; DNS rewrites its name to that IP.","hp":"Debug 'works from internet, fails from VNet' DNS issues","x":"Most bugs are DNS: link the private zone (privatelink.*) to every VNet that resolves it, including hub/on-prem forwarders.","v":"draw:privatelink","p":"T8"},"az_privatelink":{"k":"I","cl":"azure","t":"Azure Private Link","s":"Private endpoints give PaaS resources (Storage, SQL, Cosmos, OpenAI) a private IP in your VNet.","hp":"Lock Azure PaaS to your network and on-prem via VPN/ER","x":"Billed per endpoint hour + GB. Needs privatelink.* Private DNS zones. Private Link service exposes your own LB-backed apps.","code":"az network private-endpoint create -g rg -n pe1 --subnet $SUBNET_ID --private-connection-resource-id $ID ...","v":"draw:privatelink","eq":["aws_privatelink","gcp_psc"],"p":"T8"},"az_svcendpoint":{"k":"I","cl":"azure","t":"VNet service endpoints","s":"Extend a subnet's identity to Azure services so their firewall can allow it; traffic stays on backbone.","hp":"Cheap, simple PaaS lock-down when on-prem access isn't needed","x":"Free. Service keeps its public IP. Not reachable from on-prem or peered VNets. Private Link is preferred.","v":"flow:Subnet>Service endpoint>Storage firewall allows subnet","p":"T8"},"aws_privatelink":{"k":"I","cl":"aws","t":"AWS PrivateLink","s":"Interface VPC endpoints (ENIs) for AWS services, SaaS and your own NLB-fronted endpoint services.","hp":"Call AWS APIs or partner SaaS privately from VPCs without NAT","x":"Interface endpoints billed per AZ-hour + GB. Enable private DNS. Expose services cross-account without peering.","code":"aws ec2 create-vpc-endpoint --vpc-endpoint-type Interface --service-name com.amazonaws.us-east-1.sqs ...","v":"draw:privatelink","eq":["az_privatelink","gcp_psc"],"p":"T8"},"aws_vpce_gateway":{"k":"B","cl":"aws","t":"Gateway VPC endpoints (S3, DynamoDB)","s":"Free route-table targets that send S3 and DynamoDB traffic privately, bypassing NAT gateways.","hp":"Cut NAT data-processing costs for S3/DynamoDB heavy workloads","x":"Free. Same-Region only. Not reachable from on-prem (use S3 interface endpoint). Restrict with endpoint policies.","code":"aws ec2 create-vpc-endpoint --vpc-id vpc-1 --service-name com.amazonaws.us-east-1.s3 --route-table-ids rtb-1","v":"flow:Private subnet>Route table>Gateway endpoint>S3","p":"T8"},"gcp_psc":{"k":"I","cl":"gcp","t":"Private Service Connect","f":"PSC","s":"Private endpoints in your VPC for Google APIs, managed services (Cloud SQL, Vertex AI) and published services.","hp":"Private, IP-overlap-safe access to Google and partner services","x":"Endpoint forwarding rules or PSC backends. Producers publish via service attachments. Replaces many peering setups.","code":"gcloud compute forwarding-rules create psc1 --global --network=vpc1 --target-google-apis-bundle=all-apis ...","v":"draw:privatelink","eq":["az_privatelink","aws_privatelink"],"p":"T8"},"gcp_pga":{"k":"B","cl":"gcp","t":"Private Google Access","s":"Subnet setting letting VMs without external IPs reach Google APIs (Storage, BigQuery) over Google's network.","hp":"Private VMs/GKE nodes need Google APIs without NAT","x":"Free, per subnet toggle. Use private.googleapis.com / restricted.googleapis.com with VPC Service Controls.","code":"gcloud compute networks subnets update s1 --region=us-central1 --enable-private-ip-google-access","v":"flow:Private VM>Subnet PGA on>Google APIs","p":"T8"},"t8_hybrid":{"k":"I","cl":"multi","t":"Hybrid connectivity","s":"Link on-prem or other clouds to your VNets: encrypted VPN over internet or private dedicated circuits.","hp":"Data center extension, migrations, multi-cloud, branch connectivity","x":"VPN: fast to set up, ~1-3 Gbps/tunnel, internet jitter. Dedicated: predictable, 10-100+ Gbps, weeks to provision.","v":"cmp:VPN=VPN Gateway;Site-to-Site VPN;HA VPN|Dedicated=ExpressRoute;Direct Connect;Interconnect|Cross-cloud=ER + partner;DX + partner;Cross-Cloud Interconnect|Routing=BGP;BGP;Cloud Router BGP","p":"T8"},"az_vpngw":{"k":"I","cl":"azure","t":"Azure VPN Gateway","s":"Managed IPsec/IKE gateway for site-to-site, point-to-site (users) and VNet-to-VNet tunnels with BGP.","hp":"Quick encrypted link to offices/DCs, remote developer access","x":"Use AZ SKUs (VpnGw1AZ+); active-active for HA. Deploy in GatewaySubnet. Billed per hour + egress. Can back up ExpressRoute.","code":"az network vnet-gateway create -g rg -n vpngw --vnet vnet1 --sku VpnGw2AZ --public-ip-addresses ip1","v":"arch:azure:Office router>IPsec tunnel>VPN Gateway>VNet","eq":["aws_vpn","gcp_vpn"],"p":"T8"},"az_expressroute":{"k":"A","cl":"azure","t":"Azure ExpressRoute","s":"Private dedicated circuit (50 Mbps-10 Gbps, Direct up to 100 Gbps) from a provider into Microsoft's network.","hp":"Predictable bandwidth/latency for hybrid production or large migrations","x":"Not encrypted
