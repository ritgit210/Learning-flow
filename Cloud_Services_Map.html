nds and customizes Control Tower accounts from Git-defined requests.","hp":"GitOps-style account vending with per-account baseline customizations","x":"Account requests in a Git repo trigger CodePipeline; global + account-level Terraform customizations. Alt: CfCT (CloudFormation).","v":"flow:Git request>AFT pipeline>Control Tower>New account>Customize","p":"T15"},"gcp_landingzone":{"k":"I","cl":"gcp","t":"Google Cloud landing zone","f":"Google Cloud Setup, Cloud Foundation Fabric / FAST, terraform-example-foundation","s":"Google's guided org foundation: hierarchy, IAM groups, shared VPC, logging, org policies (Terraform).","hp":"Build a governed GCP org with folders, shared VPC and central logging","x":"Console 'Google Cloud Setup' for small orgs; Cloud Foundation Fabric FAST stages (bootstrap, resman, networking, security) for enterprise.","code":"terraform -chdir=fast/stages/0-bootstrap apply","v":"flow:Bootstrap>Resource mgmt>Security>Networking>Project factory","eq":["az_landingzone","aws_controltower"],"p":"T15"},"t15_inventory":{"k":"I","cl":"multi","t":"Inventory & config compliance","s":"Query every resource across accounts and track config changes and rule compliance over time.","hp":"'What runs where, who changed it, is it compliant?' across the whole estate","x":"Inventory = current state + history. Config rules = detective guardrails. Export to a warehouse for reporting.","v":"cmp:Service=Resource Graph;AWS Config;Asset Inventory|Query=KQL;SQL (advanced query);search/export API|History=Change analysis;Config timeline;35-day history|Rules=Azure Policy;Config rules;SCC posture","p":"T15"},"az_resourcegraph":{"k":"I","cl":"azure","t":"Azure Resource Graph","s":"Fast KQL query service over all Azure resources and their properties across subscriptions and tenants.","hp":"Find all public IPs, untagged resources or VM SKUs across 100s of subscriptions","x":"Free. Tables: Resources, ResourceContainers, PolicyResources, resourcechanges (14 days). Used by portal and Azure Policy.","code":"az graph query -q \"Resources | summarize count() by type\"","v":"fanin:Sub A,Sub B,Sub C|Resource Graph","eq":["aws_config","gcp_assetinv"],"p":"T15"},"aws_config":{"k":"I","cl":"aws","t":"AWS Config","s":"Records resource configuration items and evaluates them against managed or custom rules.","hp":"Audit trail of config changes + detective compliance checks per account/region","x":"Priced per config item recorded + rule evaluation. Aggregators give org-wide view. Auto-remediation via SSM Automation.","code":"aws configservice describe-compliance-by-config-rule","v":"flow:Resource change>Config item>Rule eval>Compliant?>Remediate","eq":["az_resourcegraph","gcp_assetinv"],"p":"T15"},"aws_config_packs":{"k":"A","cl":"aws","t":"Config rules & conformance packs","s":"Managed rules (e.g. s3-bucket-public-read-prohibited) or custom (Lambda/Guard), bundled into deployable packs.","hp":"Deploy a CIS / PCI / operational best-practice rule set org-wide in one go","x":"Conformance packs are YAML templates of rules + remediations; deployable to all accounts via Organizations.","code":"aws configservice put-conformance-pack --conformance-pack-name cis --template-s3-uri s3://b/cis.yaml","v":"fan:Conformance pack|Rule 1,Rule 2,Rule 3,Remediation","p":"T15"},"gcp_assetinv":{"k":"I","cl":"gcp","t":"Cloud Asset Inventory","s":"Searchable inventory and 35-day history of GCP resources and IAM policies across org, folders and projects.","hp":"Find resources/IAM bindings org-wide; stream changes to Pub/Sub; export to BigQuery","x":"Free. search-all-resources / search-all-iam-policies; real-time feeds; analyze IAM policy ('who can access what').","code":"gcloud asset search-all-resources --scope=organizations/123 --asset-types=compute.googleapis.com/Instance","v":"fan:Asset Inventory|Search,Export to BQ,Pub/Sub feed,IAM analysis","eq":["az_resourcegraph","aws_config"],"p":"T15"},"t15_compliance":{"k":"I","cl":"multi","t":"Compliance frameworks & audit evidence","s":"Map cloud controls to standards (ISO 27001, SOC 2, PCI DSS, HIPAA, FedRAMP) and gather audit evidence.","hp":"Preparing for an audit or operating in a regulated industry","x":"Provider attestations cover their side (shared responsibility); you prove your side with posture tools + evidence.","v":"cmp:Posture=Defender reg. comp.;Security Hub CSPM;SCC compliance|Evidence=Purview Compl. Mgr;Audit Manager;Audit Manager (GCP)|Reports=Service Trust Portal;AWS Artifact;Compliance Reports|Sovereign=Sovereign cloud;GovCloud/EU Sov.;Assured Workloads","p":"T15"},"az_regcompliance":{"k":"I","cl":"azure","t":"Defender for Cloud regulatory compliance","s":"Dashboard in Microsoft Defender for Cloud mapping your resources' posture to standards and benchmarks.","hp":"Show compliance % against PCI, ISO, NIST, SOC 2 for Azure, AWS and GCP resources","x":"Microsoft cloud security benchmark on by default; extra standards need Defender CSPM. Reports via Service Trust Portal.","v":"bars:MCSB=82,PCI DSS 4=74,ISO 27001=79,NIST 800-53=68","eq":["aws_auditmanager","gcp_assured"],"p":"T15"},"aws_auditmanager":{"k":"A","cl":"aws","t":"AWS Audit Manager","s":"Continuously collects evidence from AWS services and maps it to prebuilt or custom control frameworks.","hp":"Turn Config/CloudTrail/Security Hub data into audit-ready evidence packages","x":"Frameworks: SOC 2, PCI DSS, HIPAA, GDPR, GenAI best practices. Priced per evidence assessment. Export assessment reports.","v":"flow:Framework>Assessment>Collect evidence>Review>Report","eq":["az_regcompliance","gcp_assured"],"p":"T15"},"aws_artifact_portal":{"k":"B","cl":"aws","t":"AWS Artifact","s":"Self-service portal for AWS compliance reports (SOC, ISO, PCI) and agreements such as the HIPAA BAA.","hp":"Download AWS's attestation reports or accept a BAA for your auditors","x":"Free. Reports cover AWS's side only. Agreements can be accepted org-wide. Third-party ISV reports also available.","v":"fan:AWS Artifact|SOC 2 report,ISO cert,PCI AOC,BAA","p":"T15"},"gcp_assured":{"k":"A","cl":"gcp","t":"Assured Workloads","s":"Folders with enforced compliance control packages: data residency, personnel access, crypto.","hp":"FedRAMP, IL4/5, CJIS, EU sovereign or data-boundary workloads on GCP","x":"Applies org policies + restricted services per package; some packages are premium-priced. Monitors violations.","code":"gcloud assured workloads create --organization=123 --location=us --compliance-regime=FEDRAMP_MODERATE","v":"stack:Workload,Restricted services,Org policies,Data residency,Assured folder|2","eq":["az_regcompliance","aws_auditmanager"],"p":"T15"},"t15_tagging":{"k":"B","cl":"multi","t":"Tagging & cost allocation","s":"Key/value labels (team, env, cost-center, app) on resources so costs and ownership can be attributed.","hp":"Answer 'which team/app spent this?' and automate ops by owner or environment","x":"Azure tags, AWS tags (activate as cost allocation tags), GCP labels (+ tags for IAM). Enforce with policy; not retroactive.","code":"az tag update --resource-id <id> --operation merge --tags team=payments env=prod","v":"cmp:Name=Tags;Tags;Labels|Enforce=Azure Policy;Tag policies + SCP;Org Policy/CI checks|Cost view=Cost analysis;Cost alloc. tags;BQ billing export|Inherit=Policy (RG to res);Not automatic;Project-level labels","p":"T15"},"t15_showback":{"k":"I","cl":"multi","t":"Showback vs chargeback","s":"Showback reports each team's cloud cost; chargeback actually bills it to their budget.","hp":"Make teams accountable for spend without central finance guesswork","x":"Needs tags/accounts per team, shared-cost split rules (networking, support), and unit metrics like cost per order.","v":"flow:Tag/account>Allocate>Split shared>Showback>Chargeback","p":"T15"},"t15_costmgmt":{"k":"B","cl":"multi","t":"Cost management & budgets","s":"Native tools to analyze spend, forecast, set budgets/alerts and export detailed billing data.","hp":"Every account: budget alerts on day 1, then cost analysis and exports","x":"Budgets alert, they do not cap spend. Detailed exports (FOCUS format) feed BI. Anomaly detection catches runaway costs.","v":"cmp:Analyze=Cost analysis;Cost Explorer;Billing reports|Budgets=Cost Mgmt budgets;AWS Budgets;Billing budgets|Anomalies=Anomaly alerts;Cost Anomaly Det.;Anomaly detection|Export=Exports (FOCUS);Data Exports CUR 2;BigQuery export","p":"T15"},"az_costmgmt":{"k":"B","cl":"azure","t":"Microsoft Cost Management","s":"Azure-native cost analysis, budgets, anomaly alerts and scheduled exports across billing scopes.","hp":"Track Azure spend by tag/RG, set budgets and export FOCUS data to storage","x":"Free for Azure. Budgets can trigger action groups. Exports to Blob/ADLS (FOCUS, Parquet). AWS connector was retired in 2025.","code":"az consumption budget create --budget-name team-a --amount 1000 --time-grain monthly --start-date 2025-11-01","v":"flow:Usage>Cost analysis>Budget>Alert>Action group","eq":["aws_costexplorer","gcp_billing"],"p":"T15"},"aws_costexplorer":{"k":"B","cl":"aws","t":"AWS Cost Explorer","s":"Interactive charts and forecasts of AWS cost and usage by service, account, tag or region.","hp":"Find what drove this month's bill and forecast next month","x":"13 months history (up to 38 opt-in), hourly granularity optional. UI free; API $0.01/request. Shows SP/RI coverage.","code":"aws ce get-dimension-values --dimension SERVICE --time-period Start=2025-10-01,End=2025-11-01","v":"gbars:Aug,Sep,Oct|EC2=420,450,510|RDS=200,210,205|S3=60,64,70","eq":["az_costmgmt","gcp_billing"],"p":"T15"},"aws_budgets":{"k":"B","cl":"aws","t":"AWS Budgets","s":"Cost, usage, RI/SP coverage budgets with alerts by email/SNS/Chatbot and optional automated actions.","hp":"Alert at 80% of forecast; auto-apply an SCP or stop instances when exceeded","x":"Budget actions can apply IAM/SCP policies or stop EC2/RDS. Monitoring budgets are free; action budgets have a small fee.","code":"aws budgets create-budget --account-id 111122223333 --budget file://budget.json","v":"bars:Actual=640,Forecast=910,Budget=1000","p":"T15"},"aws_costanomaly":{"k":"I","cl":"aws","t":"AWS Cost Anomaly Detection","s":"ML-based monitors that flag unusual spend by service, account, tag or cost category and find root causes.","hp":"Catch a runaway GPU job or NAT data-transfer spike within a day","x":"Free. Monitors + alert subscriptions (email/SNS, daily or individual). Shows top root-cause dimensions.","v":"flow:Monitor>Baseline>Anomaly>Root cause>Alert","p":"T15"},"aws_dataexports":{"k":"A","cl":"aws","t":"AWS Data Exports (CUR 2.0)","f":"Successor to the legacy Cost and Usage Report","s":"Delivers line-item billing data (CUR 2.0 or FOCUS 1.0) to S3 as Parquet for Athena/QuickSight analysis.","hp":"Build FinOps dashboards or chargeback at resource level","x":"SQL-defined column selection; daily refresh; pair with Athena or CUDOS dashboards. Billing view per org.","v":"flow:Billing data>Data Export>S3 Parquet>Athena>QuickSight","p":"T15"},"gcp_billing":{"k":"B","cl":"gcp","t":"Cloud Billing & budgets","s":"Billing accounts linked to projects, with reports, budgets and threshold alerts by email or Pub/Sub.","hp":"Track GCP spend per project/label and alert at budget thresholds","x":"Budgets alert only; to cap, wire Pub/Sub to a function that disables billing. Anomaly detection and FinOps hub in console.","code":"gcloud billing budgets create --billing-account=0X0X0X --display-name=team-a --budget-amount=1000USD","v":"flow:Usage>Billing account>Budget>Pub/Sub>Function","eq":["az_costmgmt","aws_costexplorer"],"p":"T15"},"gcp_billing_export":{"k":"I","cl":"gcp","t":"Billing export to BigQuery","s":"Streams standard, detailed (resource-level) and pricing billing data into BigQuery datasets.","hp":"Custom cost dashboards in Looker Studio; chargeback by label","x":"Enable early: no backfill before enablement (except limited). Detailed export includes resource names. Query with SQL.","code":"bq query 'SELECT service.description, SUM(cost) FROM billing.gcp_billing_export_v1_X GROUP BY 1'","v":"flow:Cloud Billing>BigQuery>SQL>Looker Studio","p":"T15"},"t15_finops":{"k":"I","cl":"multi","t":"FinOps practice","s":"Cultural and operational practice where engineering, finance and business share ownership of cloud spend.","hp":"When cloud bills grow and nobody owns them","x":"FinOps Foundation phases: Inform, Optimize, Operate. FOCUS = open billing data spec all three clouds export. Unit economics.","v":"flow:Inform>Optimize>Operate|loop","p":"T15"},"t15_advisors":{"k":"B","cl":"multi","t":"Optimization advisors","s":"Built-in recommendation engines for rightsizing, idle resources, security and reliability gaps.","hp":"Quick wins: delete idle, rightsize oversized, buy commitments where steady","x":"Recommendations need human review; act via automation. Also cover security, reliability, performance.","v":"cmp:Service=Azure Advisor;Trusted Advisor;Recommender|Rightsizing=Advisor;Compute Optimizer;VM rightsizing|Pillars=Cost/Sec/Rel/Perf/OE;Cost/Sec/FT/Perf/Lim;Cost/Sec/Perf/Rel|Price=Free;Full needs support;Free (most)","p":"T15"},"az_advisor":{"k":"B","cl":"azure","t":"Azure Advisor","s":"Personalized recommendations for cost, security, reliability, operational excellence and performance.","hp":"Find underused VMs, missing backups, reservation buys in one place","x":"Free. Advisor Score per pillar aligned to Well-Architected. Configurable CPU thresholds for rightsizing. Alerts and digests.","code":"az advisor recommendation list --category Cost -o table","v":"hub:Azure Advisor|Cost,Security,Reliability,Performance,Operational exc.","eq":["aws_trustedadvisor","gcp_recommender"],"p":"T15"},"aws_trustedadvisor":{"k":"B","cl":"aws","t":"AWS Trusted Advisor","s":"Checks accounts against best practices: cost, security, fault tolerance, performance, service limits.","hp":"Spot idle load balancers, open security groups, approaching service quotas","x":"Core checks free; full set + API/Org view needs Business, Enterprise On-Ramp or Enterprise Support.","v":"hub:Trusted Advisor|Cost,Security,Fault tolerance,Performance,Service limits","eq":["az_advisor","gcp_recommender"],"p":"T15"},"aws_computeoptimizer":{"k":"I","cl":"aws","t":"AWS Compute Optimizer","s":"ML-based rightsizing for EC2, Auto Scaling groups, EBS, Lambda, ECS on Fargate and RDS.","hp":"Choose a smaller or Graviton instance type with evidence from CloudWatch metrics","x":"Free (14-day lookback); enhanced infra metrics (93 days) is paid. Also idle resource and license recommendations.","code":"aws compute-optimizer get-ec2-instance-recommendations","v":"bars:Current m5.2xl=100,Rec m7g.xl=46","p":"T15"},"gcp_recommender":{"k":"I","cl":"gcp","t":"Active Assist / Recommender","s":"Recommendations and insights across GCP: idle VMs/disks, rightsizing, CUD buys, IAM least-privilege.","hp":"Delete idle resources, rightsize VMs, trim unused IAM roles","x":"Free for most. Surfaced in console, FinOps hub and Recommender API; export to BigQuery for org-wide tracking.","code":"gcloud recommender recommendations list --location=global --recommender=google.iam.policy.Recommender","v":"fan:Recommender|Idle VMs,Rightsizing,CUD buys,IAM roles","eq":["az_advisor","aws_trustedadvisor"],"p":"T15"},"t15_commit":{"k":"I","cl":"multi","t":"Commitment discounts","s":"Pay less by committing to 1- or 3-year usage or spend; automatic sustained-use discounts on GCP.","hp":"Steady baseline workloads that will run for a year or more","x":"Commit to the steady floor, cover peaks with on-demand/spot. Flexible spend commitments beat instance-specific ones.","v":"cmp:Flexible=Savings plan compute;Compute Savings Plan;Flexible CUD|Specific=Reservations;EC2 SP / RIs;Resource-based CUD|Max off=~72%;~72%;~70%|Auto=None;None;SUDs up to 30%","p":"T15"},"t15_pricingmodels":{"k":"B","cl":"multi","t":"On-demand vs commit vs spot","s":"Three pricing models: pay-as-you-go, discounted commitments, and deep-discount interruptible capacity.","hp":"Choose the pricing model per workload slice","x":"On-demand: flexible, full price. Commit: 30-72% off steady base. Spot: up to ~90% off, can be reclaimed.","v":"draw:pricing","p":"T15"},"aws_reserved_inst":{"k":"I","cl":"aws","t":"Reserved Instances (AWS)","f":"RIs","s":"1/3-year reservations still used for RDS, Aurora, ElastiCache, Redshift, OpenSearch and DynamoDB capacity.","hp":"Discount steady database and cache nodes on AWS","x":"EC2 RIs largely superseded by Savings Plans. Standard vs Convertible. All/partial/no upfront. Sell Standard EC2 RIs on marketplace.","v":"table:Service,Commit type|EC2,Savings Plan|RDS/Aurora,RI|ElastiCache,RI|Redshift,RI","p":"T15"},"t15_migration":{"k":"I","cl":"multi","t":"Migration to the cloud","s":"Discover, assess, plan and move servers, databases and apps from on-premises or other clouds.","hp":"Data center exit or moving workloads between clouds","x":"Discover > assess (TCO, sizing) > choose an R per app > migrate in waves > optimize. DB moves use DMS tools.","v":"cmp:Hub=Azure Migrate;AWS Transform;Migration Center|Servers=Azure Migrate;AWS MGN;Migrate to VMs|Databases=Azure DMS;AWS DMS;Database Migration|Bulk data=Data Box;Snowball/DataSync;Transfer Appliance","p":"T15"},"t15_7rs":{"k":"B","cl":"multi","t":"The 7 Rs of migration","s":"Per-app strategies: Retire, Retain, Rehost, Relocate, Repurchase, Replatform, Refactor.","hp":"Classify every app in the portfolio before planning waves","x":"AWS lists 7 Rs (Gartner's 5 Rs origin); Azure CAF uses similar terms (rehost, refactor, rearchitect, rebuild, replace).","v":"table:Strategy,Effort,Cloud benefit|Rehost,Low,Low|Replatform,Medium,Medium|Refactor,High,1|Repurchase,Medium,Medium","p":"T15"},"t15_rehost":{"k":"B","cl":"multi","t":"Rehost (lift and shift)","s":"Move VMs as-is to cloud IaaS using block-level replication.","hp":"Fast data center exit with minimal change","x":"Quickest; keeps tech debt; optimize later (rightsize, managed DBs). Tools: Azure Migrate, AWS MGN, Migrate to VMs.","v":"flow:Replicate>Test cutover>Cutover>Decommission","p":"T15"},"t15_replatform":{"k":"I","cl":"multi","t":"Replatform (lift and reshape)","s":"Small changes to use managed services, e.g. SQL Server VM to managed SQL, app to containers/PaaS.","hp":"Gain managed-service benefits without a rewrite","x":"E.g. on-prem Postgres to RDS/Cloud SQL, IIS app to App Service, Java app to Cloud Run. Often with DMS.","v":"flow:VM + DB>Container/PaaS>Managed DB","p":"T15"},"t15_refactor":{"k":"A","cl":"multi","t":"Refactor / re-architect","s":"Redesign the app as cloud-native (microservices, serverless, managed data) to gain agility and scale.","hp":"Core apps that need new features, scale or speed of delivery","x":"Highest cost and risk; strangler-fig pattern to migrate incrementally. AI code tools (e.g. AWS Transform) help modernize.","v":"flow:Monolith>Strangler facade>Extract service>Retire monolith","p":"T15"},"t15_otherrs":{"k":"B","cl":"multi","t":"Retire, retain, relocate, repurchase","s":"Retire unused apps, retain some on-prem, relocate VMware as-is, or replace with SaaS.","hp":"Shrink the portfolio before migrating anything","x":"Relocate: Azure VMware Solution, VMware Cloud on AWS / EVS, Google Cloud VMware Engine. Repurchase: move to SaaS.","v":"fan:Portfolio|Retire,Retain,Relocate,Repurchase","p":"T15"},"az_migrate":{"k":"B","cl":"azure","t":"Azure Migrate","s":"Central hub to discover, assess and migrate servers, databases, web apps and VDI to Azure.","hp":"VMware/Hyper-V/physical servers or SQL estates moving to Azure","x":"Agentless discovery appliance; TCO/business case; free tool, replication free first 180 days per instance.","code":"az migrate project create --name mig1 -g rg --location eastus","v":"flow:Discover>Assess>Business case>Replicate>Migrate","eq":["aws_mgn","gcp_migrate"],"p":"T15"},"aws_mgn":{"k":"B","cl":"aws","t":"AWS Application Migration Service","f":"MGN, successor to CloudEndure Migration","s":"Continuous block-level replication of physical, virtual or cloud servers into EC2 for lift-and-shift.","hp":"Rehost servers to AWS with minutes of cutover downtime","x":"Free for 90 days (2,160 hours) per server; replication servers billed. Test launches, post-launch actions, wave planning.","code":"aws mgn start-cutover --source-server-ids s-1234567890abcdef0","v":"flow:Agent>Staging subnet>Test launch>Cutover","eq":["az_migrate","gcp_migrate"],"p":"T15"},"aws_migrationhub":{"k":"I","cl":"aws","t":"AWS Migration Hub","s":"Tracks migrations across tools and offers discovery, strategy recommendations and Orchestrator workflows.","hp":"Portfolio-level tracking of many app migrations on AWS","x":"Discovery agents/collector, Refactor Spaces, Orchestrator templates. AWS is steering new modernization work to AWS Transform.","v":"hub:Migration Hub|Discovery,MGN,DMS,Orchestrator","p":"T15"},"aws_transform":{"k":"A","cl":"aws","t":"AWS Transform","s":"Agentic AI service that plans and executes VMware, mainframe, .NET and Java modernization and migration.","hp":"Modernize legacy .NET Framework or mainframe COBOL with AI agents","x":"GA 2025. Analyzes code/infra, generates wave plans, converts code, rebuilds VMware networks. Human-in-the-loop reviews.","v":"draw:agent","p":"T15"},"gcp_migrate":{"k":"B","cl":"gcp","t":"Migration Center & Migrate to VMs","s":"Migration Center discovers and assesses estates (TCO); Migrate to VMs replicates servers into Compute Engine.","hp":"VMware, AWS, Azure or physical servers moving to GCP","x":"Migration Center free; Migrate to VMs free tool (pay for resources). Migrate to Containers for GKE/Cloud Run.","code":"gcloud migration vms sources list --location=us-central1","v":"flow:Discover>TCO report>Replicate>Test clone>Cut-over","eq":["az_migrate","aws_mgn"],"p":"T15"},"t15_dr":{"k":"I","cl":"multi","t":"Disaster recovery & business continuity","s":"Plans and tooling to restore service after region, zone, data-corruption or ransomware events.","hp":"Any production system with uptime or data-loss commitments","x":"Set RPO/RTO per app, pick a strategy, automate failover, and TEST it. Backups must be isolated/immutable.","v":"draw:dr","p":"T15"},"t15_rporto":{"k":"B","cl":"multi","t":"RPO & RTO","s":"RPO = max acceptable data loss (time); RTO = max acceptable downtime to restore service.","hp":"Translate business impact into recovery targets that drive architecture and cost","x":"Lower RPO/RTO = more replication and standby cost. Define per app tier. Measure in DR drills, not on paper.","v":"flow:Last backup (RPO)>Disaster>Restored (RTO)","p":"T15"},"t15_drstrategies":{"k":"I","cl":"multi","t":"DR strategies","s":"Four strategies trading cost vs RPO/RTO: backup-restore, pilot light, warm standby, active-active.","hp":"Pick the cheapest strategy that meets the app's RPO/RTO","x":"Cost and complexity rise as RTO falls. Mix per tier: e.g. DB warm standby + app pilot light.","v":"table:Strategy,RPO,RTO,Cost|Backup & restore,Hours,Hours-day,Low|Pilot light,Minutes,10s of min,Low-med|Warm standby,Seconds,Minutes,Medium|Active-active,~0,~0,1","p":"T15"},"t15_backuprestore":{"k":"B","cl":"multi","t":"Backup & restore","s":"Regularly back up data and IaC; rebuild everything in another region after a disaster.","hp":"Non-critical apps where hours of downtime are tolerable","x":"Cheapest. Cross-region/immutable backups (Azure Backup, AWS Backup, GCP Backup and DR). IaC is mandatory to rebuild fast.","v":"flow:Backup>Copy cross-region>Disaster>Deploy IaC>Restore","p":"T15"},"t15_pilotlight":{"k":"I","cl":"multi","t":"Pilot light","s":"Core data is replicated live to the DR region; compute is off or minimal until failover.","hp":"Business apps needing tens of minutes RTO at low cost","x":"DB replica running, app tier scaled to zero/off; scale up via IaC/ASG on failover. AWS DRS fits this model.","v":"flow:Live DB replica>Disaster>Start compute>Switch DNS","p":"T15"},"t15_warmstandby":{"k":"I","cl":"multi","t":"Warm standby","s":"A scaled-down but fully working copy runs in the DR region and is scaled up on failover.","hp":"Important apps needing minutes of RTO","x":"Can serve tests/reads continuously; scale out on failover. Higher cost than pilot light.","v":"flow:Small live copy>Disaster>Scale out>Shift traffic","p":"T15"},"t15_activeactive":{"k":"A","cl":"multi","t":"Multi-site active-active","s":"Full capacity in two or more regions serving traffic simultaneously with global routing.","hp":"Mission-critical systems needing near-zero RTO/RPO","x":"Needs multi-region data (Cosmos DB, DynamoDB global tables, Spanner, Aurora DSQL) and conflict handling. Highest cost.","v":"arch:multi:Users>Global LB>Region A,Region B>Multi-region DB","p":"T15"},"t15_multiregion":{"k":"I","cl":"multi","t":"Zones, regions & paired regions","s":"Use availability zones for HA within a region; a second region for DR from regional outages.","hp":"Decide between zone-redundant vs multi-region designs","x":"Azure paired regions; AWS and GCP regions are independent. Watch data residency, replication cost and service availability.","v":"draw:region","p":"T15"},"az_siterecovery":{"k":"I","cl":"azure","t":"Azure Site Recovery","s":"Replicates Azure VMs across regions/zones and on-prem VMware/Hyper-V/physical servers to Azure for failover.","hp":"VM-level DR with orchestrated recovery plans and non-disruptive test failovers","x":"Per protected instance pricing (first 31 days free). Crash-consistent points ~5 min; app-consistent configurable.","code":"az site-recovery protected-item list -g rg --vault-name asr-vault --fabric-name f --protection-container p","v":"flow:Primary VM>Replicate>Recovery points>Failover>Failback","eq":["aws_drs","gcp_backupdr"],"p":"T15"},"aws_drs":{"k":"I","cl":"aws","t":"AWS Elastic Disaster Recovery","f":"DRS, based on CloudEndure Disaster Recovery","s":"Continuous block-level replication of servers into a low-cost AWS staging area with fast launch on failover.","hp":"Pilot-light DR for on-prem or EC2 servers with RPO in seconds","x":"Per source plicit per-task control: rate limit, dedup name, delay","c":"Push-only; for pull or fan-out use Pub/Sub","tree":true},{"id":"9.10","s":"T9","t":"t9_pubsub","sc":"One event must reach many consumers","w":"Broadcast with independent subscriptions","c":"Harder to trace who consumes what","tree":true},{"id":"9.11","s":"t9_pubsub","t":"az_servicebus_topics","sc":"You're on Azure: reliable fan-out of business msgs","w":"Each subscriber gets a durable queue with broker features","c":"Not for millions of telemetry events; use Event Hubs","tree":true},{"id":"9.12","s":"t9_pubsub","t":"aws_sns","sc":"On AWS: fan out events or send alerts","w":"Push to many protocols with filtering, no servers","c":"No persistence of its own; pair with SQS for buffering","tree":true},{"id":"9.13","s":"t9_pubsub","t":"gcp_pubsub","sc":"On GCP: async events, fan-out or ingestion","w":"Global, auto-scaling, both queue and stream semantics","c":"Ordering keys reduce throughput per key","tree":true},{"id":"9.14","s":"gcp_pubsub","t":"gcp_pubsub_export","sc":"Just need events landed in BigQuery/GCS","w":"Removes a whole ingestion pipeline","c":"Limited transforms; complex ETL still needs Dataflow","tree":true},{"id":"9.15","s":"T9","t":"t9_eventrouting","sc":"React to resource or app events without polling","w":"Rule-based push routing from many sources to targets","c":"Rules spread logic; needs good event catalog","tree":true},{"id":"9.16","s":"t9_eventrouting","t":"az_eventgrid","sc":"You're on Azure: react to resource/app events","w":"Native events from most Azure services, push delivery","c":"Not a queue: small events, limited retention","tree":true},{"id":"9.17","s":"az_eventgrid","t":"az_eventgrid_mqtt","sc":"Devices or apps speak MQTT","w":"Managed MQTT pub/sub without running a broker","c":"Different feature set than basic Event Grid topics","tree":true},{"id":"9.18","s":"t9_eventrouting","t":"aws_eventbridge","sc":"On AWS: route service/SaaS/custom events","w":"Content-based filtering, SaaS isioned","tree":true},{"id":"9.28","s":"t9_streaming","t":"gcp_kafka","sc":"On GCP: Kafka apps or Kafka-based ecosystem","w":"Real Kafka APIs, managed ops","c":"Cluster-based cost vs serverless Pub/Sub","tree":true},{"id":"9.29","s":"T9","t":"t9_brokers","sc":"Migrating apps tied to JMS/AMQP brokers","w":"Keep protocols, drop broker ops","c":"Less elastic than serverless queues","tree":true},{"id":"9.30","s":"t9_brokers","t":"aws_mq","sc":"On AWS: apps need ActiveMQ/RabbitMQ protocols","w":"Protocol compatibility with managed patching and HA","c":"Instance-based; scale limits vs SQS/SNS","tree":true},{"id":"9.31","s":"T9","t":"t9_workflow","sc":"A process spans many steps, services or hours","w":"Orchestrator handles state, retries and visibility","c":"Coupling to the orchestrator's DSL","tree":true},{"id":"9.32","s":"t9_workflow","t":"az_logicapps","sc":"You're on Azure: integrate SaaS/enterprise systems","w":"Huge connector library, designer, B2B/EDI","c":"Complex logic gets hard to test and version","tree":true},{"id":"9.33","s":"t9_workflow","t":"az_durable","sc":"You're on Azure and prefer workflows in code","w":"Unit-testable, versioned in git with the app","c":"Determinism rules; replay gotchas","tree":true},{"id":"9.34","s":"t9_workflow","t":"aws_stepfunctions","sc":"On AWS: orchestrate services and Lambdas","w":"Visual, auditable, built-in retries and catches","c":"Per-transition cost adds up at high volume","tree":true},{"id":"9.35","s":"aws_stepfunctions","t":"aws_sfn_express","sc":"Choosing workflow type for volume vs duration","w":"Right type can cut cost by an order of magnitude","c":"Express lacks .sync waits and visual history","tree":true},{"id":"9.36","s":"t9_workflow","t":"gcp_workflows","sc":"On GCP: orchestrate services and APIs","w":"Serverless, cheap, low-latency steps","c":"YAML DSL; heavy data DAGs fit Composer better","tree":true},{"id":"9.37","s":"T9","t":"t9_scheduling","sc":"Something must run on a schedule","w":"Serverless cron, no idle VM","c":"At-least-once firing; design for duplicates","tree":true},{"id":"9.38","s":"t9_scheduling","t":"az_timer","sc":"You're on Azure: periodic code or workflow","w":"Built in to Functions/Logic Apps, no extra service","c":"No central schedule inventory","tree":true},{"id":"9.39","s":"t9_scheduling","t":"aws_eb_scheduler","sc":"On AWS: cron or one-time scheduled actions","w":"Scales to millions of schedules with universal targets","c":"Minute granularity","tree":true},{"id":"9.40","s":"t9_scheduling","t":"gcp_scheduler","sc":"On GCP: run something on a cron","w":"Simple managed cron with auth to targets","c":"No one-time jobs; use Cloud Tasks for those","tree":true},{"id":"9.41","s":"T9","t":"t9_apimgmt","sc":"Clients or partners call your APIs","w":"Central security, throttling and visibility","c":"Extra hop latency and a cost line","tree":true},{"id":"9.42","s":"t9_apimgmt","t":"az_apim","sc":"You're on Azure: publish and govern APIs","w":"Policies, portal, versioning, hybrid gateways","c":"Classic tiers slow to provision; Premium expensive","tree":true},{"id":"9.43","s":"az_apim","t":"az_apim_aigateway","sc":"Many apps share LLM endpoints","w":"Quotas per team, failover, caching and usage tracking","c":"Policy tuning needed for streaming responses","tree":true},{"id":"9.44","s":"t9_apimgmt","t":"aws_apigw","sc":"On AWS: expose Lambda/services as APIs","w":"Serverless, scales to zero, deep AWS auth","c":"Per-request cost hurts at very high volume","tree":true},{"id":"9.45","s":"aws_apigw","t":"aws_apigw_types","sc":"Deciding which API Gateway flavor to use","w":"Feature/cost trade-off is significant","c":"Migrating REST to HTTP later is not automatic","tree":true},{"id":"9.46","s":"t9_apimgmt","t":"aws_appsync","sc":"On AWS: GraphQL or real-time subscriptions","w":"Managed schema, resolvers and WebSockets","c":"Resolver logic (JS/VTL) has its own learning curve","tree":true},{"id":"9.47","s":"t9_apimgmt","t":"gcp_apigee","sc":"On GCP: enterprise-grade API management","w":"Deep policies, analytics, monetization","c":"Costly and complex for small teams","tree":true},{"id":"9.48","s":"t9_apimgmt","t":"gcp_apigw","sc":"On GCP: simple gateway for serverless APIs","w":"Cheap, quick, OpenAPI-defined","c":"OpenAPI 2.0 only; limited policies","tree":true},{"id":"9.49","s":"T9","t":"t9_comms","sc":"Your app must notify users","w":"Managed deliverability and carrier integrations","c":"Compliance and sender registration take time","tree":true},{"id":"9.50","s":"t9_comms","t":"az_acs","sc":"You're on Azure: email/SMS/calls in your app","w":"One SDK for many channels","c":"Number availability varies by country","tree":true},{"id":"9.51","s":"az_acs","t":"az_notificationhubs","sc":"You need mobile push notifications on Azure","w":"Abstracts each platform push service","c":"Still need APNs/FCM credentials","tree":true},{"id":"9.52","s":"t9_comms","t":"aws_ses","sc":"On AWS: transactional or bulk email","w":"Very low cost per email, high deliverability tools","c":"Sandbox limits until production access","tree":true},{"id":"9.53","s":"t9_comms","t":"aws_eum","sc":"On AWS: SMS, voice or push to users","w":"Carrier-grade channels with registration tooling","c":"Per-country sender rules and costs","tree":true},{"id":"9.54","s":"t9_comms","t":"gcp_fcm","sc":"On GCP/Firebase: push to mobile and web","w":"Free and widely used, works from any backend","c":"Push only; email/SMS need partners","tree":true},{"id":"9.55","s":"T9","t":"t9_iot","sc":"Thousands of devices send data or need commands","w":"Secure identity, protocols and fleet management","c":"Device firmware and certificate lifecycle are on you","tree":true},{"id":"9.56","s":"t9_iot","t":"az_iothub","sc":"You're on Azure: connect device fleets","w":"Per-device auth, twins, routing to analytics","c":"Per-unit message quotas; plan tier sizing","tree":true},{"id":"9.57","s":"az_iothub","t":"az_dps","sc":"Devices ship without hub-specific config","w":"Automated, secure first-connect","c":"Certificate chain management required","tree":true},{"id":"9.58","s":"t9_iot","t":"az_iotops","sc":"You're on Azure: industrial edge processing","w":"Kubernetes-native edge with OT protocol support","c":"Needs on-prem K8s skills","tree":true},{"id":"9.59","s":"t9_iot","t":"aws_iotcore","sc":"On AWS: connect devices and route telemetry","w":"Rules engine + shadows cut custom code","c":"Pricing per message and connection minute","tree":true},{"id":"9.60","s":"t9_iot","t":"aws_greengrass","sc":"On AWS: compute must run on the device/gateway","w":"Local processing, offline mode, OTA components","c":"Device fleet ops and updates are complex","tree":true},{"id":"9.61","s":"t9_iot","t":"gcp_iot_retired","sc":"On GCP: IoT ingestion today","w":"Partner broker + Pub/Sub replaces the retired service","c":"More integration work than IoT Hub/IoT Core","tree":true},{"id":"9.62","s":"T9","t":"t9_patterns","sc":"Building event/message-driven systems","w":"Patterns prevent lost, duplicated or stuck work","c":"More moving parts than synchronous calls","tree":true},{"id":"9.63","s":"t9_patterns","t":"t9_async","sc":"Request takes long or downstream is unreliable","w":"Loose coupling and independent scaling","c":"Eventual consistency; clients need status polling","tree":true},{"id":"9.64","s":"t9_patterns","t":"t9_idempotency","sc":"Queues/events may redeliver","w":"Duplicates become harmless","c":"Needs a durable dedup store","tree":true},{"id":"9.65","s":"t9_patterns","t":"t9_dlq","sc":"Some messages can never be processed","w":"Prevents infinite retry loops and blocked queues","c":"DLQs are useless without monitoring","tree":true},{"id":"9.66","s":"t9_patterns","t":"t9_saga","sc":"One business operation spans several services","w":"Eventual consistency with explicit rollback","c":"Complex to design and test compensations","tree":true},{"id":"9.67","s":"t9_patterns","t":"t9_outbox","sc":"A DB update must reliably emit an event","w":"Atomic state change + event, no 2PC","c":"Extra table ated option","c":"Cross-engine features vary","tree":true},{"id":"10.10","s":"t10_lakehouse_svc","t":"az_fabric","sc":"You're on Azure: unified analytics/lakehouse","w":"One SaaS, one storage layer, tight Power BI integration","c":"Capacity throttling when workloads compete","tree":true},{"id":"10.11","s":"az_fabric","t":"az_onelake","sc":"Data must be shared across Fabric engines","w":"No copies between Spark, SQL and BI","c":"Governance spans tenant; plan workspaces","tree":true},{"id":"10.12","s":"t10_lakehouse_svc","t":"aws_sm_lakehouse","sc":"On AWS: unified lakehouse over S3 + Redshift","w":"Single catalog and permissions across engines","c":"Newer branding; many moving parts underneath","tree":true},{"id":"10.13","s":"aws_sm_lakehouse","t":"aws_s3tables","sc":"You want managed Iceberg storage on AWS","w":"Maintenance (compaction, cleanup) handled for you","c":"Newer service; check engine support","tree":true},{"id":"10.14","s":"t10_lakehouse_svc","t":"gcp_biglake","sc":"On GCP: open-format lakehouse","w":"Iceberg tables with BigQuery-grade governance","c":"Feature parity with native tables varies","tree":true},{"id":"10.15","s":"t10_lakehouse","t":"t10_tableformats","sc":"Lake data needs updates, deletes, time travel","w":"ACID + schema evolution on cheap storage","c":"Small files and snapshots need compaction","tree":true},{"id":"10.16","s":"t10_lakehouse","t":"t10_medallion","sc":"Designing lake/lakehouse layers","w":"Clear lineage and reprocessing points","c":"Extra storage copies per layer","tree":true},{"id":"10.17","s":"T10","t":"t10_etl","sc":"Data must move from sources to analytics","w":"Managed connectors, scheduling and transforms","c":"Pipelines become critical infra; test them","tree":true},{"id":"10.18","s":"t10_etl","t":"t10_eltetl","sc":"Designing a data pipeline","w":"Where transforms run drives cost and flexibility","c":"ELT can push compute cost into the warehouse","tree":true},{"id":"10.19","s":"t10_eltetl","t":"t10_dbt","sc":"Doing ELT with SQL","w":"Software engineering practices for SQL transforms","c":"Needs an orchestrator for scheduling","tree":true},{"id":"10.20","s":"t10_etl","t":"az_datafactory","sc":"You're on Azure: copy/orchestrate data pipelines","w":"Many connectors, hybrid via self-hosted IR","c":"Data flows spin up Spark: startup latency","tree":true},{"id":"10.21","s":"az_datafactory","t":"az_fabric_df","sc":"Already on Fabric or starting new on Azure","w":"Integration lives next to OneLake and Power BI","c":"Some ADF features still differ","tree":true},{"id":"10.22","s":"t10_etl","t":"aws_glue","sc":"On AWS: serverless ETL and cataloging","w":"No clusters; integrates with the catalog and lake","c":"Spark startup time and DPU cost for small jobs","tree":true},{"id":"10.23","s":"t10_etl","t":"gcp_dataflow","sc":"On GCP: code-based batch/stream pipelines","w":"One Beam model for batch and streaming, fully managed","c":"Beam learning curve","tree":true},{"id":"10.24","s":"t10_etl","t":"gcp_datafusion","sc":"On GCP: visual low-code ETL","w":"No code; reusable pipelines and lineage","c":"Instance cost even when idle","tree":true},{"id":"10.25","s":"T10","t":"t10_spark","sc":"Data too big or complex for SQL alone","w":"Distributed compute for code-based processing","c":"Cluster tuning and cost control needed","tree":true},{"id":"10.26","s":"t10_spark","t":"az_databricks","sc":"You're on Azure: heavy Spark or lakehouse eng","w":"Best-in-class Spark platform, multi-cloud skills","c":"DBU pricing on top of compute","tree":true},{"id":"10.27","s":"t10_spark","t":"aws_emr","sc":"On AWS: Spark/Hadoop at scale","w":"Open-source engines, cheap with Spot","c":"Cluster ops on EC2 mode","tree":true},{"id":"10.28","s":"aws_emr","t":"aws_emr_sls","sc":"Spark jobs run intermittently","w":"No cluster sizing, no idle cost","c":"Less customization than EC2 clusters","tree":true},{"id":"10.29","s":"t10_spark","t":"gcp_dataproc","sc":"On GCP: Spark/Hadoop jobs","w":"Fast, cheap, open-source compatible","c":"Cluster lifecycle is yours unless serverless","tree":true},{"id":"10.30","s":"gcp_dataproc","t":"gcp_spark_sls","sc":"Spark without cluster management on GCP","w":"Autoscaling batches and sessions","c":"Startup latency; fewer tuning knobs","tree":true},{"id":"10.31","s":"T10","t":"t10_lakesql","sc":"Query lake files without loading them","w":"No infra, pay per query","c":"Unoptimized CSV/JSON scans are slow and costly","tree":true},{"id":"10.32","s":"t10_lakesql","t":"az_fabric_sqlep","sc":"You're on Azure: SQL over lakehouse tables","w":"Zero setup, always in sync with Delta tables","c":"Read-only; metadata sync lag possible","tree":true},{"id":"10.33","s":"t10_lakesql","t":"aws_athena","sc":"On AWS: SQL on S3 data","w":"No servers, pay per query","c":"Scans cost; partition and use columnar formats","tree":true},{"id":"10.34","s":"t10_lakesql","t":"gcp_bq_external","sc":"On GCP: query lake files with SQL","w":"No loading; same BigQuery interface","c":"Less performant than native tables","tree":true},{"id":"10.35","s":"T10","t":"t10_cdc","sc":"Analytics needs fresh operational data","w":"Low-latency sync without hurting the source","c":"Schema changes and deletes need careful handling","tree":true},{"id":"10.36","s":"t10_cdc","t":"az_fabric_mirroring","sc":"You're on Azure: live DB copy for analytics","w":"No pipelines; Delta tables ready for every Fabric engine","c":"Source and DDL support limits; check per source","tree":true},{"id":"10.37","s":"t10_cdc","t":"aws_zeroetl","sc":"On AWS: replicate OLTP data to Redshift","w":"Seconds of latency, no ETL jobs","c":"Limited transforms; supported sources only","tree":true},{"id":"10.38","s":"t10_cdc","t":"aws_dms_cdc","sc":"On AWS: CDC from heterogeneous databases","w":"Broad source/target support","c":"Task tuning; not real-time to the second","tree":true},{"id":"10.39","s":"t10_cdc","t":"gcp_datastream","sc":"On GCP: replicate OLTP DBs into BigQuery","w":"Serverless, minimal setup, direct to BigQuery","c":"Source DB log config (binlog/WAL) required","tree":true},{"id":"10.40","s":"T10","t":"t10_stream","sc":"Insights needed in seconds, not hours","w":"Process data as it arrives","c":"Stateful streaming is harder to test and operate","tree":true},{"id":"10.41","s":"t10_stream","t":"az_streamanalytics","sc":"You're on Azure: simple SQL streaming jobs","w":"Low ops, SQL skills suffice","c":"Less flexible than Flink/Spark for complex logic","tree":true},{"id":"10.42","s":"t10_stream","t":"az_fabric_rti","sc":"You're on Azure and on Fabric: real-time analytics","w":"Ingest, query, visualize and alert in one place","c":"KQL is another language to learn","tree":true},{"id":"10.43","s":"t10_stream","t":"aws_flink","sc":"On AWS: stateful stream processing","w":"Real Flink: exactly-once state, event time","c":"Flink expertise needed","tree":true},{"id":"10.44","s":"t10_stream","t":"gcp_dataflow_stream","sc":"On GCP: real-time transformation","w":"Same Beam code as batch; managed state","c":"Always-on workers cost money","tree":true},{"id":"10.45","s":"T10","t":"t10_orch","sc":"Many dependent data jobs must run in order","w":"DAGs, retries, backfills and visibility","c":"Airflow environments have a baseline cost","tree":true},{"id":"10.46","s":"t10_orch","t":"az_adf_pipelines","sc":"You're on Azure: orchestrate data workloads","w":"Low-code DAGs with Azure-native triggers","c":"Complex branching is clunky in JSON/designer","tree":true},{"id":"10.47","s":"t10_orch","t":"aws_mwaa","sc":"On AWS: Airflow without ops","w":"Standard Airflow, AWS operators","c":"Always-on cost even when idle","tree":true},{"id":"10.48","s":"t10_orch","t":"gcp_composer","sc":"On GCP: Airflow-based orchestration","w":"Standard Airflow with Google operators","c":"Environment baseline cost; use Workflows for light cases","tree":true},{"id":"10.49","s":"T10","t":"t10_catalog","sc":"Many teams share data with rules","w":"Discoverability, access control and lineage","c":"Catalogs rot without ownership and curation","tree <script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const N = D.nodes, SHORT = D.short, LEVEL = D.level;
const OUT = {}, PARENT = {}, INTREE = {}, INOTHER = {}, WALKREF = {};
for (const e of D.edges){
  (OUT[e.s] = OUT[e.s] || []).push(e);
  if (e.tree){ PARENT[e.t] = e.s; INTREE[e.t] = e; }
  else (INOTHER[e.t] = INOTHER[e.t] || []).push(e);
}
const WALKE = {};
for (const [k,n] of Object.entries(N)) if (n.k === "step"){ (WALKREF[n.ref] = WALKREF[n.ref] || []).push(k); (WALKE[n.eid] = WALKE[n.eid] || []).push(k); }

const KIND = {S:"Topic", B:"Basic", I:"Intermediate", A:"Advanced", root:"Start here"};
const CLOUD = {azure:"Azure", aws:"AWS", gcp:"GCP", multi:"Concept"};
const CLC = {azure:"var(--az)", aws:"var(--aws)", gcp:"var(--gcp)", multi:"var(--multi)"};
const EQ = {};
for (const [k,n] of Object.entries(N)) for (const q of (n.eq||[])) if (N[q] && q !== k){ (EQ[k] = EQ[k] || new Set()).add(q); (EQ[q] = EQ[q] || new Set()).add(k); }
const TITLES = D.titles || {};
const KCOL = {S:"var(--entry-bg)", B:"var(--basic)", I:"var(--inter)", A:"var(--adv)", Q:"var(--dec)", root:"var(--entry-bg)",
              guide:"var(--muted)", walk:"var(--walk)", step:"var(--walk)", note:"var(--dec)"};

const $ = s => document.querySelector(s);
const vp = $("#vp"), sizer = $("#sizer"), content = $("#content"), svg = $("#wires");
const SUBT = {}, CARD = {}, ELAB = {}, WIRES = [], LINKCARDS = [];
let scale = 1, mode = "map";
const store = {
  get(){ try { return JSON.parse(localStorage.getItem("cloud-map-v1") || "null"); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem("cloud-map-v1", JSON.stringify(v)); } catch(e){} }
};

function h(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

/* ---------------- build tree DOM */
function topicTag(p){ return p ? (SHORT[p] || "") : ""; }
function nameOf(k){ return N[k].t; }
function buildCard(k){
  const n = N[k];
  const card = h("div", "card k-" + n.k + (n.cl ? " cl-" + n.cl : "")); card.dataset.key = k;
  const head = h("button", "head"); head.type = "button";
  const tr = h("span", "tagrow");
  tr.append(kindTag(n));
  if (n.p && !n.sec) tr.append(h("span", "sec", topicTag(n.p)));
  head.append(tr);
  head.append(h("span", "title", n.t));
  if (n.f) head.append(h("span", "full", n.f));
  if (n.s) head.append(h("span", "ex", n.s));
  card.append(head);
  const acts = h("div", "acts");
  const outs = OUT[k] || [];
  let kc = null;
  if (outs.length){ kc = h("span", "kc"); kc.setAttribute("aria-hidden", "true"); card.append(kc); }
  const td = h("button", "td", "Details"); td.type = "button"; td.setAttribute("aria-expanded","false");
  td._lbl = "Details";
  td.addEventListener("click", ev => { ev.stopPropagation(); anchored(card, () => setDet(k, !card.classList.contains("dopen"))); });
  acts.append(td);
  card.append(acts);
  head.addEventListener("click", () => {
    if (outs.length) toggleOpen(k, card);
    else anchored(card, () => setDet(k, !card.classList.contains("dopen")));
  });
  card._kc = kc; card._td = td; card._head = head;
  CARD[k] = card;
  return card;
}

function kindTag(n){
  const s = h("span", "kind");
  if (n.sec || n.k === "root"){ s.textContent = n.sec ? "Topic " + n.sec.num : KIND.root; return s; }
  if (n.cl && n.cl !== "multi") s.append(h("span", "cbadge", CLOUD[n.cl]));
  s.append(h("span", "lvl lvl-" + n.k, KIND[n.k] || ""));
  return s;
}
function buildLinkCard(e){
  const t = N[e.t];
  const card = h("div", "card link k-" + t.k + (t.cl ? " cl-" + t.cl : "")); card.dataset.target = e.t;
  const head = h("button", "head"); head.type = "button";
  const tr = h("span", "tagrow");
  const kt = kindTag(t); kt.prepend(h("span", null, "Used with ·")); tr.append(kt);
  tr.append(h("span", "sec", topicTag(t.p)));
  head.append(tr);
  head.append(h("span", "title", t.t));
  if (t.s) head.append(h("span", "ex", t.s));
  card.append(head);
  const acts = h("div", "acts");
  const go = h("button", "open", "Go to term"); go.type = "button";
  go.addEventListener("click", ev => { ev.stopPropagation(); jump(e.t, true); });
  head.addEventListener("click", () => jump(e.t, true));
  acts.append(go); card.append(acts);
  LINKCARDS.push(card);
  return card;
}

function buildEdgeLabel(e){
  const lab = h("div", "elabel" + (e.tree ? "" : " dash"));
  const hb = h("button", "ehead"); hb.type = "button"; hb.setAttribute("aria-expanded", "false");
  hb.title = "When to use " + N[e.t].t;

/* ---------------- search */
const q = $("#q"), res = $("#results");
const IDX = Object.entries(N).filter(([k,n]) => n.k !== "root").map(([k,n]) => ({k, t:(n.t + " " + (n.f||"")).toLowerCase(),
  all:[n.t, n.f, n.s, n.hp, n.x].filter(Boolean).join(" ").toLowerCase()}));

  all: [e.id, e.sc, e.w, e.c, N[e.t].t].filter(Boolean).join(" ").toLowerCase()});

function runSearch(){
  const terms = q.value.toLowerCase().trim().split(/\s+/).filter(Boolean);

  hits = IDX.filter(r => terms.every(t => r.all.includes(t))).map(r => {
    let sc = r.id ? -0.5 : 0; for (const t of terms){ if (r.id === t) sc += 20; if (r.t.startsWith(t)) sc += 4; else if (r.t.includes(t)) sc += 3; else sc += 1; }
    return [sc, r.k];

/* ---------------- Overview: top-to-bottom graph per topic (separate panel; the main map is untouched) */
(function(){

function setOvScale(s){ ovScale = Math.max(0.15, Math.min(2, s)); const sv = ovbox.querySelector("svg"); if (sv){ sv.setAttribute("width", (ovDim[0] * ovScale).toFixed(0)); sv.setAttribute("height", (ovDim[1] * ovScale).toFixed(0)); } ovzv.textContent = Math.round(ovScale * 100) + "%"; }
