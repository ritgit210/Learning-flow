 version; interpretability builds trust.","tree":true},{"id":"0.14","s":"ROOT","t":"M14","sc":"Your problem is a known domain","w":"Domain methods encode the data's special structure.","tree":true},{"id":"0.15","s":"ROOT","t":"M15","sc":"A model must run in production","w":"Most of the work starts after the first good model.","tree":true},{"id":"0.16","s":"ROOT","t":"M16","sc":"Standard training isn't enough","w":"Labels, data location or changing tasks demand new approaches.","tree":true},{"id":"1.1","s":"M1","t":"lifecycle","sc":"Planning any ML project","w":"Most failures come from skipping steps like evaluation or monitoring.","tree":true},{"id":"1.2","s":"M1","t":"fls","sc":"Describing a dataset","w":"Every model maps features to labels (or finds structure without labels).","tree":true},{"id":"1.3","s":"M1","t":"learntypes","sc":"Choosing an approach","w":"What data you have (labels, rewards) decides the approach.","tree":true},{"id":"1.4","s":"learntypes","t":"supervised","sc":"You have labeled examples","w":"The labels tell the model exactly what to learn.","tree":true,"c":"Labels can be expensive to collect."},{"id":"1.5","s":"learntypes","t":"unsupervised","sc":"You have no labels","w":"Reveals hidden structure you didn't know to look for.","tree":true,"c":"Results are harder to evaluate."},{"id":"1.6","s":"learntypes","t":"semisup","sc":"Few labels, lots of unlabeled data","w":"Unlabeled data still shows the shape of each class.","tree":true,"c":"Wrong pseudo-labels can reinforce mistakes."},{"id":"1.7","s":"learntypes","t":"selfsup","sc":"Huge unlabeled data, want reusable features","w":"Powers modern foundation models.","tree":true,"c":"Needs lots of compute."},{"id":"1.8","s":"M1","t":"tasks","sc":"Defining the problem","w":"The output type drives every downstream choice.","tree":true},{"id":"1.9","s":"tasks","t":"regtask","sc":"The target is a number","w":"Models output real values directly.","tree":true},{"id":"1.10","s":"tasks","t":"clftask","sc":"The target is a category","w":"Models output class probabilities or labels.","tree":true},{"id":"1.11","s":"clftask","t":"binary","sc":"Exactly two outcomes","w":"One probability and a threshold decide the class.","tree":true},{"id":"1.12","s":"clftask","t":"multiclass","sc":"Many exclusive categories","w":"Each sample gets exactly one class.","tree":true},{"id":"1.13","s":"clftask","t":"multilabel","sc":"Labels aren't mutually exclusive","w":"A photo can contain both a cat and a dog.","tree":true},{"id":"1.14","s":"tasks","t":"ranking","sc":"Order matters more than exact scores","w":"Users look at the top results.","tree":true},{"id":"1.15","s":"tasks","t":"generation","sc":"You need new content","w":"Models learn the data distribution and sample from it.","tree":true,"c":"Hard to evaluate; can produce wrong content."},{"id":"1.16","s":"M1","t":"generalization","sc":"Judging any model","w":"A model that only memorizes training data is useless.","tree":true},{"id":"1.17","s":"generalization","t":"overfit","sc":"Training is great but validation is poor","w":"Fix with more data, regularization or a simpler model.","tree":true},{"id":"1.18","s":"generalization","t":"underfit","sc":"Both train and validation are poor","w":"Fix with a richer model or better features.","tree":true},{"id":"1.19","s":"generalization","t":"biasvar","sc":"Choosing model complexity","w":"Simple models have high bias; flexible ones have high variance.","tree":true},{"id":"1.20","s":"generalization","t":"doubledesc","sc":"Reasoning about very large models","w":"Classic U-curve isn't the full story.","tree":true},{"id":"1.21","s":"M1","t":"splits","sc":"Evaluating any model","w":"Testing on training data gives falsely optimistic results.","tree":true,"c":"Less data for training."},{"id":"1.22","s":"splits","t":"cv","sc":"Data is limited","w":"Every sample is used for both training and validation.","tree":true,"c":"k times more training cost."},{"id":"1.23","s":"cv","t":"kfold","sc":"General model evaluation","w":"Averages out lucky or unlucky splits.","tree":true},{"id":"1.24","s":"cv","t":"stratified","sc":"Classes are imbalanced","w":"A fold with no minority samples gives a useless score.","tree":true},{"id":"1.25","s":"cv","t":"tscv","sc":"Data has a time order","w":"Random splits leak future information.","tree":true},{"id":"1.26","s":"cv","t":"loocv","sc":"Very small datasets","w":"Maximum training data per fold.","tree":true,"c":"Very expensive and high-variance estimate."},{"id":"1.27","s":"cv","t":"nestedcv","sc":"Tuning and reporting on small data","w":"Tuning on the same folds you report on is optimistic.","tree":true,"c":"Very expensive."},{"id":"1.28","s":"M1","t":"leakage","sc":"Results look too good to be true","w":"Leakage inflates scores that collapse in production.","tree":true},{"id":"1.29","s":"M1","t":"paramnon","sc":"Choosing model flexibility","w":"Fixed form is fast and data-efficient; flexible form fits complex shapes.","tree":true},{"id":"1.30","s":"M1","t":"gendisc","sc":"Choosing a modeling approach","w":"Generative models can sample data; discriminative ones usually classify better.","tree":true},{"id":"1.31","s":"M1","t":"curse","sc":"You have many features","w":"Need exponentially more data to cover the space.","tree":true},{"id":"1.32","s":"M1","t":"iid","sc":"Trusting a validation score","w":"If production data differs, scores won't hold.","tree":true},{"id":"1.33","s":"M1","t":"nfl","sc":"Picking a model","w":"Assumptions must match your data.","tree":true},{"id":"1.34","s":"M1","t":"baseline","sc":"Starting any project","w":"Without a baseline you can't tell if 90% is good.","tree":true},{"id":"2.1","s":"M2","t":"linalg","sc":"Representing data and models","w":"Every model computes with matrices.","tree":true},{"id":"2.2","s":"linalg","t":"eigen","sc":"Finding main directions of data","w":"Reveals the axes of greatest variance.","tree":true},{"id":"2.3","s":"linalg","t":"norms","sc":"Measuring distance or penalizing weights","w":"Choice of norm changes model behaviour.","tree":true},{"id":"2.4","s":"M2","t":"calculus","sc":"Training any model by optimization","w":"Gradients tell you which way to change weights.","tree":true},{"id":"2.5","s":"calculus","t":"chainrule","sc":"Computing gradients through layers","w":"Neural nets are deeply nested functions.","tree":true},{"id":"2.6","s":"M2","t":"prob","sc":"Reasoning about uncertainty","w":"Classifiers predict probabilities, not certainties.","tree":true},{"id":"2.7","s":"prob","t":"bayes","sc":"Updating beliefs with new data","w":"Turns 'P(evidence | cause)' into 'P(cause | evidence)'.","tree":true},{"id":"2.8","s":"prob","t":"expvar","sc":"Describing data or errors","w":"Bias and variance are expectations.","tree":true},{"id":"2.9","s":"M2","t":"dists","sc":"Modeling data or noise","w":"Matching the distribution to your data gives better models.","tree":true},{"id":"2.10","s":"dists","t":"normal","sc":"Continuous data near a mean","w":"Many errors are roughly Gaussian (central limit theorem).","tree":true},{"id":"2.11","s":"dists","t":"bernoulli","sc":"Yes/no outcomes","w":"Binary labels follow these distributions.","tree":true},{"id":"2.12","s":"dists","t":"poisson","sc":"Count data","w":"Basis of Poisson regression.","tree":true},{"id":"2.13","s":"dists","t":"uniformexp","sc":"Random sampling or waiting times","w":"Common building blocks.","tree":true},{"id":"2.14","s":"dists","t":"clt","sc":"Reasoning about averages","w":"Means become Gaussian even if data isn't.","tree":true},{"id":"2.15","s":"M2","t":"inference","sc":"Judging results from samples","w":"Small samples can mislead.","tree":true},{"id":"2.16","s":"inference","t":"mle","sc":"Fitting model parameters","w":"A principled way to fit any probabilistic model.","tree":true,"c":"Can overfit with little data."},{"id":"2.17","s":"inference","t":"map","sc":"You have prior knowledge","w":"Priors pull estimates toward sensible values.","tree":true},{"id":"2.18","s":"inference","t":"hyptest","sc":"Comparing models or A/B variants","w":"Separates real improvements from noise.","tree":true,"c":"p-values are easily misread."},{"id":"2.19","s":"inference","t":"ci","sc":"Reporting a metric","w":"A single number hides uncertainty.","tree":true},{"id":"2.20","s":"inference","t":"corrcaus","sc":"Interpreting relationships","w":"Predictive models find correlation, not cause.","tree":true},{"id":"2.21","s":"inference","t":"bootstrap","sc":"Estimating uncertainty of any statistic","w":"Works for almost any metric.","tree":true,"c":"Compute-heavy."},{"id":"2.22","s":"M2","t":"infotheory","sc":"Understanding classification losses","w":"Many losses are information measures.","tree":true},{"id":"2.23","s":"infotheory","t":"entropy","sc":"Measuring uncertainty","w":"Higher entropy = less predictable.","tree":true},{"id":"2.24","s":"infotheory","t":"crossent","sc":"Training classifiers","w":"Heavily penalizes confident wrong predictions.","tree":true},{"id":"2.25","s":"infotheory","t":"kl","sc":"Comparing distributions","w":"Measures the extra cost of using the wrong distribution.","tree":true},{"id":"2.26","s":"infotheory","t":"mi","sc":"Selecting informative features","w":"Finds relationships correlation misses.","tree":true},{"id":"2.27","s":"M2","t":"pgm","sc":"Variables have known dependencies","w":"Structure makes inference tractable and explainable.","tree":true},{"id":"2.28","s":"pgm","t":"bayesnet","sc":"Cause-effect structure is known","w":"Answers 'what if' questions with probabilities.","tree":true},{"id":"2.29","s":"pgm","t":"markov","sc":"Modeling state sequences","w":"Simple yet powerful sequence model.","tree":true},{"id":"2.30","s":"pgm","t":"hmm","sc":"Hidden states behind observations","w":"Infers the hidden sequence.","tree":true,"c":"Largely replaced by neural models."},{"id":"2.31","s":"pgm","t":"mcmc","sc":"The posterior has no closed form","w":"Approximates any distribution with samples.","tree":true,"c":"Slow to converge."},{"id":"3.1","s":"M3","t":"eda","sc":"Starting with a new dataset","w":"You can't fix problems you haven't seen.","tree":true},{"id":"3.2","s":"M3","t":"missing","sc":"Data has gaps","w":"Wrong handling biases the model.","tree":true},{"id":"3.3","s":"missing","t":"dropna","sc":"Very few missing values","w":"Fast and clean.","tree":true,"c":"Throws away data and can bias results."},{"id":"3.4","s":"missing","t":"meanimp","sc":"Simple baseline imputation","w":"Keeps all rows.","tree":true,"c":"Shrinks variance and ignores relationships."},{"id":"3.5","s":"missing","t":"knnimp","sc":"Features are related","w":"More realistic fills than the mean.","tree":true,"c":"Slow on large data."},{"id":"3.6","s":"missing","t":"mice","sc":"Complex missingness","w":"Uses all relationships in the data.","tree":true,"c":"Expensive."},{"id":"3.7","s":"missing","t":"missflag","sc":"Missingness may be informative","w":"Missing often means something.","tree":true},{"id":"3.8","s":"M3","t":"outliers","sc":"Extreme values present","w":"Squared losses are very sensitive to outliers.","tree":true,"c":"Some outliers are real signal."},{"id":"3.9","s":"outliers","t":"zscore","sc":"Roughly normal data","w":"Simple and fast.","tree":true,"c":"Mean and SD are themselves affected by outliers."},{"id":"3.10","s":"outliers","t":"iqr","sc":"Skewed data","w":"Doesn't assume normality.","tree":true},{"id":"3.11","s":"outliers","t":"clip","sc":"Keep rows, limit extremes","w":"Reduces distortion.","tree":true,"c":"Loses true extreme information."},{"id":"3.12","s":"M3","t":"scaling","sc":"kNN, SVM, neural nets, regularized models","w":"Unscaled features let big numbers dominate.","tree":true,"c":"Trees don't need it."},{"id":"3.13","s":"scaling","t":"standard","sc":"Roughly symmetric features","w":"Works well with gradient descent.","tree":true},{"id":"3.14","s":"scaling","t":"minmax","sc":"Need a fixed range","w":"Simple bounded scale.","tree":true,"c":"Sensitive to outliers."},{"id":"3.15","s":"scaling","t":"robust","sc":"Data has outliers","w":"Median and IQR ignore extremes.","tree":true},{"id":"3.16","s":"scaling","t":"logtx","sc":"Heavily skewed features","w":"Many models prefer symmetric inputs.","tree":true},{"id":"3.17","s":"M3","t":"encoding","sc":"Features are categories","w":"The encoding choice affects what the model can learn.","tree":true},{"id":"3.18","s":"encoding","t":"onehot","sc":"Nominal categories with few values","w":"Treats categories as unordered.","tree":true,"c":"Many columns for high-cardinality features."},{"id":"3.19","s":"encoding","t":"ordinal","sc":"Categories have a real order (or tree models)","w":"One column, order preserved.","tree":true,"c":"Implies a fake order for nominal data in linear models."},{"id":"3.20","s":"encoding","t":"targetenc","sc":"High-cardinality categories (zip codes)","w":"One informative column instead of thousands.","tree":true,"c":"Leaks the target unless done out-of-fold."},{"id":"3.21","s":"encoding","t":"hashing","sc":"Huge or streaming vocabularies","w":"No vocabulary to store.","tree":true,"c":"Hash collisions and no interpretability."},{"id":"3.22","s":"M3","t":"featsel","sc":"Many features, some useless","w":"Noise features hurt generalization.","tree":true},{"id":"3.23","s":"featsel","t":"filter","sc":"Quick screening","w":"Cheap and model-agnostic.","tree":true,"c":"Misses feature interactions."},{"id":"3.24","s":"featsel","t":"wrapper","sc":"Moderate number of features","w":"Accounts for interactions.","tree":true,"c":"Expensive."},{"id":"3.25","s":"featsel","t":"embedded","sc":"Using regularized or tree models","w":"No separate search needed.","tree":true},{"id":"3.26","s":"M3","t":"featcreate","sc":"Domain knowledge suggests patterns","w":"Good features often beat better models.","tree":true},{"id":"3.27","s":"featcreate","t":"polyfeat","sc":"Relationships are non-linear","w":"Linear models become more flexible.","tree":true,"c":"Feature count explodes; overfitting risk."},{"id":"3.28","s":"featcreate","t":"binning","sc":"Non-linear thresholds (age groups)","w":"Simple, robust features.","tree":true,"c":"Loses detail within bins."},{"id":"3.29","s":"M3","t":"textfeat","sc":"Inputs are text","w":"Text must be vectorized first.","tree":true},{"id":"3.30","s":"textfeat","t":"bow","sc":"Simple text classification","w":"Fast and surprisingly effective.","tree":true,"c":"Loses word order and meaning."},{"id":"3.31","s":"textfeat","t":"tfidf","sc":"Search and text classification","w":"Downweights 'the', 'and'.","tree":true,"c":"Still ignores word order."},{"id":"3.32","s":"textfeat","t":"ngrams","sc":"Word order matters locally","w":"'not good' differs from 'good'.","tree":true,"c":"Vocabulary grows fast."},{"id":"3.33","s":"M3","t":"imbalance","sc":"The minority class is rare","w":"Accuracy hides a model that ignores the rare class.","tree":true},{"id":"3.34","s":"imbalance","t":"oversample","sc":"Small imbalanced data","w":"Model sees more minority examples.","tree":true,"c":"Duplicates can cause overfitting."},{"id":"3.35","s":"imbalance","t":"smote","sc":"Imbalanced tabular data","w":"Less overfitting than duplication.","tree":true,"c":"Can create noisy points in overlap regions."},{"id":"3.36","s":"imbalance","t":"undersample","sc":"Lots of majority data","w":"Simple and fast.","tree":true,"c":"Throws away information."},{"id":"3.37","s":"imbalance","t":"classweight","sc":"Most models support weights","w":"No data duplication or loss.","tree":true,"c":"Needs tuning."},{"id":"3.38","s":"M3","t":"augment","sc":"Limited data, invariances known","w":"Teaches the model what shouldn't matter.","tree":true,"c":"Wrong augmentations change the label."},{"id":"3.39","s":"M3","t":"pipeline","sc":"Any real project","w":"Every fold and deployment uses identical steps.","tree":true},{"id":"3.40","s":"M3","t":"labeling","sc":"You need training labels","w":"Label quality caps model quality.","tree":true,"c":"Expensive and slow."},{"id":"4.1","s":"M4","t":"linreg","sc":"Relationship is roughly linear","w":"Interpretable and hard to beat on linear data.","tree":true,"c":"Misses curves and interactions."},{"id":"4.2","s":"linreg","t":"residuals","sc":"Checking a regression fit","w":"Patterns in residuals mean the model is missing something.","tree":true},{"id":"4.3","s":"linreg","t":"assumptions","sc":"Interpreting coefficients","w":"Violations make p-values and intervals wrong.","tree":true},{"id":"4.4","s":"linreg","t":"multicol","sc":"Coefficients flip sign or explode","w":"Correlated features share credit unpredictably.","tree":true},{"id":"4.5","s":"linreg","t":"normaleq","sc":"Fitting linear models","w":"Exact for small data; gradient descent scales.","tree":true},{"id":"4.6","s":"M4","t":"polyreg","sc":"Relationship is curved","w":"Simple way to model curves.","tree":true,"c":"High degree overfits wildly."},{"id":"4.7","s":"M4","t":"regularized","sc":"Many features or overfitting","w":"Smaller weights generalize better.","tree":true,"c":"Penalty strength must be tuned."},{"id":"4.8","s":"regularized","t":"ridge","sc":"Many correlated features","w":"Stabilizes coefficients.","tree":true,"c":"Keeps every feature."},{"id":"4.9","s":"regularized","t":"lasso","sc":"Want automatic feature selection","w":"Simpler, interpretable models.","tree":true,"c":"Picks one of several correlated features arbitrarily."},{"id":"4.10","s":"regularized","t":"enet","sc":"Many correlated features, want selection","w":"Gets the best of both.","tree":true,"c":"Two hyperparameters to tune."},{"id":"4.11","s":"regularized","t":"l1l2geo","sc":"Understanding regularization","w":"The shape of the penalty decides sparsity.","tree":true},{"id":"4.12","s":"M4","t":"knnreg","sc":"Local, irregular patterns, small data","w":"Very flexible with no assumptions.","tree":true,"c":"Slow at prediction time; poor in high dimensions."},{"id":"4.13","s":"M4","t":"treereg","sc":"Non-linear, mixed feature types","w":"No scaling; easy to interpret.","tree":true,"c":"A single tree overfits and is unstable."},{"id":"4.14","s":"M4","t":"svr","sc":"Medium data, non-linear with kernels","w":"Ignores small errors; kernels add flexibility.","tree":true,"c":"Slow on large data; needs scaling."},{"id":"4.15","s":"M4","t":"quantreg","sc":"You need uncertainty ranges","w":"Shows best and worst cases.","tree":true},{"id":"4.16","s":"M4","t":"glm","sc":"Target isn't normally distributed","w":"Respects the target's nature (e.g. non-negative counts).","tree":true},{"id":"4.17","s":"glm","t":"poissonreg","sc":"The target is a count","w":"Never predicts negative counts.","tree":true,"c":"Assumes mean = variance."},{"id":"4.18","s":"M4","t":"robustreg","sc":"Outliers in the target","w":"Outliers don't drag the line.","tree":true},{"id":"4.19","s":"M4","t":"bayesreg","sc":"Small data, uncertainty matters","w":"Wider bands where data is scarce.","tree":true,"c":"More computation."},{"id":"4.20","s":"M4","t":"gpreg","sc":"Small data, need uncertainty","w":"Excellent uncertainty estimates.","tree":true,"c":"O(n³) cost; doesn't scale to big data."},{"id":"4.21","s":"M4","t":"isotonic","sc":"Output must only go up","w":"Guarantees monotonicity.","tree":true},{"id":"4.22","s":"M4","t":"splines","sc":"Need flexible but explainable models","w":"Shows each feature's shape of effect.","tree":true},{"id":"5.1","s":"M5","t":"logreg","sc":"Classes are roughly linearly separable","w":"Simple, fast and gives probabilities.","tree":true,"c":"Can't model curved boundaries without feature engineering."},{"id":"5.2","s":"logreg","t":"sigmoidfn","sc":"Converting scores to probabilities","w":"Makes linear scores interpretable as probabilities.","tree":true},{"id":"5.3","s":"logreg","t":"softmaxreg","sc":"More than two classes","w":"Direct multiclass probabilities.","tree":true},{"id":"5.4","s":"logreg","t":"threshold","sc":"Errors have different costs","w":"Moving the threshold changes which mistakes you make.","tree":true},{"id":"5.5","s":"M5","t":"perceptron","sc":"Learning the roots of neural nets","w":"Shows how linear classifiers learn.","tree":true,"c":"Fails on non-separable data."},{"id":"5.6","s":"M5","t":"knnclf","sc":"Small data, irregular boundaries","w":"Adapts to any boundary shape.","tree":true,"c":"Slow predictions; struggles with many features."},{"id":"5.7","s":"knnclf","t":"choosek","sc":"Tuning kNN","w":"k = 1 overfits; very large k underfits.","tree":true},{"id":"5.8","s":"knnclf","t":"distmetric","sc":"Using distance-based models","w":"Wrong metric = wrong neighbours.","tree":true},{"id":"5.9","s":"M5","t":"nb","sc":"Text classification, small data, need speed","w":"Trains in one pass; strong baseline.","tree":true,"c":"Independence assumption gives poorly calibrated probabilities."},{"id":"5.10","s":"nb","t":"gnb","sc":"Continuous features","w":"Simple and fast.","tree":true,"c":"Poor if features aren't Gaussian."},{"id":"5.11","s":"nb","t":"mnb","sc":"Text with word counts","w":"Excellent text baseline.","tree":true},{"id":"5.12","s":"nb","t":"bnb","sc":"Binary features","w":"Uses absence of words too.","tree":true},{"id":"5.13","s":"M5","t":"svm","sc":"Clear margin, high-dimensional data","w":"Maximizing the margin generalizes well.","tree":true,"c":"Slow on large datasets; needs feature scaling."},{"id":"5.14","s":"svm","t":"softmargin","sc":"Classes overlap","w":"Trades margin width against errors.","tree":true},{"id":"5.15","s":"svm","t":"kerneltrick","sc":"Boundary is non-linear","w":"Separable in the lifted space.","tree":true,"c":"Kernel choice and parameters matter."},{"id":"5.16","s":"kerneltrick","t":"rbf","sc":"Unknown non-linear boundary","w":"Fits most shapes.","tree":true,"c":"γ too high overfits."},{"id":"5.17","s":"kerneltrick","t":"polykernel","sc":"Interactions matter","w":"Models products of features.","tree":true,"c":"High degrees get unstable."},{"id":"5.18","s":"M5","t":"dtree","sc":"Need interpretable rules","w":"Easy to explain and visualize.","tree":true,"c":"Overfits and is unstable alone."},{"id":"5.19","s":"dtree","t":"treediagram","sc":"Explaining a prediction","w":"Rules are human-readable.","tree":true},{"id":"5.20","s":"dtree","t":"gini","sc":"Choosing splits","w":"Fast to compute.","tree":true},{"id":"5.21","s":"dtree","t":"infogain","sc":"Choosing splits","w":"Information-theoretic measure of purity.","tree":true},{"id":"5.22","s":"dtree","t":"pruning","sc":"A tree overfits","w":"Simpler trees generalize better.","tree":true},{"id":"5.23","s":"M5","t":"lda","sc":"Classes roughly Gaussian","w":"Stable with small data.","tree":true,"c":"Assumes shared covariance."},{"id":"5.24","s":"lda","t":"qda","sc":"Classes have different spreads","w":"More flexible than LDA.","tree":true,"c":"Needs more data."},{"id":"5.25","s":"M5","t":"multistrat","sc":"The model is binary-only (SVM)","w":"Extends any binary classifier.","tree":true},{"id":"6.1","s":"M6","t":"ensemble","sc":"Want the best accuracy","w":"Diverse models make different mistakes.","tree":true,"c":"Slower and harder to interpret."},{"id":"6.2","s":"ensemble","t":"bagging","sc":"High-variance models like deep trees","w":"Averaging smooths out overfitting.","tree":true,"c":"Doesn't reduce bias."},{"id":"6.3","s":"bagging","t":"rf","sc":"Tabular data, want a strong default","w":"Accurate, handles mixed data, hard to overfit badly.","tree":true,"c":"Less interpretable; large models."},{"id":"6.4","s":"rf","t":"extratrees","sc":"Want speed and smoothness","w":"Faster training than random forest.","tree":true,"c":"Slightly higher bias."},{"id":"6.5","s":"rf","t":"oob","sc":"Quick validation for bagging","w":"No separate validation set needed.","tree":true},{"id":"6.6","s":"ensemble","t":"boosting","sc":"Need maximum accuracy on tabular data","w":"Focuses on hard examples.","tree":true,"c":"Can overfit noise; sequential = slower."},{"id":"6.7","s":"boosting","t":"adaboost","sc":"Clean data, simple boosting","w":"Simple and effective.","tree":true,"c":"Sensitive to noise and outliers."},{"id":"6.8","s":"boosting","t":"gbm","sc":"Tabular data, best accuracy","w":"Very accurate and flexible losses.","tree":true,"c":"Needs tuning; can overfit."},{"id":"6.9","s":"gbm","t":"xgboost","sc":"Tabular competitions and production","w":"Industry standard for structured data.","tree":true,"c":"Many hyperparameters."},{"id":"6.10","s":"gbm","t":"lightgbm","sc":"Large datasets, need speed","w":"Trains much faster.","tree":true,"c":"Leaf-wise growth can overfit small data."},{"id":"6.11","s":"gbm","t":"catboost","sc":"Many categorical features","w":"Avoids target leakage when encoding categories.","tree":true,"c":"Slower to train than LightGBM."},{"id":"6.12","s":"gbm","t":"shrinkage","sc":"Tuning gradient boosting","w":"Small steps avoid overshooting.","tree":true,"c":"Needs more trees."},{"id":"6.13","s":"ensemble","t":"stacking","sc":"Diverse strong models available","w":"Learns which model to trust when.","tree":true,"c":"Complex; leakage risk."},{"id":"6.14","s":"ensemble","t":"voting","sc":"Several decent models","w":"Easy accuracy boost.","tree":true},{"id":"6.15","s":"ensemble","t":"blending","sc":"Quick ensembling","w":"Easier to implement.","tree":true,"c":"Wastes data on the holdout."},{"id":"7.1","s":"M7","t":"clustering","sc":"Find natural groups","w":"Reveals segments you didn't define.","tree":true,"c":"No ground truth to check against."},{"id":"7.2","s":"clustering","t":"kmeans","sc":"Roughly round, similar-size clusters","w":"Scales to large data.","tree":true,"c":"Must choose k; fails on odd shapes; sensitive to scale."},{"id":"7.3","s":"kmeans","t":"kmeanspp","sc":"Using k-means","w":"Avoids bad starts.","tree":true},{"id":"7.4","s":"kmeans","t":"elbow","sc":"Choosing k","w":"The elbow marks diminishing returns.","tree":true,"c":"The elbow can be unclear."},{"id":"7.5","s":"kmeans","t":"kmedoids","sc":"Outliers or non-Euclidean distances","w":"Centres are actual examples.","tree":true,"c":"Slower than k-means."},{"id":"7.6","s":"clustering","t":"hier","sc":"Small data, want a hierarchy","w":"Cut the tree at any level.","tree":true,"c":"O(n²) memory; doesn't scale."},{"id":"7.7","s":"hier","t":"linkage","sc":"Using hierarchical clustering","w":"Single linkage chains; Ward gives compact clusters.","tree":true},{"id":"7.8","s":"clustering","t":"dbscan","sc":"Odd-shaped clusters, noise present","w":"No k needed; finds outliers.","tree":true,"c":"Struggles with varying densities."},{"id":"7.9","s":"dbscan","t":"hdbscan","sc":"Clusters of different densities","w":"More robust than DBSCAN.","tree":true},{"id":"7.10","s":"clustering","t":"meanshift","sc":"Unknown number of clusters","w":"Finds density peaks.","tree":true,"c":"Slow; bandwidth is tricky."},{"id":"7.11","s":"clustering","t":"gmm","sc":"Clusters are elliptical or overlap","w":"Each point gets cluster probabilities.","tree":true,"c":"Must choose number of components."},{"id":"7.12","s":"gmm","t":"em","sc":"Latent variables","w":"Turns a hard problem into simple steps.","tree":true,"c":"Local optima."},{"id":"7.13","s":"clustering","t":"spectral","sc":"Connected, non-convex shapes","w":"Handles shapes k-means can't.","tree":true,"c":"Expensive on large data."},{"id":"7.14","s":"M7","t":"dimred","sc":"Too many features or want to visualize","w":"Fights the curse of dimensionality.","tree":true,"c":"Some information is lost."},{"id":"7.15","s":"dimred","t":"pca","sc":"Correlated numeric features","w":"Fast, simple and widely used.","tree":true,"c":"Linear only; components are hard to interpret."},{"id":"7.16","s":"pca","t":"scree","sc":"Choosing number of components","w":"Shows the information kept.","tree":true},{"id":"7.17","s":"pca","t":"kpca","sc":"Non-linear structure","w":"Unfolds curved structure.","tree":true,"c":"Expensive; hard to invert."},{"id":"7.18","s":"dimred","t":"svd","sc":"Sparse matrices (text, ratings)","w":"Works on huge sparse data.","tree":true},{"id":"7.19","s":"dimred","t":"tsne","sc":"Visualizing high-dimensional data","w":"Reveals local clusters.","tree":true,"c":"Slow; distances between clusters are meaningless."},{"id":"7.20","s":"dimred","t":"umap","sc":"Large data visualization","w":"Faster and more global than t-SNE.","tree":true,"c":"Still distorts distances."},{"id":"7.21","s":"dimred","t":"ica","sc":"Signals are mixed together","w":"Recovers original sources.","tree":true},{"id":"7.22","s":"dimred","t":"nmf","sc":"Counts or pixels","w":"Parts are additive and readable.","tree":true},{"id":"7.23","s":"M7","t":"anomaly","sc":"Rare events with few labels","w":"Learns 'normal' and flags the rest.","tree":true,"c":"Hard to evaluate; threshold choice."},{"id":"7.24","s":"anomaly","t":"iforest","sc":"Large tabular data","w":"Fast and needs no distance.","tree":true},{"id":"7.25","s":"anomaly","t":"ocsvm","sc":"Clean normal data available","w":"Flexible boundary.","tree":true,"c":"Slow; sensitive to parameters."},{"id":"7.26","s":"anomaly","t":"lof","sc":"Densities vary across the data","w":"Catches outliers in dense regions.","tree":true},{"id":"7.27","s":"M7","t":"assoc","sc":"Transaction data","w":"Finds co-occurring items.","tree":true,"c":"Many trivial rules."},{"id":"7.28","s":"assoc","t":"apriori","sc":"Small to medium transaction data","w":"Simple to understand.","tree":true,"c":"Slow on large data."},{"id":"7.29","s":"assoc","t":"fpgrowth","sc":"Large transaction data","w":"No candidate generation.","tree":true},{"id":"7.30","s":"M7","t":"kde","sc":"Visualizing or modeling densities","w":"Smooth, assumption-free density.","tree":true},{"id":"8.1","s":"M8","t":"neuron","sc":"Understanding neural networks","w":"Everything is built from these units.","tree":true},{"id":"8.2","s":"neuron","t":"mlp","sc":"Tabular or simple non-linear problems","w":"Can approximate any function (universal approximation).","tree":true,"c":"Needs lots of data; less interpretable."},{"id":"8.3","s":"mlp","t":"depthwidth","sc":"Sizing a network","w":"More capacity fits more complex patterns.","tree":true,"c":"Too much capacity overfits."},{"id":"8.4","s":"M8","t":"activation","sc":"Designing a network","w":"Without them a deep net is just linear.","tree":true},{"id":"8.5","s":"activation","t":"relu","sc":"Hidden layers of most networks","w":"Cheap and trains fast.","tree":true,"c":"Neurons can 'die' at 0."},{"id":"8.6","s":"relu","t":"leaky","sc":"ReLU neurons are dying","w":"Keeps a gradient for negatives.","tree":true},{"id":"8.7","s":"relu","t":"gelu","sc":"Transformer models","w":"Smooth gradients help large models.","tree":true},{"id":"8.8","s":"activation","t":"sigmoidact","sc":"Binary output","w":"Gives a probability.","tree":true,"c":"Vanishing gradients in hidden layers."},{"id":"8.9","s":"activation","t":"tanh","sc":"RNN hidden states","w":"Centred outputs train better than sigmoid.","tree":true,"c":"Still saturates."},{"id":"8.10","s":"activation","t":"softmax","sc":"Multiclass output","w":"Gives a class probability distribution.","tree":true},{"id":"8.11","s":"activation","t":"swish","sc":"Deep CNNs","w":"Smooth and self-gated.","tree":true},{"id":"8.12","s":"M8","t":"backprop","sc":"Training any neural network","w":"Efficiently computes all gradients at once.","tree":true},{"id":"8.13","s":"backprop","t":"compgraph","sc":"Building custom models","w":"No hand-written derivatives.","tree":true},{"id":"8.14","s":"M8","t":"lossfns","sc":"Training any model","w":"The loss shapes what the model learns.","tree":true},{"id":"8.15","s":"lossfns","t":"mseloss","sc":"Regression with few outliers","w":"Smooth and easy to optimize.","tree":true,"c":"Sensitive to outliers."},{"id":"8.16","s":"lossfns","t":"maeloss","sc":"Regression with outliers","w":"Less sensitive to outliers.","tree":true,"c":"Not smooth at zero."},{"id":"8.17","s":"lossfns","t":"huber","sc":"Regression with some outliers","w":"Best of MSE and MAE.","tree":true,"c":"Needs δ."},{"id":"8.18","s":"lossfns","t":"celoss","sc":"Classification","w":"Strongly punishes confident mistakes.","tree":true},{"id":"8.19","s":"lossfns","t":"hinge","sc":"Margin-based classifiers","w":"Focuses on hard examples near the boundary.","tree":true,"c":"No probabilities."},{"id":"8.20","s":"lossfns","t":"focal","sc":"Object detection, rare classes","w":"Training focuses on hard examples.","tree":true},{"id":"8.21","s":"M8","t":"optim","sc":"Training a network","w":"The optimizer affects speed and final quality.","tree":true},{"id":"8.22","s":"optim","t":"gd","sc":"Any differentiable model","w":"Moves downhill toward lower loss.","tree":true,"c":"Full-data gradients are slow."},{"id":"8.23","s":"gd","t":"sgd","sc":"Large datasets","w":"Much faster per step; noise helps escape bad spots.","tree":true,"c":"Noisy updates."},{"id":"8.24","s":"optim","t":"momentum","sc":"Training is slow or zig-zags","w":"Accelerates along consistent directions.","tree":true},{"id":"8.25","s":"optim","t":"rmsprop","sc":"Sparse or uneven gradients","w":"Each parameter gets a suitable step size.","tree":true},{"id":"8.26","s":"optim","t":"adam","sc":"Default optimizer for most networks","w":"Fast, robust convergence.","tree":true,"c":"Can generalize slightly worse than SGD."},{"id":"8.27","s":"adam","t":"adamw","sc":"Training transformers","w":"Correct weight decay improves generalization.","tree":true},{"id":"8.28","s":"M8","t":"lr","sc":"Every training run","w":"The right rate makes training fast and stable.","tree":true},{"id":"8.29","s":"lr","t":"lrsched","sc":"Long training runs","w":"Large steps early, small steps late.","tree":true},{"id":"8.30","s":"lr","t":"warmup","sc":"Transformers, large batches","w":"Avoids early instability.","tree":true},{"id":"8.31","s":"lr","t":"lrfinder","sc":"Starting a new model","w":"Saves hyperparameter searching.","tree":true},{"id":"8.32","s":"M8","t":"init","sc":"Building deep networks","w":"Good starts keep gradients healthy.","tree":true},{"id":"8.33","s":"M8","t":"norm","sc":"Deep networks","w":"Keeps activations well-scaled.","tree":true},{"id":"8.34","s":"norm","t":"batchnorm","sc":"CNNs with decent batch sizes","w":"Stabilizes and speeds up training.","tree":true,"c":"Depends on batch size."},{"id":"8.35","s":"norm","t":"layernorm","sc":"Transformers, RNNs","w":"Independent of batch size.","tree":true},{"id":"8.36","s":"M8","t":"regdl","sc":"A network overfits","w":"Large networks memorize easily.","tree":true},{"id":"8.37","s":"regdl","t":"dropout","sc":"Fully connected layers overfit","w":"Acts like training many sub-networks.","tree":true,"c":"Slower convergence."},{"id":"8.38","s":"regdl","t":"weightdecay","sc":"Almost every network","w":"Small weights generalize better.","tree":true},{"id":"8.39","s":"regdl","t":"earlystop","sc":"Validation loss starts rising","w":"Stops at the best point before overfitting.","tree":true},{"id":"8.40","s":"M8","t":"gradprobs","sc":"Training deep or recurrent nets","w":"Fixed by ReLU, init, normalization, residuals, clipping.","tree":true},{"id":"8.41","s":"gradprobs","t":"gradclip","sc":"RNNs and transformers","w":"Stops one bad step ruining training.","tree":true},{"id":"8.42","s":"M8","t":"batchsize","sc":"Configuring training","w":"Trade-off between speed and generalization.","tree":true,"c":"Very large batches need learning-rate tuning."},{"id":"8.43","s":"M8","t":"hardware","sc":"Training neural networks","w":"Orders of magnitude faster than CPUs.","tree":true,"c":"Expensive."},{"id":"8.44","s":"hardware","t":"mixedprec","sc":"Large models on GPUs","w":"Up to 2-3× speed-up.","tree":true,"c":"Numerical care needed."},{"id":"8.45","s":"M8","t":"frameworks","sc":"Building neural networks","w":"No need to write gradients or GPU code.","tree":true},{"id":"9.1","s":"M9","t":"cnn","sc":"Images, video, spatial grids","w":"Shares weights and captures local patterns efficiently.","tree":true,"c":"Needs lots of labeled data (or pretraining)."},{"id":"9.2","s":"cnn","t":"conv","sc":"Local patterns matter","w":"The same detector works everywhere in the image.","tree":true},{"id":"9.3","s":"conv","t":"kernelfilt","sc":"Understanding what CNNs learn","w":"Hierarchical features emerge automatically.","tree":true},{"id":"9.4","s":"conv","t":"stridepad","sc":"Designing layer shapes","w":"Shapes must line up through the network.","tree":true},{"id":"9.5","s":"cnn","t":"pooling","sc":"Reducing spatial size","w":"Cuts computation and adds robustness.","tree":true,"c":"Loses fine position detail."},{"id":"9.6","s":"cnn","t":"receptive","sc":"Designing deep CNNs","w":"Large objects need large receptive fields.","tree":true},{"id":"9.7","s":"cnn","t":"cnnarch","sc":"Picking an image backbone","w":"Reuse a proven design instead of inventing one.","tree":true},{"id":"9.8","s":"cnnarch","t":"resnet","sc":"Very deep networks","w":"Gradients flow through the skips.","tree":true},{"id":"9.9","s":"cnnarch","t":"mobilenet","sc":"Mobile or edge deployment","w":"Far fewer operations.","tree":true},{"id":"9.10","s":"M9","t":"rnn","sc":"Sequences (text, time series, audio)","w":"Memory of previous steps.","tree":true,"c":"Slow (sequential) and forgets long context."},{"id":"9.11","s":"rnn","t":"bptt","sc":"Training recurrent nets","w":"Gradients flow back through time.","tree":true,"c":"Vanishing/exploding gradients."},{"id":"9.12","s":"rnn","t":"lstm","sc":"Long sequences","w":"Solves much of the vanishing gradient problem.","tree":true,"c":"Slower than GRU; replaced by transformers for text."},{"id":"9.13","s":"rnn","t":"gru","sc":"Sequences, want speed","w":"Faster and often as good as LSTM.","tree":true},{"id":"9.14","s":"rnn","t":"birnn","sc":"Whole sequence available (tagging)","w":"Context from both sides.","tree":true,"c":"Can't be used for live streaming."},{"id":"9.15","s":"rnn","t":"seq2seq","sc":"Input and output sequences differ","w":"Maps sequences of different lengths.","tree":true,"c":"A single context vector bottleneck (fixed by attention)."},{"id":"9.16","s":"M9","t":"attention","sc":"Long sequences, alignment needed","w":"Directly connects any two positions.","tree":true,"c":"Cost grows with sequence length squared."},{"id":"9.17","s":"attention","t":"selfattn","sc":"Modeling context within a sequence","w":"Captures relationships across the whole sequence.","tree":true,"c":"O(n²) memory."},{"id":"9.18","s":"selfattn","t":"mha","sc":"Transformers","w":"Different heads track different patterns.","tree":true},{"id":"9.19","s":"M9","t":"transformer","sc":"Text, large data, parallel training","w":"Parallel training and long-range context.","tree":true,"c":"Needs lots of data and compute."},{"id":"9.20","s":"transformer","t":"posenc","sc":"Building transformers","w":"Lets the model know word order.","tree":true},{"id":"9.21","s":"transformer","t":"vit","sc":"Large image datasets","w":"Global context across the image.","tree":true,"c":"Needs more data than CNNs."},{"id":"9.22","s":"transformer","t":"moe","sc":"Very large models","w":"More parameters without more compute per token.","tree":true,"c":"Complex training and serving."},{"id":"9.23","s":"M9","t":"autoenc","sc":"Compression, denoising, anomaly detection","w":"Bottleneck forces useful features.","tree":true,"c":"Reconstructions can be blurry."},{"id":"9.24","s":"autoenc","t":"denoiseae","sc":"Noisy data","w":"Learns what's signal vs noise.","tree":true},{"id":"9.25","s":"autoenc","t":"vae","sc":"Generation with a structured latent space","w":"Smooth, sampleable latent space.","tree":true,"c":"Blurry samples compared with GANs or diffusion."},{"id":"9.26","s":"M9","t":"gan","sc":"Realistic image generation","w":"Adversarial training gives crisp samples.","tree":true,"c":"Unstable training and mode collapse."},{"id":"9.27","s":"gan","t":"cgan","sc":"Generate a specific class or translate images","w":"Control over what's generated.","tree":true},{"id":"9.28","s":"M9","t":"diffusion","sc":"High-quality generation","w":"Stable training and very high quality.","tree":true,"c":"Slow sampling (many steps)."},{"id":"9.29","s":"diffusion","t":"flows","sc":"Need exact densities","w":"Exact log-likelihood.","tree":true,"c":"Architecture constraints."},{"id":"9.30","s":"M9","t":"gnn","sc":"Data is a graph","w":"Uses the connections directly.","tree":true,"c":"Over-smoothing in deep GNNs."},{"id":"9.31","s":"M9","t":"siamese","sc":"Verify whether two inputs match","w":"Works for classes never seen in training.","tree":true},{"id":"9.32","s":"M9","t":"transferdl","sc":"Limited labeled data","w":"Reuse learned features.","tree":true},{"id":"10.1","s":"M10","t":"textprep","sc":"Classic NLP pipelines","w":"Reduces vocabulary noise.","tree":true,"c":"Less needed with modern subword models."},{"id":"10.2","s":"M10","t":"tokenize","sc":"Feeding text to a model","w":"Models work on token IDs.","tree":true,"c":"Token counts drive cost and context limits."},{"id":"10.3","s":"tokenize","t":"bpe","sc":"Open vocabularies","w":"No unknown words; compact vocabulary.","tree":true},{"id":"10.4","s":"M10","t":"wordemb","sc":"Need word meaning, not counts","w":"king − man + woman ≈ queen.","tree":true,"c":"One vector per word ignores context."},{"id":"10.5","s":"wordemb","t":"word2vec","sc":"Training your own embeddings","w":"Simple and efficient.","tree":true},{"id":"10.6","s":"wordemb","t":"glove","sc":"Quick pretrained embeddings","w":"fastText works on misspellings.","tree":true},{"id":"10.7","s":"wordemb","t":"ctxemb","sc":"Meaning depends on context","w":"Much better than static embeddings.","tree":true},{"id":"10.8","s":"wordemb","t":"sentemb","sc":"Comparing whole texts","w":"Similar meaning → close vectors.","tree":true},{"id":"10.9","s":"M10","t":"lm","sc":"Generating or scoring text","w":"Captures how language flows.","tree":true},{"id":"10.10","s":"lm","t":"ngramlm","sc":"Small data, simple needs","w":"Easy to build.","tree":true,"c":"No long context; sparse."},{"id":"10.11","s":"lm","t":"bert","sc":"Understanding tasks (classify, extract)","w":"Sees context on both sides.","tree":true,"c":"Not built for generating text."},{"id":"10.12","s":"lm","t":"gpt","sc":"Generation, chat, general tasks","w":"One model does many tasks via prompting.","tree":true,"c":"Can hallucinate; expensive."},{"id":"10.13","s":"lm","t":"t5","sc":"Input → output text tasks","w":"Strong for transformations of text.","tree":true},{"id":"10.14","s":"M10","t":"llmtrain","sc":"Understanding LLMs","w":"Each stage adds a capability.","tree":true},{"id":"10.15","s":"llmtrain","t":"pretrain","sc":"Building a foundation model","w":"Learns grammar, facts and reasoning patterns.","tree":true,"c":"Extremely expensive."},{"id":"10.16","s":"pretrain","t":"scalinglaws","sc":"Planning training budgets","w":"Predicts gains before training.","tree":true},{"id":"10.17","s":"llmtrain","t":"sft","sc":"Adapting to a task or style","w":"Specializes a general model.","tree":true,"c":"Can forget general skills."},{"id":"10.18","s":"llmtrain","t":"rlhf","sc":"Aligning a chat model","w":"Makes answers more helpful and safe.","tree":true,"c":"Complex and expensive."},{"id":"10.19","s":"rlhf","t":"dpo","sc":"Aligning with preference data","w":"Simpler and more stable than RLHF.","tree":true},{"id":"10.20","s":"llmtrain","t":"peft","sc":"Limited GPU memory","w":"Tiny storage per task.","tree":true,"c":"Slightly lower ceiling than full fine-tuning."},{"id":"10.21","s":"peft","t":"lora","sc":"Fine-tuning LLMs on modest hardware","w":"Huge memory savings.","tree":true},{"id":"10.22","s":"M10","t":"prompting","sc":"Using an LLM","w":"Cheapest way to improve outputs.","tree":true,"c":"Can be brittle."},{"id":"10.23","s":"prompting","t":"icl","sc":"Few examples, no fine-tuning","w":"Instant task adaptation.","tree":true,"c":"Uses context window space."},{"id":"10.24","s":"prompting","t":"cot","sc":"Math or logic tasks","w":"Intermediate steps reduce errors.","tree":true,"c":"Longer, costlier outputs."},{"id":"10.25","s":"M10","t":"decoding","sc":"Generating text","w":"Same model, very different outputs.","tree":true},{"id":"10.26","s":"decoding","t":"temperature","sc":"Balancing creativity and accuracy","w":"Simple knobs for output style.","tree":true,"c":"High temperature increases errors."},{"id":"10.27","s":"decoding","t":"beam","sc":"Translation, summarization","w":"Finds better sequences than greedy.","tree":true,"c":"Bland, repetitive text for open chat."},{"id":"10.28","s":"M10","t":"rag","sc":"Answers must use private or fresh data","w":"Fewer hallucinations, no retraining.","tree":true,"c":"Retrieval quality limits answer quality."},{"id":"10.29","s":"rag","t":"vectorsearch","sc":"Semantic retrieval","w":"Matches paraphrases.","tree":true},{"id":"10.30","s":"rag","t":"chunking","sc":"Long documents in RAG","w":"Right-sized, relevant context.","tree":true},{"id":"10.31","s":"M10","t":"agents","sc":"Tasks need actions or external data","w":"LLMs can act, not just answer.","tree":true,"c":"Errors compound over steps."},{"id":"10.32","s":"M10","t":"llmissues","sc":"Deploying LLMs","w":"Plan mitigations upfront.","tree":true},{"id":"10.33","s":"llmissues","t":"context","sc":"Long documents","w":"Everything must fit, or be retrieved.","tree":true,"c":"Longer context costs more."},{"id":"10.34","s":"M10","t":"nlptasks","sc":"Framing a language problem","w":"Known tasks have known models and metrics.","tree":true},{"id":"10.35","s":"nlptasks","t":"sentiment","sc":"Measuring opinion","w":"Classic text classification.","tree":true,"c":"Sarcasm is hard."},{"id":"10.36","s":"nlptasks","t":"ner","sc":"Extracting entities","w":"Turns text into fields.","tree":true},{"id":"10.37","s":"nlptasks","t":"mt","sc":"Translating text","w":"Transformers excel at it.","tree":true},{"id":"10.38","s":"nlptasks","t":"summarize","sc":"Long documents","w":"Saves reading time.","tree":true,"c":"Abstractive summaries can hallucinate."},{"id":"10.39","s":"nlptasks","t":"qa","sc":"Users ask questions","w":"Direct answers instead of documents.","tree":true},{"id":"10.40","s":"nlptasks","t":"topicmodel","sc":"Exploring unlabeled text","w":"Unsupervised themes.","tree":true,"c":"Topics can be hard to interpret."},{"id":"11.1","s":"M11","t":"rlloop","sc":"Framing an RL problem","w":"Everything in RL builds on this loop.","tree":true},{"id":"11.2","s":"rlloop","t":"mdp","sc":"Formalizing an RL problem","w":"Defines exactly what to optimize.","tree":true},{"id":"11.3","s":"rlloop","t":"reward","sc":"Defining what the agent should achieve","w":"The agent maximizes the return.","tree":true,"c":"Badly designed rewards get gamed."},{"id":"11.4","s":"rlloop","t":"policy","sc":"Describing agent behaviour","w":"The policy is the solution.","tree":true},{"id":"11.5","s":"M11","t":"valuefn","sc":"Evaluating states and actions","w":"Guides action choice.","tree":true},{"id":"11.6","s":"valuefn","t":"bellman","sc":"Computing values","w":"Breaks long-term value into steps.","tree":true},{"id":"11.7","s":"valuefn","t":"dp","sc":"Known, small environments","w":"Guaranteed optimal.","tree":true,"c":"Needs the full model; doesn't scale."},{"id":"11.8","s":"M11","t":"explore","sc":"Any RL or bandit problem","w":"Pure exploitation gets stuck.","tree":true},{"id":"11.9","s":"explore","t":"epsgreedy","sc":"Simple exploration","w":"Easy and robust.","tree":true,"c":"Explores blindly."},{"id":"11.10","s":"explore","t":"bandit","sc":"Picking the best option while learning","w":"Shifts traffic to winners automatically.","tree":true},{"id":"11.11","s":"bandit","t":"ucb","sc":"Bandits with costly exploration","w":"Near-optimal regret.","tree":true},{"id":"11.12","s":"M11","t":"modelfree","sc":"Choosing an RL family","w":"Model-based needs fewer samples.","tree":true,"c":"Model errors can mislead planning."},{"id":"11.13","s":"modelfree","t":"mctd","sc":"Updating value estimates","w":"TD learns online and faster.","tree":true},{"id":"11.14","s":"M11","t":"qlearning","sc":"Small discrete state spaces","w":"Learns the optimal policy from any behaviour.","tree":true,"c":"Tables don't scale to huge spaces."},{"id":"11.15","s":"qlearning","t":"sarsa","sc":"On-policy learning","
