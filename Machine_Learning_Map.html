":"12.7","s":"confmat","t":"specificity","sc":"Negatives matter (screening tests)","w":"Shows the false alarm rate on negatives.","tree":true},{"id":"12.8","s":"confmat","t":"mcc","sc":"Imbalanced binary problems","w":"Uses every cell of the matrix.","tree":true},{"id":"12.9","s":"confmat","t":"kappa","sc":"Imbalanced or rater-agreement settings","w":"Corrects for luck.","tree":true},{"id":"12.10","s":"confmat","t":"multiavg","sc":"Multiclass metrics","w":"Macro exposes poor rare-class performance.","tree":true},{"id":"12.11","s":"clfmetrics","t":"roc","sc":"Comparing classifiers across thresholds","w":"Doesn't depend on one threshold.","tree":true,"c":"Can look optimistic with heavy imbalance."},{"id":"12.12","s":"clfmetrics","t":"prcurve","sc":"Heavily imbalanced data","w":"Focuses on the positive class.","tree":true},{"id":"12.13","s":"clfmetrics","t":"logloss","sc":"Probabilities themselves matter","w":"Rewards honest confidence.","tree":true,"c":"Unbounded for confident mistakes."},{"id":"12.14","s":"clfmetrics","t":"calib","sc":"Probabilities drive decisions","w":"70% should mean right 70% of the time.","tree":true},{"id":"12.15","s":"calib","t":"brier","sc":"Scoring probabilistic forecasts","w":"Simple probability score.","tree":true},{"id":"12.16","s":"clfmetrics","t":"topk","sc":"Many classes","w":"Credits near-misses.","tree":true},{"id":"12.17","s":"M12","t":"regmetrics","sc":"Evaluating a regressor","w":"Choose by how errors should be weighted.","tree":true},{"id":"12.18","s":"regmetrics","t":"mae","sc":"All errors cost the same","w":"Simple and robust.","tree":true},{"id":"12.19","s":"regmetrics","t":"mse","sc":"Large errors are especially bad","w":"Highlights big misses.","tree":true,"c":"Sensitive to outliers."},{"id":"12.20","s":"regmetrics","t":"r2","sc":"Comparing fits on the same data","w":"Easy to compare.","tree":true,"c":"Can be negative; rises with more features."},{"id":"12.21","s":"r2","t":"adjr2","sc":"Comparing models with different features","w":"Doesn't reward extra junk features.","tree":true},{"id":"12.22","s":"regmetrics","t":"mape","sc":"Comparing across scales","w":"Easy to explain.","tree":true,"c":"Explodes when actual values are near zero."},{"id":"12.23","s":"M12","t":"clumetrics","sc":"Evaluating clustering","w":"No accuracy exists without labels.","tree":true},{"id":"12.24","s":"clumetrics","t":"silhouette","sc":"Choosing k","w":"Combines cohesion and separation.","tree":true,"c":"Favours round clusters."},{"id":"12.25","s":"clumetrics","t":"dbindex","sc":"Comparing clusterings","w":"Quick to compute.","tree":true},{"id":"12.26","s":"clumetrics","t":"ari","sc":"Labels exist for benchmarking","w":"Chance-corrected agreement.","tree":true},{"id":"12.27","s":"M12","t":"rankmetrics","sc":"Order of results matters","w":"Top positions matter most.","tree":true},{"id":"12.28","s":"rankmetrics","t":"patk","sc":"Users see only the top results","w":"Matches what users experience.","tree":true,"c":"Ignores order within the top k."},{"id":"12.29","s":"rankmetrics","t":"ndcg","sc":"Search and recommendation ranking","w":"Respects both relevance level and position.","tree":true},{"id":"12.30","s":"rankmetrics","t":"mrr","sc":"Search evaluation","w":"Standard search metrics.","tree":true},{"id":"12.31","s":"M12","t":"genmetrics","sc":"Evaluating generation","w":"Generated output has many correct answers.","tree":true,"c":"Automatic metrics correlate imperfectly with humans."},{"id":"12.32","s":"genmetrics","t":"bleu","sc":"Machine translation","w":"Cheap, reproducible.","tree":true,"c":"Misses paraphrases."},{"id":"12.33","s":"genmetrics","t":"rouge","sc":"Summarization","w":"Measures coverage of key content.","tree":true,"c":"Misses paraphrases."},{"id":"12.34","s":"genmetrics","t":"perplexity","sc":"Comparing language models","w":"Directly from the training objective.","tree":true,"c":"Doesn't measure usefulness."},{"id":"12.35","s":"genmetrics","t":"fid","sc":"Evaluating image generators","w":"Captures quality and diversity.","tree":true},{"id":"12.36","s":"genmetrics","t":"humaneval","sc":"Open-ended generation","w":"Closest to real quality.","tree":true,"c":"Costly; judge bias."},{"id":"12.37","s":"M12","t":"lift","sc":"Marketing and targeting","w":"Shows the value of acting on scores.","tree":true},{"id":"13.1","s":"M13","t":"hyper","sc":"Configuring any model","w":"Hyperparameters control how learning happens.","tree":true},{"id":"13.2","s":"hyper","t":"gridsearch","sc":"Few hyperparameters","w":"Guaranteed to test every combination.","tree":true,"c":"Explodes with many hyperparameters."},{"id":"13.3","s":"hyper","t":"randsearch","sc":"Several hyperparameters","w":"Explores each dimension more widely.","tree":true,"c":"Can still miss the best region."},{"id":"13.4","s":"hyper","t":"bayesopt","sc":"Each training run is costly","w":"Learns from previous trials.","tree":true,"c":"Overhead for cheap models."},{"id":"13.5","s":"hyper","t":"halving","sc":"Many configs, expensive training","w":"Wastes little compute on bad configs.","tree":true},{"id":"13.6","s":"hyper","t":"automl","sc":"Quick strong baseline","w":"Saves engineering time.","tree":true,"c":"Less control; can be costly."},{"id":"13.7","s":"M13","t":"learncurve","sc":"Deciding to collect more data","w":"Diagnoses bias vs variance.","tree":true},{"id":"13.8","s":"learncurve","t":"valcurve","sc":"Tuning one hyperparameter","w":"Shows under- and overfitting zones.","tree":true},{"id":"13.9","s":"M13","t":"infocrit","sc":"Comparing statistical models","w":"Built-in complexity penalty.","tree":true},{"id":"13.10","s":"M13","t":"interpret","sc":"Decisions affect people","w":"Explanations reveal bugs and bias.","tree":true},{"id":"13.11","s":"interpret","t":"featimp","sc":"Explaining a model globally","w":"Quick overview of key drivers.","tree":true,"c":"Impurity importance is biased toward high-cardinality features."},{"id":"13.12","s":"featimp","t":"permimp","sc":"Any model","w":"Works for every model.","tree":true,"c":"Correlated features share importance."},{"id":"13.13","s":"interpret","t":"shap","sc":"Explaining individual predictions","w":"Contributions add up to the prediction.","tree":true,"c":"Slow for some models."},{"id":"13.14","s":"interpret","t":"lime","sc":"Explaining one prediction quickly","w":"Works with any black box.","tree":true,"c":"Explanations can be unstable."},{"id":"13.15","s":"interpret","t":"pdp","sc":"Understanding feature effects","w":"Visual, intuitive effect curves.","tree":true,"c":"Misleading with correlated features."},{"id":"13.16","s":"pdp","t":"ice","sc":"Heterogeneous effects","w":"Shows interactions hidden by averages.","tree":true},{"id":"13.17","s":"interpret","t":"saliency","sc":"Explaining image models","w":"Catches models looking at the wrong thing.","tree":true},{"id":"13.18","s":"interpret","t":"counterfact","sc":"Users need actionable reasons","w":"Tells people what to change.","tree":true},{"id":"13.19","s":"interpret","t":"surrogate","sc":"Need a readable summary of a black box","w":"Readable approximation.","tree":true,"c":"Only as good as its fidelity."},{"id":"13.20","s":"M13","t":"fairness","sc":"Decisions about people","w":"Biased data creates biased models.","tree":true,"c":"Fairness definitions can conflict."},{"id":"13.21","s":"fairness","t":"fairmetrics","sc":"Auditing a model","w":"Turns fairness into numbers.","tree":true},{"id":"13.22","s":"fairness","t":"mitigate","sc":"Bias is found","w":"Makes outcomes more equitable.","tree":true,"c":"May cost some accuracy."},{"id":"13.23","s":"fairness","t":"privacy","sc":"Sensitive personal data","w":"Mathematical privacy guarantee.","tree":true,"c":"Lower accuracy."},{"id":"13.24","s":"fairness","t":"modelcard","sc":"Sharing or deploying models","w":"Users know the limits.","tree":true},{"id":"14.1","s":"M14","t":"timeseries","sc":"Data is ordered in time","w":"Time order carries the signal.","tree":true,"c":"Random splits leak the future."},{"id":"14.2","s":"timeseries","t":"tsdecomp","sc":"Exploring a time series","w":"Each part needs different handling.","tree":true},{"id":"14.3","s":"timeseries","t":"stationary","sc":"Using classical models","w":"Stable statistics make modeling valid.","tree":true},{"id":"14.4","s":"timeseries","t":"acf","sc":"Identifying patterns","w":"Shows how the past predicts the future.","tree":true},{"id":"14.5","s":"timeseries","t":"arima","sc":"Single series, moderate data","w":"Well-understood with confidence intervals.","tree":true,"c":"Struggles with many series or complex patterns."},{"id":"14.6","s":"timeseries","t":"expsmooth","sc":"Simple seasonal series","w":"Strong, cheap baseline.","tree":true},{"id":"14.7","s":"timeseries","t":"prophet","sc":"Business data with holidays","w":"Fast to set up.","tree":true,"c":"Often beaten by tuned models."},{"id":"14.8","s":"timeseries","t":"mlts","sc":"Many related series, rich features","w":"Learns across series.","tree":true,"c":"Needs careful validation."},{"id":"14.9","s":"M14","t":"recsys","sc":"Personalizing items for users","w":"Users can't browse everything.","tree":true,"c":"Cold start and popularity bias."},{"id":"14.10","s":"recsys","t":"collab","sc":"Many user-item interactions","w":"Learns taste from behaviour alone.","tree":true,"c":"Cold start for new users and items."},{"id":"14.11","s":"collab","t":"matfact","sc":"Large sparse rating matrices","w":"Compact, accurate taste vectors.","tree":true,"c":"Cold start remains."},{"id":"14.12","s":"recsys","t":"contentrec","sc":"Rich item descriptions","w":"No cold start for items.","tree":true,"c":"Recommendations can be narrow."},{"id":"14.13","s":"recsys","t":"hybridrec","sc":"Large catalogues","w":"Fast candidate retrieval plus precise ranking.","tree":true},{"id":"14.14","s":"recsys","t":"coldstart","sc":"Launching or growing catalogues","w":"Avoids empty recommendations.","tree":true},{"id":"14.15","s":"recsys","t":"implicit","sc":"Choosing training signals","w":"Most real data is implicit.","tree":true},{"id":"14.16","s":"M14","t":"cvtasks","sc":"Inputs are images","w":"Each task has specialized models.","tree":true},{"id":"14.17","s":"cvtasks","t":"imgclf","sc":"One label per image","w":"Mature, accurate models exist.","tree":true},{"id":"14.18","s":"cvtasks","t":"detection","sc":"Need object locations","w":"Know where things are, not just what.","tree":true},{"id":"14.19","s":"detection","t":"iou","sc":"Scoring or cleaning boxes","w":"Standard detection building blocks.","tree":true},{"id":"14.20","s":"detection","t":"yolo","sc":"Real-time detection","w":"Very fast.","tree":true,"c":"Small objects are harder."},{"id":"14.21","s":"detection","t":"rcnn","sc":"Accuracy over speed","w":"Precise boxes and masks.","tree":true,"c":"Slower than one-stage detectors."},{"id":"14.22","s":"cvtasks","t":"segment","sc":"Need exact shapes","w":"Pixel-level detail.","tree":true,"c":"Labels are expensive."},{"id":"14.23","s":"segment","t":"unet","sc":"Segmentation tasks","w":"Skips keep fine detail.","tree":true},{"id":"14.24","s":"M14","t":"speech","sc":"Inputs or outputs are audio","w":"Audio becomes images-like spectrograms.","tree":true},{"id":"14.25","s":"speech","t":"asr","sc":"Transcribing audio","w":"Large pretrained models are strong.","tree":true},{"id":"14.26","s":"speech","t":"tts","sc":"Speaking interfaces","w":"Natural-sounding voices.","tree":true},{"id":"14.27","s":"M14","t":"survival","sc":"Time-to-event with censoring","w":"Doesn't discard customers who haven't churned yet.","tree":true},{"id":"15.1","s":"M15","t":"mlpipe","sc":"Training must be repeatable","w":"Manual steps break and don't scale.","tree":true},{"id":"15.2","s":"mlpipe","t":"orchestr","sc":"Regular retraining","w":"Handles retries and scheduling.","tree":true},{"id":"15.3","s":"mlpipe","t":"dataver","sc":"Reproducing results","w":"Know exactly how a model was built.","tree":true},{"id":"15.4","s":"M15","t":"exptrack","sc":"Running many experiments","w":"Never lose a good result.","tree":true},{"id":"15.5","s":"exptrack","t":"registry","sc":"Several models and versions","w":"Clear lineage and approvals.","tree":true},{"id":"15.6","s":"M15","t":"featstore","sc":"Many models share features","w":"Same feature logic everywhere.","tree":true,"c":"More infrastructure."},{"id":"15.7","s":"M15","t":"serving","sc":"Deploying a model","w":"A model only helps when it's used.","tree":true},{"id":"15.8","s":"serving","t":"batchinf","sc":"Predictions needn't be instant","w":"Efficient and easy.","tree":true,"c":"Predictions can be stale."},{"id":"15.9","s":"serving","t":"onlineinf","sc":"Predictions needed instantly","w":"Uses the latest context.","tree":true,"c":"Latency and scaling demands."},{"id":"15.10","s":"serving","t":"edge","sc":"Latency or privacy critical","w":"No network round trip.","tree":true,"c":"Limited compute and memory."},{"id":"15.11","s":"serving","t":"onnx","sc":"Serving across platforms","w":"Decouples training and serving.","tree":true},{"id":"15.12","s":"M15","t":"compress","sc":"Latency or cost is too high","w":"Big savings with small accuracy loss.","tree":true},{"id":"15.13","s":"compress","t":"quant","sc":"Serving large models","w":"Huge memory savings.","tree":true,"c":"Some accuracy loss."},{"id":"15.14","s":"compress","t":"prune","sc":"Over-parameterized networks","w":"Less compute.","tree":true,"c":"Unstructured sparsity needs special hardware."},{"id":"15.15","s":"compress","t":"distill","sc":"Need a fast, small model","w":"Keeps most of the accuracy.","tree":true},{"id":"15.16","s":"M15","t":"monitor","sc":"Any deployed model","w":"Models degrade quietly over time.","tree":true},{"id":"15.17","s":"monitor","t":"datadrift","sc":"Inputs change over time","w":"Detectable even without labels.","tree":true,"c":"Not every drift hurts accuracy."},{"id":"15.18","s":"monitor","t":"conceptdrift","sc":"Behaviour or markets change","w":"The old pattern no longer holds.","tree":true},{"id":"15.19","s":"monitor","t":"retrain","sc":"Drift or decay detected","w":"Restores performance.","tree":true},{"id":"15.20","s":"M15","t":"abtest","sc":"Launching a new model","w":"Offline metrics don't always match business impact.","tree":true,"c":"Needs enough traffic and time."},{"id":"15.21","s":"abtest","t":"shadow","sc":"Risky model changes","w":"Catches problems before users see them.","tree":true},{"id":"15.22","s":"M15","t":"mlcicd","sc":"Frequent model updates","w":"Catches bad models automatically.","tree":true},{"id":"15.23","s":"M15","t":"disttrain","sc":"One GPU is too slow or too small","w":"Scales training.","tree":true,"c":"Communication overhead."},{"id":"16.1","s":"M16","t":"transfer","sc":"Small dataset, related pretrained model","w":"Reuses learned knowledge.","tree":true,"c":"Negative transfer if tasks differ too much."},{"id":"16.2","s":"transfer","t":"finetune","sc":"Some labeled task data","w":"Usually the strongest approach.","tree":true,"c":"Can overfit or forget."},{"id":"16.3","s":"transfer","t":"domainadapt","sc":"Target domain differs from training","w":"Keeps accuracy across domains.","tree":true},{"id":"16.4","s":"M16","t":"contrastive","sc":"Lots of unlabeled data","w":"Learns similarity directly.","tree":true,"c":"Needs many negatives or large batches."},{"id":"16.5","s":"contrastive","t":"clipmm","sc":"Linking images and text","w":"Search images by text without training.","tree":true},{"id":"16.6","s":"M16","t":"fewshot","sc":"Very few labels per class","w":"No large labeled dataset needed.","tree":true},{"id":"16.7","s":"fewshot","t":"metalearn","sc":"Many small related tasks","w":"Learns a good starting point.","tree":true,"c":"Complex and costly."},{"id":"16.8","s":"M16","t":"pseudolabel","sc":"Few labels, many unlabeled","w":"Simple semi-supervised boost.","tree":true,"c":"Confirmation bias."},{"id":"16.9","s":"M16","t":"active","sc":"Labeling is expensive","w":"Labels go where they help most.","tree":true,"c":"Needs a labeling loop."},{"id":"16.10","s":"active","t":"weaksup","sc":"Rules exist but labels don't","w":"Scales labeling.","tree":true,"c":"Noisy labels."},{"id":"16.11","s":"M16","t":"online","sc":"Streaming data, fast change","w":"Always current.","tree":true,"c":"Can drift toward recent noise."},{"id":"16.12","s":"online","t":"continual","sc":"Tasks arrive over time","w":"Keeps old skills.","tree":true,"c":"Hard to fully prevent forgetting."},{"id":"16.13","s":"M16","t":"federated","sc":"Data can't leave devices","w":"Privacy by design.","tree":true,"c":"Non-identical data and communication cost."},{"id":"16.14","s":"M16","t":"multitask","sc":"Related tasks","w":"More efficient and often more accurate.","tree":true,"c":"Tasks can conflict."},{"id":"16.15","s":"M16","t":"multimodal","sc":"Inputs mix modalities","w":"Uses all available signals.","tree":true},{"id":"16.16","s":"M16","t":"causal","sc":"Decisions change outcomes","w":"Targets people the action actually helps.","tree":true,"c":"Needs careful assumptions or experiments."},{"id":"16.17","s":"M16","t":"curriculum","sc":"Hard tasks with mixed difficulty","w":"Mimics how people learn.","tree":true},{"id":"1.35","s":"supervised","t":"regtask","sc":"Predict numbers","w":"Regression is the numeric supervised task.","tree":false},{"id":"1.36","s":"regtask","t":"linreg","sc":"Start with a linear baseline","w":"Linear regression is the first model to try.","tree":false},{"id":"1.37","s":"clftask","t":"logreg","sc":"Start with a linear classifier","w":"Logistic regression is the classic baseline.","tree":false},{"id":"1.38","s":"unsupervised","t":"kmeans","sc":"Group similar samples","w":"k-means is the classic clustering algorithm.","tree":false},{"id":"1.39","s":"overfit","t":"regularized","sc":"Weights grow too large","w":"Regularization penalizes complexity.","tree":false},{"id":"1.40","s":"overfit","t":"earlystop","sc":"Training too long","w":"Stop when validation stops improving.","tree":false},{"id":"1.41","s":"leakage","t":"pipeline","sc":"Preprocessing leaks across splits","w":"Fit preprocessing inside the pipeline only.","tree":false},{"id":"2.32","s":"crossent","t":"logloss","sc":"Evaluating probabilistic classifiers","w":"Log loss is cross-entropy used as a metric.","tree":false},{"id":"2.33","s":"bootstrap","t":"bagging","sc":"Train many models on resamples","w":"Bagging averages bootstrap models.","tree":false},{"id":"3.41","s":"textfeat","t":"wordemb","sc":"Need meaning, not just counts","w":"Embeddings capture similarity between words.","tree":false},{"id":"3.42","s":"embedded","t":"lasso","sc":"Use L1 to drop features","w":"Lasso zeroes useless weights.","tree":false},{"id":"3.43","s":"imbalance","t":"prcurve","sc":"Evaluate rare-class performance","w":"PR curves focus on the positive class.","tree":false},{"id":"8.46","s":"mlp","t":"dropout","sc":"Fully connected layers overfit","w":"Dropout regularizes them.","tree":false},{"id":"5.26","s":"dtree","t":"rf","sc":"A single tree overfits","w":"Average many trees.","tree":false},{"id":"5.27","s":"dtree","t":"gbm","sc":"Need top accuracy from trees","w":"Boost trees sequentially.","tree":false},{"id":"5.28","s":"logreg","t":"celoss","sc":"Training a probabilistic classifier","w":"Cross-entropy is its loss.","tree":false},{"id":"5.29","s":"svm","t":"hinge","sc":"Understanding the SVM objective","w":"SVMs minimize hinge loss.","tree":false},{"id":"7.31","s":"kmeans","t":"silhouette","sc":"Checking cluster quality","w":"Silhouette scores how well points fit.","tree":false},{"id":"7.32","s":"pca","t":"eigen","sc":"How PCA finds components","w":"Components are covariance eigenvectors.","tree":false},{"id":"7.33","s":"dimred","t":"autoenc","sc":"Need non-linear compression","w":"Autoencoders learn compressed codes.","tree":false},{"id":"7.34","s":"svd","t":"matfact","sc":"Factorizing user-item ratings","w":"Matrix factorization powers recommenders.","tree":false},{"id":"6.16","s":"bagging","t":"bootstrap","sc":"How bagging samples data","w":"Bootstrap resampling.","tree":false},{"id":"6.17","s":"gbm","t":"featimp","sc":"Explaining a boosted model","w":"Feature importance and SHAP.","tree":false},{"id":"8.47","s":"lossfns","t":"crossent","sc":"Where classification loss comes from","w":"Cross-entropy from information theory.","tree":false},{"id":"8.48","s":"gd","t":"calculus","sc":"Why gradients point downhill","w":"Derivatives define the gradient.","tree":false},{"id":"5.30","s":"threshold","t":"prcurve","sc":"See the trade-off across thresholds","w":"The PR curve shows every threshold.","tree":false},{"id":"12.38","s":"calib","t":"isotonic","sc":"Calibrate probabilities","w":"Isotonic regression maps scores to calibrated probabilities.","tree":false},{"id":"7.35","s":"elbow","t":"silhouette","sc":"The elbow is unclear","w":"Silhouette gives a clearer score per k.","tree":false},{"id":"9.33","s":"rnn","t":"attention","sc":"Long sequences lose context","w":"Attention looks at all steps directly.","tree":false},{"id":"9.34","s":"seq2seq","t":"transformer","sc":"Need parallel training on sequences","w":"Transformers replace recurrence.","tree":false},{"id":"9.35","s":"transformer","t":"bert","sc":"Understanding tasks","w":"Encoder-only transformers.","tree":false},{"id":"9.36","s":"transformer","t":"gpt","sc":"Generation tasks","w":"Decoder-only transformers.","tree":false},{"id":"9.37","s":"cnn","t":"augment","sc":"Small image dataset","w":"Augmentation multiplies examples.","tree":false},{"id":"9.38","s":"autoenc","t":"anomaly","sc":"Detect unusual inputs","w":"High reconstruction error flags anomalies.","tree":false},{"id":"10.41","s":"wordemb","t":"vectorsearch","sc":"Search by meaning","w":"Embeddings power semantic search.","tree":false},{"id":"10.42","s":"rlhf","t":"ppo","sc":"Optimize against the reward model","w":"PPO is the usual algorithm.","tree":false},{"id":"10.43","s":"rlhf","t":"rlloop","sc":"Understand the RL part","w":"RLHF is reinforcement learning.","tree":false},{"id":"11.23","s":"bandit","t":"abtest","sc":"Compare variants in production","w":"Bandits are adaptive A/B tests.","tree":false},{"id":"11.24","s":"dqn","t":"mlp","sc":"Approximate Q-values","w":"A neural network replaces the table.","tree":false},{"id":"12.39","s":"perplexity","t":"crossent","sc":"Where perplexity comes from","w":"It's the exponential of cross-entropy.","tree":false},{"id":"9.39","s":"gan","t":"fid","sc":"Measure image quality","w":"FID is the standard metric.","tree":false},{"id":"13.25","s":"featimp","t":"shap","sc":"Need per-prediction explanations","w":"SHAP explains individual predictions.","tree":false},{"id":"16.18","s":"transfer","t":"transferdl","sc":"Images or text with pretrained nets","w":"Use a pretrained backbone.","tree":false},{"id":"16.19","s":"contrastive","t":"siamese","sc":"Comparing two inputs","w":"Siamese networks are a contrastive setup.","tree":false},{"id":"15.24","s":"monitor","t":"abtest","sc":"Prove the model helps","w":"A/B tests measure real impact.","tree":false},{"id":"15.25","s":"distill","t":"kl","sc":"How the student learns","w":"KL divergence between teacher and student outputs.","tree":false},{"id":"13.26","s":"gridsearch","t":"cv","sc":"Score each combination fairly","w":"Use cross-validation inside the search.","tree":false},{"id":"13.27","s":"bayesopt","t":"gpreg","sc":"What the surrogate model is","w":"Usually a Gaussian process.","tree":false},{"id":"16.20","s":"fewshot","t":"icl","sc":"Few-shot with LLMs","w":"In-context learning gives examples in the prompt.","tree":false},{"id":"16.21","s":"online","t":"conceptdrift","sc":"The world keeps changing","w":"Online learning tracks drift.","tree":false},{"id":"14.28","s":"matfact","t":"svd","sc":"How factorization works","w":"SVD-style decomposition.","tree":false},{"id":"14.29","s":"timeseries","t":"tscv","sc":"Validate forecasts","w":"Use time-series splits.","tree":false},{"id":"14.30","s":"detection","t":"cnn","sc":"Need a feature extractor","w":"Detectors use CNN backbones.","tree":false},{"id":"15.26","s":"featstore","t":"leakage","sc":"Training-serving skew","w":"Shared features prevent mismatches.","tree":false}],"root":"ROOT","start":"M1","short":{"M1":"Foundations","M2":"Math & stats","M3":"Data & features","M4":"Regression","M5":"Classification","M6":"Ensembles","M7":"Unsupervised","M8":"Neural nets","M9":"Deep architectures","M10":"NLP & LLMs","M11":"Reinforcement","M12":"Metrics","M13":"Tuning & XAI","M14":"Domains","M15":"MLOps","M16":"Advanced"},"titles":{"M1":"ML Foundations","M2":"Math & Statistics for ML","M3":"Data & Feature Engineering","M4":"Supervised Learning: Regression","M5":"Supervised Learning: Classification","M6":"Ensemble Methods","M7":"Unsupervised Learning","M8":"Neural Networks & Training","M9":"Deep Learning Architectures","M10":"NLP & Large Language Models","M11":"Reinforcement Learning","M12":"Evaluation Metrics","M13":"Model Selection, Tuning & Interpretability","M14":"Specialized Domains","M15":"MLOps & Deployment","M16":"Advanced Learning Paradigms"}}</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const N = D.nodes, SHORT = D.short, LEVEL = D.level;
const OUT = {}, PARENT = {}, INTREE = {}, INOTHER = {}, WALKREF = {};
for (const e of D.edges){
  (OUT[e.s] = OUT[e.s] || []).push(e);
  if (e.tree){ PARENT[e.t] = e.s; INTREE[e.t] = e; }
  else (INOTHER[e.t] = INOTHER[e.t] || []).push(e);
}
const WALKE = {};
for (const [k,n] of Object.entries(N)) if (n.k === "step"){ (WALKREF[n.ref] = WALKREF[n.ref] || []).push(k); (WALKE[n.eid] = WALKE[n.eid] || []).push(k); }

const KIND = {S:"Topic", B:"Basic", I:"Intermediate", A:"Advanced", root:"Start here"};
const TITLES = D.titles || {};
const KCOL = {S:"var(--entry-bg)", B:"var(--basic)", I:"var(--inter)", A:"var(--adv)", Q:"var(--dec)", root:"var(--entry-bg)",
              guide:"var(--muted)", walk:"var(--walk)", step:"var(--walk)", note:"var(--dec)"};

const $ = s => document.querySelector(s);
const vp = $("#vp"), sizer = $("#sizer"), content = $("#content"), svg = $("#wires");
const SUBT = {}, CARD = {}, ELAB = {}, WIRES = [], LINKCARDS = [];
let scale = 1, mode = "map";
const store = {
  get(){ try { return JSON.parse(localStorage.getItem("ml-map-v1") || "null"); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem("ml-map-v1", JSON.stringify(v)); } catch(e){} }
};

function h(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

/* ---------------- build tree DOM */
function topicTag(p){ return p ? (SHORT[p] || "") : ""; }
function nameOf(k){ return N[k].t; }
function buildCard(k){
  const n = N[k];
  const card = h("div", "card k-" + n.k); card.dataset.key = k;
  const head = h("button", "head"); head.type = "button";
  const tr = h("span", "tagrow");
  tr.append(h("span", "kind", n.sec ? "Topic " + n.sec.num : (KIND[n.k] || "")));
  if (n.p && !n.sec) tr.append(h("span", "sec", topicTag(n.p)));
  head.append(tr);
  head.append(h("span", "title", n.t));
  if (n.f) head.append(h("span", "full", n.f));
  if (n.s) head.append(h("span", "ex", n.s));
  card.append(head);
  const acts = h("div", "acts");
  const outs = OUT[k] || [];
  let kc = null;
  if (outs.length){ kc = h("span", "kc"); kc.setAttribute("aria-hidden", "true"); card.append(kc); }
  const td = h("button", "td", "Details"); td.type = "button"; td.setAttribute("aria-expanded","false");
  td._lbl = "Details";
  td.addEventListener("click", ev => { ev.stopPropagation(); anchored(card, () => setDet(k, !card.classList.contains("dopen"))); });
  acts.append(td);
  card.append(acts);
  head.addEventListener("click", () => {
    if (outs.length) toggleOpen(k, card);
    else anchored(card, () => setDet(k, !card.classList.contains("dopen")));
  });
  card._kc = kc; card._td = td; card._head = head;
  CARD[k] = card;
  return card;
}

function buildLinkCard(e){
  const t = N[e.t];
  const card = h("div", "card link k-" + t.k); card.dataset.target = e.t;
  const head = h("button", "head"); head.type = "button";
  const tr = h("span", "tagrow");
  tr.append(h("span", "kind", "Related term"));
  tr.append(h("span", "sec", topicTag(t.p)));
  head.append(tr);
  head.append(h("span", "title", t.t));
  if (t.s) head.append(h("span", "ex", t.s));
  card.append(head);
  const acts = h("div", "acts");
  const go = h("button", "open", "Go to term"); go.type = "button";
  go.addEventListener("click", ev => { ev.stopPropagation(); jump(e.t, true); });
  head.addEventListener("click", () => jump(e.t, true));
  acts.append(go); card.append(acts);
  LINKCARDS.push(card);
  return card;
}

function buildEdgeLabel(e){
  const lab = h("div", "elabel" + (e.tree ? "" : " dash"));
  const hb = h("button", "ehead"); hb.type = "button"; hb.setAttribute("aria-expanded", "false");
  hb.title = "When to use " + N[e.t].t;
  hb.append(h("span", "enum", e.id), h("span", "etxt", e.sc), h("span", "emark", "?"));
  hb.addEventListener("click", ev => { ev.stopPropagation(); anchored(lab, () => setEdge(e.id, !lab.classList.contains("eopen"))); });
  lab.append(hb);
  ELAB[e.id] = {lab, e, hb};
  return lab;
}
function edgeLink(e, text){ const a = h("a","jump", text); a.href = "#"; a.title = "Open arrow " + e.id;
  a.addEventListener("click", ev => { ev.preventDefault(); ev.stopPropagation(); jumpEdge(e.id); }); return a; }
function edgeDetails(e){
  const d = h("div", "edet");
  d.append(h("h5", null, "Why"), para(e.w));
  if (e.c){ const c = h("div", "catch"); c.append(h("h5", null, "Trade-off"), para(e.c)); d.append(c); }
  return d;
}
function setEdge(id, on){
  const r = ELAB[id]; if (!r) return;
  let d = r.lab.querySelector(".edet");
  if (on && !d){ d = edgeDetails(r.e); r.lab.append(d); }
  if (d) d.hidden = !on;
  r.lab.classList.toggle("eopen", on);
  r.hb.setAttribute("aria-expanded", String(on));
  r.hb.querySelector(".emark").textContent = on ? "×" : "?";
}

function buildSubtree(k){
  const st = h("div", "subtree closed"); st.dataset.key = k; SUBT[k] = st;
  const card = buildCard(k); st.append(card);
  const outs = OUT[k] || [];
  if (outs.length){
    const kids = h("div", "kids");
    for (const e of outs){
      const br = h("div", "branch");
      let lab = null;
      if (e.id){ lab = buildEdgeLabel(e); }
      else if (e.lab){ lab = h("div", "elabel st", e.lab); }
      if (lab) br.append(lab);
      let cc;
      if (e.tree){ const sub = buildSubtree(e.t); br.append(sub); cc = sub.firstChild; }
      else { cc = buildLinkCard(e); br.append(cc); }
      WIRES.push({p: card, l: lab, c: cc, d: !e.tree});
      kids.append(br);
    }
    st.append(kids);
  }
  updTb(k);
  return st;
}

/* ---------------- details */
function para(text, cls){ return h("p", cls || null, text); }
function blk(title, ...nodes){ const b = h("div","blk"); if (title) b.append(h("h4", null, title)); b.append(...nodes); return b; }
function jumpBtn(k, label){ const a = h("a","jump", label || N[k].t); a.href = "#"; a.addEventListener("click", ev => { ev.preventDefault(); ev.stopPropagation(); jump(k, true); }); return a; }
function frag(...parts){ const f = document.createDocumentFragment(); for (const p of parts) f.append(typeof p === "string" ? document.createTextNode(p) : p); return f; }

function buildDetails(k){
  const n = N[k], d = h("div","details");
  if (n.k === "root"){
    d.append(blk(null, para(n.hp)));
    const s = h("div","stats"); for (const [v,l] of n.stats){ const c = h("div"); c.append(h("b",null,String(v)), h("span",null,l)); s.append(c); }
    d.append(blk("Inside", s));
    const L = [["var(--basic)","var(--basic-bg)","Basic term"],["var(--inter)","var(--inter-bg)","Intermediate term"],
               ["var(--adv)","var(--adv-bg)","Advanced term"],["var(--entry-bg)","var(--entry-bg)","Topic"],
               ["var(--wire)","transparent","Dashed: related term that lives in another branch"]];
    const b = blk("Colours"); for (const [s2,bg,l] of L){ const r = h("div","lg"); const sw = h("span","sw"); sw.style.setProperty("--s",s2); sw.style.setProperty("--b",bg); if (bg==="transparent") sw.style.borderStyle="dashed"; r.append(sw, h("span",null,l)); b.append(r); }
    d.append(b);
    return d;
  }
  if (n.f) d.append(blk("Full form", para(n.f, "fullv")));
  if (n.v){ const fig = h("div", "vizwrap"); fig.innerHTML = VIZ.render(n.v); if (fig.firstChild) d.append(blk("Visual", fig)); }
  if (n.fx) d.append(blk("Formula", para(n.fx, "fx")));
  if (n.hp) d.append(blk("How it helps", para(n.hp)));
  if (n.x) d.append(blk(n.sec ? "Key terms" : "Key points / examples", para(n.x)));
  return d;
}

/* ---------------- state changes */
function updTb(k){
  const c = CARD[k]; if (!c || !c._kc) return;
  const closed = SUBT[k].classList.contains("closed"), n = (OUT[k]||[]).length;
  c._kc.textContent = closed ? String(n) : "−";
  c._head.setAttribute("aria-expanded", String(!closed));
  c._head.title = closed ? "Click to show " + n + (n === 1 ? " branch" : " branches") : "Click to hide the branches";
}
function setOpen(k, open){ const st = SUBT[k]; if (!st || !(OUT[k]||[]).length) return; st.classList.toggle("closed", !open); updTb(k); }
function toggleOpen(k, card){ anchored(card, () => setOpen(k, SUBT[k].classList.contains("closed"))); }
function setDet(k, on){
  const c = CARD[k]; if (!c) return;
  let d = c.querySelector(":scope > .details");
  if (on && !d){ d = buildDetails(k); c.append(d); }
  if (d) d.hidden = !on;
  c.classList.toggle("dopen", on);
  c._td.textContent = on ? "Hide details" : c._td._lbl; c._td.setAttribute("aria-expanded", String(on));
}
function openBelow(k){ setOpen(k, true); for (const e of OUT[k]||[]) if (e.tree) openBelow(e.t); }

/* keep the clicked card still while the layout around it changes */
function anchored(card, fn){
  const r0 = card.getBoundingClientRect();
  fn(); relayout();
  const r1 = card.getBoundingClientRect();
  vp.scrollLeft += r1.left - r0.left; vp.scrollTop += r1.top - r0.top;
  save();
}

/* ---------------- layout & wires */
function relayout(){
  if (mode === "map"){
    const W = content.offsetWidth, H = content.offsetHeight;
    sizer.style.width = Math.ceil(W*scale) + "px"; sizer.style.height = Math.ceil(H*scale) + "px";
    content.style.transform = "scale(" + scale + ")";
    svg.setAttribute("width", W); svg.setAttribute("height", H);
    draw();
  }
}
function box(el){ return {x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight}; }
function curve(x1,y1,x2,y2){ const dx = Math.max(16,(x2-x1)/2); return "M"+x1+","+y1+" C"+(x1+dx)+","+y1+" "+(x2-dx)+","+y2+" "+x2+","+y2; }
function draw(){
  let s = "", d = "", heads = "";
  for (const w of WIRES){
    if (w.c.offsetParent === null) continue;
    const p = box(w.p), c = box(w.c);
    const px = p.x + p.w, py = p.y + p.h/2, cy = c.y + c.h/2;
    let seg;
    if (w.l){ const l = box(w.l); const ly = l.y + l.h/2;
      seg = curve(px,py,l.x,ly) + " M" + (l.x+l.w) + "," + ly + " L" + (c.x-2) + "," + cy; }
    else seg = curve(px,py,c.x-2,cy);
    if (w.d) d += seg + " "; else s += seg + " ";
    heads += '<path class="ah" d="M'+(c.x-9)+','+(cy-4.5)+' L'+(c.x-1)+','+cy+' L'+(c.x-9)+','+(cy+4.5)+' z"/>';
  }
  $("#wsolid").setAttribute("d", s); $("#wdash").setAttribute("d", d); $("#wheads").innerHTML = heads;
}

/* ---------------- zoom & pan */
function setScale(ns, cx, cy){
  ns = Math.max(0.2, Math.min(1.6, ns));
  if (cx == null){ cx = vp.clientWidth/2; cy = vp.clientHeight/2; }
  const X = (vp.scrollLeft + cx)/scale, Y = (vp.scrollTop + cy)/scale;
  scale = ns; relayout();
  vp.scrollLeft = X*scale - cx; vp.scrollTop = Y*scale - cy;
  $("#zv").textContent = Math.round(scale*100) + "%"; save();
}
$("#zin").onclick = () => setScale(scale*1.2);
$("#zout").onclick = () => setScale(scale/1.2);
$("#zfit").onclick = () => { const t = content.querySelector(".subtree"); const W = t.offsetLeft + t.offsetWidth + 40, H = t.offsetTop + t.offsetHeight + 40;
  setScale(Math.min(vp.clientWidth/W, vp.clientHeight/H, 1)); vp.scrollLeft = 0; vp.scrollTop = Math.max(0,(t.offsetTop + t.offsetHeight/2)*scale - vp.clientHeight/2); };
vp.addEventListener("wheel", e => {
  if (mode !== "map" || !(e.ctrlKey || e.metaKey)) return;
  e.preventDefault(); const r = vp.getBoundingClientRect();
  setScale(scale * Math.exp(-e.deltaY * 0.0022), e.clientX - r.left, e.clientY - r.top);
}, {passive:false});
let drag = null;
vp.addEventListener("pointerdown", e => {
  if (mode !== "map" || e.pointerType !== "mouse" || e.button !== 0) return;
  if (e.target.closest(".card,.elabel,button,input,select,a,.legend")) return;
  drag = {x:e.clientX, y:e.clientY, l:vp.scrollLeft, t:vp.scrollTop}; vp.classList.add("drag"); vp.setPointerCapture(e.pointerId);
});
vp.addEventListener("pointermove", e => { if (!drag) return; vp.scrollLeft = drag.l - (e.clientX - drag.x); vp.scrollTop = drag.t - (e.clientY - drag.y); });
const endDrag = () => { drag = null; vp.classList.remove("drag"); };
vp.addEventListener("pointerup", endDrag); vp.addEventListener("pointercancel", endDrag);

/* ---------------- jump / center */
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function center(card){
  if (mode === "map"){

Object.keys(TITLES).forEach((p, i) => { const o = h("option", null, (i + 1) + ". " + TITLES[p]); o.value = p; ovsel.append(o); });
ovsel.onchange = () => renderOv(ovsel.value);
$("#ovbtn").onclick = openOv; $("#ovclose").onclick = closeOv;
$("#ovzin").onclick = () => setOvScale(ovScale * 1.2); $("#ovzout").onclick = () => setOvScale(ovScale / 1.2); $("#ovfit").onclick = fitOv;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !ov.hidden) closeOv(); });
ovbox.addEventListener("click", e => {
  const g = e.target.closest(".ovnode"); if (!g) return; const k = g.dataset.k;
  if (g.dataset.ghost){ const t = N[k]; renderOv(t.sec ? k : t.p, k); return; }
  if (ovCur === D.root && N[k].sec){ renderOv(k); return; }
  closeOv(); jump(k, true);
});
let od = null;
ovbox.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse" || e.button !== 0 || e.target.closest(".ovnode")) return; od = { x: e.clientX, y: e.clientY, l: ovbox.scrollLeft, t: ovbox.scrollTop }; ovbox.classList.add("drag"); ovbox.setPointerCapture(e.pointerId); });
ovbox.addEventListener("pointermove", e => { if (!od) return; ovbox.scrollLeft = od.l - (e.clientX - od.x); ovbox.scrollTop = od.t - (e.clientY - od.y); });
const endOd = () => { od = null; ovbox.classList.remove("drag"); }; ovbox.addEventListener("pointerup", endOd); ovbox.addEventListener("pointercancel", endOd);
ovbox.addEventListener("wheel", e => { if (!(e.ctrlKey || e.metaKey)) return; e.preventDefault(); setOvScale(ovScale * Math.exp(-e.deltaY * 0.002)); }, { passive: false });
/* Save as PDF: every topic's overview, one per page, through the browser's print dialog */
function buildPrint(){ let pr = document.getElementById("printroot"); if (pr) pr.remove(); pr = h("div"); pr.id = "printroot";
  let css = ""; const PX = 0.2646;   /* mm per CSS pixel: each page is sized to its graph at 100% */
  [D.root].concat(Object.keys(TITLES)).forEach((k, i) => { const r = svgFor(k), wmm = Math.max(297, r.W * PX + 16), hmm = Math.max(210, r.H * PX + 30);
    css += `@page ov${i}{size:${wmm.toFixed(0)}mm ${hmm.toFixed(0)}mm;margin:8mm}#printroot .pg${i}{page:ov${i}}`;
    const pg = h("section", "ppage pg" + i); pg.append(h("h2", null, k === D.root ? N[k].t + ": all topics" : i + ". " + TITLES[k]));
    const box = h("div", "pbox"); box.innerHTML = r.svg; pg.append(box); pr.append(pg); });
  const st = h("style"); st.textContent = "@media print{" + css + "}"; pr.prepend(st);
  document.body.append(pr); return pr; }
$("#ovpdf").onclick = () => { buildPrint(); window.print(); };
window.addEventListener("afterprint", () => { const pr = document.getElementById("printroot"); if (pr) pr.remove(); });
window.__buildOverviewPrint = buildPrint;
})();
})();
