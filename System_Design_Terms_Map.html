const KCOL = {S:"var(--entry-bg)", B:"var(--basic)", I:"var(--inter)", A:"var(--adv)", Q:"var(--dec)", root:"var(--entry-bg)",
              guide:"var(--muted)", walk:"var(--walk)", step:"var(--walk)", note:"var(--dec)"};

const $ = s => document.querySelector(s);
const vp = $("#vp"), sizer = $("#sizer"), content = $("#content"), svg = $("#wires");
const SUBT = {}, CARD = {}, ELAB = {}, WIRES = [], LINKCARDS = [];
let scale = 1, mode = "map";
const store = {
  get(){ try { return JSON.parse(localStorage.getItem("sd-terms-v4") || "null"); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem("sd-terms-v4", JSON.stringify(v)); } catch(e){} }
};

function h(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

/* ---------------- build tree DOM */
function topicTag(p){ return p ? (SHORT[p] || "") : ""; }
function nameOf(k){ return N[k].t; }
function buildCard(k){
  const n = N[k];
  const card = h("div", "card k-" + n.k); card.dataset.key = k;
  const head = h("button", "head"); head.type = "button";
  const tr = h("span", "tagrow");
  tr.append(h("span", "kind", n.sec ? "Topic " + n.sec.num : (KIND[n.k] || "")));
  if (n.p && !n.sec) tr.append(h("span", "sec", topicTag(n.p)));
  head.append(tr);
  head.append(h("span", "title", n.t));
  if (n.f) head.append(h("span", "full", n.f));
  if (n.s) head.append(h("span", "ex", n.s));
  card.append(head);
  const acts = h("div", "acts");
  const outs = OUT[k] || [];
  let kc = null;
  if (outs.length){ kc = h("span", "kc"); kc.setAttribute("aria-hidden", "true"); card.append(kc); }
  const td = h("button", "td", "Details"); td.type = "button"; td.setAttribute("aria-expanded","false");
  td._lbl = "Details";
  td.addEventListener("click", ev => { ev.stopPropagation(); anchored(card, () => setDet(k, !card.classList.contains("dopen"))); });
  acts.append(td);
  card.append(acts);
  head.addEventListener("click", () => {
    if (outs.length) toggleOpen(k, card);
    else anchored(card, () => setDet(k, !card.classList.contains("dopen")));
  });
  card._kc = kc; card._td = td; card._head = head;
  CARD[k] = card;
  return card;
}

function buildLinkCard(e){
  const t = N[e.t];
  const card = h("div", "card link k-" + t.k); card.dataset.target = e.t;
  const head = h("button", "head"); head.type = "button";
  const tr = h("span", "tagrow");
  tr.append(h("span", "kind", "Related term"));
  tr.append(h("span", "sec", topicTag(t.p)));
  head.append(tr);
  head.append(h("span", "title", t.t));
  if (t.s) head.append(h("span", "ex", t.s));
  card.append(head);
  const acts = h("div", "acts");
  const go = h("button", "open", "Go to term"); go.type = "button";
  go.addEventListener("click", ev => { ev.stopPropagation(); jump(e.t, true); });
  head.addEventListener("click", () => jump(e.t, true));
  acts.append(go); card.append(acts);
  LINKCARDS.push(card);
  return card;
}

function buildEdgeLabel(e){
  const lab = h("div", "elabel" + (e.tree ? "" : " dash"));
  const hb = h("button", "ehead"); hb.type = "button"; hb.setAttribute("aria-expanded", "false");
  hb.title = "When to use " + N[e.t].t;
  hb.append(h("span", "enum", e.id), h("span", "etxt", e.sc), h("span", "emark", "?"));
  hb.addEventListener("click", ev => { ev.stopPropagation(); anchored(lab, () => setEdge(e.id, !lab.classList.contains("eopen"))); });
  lab.append(hb);
  ELAB[e.id] = {lab, e, hb};
  return lab;
}
function edgeLink(e, text){ const a = h("a","jump", text); a.href = "#"; a.title = "Open arrow " + e.id;
  a.addEventListener("click", ev => { ev.preventDefault(); ev.stopPropagation(); jumpEdge(e.id); }); return a; }
function edgeDetails(e){
  const d = h("div", "edet");
  d.append(h("h5", null, "Why"), para(e.w));
  if (e.c){ const c = h("div", "catch"); c.append(h("h5", null, "Trade-off"), para(e.c)); d.append(c); }
  return d;
}
function setEdge(id, on){
  const r = ELAB[id]; if (!r) return;
  let d = r.lab.querySelector(".edet");
  if (on && !d){ d = edgeDetails(r.e); r.lab.append(d); }
  if (d) d.hidden = !on;
  r.lab.classList.toggle("eopen", on);
  r.hb.setAttribute("aria-expanded", String(on));
  r.hb.querySelector(".emark").textContent = on ? "×" : "?";
}

function buildSubtree(k){
  const st = h("div", "subtree closed"); st.dataset.key = k; SUBT[k] = st;
  const card = buildCard(k); st.append(card);
  const outs = OUT[k] || [];
  if (outs.length){
    const kids = h("div", "kids");
    for (const e of outs){
      const br = h("div", "branch");
      let lab = null;
      if (e.id){ lab = buildEdgeLabel(e); }
      else if (e.lab){ lab = h("div", "elabel st", e.lab); }
      if (lab) br.append(lab);
      let cc;
      if (e.tree){ const sub = buildSubtree(e.t); br.append(sub); cc = sub.firstChild; }
      else { cc = buildLinkCard(e); br.append(cc); }
      WIRES.push({p: card, l: lab, c: cc, d: !e.tree});
      kids.append(br);
    }
    st.append(kids);
  }
  updTb(k);
  return st;
}

/* ---------------- details */
function para(text, cls){ return h("p", cls || null, text); }
function blk(title, ...nodes){ const b = h("div","blk"); if (title) b.append(h("h4", null, title)); b.append(...nodes); return b; }
function jumpBtn(k, label){ const a = h("a","jump", label || N[k].t); a.href = "#"; a.addEventListener("click", ev => { ev.preventDefault(); ev.stopPropagation(); jump(k, true); }); return a; }
function frag(...parts){ const f = document.createDocumentFragment(); for (const p of parts) f.append(typeof p === "string" ? document.createTextNode(p) : p); return f; }

function buildDetails(k){
  const n = N[k], d = h("div","details");
  if (n.k === "root"){
    d.append(blk(null, para(n.hp)));
    const s = h("div","stats"); for (const [v,l] of n.stats){ const c = h("div"); c.append(h("b",null,String(v)), h("span",null,l)); s.append(c); }
    d.append(blk("Inside", s));
    const L = [["var(--basic)","var(--basic-bg)","Basic term"],["var(--inter)","var(--inter-bg)","Intermediate term"],
               ["var(--adv)","var(--adv-bg)","Advanced term"],["var(--entry-bg)","var(--entry-bg)","Topic"],
               ["var(--wire)","transparent","Dashed: related term that lives in another branch"]];
    const b = blk("Colours"); for (const [s2,bg,l] of L){ const r = h("div","lg"); const sw = h("span","sw"); sw.style.setProperty("--s",s2); sw.style.setProperty("--b",bg); if (bg==="transparent") sw.style.borderStyle="dashed"; r.append(sw, h("span",null,l)); b.append(r); }
    d.append(b);
    return d;
  }
  if (n.f) d.append(blk("Full form", para(n.f, "fullv")));
  if (n.v){ const fig = h("div", "vizwrap"); fig.innerHTML = VIZ.render(n.v); if (fig.firstChild) d.append(blk("Visual", fig)); }
  if (n.fx) d.append(blk("Formula", para(n.fx, "fx")));
  if (n.hp) d.append(blk("How it helps", para(n.hp)));
  if (n.x) d.append(blk(n.sec ? "Key terms" : "Key points / examples", para(n.x)));
  return d;
}

/* ---------------- state changes */
function updTb(k){
  const c = CARD[k]; if (!c || !c._kc) return;
  const closed = SUBT[k].classList.contains("closed"), n = (OUT[k]||[]).length;
  c._kc.textContent = closed ? String(n) : "−";
  c._head.setAttribute("aria-expanded", String(!closed));
  c._head.title = closed ? "Click to show " + n + (n === 1 ? " branch" : " branches") : "Click to hide the branches";
}
function setOpen(k, open){ const st = SUBT[k]; if (!st || !(OUT[k]||[]).length) return; st.classList.toggle("closed", !open); updTb(k); }
function toggleOpen(k, card){ anchored(card, () => setOpen(k, SUBT[k].classList.contains("closed"))); }
function setDet(k, on){
  const c = CARD[k]; if (!c) return;
  let d = c.querySelector(":scope > .details");
  if (on && !d){ d = buildDetails(k); c.append(d); }
  if (d) d.hidden = !on;
  c.classList.toggle("dopen", on);
  c._td.textContent = on ? "Hide details" : c._td._lbl; c._td.setAttribute("aria-expanded", String(on));
}
function openBelow(k){ setOpen(k, true); for (const e of OUT[k]||[]) if (e.tree) openBelow(e.t); }

/* keep the clicked card still while the layout around it changes */
function anchored(card, fn){
  const r0 = card.getBoundingClientRect();
  fn(); relayout();
  const r1 = card.getBoundingClientRect();
  vp.scrollLeft += r1.left - r0.left; vp.scrollTop += r1.top - r0.top;
  save();
}

/* ---------------- layout & wires */
function relayout(){
  if (mode === "map"){
    const W = content.offsetWidth, H = content.offsetHeight;
    sizer.style.width = Math.ceil(W*scale) + "px"; sizer.style.height = Math.ceil(H*scale) + "px";
    content.style.transform = "scale(" + scale + ")";
    svg.setAttribute("width", W); svg.setAttribute("height", H);
    draw();
  }
}
function box(el){ return {x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight}; }
function curve(x1,y1,x2,y2){ const dx = Math.max(16,(x2-x1)/2); return "M"+x1+","+y1+" C"+(x1+dx)+","+y1+" "+(x2-dx)+","+y2+" "+x2+","+y2; }
function draw(){
  let s = "", d = "", heads = "";
  for (const w of WIRES){
    if (w.c.offsetParent === null) continue;
    const p = box(w.p), c = box(w.c);
    const px = p.x + p.w, py = p.y + p.h/2, cy = c.y + c.h/2;
    let seg;
    if (w.l){ const l = box(w.l); const ly = l.y + l.h/2;
      seg = curve(px,py,l.x,ly) + " M" + (l.x+l.w) + "," + ly + " L" + (c.x-2) + "," + cy; }
    else seg = curve(px,py,c.x-2,cy);
    if (w.d) d += seg + " "; else s += seg + " ";
    heads += '<path class="ah" d="M'+(c.x-9)+','+(cy-4.5)+' L'+(c.x-1)+','+cy+' L'+(c.x-9)+','+(cy+4.5)+' z"/>';
  }
  $("#wsolid").setAttribute("d", s); $("#wdash").setAttribute("d", d); $("#wheads").innerHTML = heads;
}

/* ---------------- zoom & pan */
function setScale(ns, cx, cy){
  ns = Math.max(0.2, Math.min(1.6, ns));
  if (cx == null){ cx = vp.clientWidth/2; cy = vp.clientHeight/2; }
  const X = (vp.scrollLeft + cx)/scale, Y = (vp.scrollTop + cy)/scale;
  scale = ns; relayout();
  vp.scrollLeft = X*scale - cx; vp.scrollTop = Y*scale - cy;
  $("#zv").textContent = Math.round(scale*100) + "%"; save();
}
$("#zin").onclick = () => setScale(scale*1.2);
$("#zout").onclick = () => setScale(scale/1.2);
$("#zfit").onclick = () => { const t = content.querySelector(".subtree"); const W = t.offsetLeft + t.offsetWidth + 40, H = t.offsetTop + t.offsetHeight + 40;
  setScale(Math.min(vp.clientWidth/W, vp.clientHeight/H, 1)); vp.scrollLeft = 0; vp.scrollTop = Math.max(0,(t.offsetTop + t.offsetHeight/2)*scale - vp.clientHeight/2); };
vp.addEventListener("wheel", e => {
  if (mode !== "map" || !(e.ctrlKey || e.metaKey)) return;
  e.preventDefault(); const r = vp.getBoundingClientRect();
  setScale(scale * Math.exp(-e.deltaY * 0.0022), e.clientX - r.left, e.clientY - r.top);
}, {passive:false});
let drag = null;
vp.addEventListener("pointerdown", e => {
  if (mode !== "map" || e.pointerType !== "mouse" || e.button !== 0) return;
  if (e.target.closest(".card,.elabel,button,input,select,a,.legend")) return;
  drag = {x:e.clientX, y:e.clientY, l:vp.scrollLeft, t:vp.scrollTop}; vp.classList.add("drag"); vp.setPointerCapture(e.pointerId);
});
vp.addEventListener("pointermove", e => { if (!drag) return; vp.scrollLeft = drag.l - (e.clientX - drag.x); vp.scrollTop = drag.t - (e.clientY - drag.y); });
const endDrag = () => { drag = null; vp.classList.remove("drag"); };
vp.addEventListener("pointerup", endDrag); vp.addEventListener("pointercancel", endDrag);

/* ---------------- jump / center */
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function center(card){
  if (mode === "map"){
    const b = box(card);
    const vw = vp.clientWidth, vh = vp.clientHeight, cw = b.w*scale, ch = b.h*scale;
    const left = b.x*scale - Math.max(24, Math.min((vw - cw)/2, vw*0.38));
    const top = b.y*scale - Math.max(24, (vh - ch)/2);
    vp.scrollTo({left: Math.max(0,left), top: Math.max(0,top), behavior: reduced ? "auto" : "smooth"});
  } else card.scrollIntoView({block:"center", behavior: reduced ? "auto" : "smooth"});
}
function jumpEdge(id){
  const r = ELAB[id]; if (!r) return;
  let a = r.e.s; while (a){ setOpen(a, true); a = PARENT[a]; }
  setEdge(id, true); relayout();
  center(r.lab); r.lab.classList.remove("flash"); void r.lab.offsetWidth; r.lab.classList.add("flash");
  setTimeout(() => r.lab.classList.remove("flash"), 1700); save();
}
function jump(k, details){
  let a = PARENT[k]; while (a){ setOpen(a, true); a = PARENT[a]; }
  if (details) setDet(k, true);
  relayout();
  const c = CARD[k]; center(c);
  c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash");
  setTimeout(() => c.classList.remove("flash"), 1700);
  save();
}

/* ---------------- toolbar */
function setMode(m){
  mode = m; document.body.classList.toggle("outline", m === "outline");
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  if (m === "map") relayout(); else { content.style.transform = ""; }
  save();
}
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { const r = CARD[D.root]; setMode(b.dataset.mode); center(r); });
function setPass(p){ document.body.dataset.pass = p; document.querySelectorAll("[data-pass]").forEach(b => { if (b.tagName === "BUTTON") b.setAttribute("aria-pressed", String(b.dataset.pass === p)); }); save(); }
document.querySelectorAll("button[data-pass]").forEach(b => b.onclick = () => setPass(b.dataset.pass));
$("#openall").onclick = () => { const r = CARD[D.root]; anchored(r, () => Object.keys(SUBT).forEach(k => setOpen(k, true))); };
$("#closeall").onclick = () => { Object.keys(SUBT).forEach(k => setOpen(k, k === D.root)); relayout(); center(CARD[D.root]); save(); };
$("#alldet").onclick = function(){
  const on = this.getAttribute("aria-pressed") !== "true";
  this.setAttribute("aria-pressed", String(on)); this.textContent = on ? "Close all details" : "Open all details";
  const r = CARD[D.root]; anchored(r, () => { Object.keys(CARD).forEach(k => setDet(k, on)); Object.keys(ELAB).forEach(id => setEdge(id, on)); });
};
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark"; draw(); save();
};
$("#lgx").onclick = () => { $("#legend").hidden = true; save(); };
const secsel = $("#secsel");
Object.keys(TITLES).forEach((p,i) => { const o = h("option", null, (i+1) + ". " + TITLES[p]); o.value = p; secsel.append(o); });
secsel.onchange = () => { const p = secsel.value; if (!p) return; const k = Object.keys(N).find(x => N[x].sec && N[x].sec.pid === p); jump(k, true); secsel.value = ""; };

/* ---------------- search */
const q = $("#q"), res = $("#results");
const IDX = Object.entries(N).filter(([k,n]) => n.k !== "root").map(([k,n]) => ({k, t:(n.t + " " + (n.f||"")).toLowerCase(),
  all:[n.t, n.f, n.s, n.hp, n.x].filter(Boolean).join(" ").toLowerCase()}));
for (const e of D.edges) if (e.id) IDX.push({k: "e:" + e.id, id: e.id, t: (e.id + " " + e.sc).toLowerCase(),
  all: [e.id, e.sc, e.w, e.c, N[e.t].t].filter(Boolean).join(" ").toLowerCase()});
let sel = -1, hits = [];
function runSearch(){
  const terms = q.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  res.innerHTML = ""; sel = -1;
  if (!terms.length){ res.classList.remove("on"); return; }
  hits = IDX.filter(r => terms.every(t => r.all.includes(t))).map(r => {
    let sc = r.id ? -0.5 : 0; for (const t of terms){ if (r.id === t) sc += 20; if (r.t.startsWith(t)) sc += 4; else if (r.t.includes(t)) sc += 3; else sc += 1; }
    return [sc, r.k];
  }).sort((a,b) => b[0]-a[0]).slice(0, 18).map(x => x[1]);
  if (!hits.length){ res.append(h("div","res-empty","No term found. Try one word, like cache, queue or shard.")); }
  hits.forEach((k,i) => {
    const b = h("button","res"); b.type="button"; b.setAttribute("role","option");
    const t = h("span");
    if (k.startsWith("e:")){ const e = ELAB[k.slice(2)].e; b.style.setProperty("--c", "var(--wire)");
      t.append(h("b",null,nameOf(e.t) + " when: " + e.sc), h("small",null,"Arrow " + e.id + " from " + nameOf(e.s))); }
    else { const n = N[k]; b.style.setProperty("--c", KCOL[n.k]);
      t.append(h("b",null,n.t + (n.f && n.f.length < 40 ? " (" + n.f + ")" : "")), h("small",null,n.sec ? "Topic " + n.sec.num : (KIND[n.k]||"") + (n.p ? ", " + (TITLES[n.p]||"") : ""))); }
    b.append(h("span","dot"), t);
    b.addEventListener("mousedown", ev => ev.preventDefault());
    b.addEventListener("click", () => pick(i));
    res.append(b);
  });
  res.classList.add("on");
}
function pick(i){ const k = hits[i]; if (!k) return; res.classList.remove("on"); q.blur(); if (k.startsWith("e:")) jumpEdge(k.slice(2)); else jump(k, true); }
q.addEventListener("input", runSearch);
q.addEventListener("focus", () => { if (q.value) runSearch(); });
q.addEventListener("blur", () => setTimeout(() => res.classList.remove("on"), 120));
q.addEventListener("keydown", e => {
  const items = res.querySelectorAll(".res");
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); if (!items.length) return;
    sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
    items.forEach((b,i) => b.setAttribute("aria-selected", String(i === sel))); items[sel].scrollIntoView({block:"nearest"}); }
  else if (e.key === "Enter"){ pick(sel < 0 ? 0 : sel); }
  else if (e.key === "Escape"){ res.classList.remove("on"); q.blur(); }
});

/* ---------------- persistence */
let saveT = null;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(() => store.set({
    open: Object.keys(SUBT).filter(k => !SUBT[k].classList.contains("closed")),
    det: Object.keys(CARD).filter(k => CARD[k].classList.contains("dopen")),
    edg: Object.keys(ELAB).filter(id => ELAB[id].lab.classList.contains("eopen")),
    mode, scale, pass: document.body.dataset.pass, theme: document.documentElement.dataset.theme || "",
    legend: !$("#legend").hidden
  }), 250);
}

/* ---------------- init */
const tree = buildSubtree(D.root);
content.append(tree);
const R = N[D.root];
$("#stats").textContent = R.stats.map(([v,l]) => v + " " + l).join(", ") + ". Cards are terms; arrows say when to use them.";
const st = store.get();
if (st){
  (st.open || []).forEach(k => setOpen(k, true));
  (st.det || []).forEach(k => setDet(k, true));
  (st.edg || []).forEach(id => setEdge(id, true));
  if (st.scale) scale = st.scale;
  if (st.pass) setPass(st.pass);
  if (st.theme) document.documentElement.dataset.theme = st.theme;
  if (st.legend === false) $("#legend").hidden = true;
  setMode(st.mode || (innerWidth < 760 ? "outline" : "map"));
} else {
  setOpen(D.root, true); setDet(D.root, true);
  setMode(innerWidth < 760 ? "outline" : "map");
}
$("#zv").textContent = Math.round(scale*100) + "%";
relayout();
requestAnimationFrame(() => { const b = box(CARD[D.root]); if (mode === "map") vp.scrollTop = (b.y + b.h/2)*scale - vp.clientHeight/2; });
new ResizeObserver(() => relayout()).observe(content);
if (document.fonts) document.fonts.ready.then(relayout);
/* ---------------- Overview: top-to-bottom graph per topic (separate panel; the main map is untouched) */
(function(){
const ov = $("#ov"), ovsel = $("#ovsel"), ovbox = $("#ovbox"), ovzv = $("#ovzv");
let ovScale = 1, ovCur = null, ovDim = [0, 0];
const ctx = document.createElement("canvas").getContext("2d");
const FF = getComputedStyle(document.body).fontFamily || "sans-serif";
const tw = (s, px, bold) => { ctx.font = (bold ? "700 " : "400 ") + px + "px " + FF; return ctx.measureText(s).width; };
const escX = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function wrapW(s, max){ const words = String(s).split(/\s+/), out = []; let cur = "";
  for (const w of words){ if (!cur) cur = w; else if ((cur + " " + w).length <= max) cur += " " + w; else { out.push(cur); cur = w; } }
  if (cur) out.push(cur); return out; }
function clip(s, n){ s = String(s || ""); return s.length > n ? s.slice(0, n - 1).replace(/[\s,;:]+$/, "") + "…" : s; }
const TFS = 12, SFS = 10, LFS = 10;

function makeNode(key, inEdge, ghost, top){
  const n = N[key];
  let title = wrapW(n.t, 20); if (title.length > 3){ title = title.slice(0, 3); title[2] = clip(title[2], 18); }
  let sub;
  if (ghost) sub = ["in " + clip(TITLES[n.p] || "", 30)];
  else if (key === D.root) sub = [N[key].stats ? N[key].stats.map(x => x[0] + " " + x[1]).join(" · ") : ""];
