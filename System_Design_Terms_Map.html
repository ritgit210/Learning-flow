<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>System Design Terms Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --paper:#EDF0EB; --paper2:#F6F8F5; --grid:rgba(30,45,38,.065);
  --ink:#1B2420; --ink2:#3C4842; --muted:#64716B; --card:#FFFFFF; --line:#CDD5CF; --wire:#8F9D96;
  --basic:#2B7A4B; --basic-bg:#E5F1E9;
  --inter:#2659A9; --inter-bg:#E4ECF8;
  --adv:#743FA1; --adv-bg:#EFE7F6;
  --dec:#9A6B00; --dec-bg:#FBF0D6; --dec-line:#E2B33E;
  --entry-bg:#1F2E28; --entry-ink:#F1F5F2; --entry-muted:#B6C4BD;
  --walk:#0E7471; --walk-bg:#E0F1F0;
  --focus:#2659A9; --hl:#E2B33E;
  --v0:#2563A8; --v1:#D9480F; --v2:#2B8A3E; --v3:#7B3FA0; --vg:#A3ADA8; --vbg:#FFFFFF; --vink:#1B2420; --vmut:#66736C;
  --note-bg:#FFF4C2; --note-line:#B08300; --note-ink:#3A3000; --catch:#A8323E; --catch-bg:#FBEAEC;
  --shadow:0 1px 0 rgba(20,30,25,.06), 0 2px 8px rgba(20,30,25,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121715; --paper2:#171D1A; --grid:rgba(220,235,228,.045);
    --ink:#E3E9E5; --ink2:#C3CDC8; --muted:#95A39C; --card:#1B2220; --line:#2F3A35; --wire:#5F6E67;
    --basic:#6FC391; --basic-bg:#17271E; --inter:#86AEF0; --inter-bg:#172235;
    --adv:#BD92E2; --adv-bg:#251B2F; --dec:#E6B850; --dec-bg:#2A2313; --dec-line:#8C6C1E;
    --entry-bg:#2C3D36; --entry-ink:#EEF4F0; --entry-muted:#A9BAB2;
    --walk:#5CC7C2; --walk-bg:#13292A; --focus:#86AEF0; --hl:#E6B850;
    --v0:#7FAEF0; --v1:#F08C5A; --v2:#6FC391; --v3:#C29BE6; --vg:#5E6D66; --vbg:#1A211E; --vink:#E3E9E5; --vmut:#95A39C;
    --note-bg:#2E2810; --note-line:#E6B850; --note-ink:#F3E7BE; --catch:#F08C97; --catch-bg:#2E1A1D;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
    --paper:#121715; --paper2:#171D1A; --grid:rgba(220,235,228,.045);
    --ink:#E3E9E5; --ink2:#C3CDC8; --muted:#95A39C; --card:#1B2220; --line:#2F3A35; --wire:#5F6E67;
    --basic:#6FC391; --basic-bg:#17271E; --inter:#86AEF0; --inter-bg:#172235;
    --adv:#BD92E2; --adv-bg:#251B2F; --dec:#E6B850; --dec-bg:#2A2313; --dec-line:#8C6C1E;
    --entry-bg:#2C3D36; --entry-ink:#EEF4F0; --entry-muted:#A9BAB2;
    --walk:#5CC7C2; --walk-bg:#13292A; --focus:#86AEF0; --hl:#E6B850;
    --v0:#7FAEF0; --v1:#F08C5A; --v2:#6FC391; --v3:#C29BE6; --vg:#5E6D66; --vbg:#1A211E; --vink:#E3E9E5; --vmut:#95A39C;
    --note-bg:#2E2810; --note-line:#E6B850; --note-ink:#F3E7BE; --catch:#F08C97; --catch-bg:#2E1A1D;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

/* ---------- top bar */
.bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 14px;
  background:var(--paper2);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand h1{margin:0;font-size:19px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.grp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
.grp button{border:0;background:none;padding:5px 9px;cursor:pointer;font-size:13px;white-space:nowrap}
.grp button+button{border-left:1px solid var(--line)}
.grp button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.grp .lbl{padding:5px 3px 5px 9px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover,.grp button:hover:not([aria-pressed="true"]){background:var(--paper)}
.zoomv{min-width:46px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);padding:0 4px}
select.btn{padding-right:6px;max-width:170px}
.search{position:relative}
.search input{width:210px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px}
.results{position:absolute;top:calc(100% + 4px);left:0;width:min(420px,92vw);max-height:60vh;overflow:auto;background:var(--card);
  border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:none;z-index:20}
.results.on{display:block}
.res{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:7px;cursor:pointer}
.res[aria-selected="true"],.res:hover{background:var(--paper)}
.res .dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--c)}
.res b{display:block;font-weight:700;font-size:13.5px}
.res small{display:block;color:var(--muted);font-size:12px}
.res-empty{padding:10px;color:var(--muted);font-size:13px}
body.outline .mapOnly{display:none}

/* ---------- canvas */
#vp{flex:1;min-height:0;overflow:auto;position:relative;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:local;overscroll-behavior:contain}
#vp.drag{cursor:grabbing;user-select:none}
#sizer{position:relative}
#content{position:absolute;left:0;top:0;transform-origin:0 0;padding:60px 70vw 50vh 40px;width:max-content}
#wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#wires path{fill:none;stroke:var(--wire);stroke-width:1.4}
#wires path.d{stroke-dasharray:5 4;opacity:.85}
#wires .ah{fill:var(--wire)}

.subtree{display:flex;align-items:center}
.kids{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-left:46px}
.subtree.closed>.kids{display:none}
.branch{display:flex;align-items:center}
.elabel{max-width:188px;margin-right:22px;padding:4px 9px 5px;font-size:12px;line-height:1.3;color:var(--ink2);
  background:var(--paper2);border:1px solid var(--line);border-radius:10px}
.elabel b{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:2px}
.elabel.dash{border-style:dashed}
.elabel{padding:0}
.ehead{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 9px 5px;cursor:pointer;border-radius:9px;line-height:1.3}
.ehead:hover{background:var(--card)}
.ehead b{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:2px}
.emark{display:inline-block;margin-left:5px;min-width:15px;height:15px;line-height:13px;text-align:center;border:1px solid var(--line);border-radius:50%;font-size:11px;font-weight:700;color:var(--muted);vertical-align:1px}
.elabel.eopen{width:310px;max-width:310px;background:var(--card);border-color:var(--ink2);box-shadow:var(--shadow);--c:var(--ink)}
.edet{padding:0 10px 10px;font-size:12.5px;line-height:1.48;color:var(--ink);border-top:1px solid var(--line)}
.edet h5{margin:8px 0 2px;font-size:11.5px;font-weight:800;color:var(--muted)}
.edet p{margin:0}
.edet .eft{margin-top:7px}
.edet .ewk{margin-top:3px}
.elabel.st{color:var(--muted);font-style:italic;border-color:transparent;background:transparent;padding:2px 0}

/* ---------- cards */
.card{position:relative;width:280px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:9px;box-shadow:var(--shadow);--c:var(--wire);--cbg:var(--paper2);transition:width .18s ease}
.card.dopen{width:380px}
.k-B{--c:var(--basic);--cbg:var(--basic-bg)} .k-I{--c:var(--inter);--cbg:var(--inter-bg)} .k-A{--c:var(--adv);--cbg:var(--adv-bg)}
.k-Q{--c:var(--dec);--cbg:var(--dec-bg);background:var(--dec-bg);border-color:var(--dec-line);border-left-color:var(--dec)}
.k-S,.k-root{--c:var(--entry-ink);background:var(--entry-bg);border-color:var(--entry-bg);color:var(--entry-ink)}
.k-root{width:300px}.k-root.dopen{width:400px}
.k-guide{--c:var(--muted)} .k-walk,.k-step{--c:var(--walk);--cbg:var(--walk-bg)} .k-note{--c:var(--dec);background:var(--dec-bg)}
.card.link{background:transparent;border:1.5px dashed var(--wire);border-left:4px solid var(--c);box-shadow:none}
.card.link.k-S{--c:var(--ink);color:var(--ink);border-color:var(--wire);border-left-color:var(--ink)}
.card.link.k-S .tagrow .sec,.card.link.k-S .ex,.card.link.k-S .blk h4{color:var(--muted)}
.card.link.k-S .details{border-top-color:var(--line)}
.card.link.k-S .acts button{background:var(--card);color:var(--ink);border-color:var(--line)}
.head{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px 6px;cursor:pointer;border-radius:8px}
.tagrow{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;line-height:1.2;color:var(--c);font-weight:700}
.tagrow .sec{color:var(--muted);font-weight:600}
.k-S .tagrow .sec,.k-root .tagrow .sec{color:var(--entry-muted)}
.secname{display:block;font-size:12.5px;font-weight:700;color:var(--entry-muted);margin-top:5px;line-height:1.3}
.title{display:block;font-size:14.5px;font-weight:700;line-height:1.28;margin-top:4px}
.k-root .title{font-size:19px;font-weight:800;letter-spacing:-.01em}
.ex{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.k-S .ex,.k-root .ex{color:var(--entry-muted)}
.acts{display:flex;flex-wrap:wrap;gap:5px;padding:2px 10px 9px}
.acts button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:3px 7px;font-size:11.5px;cursor:pointer}
.acts button:hover{border-color:var(--c)}
.k-S .acts button,.k-root .acts button{background:transparent;color:var(--entry-ink);border-color:rgba(255,255,255,.25)}
.k-Q .acts button{background:transparent}
.acts .open{font-weight:700}
.kc{position:absolute;right:-12px;top:50%;transform:translateY(-50%);min-width:23px;height:23px;padding:0 5px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);border:1.5px solid var(--wire);
  font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;pointer-events:none;z-index:1}
.k-S .kc,.k-root .kc{background:var(--entry-bg);color:var(--entry-ink);border-color:var(--entry-muted)}
.k-Q .kc{background:var(--dec-bg);border-color:var(--dec-line)}
.head:hover .title{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}

.details{border-top:1px solid var(--line);padding:8px 12px 12px;font-size:13px;line-height:1.5}
.k-S .details,.k-root .details{border-top-color:rgba(255,255,255,.18)}
.blk{margin-top:9px}
.blk:first-child{margin-top:2px}
.blk h4{margin:0 0 3px;font-size:11.5px;font-weight:800;color:var(--c);letter-spacing:.01em}
.k-S .blk h4,.k-root .blk h4{color:var(--entry-muted)}
.blk p{margin:0}
.scn{font-style:italic;color:var(--ink2)}
.k-S .scn{color:var(--entry-ink)}
.item{padding:6px 0 7px;border-top:1px dashed var(--line)}
.item:first-of-type{border-top:0;padding-top:2px}
.jump{color:var(--c);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.k-S .jump,.k-root .jump{color:var(--entry-ink)}
.eid{font-weight:800;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.stats div{background:rgba(255,255,255,.08);border-radius:7px;padding:6px 7px}
.stats b{display:block;font-size:18px;line-height:1.1;font-weight:800}
.stats span{font-size:11.5px;color:var(--entry-muted)}
.lg{display:flex;align-items:center;gap:8px;margin-top:5px}
.sw{flex:none;width:28px;height:16px;border-radius:4px;border:1px solid var(--line);border-left:4px solid var(--s);background:var(--b)}
.mrow{display:flex;gap:8px;align-items:baseline}
.mrow .pp{flex:none;font-weight:800;font-variant-numeric:tabular-nums;min-width:66px}
.gobtn{margin-top:8px;border:1px solid var(--c);background:var(--cbg);color:var(--ink);border-radius:7px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer}

.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--hl)}20%{box-shadow:0 0 0 6px var(--hl)}100%{box-shadow:0 0 0 0 transparent}}

/* dimming for study passes */
body[data-pass="B"] .card.k-I, body[data-pass="B"] .card.k-A, body[data-pass="BI"] .card.k-A{opacity:.3}
.elabel.flash{animation:flash 1.6s ease-out}
body[data-pass="B"] .card.k-I:hover, body[data-pass="B"] .card.k-A:hover, body[data-pass="BI"] .card.k-A:hover{opacity:.75}

/* legend */
.legend{position:absolute;left:12px;bottom:12px;z-index:4;display:flex;flex-wrap:wrap;gap:6px 12px;max-width:calc(100% - 24px);
  background:var(--paper2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px;color:var(--ink2);box-shadow:var(--shadow)}
.legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--b);border:1px solid var(--line);border-left:3px solid var(--s)}
.legend .x{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 0 0 4px;font-size:13px}
.wrap{flex:1;min-height:0;position:relative;display:flex}


.sticky{margin-top:10px;padding:8px 10px 9px;background:var(--note-bg);border-left:3px solid var(--note-line);border-radius:4px 8px 8px 4px;color:var(--note-ink)}
.sticky h4{margin:0 0 2px;font-size:11.5px;font-weight:800;color:var(--note-line)!important}
.sticky p{margin:0;font-weight:600}
.catch{margin-top:8px;padding:6px 9px 7px;border-radius:6px;background:var(--catch-bg);border-left:3px solid var(--catch)}
.catch h5{margin:0 0 2px!important;color:var(--catch)!important}
.like{font-style:italic;color:var(--ink2)}
.k-S .like{color:var(--entry-ink)}
.ex.hint{font-style:italic}
.ehead{display:flex;align-items:baseline;gap:6px}
.enum{flex:none;font-size:10.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.etxt{flex:1;font-weight:600;color:var(--ink)}
.emark{flex:none}
.edet .efrom{margin-top:9px;font-size:11.5px;color:var(--muted)}
.edet .eft{font-weight:700}
.k-S .sticky,.k-root .sticky{color:var(--note-ink)}


.full{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;font-style:italic}
.k-S .full{color:var(--entry-muted)}
.fullv{font-weight:700}
.sibs{display:flex;flex-direction:column;gap:3px}
.sib{margin:0}


.vizwrap{margin-top:2px;border:1px solid var(--line);border-radius:8px;background:var(--vbg);padding:4px;overflow:hidden}
.vizwrap svg.viz{display:block;width:100%;height:auto;font-family:var(--font)}
.fx{font-family:"Cambria Math","STIX Two Math","Latin Modern Math",Georgia,"Times New Roman",serif;font-size:14px;line-height:1.5;background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;overflow-x:auto;white-space:nowrap}
.card.dopen{width:400px}
/* ---------- overview panel */
#ov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--paper);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#ov[hidden]{display:none}
.ovbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 14px;background:var(--paper2);border-bottom:1px solid var(--line)}
.ovtitle{font-size:16px;font-weight:800}
.ovhint{font-size:12px;color:var(--muted);margin-right:auto}
#ovsel{max-width:260px}
#ovbox{flex:1;min-height:0;overflow:auto;cursor:grab;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;background-attachment:local}
#ovbox.drag{cursor:grabbing}
#ovbox svg{display:block;margin:0 auto}
.ovnode{cursor:pointer}
.ovnode:hover rect{stroke-width:3}
.ovflash rect{animation:ovfl 1.8s ease-out}
@keyframes ovfl{0%,55%{stroke:var(--hl);stroke-width:6}100%{}}
body.ovopen .legend{display:none}
#printroot{display:none}
@media (max-width:760px){ .ovhint{display:none} .ovbar{gap:6px} }
@media print{
  @page{size:A3 landscape;margin:10mm}
  html,body{height:auto!important;overflow:visible!important;display:block!important;background:#fff!important}
  body>*:not(#printroot){display:none!important}
  #printroot{display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact;
    --paper:#FFFFFF;--paper2:#F6F8F5;--ink:#1B2420;--ink2:#3C4842;--muted:#64716B;--card:#FFFFFF;--line:#CDD5CF;--wire:#8F9D96;
    --basic:#2B7A4B;--basic-bg:#E5F1E9;--inter:#2659A9;--inter-bg:#E4ECF8;--adv:#743FA1;--adv-bg:#EFE7F6;--entry-bg:#1F2E28;--entry-ink:#F1F5F2;--entry-muted:#B6C4BD;color:#1B2420}
  .ppage{break-after:page;page-break-after:always}
  .ppage:last-child{break-after:auto;page-break-after:auto}
  .ppage h2{font-family:var(--font);font-size:18px;margin:0 0 8px}
  .pbox svg{display:block}
}

/* ---------- outline view (also used on phones) */
body.outline #sizer{width:auto!important;height:auto!important}
body.outline #content{position:static;transform:none!important;width:auto;padding:16px 14px 90px}
body.outline #wires{display:none}
body.outline .subtree{flex-direction:column;align-items:stretch}
body.outline .kids{padding-left:14px;margin-left:12px;border-left:2px solid var(--line);gap:10px;padding-top:10px}
body.outline .branch{flex-direction:column;align-items:stretch}
body.outline .elabel{max-width:none;margin:0 0 5px;align-self:flex-start}
body.outline .elabel.eopen{width:auto;max-width:720px;align-self:stretch}
body.outline .kc{top:9px;right:9px;transform:none}
body.outline .tagrow .sec{margin-right:30px}
body.outline .card,body.outline .card.dopen,body.outline .k-root{width:auto;max-width:720px}
@media (max-width:760px){
  .bar{padding:8px 10px;gap:7px}
  .brand h1{font-size:17px}
  .brand p{display:none}
  .search{flex:1 1 100%} .search input{width:100%}
  .ctrls{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:3px;scrollbar-width:none}
  .ctrls::-webkit-scrollbar{display:none}
  .ctrls>*{flex:none}
  .grp .lbl{display:none}
  .legend{display:none}
  body.outline .kids{padding-left:6px;margin-left:3px;border-left-width:1.5px;gap:8px;padding-top:8px}

<script>/* ML visualization library: VIZ.render(spec) -> SVG markup. All drawings are generated, nothing is fetched. */
const VIZ = (function(){
"use strict";
const W = 320, H = 190;
const C = ["var(--v0)","var(--v1)","var(--v2)","var(--v3)"], G = "var(--vg)", INK = "var(--vink)", MUT = "var(--vmut)";
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const f1 = v => (Math.round(v*100)/100).toString();
function svg(inner, w, h){ return `<svg class="viz" viewBox="0 0 ${w||W} ${h||H}" role="img" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`; }
function T(x,y,s,o){ o=o||{}; return `<text x="${x}" y="${y}" font-size="${o.fs||9.5}" fill="${o.c||INK}" text-anchor="${o.a||"middle"}" font-weight="${o.b?700:400}"${o.it?' font-style="italic"':''}>${esc(s)}</text>`; }
function L(x1,y1,x2,y2,c,w,d){ return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c||INK}" stroke-width="${w||1.2}"${d?` stroke-dasharray="${d}"`:""}/>`; }
function R(x,y,w,h,fill,stroke,rx,op,sw){ return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx||0}" fill="${fill||"none"}"${op!=null?` fill-opacity="${op}"`:""} stroke="${stroke||"none"}" stroke-width="${sw||1}"/>`; }
function Ci(x,y,r,fill,stroke,op,sw){ return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill||"none"}"${op!=null?` fill-opacity="${op}"`:""} stroke="${stroke||"none"}" stroke-width="${sw||1}"/>`; }
function P(d,c,w,fill,dash,op){ return `<path d="${d}" fill="${fill||"none"}"${op!=null?` fill-opacity="${op}"`:""} stroke="${c||"none"}" stroke-width="${w||1.6}"${dash?` stroke-dasharray="${dash}"`:""} stroke-linejoin="round" stroke-linecap="round"/>`; }
function A(x1,y1,x2,y2,c,dash,w){ c=c||MUT; const a=Math.atan2(y2-y1,x2-x1), s=6;
  const p1=[x2-s*Math.cos(a-0.45), y2-s*Math.sin(a-0.45)], p2=[x2-s*Math.cos(a+0.45), y2-s*Math.sin(a+0.45)];
  return L(x1,y1,x2-2*Math.cos(a),y2-2*Math.sin(a),c,w||1.3,dash)+`<polygon points="${x2},${y2} ${p1[0]},${p1[1]} ${p2[0]},${p2[1]}" fill="${c}"/>`; }
function B(x,y,w,h,label,col,o){ o=o||{}; col=col||C[0]; const lines=String(label).split("\n"); const fs=o.fs||9;
  let s=R(x,y,w,h,col,col,o.rx==null?5:o.rx,o.op==null?0.14:o.op,1.1);
  lines.forEach((ln,i)=>{ s+=T(x+w/2, y+h/2+(i-(lines.length-1)/2)*(fs+2)+fs/3, ln, {fs, b:o.b}); }); return s; }
function poly(pts){ return pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" "); }
/* ---------- maths & data */
function rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function randn(r){ let u=0,v=0; while(!u) u=r(); while(!v) v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const sig = z => 1/(1+Math.exp(-z));
function dataset(name){ const r=rng(7), pts=[];
  const blob=(cx,cy,sd,lab,k)=>{ for(let i=0;i<k;i++) pts.push([cx+randn(r)*sd, cy+randn(r)*sd, lab]); };
  if (name==="blobs"||name==="semisup"){ blob(0.32,0.64,0.09,0,40); blob(0.68,0.36,0.09,1,40); }
  else if (name==="overlap"){ blob(0.38,0.58,0.13,0,45); blob(0.62,0.42,0.13,1,45); }
  else if (name==="three"){ blob(0.26,0.66,0.08,0,30); blob(0.72,0.66,0.08,1,30); blob(0.5,0.28,0.08,2,30); }
  else if (name==="moons"){ for(let i=0;i<50;i++){ const t=Math.PI*i/49; pts.push([0.3+0.25*Math.cos(t)+randn(r)*0.03, 0.42+0.28*Math.sin(t)+randn(r)*0.03,0]);

  else if (name==="circles"){ for(let i=0;i<45;i++){ const t=2*Math.PI*r(); pts.push([0.5+0.14*Math.cos(t)+randn(r)*0.025,0.5+0.14*Math.sin(t)+randn(r)*0.025,1]);
      const u=2*Math.PI*r(); pts.push([0.5+0.36*Math.cos(u)+randn(r)*0.025,0.5+0.36*Math.sin(u)+randn(r)*0.025,0]); } }
  else if (name==="xor"){ [[0.27,0.27,0],[0.73,0.73,0],[0.27,0.73,1],[0.73,0.27,1]].forEach(c=>blob(c[0],c[1],0.08,c[2],22)); }
  return pts; }
function plotBox(){ return {l:36,t:12,r:W-12,b:H-24}; }
function mapper(x0,x1,y0,y1,bx){ bx=bx||plotBox(); return {X:x=>bx.l+(x-x0)/(x1-x0)*(bx.r-bx.l), Y:y=>bx.b-(y-y0)/(y1-y0)*(bx.b-bx.t), bx}; }
function axes(m,xl,yl,o){ o=o||{}; const b=m.bx; let s=L(b.l,b.b,b.r,b.b,MUT,1)+L(b.l,b.t,b.l,b.b,MUT,1);
  if (xl) s+=T((b.l+b.r)/2,H-6,xl,{c:MUT,fs:9}); if (yl) s+=`<text x="11" y="${(b.t+b.b)/2}" font-size="9" fill="${MUT}" text-anchor="middle" transform="rotate(-90 11 ${(b.t+b.b)/2})">${esc(yl)}</text>`;

function legend(items,x,y){ let s=""; items.forEach((it,i)=>{ const yy=y+i*12; s+=L(x,yy,x+14,yy,it[1],2.2,it[2])+T(x+18,yy+3,it[0],{a:"start",fs:9}); }); return s; }
function curvePath(fn,m,x0,x1,n){ n=n||120; const pts=[]; for(let i=0;i<=n;i++){ const x=x0+(x1-x0)*i/n, y=fn(x); if (isFinite(y)) pts.push([m.X(x),m.Y(y)]); } return poly(pts); }
function clampY(m,v){ return Math.max(m.bx.t-2, Math.min(m.bx.b+2, v)); }
function solve(Am, bv){ const n=bv.length, M=Am.map((r,i)=>r.concat([bv[i]]));
  for(let c=0;c<n;c++){ let p=c; for(let r=c+1;r<n;r++) if (Math.abs(M[r][c])>Math.abs(M[p][c])) p=r; [M[c],M[p]]=[M[p],M[c]];
    const d=M[c][c]||1e-12; for(let r=0;r<n;r++){ if (r===c) continue; const f=M[r][c]/d; for(let k=c;k<=n;k++) M[r][k]-=f*M[c][k]; } }

function polyfit(xs,ys,deg,lam){ const n=deg+1, Am=[...Array(n)].map(()=>Array(n).fill(0)), bv=Array(n).fill(0);
  xs.forEach((x,i)=>{ const p=[...Array(n)].map((_,k)=>Math.pow(x,k)); for(let a=0;a<n;a++){ bv[a]+=p[a]*ys[i]; for(let b=0;b<n;b++) Am[a][b]+=p[a]*p[b]; } });
  for(let a=1;a<n;a++) Am[a][a]+=lam||0; const w=solve(Am,bv); return x=>w.reduce((s,c,k)=>s+c*Math.pow(x,k),0); }
/* ---------- tiny learners (2D) */
function trainLogreg(pts,k){ k=k||2; const W2=[...Array(k)].map(()=>[0,0,0]);
  for(let it=0;it<600;it++){ const g=[...Array(k)].map(()=>[0,0,0]);
    pts.forEach(p=>{ const z=W2.map(w=>w[0]*(p[0]-0.5)*4+w[1]*(p[1]-0.5)*4+w[2]); const mx=Math.max(...z); const e=z.map(v=>Math.exp(v-mx)); const s=e.reduce((a,b)=>a+b,0);
      for(let c=0;c<k;c++){ const d=e[c]/s-(p[2]===c?1:0); g[c][0]+=d*(p[0]-0.5)*4; g[c][1]+=d*(p[1]-0.5)*4; g[c][2]+=d; } });
    for(let c=0;c<k;c++) for(let j=0;j<3;j++) W2[c][j]-=0.6*(g[c][j]/pts.length+0.002*W2[c][j]); }
  return (x,y)=>{ const z=W2.map(w=>w[0]*(x-0.5)*4+w[1]*(y-0.5)*4+w[2]); const mx=Math.max(...z); const e=z.map(v=>Math.exp(v-mx)); const s=e.reduce((a,b)=>a+b,0); return e.map(v=>v/s); }; }
function knn(pts,k){ return (x,y)=>{ const d=pts.map(p=>[(p[0]-x)**2+(p[1]-y)**2,p[2]]).sort((a,b)=>a[0]-b[0]).slice(0,k); const cnt=[0,0,0]; d.forEach(q=>cnt[q[1]]++); return cnt.map(c=>c/k); }; }
function gini(ids,pts){ const c=[0,0,0]; ids.forEach(i=>c[pts[i][2]]++); const n=ids.length||1; return 1-c.reduce((s,v)=>s+(v/n)**2,0); }
function buildTree(pts,ids,depth,r,feat){ const c=[0,0,0]; ids.forEach(i=>c[pts[i][2]]++);
  if (depth===0||ids.length<4||c.filter(v=>v).length<2) return {leaf:c.map(v=>v/(ids.length||1))};
  let best=null; const fs=feat?[r()<0.5?0:1]:[0,1];
  fs.forEach(f=>{ const vals=ids.map(i=>pts[i][f]).sort((a,b)=>a-b); for(let q=1;q<vals.length;q+=Math.max(1,Math.floor(vals.length/18))){ const th=(vals[q-1]+vals[q])/2;
      const L1=ids.filter(i=>pts[i][f]<th), R1=ids.filter(i=>pts[i][f]>=th); if(!L1.length||!R1.length) continue;
      const sc=(L1.length*gini(L1,pts)+R1.length*gini(R1,pts))/ids.length; if(!best||sc<best.sc) best={f,th,sc,L1,R1}; } });

function treePred(t,x,y){ while(!t.leaf) t=([x,y][t.f]<t.th)?t.l:t.r; return t.leaf; }
function forest(pts,n){ const r=rng(3), trees=[]; for(let k=0;k<n;k++){ const ids=pts.map(()=>Math.floor(r()*pts.length)); trees.push(buildTree(pts,ids,6,r,true)); }

function adaboost(pts,M){ const n=pts.length; let w=Array(n).fill(1/n); const st=[];

function gaussNB(pts,shared){ const cls=[0,1,2].filter(c=>pts.some(p=>p[2]===c)); const st={};

  if (shared){ const vx=cls.reduce((s,c)=>s+st[c].vx,0)/cls.length, vy=cls.reduce((s,c)=>s+st[c].vy,0)/cls.length; cls.forEach(c=>{st[c].vx=vx; st[c].vy=vy;}); }
  return (x,y)=>{ const lp=cls.map(c=>{ const s=st[c]; return -((x-s.mx)**2)/(2*s.vx)-((y-s.my)**2)/(2*s.vy)-0.5*Math.log(s.vx*s.vy); });
    const mx=Math.max(...lp), e=lp.map(v=>Math.exp(v-mx)), sm=e.reduce((a,b)=>a+b,0); const out=[0,0,0]; cls.forEach((c,i)=>out[c]=e[i]/sm); return out; }; }

function dots(pts,m,o){ o=o||{}; return pts.map((p,i)=>{ const un=o.unl&&!o.unl(i); return un?Ci(m.X(p[0]),m.Y(p[1]),2.6,G,null,0.7):Ci(m.X(p[0]),m.Y(p[1]),2.8,C[p[2]],"var(--vbg)",1,0.8); }).join(""); }

const R2 = {};
R2.clf = (data, model) => {

R2.reg = (kind) => {

<script type="application/json" id="data">{"nodes":{"ROOT":{"k":"root","t":"System Design","s":"Every card is a technical term. Every arrow tells you when to use it.","hp":"Open any card's Details for a diagram, a formula where useful, and its key points. Click an arrow's ? to see why it fits and its trade-off.","stats":[[10,"topics"],[485,"terms"],[594,"arrows"]]},"C1":{"k":"S","p":"C1","t":"Foundational Concepts","s":"The core qualities and trade-offs every design is judged by.","hp":"Gives you the words to explain why one design beats another.","x":"Scalability, reliability, availability, consistency, CAP, latency","sec":{"pid":"C1","num":1,"title":"Foundational Concepts","short":"Foundational Concepts","tag":"Foundations"}},"C2":{"k":"S","p":"C2","t":"Networking & Communication","s":"How bytes travel between machines and how services agree to talk.","hp":"Explains latency, routing and how clients reach your servers.","x":"DNS, TCP/UDP, HTTP, TLS, API styles, proxies, WebSockets","sec":{"pid":"C2","num":2,"title":"Networking & Communication","short":"Networking & Communication","tag":"Networking"}},"C3":{"k":"S","p":"C3","t":"Storage & Databases","s":"Where and how data is stored, kept correct and queried.","hp":"Matches each kind of data to the store that handles it best.","x":"SQL vs NoSQL, ACID, indexing, OLTP/OLAP, object storage","sec":{"pid":"C3","num":3,"title":"Storage & Databases","short":"Storage & Databases","tag":"Storage"}},"C4":{"k":"S","p":"C4","t":"Caching","s":"Keeping a copy of data closer to where it's needed.","hp":"Trades a little staleness for a lot of speed and less backend load.","x":"Where to cache, read/write patterns, eviction, invalidation","sec":{"pid":"C4","num":4,"title":"Caching","short":"Caching","tag":"Caching"}},"C5":{"k":"S","p":"C5","t":"Load Handling & Traffic Management","s":"Spreading traffic evenly and controlling it so the system survives load.","hp":"Keeps servers from being overwhelmed and absorbs spikes.","x":"Load balancers, rate limiting, queues, pub/sub, backpressure, autoscaling","sec":{"pid":"C5","num":5,"title":"Load Handling & Traffic Management","short":"Load Handling & Traffic Management","tag":"Load handling"}},"C6":{"k":"S","p":"C6","t":"Architecture Patterns","s":"How a system is split into pieces and how those pieces talk.","hp":"Fits the structure to your team size, scale and stage.","x":"Monolith, microservices, event-driven, serverless, API gateway","sec":{"pid":"C6","num":6,"title":"Architecture Patterns","short":"Architecture Patterns","tag":"Architecture"}},"C7":{"k":"S","p":"C7","t":"Performance & Optimization","s":"Finding and removing the slowest thing in the path, again and again.","hp":"Makes requests faster and lets the system handle more volume.","x":"Measure first; fix the bottleneck; percentiles; caching; pooling; batching","sec":{"pid":"C7","num":7,"title":"Performance & Optimization","short":"Performance & Optimization","tag":"Performance"}},"C8":{"k":"S","p":"C8","t":"Reliability & Operations","s":"Keeping the system running despite failures, and running it day to day.","hp":"Failures become small blips instead of outages.","x":"Redundancy, failover, circuit breaker, observability, SLOs, disaster recovery, safe deploys","sec":{"pid":"C8","num":8,"title":"Reliability & Operations","short":"Reliability & Operations","tag":"Reliability"}},"C9":{"k":"S","p":"C9","t":"Security","s":"Protecting confidentiality, integrity and availability (the CIA triad).","hp":"Keeps data private and untampered, and the service usable under attack.","x":"AuthN, AuthZ, encryption, OWASP attacks, WAF, DDoS, zero trust","sec":{"pid":"C9","num":9,"title":"Security","short":"Security","tag":"Security"}},"C10":{"k":"S","p":"C10","t":"Scaling Data","s":"Spreading data across machines and keeping the copies in agreement.","hp":"Grows storage and traffic beyond what one database can handle.","x":"Replication, sharding, consistent hashing, quorums, consensus, CDC","sec":{"pid":"C10","num":10,"title":"Scaling Data","short":"Scaling Data","tag":"Scaling data"}},"scalability":{"k":"B","t":"Scalability","s":"A system's ability to handle more load (users, requests, data) by adding resources.","hp":"Lets the product grow without slowing down or being rebuilt.","x":"Vertical vs horizontal; reads and writes scale differently","p":"C1","v":"curve:vertcost"},"vertical":{"k":"B","t":"Vertical scaling","s":"Make one machine bigger: more CPU, RAM, faster disk.","hp":"Quick capacity boost with no code changes.","f":"Scale up","x":"Simple; hard ceiling; expensive at the top","p":"C1","v":"draw:vscale"},"horizontal":{"k":"B","t":"Horizontal scaling","s":"Add more machines and spread the load across them.","hp":"Near-unlimited growth plus built-in redundancy.","f":"Scale out","x":"Needs load balancing, stateless servers, data partitioning","p":"C1","v":"draw:hscale"},"stateless":{"k":"B","t":"Stateless service","s":"A server that keeps no user data between requests; state lives in a DB or cache.","hp":"Any server can handle any request, so scaling out and failover are easy.","x":"State externalized to DB/cache; stateful services are hard to scale","p":"C1","v":"draw:stateless"},"readwrite":{"k":"I","t":"Read-heavy vs write-heavy","s":"Whether a system mostly reads data or mostly writes it.","hp":"Tells you which scaling tools to reach for.","f":"Load dimensions","x":"Reads scale with replicas and caches; writes need sharding","p":"C1","v":"gbars:Social feed,Chat,IoT ingest|Reads=95,60,10|Writes=5,40,90"},"bottleneck":{"k":"I","t":"Bottleneck","s":"The slowest component, which limits the whole system.","hp":"Shows where adding capacity actually helps.","x":"More app servers are useless if the DB is saturated","p":"C1","v":"lay:App 1,App 2,App 3>Single DB*|app servers wait on one database"},"reliability":{"k":"B","t":"Reliability","s":"The system works correctly (right results, no data loss) even when things fail.","hp":"Users can trust results and their data.","x":"Measured by MTBF and MTTR; achieved through fault tolerance","p":"C1","v":"curve:mttr"},"fault":{"k":"I","t":"Fault vs failure","s":"A fault is one part breaking; a failure is the whole system stopping.","hp":"Focuses design on containing faults so they never become failures.","x":"Hardware, software and human faults (humans cause most outages)","p":"C1","v":"lay:Disk fails (fault)>Replica takes over+>Service stays up+|contain faults so they never become failures"},"mtbf":{"k":"I","t":"MTBF & MTTR","s":"MTBF: average time between failures. MTTR: average time to recover.","hp":"Turns 'reliable' into numbers you can improve.","f":"Mean Time Between Failures / Mean Time To Recovery","x":"Availability = MTBF / (MTBF + MTTR); MTTD = time to detect","p":"C1","v":"curve:mttr","fx":"Availability = MTBF / (MTBF + MTTR)"},"availability":{"k":"B","t":"Availability","s":"The percentage of time a system is up and reachable.","hp":"Sets how much downtime users will see.","x":"Different from reliability: up isn't the same as correct","p":"C1","v":"draw:nines","fx":"Availability = uptime / total time"},"nines":{"k":"B","t":"The nines","s":"Uptime written as nines: 99%, 99.9%, 99.99%, 99.999%.","hp":"A shared way to agree on uptime targets.","x":"99% ≈ 3.65 days/yr down; 99.9% ≈ 8.8 h; 99.99% ≈ 53 min; 99.999% ≈ 5 min","p":"C1","v":"draw:nines","fx":"99.9% → 8.77 h/yr · 99.99% → 52.6 min/yr · 99.999% → 5.26 min/yr"},"compose":{"k":"A","t":"Series vs parallel availability","s":"Parts in a chain multiply availability down; redundant parts in parallel multiply it up.","hp":"Explains why redundancy raises uptime and long call chains lower it.","x":"Two 99.9% in series → 99.8%; parallel = 1 − product of downtime","p":"C1","v":"draw:serpar","fx":"Series: A = A₁ × A₂   ·   Parallel: A = 1 − (1 − A₁)(1 − A₂)"},"faulttol":{"k":"B","t":"Fault tolerance","s":"Keeps operating, maybe degraded, when components fail.","hp":"This is how you actually achieve reliability and availability.","x":"Redundancy, replication, failover, graceful degradation","p":"C1","v":"lay:Client>LB>App 1,App 2#,App 3|one server down, traffic routes around it"},"spof":{"k":"B","t":"Single point of failure","s":"Any component with no backup whose failure stops the whole system.","hp":"Finding and removing them is the #1 reliability goal.","f":"SPOF","x":"Check every tier: LB, DB, DNS, network path","p":"C1","v":"lay:Clients>LB*>App 1,App 2,App 3|one LB with no backup = single point of failure"},"nmr":{"k":"A","t":"N-modular redundancy","s":"Run N copies and take a majority vote on the result.","hp":"Masks one faulty copy's wrong answer.","x":"Aerospace and critical systems","p":"C1","v":"lay:Input>Copy 1,Copy 2,Copy 3*>Majority vote+|the wrong answer (orange) is outvoted"},"bft":{"k":"A","t":"Byzantine fault tolerance","s":"Tolerating parts that fail in arbitrary or malicious ways, not just crashing.","hp":"Keeps agreement even if some nodes lie.","f":"BFT","x":"Blockchains, aerospace","p":"C1","v":"lay:Node 1,Node 2,Node 3,Liar*>Agreement+|tolerates nodes that lie, not just crash"},"consistency":{"k":"B","t":"Consistency models","s":"Rules for when an update becomes visible to everyone reading the data.","hp":"Lets you choose freshness vs speed per feature.","x":"Strong → sequential → causal → eventual; client guarantees","p":"C1","v":"draw:consistency"},"strong":{"k":"I","t":"Strong consistency","s":"Every read sees the latest write, as if there were one copy.","hp":"Simplest to reason about; no stale reads.","f":"Linearizability","x":"Needs coordination between nodes","p":"C1","v":"draw:consistency"},"sequential":{"k":"A","t":"Sequential consistency","s":"All nodes see operations in the same order, though not instantly.","hp":"An ordering guarantee cheaper than strong consistency.","x":"Same order for all; not real-time","p":"C1","v":"seq:Writer A,Writer B,Reader|0>2:x=1|1>2:y=2|2>2:everyone sees x then y|same order for all, maybe late"},"causal":{"k":"I","t":"Causal consistency","s":"Related operations (a reply after a comment) are seen in order by everyone.","hp":"Prevents 'answer before question' bugs cheaply.","x":"Unrelated operations may appear in any order","p":"C1","v":"seq:Alice,Bob,Carol|0>2:post: lunch?|1>2:reply: yes!|2>2:reply never shown before post|cause appears before effect"},"eventual":{"k":"B","t":"Eventual consistency","s":"Copies may differ for a while but converge once writes stop.","hp":"Very fast and highly available.","x":"DNS, shopping carts, like counts","p":"C1","v":"draw:replag"},"ryw":{"k":"I","t":"Read-your-writes","s":"You always see your own updates, even if others don't yet.","hp":"Stops users thinking their change was lost.","x":"Read from the leader after a write, or track write time","p":"C1","v":"seq:User,Leader,Replica|0>1:update profile|0>1:read own profile (leader)|0>2:others read (may lag)|you always see your own writes"},"monotonic":{"k":"A","t":"Monotonic reads & writes","s":"Once you see a value you never see an older one; your writes apply in order.","hp":"Time never appears to go backwards for a user.","x":"Pin a user to one replica","p":"C1","v":"seq:User,Replica A,Replica B|0>1:read v5|0>1:read v6 (pinned)|0>2:never read v4 later|time never goes backwards"},"linser":{"k":"A","t":"Linearizability vs serializability","s":"Linearizability: recency of one object. Serializability: transactions look one-at-a-time.","hp":"Avoids a common, costly confusion.","x":"'Strict serializability' gives both","p":"C1","v":"table:Guarantee,About,Example|Linearizable,one object's latest value,read sees last write|Serializable,whole transactions,as if run one at a time"},"cap":{"k":"B","t":"CAP theorem","s":"During a network partition you can keep consistency or availability, not both.","hp":"Frames the core trade-off of distributed databases.","f":"Consistency, Availability, Partition tolerance","x":"Partitions are unavoidable, so the real choice is C or A","p":"C1","v":"draw:cap"},"cp":{"k":"I","t":"CP system","s":"Refuses or delays requests during a partition to stay consistent.","hp":"Never returns wrong data.","x":"ZooKeeper, HBase, etcd, Spanner","p":"C1","v":"lay:Client>Node A+~Node B#|partitioned: refuse rather than serve stale data"},"ap":{"k":"I","t":"AP system","s":"Keeps answering during a partition, accepting stale data.","hp":"Always responds.","x":"Cassandra, DynamoDB, DNS","p":"C1","v":"lay:Client>Node A+=Node B*|partitioned: keep answering, reconcile later"},"pacelc":{"k":"A","t":"PACELC","s":"Extends CAP: even with no partition you trade latency for consistency.","hp":"Explains why strong consistency is slow even on good days.","f":"Partition: Availability or Consistency; Else: Latency or Consistency","x":"PC/EC: BigTable, HBase; PA/EL: Cassandra, DynamoDB","p":"C1","v":"lay:Partition?>Yes: choose A or C,No: choose Latency or C|PACELC adds the everyday trade-off"},"latthr":{"k":"B","t":"Latency vs throughput","s":"Latency = time for one request; throughput = requests per second.","hp":"Tells you what kind of 'fast' you need.","x":"Low latency ≠ high throughput; batching raises throughput but adds latency","p":"C1","v":"gbars:Single request,Busy hour|Latency (ms)=50,50|Throughput (k req/s)=1,40"},"latency":{"k":"B","t":"Latency","s":"Time for a single request to complete (e.g. 50 ms).","hp":"Shapes how fast users feel the system is.","x":"Response time = service + queuing + network","p":"C1","v":"draw:latnums"},"throughput":{"k":"B","t":"Throughput","s":"Number of requests handled per unit of time (e.g. 10,000 req/s).","hp":"Shows how much total work the system can do.","x":"Higher is better","p":"C1","v":"curve:queueing","fx":"throughput = requests / second"},"bandwidth":{"k":"I","t":"Bandwidth","s":"The maximum data rate a channel can carry.","hp":"Caps how much data can flow.","x":"A fat pipe can still feel slow if latency is high","p":"C1","v":"lay:Fat pipe (10 Gbps)>Far server (150 ms)*|big bandwidth can't fix high latency"},"percentiles":{"k":"I","t":"Percentiles & tail latency","s":"Latency measured at percentiles; the tail (p99+) is the slowest requests.","hp":"Reveals the pain averages hide.","f":"p50 / p95 / p99","x":"Tail latency amplifies when a page makes many calls","p":"C1","v":"curve:pctl","fx":"p99 = value below which 99% of requests fall"},"durability":{"k":"I","t":"Durability","s":"Once committed, data survives crashes and power loss.","hp":"Users never lose data they were told was saved.","x":"Disk persistence, write-ahead logs, replication; the 'D' in ACID","p":"C1","v":"seq:App,DB,WAL on disk|0>1:commit|1>2:append + fsync|2~1:durable|1~0:ok (survives crash)|written to the log before ack"},"idempotency":{"k":"B","t":"Idempotency","s":"An operation that gives the same result whether done once or many times.","hp":"Makes retries safe (no double charges).","x":"Idempotency keys; GET/PUT/DELETE idempotent, POST isn't","p":"C1","v":"draw:idempotency"},"concpar":{"k":"I","t":"Concurrency vs parallelism","s":"Concurrency: handling many tasks at once. Parallelism: running them at the same instant.","hp":"Helps pick how to use CPUs and I/O.","x":"Concurrency = structure; parallelism = execution on many cores","p":"C1","v":"gbars:Concurrency (1 core),Parallelism (4 cores)|Tasks in progress=4,4|Running at the same instant=1,4"},"coupling":{"k":"I","t":"Coupling & cohesion","s":"Loose coupling: parts depend little on each other. High cohesion: each part has one job.","hp":"Makes systems easier to change and scale.","x":"The principle behind microservices and event-driven design","p":"C1","v":"lay:Orders>Payments,Shipping|loose coupling: talk through small, stable interfaces"},"estimation":{"k":"B","t":"Back-of-the-envelope estimation","s":"Quick math for QPS, storage, bandwidth and server counts.","hp":"Tells you early whether a design can work.","f":"Capacity estimation","x":"RAM ~100 ns, SSD ~100 µs, disk seek ~10 ms, same-DC round trip ~0.5 ms, cross-continent ~150 ms","p":"C1","v":"draw:estimation","fx":"QPS = daily requests / 86,400 s;  peak ≈ 2-3 × average"},"maintain":{"k":"I","t":"Maintainability","s":"How easy a system is to run, understand and change.","hp":"Keeps the system alive and improvable for years.","x":"Operability, simplicity, evolvability","p":"C1","v":"stack:Operability: easy to run,Simplicity: easy to understand,Evolvability: easy to change"},"osi":{"k":"I","t":"OSI & TCP/IP model","s":"A layered model of how data moves; each layer has one job.","hp":"Gives the vocabulary for 'L4 vs L7'.","f":"Open Systems Interconnection","x":"OSI has 7 layers; TCP/IP (the real internet) has 4","p":"C2","v":"draw:osi"},"l3":{"k":"I","t":"Network layer (L3)","s":"Addressing and routing between machines. IP lives here.","hp":"Gets packets to the right machine.","x":"IP, routers","p":"C2","v":"lay:Host A>Router>Router>Host B|IP routes packets hop by hop"},"l4":{"k":"I","t":"Transport layer (L4)","s":"Delivery between processes. TCP and UDP live here.","hp":"Reliable or fast delivery between programs.","x":"L4 load balancers work here","p":"C2","v":"lay:App process:443>TCP / UDP>App process:51234|ports pick the process; TCP/UDP deliver"},"l7":{"k":"I","t":"Application layer (L7)","s":"The protocols apps speak: HTTP, DNS, gRPC.","hp":"Lets routing use request content (URLs, headers).","x":"L7 load balancers understand this layer","p":"C2","v":"lay:Request: GET /api/users>L7 router*>API servers,Image servers|reads the HTTP request to route"},"ip":{"k":"B","t":"IP address & port","s":"An IP identifies a machine; a port identifies a service on it (IP + port = socket).","hp":"How every request finds the right machine and process.","f":"IP: Internet Protocol","x":":80 HTTP, :443 HTTPS, :22 SSH","p":"C2","v":"table:Part,Example,Meaning|IP,93.184.216.34,which machine|Port,443,which service|Socket,IP + port,one endpoint"},"ipv6":{"k":"I","t":"IPv4 vs IPv6","s":"IPv4: 32-bit (~4.3 billion, exhausted). IPv6: 128-bit, effectively unlimited.","hp":"IPv6 removes the address shortage.","x":"IPv4 survives thanks to NAT","p":"C2","v":"gbars:IPv4,IPv6|Address bits=32,128"},"privip":{"k":"B","t":"Public vs private IP","s":"Private ranges (10.x, 192.168.x) work only inside a network; public IPs are routable on the internet.","hp":"Keeps internal servers off the public internet.","x":"Private IPs for internal tiers","p":"C2","v":"draw:zones"},"nat":{"k":"A","t":"NAT","s":"Lets many private-IP devices share one public IP.","hp":"Saves public addresses and hides internal hosts.","f":"Network Address Translation","x":"A big reason IPv4 still works","p":"C2","v":"draw:natd"},"cidr":{"k":"A","t":"CIDR","s":"Notation for IP blocks, e.g. 10.0.0.0/16.","hp":"Essential for subnets and cloud VPC design.","f":"Classless Inter-Domain Routing","x":"/16 = 65,536 addresses","p":"C2","v":"draw:cidr","fx":"/n → 2^(32 − n) addresses"},"dns":{"k":"B","t":"DNS","s":"The internet's phone book: turns names into IP addresses.","hp":"Users type names, not numbers; DNS can also steer traffic.","f":"Domain Name System","x":"Browser cache → resolver → root → TLD → authoritative","p":"C2","v":"draw:dnsres"},"dnsrec":{"k":"I","t":"DNS record types","s":"Entries saying what a name points to.","hp":"One name can map to IPs, aliases or mail servers.","x":"A, AAAA, CNAME, MX, NS, TXT","p":"C2","v":"table:Type,Maps,Example|A,name → IPv4,93.184.216.34|AAAA,name → IPv6,2606:2800::1|CNAME,alias → name,www → example.com|MX,mail server,mx1.example.com"},"ttl":{"k":"B","t":"TTL","s":"How long a cached answer (DNS record or cache entry) stays valid.","hp":"Balances freshness against load.","f":"Time To Live","x":"Low TTL = fast changes, more queries; high TTL = slow to change","p":"C2","v":"curve:ttltrade"},"geodns":{"k":"I","t":"GeoDNS","s":"DNS returns different IPs depending on the user's location.","hp":"Sends users to their nearest data centre.","f":"Latency-based routing","x":"Route 53 latency routing","p":"C2","v":"lay:User in Tokyo,User in Paris>GeoDNS*>Tokyo region,Paris region|each user gets the nearest region's IP"},"dnslb":{"k":"I","t":"DNS load balancing","s":"DNS returns rotating IPs to spread traffic.","hp":"Simple, cheap traffic spreading.","f":"Round-robin DNS","x":"No health awareness by itself","p":"C2","v":"lay:Clients>DNS (rotating answers)>Server 1,Server 2,Server 3|round-robin DNS"},"dnsfo":{"k":"I","t":"DNS failover","s":"Health-checked DNS stops returning a dead region's IP.","hp":"Routes users away from an outage.","x":"Health checks + low TTL","p":"C2","v":"lay:Users>Health-checked DNS>Primary region#,Backup region+|DNS stops returning the dead region"},"transport":{"k":"B","t":"Transport protocols","s":"Ways data is delivered between processes: TCP, UDP, QUIC.","hp":"Choose reliability or speed.","x":"TCP for web/data; UDP for real-time media","p":"C2","v":"gbars:TCP,UDP,QUIC|Reliability=10,2,10|Speed=5,10,8"},"tcp":{"k":"B","t":"TCP","s":"Connection-based; guaranteed, ordered delivery with retransmits.","hp":"Data arrives complete and in order.","f":"Transmission Control Protocol","x":"Web, email, file transfer, APIs, DB connections","p":"C2","v":"draw:tcphand"},"handshake":{"k":"I","t":"3-way handshake","s":"How TCP sets up a connection before data flows.","hp":"Ensures both sides are ready.","f":"SYN → SYN-ACK → ACK","x":"Adds a round trip of latency","p":"C2","v":"draw:tcphand"},"flowctl":{"k":"I","t":"Flow & congestion control","s":"TCP slows down so it doesn't overwhelm the receiver or the network.","hp":"Keeps networks stable under load.","x":"A built-in form of backpressure","p":"C2","v":"curve:backpress"},"hol":{"k":"I","t":"Head-of-line blocking","s":"One lost packet stalls everything behind it.","hp":"Explains why HTTP/3 moved to QUIC.","x":"Hurts HTTP/1.1 and HTTP/2 over TCP","p":"C2","v":"draw:hol"},"udp":{"k":"B","t":"UDP","s":"Connectionless: just sends packets, no guarantees.","hp":"Lowest overhead and latency.","f":"User Datagram Protocol","x":"Video/voice calls, gaming, DNS, live streaming","p":"C2","v":"seq:Sender,Receiver|0>1:packet 1|0>1:packet 2 (lost)|0>1:packet 3|1>1:no retry, no order|fast; late data is useless anyway"},"quic":{"k":"I","t":"QUIC","s":"UDP-based transport with TCP-like reliability and no head-of-line blocking.","hp":"Faster connections, especially on mobile.","x":"Powers HTTP/3","p":"C2","v":"lay:HTTP/3>QUIC: streams + TLS>UDP|reliability built on UDP, no head-of-line blocking"},"http":{"k":"B","t":"HTTP / HTTPS","s":"The web's request/response protocol; HTTPS adds TLS encryption.","hp":"How browsers and APIs talk.","f":"Hypertext Transfer Protocol (Secure)","x":"Stateless; method + URL + headers + body","p":"C2","v":"draw:httpreq"},"methods":{"k":"B","t":"HTTP methods","s":"Verbs saying what a request does: GET, POST, PUT, PATCH, DELETE.","hp":"Clear meaning for each operation.","x":"GET/PUT/DELETE idempotent; POST is not","p":"C2","v":"table:Method,Purpose,Idempotent|GET,read,yes|POST,create,no|PUT,replace,yes|PATCH,partial update,no*|DELETE,remove,yes"},"status":{"k":"B","t":"HTTP status codes","s":"Numbers saying what happened: 2xx ok, 3xx redirect, 4xx client error, 5xx server error.","hp":"Clients know how to react.","x":"429 too many requests, 503 unavailable","p":"C2","v":"table:Code,Meaning|2xx,success (200, 201)|3xx,redirect (301, 304)|4xx,client error (400, 401, 404, 429)|5xx,server error (500, 503)"},"http1":{"k":"I","t":"HTTP/1.1","s":"One request at a time per connection; keep-alive reuses connections.","hp":"Simple and universal.","x":"Suffers head-of-line blocking","p":"C2","v":"draw:httpmux"},"http2":{"k":"I","t":"HTTP/2","s":"Many requests over one connection at once (multiplexing) plus header compression.","hp":"Much faster pages and APIs.","x":"Still has TCP head-of-line blocking","p":"C2","v":"draw:httpmux"},"http3":{"k":"I","t":"HTTP/3","s":"HTTP over QUIC (UDP) instead of TCP.","hp":"No head-of-line blocking and faster setup.","x":"Great on mobile","p":"C2","v":"draw:hol"},"tls":{"k":"B","t":"TLS / SSL","s":"The encryption layer that turns HTTP into HTTPS.","hp":"Encrypts, authenticates the server and protects integrity.","f":"Transport Layer Security / Secure Sockets Layer","x":"TLS 1.3 handshake ~1 round trip; SSL is obsolete","p":"C2","v":"draw:tls"},"certs":{"k":"I","t":"Certificates & CAs","s":"A CA vouches for a server's identity with a signed certificate.","hp":"Proves you're talking to the real server.","f":"CA: Certificate Authority","x":"The browser verifies the chain of trust","p":"C2","v":"lay:Root CA>Intermediate CA>example.com cert+|browser verifies the chain of trust"},"tlsterm":{"k":"I","t":"TLS termination","s":"Where encrypted traffic is decrypted, often at the load balancer.","hp":"Offloads encryption work from app servers.","x":"Re-encrypt internally for zero trust","p":"C2","v":"lay:Client>LB (decrypts TLS)*~App 1,App 2|HTTPS outside, plain or re-encrypted inside"},"realtime":{"k":"I","t":"Real-time communication","s":"Techniques that let the server push updates to clients.","hp":"Powers chat, live scores and notifications.","x":"Short polling, long polling, SSE, WebSockets, webhooks","p":"C2","v":"gbars:Short poll,Long poll,SSE,WebSocket|Latency (lower better)=8,4,2,1|Server push=0,5,9,10"},"shortpoll":{"k":"B","t":"Short polling","s":"The client asks 'anything new?' on a timer.","hp":"The simplest way to get updates.","x":"Wasteful and laggy","p":"C2","v":"draw:polling"},"longpoll":{"k":"I","t":"Long polling","s":"The server holds the request open until there's data.","hp":"Near-real-time without new protocols.","x":"Ties up connections","p":"C2","v":"draw:longpoll"},"sse":{"k":"I","t":"Server-Sent Events","s":"A one-way stream from server to client over HTTP.","hp":"Simple live feeds.","f":"SSE","x":"Notifications, dashboards, streaming LLM tokens","p":"C2","v":"draw:ssed"},"websocket":{"k":"I","t":"WebSockets","s":"A persistent two-way connection after an HTTP upgrade.","hp":"Both sides send anytime with low latency.","x":"Chat, multiplayer games, col es for day-to-day operations; row storage.","hp":"Runs the live application.","f":"Online Transaction Processing","x":"PostgreSQL, MySQL; orders, logins","p":"C3","v":"gbars:OLTP,OLAP|Rows per query=1,1000000|Queries per second=10000,5"},"olap":{"k":"B","t":"OLAP","s":"Few large aggregation queries over history; columnar storage.","hp":"Fast analytics and reporting.","f":"Online Analytical Processing","x":"Snowflake, Redshift, BigQuery","p":"C3","v":"gbars:Row store,Column store|Bytes read for SUM(sales)=100,8"},"dw":{"k":"B","t":"Data warehouse","s":"A central store of cleaned, structured data for analytics (schema-on-write).","hp":"Reliable reporting and BI.","x":"Snowflake, Redshift, BigQuery","p":"C3","v":"lay:Apps,CRM,Logs>ETL>Data warehouse+>BI dashboards"},"lake":{"k":"B","t":"Data lake","s":"Raw data of any type stored cheaply; schema applied later (schema-on-read).","hp":"Keeps everything for future analysis and ML.","x":"Usually built on object storage","p":"C3","v":"lay:Logs,Images,JSON,Tables>Data lake (object storage)+>ML,SQL engines|raw first, schema on read"},"lakehouse":{"k":"I","t":"Data lakehouse","s":"Lake flexibility with warehouse-style structure and performance.","hp":"One platform for BI and ML.","x":"Databricks, Delta Lake","p":"C3","v":"lay:Object storage files>Table format (Delta / Iceberg)+>BI,ML|lake storage + warehouse features"},"etl":{"k":"I","t":"ETL vs ELT","s":"ETL transforms before loading; ELT loads raw data and transforms later.","hp":"Moves data into analytics stores.","f":"Extract, Transform, Load","x":"ELT is the modern cloud approach","p":"C3","v":"lay:Extract>Transform>Load|ELT: load raw first, transform inside the warehouse"},"wal":{"k":"I","t":"Write-ahead log","s":"Every change is written to an append-only log before it's applied.","hp":"How databases survive crashes.","f":"WAL","x":"Replayed on restart; source for replication and CDC","p":"C3","v":"seq:App,DB,Log,Data files|0>1:write|1>2:append change|1~0:ack|1>3:apply l erned by TTL","p":"C4","v":"seq:App,OS cache,Resolver|0>1:example.com?|1>2:miss|2~1:IP (TTL 300)|1~0:IP|cached until TTL"},"proxycache":{"k":"I","t":"Reverse-proxy cache","s":"Responses cached in front of the app servers.","hp":"Shields app servers from repeated requests.","x":"Nginx, Varnish","p":"C4","v":"lay:Clients>Varnish / Nginx cache*>App servers|repeated responses served from the proxy"},"appcache":{"k":"B","t":"Application cache","s":"A cache inside or beside the app process.","hp":"The classic cache layer in front of the database.","x":"Local memory or Redis/Memcached","p":"C4","v":"lay:App servers>Cache (Redis)*~Database|hot reads stop at the cache"},"localcache":{"k":"I","t":"Local (in-process) cache","s":"Data cached in each app server's own memory.","hp":"The fastest option: no network hop.","x":"Caffeine, a dictionary","p":"C4","v":"lay:App 1 (own cache),App 2 (own cache)>Database|fastest, but copies differ"},"distcache":{"k":"B","t":"Distributed cache","s":"A separate cache cluster shared by all app servers.","hp":"One shared view with huge capacity.","x":"Redis, Memcached","p":"C4","v":"lay:App 1,App 2,App 3>Redis cluster*>Database|one shared cache for all servers"},"redis":{"k":"B","t":"Redis","s":"An in-memory store with rich data types, persistence and replication.","hp":"Cache, session store, leaderboards and pub/sub in one.","f":"Remote Dictionary Server","x":"Strings, hashes, sets, sorted sets, streams; mostly single-threaded","p":"C4","v":"table:Type,Use|String,cache / counter|Hash,user profile|Sorted set,leaderboard|Stream,event log"},"memcached":{"k":"I","t":"Memcached","s":"A simple, multi-threaded, pure in-memory key-value cache.","hp":"Lean, fast string caching.","x":"No persistence","p":"C4","v":"gbars:Redis,Memcached|Data types=9,2|Persistence=7,0|Multi-threaded=3,9"},"multilevel":{"k":"A","t":"Multi-level cache","s":"A small local L1 cache in front of a shared L2 cache.","hp":"Local speed for the hottest keys, shared capacity for the Refresh-ahead","s":"The cache refreshes popular entries before they expire.","hp":"Hot data never causes a miss.","x":"Predictable access patterns","p":"C4","v":"seq:Cache,DB|0>0:key near expiry|0>1:refresh early|1~0:fresh value|users never see a miss"},"eviction":{"k":"B","t":"Eviction policies","s":"How a full cache decides what to remove.","hp":"Keeps the most useful data in limited memory.","x":"LRU, LFU, FIFO, MRU, random, TTL","p":"C4","v":"draw:lru"},"lru":{"k":"B","t":"LRU","s":"Evict the item unused for the longest time.","hp":"A good default for most workloads.","f":"Least Recently Used","x":"Relies on temporal locality","p":"C4","v":"draw:lru"},"lfu":{"k":"I","t":"LFU","s":"Evict the item used the fewest times.","hp":"Keeps durably popular items.","f":"Least Frequently Used","x":"Can cling to once-popular items","p":"C4","v":"bars:Item A (hits)=42,Item B=17,Item C=9,Item D (evict)=2"},"fifo":{"k":"I","t":"FIFO","s":"Evict the oldest-inserted item.","hp":"Very simple.","f":"First In, First Out","x":"Ignores usage","p":"C4","v":"lay:Oldest#>Item 2>Item 3>Newest+|evict the first one inserted"},"mru":{"k":"A","t":"MRU","s":"Evict the most recently used item.","hp":"Fits workloads where recent items won't repeat.","f":"Most Recently Used","x":"Some streaming scans","p":"C4","v":"lay:Item A>Item B>Most recent#|evict the newest (scans)"},"randomevict":{"k":"A","t":"Random replacement","s":"Evict a random item.","hp":"Cheap and surprisingly decent.","x":"Some CPU caches","p":"C4","v":"lay:Item 1,Item 2#,Item 3,Item 4|pick any item to evict"},"adaptive":{"k":"A","t":"Adaptive policies","s":"Blend recency and frequency and adapt to the workload.","hp":"Better hit ratios than plain LRU or LFU.","f":"ARC, LRU-K, W-TinyLFU","x":"W-TinyLFU in Caffeine","p":"C4","v":"gbars:LRU,LFU,W-TinyLFU|Hit ratio=0.71,0.68,0.82"},"invalidation":{"k":"B","t":"Cache invalidation","s":"Keeping cached data consistent with the source of truth.","hp":"Prevents serving wrong, stale data.", er|Hot key,replicate key"},"stampede":{"k":"I","t":"Cache stampede","s":"A popular key expires and thousands of requests hit the DB at once.","hp":"Recognizing it prevents DB overload.","f":"Thundering herd / dogpiling","x":"Hot key + expiry","p":"C4","v":"curve:stampede"},"coalescing":{"k":"I","t":"Request coalescing","s":"Only one request rebuilds a missing value; the rest wait for it.","hp":"Stops duplicate work during misses.","f":"Single flight","x":"Lock per key","p":"C4","v":"draw:coalesce"},"swr":{"k":"I","t":"Stale-while-revalidate","s":"Serve slightly stale content while refreshing it in the background.","hp":"Speed and availability over perfect freshness.","f":"stale-if-error","x":"HTTP cache directives","p":"C4","v":"seq:User,Cache,Origin|0>1:request|1~0:stale copy (instant)|1>2:refresh in background|2~1:fresh copy|speed now, freshness soon"},"penetration":{"k":"I","t":"Cache penetration","s":"Requests for keys that don't exist anywhere always miss and hit the DB.","hp":"Recognizing it blocks a common attack.","x":"Often malicious","p":"C4","v":"lay:Bots: random ids>Cache (always miss)*>Database*|non-existent keys skip the cache every time"},"negcache":{"k":"I","t":"Negative caching","s":"Cache 'not found' results for a short time.","hp":"Repeated missing lookups stop hitting the DB.","x":"Short TTL","p":"C4","v":"lay:Lookup id 999>Cache: 'not found' (60 s)+~Database|repeat misses stop at the cache"},"avalanche":{"k":"I","t":"Cache avalanche","s":"Many keys expire at once, or the cache dies, flooding the DB.","hp":"Recognizing it avoids total collapse.","x":"The same TTL everywhere is the usual cause","p":"C4","v":"curve:stampede"},"jitter":{"k":"I","t":"TTL jitter","s":"Add a small random offset to expiry times.","hp":"Keys don't all expire together.","x":"Simple but crucial","p":"C4","v":"gbars:No jitter,With jitter|Keys expiring in minute 1=100,22|Minute 2=0,26|Minute 3=0,27|Minute 4=0,25","fx":"TTL = base + random(0, spread)"},"warming":{"k":"I","t":
