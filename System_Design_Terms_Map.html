Leader*|0>1:timeout|1>2:majority votes|2>0:sees higher term|1>0:loses"},"splitbrain":{"k":"A","t":"Split-brain & fencing","s":"Two nodes both think they're the leader; quorums and fencing tokens prevent it.","hp":"Prevents diverging data.","x":"Majority wins; the minority steps down","p":"C10","v":"draw:splitbrain"},"twopc":{"k":"A","t":"Two-phase commit","s":"A coordinator asks all participants to prepare, then to commit.","hp":"Atomic transactions across nodes.","f":"2PC","x":"Prepare → commit","p":"C10","v":"draw:twophase"},"cdc":{"k":"I","t":"CDC","s":"Stream a database's row-level changes from its log to other systems.","hp":"Keeps caches, search indexes and replicas in sync.","f":"Change Data Capture","x":"Debezium, Kafka Connect","p":"C10","v":"lay:Database log>Debezium*>Kafka>Cache,Search,Warehouse"},"bloom":{"k":"A","t":"Bloom filter","s":"A tiny probabilistic structure: 'definitely not here' or 'maybe here'.","hp":"Skips useless disk reads and shard queries.","x":"No false negatives; some false positives","p":"C10","v":"draw:bloom","fx":"false-positive rate ≈ (1 − e^(−kn/m))ᵏ"},"tiered":{"k":"I","t":"Tiered storage","s":"Keep hot data on fast storage and archive cold data cheaply.","hp":"Cost scales with the value of the data.","f":"Hot / warm / cold","x":"RAM/SSD → object storage/Glacier","p":"C10","v":"stack:^Hot: RAM / SSD,^Warm: HDD,^Cold: object storage / archive|cheaper and slower going down"},"gravity":{"k":"A","t":"Data gravity","s":"Huge datasets are too costly to move, so bring computation to them.","hp":"Avoids expensive data transfers.","f":"Move compute to data","x":"Process inside the warehouse","p":"C10","v":"lay:Query>Petabytes in warehouse*|move compute to the data, not data to compute"},"multiregion":{"k":"A","t":"Multi-region active-active","s":"Writable databases in several regions at the same time.","hp":"Global low latency and survival of a regional disaster.","x":"Multi-leader + conflict resolution + geo-partitioning","p":"C10","v":"lay:EU users,US users,Asia users>EU region*,US region*,Asia region*|every region accepts writes"}},"edges":[{"id":"0.1","s":"ROOT","t":"C1","sc":"Start here: the vocabulary behind every decision","w":"Every later choice (cache, shard, replicate) is made to improve one of these qualities.","tree":true},{"id":"0.2","s":"ROOT","t":"C2","sc":"Machines and services must communicate","w":"Every request crosses the network; protocols and API styles set speed and reliability.","tree":true},{"id":"0.3","s":"ROOT","t":"C3","sc":"Data must be stored and queried","w":"Every system persists data; the store decides correctness, speed and scale.","tree":true},{"id":"0.4","s":"ROOT","t":"C4","sc":"The same data is read again and again","w":"Hot data served from memory is far faster than recomputing or refetching it.","tree":true},{"id":"0.5","s":"ROOT","t":"C5","sc":"Traffic must be spread out or controlled","w":"Without it, one busy server or one spike can take everything down.","tree":true},{"id":"0.6","s":"ROOT","t":"C6","sc":"Deciding how to structure the system","w":"Structure decides how teams work, how parts scale and how failures spread.","tree":true},{"id":"0.7","s":"ROOT","t":"C7","sc":"Requests are slow or volume is too high","w":"Optimization only helps when it's aimed at the real bottleneck.","tree":true},{"id":"0.8","s":"ROOT","t":"C8","sc":"The system must keep running despite failures","w":"At scale something is always broken; design so it never becomes an outage.","tree":true},{"id":"0.9","s":"ROOT","t":"C9","sc":"Protecting users, data and availability","w":"Every public system is attacked; layered defenses stop breaches.","tree":true},{"id":"0.10","s":"ROOT","t":"C10","sc":"One database can't hold the data or the traffic","w":"You scale by distributing data, and distributing data makes consistency hard.","tree":true},{"id":"1.1","s":"C1","t":"scalability","sc":"The system must handle growing load","w":"If traffic or data will grow, you need a way to add capacity without hurting speed.","tree":true},{"id":"1.2","s":"scalability","t":"vertical","sc":"Moderate growth, want simplicity","w":"Fastest way to more capacity, with no distributed-system complexity.","tree":true,"c":"Hits a hardware limit, gets expensive, and is still a single point of failure."},{"id":"1.3","s":"scalability","t":"horizontal","sc":"Need big growth or redundancy","w":"Add cheap machines whenever needed; one failing doesn't take you down.","tree":true,"c":"Needs a load balancer, partitioning and handling of distributed-system problems."},{"id":"1.4","s":"horizontal","t":"stateless","sc":"You want to scale out easily","w":"Servers become interchangeable: add, remove or replace them freely.","tree":true,"c":"State must live in a shared store, which itself must scale."},{"id":"1.5","s":"scalability","t":"readwrite","sc":"Deciding how to scale","w":"Reads and writes scale very differently, so identify your load type first.","tree":true},{"id":"1.6","s":"scalability","t":"bottleneck","sc":"Scaling isn't improving things","w":"A system scales only as well as its weakest link; fix that first.","tree":true},{"id":"1.7","s":"C1","t":"reliability","sc":"Results must stay correct despite failures","w":"Failures are normal at scale; reliability stops them causing wrong results or lost data.","tree":true},{"id":"1.8","s":"reliability","t":"fault","sc":"Designing for things going wrong","w":"You can't prevent faults, but you can stop them spreading into outages.","tree":true},{"id":"1.9","s":"reliability","t":"mtbf","sc":"Measuring reliability","w":"Improve by failing less (raise MTBF) or recovering faster (lower MTTR); faster recovery often wins.","tree":true},{"id":"1.10","s":"C1","t":"availability","sc":"Users need it up all the time","w":"Availability targets drive redundancy, failover and multi-zone decisions.","tree":true,"c":"Each extra nine costs roughly 10× more effort."},{"id":"1.11","s":"availability","t":"nines","sc":"Setting an uptime target","w":"Turning 'always up' into a number makes the cost visible.","tree":true},{"id":"1.12","s":"availability","t":"compose","sc":"Estimating uptime of a whole system","w":"Shows the real availability of chained services and the gain from redundant copies.","tree":true},{"id":"1.13","s":"C1","t":"faulttol","sc":"Parts will fail but service must continue","w":"Instead of going down, the system routes around the broken part.","tree":true},{"id":"1.14","s":"faulttol","t":"spof","sc":"Reviewing a design for weak spots","w":"One unbacked component can take everything down.","tree":true},{"id":"1.15","s":"faulttol","t":"nmr","sc":"A wrong result would be catastrophic","w":"Voting hides one bad copy's output.","tree":true,"c":"Costs N times the resources."},{"id":"1.16","s":"faulttol","t":"bft","sc":"Nodes may be malicious","w":"Normal fault tolerance assumes nodes fail honestly; BFT doesn't.","tree":true,"c":"Needs many more nodes and messages."},{"id":"1.17","s":"C1","t":"consistency","sc":"Data is copied across machines","w":"With copies, reads can disagree; a model defines what readers may see.","tree":true},{"id":"1.18","s":"consistency","t":"strong","sc":"Every read must be up to date","w":"Money, locks and unique usernames can't tolerate stale data.","tree":true,"c":"Slower and harder to scale because nodes must coordinate."},{"id":"1.19","s":"consistency","t":"sequential","sc":"Order matters more than instant visibility","w":"Everyone agrees on the order without paying for real-time recency.","tree":true},{"id":"1.20","s":"consistency","t":"causal","sc":"Cause must appear before effect","w":"Comments and chat must stay in logical order.","tree":true,"c":"Unrelated updates can still differ between readers."},{"id":"1.21","s":"consistency","t":"eventual","sc":"A little staleness is acceptable","w":"Best speed and uptime for data that can lag.","tree":true,"c":"Reads may return old data for a while."},{"id":"1.22","s":"consistency","t":"ryw","sc":"Users must see their own changes","w":"Fixes the most annoying staleness bug without full strong consistency.","tree":true},{"id":"1.23","s":"consistency","t":"monotonic","sc":"Users bounce between replicas","w":"Prevents data appearing and then disappearing.","tree":true},{"id":"1.24","s":"consistency","t":"linser","sc":"Discussing transaction guarantees","w":"They promise different things; mixing them up leads to wrong designs.","tree":true},{"id":"1.25","s":"C1","t":"cap","sc":"Data is spread across machines","w":"Networks will split; decide in advance what happens then.","tree":true},{"id":"1.26","s":"cap","t":"cp","sc":"Wrong answers are worse than none","w":"Banking, inventory, locks and config need correct data.","tree":true,"c":"Some users get errors during a partition."},{"id":"1.27","s":"cap","t":"ap","sc":"No answer is worse than a stale one","w":"Feeds, carts and likes should keep working.","tree":true,"c":"Reads may be stale; conflicts are fixed later."},{"id":"1.28","s":"cap","t":"pacelc","sc":"Reasoning about normal-day trade-offs","w":"CAP only covers failures; PACELC covers everyday latency.","tree":true},{"id":"1.29","s":"C1","t":"latthr","sc":"Defining what 'fast' means","w":"They can trade off, so know which one matters.","tree":true},{"id":"1.30","s":"latthr","t":"latency","sc":"Users wait on each request","w":"Interactive features live or die by latency.","tree":true},{"id":"1.31","s":"latthr","t":"throughput","sc":"Volume matters more than single speed","w":"Batch jobs and busy APIs care about total volume.","tree":true},{"id":"1.32","s":"latthr","t":"bandwidth","sc":"Moving large amounts of data","w":"Big transfers are limited by pipe size, not just delay.","tree":true},{"id":"1.33","s":"latthr","t":"percentiles","sc":"Measuring real user experience","w":"Averages hide slow requests, which often hit your most active users.","tree":true},{"id":"1.34","s":"C1","t":"durability","sc":"Saved data must never be lost","w":"Confirmed writes must survive any crash.","tree":true},{"id":"1.35","s":"C1","t":"idempotency","sc":"Requests might be retried","w":"Networks fail and clients retry; without idempotency you get duplicates.","tree":true},{"id":"1.36","s":"C1","t":"concpar","sc":"Handling many tasks","w":"Concurrency hides waiting; parallelism uses more cores.","tree":true},{"id":"1.37","s":"C1","t":"coupling","sc":"Splitting a system into parts","w":"Loosely coupled, cohesive parts can change independently.","tree":true},{"id":"1.38","s":"C1","t":"estimation","sc":"Sizing a system before designing","w":"The numbers show which parts need scaling.","tree":true},{"id":"1.39","s":"C1","t":"maintain","sc":"The system must keep evolving","w":"A system that scales but can't be changed has still failed.","tree":true},{"id":"2.1","s":"C2","t":"osi","sc":"Need vocabulary for network layers","w":"Terms like L4 and L7 load balancing come from it.","tree":true},{"id":"2.2","s":"osi","t":"l3","sc":"Routing between machines","w":"Explains how packets find their destination.","tree":true},{"id":"2.3","s":"osi","t":"l4","sc":"Delivery between programs","w":"This is where reliability vs speed is chosen.","tree":true},{"id":"2.4","s":"osi","t":"l7","sc":"Routing by request content","w":"Smart routing needs to read the request.","tree":true,"c":"Lower layers are faster but 'dumber'."},{"id":"2.5","s":"C2","t":"ip","sc":"Addressing machines and services","w":"Every connection needs an address and a port.","tree":true},{"id":"2.6","s":"ip","t":"ipv6","sc":"Choosing an address scheme","w":"IPv4 addresses ran out.","tree":true},{"id":"2.7","s":"ip","t":"privip","sc":"Exposing vs hiding servers","w":"Internal services shouldn't be reachable from outside.","tree":true},{"id":"2.8","s":"ip","t":"nat","sc":"Many devices, few public IPs","w":"Lets a private network reach the internet through one address.","tree":true},{"id":"2.9","s":"ip","t":"cidr","sc":"Planning subnets or VPCs","w":"Describes address ranges compactly.","tree":true},{"id":"2.10","s":"C2","t":"dns","sc":"Clients need to find your servers","w":"Every request starts by resolving a name.","tree":true},{"id":"2.11","s":"dns","t":"dnsrec","sc":"Configuring a domain","w":"Different needs (IP, alias, email) use different records.","tree":true},{"id":"2.12","s":"dns","t":"ttl","sc":"Controlling how long caches keep data","w":"Decides how fast changes reach users.","tree":true,"c":"Short TTLs add lookup load; long TTLs delay changes."},{"id":"2.13","s":"dns","t":"geodns","sc":"Users on many continents","w":"Can cut round trips from ~150 ms to ~20 ms.","tree":true,"c":"You need servers in several regions."},{"id":"2.14","s":"dns","t":"dnslb","sc":"Simple traffic spreading","w":"Zero extra infrastructure.","tree":true,"c":"Clients cache answers, so control is coarse."},{"id":"2.15","s":"dns","t":"dnsfo","sc":"You have a backup region","w":"Users move to the healthy region automatically.","tree":true,"c":"Cached answers delay failover until the TTL expires."},{"id":"2.16","s":"C2","t":"transport","sc":"Choosing how bytes travel","w":"The choice sets reliability and latency.","tree":true},{"id":"2.17","s":"transport","t":"tcp","sc":"Every byte must arrive, in order","w":"Correctness beats speed for payments, files and APIs.","tree":true,"c":"Handshake overhead and stalls on packet loss."},{"id":"2.18","s":"tcp","t":"handshake","sc":"Understanding connection cost","w":"Explains why reusing connections saves time.","tree":true},{"id":"2.19","s":"tcp","t":"flowctl","sc":"Sender is faster than receiver","w":"Prevents overload and packet loss.","tree":true},{"id":"2.20","s":"tcp","t":"hol","sc":"Diagnosing stalls on lossy networks","w":"Shows why TCP struggles on mobile networks.","tree":true},{"id":"2.21","s":"transport","t":"udp","sc":"Fresh data beats complete data","w":"A late video frame is useless; dropping it beats waiting for it.","tree":true,"c":"Packets may be lost or arrive out of order."},{"id":"2.22","s":"transport","t":"quic","sc":"Lossy or mobile networks","w":"Independent streams don't stall each other.","tree":true},{"id":"2.23","s":"C2","t":"http","sc":"Web pages and APIs","w":"Universal and supported everywhere.","tree":true},{"id":"2.24","s":"http","t":"methods","sc":"Designing API operations","w":"Correct verbs make retries and caching safe.","tree":true},{"id":"2.25","s":"http","t":"status","sc":"Signalling results to clients","w":"Lets clients retry, redirect or show errors correctly.","tree":true},{"id":"2.26","s":"http","t":"http1","sc":"Basic compatibility","w":"Works everywhere.","tree":true,"c":"Slow for pages with many requests."},{"id":"2.27","s":"http","t":"http2","sc":"Many parallel requests","w":"One connection carries everything at once.","tree":true},{"id":"2.28","s":"http","t":"http3","sc":"Mobile and lossy networks","w":"Lost packets don't stall other streams.","tree":true},{"id":"2.29","s":"C2","t":"tls","sc":"Data travels over a network","w":"Stops eavesdropping and tampering.","tree":true,"c":"The handshake adds latency and CPU cost."},{"id":"2.30","s":"tls","t":"certs","sc":"Proving server identity","w":"Prevents impersonation.","tree":true},{"id":"2.31","s":"tls","t":"tlsterm","sc":"Lots of HTTPS traffic","w":"Saves backend CPU and centralizes certificates.","tree":true,"c":"Traffic is plaintext inside unless you re-encrypt."},{"id":"2.32","s":"C2","t":"realtime","sc":"The server must push updates","w":"Plain HTTP only answers when asked.","tree":true},{"id":"2.33","s":"realtime","t":"shortpoll","sc":"Updates are rare; simplicity first","w":"Easy to build and works everywhere.","tree":true,"c":"Wastes requests and adds delay."},{"id":"2.34","s":"realtime","t":"longpoll","sc":"Near-real-time without WebSockets","w":"Fewer empty responses than polling.","tree":true,"c":"Holds many connections open."},{"id":"2.35","s":"realtime","t":"sse","sc":"Server → client updates only","w":"Simpler than WebSockets; reconnects automatically.","tree":true,"c":"One direction only."},{"id":"2.36","s":"realtime","t":"websocket","sc":"Two-way, low-latency messages","w":"No request overhead per message.","tree":true,"c":"Stateful connections are harder to scale."},{"id":"2.37","s":"realtime","t":"webhook","sc":"Notify another system of events","w":"The receiver learns instantly without polling.","tree":true,"c":"Receivers must be idempotent and verify signatures."},{"id":"2.38","s":"C2","t":"apistyles","sc":"Exposing functionality to clients","w":"The style shapes performance and flexibility.","tree":true},{"id":"2.39","s":"apistyles","t":"rest","sc":"Public or simple APIs","w":"Everyone understands it, and HTTP caching works.","tree":true,"c":"Can fetch too much, or need many calls."},{"id":"2.40","s":"apistyles","t":"graphql","sc":"Clients need flexible data shapes","w":"Each client gets exactly its data in one call.","tree":true,"c":"Harder caching and risk of expensive queries."},{"id":"2.41","s":"apistyles","t":"rpc","sc":"Services call each other's functions","w":"It feels like a local call.","tree":true,"c":"Remote calls can be slow or fail, unlike local ones."},{"id":"2.42","s":"rpc","t":"grpc","sc":"Fast internal service calls","w":"Binary and typed: smaller and faster than JSON.","tree":true,"c":"Not human-readable; limited browser support."},{"id":"2.43","s":"rpc","t":"soap","sc":"Integrating legacy enterprise systems","w":"Some partners still require it.","tree":true,"c":"Verbose and complex."},{"id":"2.44","s":"C2","t":"proxy","sc":"Something must sit in the middle","w":"Centralizes control of traffic.","tree":true},{"id":"2.45","s":"proxy","t":"fwdproxy","sc":"Control or hide clients' traffic","w":"The server sees the proxy, not the client.","tree":true},{"id":"2.46","s":"proxy","t":"revproxy","sc":"Protect and front your servers","w":"One public entry point for many backends.","tree":true,"c":"Must be redundant, or it's a single point of failure."},{"id":"2.47","s":"C2","t":"commstyle","sc":"Services must talk","w":"This one choice shapes the architecture.","tree":true},{"id":"2.48","s":"commstyle","t":"sync","sc":"The caller needs the answer now","w":"Easy to reason about.","tree":true,"c":"Failures and slowness spread up the call chain."},{"id":"2.49","s":"commstyle","t":"async","sc":"Work can finish later","w":"Services keep working even when others are slow or down.","tree":true,"c":"More complexity and eventual consistency."},{"id":"2.50","s":"C2","t":"fallacies","sc":"Designing anything over a network","w":"Assuming these leads to fragile systems.","tree":true},{"id":"3.1","s":"C3","t":"datatypes","sc":"Before picking a database","w":"The shape of the data decides the storage type.","tree":true},{"id":"3.2","s":"C3","t":"storagetypes","sc":"Storing raw bytes and files","w":"Each type suits different access patterns.","tree":true},{"id":"3.3","s":"storagetypes","t":"block","sc":"A database or VM needs a fast disk","w":"Lowest-latency random reads and writes.","tree":true,"c":"Attached to one machine."},{"id":"3.4","s":"storagetypes","t":"filestore","sc":"Many servers share files","w":"Familiar file paths with shared access.","tree":true},{"id":"3.5","s":"storagetypes","t":"object","sc":"Images, video and backups at any scale","w":"Scales infinitely and cheaply.","tree":true,"c":"Objects can't be edited in place; higher latency."},{"id":"3.6","s":"C3","t":"database","sc":"Data must be queried and kept","w":"The core of almost every system.","tree":true},{"id":"3.7","s":"database","t":"sql","sc":"Structured data, relationships, transactions","w":"Banking, orders and inventory need correctness and joins.","tree":true,"c":"Rigid schema (migrations hurt) and harder to scale horizontally."},{"id":"3.8","s":"sql","t":"keys","sc":"Linking related tables","w":"Keeps relationships valid.","tree":true},{"id":"3.9","s":"sql","t":"normalization","sc":"Write-heavy, one source of truth","w":"Each change touches one place.","tree":true,"c":"Reads need joins, which get expensive at scale."},{"id":"3.10","s":"normalization","t":"denorm","sc":"Reads dominate and joins are slow","w":"The data is already in the shape reads need.","tree":true,"c":"More storage, and every copy must be updated on writes."},{"id":"3.11","s":"sql","t":"joins","sc":"Queries span related tables","w":"Powerful ad-hoc querying.","tree":true,"c":"Slow at scale and across shards."},{"id":"3.12","s":"sql","t":"acid","sc":"Multi-step changes must be all-or-nothing","w":"Prevents half-done updates and corruption.","tree":true,"c":"Hard to keep across many databases."},{"id":"3.13","s":"acid","t":"isolation","sc":"Concurrent transactions touch the same data","w":"Stronger levels prevent dirty, non-repeatable and phantom reads.","tree":true,"c":"Stronger isolation costs performance."},{"id":"3.14","s":"database","t":"nosql","sc":"Massive scale or flexible schema","w":"Social feeds, IoT and catalogs need scale and flexibility more than joins.","tree":true,"c":"Often eventual consistency, and limited joins."},{"id":"3.15","s":"nosql","t":"kv","sc":"Lookups by a single key","w":"Caching, sessions and counters need raw speed.","tree":true,"c":"You can only query by key."},{"id":"3.16","s":"nosql","t":"docdb","sc":"Flexible or nested data","w":"Catalogs and content vary by item; embedding related data avoids joins.","tree":true,"c":"Weak at joins across documents."},{"id":"3.17","s":"nosql","t":"widecol","sc":"Massive writes, time-series data","w":"Built for write throughput at scale.","tree":true,"c":"Tables must be designed around the queries up front."},{"id":"3.18","s":"nosql","t":"graphdb","sc":"Relationships are the query","w":"'Friends of friends' is trivial here but painful multi-join SQL.","tree":true},{"id":"3.19","s":"nosql","t":"base","sc":"Scale and uptime over instant consistency","w":"Accepts brief inconsistency to stay available.","tree":true,"c":"Data can be stale."},{"id":"3.20","s":"database","t":"newsql","sc":"Need SQL + ACID at huge scale","w":"Combines SQL guarantees with NoSQL-style scaling.","tree":true,"c":"Slower writes (consensus) and higher cost."},{"id":"3.21","s":"database","t":"specialized","sc":"A general DB handles a workload badly","w":"Purpose-built engines are far faster at their job.","tree":true,"c":"One more system to run and sync."},{"id":"3.22","s":"specialized","t":"tsdb","sc":"Metrics, sensors, IoT","w":"Built for append-heavy timestamped data.","tree":true},{"id":"3.23","s":"specialized","t":"searchdb","sc":"Full-text search","w":"SQL LIKE scans every row; a search engine indexes each word.","tree":true,"c":"Keep it as a copy, not the source of truth."},{"id":"3.24","s":"specialized","t":"vectordb","sc":"Search by meaning, recommendations","w":"Finds nearest neighbours fast.","tree":true},{"id":"3.25","s":"specialized","t":"inmemdb","sc":"Microsecond latency needed","w":"RAM is far faster than disk.","tree":true,"c":"RAM is expensive and volatile."},{"id":"3.26","s":"specialized","t":"ledgerdb","sc":"The audit trail must be provable","w":"History can't be silently changed.","tree":true},{"id":"3.27","s":"database","t":"polyglot","sc":"Different features need different stores","w":"The modern default for large systems.","tree":true,"c":"More systems to run and keep in sync."},{"id":"3.28","s":"C3","t":"indexing","sc":"Queries are slow","w":"Turns full scans into fast lookups.","tree":true,"c":"Slows writes and uses extra storage."},{"id":"3.29","s":"indexing","t":"btree","sc":"Equality and range queries","w":"Keeps data sorted, so ranges are cheap.","tree":true},{"id":"3.30","s":"indexing","t":"hashidx","sc":"Exact-match lookups only","w":"The fastest for equality.","tree":true,"c":"Can't do range queries."},{"id":"3.31","s":"indexing","t":"primsec","sc":"Querying by non-key columns","w":"Secondary indexes add fast access paths.","tree":true},{"id":"3.32","s":"indexing","t":"composite","sc":"Queries filter on several columns","w":"One index serves multi-column queries.","tree":true,"c":"Useless if the query skips the first column."},{"id":"3.33","s":"indexing","t":"covering","sc":"A hot query reads few columns","w":"Saves a table lookup per row.","tree":true,"c":"A bigger index."},{"id":"3.34","s":"indexing","t":"lsm","sc":"Write-heavy workloads","w":"Sequential writes beat the B-tree's random updates.","tree":true,"c":"Reads may check several files; compaction uses I/O."},{"id":"3.35","s":"C3","t":"oltp","sc":"Serving live app requests","w":"Optimized for quick single-record access.","tree":true},{"id":"3.36","s":"oltp","t":"olap","sc":"Analytics over millions of rows","w":"Columnar storage scans one column fast and compresses well.","tree":true,"c":"Poor at single-row updates."},{"id":"3.37","s":"olap","t":"dw","sc":"Structured data for BI reports","w":"Clean, fast, governed analytics.","tree":true},{"id":"3.38","s":"olap","t":"lake","sc":"Huge, raw, varied data","w":"The cheapest way to keep everything.","tree":true,"c":"Becomes a 'data swamp' without governance."},{"id":"3.39","s":"olap","t":"lakehouse","sc":"Want lake cost with warehouse features","w":"Avoids running two separate systems.","tree":true},{"id":"3.40","s":"olap","t":"etl","sc":"Moving data into a warehouse","w":"ETL cleans first; ELT keeps raw data for reprocessing.","tree":true},{"id":"3.41","s":"C3","t":"wal","sc":"Data must survive crashes","w":"The log lets the DB recover to a consistent state.","tree":true},{"id":"4.1","s":"C4","t":"locality","sc":"Checking whether caching will help","w":"Caching only pays off when data is reused.","tree":true},{"id":"4.2","s":"locality","t":"memhier","sc":"Understanding speed differences","w":"Shows how much faster each level is.","tree":true},{"id":"4.3","s":"C4","t":"cachelayers","sc":"Deciding where to cache","w":"Closer to the user is faster, but harder to invalidate.","tree":true},{"id":"4.4","s":"cachelayers","t":"browsercache","sc":"Per-user, rarely changing assets","w":"The fastest possible cache.","tree":true,"c":"You can't clear it remotely; version file names."},{"id":"4.5","s":"cachelayers","t":"cdn","sc":"Static content for global users","w":"Beats the speed of light by serving from a nearby edge.","tree":true,"c":"Purging stale content is slow."},{"id":"4.6","s":"cdn","t":"pushcdn","sc":"Small, known content","w":"No first-request delay.","tree":true,"c":"You manage the uploads."},{"id":"4.7","s":"cdn","t":"pullcdn","sc":"Large or changing content","w":"Edges fill themselves on demand.","tree":true,"c":"The first user per region waits for the origin."},{"id":"4.8","s":"cachelayers","t":"dnscache","sc":"The same names are resolved often","w":"Saves a lookup round trip.","tree":true,"c":"Changes propagate slowly."},{"id":"4.9","s":"cachelayers","t":"proxycache","sc":"Same responses for many users","w":"Saves app-server work.","tree":true},{"id":"4.10","s":"cachelayers","t":"appcache","sc":"DB reads are the bottleneck","w":"Hot data is served from memory.","tree":true},{"id":"4.11","s":"appcache","t":"localcache","sc":"Small, hot, rarely changing data","w":"Nanosecond access.","tree":true,"c":"Copies differ across servers and are lost on restart."},{"id":"4.12","s":"appcache","t":"distcache","sc":"Many servers share cached data","w":"Consistent view that survives app restarts and scales on its own.","tree":true,"c":"A network hop per lookup and one more system to run."},{"id":"4.13","s":"distcache","t":"redis","sc":"Need data structures, persistence or replication","w":"The default modern cache.","tree":true},{"id":"4.14","s":"distcache","t":"memcached","sc":"Plain string caching at high throughput","w":"Dead simple and multi-threaded.","tree":true,"c":"No data types, persistence or built-in replication."},{"id":"4.15","s":"appcache","t":"multilevel","sc":"Very hot keys plus large data","w":"Combines the best of local and distributed caches.","tree":true,"c":"L1 invalidation is tricky."},{"id":"4.16","s":"cachelayers","t":"dbcache","sc":"Repeated DB reads","w":"Built in; nothing extra to run.","tree":true},{"id":"4.17","s":"C4","t":"cachepatterns","sc":"Wiring a cache to a database","w":"The pattern decides staleness and data-loss risk.","tree":true},{"id":"4.18","s":"cachepatterns","t":"cacheaside","sc":"Default for read-heavy data","w":"Simple and resilient.","tree":true,"c":"The first request is a miss, and data may go stale."},{"id":"4.19","s":"cachepatterns","t":"readthrough","sc":"Want loading logic out of the app","w":"Centralizes caching logic.","tree":true,"c":"You depend on the cache provider's behaviour."},{"id":"4.20","s":"cachepatterns","t":"writethrough","sc":"Reads right after writes must be fresh","w":"Strong consistency between cache and DB.","tree":true,"c":"Slower writes, and it caches data that may never be read."},{"id":"4.21","s":"cachepatterns","t":"writeback","sc":"Write-heavy, some loss is OK","w":"Fastest writes and far fewer DB writes.","tree":true,"c":"Data is lost if the cache dies before flushing."},{"id":"4.22","s":"cachepatterns","t":"writearound","sc":"Written data is rarely read soon","w":"Avoids filling the cache with junk.","tree":true,"c":"The first read after a write is a miss."},{"id":"4.23","s":"cachepatterns","t":"refreshahead","sc":"Popular keys must never miss","w":"Hides reload latency.","tree":true,"c":"Wasted work when predictions are wrong."},{"id":"4.24","s":"C4","t":"eviction","sc":"Cache memory is full","w":"The right policy means a higher hit ratio.","tree":true},{"id":"4.25","s":"eviction","t":"lru","sc":"Recent items are likely reused","w":"Works well for most access patterns.","tree":true},{"id":"4.26","s":"eviction","t":"lfu","sc":"Popularity is stable","w":"Protects steady favourites from one-off scans.","tree":true,"c":"Slow to adapt to new trends."},{"id":"4.27","s":"eviction","t":"fifo","sc":"Simplicity matters most","w":"Cheap to implement.","tree":true,"c":"Ignores which items are actually used."},{"id":"4.28","s":"eviction","t":"mru","sc":"Recent items won't be reused","w":"Niche but effective for scans.","tree":true},{"id":"4.29","s":"eviction","t":"randomevict","sc":"Need very cheap eviction","w":"No bookkeeping at all.","tree":true},{"id":"4.30","s":"eviction","t":"adaptive","sc":"Maximizing hit ratio","w":"Adapts automatically.","tree":true,"c":"More complex."},{"id":"4.31","s":"C4","t":"invalidation","sc":"Data changes after it's cached","w":"Stale cache is a classic source of bugs.","tree":true},{"id":"4.32","s":"invalidation","t":"ttlexp","sc":"Data has a natural freshness window","w":"Bounds how stale data can get.","tree":true,"c":"Short TTL = more misses; long TTL = more staleness."},{"id":"4.33","s":"invalidation","t":"writeinval","sc":"Staleness after updates isn't OK","w":"The next read reloads fresh data.","tree":true,"c":"The write path must know every affected key."},{"id":"4.34","s":"invalidation","t":"cdcinval","sc":"Many caches depend on one DB","w":"No app code has to track keys.","tree":true,"c":"More infrastructure."},{"id":"4.35","s":"invalidation","t":"keydesign","sc":"Invalidating groups of entries","w":"One version change clears many keys.","tree":true},{"id":"4.36","s":"invalidation","t":"contentaddr","sc":"Static assets that change on deploy","w":"New content means a new key, so cache forever.","tree":true},{"id":"4.37","s":"C4","t":"staleness","sc":"Many cache nodes or layers","w":"A faster cache is a staler one; set the window per data type.","tree":true},{"id":"4.38","s":"C4","t":"cacheprobs","sc":"The cache is under heavy traffic","w":"Caches fail in specific, predictable ways.","tree":true},{"id":"4.39","s":"cacheprobs","t":"stampede","sc":"A hot key expires","w":"Many simultaneous misses can crash the DB.","tree":true},{"id":"4.40","s":"stampede","t":"coalescing","sc":"Many requests miss the same key","w":"One DB call instead of thousands.","tree":true},{"id":"4.41","s":"stampede","t":"swr","sc":"Freshness can lag a moment","w":"Users never wait for the reload.","tree":true},{"id":"4.42","s":"cacheprobs","t":"penetration","sc":"Lookups for missing keys","w":"Every such request reaches the DB.","tree":true},{"id":"4.43","s":"penetration","t":"negcache","sc":"The same missing keys are requested again","w":"A cheap defence against penetration.","tree":true},{"id":"4.44","s":"cacheprobs","t":"avalanche","sc":"Many keys expire together","w":"The DB gets the full load at once.","tree":true},{"id":"4.45","s":"avalanche","t":"jitter","sc":"Many keys share a TTL","w":"Spreads expiry over time.","tree":true},{"id":"4.46","s":"avalanche","t":"warming","sc":"After a restart or deploy","w":"Prevents post-restart avalanches.","tree":true},{"id":"4.47","s":"cacheprobs","t":"hotkey","sc":"One key gets huge traffic","w":"Fix by replicating the key, adding a local L1 cache or splitting it.","tree":true},{"id":"4.48","s":"cacheprobs","t":"bigkey","sc":"A cached value is very large","w":"Large values slow everything on that node.","tree":true},{"id":"4.49","s":"C4","t":"hitratio","sc":"Measuring cache effectiveness","w":"'Add a cache' means nothing without measuring it.","tree":true},{"id":"5.1","s":"C5","t":"lb","sc":"More than one server handles traffic","w":"Clients need one address; the LB fans requests out.","tree":true,"c":"Must itself be redundant."},{"id":"5.2","s":"lb","t":"l4lb","sc":"Raw speed or non-HTTP traffic","w":"Cheap per request, works with any protocol.","tree":true,"c":"Can't route by URL or header."},{"id":"5.3","s":"lb","t":"l7lb","sc":"Route by URL, host or header","w":"Smart routing, auth and rate limits at the edge.","tree":true,"c":"More work per request."},{"id":"5.4","s":"lb","t":"hwlb","sc":"On-premises, extreme throughput","w":"Purpose-built hardware.","tree":true,"c":"Expensive and inflexible."},{"id":"5.5","s":"lb","t":"swlb","sc":"Flexible, cheap balancing","w":"The modern default.","tree":true},{"id":"5.6","s":"lb","t":"cloudlb","sc":"Running in the cloud","w":"Elastic and already redundant.","tree":true},{"id":"5.7","s":"lb","t":"gslb","sc":"You run in several regions","w":"Users reach the closest working region.","tree":true},{"id":"5.8","s":"lb","t":"lbalgo","sc":"Choosing how to distribute","w":"The algorithm decides how evenly load spreads.","tree":true},{"id":"5.9","s":"lbalgo","t":"rr","sc":"Equal servers, similar requests","w":"The simplest fair choice.","tree":true,"c":"Poor when request costs vary."},{"id":"5.10","s":"lbalgo","t":"wrr","sc":"Servers have different capacity","w":"Matches traffic to capacity.","tree":true},{"id":"5.11","s":"lbalgo","t":"iphash","sc":"Same client must hit the same server","w":"Keeps per-server state or cache useful.","tree":true,"c":"Uneven if a few IPs dominate."},{"id":"5.12","s":"lbalgo","t":"p2c","sc":"Large fleets, cheap balancing","w":"Avoids hot servers without tracking everything.","tree":true},{"id":"5.13","s":"lbalgo","t":"leastconn","sc":"Request durations vary (uploads, WebSockets)","w":"Long requests don't pile up on one server.","tree":true},{"id":"5.14","s":"lbalgo","t":"leastresp","sc":"Server speeds vary","w":"Routes around slow servers.","tree":true},{"id":"5.15","s":"lbalgo","t":"resourcelb","sc":"Request cost varies a lot","w":"Uses true server load.","tree":true,"c":"Needs metric reporting."},{"id":"5.16","s":"lb","t":"healthcheck","sc":"Servers can fail","w":"Traffic only goes to healthy servers.","tree":true,"c":"Over-aggressive checks cause flapping."},{"id":"5.17","s":"lb","t":"sticky","sc":"Legacy stateful app","w":"In-memory sessions keep working.","tree":true,"c":"Uneven load and harder failover."},{"id":"5.18","s":"lb","t":"draining","sc":"Removing a server","w":"Users don't see errors during changes.","tree":true},{"id":"5.19","s":"lb","t":"lbha","sc":"The LB must not be a SPOF","w":"One LB failing doesn't stop traffic.","tree":true},{"id":"5.20","s":"C5","t":"ratelimit","sc":"Clients could overload or abuse you","w":"Protects the system and other users.","tree":true},{"id":"5.21","s":"ratelimit","t":"fixedwin","sc":"Simple limits, rough is fine","w":"One cheap counter.","tree":true,"c":"Up to 2× bursts at window edges."},{"id":"5.22","s":"ratelimit","t":"slidelog","sc":"Need exact accuracy","w":"No boundary bursts.","tree":true,"c":"Stores every timestamp."},{"id":"5.23","s":"ratelimit","t":"slidecount","sc":"Accurate and memory-cheap","w":"Smooths the boundary problem.","tree":true},{"id":"5.24","s":"ratelimit","t":"tokenbucket","sc":"Bursts are acceptable","w":"Flexible: bursts up to the bucket size.","tree":true},{"id":"5.25","s":"ratelimit","t":"leakybucket","sc":"The downstream needs a steady flow","w":"No bursts reach the backend.","tree":true,"c":"Bursts are queued or dropped."},{"id":"5.26","s":"ratelimit","t":"distrl","sc":"Many gateway nodes","w":"Each node alone can't see the total.","tree":true,"c":"Adds latency and consistency issues."},{"id":"5.27","s":"C5","t":"throttling","sc":"The backend is near capacity","w":"Degrade gracefully rather than refuse.","tree":true},{"id":"5.28","s":"C5","t":"mq","sc":"Work can be done asynchronously","w":"Spikes fill the queue; consumers drain it at a steady pace.","tree":true,"c":"Adds latency and eventual consistency."},{"id":"5.29","s":"mq","t":"competing","sc":"Split work among workers","w":"Throughput grows with the number of workers.","tree":true},{"id":"5.30","s":"mq","t":"ack","sc":"Messages must not be lost","w":"Unfinished work is retried.","tree":true},{"id":"5.31","s":"mq","t":"delivery","sc":"The network can fail mid-delivery","w":"You have to pick which failure you accept.","tree":true},{"id":"5.32","s":"delivery","t":"amo","sc":"Losing some is acceptable","w":"No retries needed.","tree":true,"c":"Messages can be lost."},{"id":"5.33","s":"delivery","t":"alo","sc":"Nothing may be lost","w":"Retries guarantee delivery.","tree":true,"c":"Duplicates must be handled."},{"id":"5.34","s":"delivery","t":"eo","sc":"Billing and ledgers","w":"Neither loss nor duplicates are acceptable.","tree":true,"c":"Hard and expensive."},{"id":"5.35","s":"mq","t":"dlq","sc":"A message keeps failing","w":"Keeps the queue flowing.","tree":true},{"id":"5.36","s":"mq","t":"fifoq","sc":"Order matters","w":"Some workflows need strict order.","tree":true,"c":"Lower throughput."},{"id":"5.37","s":"mq","t":"visibility","sc":"Workers might crash mid-task","w":"Prevents stuck messages.","tree":true},{"id":"5.38","s":"mq","t":"priorityq","sc":"Some work matters more","w":"Differentiated service under load.","tree":true},{"id":"5.39","s":"C5","t":"pubsub","sc":"One event, many consumers","w":"Add subscribers without changing the publisher.","tree":true},{"id":"5.40","s":"pubsub","t":"topics","sc":"Many services react to one event","w":"Broadcast once instead of calling each service.","tree":true},{"id":"5.41","s":"pubsub","t":"kafka","sc":"High volume, replay or event sourcing","w":"Events are kept, so new consumers can read history.","tree":true,"c":"More to operate."},{"id":"5.42","s":"kafka","t":"consgroup","sc":"Scale event processing","w":"Each consumer handles a subset.","tree":true},{"id":"5.43","s":"C5","t":"asyncproc","sc":"Work doesn't need to block the user","w":"Keeps request latency low.","tree":true},{"id":"5.44","s":"asyncproc","t":"workers","sc":"Slow tasks like emails or resizing","w":"The request returns fast; the work happens later.","tree":true},{"id":"5.45","s":"asyncproc","t":"cron","sc":"Work runs on a schedule","w":"No user trigger needed.","tree":true},{"id":"5.46","s":"asyncproc","t":"fanoutw","sc":"Reads far exceed writes","w":"Reads become a simple lookup.","tree":true,"c":"Expensive writes for celebrities."},{"id":"5.47","s":"asyncproc","t":"fanoutr","sc":"Writers have huge audiences","w":"Avoids pushing to millions of followers.","tree":true,"c":"Slower reads."},{"id":"5.48","s":"C5","t":"backpressure","sc":"Producer is faster than consumer","w":"Degrades gracefully instead of running out of memory.","tree":true},{"id":"5.49","s":"backpressure","t":"boundedq","sc":"A queue could grow forever","w":"Unbounded queues hide overload until memory runs out.","tree":true},{"id":"5.50","s":"C5","t":"autoscale","sc":"Load changes over time","w":"Enough capacity for spikes, less cost at night.","tree":true,"c":"New instances need warm-up time."},{"id":"5.51","s":"autoscale","t":"schedscale","sc":"Predictable peaks","w":"Capacity is ready before the traffic.","tree":true},{"id":"5.52","s":"autoscale","t":"predscale","sc":"Recurring traffic patterns","w":"Scales before you're saturated.","tree":true},{"id":"5.53","s":"autoscale","t":"cooldown","sc":"Scaling keeps oscillating","w":"Stable capacity.","tree":true},{"id":"5.54","s":"C5","t":"shaping","sc":"Different traffic classes compete","w":"Protects key users and interactive traffic.","tree":true},{"id":"5.55","s":"C5","t":"workstealing","sc":"Task sizes are uneven","w":"No worker sits idle while others drown.","tree":true},{"id":"6.1","s":"C6","t":"monolith","sc":"New product, small team, unclear domain","w":"Fast to build, in-process calls, one thing to run.","tree":true,"c":"Hard to scale teams, and one bug can crash everything."},{"id":"6.2","s":"monolith","t":"modmono","sc":"The codebase grows, want boundaries","w":"Many experts' recommended starting point.","tree":true},{"id":"6.3","s":"monolith","t":"strangler","sc":"Migrating a monolith","w":"The old system keeps running while new parts take over.","tree":true},{"id":"6.4","s":"C6","t":"micro","sc":"Large teams, proven scale needs","w":"Scale and deploy only the parts that need it.","tree":true,"c":"Distributed complexity, hard data consistency, ops overhead."},{"id":"6.5","s":"micro","t":"dbps","sc":"Services must evolve independently","w":"The most important microservice rule.","tree":true,"c":"No cross-service joins or transactions."},{"id":"6.6","s":"micro","t":"apigw","sc":"Clients call many services","w":"Centralizes cross-cutting concerns.","tree":true,"c":"Must scale and be redundant."},{"id":"6.7","s":"apigw","t":"bff","sc":"Clients need very different APIs","w":"Small payloads for mobile, rich ones for web.","tree":true,"c":"More backends to maintain."},{"id":"6.8","s":"micro","t":"discovery","sc":"Instances change dynamically","w":"Solves 'which IP do I call?'","tree":true},{"id":"6.9","s":"micro","t":"mesh","sc":"Many services need the same networking","w":"Uniform networking features everywhere.","tree":true,"c":"Adds latency and complexity."},{"id":"6.10","s":"mesh","t":"sidecar","sc":"Add cross-cutting features without code changes","w":"Keeps app code clean.","tree":true},{"id":"6.11","s":"mesh","t":"ambassador","sc":"Outbound calls need resilience","w":"Retries and breakers live outside app code.","tree":true},{"id":"6.12","s":"micro","t":"saga","sc":"A transaction spans services","w":"No blocking 2PC needed.","tree":true,"c":"Only eventually consistent, and compensations must be designed."},{"id":"6.13","s":"saga","t":"orch","sc":"Complex multi-step flows","w":"Easy to see and control the whole process.","tree":true,"c":"The orchestrator is a coupling point."},{"id":"6.14","s":"saga","t":"chor","sc":"Few steps, want decoupling","w":"No central point of control or failure.","tree":true,"c":"The flow is hard to trace."},{"id":"6.15","s":"micro","t":"cqrs","sc":"Read and write needs diverge","w":"Each side can use its best store.","tree":true,"c":"More complexity, and the read side lags."},{"id":"6.16","s":"micro","t":"evsource","sc":"Need full history or audit","w":"Nothing is ever lost.","tree":true,"c":"Querying current state and evolving events is hard."},{"id":"6.17","s":"micro","t":"apicomp","sc":"A query needs data from many services","w":"You can't join across their databases.","tree":true,"c":"More calls and latency."},{"id":"6.18","s":"micro","t":"outbox","sc":"Update the DB and publish an event reliably","w":"Both happen, or neither does.","tree":true},{"id":"6.19","s":"micro","t":"acl","sc":"Integrating legacy or external systems","w":"Protects your clean domain model.","tree":true},{"id":"6.20","s":"micro","t":"ddd","sc":"Drawing service boundaries","w":"Bad boundaries are the #1 way microservices fail.","tree":true},{"id":"6.21","s":"ddd","t":"bctx","sc":"Sizing services","w":"Services should align with bounded contexts.","tree":true},{"id":"6.22","s":"micro","t":"microfe","sc":"Many teams on one large UI","w":"Teams ship UI independently.","tree":true},{"id":"6.23","s":"C6","t":"soa","sc":"Enterprise integration","w":"A central bus handles routing and transformation.","tree":true,"c":"The smart central bus becomes complex."},{"id":"6.24","s":"C6","t":"eda","sc":"Many parts react to the same facts","w":"Add consumers without changing producers.","tree":true,"c":"Hard to trace; eventual consistency; duplicate events."},{"id":"6.25","s":"eda","t":"eventnotif","sc":"Designing event payloads","w":"Choose between small events and fewer callbacks.","tree":true},{"id":"6.26","s":"C6","t":"serverless","sc":"Spiky, event-driven or glue work","w":"Cheap for low or unpredictable traffic.","tree":true,"c":"Cold starts, time limits and vendor lock-in."},{"id":"6.27","s":"serverless","t":"coldstart","sc":"Latency-sensitive serverless","w":"First requests are slow.","tree":true},{"id":"6.28","s":"serverless","t":"baas","sc":"Small team, common features","w":"Ship fast without servers.","tree":true,"c":"Lock-in."},{"id":"6.29","s":"C6","t":"layered","sc":"Organizing code inside a service","w":"Easy to understand and test.","tree":true,"c":"Can become rigid; requests pass through every layer."},{"id":"6.30","s":"C6","t":"hexagonal","sc":"Logic must outlive frameworks","w":"Swap databases or UIs without touching the core.","tree":true},{"id":"6.31","s":"C6","t":"cell","sc":"Limit how many users one failure hurts","w":"Contains outages.","tree":true,"c":"Duplicated infrastructure."},{"id":"6.32","s":"C6","t":"spacebased","sc":"Huge, highly variable load","w":"Removes the central database bottleneck.","tree":true},{"id":"6.33","s":"C6","t":"pipes","sc":"Data-processing pipelines","w":"Each stage does one job.","tree":true},{"id":"6.34","s":"C6","t":"p2p","sc":"No central server wanted","w":"Highly resilient.","tree":true,"c":"Hard to control and secure."},{"id":"6.35","s":"C6","t":"sharednothing","sc":"Scale out without contention","w":"No shared resource to fight over.","tree":true},{"id":"6.36","s":"C6","t":"twelve","sc":"Building cloud services","w":"Proven deployment-friendly practices.","tree":true},{"id":"7.1","s":"C7","t":"utilization","sc":"Planning capacity","w":"Near 100% utilization, wait times grow exponentially.","tree":true},{"id":"7.2","s":"C7","t":"profiling","sc":"Before optimizing anything","w":"Measure first; intuition about bottlenecks is usually wrong.","tree":true},{"id":"7.3","s":"C7","t":"benchmark","sc":"Comparing implementations","w":"Numbers instead of opinions.","tree":true,"c":"Micro-benchmarks can mislead."},{"id":"7.4","s":"C7","t":"loadtest","sc":"Before launches or big events","w":"Finds the 'knee' where latency spikes.","tree":true},{"id":"7.5","s":"C7","t":"perfbudget","sc":"Keeping speed over time","w":"Turns performance into a guardrail.","tree":true},{"id":"7.6","s":"C7","t":"latopt","sc":"Individual requests are slow","w":"Attack where the request's time actually goes.","tree":true},{"id":"7.7","s":"latopt","t":"roundtrips","sc":"Many sequential network calls","w":"Each round trip adds fixed latency.","tree":true},{"id":"7.8","s":"latopt","t":"edgecompute","sc":"Users are far from the origin","w":"Beats the speed-of-light limit.","tree":true},{"id":"7.9","s":"latopt","t":"precompute","sc":"The same expensive result is read often","w":"Trades write-time work for fast reads.","tree":true,"c":"Extra storage and possible staleness."},{"id":"7.10","s":"latopt","t":"prefetch","sc":"The next action is predictable","w":"Data is ready when needed.","tree":true,"c":"Wasted work when the guess is wrong."},{"id":"7.11","s":"C7","t":"thropt","sc":"Volume is the problem","w":"More work done per second.","tree":true},{"id":"7.12","s":"thropt","t":"batching","sc":"Many small operations","w":"Large throughput gains.","tree":true,"c":"Adds a little latency."},{"id":"7.13","s":"thropt","t":"asyncio","sc":"Many concurrent I/O-bound connections","w":"No thread is wasted waiting.","tree":true},{"id":"7.14","s":"thropt","t":"pipelining","sc":"Many sequential requests to one server","w":"Removes waiting between requests.","tree":true},{"id":"7.15","s":"C7","t":"connpool","sc":"Many requests to a DB or service","w":"Connection setup dominates under load.","tree":true,"c":"Too small = queuing; too large = resource exhaustion."},{"id":"7.16","s":"connpool","t":"threadpool","sc":"Many short tasks","w":"Unbounded threads exhaust memory.","tree":true},{"id":"7.17","s":"connpool","t":"objpool","sc":"High allocation rates","w":"Cuts GC pressure.","tree":true},{"id":"7.18","s":"connpool","t":"keepalive","sc":"Repeated calls to the same host","w":"Saves a handshake per request.","tree":true},{"id":"7.19","s":"C7","t":"batchproc","sc":"Results can be hours old","w":"The most efficient way to handle huge volumes.","tree":true,"c":"High latency."},{"id":"7.20","s":"C7","t":"streamproc","sc":"Results needed within seconds","w":"React to events immediately.","tree":true,"c":"Harder: state, late events, exactly-once processing."},{"id":"7.21","s":"streamproc","t":"microbatch","sc":"Near-real-time is good enough","w":"Simpler than pure streaming.","tree":true},{"id":"7.22","s":"streamproc","t":"lambda","sc":"Need both fresh and accurate results","w":"The batch layer corrects what the stream approximates.","tree":true,"c":"The same logic is maintained twice."},{"id":"7.23","s":"streamproc","t":"kappa","sc":"Want one pipeline","w":"Simpler than Lambda.","tree":true},{"id":"7.24","s":"C7","t":"dbperf","sc":"The database is slow","w":"Most slowness lives in the database.","tree":true},{"id":"7.25","s":"dbperf","t":"queryopt","sc":"A specific query is slow","w":"Often a 10× win for free.","tree":true},{"id":"7.26","s":"dbperf","t":"nplus1","sc":"Pages make many tiny queries","w":"1 query instead of N+1.","tree":true},{"id":"7.27","s":"dbperf","t":"lazyeager","sc":"Loading related data","w":"Pick per case to avoid waste.","tree":true},{"id":"7.28","s":"C7","t":"transfer","sc":"Payloads are large","w":"Fewer bytes means faster transfers.","tree":true},{"id":"7.29","s":"transfer","t":"compression","sc":"Large text payloads","w":"Big size reductions.","tree":true,"c":"Costs CPU."},{"id":"7.30","s":"transfer","t":"serialization","sc":"High-volume internal traffic","w":"Binary formats are much smaller.","tree":true,"c":"Not human-readable."},{"id":"7.31","s":"transfer","t":"pagination","sc":"Lists can be huge","w":"Never send millions of rows.","tree":true,"c":"Offset gets slow on deep pages; prefer cursors."},{"id":"7.32","s":"transfer","t":"payloadmin","sc":"Clients need only a few fields","w":"Avoids over-fetching.","tree":true},{"id":"7.33","s":"C7","t":"frontend","sc":"Pages feel slow despite a fast backend","w":"Much of perceived latency is frontend.","tree":true},{"id":"7.34","s":"frontend","t":"assetopt","sc":"Heavy pages","w":"Fewer bytes to download.","tree":true},{"id":"7.35","s":"frontend","t":"codesplit","sc":"Large JavaScript bundles","w":"Less code to download and parse.","tree":true},{"id":"7.36","s":"frontend","t":"cwv","sc":"Measuring user-perceived speed","w":"The standard for web performance.","tree":true},{"id":"7.37","s":"frontend","t":"debounce","sc":"Events fire rapidly","w":"One call instead of dozens.","tree":true},{"id":"7.38","s":"C7","t":"compute","sc":"CPU-bound hot paths","w":"The right algorithm beats micro-tuning.","tree":true},{"id":"7.39","s":"compute","t":"bigo","sc":"Something slows down as data grows","w":"The right algorithm beats any tuning.","tree":true},{"id":"7.40","s":"compute","t":"gc","sc":"GC pauses hurt p99","w":"Pauses directly hit tail latency.","tree":true},{"id":"7.41","s":"compute","t":"zerocopy","sc":"High-throughput I/O","w":"Saves CPU and memory bandwidth.","tree":true},{"id":"7.42","s":"C7","t":"laws","sc":"Planning capacity or parallelism","w":"Know the limits before investing.","tree":true},{"id":"7.43","s":"laws","t":"amdahl","sc":"Adding cores or servers","w":"Shows the ceiling of parallelism.","tree":true},{"id":"7.44","s":"laws","t":"usl","sc":"Scaling out stops helping","w":"Coordination costs grow with node count.","tree":true},{"id":"7.45","s":"laws","t":"littles","sc":"Sizing pools and servers","w":"Ties the three metrics together.","tree":true},{"id":"7.46","s":"laws","t":"queuing","sc":"Deciding how hot to run servers","w":"At 80% busy you're already noticeably slower.","tree":true},{"id":"7.47","s":"C7","t":"costperf","sc":"Deciding when to stop optimizing","w":"Spend where users notice.","tree":true},{"id":"8.1","s":"C8","t":"redundancy","sc":"Any component could fail","w":"A backup takes over.","tree":true,"c":"Costs extra resources."},{"id":"8.2","s":"redundancy","t":"activeactive","sc":"Zero failover time, use all capacity","w":"A failure just means less capacity.","tree":true,"c":"More complex; each node needs headroom."},{"id":"8.3","s":"redundancy","t":"activepassive","sc":"Two writers would conflict","w":"Simple and safe for stateful parts.","tree":true,"c":"Standby capacity sits idle, and failover has a delay."},{"id":"8.4","s":"redundancy","t":"nplus","sc":"Capacity must survive a failure","w":"The spare unit absorbs the loss.","tree":true},{"id":"8.5","s":"redundancy","t":"georedund","sc":"Must survive data-centre or region loss","w":"One disaster can't take everything down.","tree":true,"c":"Cross-region data sync is hard."},{"id":"8.6","s":"redundancy","t":"erasure","sc":"Durable storage at lower cost","w":"Cheaper than three full copies.","tree":true,"c":"Rebuilds cost CPU and I/O."},{"id":"8.7","s":"C8","t":"failover","sc":"The primary fails","w":"Traffic moves to a healthy copy.","tree":true,"c":"Must be tested, or it fails when you need it."},{"id":"8.8","s":"failover","t":"failback","sc":"The primary is healthy again","w":"Back to normal capacity.","tree":true,"c":"Done carelessly, it causes flapping."},{"id":"8.9","s":"C8","t":"resilience","sc":"Dependencies can be slow or fail","w":"One bad dependency shouldn't sink everything.","tree":true},{"id":"8.10","s":"resilience","t":"circuit","sc":"A dependency keeps failing","w":"Gives it time to recover while your threads stay free.","tree":true},{"id":"8.11","s":"resilience","t":"bulkhead","sc":"One dependency could hog resources","w":"Damage stays contained.","tree":true},{"id":"8.12","s":"resilience","t":"timeout","sc":"Calling anything over the network","w":"Never wait forever.","tree":true},{"id":"8.13","s":"resilience","t":"retry","sc":"Failures look transient","w":"Gives the service room to recover.","tree":true,"c":"Unsafe without idempotency, and it can amplify load."},{"id":"8.14","s":"resilience","t":"graceful","sc":"A non-critical part fails","w":"Users still get the core service.","tree":true},{"id":"8.15","s":"resilience","t":"loadshed","sc":"Overloaded despite limits","w":"Protects high-priority traffic.","tree":true,"c":"Some requests are refused."},{"id":"8.16","s":"resilience","t":"fallback","sc":"A call fails","w":"Better than an error.","tree":true},{"id":"8.17","s":"C8","t":"cascade","sc":"Failures spread between components","w":"Most big outages are small failures that cascaded.","tree":true},{"id":"8.18","s":"C8","t":"observability","sc":"Running anything in production","w":"Find and fix problems fast.","tree":true},{"id":"8.19","s":"observability","t":"metrics","sc":"Watching trends and health","w":"Spot problems at a glance.","tree":true},{"id":"8.20","s":"observability","t":"logging","sc":"Need detail on one event","w":"Shows exactly what happened.","tree":true,"c":"Volume and cost grow fast."},{"id":"8.21","s":"observability","t":"tracing","sc":"Requests cross many services","w":"Logs alone can't show the path.","tree":true},{"id":"8.22","s":"observability","t":"golden","sc":"Choosing what to monitor","w":"Covers most of what can go wrong.","tree":true},{"id":"8.23","s":"observability","t":"monvsobs","sc":"Debugging new kinds of problems","w":"Predefined dashboards miss novel failures.","tree":true},{"id":"8.24","s":"C8","t":"alerting","sc":"Problems need a human response","w":"Fast detection shortens outages.","tree":true,"c":"Noisy alerts cause alert fatigue."},{"id":"8.25","s":"alerting","t":"oncall","sc":"24/7 service","w":"Someone always responds, with a plan.","tree":true},{"id":"8.26","s":"C8","t":"slo","sc":"Setting reliability targets","w":"Turns reliability into measurable goals.","tree":true},{"id":"8.27","s":"slo","t":"errbudget","sc":"Balancing features vs stability","w":"Within budget: ship fast. Over budget: fix stability.","tree":true},{"id":"8.28","s":"C8","t":"dr","sc":"Region loss or data corruption is possible","w":"Backups and standby sites bring you back.","tree":true},{"id":"8.29","s":"dr","t":"rporto","sc":"Choosing a DR strategy","w":"These two numbers set the cost.","tree":true},{"id":"8.30","s":"dr","t":"backups","sc":"Data could be lost or corrupted","w":"Replication copies mistakes; backups don't.","tree":true,"c":"Untested backups often fail."},{"id":"8.31","s":"backups","t":"pitr","sc":"Need to restore to an exact moment","w":"Recover to just before the error.","tree":true},{"id":"8.32","s":"dr","t":"drstrat","sc":"Matching DR to your RTO","w":"A lower RTO costs more.","tree":true},{"id":"8.33","s":"C8","t":"deploy","sc":"Shipping changes to production","w":"Bad releases are caught and rolled back fast.","tree":true},{"id":"8.34","s":"deploy","t":"bluegreen","sc":"Need instant rollback","w":"Flip traffic back in seconds.","tree":true,"c":"Needs double infrastructure briefly."},{"id":"8.35","s":"deploy","t":"canary","sc":"Risky change","w":"Problems hit only a few users.","tree":true},{"id":"8.36","s":"deploy","t":"rolling","sc":"Routine releases","w":"Simple and cheap.","tree":true,"c":"Slower rollback; mixed versions run briefly."},{"id":"8.37","s":"deploy","t":"flags","sc":"Decouple release from deploy","w":"Turn off a bad feature without redeploying.","tree":true,"c":"Old flags pile up."},{"id":"8.38","s":"deploy","t":"cicd","sc":"Every change","w":"Automation removes manual mistakes.","tree":true},{"id":"8.39","s":"deploy","t":"expandcontract","sc":"Changing a database schema","w":"Old and new code both keep working.","tree":true},{"id":"8.40","s":"C8","t":"ops","sc":"Running systems long-term","w":"Good process keeps reliability from decaying.","tree":true},{"id":"8.41","s":"ops","t":"incident","sc":"An outage happens","w":"Clear roles stop chaos.","tree":true},{"id":"8.42","s":"ops","t":"postmortem","sc":"After an incident","w":"Blame hides the truth; blamelessness surfaces it.","tree":true},{"id":"8.43","s":"ops","t":"iac","sc":"Infrastructure must be rebuildable","w":"No hand-built 'snowflake' servers.","tree":true},{"id":"8.44","s":"ops","t":"immutable","sc":"Servers drift over time","w":"Every server is identical.","tree":true},{"id":"8.45","s":"ops","t":"capacity","sc":"Growth is expected","w":"Avoid running out of capacity.","tree":true},{"id":"8.46","s":"C8","t":"chaos","sc":"Proving resilience","w":"Untested failover usually fails.","tree":true,"c":"Needs care in production."},{"id":"8.47","s":"C8","t":"sre","sc":"Scaling operations","w":"Manual operations don't scale.","tree":true},{"id":"8.48","s":"C8","t":"selfheal","sc":"Recovery must be fast","w":"Machines react faster than people.","tree":true},{"id":"8.49","s":"C8","t":"integrity","sc":"Data could silently corrupt","w":"Catches bit rot.","tree":true},{"id":"9.1","s":"C9","t":"cia","sc":"Framing security goals","w":"Every mechanism serves one of these three.","tree":true},{"id":"9.2","s":"C9","t":"authn","sc":"Users or services must log in","w":"Identity comes before everything else.","tree":true},{"id":"9.3","s":"authn","t":"pwhash","sc":"Storing passwords","w":"Slow hashes resist cracking.","tree":true},{"id":"9.4","s":"pwhash","t":"salt","sc":"Hashing passwords","w":"Makes every hash unique.","tree":true},{"id":"9.5","s":"authn","t":"mfa","sc":"Accounts need strong protection","w":"Dramatically raises security.","tree":true},{"id":"9.6","s":"authn","t":"session","sc":"Traditional web app, easy revocation","w":"The server can kill sessions anytime.","tree":true,"c":"Needs shared session storage at scale."},{"id":"9.7","s":"authn","t":"jwt","sc":"Stateless APIs, many services","w":"Any service can verify it without a lookup.","tree":true,"c":"Hard to revoke before it expires."},{"id":"9.8","s":"authn","t":"passkey","sc":"Want phishing-resistant login","w":"There's no password to steal or phish.","tree":true},{"id":"9.9","s":"C9","t":"authz","sc":"Different users have different rights","w":"Stops users seeing others' data.","tree":true},{"id":"9.10","s":"authz","t":"rbac","sc":"Permissions match job roles","w":"Easy to understand and audit.","tree":true,"c":"Special cases cause role explosion."},{"id":"9.11","s":"authz","t":"abac","sc":"Rules depend on context","w":"Very flexible.","tree":true,"c":"Complex to manage."},{"id":"9.12","s":"authz","t":"aclsec","sc":"Per-resource permissions","w":"Exact control per object.","tree":true,"c":"Hard to manage at scale."},{"id":"9.13","s":"authz","t":"rebac","sc":"Access follows sharing or ownership","w":"Natural for collaborative apps.","tree":true},{"id":"9.14","s":"authz","t":"pbac","sc":"Many services need the same rules","w":"One place for policy.","tree":true},{"id":"9.15","s":"C9","t":"oauth","sc":"Third-party access to user data","w":"No password sharing.","tree":true},{"id":"9.16","s":"oauth","t":"oidc","sc":"Need user identity from a provider","w":"The standard way to log users in.","tree":true},{"id":"9.17","s":"oauth","t":"sso","sc":"Many internal apps","w":"One login everywhere.","tree":true},{"id":"9.18","s":"oauth","t":"apikeys","sc":"Identify calling apps","w":"Easy for developers.","tree":true,"c":"Weak for user authentication."},{"id":"9.19","s":"C9","t":"encryption","sc":"Data must stay private","w":"Stolen data is useless without the keys.","tree":true},{"id":"9.20","s":"encryption","t":"symmetric","sc":"Encrypting large amounts of data","w":"Very fast.","tree":true,"c":"Sharing the key securely is hard."},{"id":"9.21","s":"encryption","t":"asymmetric","sc":"Exchanging keys, signing","w":"No shared secret needed.","tree":true,"c":"Slower, so usually used to exchange a symmetric key."},{"id":"9.22","s":"encryption","t":"transit","sc":"Data crosses a network","w":"Networks can be tapped.","tree":true},{"id":"9.23","s":"encryption","t":"atrest","sc":"Storing sensitive data","w":"Protects against stolen storage.","tree":true},{"id":"9.24","s":"encryption","t":"inuse","sc":"Highly sensitive processing","w":"Covers the last state of data.","tree":true,"c":"Emerging and costly."},{"id":"9.25","s":"encryption","t":"hashing","sc":"Verify data without storing it","w":"Detects changes and protects passwords.","tree":true},{"id":"9.26","s":"encryption","t":"signature","sc":"Proving authenticity","w":"Tampering becomes detectable.","tree":true},{"id":"9.27","s":"encryption","t":"kms","sc":"Using encryption keys","w":"Never hardcode keys.","tree":true},{"id":"9.28","s":"encryption","t":"pki","sc":"Verifying identities at scale","w":"Lets you trust strangers' keys safely.","tree":true},{"id":"9.29","s":"C9","t":"transportsec","sc":"Hardening network traffic","w":"Closes gaps that TLS alone leaves.","tree":true},{"id":"9.30","s":"transportsec","t":"mtls","sc":"Service-to-service authentication","w":"Zero-trust identity for services.","tree":true},{"id":"9.31","s":"transportsec","t":"hsts","sc":"Web apps served over HTTPS","w":"No accidental plain HTTP.","tree":true},{"id":"9.32","s":"transportsec","t":"pinning","sc":"Mobile apps with sensitive data","w":"Stops forged certificates.","tree":true,"c":"Certificate rotation needs app updates."},{"id":"9.33","s":"C9","t":"attacks","sc":"Building any web app or API","w":"Most breaches use these.","tree":true},{"id":"9.34","s":"attacks","t":"sqli","sc":"Building queries from user input","w":"Never concatenate input into queries.","tree":true},{"id":"9.35","s":"attacks","t":"xss","sc":"Displaying user content","w":"Untrusted content can run code.","tree":true},{"id":"9.36","s":"attacks","t":"csrf","sc":"Cookie-based sessions","w":"Browsers send cookies automatically.","tree":true},{"id":"9.37","s":"attacks","t":"brokenac","sc":"Resources have IDs in URLs","w":"Never trust the client.","tree":true},{"id":"9.38","s":"attacks","t":"hijack","sc":"Sessions or tokens are used","w":"A stolen session is a stolen account.","tree":true},{"id":"9.39","s":"attacks","t":"ssrf","sc":"The server fetches user-supplied URLs","w":"The server has internal access an attacker doesn't.","tree":true},{"id":"9.40","s":"attacks","t":"replay","sc":"Signed requests or tokens","w":"A valid message can be reused.","tree":true},{"id":"9.41","s":"attacks","t":"timing","sc":"Comparing secrets or tokens","w":"Time leaks information.","tree":true},{"id":"9.42","s":"attacks","t":"phishing","sc":"Humans hold credentials","w":"People are the weakest link.","tree":true},{"id":"9.43","s":"attacks","t":"misconfig","sc":"Deploying anything","w":"Easy mistakes cause big damage.","tree":true},{"id":"9.44","s":"C9","t":"netsec","sc":"Exposing services on a network","w":"The first lines of defense.","tree":true},{"id":"9.45","s":"netsec","t":"firewall","sc":"Restricting network access","w":"Only the needed ports are open.","tree":true},{"id":"9.46","s":"netsec","t":"waf","sc":"Public web apps and APIs","w":"Inspects HTTP for attack patterns.","tree":true},{"id":"9.47","s":"netsec","t":"segmentation","sc":"Multi-tier systems","w":"Limits the blast radius.","tree":true},{"id":"9.48","s":"netsec","t":"vpn","sc":"Remote access to internal systems","w":"Traffic is encrypted end to end.","tree":true},{"id":"9.49","s":"netsec","t":"idsips","sc":"Watching for intrusions","w":"Spots what firewalls miss ","t":"idempotency","sc":"POST retries must be safe","w":"Idempotency keys stop duplicate orders and payments.","tree":false},{"id":"2.54","s":"geodns","t":"gslb","sc":"Global routing before the load balancer","w":"GSLB picks the healthy region for each user.","tree":false},{"id":"2.55","s":"tls","t":"mtls","sc":"Services must verify each other","w":"Mutual TLS gives both sides a certificate.","tree":false},{"id":"2.56","s":"websocket","t":"pubsub","sc":"Users on different servers must talk","w":"Pub/sub routes messages to the server holding the recipient's connection.","tree":false},{"id":"2.57","s":"apistyles","t":"apigw","sc":"Many services behind one entry point","w":"The gateway routes, authenticates and rate-limits for all of them.","tree":false},{"id":"2.58","s":"hol","t":"http3","sc":"Fix head-of-line blocking","w":"HTTP/3 over QUIC keeps streams independent.","tree":false},{"id":"3.42","s":"datatypes","t":"sql","sc":"Structured data","w":"Fixed rows and columns fit relational tables.","tree":false},{"id":"3.43","s":"datatypes","t":"docdb","sc":"Semi-structured data","w":"JSON-like data with varying fields fits documents.","tree":false},{"id":"3.44","s":"datatypes","t":"object","sc":"Unstructured data","w":"Images, video and logs belong in object storage.","tree":false},{"id":"3.45","s":"database","t":"replication","sc":"Need copies for reads or safety","w":"Replicas spread reads and survive node loss.","tree":false},{"id":"3.46","s":"database","t":"sharding","sc":"Data too big for one machine","w":"Sharding splits rows across machines.","tree":false},{"id":"3.47","s":"acid","t":"saga","sc":"The transaction spans services","w":"Sagas keep correctness without a distributed lock.","tree":false},{"id":"3.48","s":"acid","t":"twopc","sc":"The transaction spans databases","w":"2PC makes several databases commit together.","tree":false},{"id":"3.49","s":"lsm","t":"bloom","sc":"Skip disk reads for missing keys","w":"A Bloom filter says 'definitely not here' instantl
